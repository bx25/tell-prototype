enza indirizzo), forma di proprietà, data di acquisto, servitù, oneri fondiari e menzioni. Dal 1° settembre 2025 le informazioni sulla proprietà si ottengono solo qui."],["Estratto pubblico","Contiene solo i dati pubblici. CHF 20 per fondo; ogni estratto supplementare per gli stessi proprietari, ordinato insieme, CHF 10."],["Estratto completo","CHF 20 per fondo. Ne hanno diritto proprietari, titolari di servitù e creditori pignoratizi. Gli altri devono dimostrare un interesse (ad es. con una procura), da caricare al momento dell’ordine."],["Altri emolumenti","Copia di documenti giustificativi: CHF 20 fino a 10 pagine, poi CHF 1 per pagina, al massimo CHF 100. Estratto del registro dei proprietari: CHF 20."]],"steps":["Verificare se bastano i dati pubblici di GRUDIS public; è gratuito.","Altrimenti scegliere il tipo: estratto pubblico o completo.","Compilare il modulo d’ordine online e, se non si ha diritto di per sé, caricare una prova dell’interesse."],"who":[1,1,0],"note":"Il registro fondiario è disciplinato dal Codice civile (diritto federale). Nel Cantone di Berna lo tengono gli uffici cantonali del registro fondiario, che fissano anche gli emolumenti.","src":["Cantone di Berna: ordinazioni al registro fondiario","Cantone di Berna: GRUDIS public","Cantone di Berna: FAQ registro fondiario","Cantone di Berna: informazioni sulla proprietà"]},"zst":{"intro":"Nel Cantone di Berna i documenti di stato civile si ordinano online sul sito dell’ufficio dello stato civile competente o direttamente allo sportello. Il Cantone ha sette uffici dello stato civile.","facts":[["Competenza","Per gli Svizzeri l’ufficio dello stato civile del luogo d’origine, per gli stranieri quello del luogo di domicilio."],["Certificato individuale di stato civile","Dati personali attuali, stato civile, nome e (per gli Svizzeri) luoghi d’origine. CHF 30 più spese postali. Può ordinarlo la persona interessata."],["Altri documenti","Atto d’origine CHF 30. Atto di nascita CHF 30. Certificato di famiglia CHF 40; dopo un nuovo evento di stato civile viene aggiornato gratuitamente. Certificato dello stato di famiglia registrato CHF 40 più CHF 10 per persona iscritta. Sempre più spese postali."],["Invio a terzi","Con una procura l’ufficio invia il documento a un’altra persona, su richiesta insieme alla fattura."]],"steps":["Chiarire quale documento è richiesto (ad es. certificato individuale o certificato di famiglia).","Determinare l’ufficio competente: luogo d’origine per gli Svizzeri, domicilio per gli stranieri.","Ordinare il documento online o allo sportello; per l’invio a terzi allegare una procura."],"who":[1,1,0],"note":"Il registro dello stato civile (Infostar) e i documenti sono disciplinati dalla Confederazione. Gli uffici del Cantone di Berna li rilasciano.","src":["Cantone di Berna: ordinare documenti online","Cantone di Berna: certificato individuale di stato civile","Cantone di Berna: stato di famiglia registrato","Cantone di Berna: certificato di famiglia","Cantone di Berna: atto d’origine","ch.ch: documenti di stato civile"]},"rv":{"intro":"Se ha ricevuto un precetto esecutivo e non deve l’importo, fa opposizione: oralmente o per scritto alla notifica o entro 10 giorni presso l’ufficio d’esecuzione. È gratuito.","facts":[["Termine","Alla notifica del precetto esecutivo o entro 10 giorni, presso l’ufficio d’esecuzione."],["Forma e costi","Oralmente o per scritto. L’opposizione stessa è gratuita."],["Effetto","L’esecuzione si ferma. Se il creditore vuole proseguire deve rivolgersi al tribunale, che decide se l’esecuzione può continuare."],["Non mostrare più l’iscrizione","Al più presto 3 mesi dopo la notifica del precetto esecutivo può chiedere all’ufficio d’esecuzione che l’esecuzione non sia più comunicata a terzi. Se il creditore non prova entro 20 giorni di aver avviato una procedura, non viene più comunicata. Emolumento: CHF 40. Dal 1° gennaio 2026 è possibile durante tutti i 5 anni in cui i terzi hanno accesso."]],"steps":["Verificare il precetto esecutivo: deve l’importo?","Se no: fare opposizione entro 10 giorni presso l’ufficio d’esecuzione, oralmente o per scritto.","Dopo almeno 3 mesi presentare all’ufficio la domanda di non comunicazione (CHF 40)."],"who":[1,0,0],"note":"La procedura è disciplinata dalla legge federale sulla esecuzione e sul fallimento (LEF). È competente l’ufficio d’esecuzione che ha emesso il precetto; nel Cantone di Berna sono gli uffici d’esecuzione regionali.","src":["ch.ch: precetto esecutivo, opposizione","Ufficio federale di giustizia: più protezione da esecuzioni ingiustificate","Ufficio federale di giustizia: modulo di non comunicazione","Cantone di Berna: esecuzione e fallimento"]},"mof":{"intro":"Nel Cantone di Berna un ciclomotore o un e-bike veloce (assistenza fino a 45 km/h) si immatricola presso l’Ufficio della circolazione stradale. Servono la licenza di circolazione originale, una targa e una vignetta.","facts":[["Chi deve","Gli e-bike con assistenza fino a 25 km/h e al massimo 500 watt non hanno bisogno di targa. Con assistenza fino a 45 km/h l’e-bike è un ciclomotore e deve avere una targa gialla."],["Documenti","Licenza di circolazione originale e modulo «Mofa / E-Bike» compilato per intero."],["Costi","Targa CHF 10. Vignetta con assicurazione RC collettiva CHF 32 l’anno (vignetta CHF 20, assicurazione CHF 12). Nuova licenza di circolazione per cambio di detentore CHF 30."],["Rinnovare la vignetta","Valida fino al 31 maggio. La fattura arriva automaticamente a febbraio; dopo il pagamento la nuova vignetta è spedita per posta."]],"steps":["Verificare se il veicolo ha bisogno di una targa (ciclomotore o e-bike fino a 45 km/h).","Compilare il modulo «Mofa / E-Bike» e consegnarlo con la licenza di circolazione originale all’Ufficio della circolazione stradale, per posta o allo sportello.","Applicare targa e vignetta; ogni anno a febbraio pagare la fattura per la nuova vignetta."],"who":[1,1,0],"note":"La Confederazione stabilisce quali veicoli devono avere una targa. Immatricolazione e vignette spettano all’Ufficio della circolazione stradale e della navigazione del Cantone di Berna.","src":["Cantone di Berna: immatricolare un ciclomotore / e-bike","Cantone di Berna: rinnovare la vignetta","Cantone di Berna: informazioni su e-bike e ciclomotori","Cantone di Berna: rinnovo delle vignette 2026"]},"waf":{"intro":"Per acquistare la maggior parte delle armi da fuoco serve un permesso d’acquisto di armi. Nel Cantone di Berna la domanda si presenta online tramite Suisse ePolice o con un modulo alla polizia cantonale. L’emolumento è di CHF 50.","facts":[["Requisiti","Avere almeno 18 anni. Nessuna iscrizione nel casellario giudiziale per un atto che denoti una mentalità violenta o pericolosa, né per crimini o delitti ripetuti. Non essere sotto curatela generale né rappresentati da un mandatario precauzionale."],["Domanda","All’ufficio delle armi del Cantone di domicilio. Nel Cantone di Berna online tramite Suisse ePolice o con il modulo alla Polizia cantonale bernese, settore WSG, casella postale, 3001 Berna. Allegato tra l’altro: copia del passaporto o della carta d’identità valida."],["Costo","CHF 50."],["Portata","Con un permesso d’acquisto si possono acquistare al massimo 3 armi dallo stesso alienante."]],"steps":["Verificare se l’arma è soggetta ad autorizzazione e se si soddisfano i requisiti.","Presentare la domanda online tramite Suisse ePolice o con il modulo alla Polizia cantonale bernese, con gli allegati richiesti.","Acquistare l’arma con il permesso d’acquisto."],"who":[1,1,0],"note":"Il diritto sulle armi è diritto federale (fedpol). Le autorizzazioni le rilascia l’ufficio cantonale delle armi, nel Cantone di Berna la polizia cantonale.","src":["Polizia cantonale bernese: armi","fedpol: domande frequenti sul diritto in materia di armi","ch.ch: acquistare armi","fedpol: rapporto esplicativo sull’ordinanza sulle armi"]},"sti":{"intro":"Nel Cantone di Berna la borsa di studio si chiede online tramite StipBE-Online alla Sezione dei sussidi di formazione. La domanda deve arrivare completa con i giustificativi entro il termine; non si concedono sussidi retroattivi.","facts":[["Chi può","Chi segue una prima formazione e ha i genitori domiciliati nel Cantone di Berna. Stranieri con permesso di domicilio C bernese o con 5 anni di domicilio in Svizzera e permesso di dimora B."],["Termine","30 giugno per gli anni di formazione che iniziano tra il 1° gennaio e il 30 giugno; 31 dicembre per quelli che iniziano tra il 1° luglio e il 31 dicembre."],["Inoltro","Compilare la domanda in StipBE-Online (con BE-Login). Poi stampare domanda, lista dei giustificativi e ricevuta di sblocco firmata e spedirli per posta con i giustificativi. Solo allora la domanda è considerata inoltrata."],["Contatto","Sezione dei sussidi di formazione: 031 633 83 40, aab@be.ch."]],"steps":["Registrarsi a BE-Login e compilare in StipBE-Online la domanda per l’anno di formazione.","Stampare domanda, lista dei giustificativi e ricevuta di sblocco, firmare la ricevuta.","Spedire tutto con i giustificativi per posta alla Sezione dei sussidi di formazione entro il termine."],"who":[0,1,0],"note":"Borse e prestiti di studio sono di competenza dei Cantoni. Nel Cantone di Berna è competente la Sezione dei sussidi di formazione della Direzione dell’istruzione e della cultura.","src":["Cantone di Berna: borse di studio","Cantone di Berna: domande e risposte su StipBE-Online","Cantone di Berna: sussidi di formazione","Cantone di Berna: prestiti"]},"miet":{"intro":"Se il tasso di riferimento ipotecario scende sotto quello su cui si basa la sua pigione, può chiedere una riduzione al locatore. Attualmente è dell’1,25 % (dal 2 settembre 2025, confermato il 2 settembre 2026).","facts":[["Quale tasso vale","Di solito è indicato nel contratto. Se da allora la pigione è stata adeguata al tasso di riferimento senza contestazione, vale il tasso di quell’adeguamento."],["Quanto","Per ogni calo di 0,25 punti percentuali si ha di regola diritto al 2,91 % di pigione in meno, ad es. dall’1,5 % all’1,25 %. Si adegua solo la pigione netta; altri fattori di costo possono essere compensati."],["Da quando","Al più presto alla prossima scadenza di disdetta possibile."],["Termini","Il locatore deve rispondere entro 30 giorni. Se rifiuta o non risponde, può rivolgersi all’autorità di conciliazione entro altri 30 giorni, quindi al più tardi 60 giorni dopo la domanda."]],"steps":["Verificare nel contratto su quale tasso di riferimento si basa la pigione.","Chiedere la riduzione per scritto al locatore, preferibilmente per raccomandata.","Senza risposta o in caso di rifiuto, rivolgersi all’autorità di conciliazione entro 60 giorni dalla domanda."],"who":[1,0,0],"note":"Il diritto di locazione è diritto federale (Codice delle obbligazioni). L’Ufficio federale delle abitazioni (UFAB) pubblica il tasso di riferimento ogni trimestre.","src":["ch.ch: pigione e tasso di riferimento","UFAB: tasso di riferimento ipotecario","UFAB: il tasso di riferimento resta all’1,25 %","UFAB: il tasso di riferimento scende all’1,25 %"]},"qst":{"intro":"Chi è tassato alla fonte e domiciliato in Svizzera può chiedere nel Cantone di Berna una tassazione ordinaria ulteriore (TOU), ad esempio per far valere deduzioni. La domanda va presentata entro il 31 marzo dell’anno successivo.","facts":[["Chi paga l’imposta alla fonte","I lavoratori stranieri domiciliati in Svizzera senza permesso di domicilio C. Il datore di lavoro trattiene l’imposta ogni mese dal salario e la versa all’Amministrazione cantonale delle imposte."],["TOU facoltativa","Con il modulo «Domanda di tassazione ordinaria ulteriore (TOU) per residenti», entro il 31 marzo dell’anno successivo. Una domanda valida non può essere ritirata; in seguito la tassazione ordinaria avviene ogni anno fino alla fine dell’imposizione alla fonte. L’imposta trattenuta è computata senza interessi."],["TOU obbligatoria","Se lei (o il coniuge) ha nell’anno almeno CHF 120 000 di reddito lordo tassato alla fonte, almeno CHF 150 000 di sostanza imponibile a fine anno o almeno CHF 3 000 di altri redditi (ad es. da attività indipendente)."],["Chiedere la dichiarazione","Con TOU obbligatoria, chieda la dichiarazione d’imposta all’Amministrazione cantonale delle imposte entro il 31 marzo dell’anno successivo."]],"steps":["Verificare se la TOU è obbligatoria per lei (reddito, sostanza, altri redditi).","Altrimenti decidere se vuole una TOU facoltativa; in seguito vale ogni anno.","Inviare il modulo o la richiesta della dichiarazione all’Amministrazione delle imposte del Cantone di Berna entro il 31 marzo dell’anno successivo."],"who":[1,1,0],"note":"Le regole di base dell’imposta alla fonte sono di diritto federale. La riscuote e tassa l’Amministrazione delle imposte del Cantone di Berna.","src":["Cantone di Berna: TOU su domanda","Cantone di Berna: TOU obbligatoria","Cantone di Berna: persone tassate alla fonte","Cantone di Berna: modulo di domanda TOU","ch.ch: imposta alla fonte"]},"erb":{"intro":"Per versare denaro o saldare i conti di una persona deceduta, le banche chiedono di solito un certificato ereditario. Nel Cantone di Berna lo rilasciano i notai, oppure il Comune se ha aperto un testamento.","facts":[["Consegnare il testamento","Testamenti e contratti successori del defunto vanno consegnati subito al suo Comune di domicilio. Il Comune apre il testamento entro un mese dal ricevimento."],["Certificato del Comune","Su domanda di un erede istituito, se entro 30 giorni non è giunta alcuna opposizione al testamento aperto."],["Certificato del notaio","Emolumento secondo il tempo impiegato, almeno CHF 200."],["Rinunciare all’eredità","Termine di 3 mesi: dal decesso se si eredita per legge; dalla comunicazione ufficiale se si è istituiti in un testamento o contratto successorio. Competente è la prefettura."]],"steps":["Consegnare subito testamento o contratto successorio al Comune di domicilio del defunto.","Chiedere il certificato ereditario al Comune (dopo l’apertura del testamento) o a un notaio.","Se non si vuole l’eredità: rinunciarvi presso la prefettura entro 3 mesi."],"who":[1,1,1],"note":"Il diritto successorio è diritto federale (Codice civile). Nel Cantone di Berna i Comuni aprono i testamenti, i notai rilasciano i certificati ereditari e le dieci prefetture si occupano di rinunce e inventari.","src":["Cantone di Berna: testamento, contratto successorio, certificato ereditario","Cantone di Berna: lista di controllo per gli eredi","Cantone di Berna: rinuncia all’eredità","Cantone di Berna: ordinanza sugli emolumenti notarili","Cantone di Berna: trovare la prefettura competente"]},"upk":{"intro":"Per un trasloco nel centro città o se si vuole sostare in un divieto di parcheggio, nella città di Berna serve un’autorizzazione di accesso e parcheggio. È gratuita e va chiesta almeno 8 giorni lavorativi prima.","facts":[["Requisiti","Almeno uno dei due indirizzi è nella città di Berna. Se traslocano privati, l’autorizzazione vale al massimo un giorno, dalle 7 alle 20, esclusi domeniche e festivi."],["Domanda","Modulo online o domanda in PDF, almeno 8 giorni lavorativi prima del trasloco. Gratuita."],["Segnalare il divieto","Tramite una ditta di traslochi che posa e ritira i segnali, oppure ordinandoli alla segnaletica della Polizia cantonale (031 638 67 00, signalisationen-bern@police.be.ch), anche qui almeno 8 giorni lavorativi prima."],["Contatto","Polizia locale e del commercio della città di Berna: 031 321 52 17."]],"steps":["Almeno 8 giorni lavorativi prima, chiedere online l’autorizzazione di accesso e parcheggio.","Ordinare i segnali di divieto presso una ditta di traslochi o la Polizia cantonale.","Il giorno del trasloco tenere l’autorizzazione nel veicolo."],"who":[0,1,1],"note":"L’autorizzazione la rilascia la polizia locale e del commercio della città di Berna; i segnali li fornisce la Polizia cantonale bernese.","src":["Città di Berna: autorizzazione e divieto di parcheggio per traslochi","Città di Berna: domanda online","Città di Berna: consigli per il trasloco"]},"ahl":{"intro":"Gli anni di contribuzione AVS mancanti riducono la rendita. Le lacune degli ultimi cinque anni si possono colmare pagando; quelle più vecchie no. Un estratto gratuito del suo conto individuale (CI) mostra se ci sono lacune.","facts":[["Effetto","La rendita completa richiede 44 anni di contribuzione. Ogni anno mancante riduce di regola la rendita di almeno 1/44, cioè circa il 2,3 %."],["Recuperare","Solo per le lacune degli ultimi cinque anni. Le lacune più vecchie non si possono più colmare."],["Anni giovanili","I periodi di contribuzione tra i 18 e i 20 anni possono colmare lacune sorte più tardi."],["Estratto conto","In qualsiasi momento e senza motivazione presso una cassa di compensazione che tiene un conto per lei; online su ahv-iv.ch. Per scritto e gratuito. Chi non esercita un’attività lucrativa paga nel 2026 almeno CHF 530 l’anno per evitare lacune."]],"steps":["Ordinare online un estratto del conto individuale.","Verificare se negli ultimi cinque anni mancano anni di contribuzione.","Pagare i contributi mancanti alla cassa di compensazione competente."],"who":[1,0,0],"note":"L’AVS è un’assicurazione federale (UFAS). Contributi e conti sono gestiti dalle casse di compensazione.","src":["AVS/AI: cosa fare in caso di lacune?","UFAS: lacune assicurative e contributive","ch.ch: lacune contributive AVS","AVS/AI: ordinare un estratto conto","AVS/AI: opuscolo 2.03 persone senza attività lucrativa"]},"mdv":{"intro":"Se non può prestare un servizio militare per motivi professionali, di studio o medici, presenti una domanda di spostamento del servizio. Va presentata al più tardi 14 settimane prima dell’inizio del servizio.","facts":[["Motivi","Lavoro, studio o formazione, nonché motivi medici. La domanda è accolta solo per motivi imperativi e se il servizio lo permette."],["Termine e forma","Al più tardi 14 settimane prima dell’inizio del servizio, motivata e con attestazioni (ad es. del datore di lavoro o della scuola). Online tramite il gestore del servizio o con il modulo."],["Importante","Finché non ha ricevuto l’autorizzazione, resta tenuto a entrare in servizio."],["Scuola reclute","Anche la SR può essere spostata per lavoro, studio o motivi medici; di regola è possibile."]],"steps":["Procurarsi un’attestazione del datore di lavoro, della scuola o del medico.","Presentare la domanda al più tardi 14 settimane prima del servizio, online o con il modulo.","Attendere la decisione e nel frattempo entrare in servizio come convocato."],"who":[1,1,0],"note":"L’obbligo di prestare servizio è disciplinato dalla Confederazione (Esercito). Per alcune questioni sono competenti le autorità militari cantonali.","src":["Esercito: spostamento del servizio","Esercito: spostamento del servizio e congedo","ch.ch: servizio militare","Esercito: autorità militari cantonali"]},"zivi":{"intro":"Chi non può conciliare il servizio militare con la propria coscienza può prestare servizio civile. La domanda si presenta solo online tramite ZiviConnect all’Ufficio federale del servizio civile.","facts":[["Requisiti","Ha svolto il reclutamento ed è abile al servizio militare, non può conciliare il servizio militare con la sua coscienza ed è disposto a prestare 1,5 volte i giorni di servizio dell’esercito."],["Domanda","Solo online tramite ZiviConnect, con un login AGOV."],["Giornata introduttiva","Da frequentare entro 3 mesi dalla domanda (non conta come giorno di servizio). Poi confermare la domanda entro 2 settimane. Dopo la decisione d’ammissione non è più possibile ritirarla."],["Servizio militare nel frattempo","Se presenta la domanda almeno 3 mesi prima del prossimo servizio militare, non deve entrare in servizio finché non c’è una decisione passata in giudicato. Per domande più tardive o durante un servizio in corso resta obbligato al servizio militare fino alla decisione d’ammissione."]],"steps":["Creare un login AGOV e presentare in ZiviConnect la domanda d’ammissione, se possibile almeno 3 mesi prima del prossimo servizio militare.","Frequentare la giornata introduttiva entro 3 mesi.","Confermare la domanda entro le 2 settimane successive e attendere la decisione d’ammissione."],"who":[1,0,0],"note":"Il servizio civile è di competenza della Confederazione; è competente l’Ufficio federale del servizio civile (CIVI).","src":["CIVI: ammissione","CIVI: FAQ","CIVI: ZiviConnect","ch.ch: servizio civile"]},"obu":{"intro":"Per una multa disciplinare nel Cantone di Berna ha 30 giorni di tempo di riflessione. Se paga l’intero importo entro questo termine, la questione è chiusa. Se non è d’accordo, non paghi; si apre allora la procedura ordinaria.","facts":[["Che cos’è una multa disciplinare","Una multa inflitta con procedura semplificata. L’elenco delle multe per la circolazione stradale comprende contravvenzioni punite con multe fino a CHF 300."],["Pagare","L’intero importo entro 30 giorni. Le multe disciplinari non possono essere scontate con lavoro."],["Non pagata","Riceve una denuncia di contravvenzione con polizza di versamento. Se scade anche questo termine, la polizia trasmette gli atti al ministero pubblico (procedura ordinaria)."],["Procedura ordinaria","In caso di condanna, alla multa si aggiungono spese procedurali; il loro importo è stabilito dalla giustizia."]],"steps":["Esaminare la multa: è d’accordo?","Se sì: pagare l’intero importo entro 30 giorni.","Se no: non pagare; il caso passa alla procedura ordinaria del ministero pubblico, dove può esporre la sua versione, con rischio di spese."],"who":[1,1,0],"note":"La procedura delle multe disciplinari e l’elenco delle multe sono disciplinati dalla Confederazione. Nel Cantone di Berna le infligge e incassa la Polizia cantonale.","src":["Polizia cantonale bernese: multe disciplinari","ch.ch: norme della circolazione e multe disciplinari","Polizia cantonale bernese: app delle multe"]},"kau":{"intro":"La garanzia della pigione è depositata su un conto a suo nome ed è bloccata per entrambe le parti. Dopo il trasloco la banca la libera se entrambe le parti sono d’accordo, o al più tardi se il locatore non ha fatto valere alcuna pretesa per via legale entro un anno.","facts":[["Importo","Per le abitazioni al massimo tre pigioni mensili. La banca la deposita su un conto di risparmio o di deposito intestato al conduttore."],["Liberazione","Con il consenso di conduttore e locatore, oppure in base a un precetto esecutivo passato in giudicato o a una sentenza esecutiva."],["Dopo un anno","Se il locatore non ha fatto valere alcuna pretesa per via legale entro un anno dalla fine della locazione, può chiedere il rimborso direttamente alla banca."],["Base legale","Art. 257e del Codice delle obbligazioni."]],"steps":["Dopo la riconsegna dell’abitazione, chiedere al locatore una liberazione scritta della garanzia.","Inviare la liberazione alla banca, che versa l’importo.","Senza liberazione: un anno dopo la fine della locazione, chiedere il rimborso alla banca se il locatore non ha fatto valere pretese per via legale."],"who":[1,0,0],"note":"Il diritto di locazione è diritto federale (Codice delle obbligazioni); informa l’Ufficio federale delle abitazioni (UFAB).","src":["UFAB: promemoria garanzie della pigione","UFAB: portale diritto di locazione","ch.ch: concludere un contratto di locazione"]},"zeug":{"intro":"Può chiedere in qualsiasi momento un certificato di lavoro al datore di lavoro, anche durante l’impiego (art. 330a CO). Il diritto si prescrive solo 10 anni dopo la fine del rapporto di lavoro.","facts":[["Certificato completo","Indicazioni sulla natura e la durata del rapporto di lavoro, nonché sulle prestazioni e la condotta (art. 330a cpv. 1 CO)."],["Attestato di lavoro","Solo natura e durata del rapporto di lavoro, senza valutazione (art. 330a cpv. 2 CO). Può chiederlo al posto di un certificato completo."],["Quando","In qualsiasi momento, quindi anche come certificato intermedio durante l’impiego. Prescrizione: 10 anni dalla fine del rapporto di lavoro."],["Errori","Se il certificato contiene inesattezze, errori o falsità, può chiederne la modifica."]],"steps":["Chiedere per scritto al datore di lavoro il certificato (o solo un attestato di lavoro).","Verificare il certificato (errori, indicazioni false).","Se necessario chiedere per scritto una rettifica."],"who":[1,0,0],"note":"Il diritto del lavoro è diritto federale (Codice delle obbligazioni). Informa la Segreteria di Stato dell’economia (SECO).","src":["ch.ch: certificato di lavoro","SECO: FAQ certificato di lavoro"]},"krl":{"intro":"Se è malato e non può lavorare, il datore di lavoro deve continuare a pagare il salario per un tempo limitato se il rapporto di lavoro è durato più di tre mesi o è stato concluso per più di tre mesi (art. 324a CO): almeno 3 settimane nel primo anno di servizio, poi di più.","facts":[["Senza assicurazione d’indennità giornaliera","100 % del salario dal primo giorno di malattia. Almeno 3 settimane nel primo anno di servizio, poi per un periodo adeguatamente più lungo. I tribunali fissano la durata secondo la scala bernese, zurighese o basilese, se contratto o CCL non prevedono di meglio."],["Con assicurazione d’indennità giornaliera","La maggior parte delle assicurazioni versa l’80 % del salario per 720 o 730 giorni entro 900 giorni. È equivalente solo se il datore di lavoro paga almeno metà del premio."],["Certificato medico","Il datore di lavoro può in linea di principio esigerlo dal primo giorno; molti contratti lo chiedono solo dal 3° o 4° giorno."],["Medico di fiducia","In caso di incapacità prolungata, assicurazione o datore di lavoro possono ordinare una visita da un medico indipendente, che informa solo sulla capacità lavorativa, non sulla diagnosi."]],"steps":["Informare subito il datore di lavoro della malattia.","Procurarsi un certificato medico se contratto o datore di lavoro lo chiedono.","Verificare nel contratto o nel CCL se esiste un’assicurazione d’indennità giornaliera e cosa paga."],"who":[1,0,0],"note":"Il pagamento del salario è disciplinato dal Codice delle obbligazioni (diritto federale). Informa la Segreteria di Stato dell’economia (SECO).","src":["SECO: FAQ impedimento al lavoro","ch.ch: incapacità al lavoro"]},"fer":{"intro":"I lavoratori hanno diritto ad almeno 4 settimane di vacanza per anno di servizio, 5 settimane fino ai 20 anni compiuti (art. 329a CO). Contratto o CCL possono prevederne di più.","facts":[["Diritto minimo","4 settimane per anno di servizio; fino ai 20 anni 5 settimane."],["Consecutive","Almeno 2 settimane per anno di servizio devono essere consecutive. Se non vi si oppongono motivi aziendali concreti, il datore di lavoro deve concedere anche 3 settimane di fila."],["Pagamento","Durante il rapporto di lavoro le vacanze non possono essere compensate in denaro (art. 329d cpv. 2 CO). Alla fine il pagamento è possibile in certi casi; durante il termine di disdetta le vacanze vanno se possibile godute."],["Malattia e prescrizione","Se si ammala in vacanza e non può riposarsi, ha diritto a recuperarle. In caso di impedimento senza colpa fino a un mese per anno di servizio, il datore di lavoro non può ridurre le vacanze. Il diritto alle vacanze si prescrive in 5 anni."]],"steps":["Verificare nel contratto o CCL quante settimane di vacanza spettano.","Concordare per tempo le vacanze con il datore di lavoro; almeno 2 settimane consecutive sono garantite.","In caso di malattia in vacanza procurarsi subito un certificato medico e informare il datore di lavoro."],"who":[1,0,0],"note":"Il diritto alle vacanze è nel Codice delle obbligazioni (diritto federale). Informa la Segreteria di Stato dell’economia (SECO).","src":["SECO: FAQ vacanze","ch.ch: vacanze, giorni festivi e assenze"]},"ueb":{"intro":"Le ore supplementari si pagano con il salario più un supplemento di almeno il 25 % oppure, se entrambe le parti sono d’accordo, si compensano con tempo libero di pari durata. Il contratto può escludere per scritto l’indennizzo delle ore supplementari, ma non quello del lavoro straordinario.","facts":[["Ore supplementari","Lavoro oltre l’orario contrattuale. Indennizzo: salario più almeno il 25 % di supplemento, salvo diverso accordo scritto (supplemento minore, nessuno o esclusione)."],["Tempo libero invece di denaro","Compensazione con tempo libero di almeno pari durata se lavoratore e datore di lavoro sono d’accordo. La legge non prevede allora alcun supplemento."],["Lavoro straordinario","Lavoro oltre la durata massima legale: 45 ore settimanali per industria e personale d’ufficio, 50 ore per gli altri lavoratori. Il suo indennizzo non può essere escluso per contratto."],["Verificare il contratto","Contratto di lavoro o CCL regolano spesso l’indennizzo delle ore supplementari."]],"steps":["Annotare con precisione le ore svolte.","Verificare cosa prevedono contratto o CCL per le ore supplementari.","Concordare con il datore di lavoro il pagamento o la compensazione con tempo libero."],"who":[1,0,0],"note":"Le ore supplementari sono disciplinate dal Codice delle obbligazioni, il lavoro straordinario e la durata massima dalla legge sul lavoro (diritto federale). Informa la SECO.","src":["SECO: FAQ ore supplementari","SECO: durata del lavoro e del riposo"]}}},"en":{"ask_label":"What would you like to know?","send":"Send question","nav":["Citizen view","Authority view","Project","Home","Menu","Pages"],"f_links":["Contact","Authority view","Citizen view","Project"],"f_sender":"Private concept by Bilal Simsek, Bern. Not an offer by any authority. Feedback welcome: {c}","f_legal":"Privacy, terms of use and accessibility are not worked out in the concept. The prototype collects no personal data, sets no cookies and uses no analytics tools; the browser only remembers locally that you have read the notice.","f_note":"Concept prototype. All answers are examples and do not replace information from an authority.","banner_s":"Concept prototype, not an official site","skip":"Skip to content","chips":[{"l":"Report a move","q":"I'm moving from Bern to Winterthur: how and by when do I deregister and register?"},{"l":"Passport & ID","q":"I live in Bern and need a new passport and an ID card. How and where do I order them?"},{"l":"Tax return deadline","q":"I live in Bern and can't finish my tax return by mid-March. How do I extend the deadline and what does it cost?"},{"l":"AHV/AVS pension","q":"I was born in 1962 and live in Thun: when and where do I claim my AHV/AVS pension?"},{"l":"Register as unemployed","q":"I live in Thun and lose my job at the end of the month. Where and when do I have to register, and how do I get unemployment benefit?"},{"l":"Switch health insurer","q":"By when can I switch my health insurer and how does it work?"},{"l":"Sole proprietorship","q":"I live in Bern and am going self-employed with a sole proprietorship. What do I need to register, and where?"},{"l":"Exchange driving licence","q":"I have lived in Bern for a few months and have a German driving licence. Do I need to exchange it, and how?"},{"l":"Getting married","q":"We are both Swiss, live in Zurich and want to get married. How does it work and what does it cost?"},{"l":"Register a dog","q":"I live in the City of Bern and have taken over a dog. Where do I register it and what does it cost?"},{"l":"Child allowance","q":"I am employed in Bern and just had a baby. How do I get child allowance and how much is it?"},{"l":"Debt record extract","q":"I live in Bern and need a debt enforcement register extract for a new flat. Where do I order it and what does it cost?"},{"l":"Criminal record extract","q":"I need a criminal record extract for a new job. How do I order it and how long does it take?"},{"l":"Register a car","q":"I live in Bern and bought a used car. How do I register it and what does it cost?"},{"l":"Naturalisation","q":"I have lived in Switzerland for 12 years, 3 of them in the City of Bern, and have a C permit. Can I become Swiss and what does it cost?"},{"l":"Premium reduction","q":"I live in the canton of Bern and earn little. Am I entitled to a health insurance premium reduction and do I need to apply?"},{"l":"Military exemption tax","q":"I am 22, live in Bern and was declared unfit for military service. Do I have to pay the exemption tax, and how much?"},{"l":"Garden shed permit","q":"I live in the City of Bern and want to put up a small garden shed. Do I need a building permit?"},{"l":"Lost ID","q":"I live in Bern and have lost my ID card. What do I need to do and what does it cost?"},{"l":"Daycare vouchers","q":"We live in the City of Bern and want to send our child to daycare. Can we get childcare vouchers and how do we apply?"},{"l":"Social assistance","q":"I live in the City of Bern and can no longer make ends meet. How do I apply for social assistance?"},{"l":"Supplementary benefits","q":"I am retired, live in Thun and my AHV pension is not enough. Can I apply for supplementary benefits?"},{"l":"Disability insurance","q":"I live in Bern and have been ill and unable to work for months. How do I register with disability insurance (IV)?"},{"l":"Maternity benefit","q":"I am employed and expecting a baby in spring. How much maternity benefit will I get and how do I apply?"},{"l":"Paternity leave","q":"I am employed and becoming a father in spring. How long is paternity leave and how do I get the allowance?"},{"l":"Learner’s permit","q":"I am 17, live in Bern and want to learn to drive. How do I get a learner’s permit?"},{"l":"Certificate of residence","q":"I live in the city of Bern and need a certificate of residence. Where do I get it and how much does it cost?"},{"l":"Report a death","q":"My mother died at home in the city of Bern. What do I need to do now and where do I report the death?"},{"l":"Parking permit","q":"I live in the city of Bern and have a car. How do I get a resident parking permit and how much does it cost?"},{"l":"Bulky waste","q":"I live in the city of Bern and want to get rid of an old sofa. How do I dispose of bulky waste and what does it cost?"},{"l":"Lost property","q":"I lost my wallet in the city of Bern. How do I report it to the lost property office?"},{"l":"Start debt collection","q":"A client in Bern is not paying my CHF 2,000 invoice. How do I start debt collection proceedings?"},{"l":"Deregister a car","q":"I live in the canton of Bern and am selling my car. How do I deregister it and what happens to the number plates?"},{"l":"Weekly residence","q":"I now work in the city of Bern and go home to Valais at weekends. How do I register as a weekly resident?"},{"l":"Leave the church","q":"I live in Bern and want to leave the church. How do I do it and from when do I stop paying church tax?"},{"l":"Stolen bike","q":"My bike was stolen in Bern. How do I report the theft to the police?"},{"l":"Advance care mandate","q":"I live in Bern and want to make an advance care mandate (Vorsorgeauftrag). What form must it take and where do I deposit it?"},{"l":"Renew residence permit","q":"I live in the city of Bern and my B permit expires soon. How do I renew it?"},{"l":"Name after divorce","q":"I am divorced, live in Bern and want to go back to my maiden name. How do I do that?"},{"l":"Pay tax in instalments","q":"I live in Bern and can’t pay my tax bill in one go. Can I pay in instalments?"},{"l":"Kindergarten","q":"Our son turns four in May and we live in the city of Bern. When does he start kindergarten and how do we register him?"},{"l":"Acknowledge a child","q":"We are not married, live in Bern and are expecting a baby. How do I acknowledge the child and what does it cost?"},{"l":"Register a birth","q":"Our baby will soon be born in Bern. Who reports the birth and what do we need to do?"},{"l":"Fishing permit","q":"I live in the canton of Bern and want to fish in the Aare. Which permit do I need and what does it cost?"},{"l":"Land register extract","q":"I need a land register extract for my house in the canton of Bern. How do I order it and what does it cost?"},{"l":"Civil status document","q":"I live in Bern and need a certificate of personal status. Where do I order it and what does it cost?"},{"l":"Object to a payment order","q":"I received a payment order but I don’t owe anything. How do I object and by when?"},{"l":"Register a moped","q":"I bought a fast e-bike and live in the canton of Bern. Do I need a number plate and what does it cost?"},{"l":"Weapons permit","q":"I live in the canton of Bern and want to buy a pistol. How do I get a weapons acquisition permit and what does it cost?"},{"l":"Scholarships","q":"I’m starting university in August and my parents live in the canton of Bern. How do I apply for a scholarship and by when?"},{"l":"Lower my rent","q":"My rent is based on a reference rate of 1.5%. Can I ask for a reduction and how?"},{"l":"Source tax","q":"I pay tax at source and live in the canton of Bern. Can I file a tax return to claim deductions?"},{"l":"Certificate of inheritance","q":"My father died in Bern and the bank wants a certificate of inheritance. Where do I get it and what does it cost?"},{"l":"Parking for a move","q":"I’m moving within the city of Bern. How do I reserve a parking space outside the house for the removal van?"},{"l":"AHV gaps","q":"I lived abroad for two years and didn’t pay AHV. Can I pay back the gap?"},{"l":"Postpone military service","q":"My refresher course clashes with my university exams. Can I postpone it and by when do I have to apply?"},{"l":"Civilian service","q":"I’m fit for military service but want to do civilian service instead. How do I apply?"},{"l":"Traffic fine","q":"I got a parking fine in the canton of Bern but think it’s unfair. What can I do and by when do I have to pay?"},{"l":"Rent deposit","q":"I moved out months ago and my landlord won’t release the rent deposit. How do I get my money back?"},{"l":"Employment reference","q":"I resigned and my boss won’t give me an employment reference. Am I entitled to one?"},{"l":"Sick pay","q":"I’ve been ill for two weeks. Does my employer have to keep paying me, and for how long?"},{"l":"Holiday entitlement","q":"How many weeks of holiday am I entitled to, and can my boss pay them out instead of letting me take them?"},{"l":"Overtime","q":"I work overtime every week. Does my employer have to pay for it, and with a supplement?"}],"think":"Tell is checking official sources","who":"Responsible","bund":"Federal","kanton":"Canton","gemeinde":"Municipality","src":"Sources","glance":"At a glance","stand":"As of October 2026 · Sample answer from public sources, without guarantee. The responsible offices are authoritative.","newtab":"opens in a new tab","newq":"New question","fb":{"intro":"The prototype has no answer to this yet. The real version would search official sources from federal, cantonal and municipal governments here. It already answers 23 examples: moving, passport and ID, tax return, AHV/AVS pension, unemployment, switching health insurer, starting a sole proprietorship exchanging a foreign driving licence, getting married, registering a dog, family allowances, the debt enforcement extract, the criminal record extract, registering a car, naturalisation, premium reduction, the military service exemption tax, garden sheds, lost ID documents, childcare vouchers, social assistance, supplementary benefits and disability insurance. Try one of them."},"ans":{"move":{"intro":"You register at your new place of residence within 14 days. From Bern to Winterthur this works online via eUmzugCH: both municipalities are connected, so you do not need to go to a counter.","facts":[["Deadline","14 days from the change of address (Art. 11 Register Harmonisation Act)"],["Cost","Winterthur: CHF 40 per adult; eUmzugCH costs no more than the counter"],["Counter","Not needed, everything is done online"],["Responsible","Bern residents' services (deregistration), Winterthur residents' registry (registration)"]],"steps":["On eumzug.swiss, enter your old address (Bern) and your new address (Winterthur) and start the check.","Have ready: passport or ID card, AHV/AVS number (13 digits), rental contract or move-in confirmation, card or Twint for CHF 40.","Have your health insurance card or policy ready: Winterthur requires this proof at registration.","Complete deregistration in Bern and registration in Winterthur online; a visit to the counter in Bern is not necessary.","Tax office: Winterthur receives the new address automatically; you are liable to tax there from 1 January of the year of arrival."],"who":[1,1,1],"note":"The municipalities (Bern, Winterthur) handle deregistration and registration, eUmzugCH is the joint service of the federal government, cantons and municipalities, and taxes are levied by the canton of Zurich together with the city of Winterthur.","src":["eUmzugCH – report your move online (federal government, cantons, municipalities)","City of Winterthur – moving and arriving in Winterthur","City of Bern – arrival, moving and departure","City of Winterthur – taxes when moving, arriving and leaving"]},"passport":{"intro":"As an adult living in Bern, you apply for a passport and/or ID card online at schweizerpass.ch and then go to your booked appointment, e.g. at the ID document centre in Bern (Laupenstrasse 18A). The combined passport + ID card costs CHF 158 and is valid for 10 years.","facts":[["Cost","Adults: ID card CHF 70, passport CHF 145, combination CHF 158. Children up to 18: ID 35, passport 65, combination 78 (postage included)."],["Validity","Adults 10 years, children and young people up to 18: 5 years. Extending is not possible, you order a new one."],["Duration","Delivery within 10 working days after the appointment at the latest, by registered mail."],["Appointment","Mandatory, you must appear in person (photo, fingerprints for the passport)."],["New from November","From 2 November 2026 a biometric ID card with a chip (facial image and two fingerprints) is also available. Optional, same fee as today. The provisional passport will then be called «emergency passport»."]],"steps":["Fill in the online application at schweizerpass.ch (personal e-mail address required). After review, you receive an e-mail to choose an appointment.","Book an appointment at one of the 7 ID document centres in the canton of Bern (mandatory): online or by phone on 031 635 40 00, Mon–Fri.","Bring your old document, but no passport photo: the photo is taken on site.","Pay the fee on site (card, Twint or cash). Children come with a legal guardian and their ID.","The document arrives within 10 working days by registered mail at the address you gave."],"who":[1,1,0],"note":"The federal government (fedpol) publishes prices, validity and delivery times; in the canton of Bern, the seven cantonal ID document centres record your data.","src":["fedpol: prices, validity and delivery times","Canton of Bern: ID documents, prices and validity","Canton of Bern: ID document centres and appointments","Canton of Bern: attending the appointment, documents to bring","Federal Council: biometric ID card from 2.11.2026 (press release 26.8.2026)"]},"tax":{"intro":"In the canton of Bern, the tax return is generally due on 15 March; online you can extend it free of charge until 15 July, and until 15 November at the latest. For tax period 2025, because of an IT outage, 30 November 2026 applies exceptionally as the final deadline.","facts":[["Deadline","Bern: 15 March (self-employed: 15 May). Zurich and Geneva: 31 March."],["Cost","Bern online: free until 15 July, CHF 20 until 15 Sept., CHF 40 until 15 Nov. In writing/by phone: CHF 20/40/60. Geneva: CHF 20/40/60."],["Duration","Bern: until 15 Nov. at the latest; 2025 return exceptionally until 30 Nov. 2026 (IT outage)."],["Responsible","Bern: cantonal tax administration. Zurich: municipal tax office. Geneva: Administration fiscale cantonale."]],"steps":["Have the letter about the tax return, your salary certificate (from your employer) and supporting documents ready.","Before the deadline, in BE-Login (with AGOV): “Fristverlängerung erfassen” (record extension), choose the new deadline and confirm.","Save the confirmation yourself: none is sent by post or e-mail.","Fill in the return in TaxMe-Online and submit it with supporting documents (or hand it in printed at your municipality of residence).","Too late? A reminder fee of CHF 60 is possible; once the reminder period has expired, no extension is possible any more."],"who":[1,1,1],"note":"The cantonal tax administration receives your return and also assesses the direct federal tax on behalf of the federal government (supervised by the FTA); the municipality sets its own tax rate.","src":["Canton of Bern: extending the deadline as a private individual","Canton of Bern: guidance, filing deadline","Canton of Zurich: tax return for private individuals","Canton of Geneva: request an extension"]},"ahv":{"intro":"A man born in 1962 who lives in Thun reaches the reference age of 65 in 2027 and claims his pension from the compensation office 3–4 months earlier. With a birthday on 15 March 2027, the pension starts on 1 April 2027; the claim is filed from about December 2026.","facts":[["Reference age","Men 65. Women: born 1961 = 64 y 3 m, 1962 = 64 y 6 m, 1963 = 64 y 9 m, from 1964 = 65. Pension from the following month."],["Deadline","Claim 3–4 months before the pension starts. Early drawing from 63 (–6.8 % for 1 year), deferral 1–5 years (+5.2 % to +31.5 %)."],["Pension","From 2027, with a full contribution period CHF 1,280 to 2,560 per month; couple at most CHF 3,840. Plus the 13th pension from December 2026."],["Responsible","The compensation office your employer is affiliated with (in the canton of Bern e.g. the Bern compensation office, AK Bern)."]],"steps":["Find out which compensation office is responsible: employees ask their employer, self-employed people the office they last settled with.","Fill in and submit form 318.370 “Claim for an old-age pension” online 3–4 months before the pension starts.","Early drawing: apply by the end of the previous month at the latest. Deferral: tick the box on the form no later than 1 year after the reference age.","Upload the enclosures with the form or send them by post; the compensation office obtains the documents needed and calculates the pension.","Paid monthly (AK Bern: 4th working day, e.g. 4 December 2026); the 13th pension in December comes without an application."],"who":[1,1,0],"note":"The federal government (FSIO) sets the rules and publishes the leaflets; the compensation office (in the canton of Bern, AK Bern) receives your claim, calculates and pays the pension.","src":["Bern compensation office: AHV/AVS old-age pension","ahv-iv.ch: Leaflet 3.01 Old-age pensions (as of 1.1.2026)","ch.ch: Retirement – from when?","FSIO: Stabilising the AHV (AHV 21)","Federal Council: AHV/IV pensions rise on 1.1.2027 (2.10.2026)"]},"alv":{"intro":"Register at the RAV (regional employment centre) in your region no later than the first day for which you want unemployment benefit, fastest online in Job-Room. Example in Thun: aged 30, monthly salary of 6,500 francs, no children, 14 months of contributions gives 70 %, at most 260 daily allowances and 10 waiting days.","facts":[["Deadline","Register with the RAV no later than the 1st day of unemployment, better still during the notice period."],["Amount","70 % of insured earnings. 80 % with children under 25, earnings up to 3,797 francs or a disability pension of 40 % or more."],["Duration","At least 12 months of contributions within 2 years. 260 daily allowances, more with a longer contribution period. Framework period: 2 years."],["Responsible","RAV (registration, counselling) and the unemployment fund you choose (payment)."]],"steps":["Register online: use the e-service for registering with the RAV in Job-Room, or go in person to the RAV in your region.","Look for work already during the notice period and document every application. Your RAV sets how many.","Choose an unemployment fund, submit the “application for unemployment benefit” and employer certificates (2 years).","First interview at the RAV (invitation within 15 days): bring your AHV/AVS or health insurance card, ID and proof of your job search efforts.","Submit the “information from the insured person” form every month. Daily allowances usually follow in the next month."],"who":[1,1,0],"note":"SECO supervises unemployment insurance; RAV, unemployment funds and cantonal offices carry it out; you register directly with the RAV.","src":["arbeit.swiss: registration","arbeit.swiss (SECO): FAQ on unemployment benefit","ch.ch: Unemployment in Switzerland","Fedlex: Unemployment Insurance Act (AVIG, SR 837.0), Art. 9, 17, 18, 22, 27"]},"kk":{"intro":"You can switch your basic health insurance for the end of the year if your insurer receives your cancellation by Monday, 30 November 2026. The new insurer must accept you without health questions. The 2027 premiums are already in the premium calculator on priminfo.admin.ch.","facts":[["Deadline","Your insurer must receive the cancellation by the last working day of November (2026: Monday, 30 November). Receipt counts, not the postmark. Recommended: send it by registered mail by mid-November."],["Franchise","Adults: CHF 300 or, optionally, 500, 1,000, 1,500, 2,000, 2,500, plus 10 % co-payment, at most CHF 700 a year. Children: no franchise, co-payment at most CHF 350."],["Changing franchise","Lower franchise: tell the insurer in writing by the last working day of November. Higher franchise: only from the start of a year; the law sets no deadline, Priminfo recommends telling the insurer by mid-December."],["Mid-year","Switching on 1 July is only possible with the standard CHF 300 franchise and free choice of provider, with notice by 31 March. With a restricted-choice model (e.g. family doctor or telemedicine) you can only switch at year-end."],["Caution","Unpaid premiums or cost shares reminded by 30 November: your notice only takes effect if you pay them, with default interest and debt-collection costs, by 31 December (Art. 64a KVG)."],["Responsible","Your current and your new insurer. The federal government (FOPH) approves the premiums."]],"steps":["Compare the 2027 premiums on priminfo.admin.ch: enter your place of residence, age, franchise and model (e.g. family doctor or telemedicine).","Choose the new insurer and apply for basic insurance. Every insurer must accept you, with no health questions, reservations or waiting periods.","Cancel your current basic insurance in writing, ideally by registered mail by mid-November.","Do not cancel supplementary insurance too quickly: for it, insurers may ask health questions and decline you. The notice period is in the policy terms, often three months to the end of the year. Your insurer may not cancel it just because you switch your basic insurance.","Wait for the new insurer’s confirmation: your old cover only ends once the new insurer has reported uninterrupted cover. If that report is late, the new insurer must cover the premium difference."],"who":[1,0,0],"note":"The law (KVG/LAMal) and premium approval are federal matters (FOPH). Cancellation and joining go directly through the insurers, no authority receives them.","src":["Priminfo (FOPH): FAQ, switching health insurer","Priminfo (FOPH): premium calculator 2027","Priminfo (FOPH): 2027 premiums by canton","Fedlex: KVG (SR 832.10), Art. 7 and 64a"]},"biz":{"intro":"If you go self-employed in Bern with a sole proprietorship, you first register as self-employed with the compensation office (AHV). The commercial register and VAT only become mandatory from CHF 100,000 turnover a year. You can do the registrations online on EasyGov.swiss, the federal portal.","facts":[["AHV","Register with the compensation office at your business location (Bern: AK Bern). Contribution 10 % of income, less below CHF 60,500; in 2026 at least CHF 530 a year."],["Commercial register","Mandatory from CHF 100,000 turnover in the last financial year, otherwise voluntary. Fee CHF 120. The business name must contain your surname."],["VAT","Mandatory from CHF 100,000 turnover a year, or as soon as that is foreseeable at the start. Register with the FTA within 30 days."],["Permit","Only needed for certain regulated activities. Check before you start."]],"steps":["Open an account on EasyGov.swiss, choose «sole proprietorship» and set the business name with your surname.","Register as self-employed with AK Bern, ideally in the first quarter: online or with form 318.146, with proof such as invoices, an income statement or advertising.","From CHF 100,000 annual turnover: entry in the Bern commercial register (CHF 120) and VAT registration with the FTA within 30 days.","Before you start, check whether your activity needs a permit."],"who":[1,1,0],"note":"The compensation office and the commercial register are cantonal (in Bern: AK Bern and the commercial register office of the canton of Bern), VAT is levied by the federal government (FTA). EasyGov.swiss is the federal online counter for all three.","src":["SME portal (SECO): sole proprietorship","Bern commercial register: leaflet on registering a sole proprietorship","Compensation office of the canton of Bern: self-employed","ahv-iv.ch: leaflet 2.02, contributions of the self-employed","FTA: VAT liability","EasyGov.swiss: found a sole proprietorship"]},"drv":{"intro":"If you live in Switzerland, you can drive on a foreign licence for 12 months only. In the canton of Bern you exchange it at the road traffic office (SVSA). A German licence, issued in the EU, needs no test drive; the exchange costs CHF 120.","facts":[["Deadline","12 months from entry as stated in your residence permit (Art. 42 VZV). Apply before then so you can keep driving without a break. Exchanging later is still possible, but you may be fined."],["Test drive","None for licences from the EU/EFTA and from Andorra, Australia, Israel, Japan, Canada, South Korea, Morocco, Monaco, New Zealand, San Marino, Singapore, Taiwan, Tunisia and the USA. Everyone else takes a test drive."],["Costs","Bern: exchange CHF 120, test drive category B CHF 132."],["Responsible","Road Traffic and Navigation Office of the canton of Bern (SVSA), Schermenweg 5, Bern."]],"steps":["Have an eyesight test done by a recognised optician or eye doctor.","Fill in and sign the SVSA application form and attach a recent colour passport photo (35 × 45 mm).","Hand in the application in person: at an SVSA office, your municipality’s residents’ office or a police station in the canton of Bern. Bring your original foreign licence and your passport or ID card.","Take the test drive if required. Your Swiss licence arrives by post."],"who":[1,1,0],"note":"The federal government (FEDRO) sets the rules for the exchange in the traffic licensing ordinance; the cantonal road traffic office (in Bern the SVSA) checks the application and issues the licence.","src":["Canton of Bern (SVSA): exchanging a foreign licence","Canton of Bern (SVSA): fees","ch.ch: exchanging your driving licence","FEDRO: exchanging foreign driving licences"]},"wed":{"intro":"If you are both Swiss and live in Zurich, you first book the venue and date online with the civil registry office of the City of Zurich, at the earliest 12 months ahead. You do the marriage preparation together at the counter in the Stadthaus, at the latest 1 month before the wedding.","facts":[["Requirements","Both at least 18 and capable of judgement. Relatives in direct line, siblings and half-siblings may not marry each other."],["Deadline","Invitation to the marriage preparation at the earliest 3 months before the wedding. Complete it at the latest 1 month before, or the booking is cancelled."],["Costs","Zurich: cheapest wedding at the Stadthaus from CHF 255, including marriage preparation without translation (only if you live in the City of Zurich)."],["Witnesses","Two adult witnesses capable of judgement must be present."]],"steps":["Book the venue and date on the website of the Zurich civil registry office, at the earliest 12 months ahead.","At the earliest 3 months before the wedding you get an email invitation. Use it to choose an appointment for the marriage preparation online.","Come together to the counter in the Stadthaus with your passport or ID card. You fill in and sign the form and decide which surnames you and any children will have.","Pay the fees on site by card or Twint. Bring two witnesses to the wedding."],"who":[1,0,1],"note":"The federal government sets the rules on marriage (Civil Code) and the fees; in Zurich the city’s civil registry office handles the preparation and the wedding.","src":["City of Zurich: marrying with residence in Zurich","City of Zurich: marriage preparation","City of Zurich: questions and answers on marriage","ch.ch: getting married in Switzerland"]},"dog":{"intro":"In the City of Bern you register your dog with the residents’ services, using the dog registration form. If you took the dog over from someone, you report the change of owner to the AMICUS database within 10 days. The dog tax is CHF 150 a year.","facts":[["Registration","With the residents’ services of the City of Bern (Einwohnerdienste), Predigergasse 5, 3011 Bern. The municipality registers you as the owner in AMICUS."],["Deadline","Report a change of owner (purchase, takeover, handing over for more than 3 months) to AMICUS within 10 days. Imported dogs: have a vet check and report the microchip within 10 days."],["Costs","City of Bern: CHF 150 per dog and year, for dogs from 6 months. The bill arrives automatically in August."],["Microchip","Mandatory for every dog; puppies within 3 months. Only vets implant the chip and register the dog with AMICUS."]],"steps":["Fill in the City of Bern dog registration form and post it to the residents’ services.","If the dog already has a chip: report the change of owner to AMICUS within 10 days. If not: have it chipped by a vet.","Pay the dog tax when the bill arrives in August.","If you move, give the dog away or it dies: inform the municipality and AMICUS."],"who":[1,0,1],"note":"The federal government requires the microchip and registration in AMICUS (Animal Diseases Ordinance); the municipality takes the registration and levies the dog tax.","src":["City of Bern: dogs","City of Bern: dog registration form","AMICUS: good to know (leaflet)","ch.ch: dog tax"]},"fam":{"intro":"If you are employed in the canton of Bern, you apply for family allowances through your employer. They pass the application to their family compensation fund. The child allowance is CHF 250 a month per child (as of 2026).","facts":[["Amount","Canton of Bern, as of 2026: child allowance CHF 250 a month up to the month of the 16th birthday. Training allowance CHF 310 for children in education, from 15 at the earliest, until 25 at the latest."],["Application","Employees: through the employer. People without gainful employment: with the cantonal compensation office (AK Bern)."],["Deadline","No fixed deadline; allowances you missed can be claimed up to 5 years back."],["Per child","Only one allowance per child, even if both parents work."]],"steps":["Ask your employer for the family allowance application form.","Fill in and sign the form with the details of the child and the other parent.","Your employer passes the application to their family compensation fund and pays out the allowance.","If both parents work: agree first who applies, as there is only one allowance per child."],"who":[1,1,0],"note":"The federal government sets the minimum amounts (Family Allowances Act), the canton of Bern pays 115 % of them; payment runs through the roughly 50 family compensation funds in the canton.","src":["Bern family portal: child and training allowances","ch.ch: family allowances","ahv-iv.ch: leaflet 6.08 family allowances","Compensation office of the canton of Bern: family allowances"]},"debt":{"intro":"In the canton of Bern you order the debt enforcement register extract online from the cantonal debt enforcement and bankruptcy office (be.ch/baka). It costs CHF 18 including delivery and comes electronically as a download.","facts":[["Costs","Canton of Bern online: CHF 18 including delivery (fee CHF 17 per extract)."],["Content","Debt enforcement proceedings of the last 5 years in that district."],["Moving","If you lived elsewhere in the last 5 years, order an extract there too, or those proceedings are missing."],["Delivery","Online orders are fully electronic: download from a secure platform, possible several times."]],"steps":["Order your own debt enforcement register extract online at be.ch/baka.","Have a valid ID ready: ID card, passport or foreign national ID card.","Pay the fee when ordering: card, PostFinance Pay or Twint.","Download the extract from the secure platform and pass it on, for example to your landlord."],"who":[1,1,0],"note":"The federal government sets the debt enforcement law (SchKG) and the fees; in the canton of Bern the cantonal debt enforcement and bankruptcy office (BAKA) keeps the registers.","src":["Canton of Bern (BAKA): ordering a debt enforcement extract","ch.ch: ordering a debt enforcement register extract","Canton of Bern: online ordering of the extract (press release)"]},"crim":{"intro":"You order the criminal record extract (private extract) from the federal government, online at strafregister.admin.ch or at a post office counter. It costs CHF 17 and arrives by post about 10 working days after your signed form is received.","facts":[["Costs","CHF 17 for the private extract. Certification or apostille: CHF 20 extra."],["Duration","About 10 working days after your signed form is received."],["Ordering","Online at strafregister.admin.ch or in person at a post office counter with valid ID."],["Special extract","For work with minors there is a separate extract, the special private extract."]],"steps":["On strafregister.admin.ch choose the private extract and enter your personal details, address and payment details.","Pay the fee online: debit or credit card, PostFinance Card or Twint.","Print the form, sign it and post it with a copy of your ID.","Alternatively: order at a post office counter with your passport, ID card or foreign national ID card and pay on the spot."],"who":[1,0,0],"note":"The criminal record is kept by the federal government (Federal Office of Justice). You order directly from the federal government or at a post office counter.","src":["Federal Office of Justice: ordering the private extract","Federal Office of Justice: FAQ private extract","ch.ch: criminal record extract"]},"car":{"intro":"In the canton of Bern you register the car with the road traffic office (SVSA), by post or at the counter. First your insurer sends the proof of insurance to the office electronically. The vehicle registration document costs CHF 45 by post or CHF 55 at the counter.","facts":[["Documents","Proof of insurance (sent electronically by your insurer to the office), the previous owner’s vehicle registration document, inspection report if the car was inspected, ID."],["Costs","Registration document: CHF 45 by post, CHF 55 at the counter. New number plates: CHF 45 a pair, CHF 30 for one."],["Deadline","The proof of insurance is valid for 30 days. The motor vehicle tax is due within 30 days of the bill."],["Tax","Annual motor vehicle tax, billed in January or on registration. The SVSA calculator shows the amount."]],"steps":["Take out third-party liability insurance. The insurer sends the proof of insurance to the SVSA electronically.","Fill in the vehicle registration application form.","Post the form with the previous owner’s registration document, any inspection report and your ID to SVSA, Schermenweg 5, 3001 Bern, or hand it in at the counter.","By post it takes a few working days for the new registration document to arrive. Then pay the motor vehicle tax bill within 30 days."],"who":[1,1,0],"note":"The federal government sets the rules for vehicle registration; the cantonal road traffic office (in Bern the SVSA) issues the registration document and number plates and levies the motor vehicle tax.","src":["Canton of Bern (SVSA): registering a vehicle","Canton of Bern (SVSA): how to register your vehicle","Canton of Bern (SVSA): documents for registration","Canton of Bern (SVSA): calculating vehicle tax","ch.ch: registering a vehicle"]},"nat":{"intro":"You meet the residence conditions: 10 years in Switzerland, a C permit and at least 2 years in the canton and the municipality. Language proof, the naturalisation test and integration come on top. You apply to the City of Bern; for a single person, municipality, canton and federal government cost CHF 1,650 together.","facts":[["Requirements","C permit, 10 years in Switzerland in total, at least 2 uninterrupted years each in the canton of Bern and the municipality, successful integration."],["Language","Canton of Bern: spoken B1, written A2. No proof needed if the official language is your mother tongue or you attended at least 5 years of compulsory school in that language."],["Test","Written, 90 minutes: geography, history, democracy, health and work, rights and duties. Exempt, among others: anyone who attended at least 5 years of compulsory school in Switzerland."],["Costs","Single person in the City of Bern: municipality CHF 400, canton CHF 1,150, federal government CHF 100. Married couple: 600, 1,725 and 150."]],"steps":["Contact your municipality (City of Bern). It gives you the forms and tells you which documents you need.","Get your language certificate (spoken B1, written A2) unless you are exempt.","Hand in the complete application to the municipality and take the naturalisation test unless you are exempt.","The municipality bills you for the municipal and cantonal fees; the federal government (SEM) decides on the federal naturalisation permit."],"who":[1,1,1],"note":"Naturalisation means acquiring three citizenships: municipality, canton and federal government each check their part. The application runs through your municipality, the State Secretariat for Migration (SEM) grants the federal permit.","src":["Canton of Bern: residence in Switzerland (naturalisation)","Canton of Bern: language skills and proof","Canton of Bern: naturalisation test","Canton of Bern: naturalisation fees","SEM: ordinary naturalisation"]},"pv":{"intro":"In the canton of Bern, the canton usually checks your entitlement to a premium reduction automatically, based on your final tax data from the two previous years. In 2026 the limit is CHF 35,000 of relevant income, or CHF 45,000 for families with children. You only apply in special cases.","facts":[["Limit 2026","Relevant income at most CHF 35,000; families with children at most CHF 45,000."],["Check","Automatic, based on final tax data from the two previous years (net income and assets)."],["Application","Only in special cases, for example if no automatic check is possible or your income or family changes significantly and permanently. Also possible online."],["Calculator","Non-binding estimate with the online calculator at be.ch/pvo-onlinerechner."]],"steps":["Use the online calculator at be.ch/pvo-onlinerechner to see whether you may be entitled.","File your tax return: the automatic check needs final tax data.","If your income or family has changed significantly and permanently: apply, also possible online.","If you are entitled, the canton pays the reduction directly to your health insurer and your premium bill goes down."],"who":[1,1,0],"note":"The federal government requires premium reductions in the Health Insurance Act and contributes to them; in the canton of Bern the Social Insurance Office (ASV) checks and decides.","src":["Canton of Bern (ASV): entitlement to premium reduction","Canton of Bern (ASV): when you need to apply","Canton of Bern (ASV): information sheet premium reduction 2026","Canton of Bern (ASV): calculating entitlement"]},"wpe":{"intro":"Yes. Anyone who does not do, or does not complete, military or civilian service pays the military service exemption tax: 3 % of taxable income for direct federal tax, at least CHF 400 a year. In the canton of Bern the Office for Civil Protection, Sport and Military Affairs (BSM) is responsible.","facts":[["Amount","3 % of taxable income for direct federal tax, at least CHF 400 a year."],["Duration","From age 19 to 37, at most 11 years of tax."],["Civil protection","Doing civil protection service does not exempt you, but you pay 4 % less for each day of service done that year."],["Refund","If you make up your military or civilian service and complete your service obligation, you get the tax back. The claim expires 5 years after your service obligation ends."]],"steps":["File your tax return as usual: the tax is based on your taxable income for direct federal tax.","The bill comes from the cantonal office, in the canton of Bern from the BSM.","With a significant disability and low income: have an exemption checked.","Service made up: once your service obligation is complete, apply to the BSM for a refund."],"who":[1,1,0],"note":"The exemption tax is a federal levy (FTA); the cantons, in Bern the Office for Civil Protection, Sport and Military Affairs, assess and collect it.","src":["FTA: the military service exemption tax explained","Canton of Bern (BSM): exemption tax","Canton of Bern (BSM): refund","ch.ch: military service exemption tax"]},"bau":{"intro":"Not necessarily. In the canton of Bern a garden shed needs no building permit if it has at most 10 m² of floor area and is at most 2.5 m high, is unheated, is neither lived in nor used commercially and belongs to a main building. If it is bigger, you submit a building application via eBau.","facts":[["Permit-free","Unheated small building up to 10 m² floor area and 2.5 m high, not lived in, not commercial, linked to a main building (Art. 6 of the building permit decree)."],["Still applies","Even without a permit, rules apply, for example distances, fire safety and energy rules."],["Exception","Outside the building zone even a small building needs a permit if it significantly changes the surroundings, burdens access or harms the environment."],["Application","Since March 2022 only electronically via eBau throughout the canton of Bern."]],"steps":["Check the size: at most 10 m² floor area, 2.5 m high, unheated, for storage only.","Keep the distances to the boundary and follow fire safety and energy rules.","If in doubt, ask the City of Bern building inspectorate; it also answers preliminary enquiries.","If the shed is bigger or a condition is not met: submit the building application electronically via eBau."],"who":[0,1,1],"note":"The canton sets which buildings are permit-free in its building permit decree; in the City of Bern the building inspectorate gives advice and reviews applications.","src":["Canton of Bern: building permit decree (BSG 725.1), Art. 6","City of Bern: when do you need a building permit?","City of Bern: building permit procedure"]},"lost":{"intro":"Report the loss in person: at a police station or directly at your appointment at the ID centre when you order the new document. Reporting the loss costs CHF 40 in the canton of Bern. After that the old document is invalid, even if you find it again.","facts":[["Report","In person at a police station or at the ID centre during the appointment for your new document."],["Costs","Loss report in the canton of Bern: CHF 40. Plus the new document at the normal price, for example adult ID card CHF 70."],["Validity","Reporting the loss makes the document invalid. If you find it, you may no longer use it and must hand it in at the passport office."],["New document","Like any document: apply online at schweizerpass.ch, then book an appointment at the ID centre."]],"steps":["Report the loss in person: at a police station (you get a loss report) or directly at your appointment at the ID centre.","Apply for the new document online at schweizerpass.ch and book an appointment at a Bern ID centre.","Bring the police loss report to the appointment if you reported the loss there.","If the old document turns up: do not use it and hand it in at the passport office."],"who":[1,1,0],"note":"The federal government (fedpol) is responsible for ID documents; losses are reported to the police or the cantonal ID centres, in the canton of Bern also to the seven ID centres.","src":["Canton of Bern: loss of ID card or passport","ch.ch: passport or ID card lost or stolen","fedpol: loss of identity documents"]},"kita":{"intro":"In the City of Bern you get childcare vouchers for an approved daycare centre if you work at least 105 % together (single parents 5 %) and your relevant family income is below CHF 170,000. You apply online via kiBon; the voucher applies from the month after your complete application.","facts":[["Requirements","Residence in the City of Bern, daycare centre or childminder organisation approved in the cantonal voucher system, child from 3 months until the end of kindergarten."],["Work rate","Both parents together at least 105 %, single parents at least 5 %."],["Income","Voucher period 1 August 2026 to 31 July 2027: relevant family income below CHF 170,000."],["Start","The voucher only applies from the month after your complete application is received, not retroactively."]],"steps":["Estimate the voucher amount with the City of Bern voucher calculator.","Choose a daycare centre approved in the cantonal voucher system.","Apply online via kiBon (or on paper), with proof of your work rate such as an employment contract or timesheet.","Apply early and completely, as the voucher only applies from the following month."],"who":[0,1,1],"note":"The canton of Bern sets the voucher system and runs kiBon; the City of Bern reviews applications, issues the vouchers and pays its own supplement.","src":["City of Bern: childcare vouchers","City of Bern: FAQ on childcare vouchers","City of Bern: voucher calculator","Canton of Bern (GSI): childcare vouchers"]},"soz":{"intro":"In the City of Bern you register in person at the social services office, Schwarztorstrasse 71, with an official ID. There you get a personal checklist of the documents you need. The City of Bern social assistance calculator gives a first estimate of whether you may be entitled.","facts":[["Registration","In person at the City of Bern social services, Schwarztorstrasse 71, with official ID. Newcomers not yet registered with the residents’ office bring a copy of their tenancy agreement."],["Documents","The application form lists the usual documents; at the counter you get a personal checklist and a power of attorney form."],["Amount","Based on the SKOS guidelines, graded by household size. The City of Bern social assistance calculator gives a first estimate."],["Repayment","Social assistance may have to be repaid later if the conditions for repayment are met."]],"steps":["Use the City of Bern social assistance calculator to see whether you may be entitled.","Register in person at social services, Schwarztorstrasse 71, with ID (newcomers: copy of the tenancy agreement).","Fill in the application form and hand in the documents on your checklist.","Sign the power of attorney and hand it in with the application."],"who":[0,1,1],"note":"The canton of Bern regulates social assistance and follows the SKOS guidelines; your application is handled by the social services of your municipality, in Bern the city’s social services.","src":["City of Bern: registering for social assistance","City of Bern: who can apply for social assistance?","City of Bern: social assistance calculator","City of Bern: social assistance and social services"]},"el":{"intro":"Yes, if your pension and other income do not cover your living costs and your net assets are below CHF 100,000 (married couples CHF 200,000). In the canton of Bern you hand in the registration form at the AHV branch office of your municipality; the compensation office of the canton of Bern decides.","facts":[["Assets","Net assets below CHF 100,000 for single people, below CHF 200,000 for married couples."],["Living costs","Recognised from 2027 (living at home): CHF 21,000 a year for single people, CHF 31,500 for married couples."],["Registration","Hand in the official registration form at the AHV branch office of your municipality."],["Responsible","The compensation office of the canton of Bern reviews the application and decides."]],"steps":["Download and fill in the supplementary benefits registration form from the compensation office of the canton of Bern.","Attach the documents the form asks for.","Hand in the form at the AHV branch office of your municipality (here Thun).","The compensation office checks income and assets and sends you its decision."],"who":[1,1,1],"note":"The federal government regulates supplementary benefits and sets the amounts; the compensation office of the canton of Bern decides, and the municipal AHV branch office takes the registration.","src":["Compensation office of the canton of Bern: supplementary benefits","ahv-iv.ch: leaflet 5.01 supplementary benefits","Compensation office of the canton of Bern: EL registration form","Federal Council: adjustments as of 1.1.2027 (2.10.2026)"]},"iv":{"intro":"Register with the IV office of the canton of Bern, and do it early: a disability pension starts at the earliest 6 months after you register. First, though, the IV checks whether measures can help you stay in work (integration before pension).","facts":[["Early detection","After 30 days of incapacity for work or frequent short absences, the IV office can be notified, for example by your employer. It then clarifies whether you need to register."],["Pension","At the earliest 6 months after registering. Condition: on average at least 40 % unable to work for one year, and at least 40 % unable to earn afterwards."],["Priority","Integration before pension: the IV first looks at measures that keep or improve your earning capacity."],["Process","After you register, the IV office invites you to a first interview and gathers information about your health."]],"steps":["Fill in the IV registration form.","Hand in the registration to the IV office of the canton of Bern, not too late, as the pension starts 6 months later at the earliest.","Attend the first interview. The IV gathers the information it needs about your health.","Take part in integration measures. The IV only decides on a pension if these are not enough."],"who":[1,1,0],"note":"Disability insurance is a federal insurance (FSIO); it is run by the cantonal IV offices, in Bern by the IV office of the canton of Bern.","src":["IV office canton of Bern: registration and procedure","IV office canton of Bern: early detection and integration","ahv-iv.ch: leaflet 4.04 disability pensions","ch.ch: disability insurance"]},"mse":{"intro":"If you were in paid work before the birth, you receive maternity benefit for 14 weeks: 80 % of your average earnings, at most CHF 220 a day. You apply to the AHV compensation office.","facts":[["Eligibility","Insured under AHV for the 9 months before the birth and in paid work for at least 5 of those months. At the birth, employed, self-employed or unemployed."],["Amount","80 % of average earnings before the birth, at most CHF 220 a day. Employees reach the maximum from a monthly salary of CHF 8,250."],["Duration","98 days (14 weeks) from the birth. If you go back to paid work earlier, the entitlement ends. If the baby stays in hospital for at least 2 weeks right after the birth, it is extended by up to 56 days."],["Deadline","You can claim up to 5 years after the end of maternity leave."]],"steps":["Fill in the form “Application for maternity benefit” (318.750).","If you are employed: your employer confirms how long you were employed and your salary.","Hand in the application to the responsible AHV compensation office, the one that last received your contributions."],"who":[1,0,0],"note":"Maternity benefit is part of the federal income compensation scheme (EO, FSIO). It is pa
