elbst bei den Einwohnerdiensten (031 321 53 00)."],["Einreichen","Ausgefüllt mit den Unterlagen, die in der Verfallsanzeige stehen, per E-Mail oder Post. Die Bearbeitung kann dauern; die Stadt meldet sich, sobald die Bewilligung verlängert ist."],["Biometrie","Falls nötig, erhalten Sie eine schriftliche Einladung, im Ausweiszentrum Ihre biometrischen Daten abzugeben."],["Gültigkeit B","Kanton Bern: für EU/EFTA-Staatsangehörige in der Regel 5 Jahre, für Drittstaatsangehörige 1 Jahr."]],"steps":["Verfallsanzeige abwarten (ein bis zwei Monate vor Ablauf) und ausfüllen.","Mit den verlangten Unterlagen per E-Mail oder Post an die Einwohnerdienste, Migration und Fremdenpolizei der Stadt Bern schicken.","Falls eingeladen: im Ausweiszentrum biometrische Daten abgeben. Danach kommt der neue Ausweis."],"who":[1,1,1],"note":"Die Regeln setzt der Bund (SEM). In der Stadt Bern nehmen die Einwohnerdienste, Migration und Fremdenpolizei die Verlängerung entgegen; der Kanton regelt den Ausweis.","src":["Stadt Bern: Verlängerung von Bewilligungen","Kanton Bern: Aufenthaltsbewilligung (Ausweis B)","Stadt Bern: Einwohnerdienste, Migration und Fremdenpolizei"]},"nam":{"intro":"Nach der Scheidung behalten Sie den Namen aus der Ehe. Sie können aber jederzeit vor dem Zivilstandsamt erklären, dass Sie wieder Ihren Ledignamen tragen wollen. Im Kanton Bern kostet das CHF 75.","facts":[["Frist","Keine. Die Erklärung ist jederzeit möglich, sobald die Ehe nicht mehr besteht."],["Wo","Mit Termin bei einem der sieben Zivilstandsämter im Kanton Bern oder bei jedem anderen Zivilstandsamt der Schweiz."],["Kosten","Namenserklärung CHF 75. Bestätigung auf Wunsch CHF 30. Bezahlt wird vor Ort."],["Abgrenzung","Wollen Sie einen anderen Namen als den Ledignamen, braucht es ein Gesuch um Namensänderung beim Kanton."]],"steps":["Termin bei einem Zivilstandsamt vereinbaren.","Vor Ort die Namenserklärung abgeben und die Gebühr bezahlen."],"who":[1,1,0],"note":"Das Namensrecht steht im ZGB. Die Erklärung nimmt das kantonale Zivilstandsamt entgegen.","src":["Kanton Bern: Namenserklärung","ch.ch: Name nach der Scheidung","Kanton Bern: Namensänderung"]},"rat":{"intro":"Im Kanton Bern zahlen Sie die Steuern ohnehin in drei Raten. Reicht das Geld nicht, beantragen Sie bei der Steuerverwaltung eine Zahlungserleichterung, also mehr Zeit oder Teilzahlungen. Einen Anspruch darauf gibt es nicht, und der Verzugszins läuft weiter.","facts":[["Raten","Kantons- und Gemeindesteuern des laufenden Jahres kommen in drei Ratenrechnungen, fällig am 20. Mai, 20. August und 20. November, zahlbar innert 30 Tagen. Sie dürfen die Beträge selbst aufteilen und per E-Banking mit der Referenznummer der QR-Rechnung zahlen."],["Zahlungserleichterung","Fristverlängerung oder Teilzahlungen, online über BE-Login oder schriftlich und begründet. Kein Rechtsanspruch."],["Verzugszins","Ab dem 31. Tag nach Fälligkeit, auch während einer Zahlungserleichterung. Er wird nach der letzten Teilzahlung separat in Rechnung gestellt."],["Steuererlass","Für rechtskräftig veranlagte Steuern möglich, die Hürden sind aber hoch. Erfüllen Sie sie nicht, bleibt die Zahlungserleichterung."]],"steps":["Prüfen, ob Teilbeträge auf die Ratenrechnungen reichen (selbst aufteilen ist erlaubt).","Sonst Zahlungserleichterung beantragen: online über BE-Login oder mit einem begründeten Brief an die Steuerverwaltung.","Die vereinbarten Teilzahlungen pünktlich leisten. Der Verzugszins kommt am Schluss separat."],"who":[0,1,0],"note":"Den Bezug der Kantons-, Gemeinde- und Kirchensteuern sowie der direkten Bundessteuer macht im Kanton Bern die kantonale Steuerverwaltung.","src":["Steuerverwaltung Bern: Zahlungserleichterungen","Steuerverwaltung Bern: Steuern bezahlen","Steuerverwaltung Bern: Steuererlass"]},"kg":{"intro":"Im Kanton Bern kommt jedes Kind in den Kindergarten, das bis und mit 31. Juli vier Jahre alt wird, und zwar im August. Ein Anmeldeformular müssen Sie nicht suchen: Die Wohngemeinde schickt es Ihnen automatisch.","facts":[["Stichtag","4. Geburtstag bis und mit 31. Juli: Eintritt in Kindergarten oder Basisstufe im August desselben Jahres."],["Dauer","Der Kindergarten dauert in der Regel zwei Jahre."],["Später eintreten","Je nach Entwicklungsstand dürfen Eltern ihr Kind ein Jahr später ins erste Kindergartenjahr schicken. Das vermerken sie auf dem Anmeldeformular."],["Stadt Bern","Fragen beantwortet das Schulamt der Stadt Bern: 031 321 64 60, schulamt@bern.ch."]],"steps":["Auf das Anmeldeformular der Wohngemeinde warten; es kommt automatisch per Post.","Formular ausfüllen. Wenn Ihr Kind ein Jahr später eintreten soll, das auf dem Formular vermerken.","Formular zurückschicken. Ihr Kind beginnt im August."],"who":[0,1,1],"note":"Die Regeln zur Volksschule setzt der Kanton Bern (Bildungs- und Kulturdirektion). Die Anmeldung und die Zuteilung macht die Wohngemeinde, in der Stadt Bern das Schulamt.","src":["Kanton Bern: Eintritt in die Volksschule","Kanton Bern: Elterninformation Kindergarten","Stadt Bern: Schule"]},"ank":{"intro":"Sind Sie mit der Mutter nicht verheiratet, anerkennen Sie das Kind persönlich beim Zivilstandsamt, am besten schon vor der Geburt. Im Kanton Bern kostet die Anerkennung CHF 75.","facts":[["Zeitpunkt","Vor oder nach der Geburt möglich. Empfohlen ist vor der Geburt."],["Ablauf","Das Zivilstandsamt sagt Ihnen, welche Unterlagen nötig sind. Nach Eingang lädt es Sie zu einem Termin ein; dort erklären Sie die Anerkennung persönlich und zeigen Pass oder ID."],["Gemeinsame Sorge","Die Erklärung über die gemeinsame elterliche Sorge können Sie zusammen mit der Mutter gleich bei der Anerkennung abgeben oder später bei der KESB am Wohnsitz des Kindes."],["Kosten","Anerkennung CHF 75. Anerkennungsurkunde CHF 30 (plus allfälliges Porto)."]],"steps":["Beim Zivilstandsamt nachfragen, welche Unterlagen Sie einreichen müssen.","Unterlagen einreichen und den Termin vereinbaren, zu dem das Zivilstandsamt Sie einlädt.","Am Termin die Anerkennung persönlich erklären (Pass oder ID mitnehmen) und, wenn gewünscht, mit der Mutter die gemeinsame elterliche Sorge erklären."],"who":[1,1,0],"note":"Das Kindesrecht steht im ZGB. Die Anerkennung nimmt das kantonale Zivilstandsamt entgegen, eine spätere Sorgeerklärung die KESB.","src":["Kanton Bern: Kindesanerkennung","ch.ch: Ein Kind anerkennen","KESB Kanton Bern: Vaterschaft und Anerkennung"]},"geb":{"intro":"Jede Geburt muss innert drei Tagen dem Zivilstandsamt gemeldet werden. Kommt Ihr Kind im Spital oder Geburtshaus zur Welt, macht das die Institution. Sie füllen das Formular «Meldung der Geburt» mit Vornamen und Familiennamen aus.","facts":[["Frist","Innert drei Tagen nach der Geburt beim Zivilstandsamt des Geburtsorts."],["Wer meldet","Spital oder Geburtshaus. Bei einer Hausgeburt: Ärztin, Arzt, Hebamme, eine andere anwesende Person oder die Mutter."],["Namen","Die Eltern tragen Vornamen und Familiennamen des Kindes auf dem Formular «Meldung der Geburt» ein."],["Geburtsurkunde","Beim Zivilstandsamt des Geburtsorts bestellen; CHF 30 plus Porto."]],"steps":["Im Spital oder Geburtshaus: das Formular mit den Namen ausfüllen, die Institution meldet die Geburt.","Bei einer Hausgeburt: innert drei Tagen beim Zivilstandsamt des Geburtsorts melden, mit Pass oder ID, der Geburtsbestätigung von Ärztin, Arzt oder Hebamme und, falls vorhanden, dem Familienbüchlein.","Bei Bedarf die Geburtsurkunde beim Zivilstandsamt bestellen."],"who":[1,1,0],"note":"Das Personenstandsrecht regelt der Bund (ZGB, Zivilstandsverordnung). Die Geburt beurkundet das kantonale Zivilstandsamt.","src":["Kanton Bern: Geburt","Kanton Bern: Formular Meldung der Geburt","ch.ch: Geburt anmelden"]},"fis":{"intro":"Im Kanton Bern lösen Sie das Fischereipatent online, in der App «Fischen Bern» oder bei einer der über 30 Agenturen. Für Tages- und Wochenpatente brauchen Sie keinen Kurs; für das Jahrespatent einen Sachkunde-Nachweis (SaNa).","facts":[["Jahrespatent","Erwachsene mit Wohnsitz im Kanton Bern: CHF 250 plus CHF 50 Hegebeitrag (Mitglieder des Bernisch Kantonalen Fischerei-Verbands sind davon befreit). Ohne Wohnsitz im Kanton: CHF 500 plus Hegebeitrag. Jugendliche unter 16: CHF 72."],["Kurzpatente","Wochenpatent CHF 100, Tagespatent CHF 32. Ohne vorherigen Kurs erhältlich."],["Sachkunde-Nachweis","Für Jahres- und Monatspatente nötig. Den Kurs bietet das Netzwerk Anglerausbildung an."],["Kauf","Online mit E-Mail-Adresse und Kreditkarte, PostFinance Card oder Twint, in der App «Fischen Bern» oder bei einer Agentur."]],"steps":["Patentart wählen: Tag oder Woche ohne Kurs; Jahr oder Monat mit Sachkunde-Nachweis.","Für ein Jahrespatent zuerst den SaNa-Kurs beim Netzwerk Anglerausbildung machen.","Patent online, in der App «Fischen Bern» oder bei einer Agentur kaufen und die Vorschriften zur Angelfischerei beachten."],"who":[1,1,0],"note":"Die Grundregeln (zum Beispiel den Sachkunde-Nachweis) setzt das Bundesrecht. Patente und Preise legt der Kanton Bern fest, zuständig ist das Fischereiinspektorat.","src":["Kanton Bern: Fischereipatente und Preise","Kanton Bern: Fischereipatent beziehen","Kanton Bern: FAQ Angelfischerei","Kanton Bern: App «Fischen Bern»"]},"gba":{"intro":"Im Kanton Bern bestellen Sie einen Grundbuchauszug über das Online-Bestellformular der Grundbuchämter. Öffentliche Angaben zu einem Grundstück sehen Sie jederzeit kostenlos in GRUDIS public.","facts":[["GRUDIS public","Kostenlos für alle: Bezeichnung und Beschreibung des Grundstücks, Name der Eigentümer (ohne Adresse), Eigentumsform, Erwerbsdatum, Dienstbarkeiten, Grundlasten und Anmerkungen. Seit 1. September 2025 gibt es Eigentumsauskünfte nur noch hier."],["Öffentlicher Auszug","Enthält nur die öffentlichen Angaben. CHF 20 pro Grundstück; jeder weitere Auszug für dieselbe Eigentümerschaft, gleichzeitig bestellt, CHF 10."],["Vollständiger Auszug","CHF 20 pro Grundstück. Berechtigt sind Eigentümer, Dienstbarkeitsberechtigte und Grundpfandgläubiger. Alle anderen brauchen einen Interessennachweis (zum Beispiel eine Vollmacht), den Sie beim Bestellen hochladen."],["Weitere Gebühren","Belegkopie: CHF 20 bis 10 Seiten, danach CHF 1 pro Seite, höchstens CHF 100. Eigentümerregisterauszug: CHF 20."]],"steps":["Prüfen, ob die öffentlichen Angaben in GRUDIS public genügen; das ist kostenlos.","Sonst die Art wählen: öffentlicher Auszug oder vollständiger Auszug.","Online-Bestellformular ausfüllen und, wenn Sie nicht berechtigt sind, einen Interessennachweis hochladen."],"who":[1,1,0],"note":"Das Grundbuch regelt das Zivilgesetzbuch (Bundesrecht). Geführt wird es im Kanton Bern von den kantonalen Grundbuchämtern, die auch die Gebühren festlegen.","src":["Kanton Bern: Bestellungen Grundbuchamt","Kanton Bern: GRUDIS public","Kanton Bern: FAQ Grundbuch","Kanton Bern: Eigentumsauskunft"]},"zst":{"intro":"Im Kanton Bern bestellen Sie Zivilstandsdokumente online auf der Website des zuständigen Zivilstandsamts oder direkt am Schalter. Der Kanton hat sieben Zivilstandsämter.","facts":[["Zuständig","Für Schweizerinnen und Schweizer das Zivilstandsamt des Heimatorts, für Ausländerinnen und Ausländer das Zivilstandsamt des Wohnorts."],["Personenstandsausweis","Aktuelle Personendaten, Zivilstand, Name und (bei Schweizern) Heimatorte. CHF 30 plus Porto. Bestellen kann ihn die betroffene Person."],["Weitere Dokumente","Heimatschein CHF 30. Geburtsurkunde CHF 30. Familienausweis CHF 40; nach einem neuen Zivilstandsereignis wird er kostenlos nachgeführt. Ausweis über den registrierten Familienstand CHF 40 plus CHF 10 pro eingetragene Person. Jeweils plus Porto."],["Zustellung an Dritte","Mit einer Vollmacht schickt das Amt das Dokument an eine andere Person, auf Wunsch samt Rechnung."]],"steps":["Klären, welches Dokument verlangt wird (zum Beispiel Personenstandsausweis oder Familienausweis).","Zuständiges Zivilstandsamt bestimmen: Heimatort für Schweizer, Wohnort für Ausländer.","Dokument online bestellen oder am Schalter abholen; für Zustellung an Dritte eine Vollmacht beilegen."],"who":[1,1,0],"note":"Das Zivilstandsregister (Infostar) und die Dokumente regelt der Bund. Die Ämter im Kanton Bern stellen sie aus.","src":["Kanton Bern: Dokumente online bestellen","Kanton Bern: Personenstandsausweis","Kanton Bern: Ausweis über den Familienstand","Kanton Bern: Familienausweis","Kanton Bern: Heimatschein","ch.ch: Zivilstandsdokumente"]},"rv":{"intro":"Haben Sie einen Zahlungsbefehl erhalten und schulden den Betrag nicht, erheben Sie Rechtsvorschlag: mündlich oder schriftlich bei der Zustellung oder innert 10 Tagen beim Betreibungsamt. Das kostet nichts.","facts":[["Frist","Bei der Zustellung des Zahlungsbefehls oder innert 10 Tagen danach, beim Betreibungsamt."],["Form und Kosten","Mündlich oder schriftlich. Der Rechtsvorschlag selbst ist kostenlos."],["Wirkung","Die Betreibung stoppt. Will der Gläubiger weitermachen, muss er vor Gericht gehen; das Gericht entscheidet, ob die Betreibung weitergeht."],["Eintrag nicht mehr zeigen","Frühestens 3 Monate nach Zustellung des Zahlungsbefehls können Sie beim Betreibungsamt verlangen, dass die Betreibung Dritten nicht mehr bekanntgegeben wird. Weist der Gläubiger nicht innert 20 Tagen nach, dass er ein Verfahren eingeleitet hat, wird sie nicht mehr angezeigt. Gebühr: CHF 40. Seit 1. Januar 2026 geht das während der ganzen 5 Jahre, in denen Dritte Einsicht haben."]],"steps":["Zahlungsbefehl prüfen: Schulden Sie den Betrag?","Wenn nicht: innert 10 Tagen beim Betreibungsamt Rechtsvorschlag erheben, mündlich oder schriftlich.","Nach frühestens 3 Monaten beim Betreibungsamt das Gesuch um Nichtbekanntgabe stellen (CHF 40)."],"who":[1,0,0],"note":"Das Verfahren regelt das Bundesgesetz über Schuldbetreibung und Konkurs (SchKG). Zuständig ist das Betreibungsamt, das den Zahlungsbefehl ausgestellt hat; im Kanton Bern sind das die regionalen Betreibungsämter.","src":["ch.ch: Zahlungsbefehl, Rechtsvorschlag","Bundesamt für Justiz: mehr Schutz vor ungerechtfertigten Betreibungen","Bundesamt für Justiz: Formular Nichtbekanntgabe","Kanton Bern: Betreibung und Konkurs"]},"mof":{"intro":"Ein Mofa oder ein schnelles E-Bike (Tretunterstützung bis 45 km/h) lösen Sie im Kanton Bern beim Strassenverkehrsamt ein. Sie brauchen den Original-Fahrzeugausweis, ein Nummernschild und eine Vignette.","facts":[["Wer muss","E-Bikes mit Unterstützung bis 25 km/h und höchstens 500 Watt brauchen kein Kontrollschild. Mit Unterstützung bis 45 km/h gilt das E-Bike als Motorfahrrad und braucht ein gelbes Kontrollschild."],["Unterlagen","Original-Fahrzeugausweis und das vollständig ausgefüllte Formular «Mofa / E-Bike»."],["Kosten","Nummernschild CHF 10. Vignette mit Kollektiv-Haftpflichtversicherung CHF 32 pro Jahr (Vignette CHF 20, Versicherung CHF 12). Neuer Fahrzeugausweis bei Halterwechsel CHF 30."],["Vignette erneuern","Gilt bis 31. Mai. Im Februar kommt automatisch die Rechnung; nach Zahlung wird die neue Vignette per Post geschickt."]],"steps":["Prüfen, ob Ihr Fahrzeug ein Kontrollschild braucht (Mofa oder E-Bike bis 45 km/h).","Formular «Mofa / E-Bike» ausfüllen und mit dem Original-Fahrzeugausweis beim Strassenverkehrsamt einreichen, per Post oder am Schalter.","Nummernschild und Vignette anbringen; jedes Jahr im Februar die Rechnung für die neue Vignette bezahlen."],"who":[1,1,0],"note":"Welche Fahrzeuge ein Kontrollschild brauchen, regelt der Bund. Einlösung und Vignetten sind Sache des Strassenverkehrs- und Schifffahrtsamts des Kantons Bern.","src":["Kanton Bern: Motorfahrrad / E-Bike anmelden","Kanton Bern: Vignette erneuern","Kanton Bern: Informationen zu E-Bikes und Mofas","Kanton Bern: Erneuerung der Vignetten 2026"]},"waf":{"intro":"Für den Kauf der meisten Feuerwaffen brauchen Sie einen Waffenerwerbsschein. Im Kanton Bern stellen Sie das Gesuch online über Suisse ePolice oder per Formular an die Kantonspolizei. Die Gebühr beträgt CHF 50.","facts":[["Voraussetzungen","Mindestens 18 Jahre alt. Kein Strafregistereintrag wegen einer Tat, die eine gewalttätige oder gemeingefährliche Gesinnung zeigt, oder wegen wiederholter Verbrechen oder Vergehen. Nicht unter umfassender Beistandschaft und nicht durch eine vorsorgebeauftragte Person vertreten."],["Gesuch","An das Waffenbüro des Wohnkantons. Im Kanton Bern online über Suisse ePolice oder mit dem Formular an Kantonspolizei Bern, Fachbereich WSG, Postfach, 3001 Bern. Beilage unter anderem: Kopie von gültigem Pass oder ID."],["Kosten","CHF 50."],["Umfang","Mit einem Waffenerwerbsschein können Sie höchstens 3 Waffen beim selben Veräusserer erwerben."]],"steps":["Prüfen, ob die Waffe bewilligungspflichtig ist und Sie die Voraussetzungen erfüllen.","Gesuch online über Suisse ePolice oder per Formular an die Kantonspolizei Bern einreichen, mit den verlangten Beilagen.","Mit dem Waffenerwerbsschein die Waffe kaufen."],"who":[1,1,0],"note":"Das Waffenrecht ist Bundesrecht (fedpol). Die Bewilligungen erteilt das kantonale Waffenbüro, im Kanton Bern die Kantonspolizei.","src":["Kantonspolizei Bern: Waffen","fedpol: Häufige Fragen zum Waffenrecht","ch.ch: Waffen kaufen","fedpol: Erläuterungen zur Waffenverordnung"]},"sti":{"intro":"Im Kanton Bern beantragen Sie Stipendien online über StipBE-Online bei der Abteilung Ausbildungsbeiträge. Das Gesuch muss bis zum Eingabetermin vollständig mit Belegen eingetroffen sein; rückwirkend gibt es keine Beiträge.","facts":[["Wer kann","Wer eine erste Ausbildung macht und dessen Eltern im Kanton Bern wohnen. Ausländerinnen und Ausländer mit bernischer Niederlassungsbewilligung C oder mit 5 Jahren Wohnsitz in der Schweiz und Aufenthaltsbewilligung B."],["Eingabetermin","30. Juni für Ausbildungsjahre, die zwischen 1. Januar und 30. Juni beginnen; 31. Dezember für Ausbildungsjahre, die zwischen 1. Juli und 31. Dezember beginnen."],["Einreichen","Gesuch in StipBE-Online erfassen (mit BE-Login). Dann Gesuch, Belegliste und unterschriebene Freigabequittung ausdrucken und mit den Belegen per Post schicken. Erst dann gilt das Gesuch als eingereicht."],["Kontakt","Abteilung Ausbildungsbeiträge: 031 633 83 40, aab@be.ch."]],"steps":["Bei BE-Login registrieren und in StipBE-Online das Gesuch für das Ausbildungsjahr erfassen.","Gesuch, Belegliste und Freigabequittung ausdrucken, Freigabequittung unterschreiben.","Alles mit den Belegen vor dem Eingabetermin per Post an die Abteilung Ausbildungsbeiträge schicken."],"who":[0,1,0],"note":"Stipendien und Darlehen sind Sache der Kantone. Im Kanton Bern ist die Abteilung Ausbildungsbeiträge der Bildungs- und Kulturdirektion zuständig.","src":["Kanton Bern: Stipendien","Kanton Bern: Fragen und Antworten zu StipBE-Online","Kanton Bern: Ausbildungsbeiträge","Kanton Bern: Darlehen"]},"miet":{"intro":"Sinkt der hypothekarische Referenzzinssatz unter den Satz, auf dem Ihre Miete beruht, können Sie beim Vermieter eine Senkung verlangen. Aktuell liegt er bei 1,25 % (seit 2. September 2025, am 2. September 2026 bestätigt).","facts":[["Welcher Satz gilt","Meist steht er im Mietvertrag. Wurde die Miete seither wegen des Referenzzinssatzes angepasst und nicht angefochten, gilt der Satz dieser Anpassung."],["Wie viel","Pro 0,25 Prozentpunkte Senkung besteht in der Regel Anspruch auf 2,91 % weniger Miete, zum Beispiel von 1,5 % auf 1,25 %. Angepasst wird nur die Nettomiete; andere Kostenfaktoren können mit verrechnet werden."],["Ab wann","Frühestens auf den nächsten möglichen Kündigungstermin."],["Fristen","Der Vermieter muss innert 30 Tagen antworten. Lehnt er ab oder antwortet nicht, können Sie innert weiteren 30 Tagen an die Schlichtungsbehörde gelangen, also spätestens 60 Tage nach Ihrem Gesuch."]],"steps":["Im Mietvertrag nachsehen, auf welchem Referenzzinssatz die Miete beruht.","Senkung schriftlich beim Vermieter verlangen, am besten eingeschrieben.","Ohne Antwort oder bei Ablehnung innert 60 Tagen nach dem Gesuch an die Schlichtungsbehörde gelangen."],"who":[1,0,0],"note":"Das Mietrecht ist Bundesrecht (Obligationenrecht). Den Referenzzinssatz gibt das Bundesamt für Wohnungswesen (BWO) vierteljährlich bekannt.","src":["ch.ch: Mietzins und Referenzzinssatz","BWO: hypothekarischer Referenzzinssatz","BWO: Referenzzinssatz bleibt bei 1,25 %","BWO: Referenzzinssatz sinkt auf 1,25 %"]},"qst":{"intro":"Wer quellensteuerpflichtig ist und in der Schweiz wohnt, kann im Kanton Bern eine nachträgliche ordentliche Veranlagung (NOV) beantragen, etwa um Abzüge geltend zu machen. Der Antrag muss bis 31. März des Folgejahres eingereicht sein.","facts":[["Wer Quellensteuer zahlt","Ausländische Arbeitnehmende mit Wohnsitz in der Schweiz ohne Niederlassungsbewilligung C. Der Arbeitgeber zieht die Steuer monatlich vom Lohn ab und überweist sie der kantonalen Steuerverwaltung."],["Freiwillige NOV","Mit dem Formular «Antrag nachträgliche ordentliche Veranlagung (NOV) für Ansässige», bis 31. März des Folgejahres. Ein gültiger Antrag kann nicht zurückgezogen werden; danach wird jedes Jahr bis zum Ende der Quellensteuerpflicht ordentlich veranlagt. Die abgezogene Quellensteuer wird ohne Zins angerechnet."],["Obligatorische NOV","Wenn Sie (oder Ihr Ehepartner) im Jahr mindestens CHF 120 000 brutto quellensteuerpflichtiges Einkommen haben, am Jahresende mindestens CHF 150 000 steuerbares Vermögen besitzen oder mindestens CHF 3 000 weitere Einkünfte haben (zum Beispiel aus selbständiger Tätigkeit)."],["Steuererklärung anfordern","Bei obligatorischer NOV verlangen Sie die Steuererklärung bis 31. März des Folgejahres bei der kantonalen Steuerverwaltung."]],"steps":["Prüfen, ob die NOV für Sie obligatorisch ist (Einkommen, Vermögen, weitere Einkünfte).","Wenn nicht: Entscheiden, ob Sie freiwillig eine NOV wollen; sie gilt danach jedes Jahr.","Antragsformular oder Anfrage für die Steuererklärung bis 31. März des Folgejahres an die Steuerverwaltung des Kantons Bern schicken."],"who":[1,1,0],"note":"Die Grundregeln der Quellensteuer stehen im Bundesrecht. Erhoben und veranlagt wird sie von der Steuerverwaltung des Kantons Bern.","src":["Kanton Bern: NOV auf Antrag","Kanton Bern: obligatorische NOV","Kanton Bern: quellensteuerpflichtige Personen","Kanton Bern: Antragsformular NOV","ch.ch: Quellensteuer"]},"erb":{"intro":"Banken verlangen für die Auszahlung oder die Saldierung von Konten einer verstorbenen Person meist einen Erbenschein. Im Kanton Bern stellen ihn Notarinnen und Notare aus, oder die Gemeinde, wenn sie ein Testament eröffnet hat.","facts":[["Testament abgeben","Testamente und Erbverträge der verstorbenen Person müssen Sie sofort der Wohnsitzgemeinde abgeben. Die Gemeinde eröffnet das Testament innert eines Monats nach Erhalt."],["Erbenschein der Gemeinde","Auf Antrag einer eingesetzten Erbin oder eines eingesetzten Erben, wenn innert 30 Tagen keine Einsprache gegen das eröffnete Testament eingegangen ist."],["Erbenschein vom Notariat","Gebühr nach Zeitaufwand, mindestens CHF 200."],["Erbe ausschlagen","Frist 3 Monate: ab dem Tod, wenn Sie gesetzlich erben; ab der amtlichen Mitteilung, wenn Sie in einem Testament oder Erbvertrag eingesetzt sind. Zuständig ist das Regierungsstatthalteramt."]],"steps":["Testament oder Erbvertrag sofort der Wohnsitzgemeinde der verstorbenen Person abgeben.","Erbenschein bei der Gemeinde (nach Testamentseröffnung) oder bei einem Notariat verlangen.","Wenn Sie das Erbe nicht wollen: innert 3 Monaten beim Regierungsstatthalteramt ausschlagen."],"who":[1,1,1],"note":"Das Erbrecht ist Bundesrecht (Zivilgesetzbuch). Im Kanton Bern eröffnen die Gemeinden Testamente, Notariate stellen Erbenscheine aus und die zehn Regierungsstatthalterämter sind für Ausschlagung und Inventare zuständig.","src":["Kanton Bern: Testament, Erbvertrag, Erbenschein","Kanton Bern: Checkliste für Erbinnen und Erben","Kanton Bern: Erbschaftsausschlagung","Kanton Bern: Verordnung über die Notariatsgebühren","Kanton Bern: zuständiges Regierungsstatthalteramt"]},"upk":{"intro":"Für einen Umzug in der Innenstadt oder wenn Sie im Parkverbot halten wollen, brauchen Sie in der Stadt Bern eine Zufahrts- und Parkbewilligung. Sie ist kostenlos und muss mindestens 8 Arbeitstage vorher beantragt werden.","facts":[["Voraussetzungen","Mindestens eine der beiden Adressen liegt in der Stadt Bern. Zügeln Privatpersonen, gilt die Bewilligung für höchstens einen Tag, 7 bis 20 Uhr, nicht an Sonn- und Feiertagen."],["Antrag","Online-Formular oder PDF-Gesuch, mindestens 8 Arbeitstage vor dem Umzug. Kostenlos."],["Parkverbot signalisieren","Entweder über ein Umzugsunternehmen, das die Signale aufstellt und wieder abholt, oder selbst bei der Signalisationsabteilung der Kantonspolizei bestellen (031 638 67 00, signalisationen-bern@police.be.ch), ebenfalls mindestens 8 Arbeitstage vorher."],["Kontakt","Orts- und Gewerbepolizei Stadt Bern: 031 321 52 17."]],"steps":["Mindestens 8 Arbeitstage vor dem Umzug die Zufahrts- und Parkbewilligung online beantragen.","Parkverbot-Signale beim Umzugsunternehmen oder bei der Kantonspolizei bestellen.","Am Umzugstag die Bewilligung im Fahrzeug bereithalten."],"who":[0,1,1],"note":"Die Bewilligung erteilt die Orts- und Gewerbepolizei der Stadt Bern; die Signale stellt die Kantonspolizei Bern bereit.","src":["Stadt Bern: Parkbewilligung und Parkverbot für Umzüge","Stadt Bern: Online-Gesuch","Stadt Bern: Umzugstipps"]},"ahl":{"intro":"Fehlende AHV-Beitragsjahre kürzen Ihre Rente. Lücken der letzten fünf Jahre können Sie nachzahlen; ältere nicht. Ob Sie Lücken haben, zeigt ein kostenloser Auszug aus Ihrem individuellen Konto (IK).","facts":[["Auswirkung","Volle Rente gibt es mit 44 Beitragsjahren. Jedes fehlende Jahr kürzt die Rente in der Regel um mindestens 1/44, also rund 2,3 %."],["Nachzahlen","Nur für Lücken der letzten fünf Jahre. Ältere Lücken lassen sich nicht mehr schliessen."],["Jugendjahre","Beitragszeiten zwischen 18 und 20 Jahren können später entstandene Lücken füllen."],["Kontoauszug","Jederzeit ohne Begründung bei einer Ausgleichskasse, die ein Konto für Sie führt; online über ahv-iv.ch. Schriftlich und kostenlos. Nichterwerbstätige zahlen 2026 mindestens CHF 530 pro Jahr, damit keine Lücke entsteht."]],"steps":["Auszug aus dem individuellen Konto online bestellen.","Prüfen, ob in den letzten fünf Jahren Beitragsjahre fehlen.","Fehlende Beiträge bei der zuständigen Ausgleichskasse nachzahlen."],"who":[1,0,0],"note":"Die AHV ist eine Versicherung des Bundes (BSV). Beiträge und Konten führen die Ausgleichskassen.","src":["AHV/IV: Was tun bei Beitragslücken?","BSV: Versicherungs- und Beitragslücken","ch.ch: AHV-Beitragslücken","AHV/IV: Kontoauszug bestellen","AHV/IV: Merkblatt 2.03 Nichterwerbstätige"]},"mdv":{"intro":"Können Sie einen Militärdienst aus beruflichen, schulischen oder gesundheitlichen Gründen nicht leisten, stellen Sie ein Dienstverschiebungsgesuch. Es muss spätestens 14 Wochen vor Dienstbeginn eingereicht sein.","facts":[["Gründe","Beruf, Studium oder Ausbildung sowie medizinische Gründe. Bewilligt wird nur bei zwingenden Gründen und wenn es der Dienst erlaubt."],["Frist und Form","Spätestens 14 Wochen vor Dienstbeginn, begründet und mit Bestätigungen (zum Beispiel vom Arbeitgeber oder der Schule). Online über den Dienstmanager oder mit dem Formular."],["Wichtig","Bis Sie die Bewilligung haben, bleiben Sie einrückungspflichtig."],["Rekrutenschule","Auch die RS kann wegen Beruf, Studium oder aus medizinischen Gründen verschoben werden; in der Regel ist das möglich."]],"steps":["Bestätigung von Arbeitgeber, Schule oder Arzt besorgen.","Gesuch spätestens 14 Wochen vor Dienstbeginn online im Dienstmanager oder per Formular einreichen.","Auf den Entscheid warten und bis dahin wie aufgeboten einrücken."],"who":[1,1,0],"note":"Die Militärdienstpflicht regelt der Bund (Armee). Für einzelne Fragen sind die kantonalen Militärbehörden zuständig.","src":["Armee: Dienstverschiebung","Armee: Dienstverschiebung und Urlaub","ch.ch: Militärdienst","Armee: kantonale Militärbehörden"]},"zivi":{"intro":"Wer den Militärdienst nicht mit dem Gewissen vereinbaren kann, kann Zivildienst leisten. Das Gesuch stellen Sie nur elektronisch über ZiviConnect beim Bundesamt für Zivildienst.","facts":[["Voraussetzungen","Sie haben die Rekrutierung besucht und sind militärdiensttauglich, können den Militärdienst nicht mit Ihrem Gewissen vereinbaren und sind bereit, 1,5-mal so viele Diensttage wie in der Armee zu leisten."],["Gesuch","Nur elektronisch über ZiviConnect, mit einem AGOV-Login."],["Einführungstag","Innert 3 Monaten nach dem Gesuch besuchen (zählt nicht als Diensttag). Danach das Gesuch innert 2 Wochen bestätigen. Nach dem Zulassungsentscheid können Sie es nicht mehr zurückziehen."],["Militärdienst in der Zwischenzeit","Reichen Sie das Gesuch mindestens 3 Monate vor dem nächsten Militärdienst ein, müssen Sie nicht einrücken, solange nicht rechtskräftig entschieden ist. Bei späteren Gesuchen oder während eines laufenden Dienstes bleiben Sie militärdienstpflichtig bis zum Zulassungsentscheid."]],"steps":["AGOV-Login erstellen und in ZiviConnect das Zulassungsgesuch einreichen, wenn möglich mindestens 3 Monate vor dem nächsten Militärdienst.","Innert 3 Monaten den Einführungstag besuchen.","Gesuch innert 2 Wochen danach bestätigen und den Zulassungsentscheid abwarten."],"who":[1,0,0],"note":"Der Zivildienst ist Sache des Bundes; zuständig ist das Bundesamt für Zivildienst (ZIVI).","src":["ZIVI: Zulassung","ZIVI: FAQ","ZIVI: ZiviConnect","ch.ch: Zivildienst"]},"obu":{"intro":"Für eine Ordnungsbusse haben Sie im Kanton Bern 30 Tage Bedenkfrist. Bezahlen Sie in dieser Zeit den ganzen Betrag, ist die Sache erledigt. Sind Sie nicht einverstanden, bezahlen Sie nicht; dann kommt es zum ordentlichen Verfahren.","facts":[["Was ist eine Ordnungsbusse","Eine Busse im vereinfachten Verfahren. Der Bussenkatalog für den Strassenverkehr umfasst Übertretungen mit Bussen bis höchstens CHF 300."],["Bezahlen","Den ganzen Betrag innert 30 Tagen. Ordnungsbussen können nicht abgearbeitet werden."],["Nicht bezahlt","Sie erhalten eine Übertretungsanzeige mit Einzahlungsschein. Läuft auch diese Frist ab, leitet die Polizei die Akten an die Staatsanwaltschaft weiter (ordentliches Verfahren)."],["Ordentliches Verfahren","Werden Sie verurteilt, kommen zur Busse Verfahrenskosten dazu; deren Höhe legt die Justiz fest."]],"steps":["Busse prüfen: Sind Sie einverstanden?","Wenn ja: den ganzen Betrag innert 30 Tagen bezahlen.","Wenn nein: nicht bezahlen; die Sache geht ans ordentliche Verfahren der Staatsanwaltschaft, wo Sie Ihre Sicht darlegen können, mit Kostenrisiko."],"who":[1,1,0],"note":"Das Ordnungsbussenverfahren und den Bussenkatalog regelt der Bund. Bussen ausstellen und einziehen tut im Kanton Bern die Kantonspolizei.","src":["Kantonspolizei Bern: Ordnungsbussen","ch.ch: Verkehrsregeln und Ordnungsbussen","Kantonspolizei Bern: Bussen-App"]},"kau":{"intro":"Die Mietkaution (Mietzinsdepot) liegt auf einem Konto auf Ihren Namen und ist für beide Seiten gesperrt. Nach dem Auszug gibt die Bank sie frei, wenn beide zustimmen, oder spätestens dann, wenn der Vermieter ein Jahr lang nichts rechtlich geltend gemacht hat.","facts":[["Höhe","Bei Wohnungen höchstens drei Monatsmieten. Die Bank hinterlegt sie auf einem Spar- oder Depotkonto auf den Namen der Mieterin oder des Mieters."],["Freigabe","Mit Zustimmung von Mieter und Vermieter, oder gestützt auf einen rechtskräftigen Zahlungsbefehl oder ein rechtskräftiges Gerichtsurteil."],["Nach einem Jahr","Hat der Vermieter innert eines Jahres nach Mietende keinen Anspruch rechtlich geltend gemacht, können Sie die Rückerstattung direkt von der Bank verlangen."],["Rechtsgrundlage","Art. 257e Obligationenrecht."]],"steps":["Nach der Wohnungsabgabe den Vermieter um eine schriftliche Freigabe der Kaution bitten.","Die Freigabe der Bank schicken; sie zahlt das Guthaben aus.","Ohne Freigabe: ein Jahr nach Mietende die Rückerstattung bei der Bank verlangen, sofern der Vermieter keinen Anspruch rechtlich geltend gemacht hat."],"who":[1,0,0],"note":"Das Mietrecht ist Bundesrecht (Obligationenrecht); Informationen gibt das Bundesamt für Wohnungswesen (BWO).","src":["BWO: Merkblatt Mietzinsdepots","BWO: Portal Mietrecht","ch.ch: Mietvertrag abschliessen"]},"zeug":{"intro":"Sie können von Ihrem Arbeitgeber jederzeit ein Arbeitszeugnis verlangen, auch während der Anstellung (Art. 330a OR). Der Anspruch verjährt erst 10 Jahre nach Ende des Arbeitsverhältnisses.","facts":[["Vollzeugnis","Angaben über Art und Dauer der Anstellung sowie über Leistung und Verhalten (Art. 330a Abs. 1 OR)."],["Arbeitsbestätigung","Nur Art und Dauer der Anstellung, ohne Bewertung (Art. 330a Abs. 2 OR). Sie können sie statt eines Vollzeugnisses verlangen."],["Wann","Jederzeit, also auch als Zwischenzeugnis während der Anstellung. Verjährung: 10 Jahre ab Ende des Arbeitsverhältnisses."],["Fehler","Enthält das Zeugnis Ungenauigkeiten, Fehler oder Unwahrheiten, können Sie eine Änderung verlangen."]],"steps":["Arbeitszeugnis (oder nur eine Arbeitsbestätigung) schriftlich beim Arbeitgeber verlangen.","Zeugnis auf Fehler und unwahre Angaben prüfen.","Falls nötig schriftlich eine Berichtigung verlangen."],"who":[1,0,0],"note":"Das Arbeitsrecht ist Bundesrecht (Obligationenrecht). Auskunft gibt das Staatssekretariat für Wirtschaft (SECO).","src":["ch.ch: Arbeitszeugnis","SECO: FAQ Arbeitszeugnis"]},"krl":{"intro":"Sind Sie krank und können nicht arbeiten, muss der Arbeitgeber den Lohn eine beschränkte Zeit weiterzahlen, wenn das Arbeitsverhältnis mehr als drei Monate gedauert hat oder dafür eingegangen wurde (Art. 324a OR): im ersten Dienstjahr mindestens 3 Wochen, danach länger.","facts":[["Ohne Taggeldversicherung","100 % Lohn ab dem ersten Krankheitstag. Im ersten Dienstjahr mindestens 3 Wochen, danach eine angemessen längere Zeit. Gerichte bestimmen die Dauer nach der Berner, Zürcher oder Basler Skala, sofern Vertrag oder GAV nichts Besseres vorsehen."],["Mit Krankentaggeldversicherung","Die meisten Versicherungen zahlen 80 % des Lohns während 720 oder 730 Tagen innert 900 Tagen. Als gleichwertig gilt sie nur, wenn der Arbeitgeber mindestens die Hälfte der Prämie bezahlt."],["Arztzeugnis","Der Arbeitgeber darf es grundsätzlich ab dem ersten Tag verlangen; viele Verträge verlangen es erst ab dem 3. oder 4. Tag."],["Vertrauensarzt","Bei längerer Arbeitsunfähigkeit können Versicherung oder Arbeitgeber eine Untersuchung bei einem unabhängigen Arzt anordnen. Dieser gibt nur über die Arbeitsfähigkeit Auskunft, nicht über die Diagnose."]],"steps":["Arbeitgeber sofort informieren, dass Sie krank sind.","Arztzeugnis besorgen, wenn es Vertrag oder Arbeitgeber verlangen.","Im Arbeitsvertrag oder GAV nachsehen, ob eine Krankentaggeldversicherung besteht und was sie zahlt."],"who":[1,0,0],"note":"Die Lohnfortzahlung regelt das Obligationenrecht (Bundesrecht). Auskunft gibt das Staatssekretariat für Wirtschaft (SECO).","src":["SECO: FAQ Verhinderung an der Arbeitsleistung","ch.ch: Arbeitsunfähigkeit"]},"fer":{"intro":"Arbeitnehmende haben pro Dienstjahr mindestens 4 Wochen Ferien, bis zum vollendeten 20. Altersjahr 5 Wochen (Art. 329a OR). Vertrag oder GAV können mehr vorsehen.","facts":[["Mindestanspruch","4 Wochen pro Dienstjahr; bis 20 Jahre 5 Wochen."],["Am Stück","Mindestens 2 Wochen pro Dienstjahr müssen zusammenhängen. Sprechen keine konkreten betrieblichen Gründe dagegen, muss der Arbeitgeber auch 3 Wochen am Stück gewähren."],["Auszahlen","Während des Arbeitsverhältnisses dürfen Ferien nicht durch Geld abgegolten werden (Art. 329d Abs. 2 OR). Am Ende ist eine Auszahlung in gewissen Fällen möglich; in der Kündigungsfrist sollen Ferien wenn möglich bezogen werden."],["Krankheit und Verfall","Werden Sie in den Ferien krank und ist Erholung nicht möglich, haben Sie Anspruch auf Nachgewährung. Bei unverschuldeter Verhinderung bis zu einem Monat pro Dienstjahr darf der Arbeitgeber die Ferien nicht kürzen. Ferienansprüche verjähren nach 5 Jahren."]],"steps":["Im Arbeitsvertrag oder GAV nachsehen, wie viele Ferien Ihnen zustehen.","Ferien rechtzeitig mit dem Arbeitgeber absprechen; mindestens 2 Wochen am Stück sind garantiert.","Bei Krankheit in den Ferien sofort ein Arztzeugnis besorgen und den Arbeitgeber informieren."],"who":[1,0,0],"note":"Der Ferienanspruch steht im Obligationenrecht (Bundesrecht). Auskunft gibt das Staatssekretariat für Wirtschaft (SECO).","src":["SECO: FAQ zu Ferien","ch.ch: Ferien, Feiertage und Abwesenheiten"]},"ueb":{"intro":"Überstunden werden mit dem Lohn plus mindestens 25 % Zuschlag bezahlt oder, wenn beide einverstanden sind, mit gleich viel Freizeit ausgeglichen. Der Arbeitsvertrag kann die Entschädigung für Überstunden schriftlich ausschliessen, die für Überzeit aber nicht.","facts":[["Überstunden","Arbeit über die vertraglich vereinbarte Arbeitszeit hinaus. Entschädigung: Lohn plus mindestens 25 % Zuschlag, ausser schriftlich anders vereinbart (tieferer oder kein Zuschlag oder ganz ausgeschlossen)."],["Freizeit statt Geld","Ausgleich durch Freizeit von mindestens gleicher Dauer, wenn Arbeitnehmer und Arbeitgeber einverstanden sind. Dabei sieht das Gesetz keinen Zuschlag vor."],["Überzeit","Arbeit über die gesetzliche Höchstarbeitszeit hinaus: 45 Stunden pro Woche für Industrie und Büropersonal, 50 Stunden für die übrigen Arbeitnehmenden. Ihre Entschädigung kann nicht vertraglich wegbedungen werden."],["Vertrag prüfen","Ob und wie Überstunden entschädigt werden, steht oft im Arbeitsvertrag oder GAV."]],"steps":["Geleistete Stunden genau aufschreiben.","Im Arbeitsvertrag oder GAV nachsehen, was für Überstunden vereinbart ist.","Mit dem Arbeitgeber Auszahlung oder Kompensation durch Freizeit vereinbaren."],"who":[1,0,0],"note":"Überstunden regelt das Obligationenrecht, Überzeit und Höchstarbeitszeit das Arbeitsgesetz (beides Bundesrecht). Auskunft gibt das SECO.","src":["SECO: FAQ zu Überstunden","SECO: Arbeits- und Ruhezeiten"]}}},"fr":{"ask_label":"Que souhaitez-vous savoir ?","send":"Envoyer la question","nav":["Vue citoyenne","Vue des autorités","Projet","Accueil","Menu","Pages"],"f_links":["Contact","Vue des autorités","Vue citoyenne","Projet"],"f_sender":"Concept privé de Bilal Simsek, Berne. Pas une offre d'une autorité. Vos retours sont les bienvenus : {c}","f_legal":"Protection des données, conditions d'utilisation et accessibilité ne sont pas développées dans le concept. Le prototype ne collecte aucune donnée personnelle, ne dépose aucun cookie et n'utilise aucun outil d'analyse ; seul le fait que vous avez lu l'avertissement est mémorisé localement dans le navigateur.","f_note":"Prototype conceptuel. Toutes les réponses sont des exemples et ne remplacent pas un renseignement officiel.","banner_s":"Prototype conceptuel, pas un site officiel","skip":"Aller au contenu","chips":[{"l":"Déménagement","q":"Je déménage de Berne à Winterthour : comment et jusqu’à quand dois-je annoncer mon départ et mon arrivée ?"},{"l":"Passeport & ID","q":"J’habite à Berne et j’ai besoin d’un nouveau passeport et d’une carte d’identité. Comment et où les commander ?"},{"l":"Délai fiscal","q":"J’habite à Berne et je n’arrive pas à remplir ma déclaration d’impôt d’ici la mi-mars. Comment prolonger le délai et combien cela coûte-t-il ?"},{"l":"Rente AVS","q":"Je suis né(e) en 1962 et j’habite à Thoune : quand et où dois-je demander ma rente AVS ?"},{"l":"Chômage","q":"J’habite à Thoune et je perds mon emploi à la fin du mois. Où et quand dois-je m’annoncer, et comment obtenir des indemnités de chômage ?"},{"l":"Changer de caisse","q":"Jusqu’à quand puis-je changer de caisse-maladie et comment faire ?"},{"l":"Entreprise individuelle","q":"J’habite à Berne et je me mets à mon compte avec une entreprise individuelle. Que dois-je annoncer, et où ?"},{"l":"Permis étranger","q":"J’habite à Berne depuis quelques mois et j’ai un permis de conduire allemand. Dois-je l’échanger, et comment ?"},{"l":"Se marier","q":"Nous sommes tous deux Suisses, habitons à Zurich et voulons nous marier. Comment cela se passe-t-il et combien cela coûte-t-il ?"},{"l":"Annoncer un chien","q":"J’habite en ville de Berne et j’ai repris un chien. Où dois-je l’annoncer et combien cela coûte-t-il ?"},{"l":"Allocations familiales","q":"Je suis salarié(e) à Berne et j’ai eu un bébé. Comment obtenir les allocations pour enfant et combien reçoit-on ?"},{"l":"Extrait des poursuites","q":"J’habite à Berne et j’ai besoin d’un extrait du registre des poursuites pour un nouvel appartement. Où le commander et combien coûte-t-il ?"},{"l":"Casier judiciaire","q":"J’ai besoin d’un extrait du casier judiciaire pour un nouvel emploi. Comment le commander et combien de temps cela prend-il ?"},{"l":"Immatriculer une voiture","q":"J’habite à Berne et j’ai acheté une voiture d’occasion. Comment l’immatriculer et combien cela coûte-t-il ?"},{"l":"Naturalisation","q":"Je vis en Suisse depuis 12 ans, dont 3 en ville de Berne, et j’ai le permis C. Puis-je me faire naturaliser et combien cela coûte-t-il ?"},{"l":"Réduction des primes","q":"J’habite dans le canton de Berne et je gagne peu. Ai-je droit à une réduction des primes et dois-je la demander ?"},{"l":"Taxe d’exemption","q":"J’ai 22 ans, j’habite à Berne et j’ai été déclaré inapte au service militaire. Dois-je payer la taxe d’exemption et combien ?"},{"l":"Abri de jardin","q":"J’habite en ville de Berne et je veux installer un petit abri de jardin. Ai-je besoin d’un permis de construire ?"},{"l":"Document perdu","q":"J’habite à Berne et j’ai perdu ma carte d’identité. Que dois-je faire et combien cela coûte-t-il ?"},{"l":"Bons de garde","q":"Nous habitons en ville de Berne et voulons mettre notre enfant en crèche. Avons-nous droit à des bons de garde et comment les demander ?"},{"l":"Aide sociale","q":"J’habite en ville de Berne et je n’arrive plus à joindre les deux bouts. Comment demander l’aide sociale ?"},{"l":"Prestations complémentaires","q":"Je suis retraité(e), j’habite à Thoune et ma rente AVS ne suffit pas. Puis-je demander des prestations complémentaires ?"},{"l":"Inscription AI","q":"J’habite à Berne et je suis malade et en incapacité de travail depuis des mois. Comment m’inscrire à l’assurance-invalidité ?"},{"l":"Allocation de maternité","q":"Je suis salariée et j’attends un enfant au printemps. Combien d’allocation de maternité vais-je recevoir et comment la demander ?"},{"l":"Congé de paternité","q":"Je suis salarié et je deviens père au printemps. Combien dure le congé de paternité et comment obtenir l’allocation ?"},{"l":"Permis d’élève","q":"J’ai 17 ans, j’habite à Berne et je veux apprendre à conduire. Comment obtenir le permis d’élève conducteur ?"},{"l":"Attestation de domicile","q":"J’habite en ville de Berne et j’ai besoin d’une attestation de domicile. Où l’obtenir et combien coûte-t-elle ?"},{"l":"Annoncer un décès","q":"Ma mère est décédée à la maison en ville de Berne. Que dois-je faire maintenant et où annoncer le décès ?"},{"l":"Carte de stationnement","q":"J’habite en ville de Berne et j’ai une voiture. Comment obtenir une carte de stationnement pour résidents et combien coûte-t-elle ?"},{"l":"Encombrants","q":"J’habite en ville de Berne et je veux me débarrasser d’un vieux canapé. Comment éliminer des encombrants et combien ça coûte ?"},{"l":"Objets trouvés","q":"J’ai perdu mon porte-monnaie en ville de Berne. Comment l’annoncer au bureau des objets trouvés ?"},{"l":"Engager une poursuite","q":"Un client à Berne ne paie pas ma facture de CHF 2'000. Comment engager une poursuite ?"},{"l":"Mettre une voiture hors circulation","q":"J’habite dans le canton de Berne et je vends ma voiture. Comment la mettre hors circulation et que faire des plaques ?"},{"l":"Séjour hebdomadaire","q":"Je travaille désormais en ville de Berne et je rentre le week-end en Valais. Comment m’annoncer en séjour hebdomadaire ?"},{"l":"Sortie de l’Église","q":"J’habite à Berne et je veux quitter l’Église. Comment faire et à partir de quand je ne paie plus d’impôt ecclésiastique ?"},{"l":"Vélo volé","q":"On m’a volé mon vélo à Berne. Comment annoncer le vol à la police ?"},{"l":"Mandat d’inaptitude","q":"J’habite à Berne et je veux faire un mandat pour cause d’inaptitude. Quelle forme doit-il avoir et où le déposer ?"},{"l":"Prolonger le permis","q":"J’habite en ville de Berne et mon permis B expire bientôt. Comment le prolonger ?"},{"l":"Nom après divorce","q":"Je suis divorcée, j’habite à Berne et je veux reprendre mon nom de célibataire. Comment faire ?"},{"l":"Impôts par acomptes","q":"J’habite à Berne et je ne peux pas payer ma facture d’impôts en une fois. Puis-je payer par acomptes ?"},{"l":"École enfantine","q":"Notre fils aura quatre ans en mai et nous habitons en ville de Berne. Quand entre-t-il à l’école enfantine et comment l’inscrire ?"},{"l":"Reconnaître un enfant","q":"Nous ne sommes pas mariés, habitons à Berne et attendons un enfant. Comment reconnaître l’enfant et combien ça coûte ?"},{"l":"Annoncer une naissance","q":"Notre bébé va bientôt naître à Berne. Qui annonce la naissance et que devons-nous faire ?"},{"l":"Permis de pêche","q":"J’habite dans le canton de Berne et je veux pêcher dans l’Aar. Quel permis me faut-il et combien coûte-t-il ?"},{"l":"Extrait du registre foncier","q":"J’ai besoin d’un extrait du registre foncier pour ma maison dans le canton de Berne. Comment le commander et combien coûte-t-il ?"},{"l":"Document d’état civil","q":"J’habite à Berne et j’ai besoin d’un certificat individuel d’état civil. Où le commander et combien coûte-t-il ?"},{"l":"Faire opposition","q":"J’ai reçu un commandement de payer mais je ne dois rien. Comment faire opposition et jusqu’à quand ?"},{"l":"Immatriculer un cyclomoteur","q":"J’ai acheté un e-bike rapide et j’habite dans le canton de Berne. Me faut-il une plaque et combien ça coûte ?"},{"l":"Permis d’acquisition d’armes","q":"J’habite dans le canton de Berne et je veux acheter un pistolet. Comment obtenir un permis d’acquisition d’armes et combien coûte-t-il ?"},{"l":"Bourses d’études","q":"Je commence des études en août, mes parents habitent dans le canton de Berne. Comment demander une bourse et jusqu’à quand ?"},{"l":"Baisse de loyer","q":"Mon loyer repose sur un taux de référence de 1,5 %. Puis-je demander une baisse et comment ?"},{"l":"Impôt à la source","q":"Je suis imposé à la source et j’habite dans le canton de Berne. Puis-je faire une déclaration d’impôt pour faire valoir des déductions ?"},{"l":"Certificat d’héritier","q":"Mon père est décédé à Berne et la banque demande un certificat d’héritier. Où l’obtenir et combien coûte-t-il ?"},{"l":"Place de parc pour déménager","q":"Je déménage en ville de Berne. Comment réserver une place devant la maison pour le camion de déménagement ?"},{"l":"Lacunes AVS","q":"J’ai vécu deux ans à l’étranger sans payer l’AVS. Puis-je combler cette lacune ?"},{"l":"Déplacer son service","q":"Mon cours de répétition tombe pendant mes examens à l’université. Puis-je le reporter et jusqu’à quand dois-je le demander ?"},{"l":"Service civil","q":"Je suis apte au service militaire mais je veux faire du service civil. Comment déposer la demande ?"},{"l":"Amende d’ordre","q":"J’ai reçu une amende de stationnement dans le canton de Berne mais je la trouve injuste. Que puis-je faire et jusqu’à quand dois-je payer ?"},{"l":"Garantie de loyer","q":"J’ai déménagé il y a des mois et le bailleur ne libère pas la garantie de loyer. Comment récupérer mon argent ?"},{"l":"Certificat de travail","q":"J’ai démissionné et mon chef ne me donne pas de certificat de travail. Y ai-je droit ?"},{"l":"Salaire en cas de maladie","q":"Je suis malade depuis deux semaines. Mon employeur doit-il continuer à me payer et combien de temps ?"},{"l":"Droit aux vacances","q":"Combien de semaines de vacances ai-je et mon chef peut-il me les payer au lieu de me les accorder ?"},{"l":"Heures supplémentaires","q":"Je fais des heures supplémentaires chaque semaine. Mon employeur doit-il les payer, et avec un supplément ?"}],"think":"Tell consulte les sources officielles","who":"Compétence","bund":"Confédération","kanton":"Canton","gemeinde":"Commune","src":"Sources","glance":"En un coup d’œil","stand":"État : octobre 2026 · Réponse donnée à titre d’exemple, issue de sources publiques, sans garantie. Seuls les services compétents font foi.","newtab":"s’ouvre dans un nouvel onglet","newq":"Nouvelle question","fb":{"intro":"Le prototype n’a pas encore de réponse à cette question. La version finale consulterait ici les sources officielles de la Confédération, des cantons et des communes. Il répond déjà à 23 exemples : déménagement, passeport et carte d’identité, déclaration d’impôt, rente AVS, chômage, changement de caisse-maladie, création d’une entreprise individuelle échange d’un permis de conduire étranger, mariage, annonce d’un chien, allocations familiales, extrait des poursuites, extrait du casier judiciaire, immatriculation d’une voiture, naturalisation, réduction des primes, taxe d’exemption de l’obligation de servir, abri de jardin, document d’identité perdu, bons de garde, aide sociale, prestations complémentaires et inscription à l’AI. Essayez l’un d’eux."},"ans":{"move":{"intro":"Vous vous annoncez dans les 14 jours auprès de votre nouvelle commune. De Berne à Winterthour, cela se fait en ligne via eUmzugCH : les deux communes sont raccordées, il n’est pas nécessaire de se rendre au guichet.","facts":[["Délai","14 jours dès le changement d’adresse (art. 11 LHR)"],["Coûts","Winterthour : CHF 40 par adulte ; eUmzugCH ne coûte pas plus cher que le guichet"],["Guichet","Pas nécessaire, tout se fait en ligne"],["Compétence","Services aux habitants de Berne (départ), contrôle des habitants de Winterthour (arrivée)"]],"steps":["Sur eumzug.swiss, saisir l’ancienne adresse (Berne) et la nouvelle adresse (Winterthour), puis lancer la vérification.","À préparer : passeport ou carte d’identité, numéro AVS (13 chiffres), contrat de bail ou attestation d’emménagement, carte ou Twint pour CHF 40.","Préparer la carte d’assuré ou la police d’assurance-maladie : Winterthour exige ce justificatif lors de l’annonce d’arrivée.","Terminer en ligne l’annonce de départ à Berne et l’annonce d’arrivée à Winterthour ; un passage au guichet à Berne n’est pas nécessaire.","Service des impôts : Winterthour reçoit automatiquement la nouvelle adresse ; vous y êtes assujetti à l’impôt dès le 1er janvier de l’année d’arrivée."],"who":[1,1,1],"note":"Les communes (Berne, Winterthour) reçoivent les annonces de départ et d’arrivée, eUmzugCH est le service commun de la Confédération, des cantons et des communes ; les impôts sont prélevés par le canton de Zurich avec la ville de Winterthour.","src":["eUmzugCH – annoncer son déménagement en ligne (Confédération, cantons, communes)","Ville de Winterthour – déménagement et arrivée à Winterthour","Ville de Berne – arrivée, déménagement et départ","Ville de Winterthour – impôts en cas de déménagement, d’arrivée et de départ"]},"passport":{"intro":"Si vous êtes adulte et habitez à Berne, vous demandez votre passeport et/ou votre carte d’identité en ligne sur schweizerpass.ch, puis vous vous rendez au rendez-vous réservé, p. ex. au centre de documents d’identité de Berne (Laupenstrasse 18A). La combinaison passeport + carte d’identité coûte CHF 158 et est valable 10 ans.","facts":[["Coûts","Adultes : carte d’identité CHF 70, passeport CHF 145, combinaison CHF 158. Enfants jusqu’à 18 ans : carte d’identité 35, passeport 65, combinaison 78 (port inclus)."],["Validité","Adultes 10 ans, enfants et jeunes jusqu’à 18 ans : 5 ans. Une prolongation n’est pas possible, vous commandez un nouveau document."],["Durée","Livraison au plus tard 10 jours ouvrables après le rendez-vous, par envoi recommandé."],["Rendez-vous","Obligatoire, présence personnelle nécessaire (photo, pour le passeport empreintes digitales)."],["Nouveau dès novembre","Dès le 2 novembre 2026, il existe en plus la carte d’identité biométrique avec puce (image faciale et deux empreintes digitales). Facultative, même émolument qu’aujourd’hui. Le passeport provisoire s’appellera alors « passeport d’urgence »."]],"steps":["Remplir la demande en ligne sur schweizerpass.ch (adresse e-mail personnelle requise). Après vérification, vous recevez un e-mail pour choisir un rendez-vous.","Réserver un rendez-vous dans l’un des 7 centres de documents d’identité bernois (obligatoire) : en ligne ou par téléphone au 031 635 40 00, lu–ve.","Apporter l’ancien document, mais pas de photo : elle est prise sur place.","Payer les frais sur place (carte, Twint ou espèces). Les enfants viennent avec une personne détentrice de l’autorité parentale et son document d’identité.","Le document arrive dans les 10 jours ouvrables, par envoi recommandé, à l’adresse indiquée."],"who":[1,1,0],"note":"La Confédération (fedpol) publie les prix, la durée de validité et les délais de livraison ; dans le canton de Berne, les sept centres cantonaux de documents d’identité saisissent vos données.","src":["fedpol : prix, durée de validité et délais de livraison","Canton de Berne : documents d’identité, prix et durée de validité","Canton de Berne : centres de documents d’identité et rendez-vous","Canton de Berne : se rendre au rendez-vous, documents à apporter","Conseil fédéral : carte d’identité biométrique dès le 2.11.2026 (communiqué du 26.8.2026)"]},"tax":{"intro":"Dans le canton de Berne, la déclaration d’impôt est en principe due au 15 mars ; en ligne, vous prolongez gratuitement jusqu’au 15 juillet, au plus tard jusqu’au 15 novembre. Pour la période fiscale 2025, en raison d’une panne informatique, le 30 novembre 2026 est exceptionnellement le dernier délai.","facts":[["Délai","Berne : 15 mars (indépendants : 15 mai). Zurich et Genève : 31 mars."],["Coûts","Berne en ligne : gratuit jusqu’au 15 juillet, CHF 20 jusqu’au 15 sept., CHF 40 jusqu’au 15 nov. Par écrit/téléphone : CHF 20/40/60. Genève : CHF 20/40/60."],["Durée","Berne : au plus tard jusqu’au 15 nov. ; déclaration 2025 exceptionnellement jusqu’au 30 nov. 2026 (panne informatique)."],["Compétence","Berne : administration fiscale cantonale. Zurich : office communal des impôts. Genève : Administration fiscale cantonale."]],"steps":["Préparer la lettre relative à la déclaration d’impôt, le certificat de salaire (de l’employeur) et les justificatifs.","Avant l’échéance, dans BE-Login (avec AGOV) : « Fristverlängerung erfassen » (saisir la prolongation de délai), choisir le nouveau délai et confirmer.","Enregistrer soi-même la confirmation : aucune n’est envoyée par la poste ni par e-mail.","Remplir la déclaration dans TaxMe-Online et la déposer avec les justificatifs (ou la remettre imprimée à votre commune de domicile).","En retard ? Des frais de rappel de CHF 60 sont à craindre ; une fois le délai de rappel écoulé, aucune prolongation n’est plus possible."],"who":[1,1,1],"note":"L’administration fiscale cantonale reçoit votre déclaration et taxe aussi l’impôt fédéral direct pour le compte de la Confédération (sous la surveillance de l’AFC) ; la commune fixe sa quotité d’impôt.","src":["Canton de Berne : prolonger le délai en tant que particulier","Canton de Berne : instructions, délai de dépôt","Canton de Zurich : déclaration d’impôt des particuliers","Canton de Genève : demander un délai"]},"ahv":{"intro":"Un homme né en 1962 et habitant à Thoune atteint l’âge de référence de 65 ans en 2027 et demande sa rente à la caisse de compensation 3 à 4 mois avant. Avec un anniversaire le 15 mars 2027, la rente commence le 1er avril 2027 ; la demande se fait dès décembre 2026 environ.","facts":[["Âge de référence","Hommes 65 ans. Femmes : née en 1961 = 64 ans 3 mois, 1962 = 64 ans 6 mois, 1963 = 64 ans 9 mois, dès 1964 = 65 ans. Rente dès le mois suivant."],["Délai","Demande 3 à 4 mois avant le début de la rente. Anticipation dès 63 ans (–6.8 % pour 1 an), ajournement 1 à 5 ans (+5.2 % à +31.5 %)."],["Rente","Dès 2027, avec une durée de cotisation complète CHF 1 280 à 2 560 par mois ; couple au maximum CHF 3 840. S’y ajoute la 13e rente dès décembre 2026."],["Compétence","Caisse de compensation à laquelle votre employeur est affilié (dans le canton de Berne p. ex. la caisse de compensation du canton de Berne, AK Bern)."]],"steps":["Clarifier la caisse de compensation compétente : les salariés demandent à leur employeur, les indépendants à la dernière caisse avec laquelle ils décomptent.","Remplir et envoyer en ligne le formulaire 318.370 « Demande de rente de vieillesse » 3 à 4 mois avant le début de la rente.","Anticipation : à demander au plus tard à la fin du mois précédent. Ajournement : à cocher dans le formulaire au plus tard 1 an après l’âge de référence.","Télécharger les annexes avec le formulaire ou les envoyer par la poste ; la caisse de compensation se procure les documents nécessaires et calcule la rente.","Versement mensuel (AK Bern : 4e jour ouvrable, p. ex. le 4 décembre 2026) ; la 13e rente de décembre est versée sans demande."],"who":[1,1,0],"note":"La Confédération (OFAS) fixe les règles et publie les mémentos ; la caisse de compensation (dans le canton de Berne, l’AK Bern) reçoit votre demande, calcule et verse la rente.","src":["Caisse de compensation du canton de Berne : rente de vieillesse de l’AVS","ahv-iv.ch : mémento 3.01 Rentes de vieillesse (état au 1.1.2026)","ch.ch : retraite – à partir de quand ?","OFAS : stabilisation de l’AVS (AVS 21)","Conseil fédéral : hausse des rentes AVS/AI au 1.1.2027 (2.10.2026)"]},"alv":{"intro":"Inscrivez-vous auprès de l’ORP de votre région au plus tard le premier jour pour lequel vous voulez toucher l’indemnité de chômage, le plus rapidement en ligne dans Job-Room. Exemple à Thoune : 30 ans, salaire mensuel de 6 500 francs, sans enfant, 14 mois de cotisation donnent 70 %, au maximum 260 indemnités journalières et 10 jours d’attente.","facts":[["Délai","Inscription à l’ORP au plus tard le 1er jour de chômage, mieux encore pendant le délai de congé."],["Montant","70 % du gain assuré. 80 % en cas d’enfants de moins de 25 ans, de gain jusqu’à 3 797 francs ou de rente AI dès 40 %."],["Durée","Au moins 12 mois de cotisation en 2 ans. 260 indemnités journalières, davantage en cas de période de cotisation plus longue. Délai-cadre : 2 ans."],["Compétence","ORP (inscription, conseil) et la caisse de chômage que vous choisissez (versement)."]],"steps":["S’inscrire en ligne via l’e-service d’inscription au placement (ORP) dans Job-Room, ou en personne auprès de l’ORP de votre région.","Chercher un emploi déjà pendant le délai de congé et justifier chaque candidature. Votre ORP fixe le nombre exigé.","Choisir une caisse de chômage, déposer la « demande d’indemnité de chômage » et les attestations de l’employeur (2 ans).","Premier entretien à l’ORP (convocation dans les 15 jours) : apporter la carte AVS ou d’assuré, une pièce d’identité et la preuve de vos recherches d’emploi.","Chaque mois, remettre les « indications de la personne assurée ». Les indemnités journalières suivent en règle générale le mois suivant."],"who":[1,1,0],"note":"Le SECO surveille l’assurance-chômage ; les ORP, les caisses de chômage et les services cantonaux l’appliquent ; l’inscription se fait directement auprès de l’ORP.","src":["arbeit.swiss : inscription et enregistrement","arbeit.swiss (SECO) : FAQ sur l’indemnité de chômage","ch.ch : chômage en Suisse","Fedlex : LACI (RS 837.0), art. 9, 17, 18, 22, 27"]},"kk":{"intro":"Vous pouvez changer d’assurance de base pour la fin de l’année si votre résiliation parvient à la caisse au plus tard le lundi 30 novembre 2026. La nouvelle caisse doit vous accepter sans questions de santé. Les primes 2027 figurent déjà dans le comparateur de primes de priminfo.admin.ch.","facts":[["Délai","La résiliation doit parvenir à la caisse au plus tard le dernier jour ouvrable de novembre (2026 : lundi 30 novembre). Seule la réception compte, pas le cachet postal. Recommandé : l’envoyer en recommandé d’ici la mi-novembre."],["Franchise","Adultes : CHF 300 ou, au choix, 500, 1 000, 1 500, 2 000, 2 500, plus 10 % de quote-part, au maximum CHF 700 par an. Enfants : pas de franchise, quote-part de CHF 350 au maximum."],["Changer de franchise","Franchise plus basse : à communiquer par écrit au plus tard le dernier jour ouvrable de novembre. Franchise plus haute : seulement au début de l’année ; la loi ne fixe pas de délai, Priminfo recommande de l’annoncer d’ici la mi-décembre."],["En cours d’année","Changement au 1er juillet seulement avec la franchise ordinaire (CHF 300) et le libre choix du fournisseur de soins, résiliation d’ici le 31 mars. Avec un modèle à choix restreint (p. ex. médecin de famille ou télémédecine), changement possible seulement pour la fin de l’année."],["Attention","Primes ou participations aux coûts impayées et rappelées d’ici le 30 novembre : la résiliation ne prend effet que si vous les payez, intérêts moratoires et frais de poursuite compris, d’ici le 31 décembre (art. 64a LAMal)."],["Compétence","Votre caisse actuelle et la nouvelle caisse. La Confédération (OFSP) approuve les primes."]],"steps":["Comparer les primes 2027 sur priminfo.admin.ch : saisir lieu de domicile, âge, franchise et modèle (p. ex. médecin de famille ou télémédecine).","Choisir la nouvelle caisse et lui demander l’assurance de base. Toute caisse doit vous accepter, sans questions de santé, sans réserve ni délai d’attente.","Résilier l’assurance de base actuelle par écrit, de préférence en recommandé d’ici la mi-novembre.","Ne pas résilier trop vite l’assurance complémentaire : pour elle, la caisse peut poser des questions de santé et refuser. Le délai de résiliation figure dans les conditions d’assurance, souvent trois mois pour la fin de l’année. La caisse n’a pas le droit de la résilier parce que vous changez d’assurance de base.","Attendre la confirmation de la nouvelle caisse : l’ancienne assurance ne prend fin que lorsque la nouvelle a annoncé la couverture sans interruption. Si l’annonce arrive trop tard, la nouvelle caisse doit prendre en charge la différence de prime."],"who":[1,0,0],"note":"La loi (LAMal) et l’approbation des primes relèvent de la Confédération (OFSP). La résiliation et l’adhésion se font directement auprès des caisses-maladie, aucune autorité ne les reçoit.","src":["Priminfo (OFSP) : FAQ, changer de caisse-maladie","Priminfo (OFSP) : comparateur de primes 2027","Priminfo (OFSP) : primes 2027 par canton","Fedlex : LAMal (RS 832.10), art. 7 et 64a"]},"biz":{"intro":"Si vous vous mettez à votre compte à Berne avec une entreprise individuelle, vous vous annoncez d’abord comme indépendant(e) auprès de la caisse de compensation. L’inscription au registre du commerce et à la TVA n’est obligatoire qu’à partir de CHF 100 000 de chiffre d’affaires par an. Les démarches se font en ligne sur EasyGov.swiss, le portail de la Confédération.","facts":[["AVS","Annonce à la caisse de compensation du siège de l’entreprise (Berne : AK Bern). Cotisation de 10 % du revenu, moins en dessous de CHF 60 500 ; en 2026, au minimum CHF 530 par an."],["Registre du commerce","Obligatoire dès CHF 100 000 de chiffre d’affaires lors du dernier exercice, sinon facultatif. Émolument CHF 120. La raison de commerce doit contenir votre nom de famille."],["TVA","Obligatoire dès CHF 100 000 de chiffre d’affaires par an, ou dès que c’est prévisible au démarrage. Inscription auprès de l’AFC dans les 30 jours."],["Autorisation","Nécessaire seulement pour certaines activités réglementées. À vérifier avant de démarrer."]],"steps":["Ouvrir un compte sur EasyGov.swiss, choisir «entreprise individuelle» et fixer la raison de commerce avec votre nom de famille.","Vous annoncer comme indépendant(e) à l’AK Bern, si possible au premier trimestre : en ligne ou avec le formulaire 318.146, avec des justificatifs comme factures, compte de résultat ou publicité.","Dès CHF 100 000 de chiffre d’affaires annuel : inscription au registre du commerce de Berne (CHF 120) et annonce à l’AFC pour la TVA dans les 30 jours.","Avant de démarrer, vérifier si votre activité exige une autorisation."],"who":[1,1,0],"note":"La caisse de compensation et le registre du commerce relèvent du canton (à Berne : AK Bern et registre du commerce du canton de Berne), la TVA est perçue par la Confédération (AFC). EasyGov.swiss est le guichet en ligne de la Confédération pour les trois.","src":["Portail PME (SECO) : entreprise individuelle","Registre du commerce de Berne : notice sur l’inscription d’une entreprise individuelle","Caisse de compensation du canton de Berne : indépendants","ahv-iv.ch : mémento 2.02, cotisations des indépendants","AFC : assujettissement à la TVA","EasyGov.swiss : fonder une entreprise individuelle"]},"drv":{"intro":"Si vous habitez en Suisse, vous pouvez conduire avec un permis étranger pendant 12 mois seulement. Dans le canton de Berne, vous l’échangez auprès de l’Office de la circulation routière (OCRN). Un permis allemand, délivré dans l’UE, ne demande pas de course de contrôle ; l’échange coûte CHF 120.","facts":[["Délai","12 mois dès l’entrée selon l’autorisation de séjour (art. 42 OAC). Déposer la demande avant, pour pouvoir conduire sans interruption. L’échange reste possible plus tard, mais une amende peut tomber."],["Course de contrôle","Aucune pour les permis de l’UE/AELE ainsi que d’Andorre, d’Australie, d’Israël, du Japon, du Canada, de Corée du Sud, du Maroc, de Monaco, de Nouvelle-Zélande, de Saint-Marin, de Singapour, de Taïwan, de Tunisie et des États-Unis. Tous les autres passent une course de contrôle."],["Coûts","Berne : échange CHF 120, course de contrôle catégorie B CHF 132."],["Compétence","Office de la circulation routière et de la navigation du canton de Berne (OCRN), Schermenweg 5, Berne."]],"steps":["Faire un test de la vue chez un opticien ou un ophtalmologue reconnu.","Remplir et signer le formulaire de demande de l’OCRN, y coller une photo passeport récente en couleur (35 × 45 mm).","Remettre la demande en personne : à un site de l’OCRN, au contrôle des habitants de votre commune ou à un poste de police du canton de Berne. Apporter : permis étranger original et passeport ou carte d’identité.","Si nécessaire, passer la course de contrôle. Vous recevez le permis suisse par la poste."],"who":[1,1,0],"note":"La Confédération (OFROU) règle l’échange dans l’ordonnance réglant l’admission à la circulation routière ; l’office cantonal de la circulation (à Berne l’OCRN) examine la demande et délivre le permis.","src":["Canton de Berne (OCRN) : échange d’un permis étranger","Canton de Berne (OCRN) : émoluments","ch.ch : échanger son permis de conduire","OFROU : échange des permis étrangers"]},"wed":{"intro":"Si vous êtes tous deux Suisses et habitez à Zurich, vous réservez d’abord en ligne le lieu et la date auprès de l’office de l’état civil de la ville de Zurich, au plus tôt 12 mois à l’avance. La préparation du mariage se fait à deux au guichet du Stadthaus, au plus tard 1 mois avant le mariage.","facts":[["Conditions","Avoir tous deux au moins 18 ans et être capables de discernement. Les parents en ligne directe ainsi que les frères et sœurs, germains ou demi-frères et sœurs, ne peuvent pas se marier entre eux."],["Délai","Invitation à la préparation au plus tôt 3 mois avant le mariage. La terminer au plus tard 1 mois avant, sinon la réservation est annulée."],["Coûts","Zurich : mariage le moins cher au Stadthaus dès CHF 255, préparation sans traduction comprise (uniquement avec domicile en ville de Zurich)."],["Témoins","Deux témoins majeurs et capables de discernement doivent être présents."]],"steps":["Réserver le lieu et la date sur le site de l’office de l’état civil de Zurich, au plus tôt 12 mois à l’avance.","Au plus tôt 3 mois avant le mariage, vous recevez une invitation par e-mail. Vous choisissez alors en ligne un rendez-vous pour la préparation.","Vous présenter à deux au guichet du Stadthaus, avec passeport ou carte d’identité. Vous remplissez et signez le formulaire et fixez les noms que vous et, le cas échéant, vos enfants porterez.","Payer les émoluments sur place par carte ou Twint. Venir au mariage avec deux témoins."],"who":[1,0,1],"note":"La Confédération fixe les règles du mariage (CC) et les émoluments ; à Zurich, l’office de l’état civil de la ville mène la préparation et célèbre le mariage.","src":["Ville de Zurich : se marier avec domicile à Zurich","Ville de Zurich : préparation du mariage","Ville de Zurich : questions et réponses sur le mariage","ch.ch : se marier en Suisse"]},"dog":{"intro":"En ville de Berne, vous annoncez votre chien aux services aux habitants avec le formulaire d’annonce d’un chien. Si vous avez repris le chien, vous annoncez le changement de détenteur à la banque de données AMICUS dans les 10 jours. La taxe sur les chiens est de CHF 150 par an.","facts":[["Annonce","Aux services aux habitants de la ville de Berne (Einwohnerdienste), Predigergasse 5, 3011 Berne. La commune vous enregistre comme détenteur dans AMICUS."],["Délai","Changement de détenteur (achat, reprise, remise pour plus de 3 mois) à annoncer à AMICUS dans les 10 jours. Chiens importés : faire contrôler et annoncer la puce par un vétérinaire dans les 10 jours."],["Coûts","Ville de Berne : CHF 150 par chien et par an, pour les chiens dès 6 mois. La facture arrive automatiquement en août."],["Puce","Obligatoire pour chaque chien ; chiots dans les 3 mois. Seuls les vétérinaires posent la puce et annoncent le chien à AMICUS."]],"steps":["Remplir le formulaire de la ville de Berne pour l’annonce d’un chien et l’envoyer par la poste aux services aux habitants.","Si le chien a déjà une puce : annoncer le changement de détenteur à AMICUS dans les 10 jours. Sinon : le faire pucer chez un vétérinaire.","Payer la taxe sur les chiens à réception de la facture en août.","En cas de déménagement, de remise ou de décès du chien : informer la commune et AMICUS."],"who":[1,0,1],"note":"La Confédération impose la puce et l’enregistrement dans AMICUS (ordonnance sur les épizooties) ; la commune reçoit l’annonce et perçoit la taxe sur les chiens.","src":["Ville de Berne : chiens","Ville de Berne : formulaire d’annonce d’un chien","AMICUS : bon à savoir (notice)","ch.ch : impôt sur les chiens"]},"fam":{"intro":"Si vous êtes salarié(e) dans le canton de Berne, vous demandez les allocations familiales à votre employeur. Il transmet la demande à sa caisse d’allocations familiales. L’allocation pour enfant est de CHF 250 par mois et par enfant (état 2026).","facts":[["Montant","Canton de Berne, état 2026 : allocation pour enfant CHF 250 par mois jusqu’au mois des 16 ans. Allocation de formation CHF 310 pour les enfants en formation, au plus tôt dès 15 ans, au plus tard jusqu’à 25 ans."],["Demande","Salariés : auprès de l’employeur. Personnes sans activité lucrative : auprès de la caisse de compensation cantonale (AK Bern)."],["Délai","Pas de délai fixe ; des allocations oubliées peuvent être réclamées jusqu’à 5 ans en arrière."],["Par enfant","Une seule allocation par enfant, même si les deux parents travaillent."]],"steps":["Demander à l’employeur le formulaire de demande d’allocations familiales.","Remplir et signer le formulaire avec les données de l’enfant et de l’autre parent.","L’employeur transmet la demande à sa caisse d’allocations familiales et verse l’allocation.","Si les deux parents travaillent : convenir d’abord qui dépose la demande, car il n’y a qu’une allocation par enfant."],"who":[1,1,0],"note":"La Confédération fixe les montants minimaux (loi sur les allocations familiales), le canton de Berne verse 115 % de ces montants ; le versement passe par la cinquantaine de caisses d’allocations familiales du canton.","src":["Portail des familles du canton de Berne : allocations pour enfant et de formation","ch.ch : allocations familiales","ahv-iv.ch : mémento 6.08 allocations familiales","Caisse de compensation du canton de Berne : allocations familiales"]},"debt":{"intro":"Dans le canton de Berne, vous commandez l’extrait du registre des poursuites en ligne auprès de l’office cantonal des poursuites et des faillites (be.ch/baka). Il coûte CHF 18 envoi compris et arrive sous forme électronique à télécharger.","facts":[["Coûts","Canton de Berne en ligne : CHF 18 envoi compris (émolument CHF 17 par extrait)."],["Contenu","Les poursuites des 5 dernières années dans l’arrondissement concerné."],["Déménagement","Si vous avez habité ailleurs ces 5 dernières années, commandez aussi un extrait là-bas, sinon ces poursuites manquent."],["Envoi","Commande en ligne entièrement électronique : téléchargement sur une plateforme sécurisée, possible plusieurs fois."]],"steps":["Commander en ligne sur be.ch/baka l’extrait du registre des poursuites vous concernant.","Préparer une pièce d’identité valable : carte d’identité, passeport ou livret pour étrangers.","Payer l’émolument lors de la commande : carte, PostFinance Pay ou Twint.","Télécharger l’extrait sur la plateforme sécurisée et le transmettre, par exemple au bailleur."],"who":[1,1,0],"note":"La Confédération règle le droit des poursuites (LP) et les émoluments ; dans le canton de Berne, l’office cantonal des poursuites et des faillites (BAKA) tient les registres.","src":["Canton de Berne (BAKA) : commander un extrait des poursuites","ch.ch : commander un extrait du registre des poursuites","Canton de Berne : commande en ligne de l’extrait des poursuites (communiqué)"]},"crim":{"intro":"L’extrait du casier judiciaire (extrait destiné à des particuliers) se commande auprès de la Confédération, en ligne sur strafregister.admin.ch ou au guichet de la Poste. Il coûte CHF 17 et arrive par la poste environ 10 jours ouvrables après réception du formulaire signé.","facts":[["Coûts","CHF 17 pour l’extrait. Légalisation ou apostille : CHF 20 en plus."],["Durée","Environ 10 jours ouvrables après réception du formulaire signé."],["Commande","En ligne sur strafregister.admin.ch ou en personne à un guichet de la Poste avec une pièce d’identité valable."],["Extrait spécial","Pour les activités avec des mineurs, il existe un extrait distinct, l’extrait spécial destiné à des particuliers."]],"steps":["Sur strafregister.admin.ch, choisir l’extrait destiné à des particuliers et saisir données personnelles, adresse et paiement.","Payer l’émolument en ligne : carte de débit ou de crédit, PostFinance Card ou Twint.","Imprimer le formulaire, le signer et l’envoyer par la poste avec une copie de votre pièce d’identité.","Autre possibilité : commander au guichet de la Poste avec passeport, carte d’identité ou livret pour étrangers et payer sur place."],"who":[1,0,0],"note":"Le casier judiciaire est tenu par la Confédération (Office fédéral de la justice). La commande se fait directement auprès de la Confédération ou à un guichet de la Poste.","src":["Office fédéral de la justice : commander l’extrait","Office fédéral de la justice : FAQ extrait pour particuliers","ch.ch : extrait du casier judiciaire"]},"car":{"intro":"Dans le canton de Berne, vous immatriculez la voiture auprès de l’Office de la circulation routière (OCRN), par la poste ou au guichet. Votre assurance envoie d’abord l’attestation d’assurance par voie électronique à l’office. Le permis de circulation coûte CHF 45 par la poste ou CHF 55 au guichet.","facts":[["Documents","Attestation d’assurance (envoyée par l’assurance à l’office par voie électronique), permis de circulation du détenteur précédent, rapport d’expertise si la voiture a été contrôlée, pièce d’identité."],["Coûts","Permis de circulation : CHF 45 par la poste, CHF 55 au guichet. Nouvelles plaques : CHF 45 la paire, CHF 30 l’unité."],["Délai","L’attestation d’assurance est valable 30 jours. L’impôt sur les véhicules se paie dans les 30 jours suivant la facture."],["Impôt","Impôt annuel sur les véhicules, facturé en janvier ou lors de l’immatriculation. Le calculateur de l’OCRN indique le montant."]],"steps":["Conclure une assurance responsabilité civile. L’assurance envoie l’attestation d’assurance à l’OCRN par voie électronique.","Remplir le formulaire de demande d’immatriculation d’un véhicule.","Envoyer le formulaire avec le permis de circulation du détenteur précédent, l’éventuel rapport d’expertise et une pièce d’identité à l’OCRN, Schermenweg 5, 3001 Berne, ou le remettre au guichet.","Par la poste, le nouveau permis de circulation arrive après quelques jours ouvrables. Payer ensuite la facture de l’impôt sur les véhicules dans les 30 jours."],"who":[1,1,0],"note":"La Confédération règle l’admission des véhicules ; l’office cantonal de la circulation (à Berne l’OCRN) délivre permis de circulation et plaques et perçoit l’impôt sur les véhicules.","src":["Canton de Berne (OCRN) : immatriculer un véhicule","Canton de Berne (OCRN) : marche à suivre pour l’immatriculation","Canton de Berne (OCRN) : documents pour l’immatriculation","Canton de Berne (OCRN) : calculer l’impôt sur les véhicules","ch.ch : immatriculer un véhicule"]},"nat":{"intro":"Vous remplissez les conditions de résidence : 10 ans en Suisse, permis C et au moins 2 ans dans le canton et la commune. S’y ajoutent l’attestation de langue, le test de naturalisation et l’intégration. Vous déposez la demande auprès de la ville de Berne ; pour une personne seule, commune, canton et Confédération coûtent ensemble CHF 1 650.","facts":[["Conditions","Permis C, 10 ans en Suisse au total, au moins 2 ans sans interruption dans le canton de Berne et dans la commune, intégration réussie."],["Langue","Canton de Berne : B1 à l’oral, A2 à l’écrit. Pas d’attestation si la langue officielle est votre langue maternelle ou si vous avez suivi au moins 5 ans d’école obligatoire dans cette langue."],["Test","Écrit, 90 minutes : géographie, histoire, démocratie, santé et travail, droits et devoirs. Est notamment dispensé qui a suivi au moins 5 ans d’école obligatoire en Suisse."],["Coûts","Personne seule en ville de Berne : commune CHF 400, canton CHF 1 150, Confédération CHF 100. Couple marié : 600, 1 725 et 150."]],"steps":["S’adresser à la commune de domicile (ville de Berne). Elle remet les formulaires et indique les documents nécessaires.","Obtenir l’attestation de langue (B1 à l’oral, A2 à l’écrit), si vous n’en êtes pas dispensé(e).","Déposer la demande complète auprès de la commune et passer le test de naturalisation, si vous n’en êtes pas dispensé(e).","La commune vous facture les émoluments de la commune et du canton ; la Confédération (SEM) décide de l’autorisation fédérale de naturalisation."],"who":[1,1,1],"note":"Se faire naturaliser, c’est acquérir trois droits de cité : commune, canton et Confédération examinent chacun leur part. La demande passe par la commune de domicile, le Secrétariat d’État aux migrations (SEM) délivre l’autorisation fédérale.","src":["Canton de Berne : séjour en Suisse (naturalisation)","Canton de Berne : connaissances linguistiques et attestation","Canton de Berne : test de naturalisation","Canton de Berne : émoluments de naturalisation","SEM : naturalisation ordinaire"]},"pv":{"intro":"Dans le canton de Berne, le canton examine en général automatiquement votre droit à la réduction des primes, sur la base des données fiscales définitives des deux années précédentes. En 2026, la limite est de CHF 35 000 de revenu déterminant, et de CHF 45 000 pour les familles avec enfants. Vous ne déposez une demande que dans des cas particuliers.","facts":[["Limite 2026","Revenu déterminant de CHF 35 000 au plus ; familles avec enfants : CHF 45 000 au plus."],["Examen","Automatique, sur la base des données fiscales définitives des deux années précédentes (revenu net et fortune)."],["Demande","Seulement dans des cas particuliers, par exemple si l’examen automatique n’est pas possible ou si le revenu ou la famille changent durablement et fortement. Possible aussi en ligne."],["Calculateur","Estimation sans engagement avec le calculateur en ligne sur be.ch/pvo-onlinerechner."]],"steps":["Vérifier avec le calculateur en ligne sur be.ch/pvo-onlinerechner si un droit est possible.","Déposer la déclaration d’impôt : l’examen automatique a besoin de données fiscales définitives.","Si le revenu ou la famille ont changé durablement et fortement : déposer une demande, aussi en ligne.","En cas de droit, le canton verse la réduction directement à
