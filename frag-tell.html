ec point d’entrée par chat et les rubriques Couverture, Actualités, Pour les autorités et Participer.","« Lacunes » : nouvelle page où Tell note où les informations officielles sur ses thèmes présentent des lacunes, des ambiguïtés ou des divergences. Seulement un début : 8 observations avec sources, état au 7 octobre 2026."]}]},{"d":"5 octobre 2026","g":[{"h":"Amélioré","li":["Image d’en-tête de la page d’accueil : Palais fédéral de face et plus grand."]}]},{"d":"4 octobre 2026","g":[{"h":"En ligne","li":["Tell est mis en ligne comme prototype conceptuel privé : page d’accueil, vue citoyenne, vue des autorités et projet."]}]}]}]},"behoerden":{"t":"Pour les autorités","h":"Pour les autorités","lead":"Tell est un concept privé. Aujourd’hui, aucune autorité ne collabore avec Tell et il n’existe aucun accord avec un service. Cette page montre à quoi une collaboration pourrait ressembler, en trois niveaux : plus le niveau est élevé, plus l’utilité pour les citoyens augmente, mais aussi l’effort pour un service.","blocks":[{"type":"phases","h":"Collaboration possible (idée de concept)","items":[{"n":"1","h":"Relire et corriger","e":"Effort faible, sans informatique","t":"Un service relit les réponses sur ses thèmes et signale par e-mail les erreurs ou les informations périmées. Tell adapte la réponse et cite la page du service comme source."},{"n":"2","h":"Raccorder","e":"Effort moyen, avec informatique","t":"Tell renvoie directement au guichet en ligne, au formulaire ou à la prise de rendez-vous du service, au lieu de se limiter à expliquer. Idée du concept, non réalisée."},{"n":"3","h":"Devenir partenaire","e":"Effort élevé, projet et juridique","t":"Le concept de projet prévoit un pilote avec un canton (12 mois), puis 6 à 8 cantons (24 mois). Ce sont des hypothèses propres, ni une promesse ni une offre."}]},{"type":"list","h":"Lacunes dans les informations officielles","items":["Sur la page « Lacunes », Tell note où les informations officielles sur ses 39 thèmes présentent des lacunes, des ambiguïtés ou des divergences, avec sources et date de consultation. Ce sont des observations, pas des reproches, destinées à aider les services à améliorer leurs informations. Seulement un début : 8 entrées, état au 7 octobre 2026, à vérifier."]},{"type":"list","h":"Ce que Tell est, et ce qu’il n’est pas","items":["Tell est un concept privé de Bilal Simsek, Berne, et non une autorité.","Les faits tels que délais, émoluments et adresses proviennent uniquement de sources officielles et sont affichés avec leur source.","Tell ne décide de rien et ne donne pas de renseignement juridique. En cas de doute, il renvoie au service compétent.","Tell ne dépose aucune demande. Aujourd’hui, cela se fait uniquement sur les sites officiels."]},{"type":"links","h":"En savoir plus sur le concept","items":[{"l":"Lacunes dans les informations officielles (observations)","href":"luecken.html"},{"l":"Vue des autorités (démo)","href":"behoerdensicht.html"},{"l":"Projet : calendrier, coûts, risques","href":"projekt.html"},{"l":"Envoyer un retour à Tell","mail":"fb"}]}]},"mitmachen":{"t":"Participer","h":"Participer","lead":"Tell est un projet individuel et vit de vos retours. Voici comment aider, le tout par e-mail et sans compte.","blocks":[{"type":"cards","items":[{"h":"Signaler une erreur ou une information périmée","t":"Un délai, un émolument ou une adresse n’est plus correct ? Écrivez la question et la source.","l":"Signaler une erreur","mail":"err"},{"h":"Proposer un thème","t":"Quelle démarche manque ? Indiquez la demande et votre lieu de domicile.","l":"Proposer un thème","mail":"topic"},{"h":"Retour d’un service","t":"Vous travaillez dans une autorité ? Un bref retour sur une réponse aide le plus.","l":"Envoyer un retour","mail":"fb"},{"h":"En parler","t":"Montrez Tell aux personnes qui ont affaire aux autorités et précisez qu’il s’agit d’un concept privé."}]}]}},"f_luecken":"Lacunes"},"it":{"title":"Chiedi a Tell – Tell (concetto privato, prototipo)","desc" ","m":"Esempio: città di Berna"},{"h":"Chiedere le prestazioni complementari","t":"Limite di sostanza, fabbisogno vitale 2027, iscrizione e decisione.","m":"Esempio: Thun, Cantone di Berna"},{"h":"Iscriversi all’AI","t":"Rilevamento tempestivo, iscrizione, integrazione e rendita.","m":"Esempio: Cantone di Berna"},{"h":"Indennità di maternità","t":"Diritto, importo, durata e richiesta.","m":"Tutta la Svizzera"},{"h":"Congedo di paternità","t":"Diritto, durata, importo e richiesta.","m":"Tutta la Svizzera"},{"h":"Licenza per allievo conducente","t":"Età, esame della vista, primo soccorso, esame di teoria e costi.","m":"Esempio: Cantone di Berna"},{"h":"Ordinare un certificato di domicilio","t":"Ordinazione, costo e sportello.","m":"Esempio: città di Berna"},{"h":"Notificare un decesso","t":"Certificato di morte, notifica, sepoltura.","m":"Esempio: città di Berna"},{"h":"Carta di parcheggio per residenti","t":"Requisiti, costi, validità e richiesta.","m":"Esempio: città di Berna"},{"h":"Smaltire rifiuti ingombranti","t":"Piccoli ingombranti, centro di raccolta, ritiro e costi.","m":"Esempio: città di Berna"},{"h":"Oggetti smarriti","t":"Notificare una perdita, ritiro, ricompensa.","m":"Esempio: città di Berna"},{"h":"Avviare un’esecuzione","t":"Domanda, costi, precetto esecutivo, opposizione.","m":"Esempio: Cantone di Berna"},{"h":"Disdire l’auto","t":"Licenza di circolazione, targhe, imposta e costi.","m":"Esempio: Cantone di Berna"},{"h":"Annunciare un soggiorno settimanale","t":"Chi, termine, certificato e imposte.","m":"Esempio: città di Berna"},{"h":"Uscire dalla Chiesa","t":"Forma, indirizzo, effetto e imposta ecclesiastica.","m":"Esempio: Cantone di Berna"},{"h":"Notificare una bici rubata","t":"Denuncia online, indicazioni, posto di polizia.","m":"Esempio: Cantone di Berna"},{"h":"Depositare un mandato precauzionale","t":"Forma, luogo di deposito, costi.","m":"Esempio: Cantone di Berna"},{"h":"Prorogare il permesso di soggiorno","t":"Avviso di scadenza, documenti, biometria, validità.","m":"Esempio: città di Berna"},{"h":"Riprendere il cognome dopo il divorzio","t":"Cognome da nubile o celibe, termine, costi.","m":"Esempio: Cantone di Berna"}]},{"type":"list","h":"Da sapere","items":["Le risposte provengono da fonti ufficiali pubbliche di Confederazione, Cantoni e Comuni e le citano. Stato: ottobre 2026, senza garanzia.","Le risposte sono esempi per singoli luoghi. Altri Comuni e Cantoni possono differire. Fanno stato sempre i servizi competenti.","La chat riconosce i temi dalle parole chiave. Se nulla corrisponde, lo dice.","Quanto scrive resta nel browser. Non ci sono account né cronologia della conversazione."]},{"type":"list","h":"Non ancora coperto","items":["Tutte le altre pratiche e la maggior parte dei Comuni e dei Cantoni."],"note":"Nessun calendario e nessuna promessa."}]},"neuigkeiten":{"t":"Novità","h":"Novità","lead":"Che cosa è cambiato in Tell, con la data. Sono elencate solo le modifiche effettivamente realizzate.","blocks":[{"type":"news","items":[{"d":"7 ottobre 2026","g":[{"h":"Nuovo tema","li":["Cambiare cassa malati: termine di disdetta, franchigia, premi 2027 e procedura, con fonti di Priminfo (UFSP) e Fedlex (LAMal)."]},{"h":"Nuova pagina","li":["«Chiedi a Tell» con accesso via chat e le sezioni Copertura, Novità, Per le autorità e Partecipare.","«Lacune»: nuova pagina in cui Tell annota dove le informazioni ufficiali sui suoi temi presentano lacune, ambiguità o divergenze. Solo un inizio: 8 osservazioni con fonti, stato al 7 ottobre 2026."]}]},{"d":"5 ottobre 2026","g":[{"h":"Migliorato","li":["Immagine di testata della pagina iniziale: Palazzo federale frontale e più grande."]}]},{"d":"4 ottobre 2026","g":[{"h":"Online","li":["Tell va online come prototipo concettuale privato: pagina iniziale, vista cittadini, vista autorità e progetto."]}]}]}]},"behoerden":{"t":"Per le autorità","h":"Per le autorità","lead":"Tell è un concetto privato. Oggi nessuna autorità collabora con Tell e non esiste alcun accordo con un servizio. Questa pagina mostra come potrebbe essere una collaborazione, in tre livelli: a ogni livello cresce l’utilità per i cittadini, ma anche l’impegno per un servizio.","blocks":[{"type":"phases","h":"Possibile collaborazione (idea di concetto)","items":[{"n":"1","h":"Rileggere e correggere","e":"Impegno ridotto, senza informatica","t":"Un servizio esamina le risposte sui propri temi e segnala per e-mail errori o informazioni superate. Tell adegua la risposta e cita la pagina del servizio come fonte."},{"n":"2","h":"Collegare","e":"Impegno medio, con informatica","t":"Tell rimanda direttamente allo sportello online, al modulo o alla prenotazione dell’appuntamento del servizio, invece di limitarsi a spiegare. Idea del concetto, non realizzata."},{"n":"3","h":"Diventare partner","e":"Impegno elevato, progetto e diritto","t":"Il concetto di progetto prevede un progetto pilota con un Cantone (12 mesi), poi da 6 a 8 Cantoni (24 mesi). Sono ipotesi proprie, né una promessa né un’offerta."}]},{"type":"list","h":"Lacune nelle informazioni ufficiali","items":["Nella pagina «Lacune» Tell annota dove le informazioni ufficiali sui suoi 39 temi presentano lacune, ambiguità o divergenze, con fonti e data di consultazione. Sono osservazioni, non accuse, e servono ad aiutare gli uffici a migliorare le loro informazioni. Solo un inizio: 8 voci, stato al 7 ottobre 2026, da verificare."]},{"type":"list","h":"Che cos’è Tell, e che cosa no","items":["Tell è un concetto privato di Bilal Simsek, Berna, e non un’autorità.","Fatti come termini, tasse e indirizzi provengono solo da fonti ufficiali e sono mostrati con la fonte.","Tell non decide nulla e non fornisce consulenza giuridica. In caso di dubbio rimanda al servizio competente.","Tell non inoltra richieste. Oggi ciò avviene solo sui siti ufficiali."]},{"type":"links","h":"Altro sul concetto","items":[{"l":"Lacune nelle informazioni ufficiali (osservazioni)","href":"luecken.html"},{"l":"Vista autorità (demo)","href":"behoerdensicht.html"},{"l":"Progetto: calendario, costi, rischi","href":"projekt.html"},{"l":"Invia un riscontro a Tell","mail":"fb"}]}]},"mitmachen":{"t":"Partecipare","h":"Partecipare","lead":"Tell è un progetto individuale e vive dei vostri riscontri. Ecco come aiutare, tutto per e-mail e senza account.","blocks":[{"type":"cards","items":[{"h":"Segnalare un errore o un’informazione superata","t":"Un termine, una tassa o un indirizzo non è più corretto? Scriva la domanda e la fonte.","l":"Segnalare un errore","mail":"err"},{"h":"Proporre un tema","t":"Quale pratica manca? Indichi la richiesta e il suo luogo di domicilio.","l":"Proporre un tema","mail":"topic"},{"h":"Riscontro da un servizio","t":"Lavora presso un’autorità? Un breve riscontro su una risposta aiuta moltissimo.","l":"Inviare un riscontro","mail":"fb"},{"h":"Passaparola","t":"Mostri Tell a chi ha a che fare con le autorità e precisi che si tratta di un concetto privato."}]}]}},"f_luecken":"Lacune"},"en":{"title":"Ask Tell – Tell (private concept, prototype)","desc":"Ask Tell: chat entry point of the private concept prototype Tell. 39 topics, answers only from official sources. Not an official site.","page":"Ask Tell","greet":{"m":"Good morning","d":"Good afternoon","e":"Good evening","tail":", Switzerland"},"sub":"What would you like to sort out with the Confederation, your canton or your municipality?","more":"More topics","less":"Fewer","f_views":["Coverage","News","For authorities","Get involved"],"f_pages_h":"More pages of Tell","credit":"Image credit: photo of the Federal Palace in Bern («Bundeshaus Bern 20180827-2»): Suicasmo, CC BY-SA 4.0, via Wikimedia Commons (commons.wikimedia.org/wiki/File:Bundeshaus_Bern_20180827-2.jpg); cut out and edited.","mail":{"fb":"Tell: feedback","err":"Tell: report an error or outdated information","topic":"Tell: topic suggestion"},"views":{"abdeckung":{"t":"Coverage","h":"What Tell covers","lead":"Tell is a concept prototype, not a nationwide information service. Today the chat answers 39 topics, each for example places. For everything else, Tell says openly that it has no answer yet.","blocks":[{"type":"topics","h":"Today: 39 topics","ask":"Ask this","items":[{"h":"Report a move","t":"Deregistration and registration, deadline, costs and process via eUmzugCH.","m":"Example: Bern to Winterthur"},{"h":"Passport & ID","t":"Application, appointment, costs and validity.","m":"Example: canton of Bern"},{"h":"Tax return, extend the deadline","t":"Deadlines, extension and costs.","m":"Example: canton of Bern, partly Zurich and Geneva"},{"h":"Register for the AHV pension","t":"Reference age, registration, early and deferred withdrawal.","m":"Example: born 1962, Thun"},{"h":"Register as unemployed","t":"Registration with the RAV, unemployment benefit and process.","m":"Example: Thun, federal rules"},{"h":"Switch health insurer","t":"Notice deadline, deductible, 2027 premiums and process.","m":"All of Switzerland (federal law, KVG)"},{"h":"Start a sole proprietorship","t":"AHV registration, commercial register, VAT and costs.","m":"Example: Bern"},{"h":"Exchange a foreign driving licence","t":"Deadline, test drive, costs and process.","m":"Example: canton of Bern, German licence"},{"h":"Getting married","t":"Requirements, marriage preparation, deadlines and costs.","m":"Example: City of Zurich, both Swiss citizens"},{"h":"Register a dog","t":"Registration, AMICUS, microchip and dog tax.","m":"Example: City of Bern"},{"h":"Apply for family allowances","t":"Amount, application, back payments and rules.","m":"Example: canton of Bern, employees"},{"h":"Order a debt enforcement extract","t":"Ordering, costs, content and delivery.","m":"Example: canton of Bern"},{"h":"Order a criminal record extract","t":"Ordering online or at the post office, costs and duration.","m":"All of Switzerland (federal)"},{"h":"Register a car","t":"Documents, proof of insurance, costs and tax.","m":"Example: canton of Bern, used car"},{"h":"Naturalisation","t":"Requirements, language, test, process and costs.","m":"Example: City of Bern, ordinary naturalisation"},{"h":"Premium reduction","t":"Income limit, automatic check, application and payment.","m":"Example: canton of Bern, as of 2026"},{"h":"Military service exemption tax","t":"Amount, duration, civil protection, exemption and refund.","m":"Example: canton of Bern, federal rules"},{"h":"Garden shed: permit needed?","t":"Permit-free small buildings, rules, application via eBau.","m":"Example: City of Bern"},{"h":"Lost passport or ID","t":"Loss report, costs, validity and new document.","m":"Example: canton of Bern"},{"h":"Childcare vouchers for daycare","t":"Requirements, work rate, income and application via kiBon.","m":"Example: City of Bern, period 2026/27"},{"h":"Apply for social assistance","t":"Registration, documents, amount and repayment.","m":"Example: City of Bern"},{"h":"Apply for supplementary benefits","t":"Asset limit, living costs 2027, registration and decision.","m":"Example: Thun, canton of Bern"},{"h":"Register with disability insurance","t":"Early detection, registration, integration and pension.","m":"Example: canton of Bern"},{"h":"Maternity benefit","t":"Eligibility, amount, duration and application.","m":"All of Switzerland"},{"h":"Paternity leave","t":"Eligibility, duration, amount and application.","m":"All of Switzerland"},{"h":"Apply for a learner’s permit","t":"Age, eye test, first aid, theory test and costs.","m":"Example: canton of Bern"},{"h":"Order a certificate of residence","t":"Ordering, cost and counter.","m":"Example: city of Bern"},{"h":"Report a death","t":"Death certificate, reporting, burial.","m":"Example: city of Bern"},{"h":"Resident parking permit","t":"Requirements, cost, validity and application.","m":"Example: city of Bern"},{"h":"Dispose of bulky waste","t":"Small items, recycling centre, collection and costs.","m":"Example: city of Bern"},{"h":"Lost property","t":"Reporting a loss, collecting, finder’s reward.","m":"Example: city of Bern"},{"h":"Start debt collection","t":"Request, costs, payment order, objection.","m":"Example: canton of Bern"},{"h":"Deregister a car","t":"Registration document, plates, tax and costs.","m":"Example: canton of Bern"},{"h":"Register as a weekly resident","t":"Who, deadline, certificate and tax.","m":"Example: city of Bern"},{"h":"Leave the church","t":"Form, address, effective date and church tax.","m":"Example: canton of Bern"},{"h":"Report a stolen bike","t":"Online report, details, police station.","m":"Example: canton of Bern"},{"h":"Deposit an advance care mandate","t":"Form, where it is kept, cost.","m":"Example: canton of Bern"},{"h":"Renew a residence permit","t":"Expiry notice, documents, biometrics, validity.","m":"Example: city of Bern"},{"h":"Change your name after divorce","t":"Birth name, deadline, cost.","m":"Example: canton of Bern"}]},{"type":"list","h":"Good to know","items":["Answers come from public, official sources of the Confederation, cantons and municipalities, and name them. As of October 2026, without guarantee.","The answers are examples for individual places. Other municipalities and cantons may differ. The competent authorities are always authoritative.","The chat recognises topics by keywords. If nothing fits, it says so.","What you type stays in your browser. There is no account and no conversation history."]},{"type":"list","h":"Not covered yet","items":["All other official errands, and most municipalities and cantons."],"note":"No timeline and no promise."}]},"neuigkeiten":{"t":"News","h":"News","lead":"What has changed at Tell, with dates. Only changes that were actually made are listed.","blocks":[{"type":"news","items":[{"d":"7 October 2026","g":[{"h":"New topic","li":["Switch health insurer: notice deadline, deductible, 2027 premiums and process, with sources from Priminfo (FOPH) and Fedlex (KVG)."]},{"h":"New page","li":["«Ask Tell» with a chat entry point and the sections Coverage, News, For authorities and Get involved.","“Gaps”: new page where Tell records where official information on its topics shows gaps, ambiguities or discrepancies. Only a start: 8 observations with sources, as of 7 October 2026."]}]},{"d":"5 October 2026","g":[{"h":"Improved","li":["Home page header image: Federal Palace seen from the front and larger."]}]},{"d":"4 October 2026","g":[{"h":"Online","li":["Tell goes online as a private concept prototype: home page, citizen view, authority view and project."]}]}]}]},"behoerden":{"t":"For authorities","h":"For authorities","lead":"Tell is a private concept. Today no authority works with Tell, and there is no agreement with any office. This page shows what a collaboration could look like, in three stages: each stage adds benefit for citizens, but also effort for an office.","blocks":[{"type":"phases","h":"Possible collaboration (concept idea)","items":[{"n":"1","h":"Read and correct","e":"Low effort, no IT","t":"An office reviews the answers on its topics and reports errors or outdated details by e-mail. Tell adjusts the answer and names the office’s page as the source."},{"n":"2","h":"Connect","e":"Medium effort, with IT","t":"Tell links directly to the office’s online counter, form or appointment booking instead of only explaining. An idea in the concept, not built."},{"n":"3","h":"Become a partner","e":"High effort, project and legal","t":"The project concept envisages a pilot with one canton (12 months), then 6 to 8 cantons (24 months). These are own assumptions, not a commitment and not an offer."}]},{"type":"list","h":"Gaps in official information","items":["On the “Gaps” page Tell records where official information on its 39 topics shows gaps, ambiguities or discrepancies, with sources and access date. These are observations, not accusations, meant to help offices improve their information. Only a start: 8 entries, as of 7 October 2026, please verify."]},{"type":"list","h":"What Tell is, and what it is not","items":["Tell is a private concept by Bilal Simsek, Bern, and not an authority.","Facts such as deadlines, fees and addresses come only from official sources and are shown with their source.","Tell decides nothing and gives no legal advice. When unsure, it refers to the competent office.","Tell does not submit applications. Today that only works on the official sites."]},{"type":"links","h":"More on the concept","items":[{"l":"Gaps in official information (observations)","href":"luecken.html"},{"l":"Authority view (demo)","href":"behoerdensicht.html"},{"l":"Project: roadmap, costs, risks","href":"projekt.html"},{"l":"Send feedback to Tell","mail":"fb"}]}]},"mitmachen":{"t":"Get involved","h":"Get involved","lead":"Tell is a one-person project and lives on feedback. Here is how you can help, all by e-mail and without an account.","blocks":[{"type":"cards","items":[{"h":"Report an error or outdated information","t":"Is a deadline, fee or address no longer correct? Send the question and the source.","l":"Report an error","mail":"err"},{"h":"Suggest a topic","t":"Which official errand is missing? Name the matter and your place of residence.","l":"Suggest a topic","mail":"topic"},{"h":"Feedback from an office","t":"Do you work at an authority? A short note on an answer helps most.","l":"Send feedback","mail":"fb"},{"h":"Spread the word","t":"Show Tell to people who deal with authorities, and say that it is a private concept."}]}]}},"f_luecken":"Gaps"}};
const I18N={};

let run=0, phTimer=null, showAll=false, view='home';

function route(q){
  const s=q.toLowerCase();
  /* match at the START of a word, so that e.g. "Hundesteuer" is not taken for "Steuer";
     (?![\p{L}]) after short acronyms makes them whole-word matches */
  const at=r=>new RegExp('(?:^|[^\\p{L}\\p{N}])(?:'+r+')','u').test(s);
  /* priority: specific life events first; a bare "anmeld(en)" or "wohnsitz" only means "move" when nothing more specific matches */
  /* maternity benefit: before unemployment, which would otherwise take "Taggeld" */
  if(at('mutterschaft|mse(?![\\p{L}])|maternit|maternity'))return 'mse';
  /* paternity / other parent's leave */
  if(at('vaterschaftsurlaub|vaterschaftsentsch|papiurlaub|urlaub des and|entsch(?:ä|ae)digung des and|cong(?:é|e) (?:de )?paternit|allocation de paternit|cong(?:é|e) de l.autre parent|congedo (?:di )?paternit|indennit(?:à|a) di paternit|congedo dell.altro genitore|paternity|other.parent.s leave'))return 'pat';
  /* residence certificate: before move, which would otherwise take "Wohnsitz" */
  if(at('wohnsitzbest|wohnsitzbesch|attestation de (?:domicile|r(?:é|e)sidence)|certificat de (?:domicile|r(?:é|e)sidence)|certificato di (?:domicilio|residenza)|attestazione di (?:domicilio|residenza)|(?:certificate|proof|confirmation) of (?:residence|address)|residence certificate'))return 'wsb';
  /* resident parking permit: before car registration and move */
  if(at('parkkarte|anwohnerpark|anwohnerkarte|carte de stationnement|macaron|carta di parcheggio|autorizzazione di parcheggio|contrassegno (?:di )?parcheggio|parking permit|resident(?:s|ial)? parking'))return 'pk';
  /* bulky waste */

  $('#fPagesH').textContent=T().f_pages_h;
  const fp=$('#fPages'); fp.textContent='';
  [['index.html'+q,N[3]],['buergersicht.html'+q,N[0]],['behoerdensicht.html'+q,N[1]],['projekt.html'+q,N[2]],['luecken.html'+q,T().f_luecken],['mailto:'+C,T().f_links[0]]].forEach(([h,t])=>{
    const li=document.createElement('li'), a=document.createElement('a'); a.href=h; a.textContent=t; li.append(a); fp.append(li);
  });
  const sd=$('#fSender'); const p=T().f_sender.split('{c}'); sd.textContent=''; sd.append(p[0]); const a=document.createElement('a'); a.href='mailto:'+C; a.textContent=C; sd.append(a); if(p[1])sd.append(p[1]);
}
function askTopic(key){
  const c=T().chips[MARKS[key]]; if(!c)return;
  go('home',true);
  input.value=tx(c.q); form.classList.add('has-value'); form.requestSubmit();
}
function renderView(name){
  const V=T().views[name], root=$('#viewIn'); root.textContent='';
  const eb=el('p','fq-eyebrow',T().page); const h=el('h1','fq-h',V.h); h.id='viewH'; h.tabIndex=-1; const lead=el('p','fq-lead',V.lead);
  root.append(eb,h,lead);
  V.blocks.forEach(b=>{
    const sec=el('section','fq-b'); if(b.h)sec.append(el('h2',null,b.h));
    if(b.type==='topics'){
      const g=el('div','fq-grid');
      b.items.forEach((it,i)=>{
        const t=el('article','fq-tile'); t.append(el('h3',null,it.h),el('p',null,it.t),el('p','fq-meta',it.m));
        const btn=el('button','btn ghost',b.ask); btn.type='button'; btn.addEventListener('click',()=>askTopic(Object.keys(MARKS)[i])); t.append(btn); g.append(t);
      });
      sec.append(g);
    } else if(b.type==='list'){
      const ul=el('ul','fq-list'); b.items.forEach(s=>ul.append(el('li',null,s))); sec.append(ul); if(b.note)sec.append(el('p','fq-note2',b.note));
    } else if(b.type==='news'){
      b.items.forEach(d=>{
        const row=el('div','fq-day'), tm=el('time',null,d.d); const body=el('div');
        d.g.forEach(gr=>{body.append(el('h3',null,gr.h)); const ul=el('ul'); gr.li.forEach(s=>ul.append(el('li',null,s))); body.append(ul);});
        row.append(tm,body); sec.append(row);
      });
    } else if(b.type==='phases'){
      const g=el('div','fq-ph');
      b.items.forEach(it=>{const a=el('article'); a.append(el('span','n',it.n),el('h3',null,it.h),el('p','e',it.e),el('p',null,it.t)); g.append(a);});
      sec.append(g);
    } else if(b.type==='links'){
      const ul=el('ul','fq-links');
      b.items.forEach(it=>{const li=document.createElement('li'), a=document.createElement('a'); const s=el('span',null,it.l); a.append(s); a.insertAdjacentHTML('beforeend',ARROW); a.href=it.mail?mailHref(it.mail):it.href+q_(); li.append(a); ul.append(li);});
      sec.append(ul);
    } else if(b.type==='cards'){
      const g=el('div','fq-grid');
      b.items.forEach(it=>{
        const t=el('article','fq-tile'); t.append(el('h3',null,it.h),el('p',null,it.t));
        if(it.mail){const a=el('a','btn ghost',it.l); a.href=mailHref(it.mail); t.append(a);}
        g.append(t);
      });
      sec.append(g);
    }
    root.append(sec);
  });
}
function applyView(name,focus){
  view=name;
  const isHome=name==='home';
  hero.hidden=!isHome; $('#viewWrap').hidden=isHome;
  if(!isHome)renderView(name);
  document.title=isHome?T().title:T().views[name].t+' · '+T().page+' – Tell';
  $$('#fViews a').forEach(a=>{ if(a.dataset.view===name)a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  if(focus){scrollTo({top:0,behavior:'auto'}); const t=isHome?$('#main'):$('#viewH'); if(t)t.focus({preventScroll:true});}
}
function go(name,focus){
  const h=HASH[name];
  if(('#'+h)!==location.hash && !(h===''&&location.hash===''))history.pushState(null,'',location.pathname+location.search+(h?'#'+h:''));
  applyView(name,focus);
}
function fromHash(){const k=location.hash.replace(/^#\/?/,''); return VIEWS[k]||'home';}
addEventListener('popstate',()=>applyView(fromHash(),true));
addEventListener('hashchange',()=>applyView(fromHash(),true));
document.addEventListener('click',e=>{
  const a=e.target.closest('#fViews a'); if(!a)return;
  e.preventDefault(); go(a.dataset.view,true);
});

/* ---------- Sprache ---------- */
function setLang(l){
  lang=l; run++;
  document.documentElement.lang=HTML_LANG[l];
  const md=document.querySelector('meta[name=description]'); if(md)md.content=T().desc;
  $$('[data-i]').forEach(el=>{const v=T()[el.dataset.i]; if(typeof v==='string')el.textContent=tx(v);});
  $$('[data-ia]').forEach(el=>{const [a,k]=el.dataset.ia.split(':'); el.setAttribute(a,T()[k]);});
  $$('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===l)));
  buildGreet(); buildChips(); buildPh(); buildNav(); buildFooter(); resetAnswer(); applyView(view,false);
  try{history.replaceState(null,'','?lang='+l+location.hash);}catch(e){}
}
$$('.lang button').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.l!==lang){input.value=''; form.classList.remove('has-value'); setLang(b.dataset.l);} }));

form.addEventListener('submit',e=>{
  e.preventDefault();
  const q=input.value.trim();
  if(!q){form.classList.remove('nudge'); void form.offsetWidth; form.classList.add('nudge'); input.focus(); return;}
  ask(q);
});
input.addEventListener('input',()=>form.classList.toggle('has-value',input.value.length>0));
newQ.addEventListener('click',()=>{ run++; resetAnswer(); input.value=''; form.classList.remove('has-value'); setTimeout(()=>input.focus(),60); });

view=fromHash();
setLang(lang);
})();
</script>

<script>
(function(){
  var b=document.getElementById('tmenuBtn'),m=document.getElementById('tmenu');
  if(!b||!m)return;
  function set(o){
    if(o){var h=document.querySelector('.site-header,.top');if(h){m.style.top=(h.getBoundingClientRect().bottom+8)+'px'}}
    m.hidden=!o;b.setAttribute('aria-expanded',o?'true':'false');
  }
  b.addEventListener('click',function(e){e.stopPropagation();set(m.hidden)});
  document.addEventListener('click',function(e){if(!m.hidden&&!m.contains(e.target)&&!b.contains(e.target))set(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!m.hidden){set(false);b.focus()}});
  addEventListener('resize',function(){if(!m.hidden)set(false)});
})();
</script>
