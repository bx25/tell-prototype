ale","q":"Abito a Berna e non riesco a presentare la dichiarazione d’imposta entro metà marzo. Come prolungo il termine e quanto costa?"},{"l":"Rendita AVS","q":"Sono nato/a nel 1962 e abito a Thun: quando e dove richiedo la rendita AVS?"},{"l":"Disoccupazione","q":"Abito a Thun e alla fine del mese perdo il mio posto di lavoro. Dove e quando devo annunciarmi e come ottengo l’indennità di disoccupazione?"},{"l":"Cambiare cassa","q":"Entro quando posso cambiare cassa malati e come funziona?"},{"l":"Ditta individuale","q":"Abito a Berna e mi metto in proprio con una ditta individuale. Che cosa devo annunciare e dove?"},{"l":"Patente estera","q":"Abito a Berna da qualche mese e ho una patente di guida tedesca. Devo cambiarla, e come?"},{"l":"Sposarsi","q":"Siamo entrambi svizzeri, abitiamo a Zurigo e vogliamo sposarci. Come funziona e quanto costa?"},{"l":"Annunciare un cane","q":"Abito nella città di Berna e ho preso un cane. Dove devo annunciarlo e quanto costa?"},{"l":"Assegni per i figli","q":"Sono dipendente a Berna e ho avuto un bambino. Come ottengo gli assegni per i figli e quanto ricevo?"},{"l":"Estratto esecuzioni","q":"Abito a Berna e mi serve un estratto del registro delle esecuzioni per un nuovo appartamento. Dove lo ordino e quanto costa?"},{"l":"Casellario giudiziale","q":"Mi serve un estratto del casellario giudiziale per un nuovo lavoro. Come lo ordino e quanto tempo ci vuole?"},{"l":"Immatricolare l’auto","q":"Abito a Berna e ho comprato un’auto d’occasione. Come la immatricolo e quanto costa?"},{"l":"Naturalizzazione","q":"Vivo in Svizzera da 12 anni, di cui 3 nella città di Berna, e ho il permesso C. Posso naturalizzarmi e quanto costa?"},{"l":"Riduzione dei premi","q":"Abito nel Cantone di Berna e guadagno poco. Ho diritto alla riduzione dei premi e devo chiederla?"},{"l":"Tassa d’esenzione","q":"Ho 22 anni, abito a Berna e sono stato dichiarato inabile al servizio militare. Devo pagare la tassa d’esenzione e quanto?"},{"l":"Casetta da giardino","q":"Abito nella città di Berna e voglio mettere una piccola casetta da giardino. Mi serve una licenza edilizia?"},{"l":"Documento smarrito","q":"Abito a Berna e ho perso la carta d’identità. Che cosa devo fare e quanto costa?"},{"l":"Buoni per l’asilo nido","q":"Abitiamo nella città di Berna e vogliamo mandare nostro figlio all’asilo nido. Riceviamo buoni di custodia e come li chiediamo?"},{"l":"Aiuto sociale","q":"Abito nella città di Berna e non riesco più ad arrivare a fine mese. Come chiedo l’aiuto sociale?"},{"l":"Prestazioni complementari","q":"Sono in pensione, abito a Thun e la mia rendita AVS non basta. Posso chiedere le prestazioni complementari?"},{"l":"Iscrizione AI","q":"Abito a Berna e da mesi sono malato e incapace al lavoro. Come mi iscrivo all’assicurazione invalidità?"},{"l":"Indennità di maternità","q":"Sono salariata e aspetto un bambino in primavera. Quanta indennità di maternità ricevo e come la richiedo?"},{"l":"Congedo di paternità","q":"Sono salariato e divento padre in primavera. Quanto dura il congedo di paternità e come ottengo l’indennità?"},{"l":"Licenza per allievo","q":"Ho 17 anni, abito a Berna e voglio imparare a guidare. Come ottengo la licenza per allievo conducente?"},{"l":"Certificato di domicilio","q":"Abito nella città di Berna e mi serve un certificato di domicilio. Dove lo ottengo e quanto costa?"},{"l":"Notificare un decesso","q":"Mia madre è morta a casa nella città di Berna. Cosa devo fare adesso e dove notifico il decesso?"},{"l":"Carta di parcheggio","q":"Abito nella città di Berna e ho un’auto. Come ottengo una carta di parcheggio per residenti e quanto costa?"},{"l":"Rifiuti ingombranti","q":"Abito nella città di Berna e voglio sbarazzarmi di un vecchio divano. Come smaltisco i rifiuti ingombranti e quanto costa?"},{"l":"Oggetti smarriti","q":"Ho perso il portamonete nella città di Berna. Come lo notifico all’ufficio oggetti smarriti?"},{"l":"Avviare un’esecuzione","q":"Un cliente a Berna non paga la mia fattura di CHF 2'000. Come avvio un’esecuzione?"},{"l":"Disdire l’auto","q":"Abito nel Cantone di Berna e vendo la mia auto. Come la disdico e cosa succede con le targhe?"},{"l":"Soggiorno settimanale","q":"Lavoro ora nella città di Berna e il fine settimana torno a casa in Vallese. Come mi annuncio come dimorante settimanale?"},{"l":"Uscire dalla Chiesa","q":"Abito a Berna e voglio uscire dalla Chiesa. Come si fa e da quando non pago più l’imposta ecclesiastica?"},{"l":"Bici rubata","q":"Mi hanno rubato la bici a Berna. Come notifico il furto alla polizia?"},{"l":"Mandato precauzionale","q":"Abito a Berna e voglio fare un mandato precauzionale. Che forma deve avere e dove lo deposito?"},{"l":"Prorogare il permesso","q":"Abito nella città di Berna e il mio permesso B scade presto. Come lo rinnovo?"},{"l":"Cognome dopo divorzio","q":"Sono divorziata, abito a Berna e voglio riprendere il mio cognome da nubile. Come si fa?"}],"think":"Tell consulta le fonti ufficiali","who":"Competenza","bund":"Confederazione","kanton":"Cantone","gemeinde":"Comune","src":"Fonti","glance":"In breve","stand":"Stato: ottobre 2026 · Risposta a titolo di esempio, tratta da fonti pubbliche, senza garanzia. Fanno stato gli uffici competenti.","newtab":"si apre in una nuova scheda","newq":"Nuova domanda","fb":{"intro":"Il prototipo non ha ancora una risposta a questa domanda. La versione definitiva consulterebbe qui le fonti ufficiali di Confederazione, cantoni e comuni. Risponde già a 23 esempi: trasloco, passaporto e carta d’identità, dichiarazione d’imposta, rendita AVS, disoccupazione, cambio della cassa malati, fondazione di una ditta individuale cambio di una patente estera, matrimonio, annuncio di un cane, assegni familiari, estratto delle esecuzioni, estratto del casellario giudiziale, immatricolazione dell’auto, naturalizzazione, riduzione dei premi, tassa d’esenzione dall’obbligo militare, casetta da giardino, documento d’identità smarrito, buoni di custodia, aiuto sociale, prestazioni complementari e iscrizione all’AI. Provi uno di questi."},"ans":{"move":{"intro":"Lei si annuncia entro 14 giorni presso il nuovo comune. Da Berna a Winterthur ciò avviene online tramite eUmzugCH: entrambi i comuni sono collegati e non è necessario recarsi allo sportello.","facts":[["Scadenza","14 giorni dal cambio di indirizzo (art. 11 LArRa)"],["Costi","Winterthur: CHF 40 per persona adulta; eUmzugCH non costa più dello sportello"],["Sportello","Non necessario, tutto avviene online"],["Competenza","Servizi agli abitanti di Berna (partenza), controllo abitanti di Winterthur (arrivo)"]],"steps":["Su eumzug.swiss inserire il vecchio indirizzo (Berna) e il nuovo indirizzo (Winterthur) e avviare la verifica.","Tenere pronti: passaporto o carta d’identità, numero AVS (13 cifre), contratto di locazione o conferma di entrata nell’alloggio, carta o Twint per CHF 40.","Tenere pronta la tessera della cassa malati o la polizza: Winterthur richiede questa prova al momento dell’annuncio di arrivo.","Concludere online l’annuncio di partenza a Berna e l’annuncio di arrivo a Winterthur; una visita allo sportello a Berna non è necessaria.","Ufficio delle imposte: Winterthur riceve automaticamente il nuovo indirizzo; vi è assoggettato all’imposta dal 1° gennaio dell’anno di arrivo."],"who":[1,1,1],"note":"I comuni (Berna, Winterthur) ricevono gli annunci di partenza e di arrivo, eUmzugCH è il servizio comune di Confederazione, cantoni e comuni; le imposte sono riscosse dal Cantone di Zurigo con la Città di Winterthur.","src":["eUmzugCH – annunciare il trasloco online (Confederazione, cantoni, comuni)","Città di Winterthur – trasloco e arrivo a Winterthur","Città di Berna – arrivo, trasloco e partenza","Città di Winterthur – imposte in caso di trasloco, arrivo e partenza"]},"passport":{"intro":"Come persona adulta domiciliata a Berna, Lei richiede passaporto e/o carta d’identità online su schweizerpass.ch e si reca poi all’appuntamento prenotato, p. es. al centro documenti d’identità di Berna (Laupenstrasse 18A). La combinazione passaporto + carta d’identità costa CHF 158 ed è valida 10 anni.","facts":[["Costi","Adulti: carta d’identità CHF 70, passaporto CHF 145, combinazione CHF 158. Bambini fino a 18 anni: carta d’identità 35, passaporto 65, combinazione 78 (porto incluso)."],["Validità","Adulti 10 anni, bambini e giovani fino a 18 anni: 5 anni. Una proroga non è possibile, si ordina un nuovo documento."],["Durata","Consegna al massimo 10 giorni lavorativi dopo l’appuntamento, per raccomandata."],["Appuntamento","Obbligatorio, presenza personale necessaria (foto, per il passaporto impronte digitali)."],["Novità da novembre","Dal 2 novembre 2026 esiste anche la carta d’identità biometrica con chip (immagine del viso e due impronte digitali). Facoltativa, stessa tassa di oggi. Il passaporto provvisorio si chiamerà allora «passaporto d’emergenza»."]],"steps":["Compilare la richiesta online su schweizerpass.ch (indirizzo e-mail personale necessario). Dopo la verifica riceve un’e-mail per scegliere l’appuntamento.","Prenotare l’appuntamento in uno dei 7 centri documenti d’identità bernesi (obbligatorio): online o per telefono allo 031 635 40 00, lun–ven.","Portare il vecchio documento, ma nessuna fotografia: la foto viene scattata sul posto.","Pagare l’importo sul posto (carta, Twint o contanti). I bambini vengono con una persona titolare dell’autorità parentale e il suo documento d’identità.","Il documento arriva entro 10 giorni lavorativi, per raccomandata, all’indirizzo indicato."],"who":[1,1,0],"note":"La Confederazione (fedpol) pubblica prezzi, validità e termini di consegna; nel Cantone di Berna i sette centri cantonali documenti d’identità registrano i Suoi dati.","src":["fedpol: prezzi, validità e termini di consegna","Cantone di Berna: documenti d’identità, prezzi e validità","Cantone di Berna: centri documenti d’identità e appuntamento","Cantone di Berna: presentarsi all’appuntamento, documenti da portare","Consiglio federale: carta d’identità biometrica dal 2.11.2026 (comunicato del 26.8.2026)"]},"tax":{"intro":"Nel Cantone di Berna la dichiarazione d’imposta scade di regola il 15 marzo; online può prorogare gratuitamente fino al 15 luglio, al massimo fino al 15 novembre. Per il periodo fiscale 2025, a causa di un’interruzione informatica, il 30 novembre 2026 vale eccezionalmente come ultimo termine.","facts":[["Scadenza","Berna: 15 marzo (indipendenti: 15 maggio). Zurigo e Ginevra: 31 marzo."],["Costi","Berna online: gratis fino al 15 luglio, CHF 20 fino al 15 sett., CHF 40 fino al 15 nov. Per scritto/telefono: CHF 20/40/60. Ginevra: CHF 20/40/60."],["Durata","Berna: al massimo fino al 15 nov.; dichiarazione 2025 eccezionalmente fino al 30 nov. 2026 (interruzione informatica)."],["Competenza","Berna: amministrazione cantonale delle imposte. Zurigo: ufficio comunale delle imposte. Ginevra: Administration fiscale cantonale."]],"steps":["Tenere pronti la lettera sulla dichiarazione d’imposta, il certificato di salario (del datore di lavoro) e i giustificativi.","Prima della scadenza, in BE-Login (con AGOV): «Fristverlängerung erfassen» (registrare la proroga), scegliere il nuovo termine e confermare.","Salvare la conferma da sé: non ne arriva nessuna per posta o e-mail.","Compilare la dichiarazione in TaxMe-Online e inoltrarla con i giustificativi (oppure consegnarla stampata al comune di domicilio).","In ritardo? Si rischia una tassa di sollecito di CHF 60; scaduto il termine di sollecito, non è più possibile alcuna proroga."],"who":[1,1,1],"note":"L’amministrazione cantonale delle imposte riceve la Sua dichiarazione e tassa anche l’imposta federale diretta su mandato della Confederazione (vigilanza dell’AFC); il comune fissa il proprio moltiplicatore d’imposta.","src":["Cantone di Berna: prorogare il termine come persona privata","Cantone di Berna: istruzioni, termine di inoltro","Cantone di Zurigo: dichiarazione d’imposta delle persone fisiche","Cantone di Ginevra: richiedere una proroga"]},"ahv":{"intro":"Un uomo nato nel 1962 e residente a Thun raggiunge nel 2027, a 65 anni, l’età di riferimento e richiede la rendita alla cassa di compensazione 3–4 mesi prima. Con compleanno il 15 marzo 2027 la rendita inizia il 1° aprile 2027; la richiesta si presenta da circa dicembre 2026.","facts":[["Età di riferimento","Uomini 65. Donne: nate nel 1961 = 64 anni e 3 mesi, 1962 = 64 anni e 6 mesi, 1963 = 64 anni e 9 mesi, dal 1964 = 65. Rendita dal mese successivo."],["Scadenza","Richiesta 3–4 mesi prima dell’inizio della rendita. Anticipo dai 63 anni (–6.8 % per 1 anno), differimento 1–5 anni (+5.2 % fino a +31.5 %)."],["Rendita","Dal 2027, con durata di contribuzione completa CHF 1’280–2’560 al mese; coppia al massimo CHF 3’840. In più la 13a rendita da dicembre 2026."],["Competenza","Cassa di compensazione a cui è affiliato il Suo datore di lavoro (nel Cantone di Berna p. es. la cassa di compensazione del Cantone di Berna, AK Bern)."]],"steps":["Chiarire la cassa di compensazione competente: i dipendenti chiedono al datore di lavoro, gli indipendenti all’ultima cassa con cui hanno conteggiato.","Compilare e inoltrare online il modulo 318.370 «Richiesta di una rendita di vecchiaia» 3–4 mesi prima dell’inizio della rendita.","Anticipo: da chiedere al più tardi entro la fine del mese precedente. Differimento: da spuntare nel modulo al più tardi 1 anno dopo l’età di riferimento.","Caricare gli allegati con il modulo o inviarli per posta; la cassa di compensazione procura i documenti necessari e calcola la rendita.","Pagamento mensile (AK Bern: 4° giorno lavorativo, p. es. il 4 dicembre 2026); la 13a rendita di dicembre arriva senza richiesta."],"who":[1,1,0],"note":"La Confederazione (UFAS) stabilisce le regole e pubblica i fogli informativi; la cassa di compensazione (nel Cantone di Berna l’AK Bern) riceve la Sua richiesta, calcola e versa la rendita.","src":["Cassa di compensazione del Cantone di Berna: rendita di vecchiaia dell’AVS","ahv-iv.ch: opuscolo 3.01 Rendite di vecchiaia (stato 1.1.2026)","ch.ch: pensionamento – da quando?","UFAS: stabilizzazione dell’AVS (AVS 21)","Consiglio federale: aumento delle rendite AVS/AI al 1.1.2027 (2.10.2026)"]},"alv":{"intro":"Si annunci all’URC della Sua regione al più tardi il primo giorno per cui desidera l’indennità di disoccupazione, nel modo più rapido online nel Job-Room. Esempio a Thun: 30 anni, salario mensile di 6’500 franchi, nessun figlio, 14 mesi di contribuzione danno il 70 %, al massimo 260 indennità giornaliere e 10 giorni di attesa.","facts":[["Scadenza","Annuncio all’URC al più tardi il 1° giorno di disoccupazione, meglio già durante il periodo di disdetta."],["Importo","70 % del guadagno assicurato. 80 % con figli sotto i 25 anni, guadagno fino a 3’797 franchi o rendita AI dal 40 %."],["Durata","Almeno 12 mesi di contribuzione in 2 anni. 260 indennità giornaliere, di più con un periodo di contribuzione più lungo. Termine quadro: 2 anni."],["Competenza","URC (annuncio, consulenza) e la cassa di disoccupazione da Lei scelta (pagamento)."]],"steps":["Annunciarsi online tramite l’e-service per l’annuncio all’URC nel Job-Room, oppure di persona presso l’URC della Sua regione.","Cercare lavoro già durante il periodo di disdetta e documentare ogni candidatura. Quante, lo stabilisce il Suo URC.","Scegliere la cassa di disoccupazione, inoltrare la «richiesta di indennità di disoccupazione» e le attestazioni del datore di lavoro (2 anni).","Primo colloquio all’URC (invito entro 15 giorni): portare la tessera AVS o della cassa malati, un documento d’identità e la prova delle ricerche di lavoro.","Ogni mese inoltrare le «indicazioni della persona assicurata». Le indennità giornaliere seguono di regola il mese successivo."],"who":[1,1,0],"note":"La SECO vigila sull’assicurazione contro la disoccupazione; URC, casse di disoccupazione e uffici cantonali la eseguono; l’annuncio si fa direttamente all’URC.","src":["arbeit.swiss: annuncio e registrazione","arbeit.swiss (SECO): FAQ sull’indennità di disoccupazione","ch.ch: disoccupazione in Svizzera","Fedlex: LADI (RS 837.0), art. 9, 17, 18, 22, 27"]},"kk":{"intro":"Lei può cambiare l’assicurazione di base per la fine dell’anno se la disdetta giunge alla cassa entro lunedì 30 novembre 2026. La nuova cassa deve accettarLa senza domande sullo stato di salute. I premi 2027 sono già nel calcolatore dei premi di priminfo.admin.ch.","facts":[["Scadenza","La disdetta deve giungere alla cassa al più tardi l’ultimo giorno lavorativo di novembre (2026: lunedì 30 novembre). Conta la ricezione, non il timbro postale. Consigliato: raccomandata entro metà novembre."],["Franchigia","Adulti: CHF 300 oppure, a scelta, 500, 1’000, 1’500, 2’000, 2’500, più il 10 % di aliquota percentuale, al massimo CHF 700 all’anno. Bambini: nessuna franchigia, aliquota percentuale al massimo CHF 350."],["Cambiare franchigia","Franchigia più bassa: comunicarlo per scritto entro l’ultimo giorno lavorativo di novembre. Franchigia più alta: solo a inizio anno; la legge non fissa un termine, Priminfo raccomanda di comunicarlo entro metà dicembre."],["A metà anno","Cambio al 1° luglio solo con la franchigia ordinaria (CHF 300) e libera scelta del fornitore di prestazioni, disdetta entro il 31 marzo. Con un modello a scelta limitata (p. es. medico di famiglia o telemedicina) il cambio è possibile solo a fine anno."],["Attenzione","Premi o partecipazioni ai costi non pagati e sollecitati entro il 30 novembre: la disdetta ha effetto solo se li paga, con interessi di mora e spese d’esecuzione, entro il 31 dicembre (art. 64a LAMal)."],["Competenza","La cassa attuale e la nuova cassa. La Confederazione (UFSP) approva i premi."]],"steps":["Confrontare i premi 2027 su priminfo.admin.ch: indicare domicilio, età, franchigia e modello (p. es. medico di famiglia o telemedicina).","Scegliere la nuova cassa e richiedere l’assicurazione di base. Ogni cassa deve accettarLa, senza domande sulla salute, riserve o periodi d’attesa.","Disdire per scritto l’assicurazione di base attuale, meglio con raccomandata entro metà novembre.","Non disdire troppo in fretta l’assicurazione complementare: per questa la cassa può porre domande sulla salute e rifiutare. Il termine di disdetta è nelle condizioni d’assicurazione, spesso tre mesi per fine anno. La cassa non può disdirla perché Lei cambia l’assicurazione di base.","Attendere la conferma della nuova cassa: la vecchia assicurazione termina solo quando la nuova ha comunicato la copertura senza interruzioni. Se la comunicazione arriva in ritardo, la nuova cassa deve coprire la differenza di premio."],"who":[1,0,0],"note":"La legge (LAMal) e l’approvazione dei premi spettano alla Confederazione (UFSP). Disdetta e adesione avvengono direttamente con le casse malati, nessuna autorità le riceve.","src":["Priminfo (UFSP): FAQ, cambio della cassa malati","Priminfo (UFSP): calcolatore dei premi 2027","Priminfo (UFSP): premi 2027 per cantone","Fedlex: LAMal (RS 832.10), art. 7 e 64a"]},"biz":{"intro":"Chi a Berna si mette in proprio con una ditta individuale si annuncia prima come indipendente alla cassa di compensazione. L’iscrizione nel registro di commercio e all’IVA è obbligatoria solo da CHF 100’000 di cifra d’affari all’anno. Le pratiche si svolgono online su EasyGov.swiss, il portale della Confederazione.","facts":[["AVS","Annuncio alla cassa di compensazione della sede dell’impresa (Berna: AK Bern). Contributo del 10 % del reddito, meno sotto CHF 60’500; nel 2026 almeno CHF 530 all’anno."],["Registro di commercio","Obbligatorio da CHF 100’000 di cifra d’affari nell’ultimo esercizio, altrimenti facoltativo. Emolumento CHF 120. La ditta deve contenere il suo cognome."],["IVA","Obbligatoria da CHF 100’000 di cifra d’affari all’anno, o appena ciò è prevedibile all’avvio. Iscrizione presso l’AFC entro 30 giorni."],["Autorizzazione","Necessaria solo per determinate attività regolamentate. Da verificare prima di iniziare."]],"steps":["Aprire un conto su EasyGov.swiss, scegliere «ditta individuale» e definire la ditta con il suo cognome.","Annunciarsi come indipendente all’AK Bern, se possibile nel primo trimestre: online o con il modulo 318.146, con giustificativi come fatture, conto economico o pubblicità.","Da CHF 100’000 di cifra d’affari annua: iscrizione nel registro di commercio di Berna (CHF 120) e annuncio all’AFC per l’IVA entro 30 giorni.","Prima di iniziare, verificare se la sua attività richiede un’autorizzazione."],"who":[1,1,0],"note":"La cassa di compensazione e il registro di commercio sono cantonali (a Berna: AK Bern e registro di commercio del Cantone di Berna), l’IVA è riscossa dalla Confederazione (AFC). EasyGov.swiss è lo sportello online della Confederazione per tutti e tre.","src":["Portale PMI (SECO): ditta individuale","Registro di commercio di Berna: promemoria sull’iscrizione di una ditta individuale","Cassa di compensazione del Cantone di Berna: indipendenti","ahv-iv.ch: opuscolo 2.02, contributi degli indipendenti","AFC: assoggettamento all’IVA","EasyGov.swiss: fondare una ditta individuale"]},"drv":{"intro":"Chi abita in Svizzera può guidare con una patente estera solo per 12 mesi. Nel Cantone di Berna la cambia presso l’Ufficio della circolazione stradale (SVSA). Una patente tedesca, rilasciata nell’UE, non richiede una corsa di controllo; il cambio costa CHF 120.","facts":[["Termine","12 mesi dall’entrata secondo il permesso di dimora (art. 42 OAC). Presentare la domanda prima, per poter guidare senza interruzione. Il cambio è possibile anche dopo, ma con una possibile multa."],["Corsa di controllo","Nessuna per patenti dell’UE/AELS e di Andorra, Australia, Israele, Giappone, Canada, Corea del Sud, Marocco, Monaco, Nuova Zelanda, San Marino, Singapore, Taiwan, Tunisia e Stati Uniti. Tutti gli altri svolgono una corsa di controllo."],["Costi","Berna: cambio CHF 120, corsa di controllo categoria B CHF 132."],["Competenza","Ufficio della circolazione stradale e della navigazione del Cantone di Berna (SVSA), Schermenweg 5, Berna."]],"steps":["Fare un test della vista presso un ottico o un oculista riconosciuto.","Compilare e firmare il modulo di domanda dello SVSA e incollare una fototessera recente a colori (35 × 45 mm).","Consegnare la domanda di persona: presso una sede dello SVSA, il controllo abitanti del suo Comune o un posto di polizia del Cantone di Berna. Portare: patente estera originale e passaporto o carta d’identità.","Se necessario, svolgere la corsa di controllo. La patente svizzera le arriva per posta."],"who":[1,1,0],"note":"La Confederazione (USTRA) disciplina il cambio nell’ordinanza sull’ammissione alla circolazione; l’ufficio cantonale della circolazione (a Berna lo SVSA) esamina la domanda e rilascia la patente.","src":["Cantone di Berna (SVSA): cambio della patente estera","Cantone di Berna (SVSA): emolumenti","ch.ch: cambiare la licenza di condurre","USTRA: cambio delle patenti estere"]},"wed":{"intro":"Se siete entrambi svizzeri e abitate a Zurigo, prenotate prima online luogo e data presso l’ufficio dello stato civile della città di Zurigo, al più presto 12 mesi prima. La preparazione del matrimonio si svolge in due allo sportello dello Stadthaus, al più tardi 1 mese prima del matrimonio.","facts":[["Requisiti","Entrambi almeno 18 anni e capaci di discernimento. Parenti in linea retta, fratelli e sorelle, germani o consanguinei e uterini, non possono sposarsi tra loro."],["Termine","Invito alla preparazione al più presto 3 mesi prima del matrimonio. Concluderla al più tardi 1 mese prima, altrimenti la prenotazione viene annullata."],["Costi","Zurigo: matrimonio più economico allo Stadthaus da CHF 255, preparazione senza traduzione inclusa (solo con domicilio nella città di Zurigo)."],["Testimoni","Devono essere presenti due testimoni maggiorenni e capaci di discernimento."]],"steps":["Prenotare luogo e data sul sito dell’ufficio dello stato civile di Zurigo, al più presto 12 mesi prima.","Al più presto 3 mesi prima del matrimonio arriva un invito per e-mail. Con questo scegliete online un appuntamento per la preparazione.","Presentarsi in due allo sportello dello Stadthaus, con passaporto o carta d’identità. Compilate e firmate il modulo e stabilite i cognomi che porterete voi ed eventualmente i vostri figli.","Pagare gli emolumenti sul posto con carta o Twint. Al matrimonio portare due testimoni."],"who":[1,0,1],"note":"La Confederazione stabilisce le regole del matrimonio (CC) e gli emolumenti; a Zurigo la preparazione e la celebrazione spettano all’ufficio dello stato civile della città.","src":["Città di Zurigo: sposarsi con domicilio a Zurigo","Città di Zurigo: preparazione del matrimonio","Città di Zurigo: domande e risposte sul matrimonio","ch.ch: sposarsi in Svizzera"]},"dog":{"intro":"Nella città di Berna annuncia il suo cane ai servizi agli abitanti con il modulo di annuncio del cane. Se ha preso il cane da qualcun altro, annuncia il cambio di detentore alla banca dati AMICUS entro 10 giorni. La tassa sui cani è di CHF 150 all’anno.","facts":[["Annuncio","Ai servizi agli abitanti della città di Berna (Einwohnerdienste), Predigergasse 5, 3011 Berna. Il Comune la registra come detentore in AMICUS."],["Termine","Cambio di detentore (acquisto, presa in consegna, cessione per oltre 3 mesi) da annunciare ad AMICUS entro 10 giorni. Cani importati: far controllare e annunciare il microchip da un veterinario entro 10 giorni."],["Costi","Città di Berna: CHF 150 per cane all’anno, per cani da 6 mesi. La fattura arriva automaticamente in agosto."],["Microchip","Obbligatorio per ogni cane; cuccioli entro 3 mesi. Solo i veterinari impiantano il chip e annunciano il cane ad AMICUS."]],"steps":["Compilare il modulo della città di Berna per l’annuncio del cane e inviarlo per posta ai servizi agli abitanti.","Se il cane ha già un chip: annunciare il cambio di detentore ad AMICUS entro 10 giorni. Altrimenti: farlo microchippare da un veterinario.","Pagare la tassa sui cani quando arriva la fattura in agosto.","In caso di trasloco, cessione o morte del cane: informare il Comune e AMICUS."],"who":[1,0,1],"note":"La Confederazione prescrive il microchip e la registrazione in AMICUS (ordinanza sulle epizoozie); il Comune riceve l’annuncio e riscuote la tassa sui cani.","src":["Città di Berna: cani","Città di Berna: modulo di annuncio del cane","AMICUS: buono a sapersi (promemoria)","ch.ch: imposta sui cani"]},"fam":{"intro":"Se è dipendente nel Cantone di Berna, chiede gli assegni familiari al suo datore di lavoro. Lui trasmette la domanda alla sua cassa di compensazione per assegni familiari. L’assegno per i figli è di CHF 250 al mese per figlio (stato 2026).","facts":[["Importo","Cantone di Berna, stato 2026: assegno per i figli CHF 250 al mese fino al mese del 16° compleanno. Assegno di formazione CHF 310 per figli in formazione, al più presto da 15 anni, al più tardi fino a 25."],["Domanda","Dipendenti: presso il datore di lavoro. Persone senza attività lucrativa: presso la cassa di compensazione cantonale (AK Bern)."],["Termine","Nessun termine fisso; gli assegni dimenticati si possono chiedere fino a 5 anni a ritroso."],["Per figlio","Un solo assegno per figlio, anche se lavorano entrambi i genitori."]],"steps":["Chiedere al datore di lavoro il modulo di domanda per gli assegni familiari.","Compilare e firmare il modulo con i dati del figlio e dell’altro genitore.","Il datore di lavoro trasmette la domanda alla sua cassa di compensazione per assegni familiari e versa l’assegno.","Se lavorano entrambi i genitori: chiarire prima chi presenta la domanda, perché c’è un solo assegno per figlio."],"who":[1,1,0],"note":"La Confederazione fissa gli importi minimi (legge sugli assegni familiari), il Cantone di Berna versa il 115 % di questi importi; il pagamento avviene tramite la cinquantina di casse di compensazione per assegni familiari del Cantone.","src":["Portale per le famiglie del Cantone di Berna: assegni per i figli e di formazione","ch.ch: assegni familiari","ahv-iv.ch: opuscolo 6.08 assegni familiari","Cassa di compensazione del Cantone di Berna: assegni familiari"]},"debt":{"intro":"Nel Cantone di Berna ordina l’estratto del registro delle esecuzioni online presso l’ufficio cantonale d’esecuzione e fallimenti (be.ch/baka). Costa CHF 18 compreso l’invio e arriva in forma elettronica da scaricare.","facts":[["Costi","Cantone di Berna online: CHF 18 compreso l’invio (emolumento CHF 17 per estratto)."],["Contenuto","Le esecuzioni degli ultimi 5 anni nel rispettivo circondario."],["Trasloco","Chi negli ultimi 5 anni ha abitato altrove ordina un estratto anche lì, altrimenti quelle esecuzioni mancano."],["Invio","Ordinazione online solo elettronica: download su una piattaforma protetta, possibile più volte."]],"steps":["Ordinare online su be.ch/baka l’estratto del registro delle esecuzioni a proprio nome.","Tenere pronto un documento d’identità valido: carta d’identità, passaporto o permesso per stranieri.","Pagare l’emolumento al momento dell’ordinazione: carta, PostFinance Pay o Twint.","Scaricare l’estratto dalla piattaforma protetta e trasmetterlo, ad esempio al locatore."],"who":[1,1,0],"note":"La Confederazione disciplina il diritto esecutivo (LEF) e gli emolumenti; nel Cantone di Berna l’ufficio cantonale d’esecuzione e fallimenti (BAKA) tiene i registri.","src":["Cantone di Berna (BAKA): ordinare l’estratto delle esecuzioni","ch.ch: ordinare un estratto del registro delle esecuzioni","Cantone di Berna: ordinazione online dell’estratto (comunicato)"]},"crim":{"intro":"L’estratto del casellario giudiziale (estratto per privati) si ordina presso la Confederazione, online su strafregister.admin.ch o allo sportello della Posta. Costa CHF 17 e arriva per posta circa 10 giorni lavorativi dopo la ricezione del modulo firmato.","facts":[["Costi","CHF 17 per l’estratto. Autenticazione o apostille: CHF 20 in più."],["Durata","Circa 10 giorni lavorativi dopo la ricezione del modulo firmato."],["Ordinazione","Online su strafregister.admin.ch o di persona allo sportello della Posta con un documento d’identità valido."],["Estratto specifico","Per attività con minorenni esiste un estratto distinto, l’estratto specifico per privati."]],"steps":["Su strafregister.admin.ch scegliere l’estratto per privati e inserire dati personali, indirizzo e pagamento.","Pagare l’emolumento online: carta di debito o di credito, PostFinance Card o Twint.","Stampare il modulo, firmarlo e inviarlo per posta con una copia del documento d’identità.","In alternativa: ordinarlo allo sportello della Posta con passaporto, carta d’identità o permesso per stranieri e pagare subito."],"who":[1,0,0],"note":"Il casellario giudiziale è tenuto dalla Confederazione (Ufficio federale di giustizia). Si ordina direttamente presso la Confederazione o a uno sportello della Posta.","src":["Ufficio federale di giustizia: ordinare l’estratto","Ufficio federale di giustizia: FAQ estratto per privati","ch.ch: estratto del casellario giudiziale"]},"car":{"intro":"Nel Cantone di Berna immatricola l’auto presso l’Ufficio della circolazione stradale (SVSA), per posta o allo sportello. Prima la sua assicurazione invia l’attestato d’assicurazione per via elettronica all’ufficio. La licenza di circolazione costa CHF 45 per posta o CHF 55 allo sportello.","facts":[["Documenti","Attestato d’assicurazione (inviato dall’assicurazione all’ufficio per via elettronica), licenza di circolazione del detentore precedente, rapporto di collaudo se l’auto è stata controllata, documento d’identità."],["Costi","Licenza di circolazione: CHF 45 per posta, CHF 55 allo sportello. Nuove targhe: CHF 45 la coppia, CHF 30 una sola."],["Termine","L’attestato d’assicurazione vale 30 giorni. L’imposta sui veicoli va pagata entro 30 giorni dalla fattura."],["Imposta","Imposta annuale sui veicoli, fatturata a gennaio o all’immatricolazione. L’importo lo mostra il calcolatore dello SVSA."]],"steps":["Stipulare un’assicurazione di responsabilità civile. L’assicurazione invia l’attestato d’assicurazione allo SVSA per via elettronica.","Compilare il modulo di domanda d’immatricolazione di un veicolo.","Inviare il modulo con la licenza di circolazione del detentore precedente, l’eventuale rapporto di collaudo e un documento d’identità allo SVSA, Schermenweg 5, 3001 Berna, o consegnarlo allo sportello.","Per posta la nuova licenza di circolazione arriva dopo alcuni giorni lavorativi. Poi pagare la fattura dell’imposta sui veicoli entro 30 giorni."],"who":[1,1,0],"note":"La Confederazione disciplina l’ammissione dei veicoli; l’ufficio cantonale della circolazione (a Berna lo SVSA) rilascia licenza di circolazione e targhe e riscuote l’imposta sui veicoli.","src":["Cantone di Berna (SVSA): immatricolare un veicolo","Cantone di Berna (SVSA): procedura d’immatricolazione","Cantone di Berna (SVSA): documenti per l’immatricolazione","Cantone di Berna (SVSA): calcolare l’imposta sui veicoli","ch.ch: immatricolare un veicolo"]},"nat":{"intro":"I requisiti di residenza li soddisfa: 10 anni in Svizzera, permesso C e almeno 2 anni nel Cantone e nel Comune. Si aggiungono certificato linguistico, test di naturalizzazione e integrazione. La domanda si presenta alla città di Berna; per una persona sola Comune, Cantone e Confederazione costano insieme CHF 1’650.","facts":[["Requisiti","Permesso C, in totale 10 anni in Svizzera, almeno 2 anni senza interruzione nel Cantone di Berna e nel Comune, integrazione riuscita."],["Lingua","Cantone di Berna: orale B1, scritto A2. Nessun certificato se la lingua ufficiale è la sua lingua madre o se ha frequentato almeno 5 anni di scuola dell’obbligo in quella lingua."],["Test","Scritto, 90 minuti: geografia, storia, democrazia, salute e lavoro, diritti e doveri. È esonerato, tra gli altri, chi ha frequentato almeno 5 anni di scuola dell’obbligo in Svizzera."],["Costi","Persona sola nella città di Berna: Comune CHF 400, Cantone CHF 1’150, Confederazione CHF 100. Coppia sposata: 600, 1’725 e 150."]],"steps":["Rivolgersi al Comune di domicilio (città di Berna). Le consegna i moduli e indica i documenti necessari.","Procurarsi il certificato linguistico (B1 orale, A2 scritto), se non ne è esonerato.","Presentare la domanda completa al Comune e sostenere il test di naturalizzazione, se non ne è esonerato.","Il Comune le fattura gli emolumenti di Comune e Cantone; la Confederazione (SEM) decide sull’autorizzazione federale di naturalizzazione."],"who":[1,1,1],"note":"Naturalizzarsi significa acquisire tre cittadinanze: Comune, Cantone e Confederazione esaminano ciascuno la propria parte. La domanda passa dal Comune di domicilio, la Segreteria di Stato della migrazione (SEM) rilascia l’autorizzazione federale.","src":["Cantone di Berna: soggiorno in Svizzera (naturalizzazione)","Cantone di Berna: conoscenze linguistiche e certificato","Cantone di Berna: test di naturalizzazione","Cantone di Berna: emolumenti di naturalizzazione","SEM: naturalizzazione ordinaria"]},"pv":{"intro":"Nel Cantone di Berna il Cantone verifica di regola automaticamente il suo diritto alla riduzione dei premi, sulla base dei dati fiscali definitivi dei due anni precedenti. Nel 2026 il limite è di CHF 35’000 di reddito determinante, per famiglie con figli di CHF 45’000. Una domanda la presenta solo in casi particolari.","facts":[["Limite 2026","Reddito determinante al massimo CHF 35’000; famiglie con figli al massimo CHF 45’000."],["Verifica","Automatica, sulla base dei dati fiscali definitivi dei due anni precedenti (reddito netto e sostanza)."],["Domanda","Solo in casi particolari, ad esempio se la verifica automatica non è possibile o se reddito o famiglia cambiano in modo duraturo e marcato. Possibile anche online."],["Calcolatore","Stima non vincolante con il calcolatore online su be.ch/pvo-onlinerechner."]],"steps":["Verificare con il calcolatore online su be.ch/pvo-onlinerechner se un diritto è possibile.","Presentare la dichiarazione d’imposta: la verifica automatica richiede dati fiscali definitivi.","Se reddito o famiglia sono cambiati in modo duraturo e marcato: presentare una domanda, anche online.","Se il diritto c’è, il Cantone versa la riduzione direttamente alla sua cassa malati e la fattura dei premi diminuisce."],"who":[1,1,0],"note":"La Confederazione prescrive la riduzione dei premi nella legge sull’assicurazione malattie e vi contribuisce; nel Cantone di Berna verifica e decide l’Ufficio delle assicurazioni sociali (ASV).","src":["Cantone di Berna (ASV): diritto alla riduzione dei premi","Cantone di Berna (ASV): quando presentare una domanda","Cantone di Berna (ASV): foglio informativo riduzione dei premi 2026","Cantone di Berna (ASV): calcolare il diritto"]},"wpe":{"intro":"Sì. Chi non presta, o non presta interamente, il servizio militare o civile paga la tassa d’esenzione dall’obbligo militare: il 3 % del reddito imponibile dell’imposta federale diretta, almeno CHF 400 all’anno. Nel Cantone di Berna è competente l’Ufficio della protezione della popolazione, dello sport e degli affari militari (BSM).","facts":[["Importo","3 % del reddito imponibile dell’imposta federale diretta, almeno CHF 400 all’anno."],["Durata","Dai 19 ai 37 anni, al massimo 11 anni di tassa."],["Protezione civile","Chi presta servizio di protezione civile paga comunque, ma il 4 % in meno per ogni giorno di servizio prestato nell’anno."],["Rimborso","Chi recupera il servizio militare o civile e adempie l’obbligo di servizio ottiene il rimborso. Il diritto si prescrive 5 anni dopo la fine dell’obbligo militare."]],"steps":["Presentare la dichiarazione d’imposta come di consueto: la tassa si calcola sul reddito imponibile dell’imposta federale diretta.","La fattura arriva dal servizio cantonale, nel Cantone di Berna dal BSM.","In caso di disabilità importante e reddito basso: far verificare un’esenzione.","Servizio recuperato: una volta adempiuto l’obbligo di servizio, chiedere il rimborso al BSM."],"who":[1,1,0],"note":"La tassa d’esenzione è un tributo federale (AFC); i Cantoni, a Berna l’Ufficio della protezione della popolazione, dello sport e degli affari militari, la tassano e la riscuotono.","src":["AFC: la tassa d’esenzione spiegata","Cantone di Berna (BSM): tassa d’esenzione","Cantone di Berna (BSM): rimborso","ch.ch: tassa d’esenzione dall’obbligo militare"]},"bau":{"intro":"Non per forza. Nel Cantone di Berna una casetta da giardino non richiede licenza edilizia se misura al massimo 10 m² di superficie e 2,5 m di altezza, non è riscaldata, non è abitata né usata a scopi commerciali e dipende da un edificio principale. Se è più grande, presenta una domanda di costruzione tramite eBau.","facts":[["Senza licenza","Piccola costruzione non riscaldata fino a 10 m² di superficie e 2,5 m di altezza, non abitata né commerciale, legata a un edificio principale (art. 6 del decreto sulla procedura della licenza edilizia)."],["Da rispettare comunque","Anche senza licenza valgono regole, ad esempio distanze, protezione antincendio e prescrizioni energetiche."],["Eccezione","Fuori dalla zona edificabile anche una piccola costruzione richiede la licenza se modifica sensibilmente i luoghi, grava sull’urbanizzazione o pregiudica l’ambiente."],["Domanda di costruzione","Da marzo 2022 in tutto il Cantone di Berna solo per via elettronica tramite eBau."]],"steps":["Verificare le misure: al massimo 10 m² di superficie, 2,5 m di altezza, non riscaldata, solo come deposito.","Rispettare le distanze dal confine, la protezione antincendio e le prescrizioni energetiche.","In caso di dubbio chiedere all’ispettorato delle costruzioni della città di Berna, che risponde anche a domande preliminari.","Se la casetta è più grande o una condizione non è soddisfatta: presentare la domanda di costruzione per via elettronica tramite eBau."],"who":[0,1,1],"note":"Quali costruzioni sono esenti da licenza lo stabilisce il Cantone nel decreto sulla procedura della licenza edilizia; nella città di Berna l’ispettorato delle costruzioni informa ed esamina le domande.","src":["Cantone di Berna: decreto sulla procedura della licenza edilizia (CSB 725.1), art. 6","Città di Berna: quando serve una licenza edilizia?","Città di Berna: procedura di licenza edilizia"]},"lost":{"intro":"Annunci la perdita di persona: a un posto di polizia o direttamente all’appuntamento nel centro documenti d’identità, quando ordina il nuovo documento. L’annuncio di perdita costa CHF 40 nel Cantone di Berna. Dopo, il vecchio documento non è più valido, anche se lo ritrova.","facts":[["Annuncio","Di persona a un posto di polizia o nel centro documenti d’identità all’appuntamento per il nuovo documento."],["Costi","Annuncio di perdita nel Cantone di Berna: CHF 40. In più il nuovo documento al prezzo normale, ad esempio carta d’identità per adulti CHF 70."],["Validità","Con l’annuncio il documento diventa non valido. Se lo ritrova non può più usarlo e lo consegna all’ufficio passaporti."],["Nuovo documento","Come ogni documento: richiesta online su schweizerpass.ch, poi appuntamento nel centro documenti d’identità."]],"steps":["Annunciare la perdita di persona: a un posto di polizia (riceve una dichiarazione di smarrimento) o direttamente all’appuntamento nel centro documenti d’identità.","Richiedere il nuovo documento online su schweizerpass.ch e prenotare un appuntamento in un centro bernese.","All’appuntamento portare la dichiarazione di smarrimento della polizia, se ha annunciato la perdita lì.","Se il vecchio documento ricompare: non usarlo più e consegnarlo all’ufficio passaporti."],"who":[1,1,0],"note":"La Confederazione (fedpol) è competente per i documenti d’identità; la perdita si annuncia alla polizia o ai centri cantonali, nel Cantone di Berna anche ai sette centri documenti d’identità.","src":["Cantone di Berna: perdita della carta d’identità o del passaporto","ch.ch: passaporto o carta d’identità smarriti o rubati","fedpol: perdita di documenti d’identità"]},"kita":{"intro":"Nella città di Berna ricevete buoni di custodia per un asilo nido riconosciuto se lavorate insieme almeno al 105 % (genitori soli 5 %) e il reddito familiare determinante è inferiore a CHF 170’000. La domanda si presenta online tramite kiBon; il buono vale dal mese successivo alla domanda completa.","facts":[["Requisiti","Domicilio nella città di Berna, asilo nido o organizzazione di famiglie diurne ammessi al sistema cantonale dei buoni, bambino da 3 mesi fino alla fine della scuola dell’infanzia."],["Grado d’occupazione","Entrambi i genitori insieme almeno 105 %, genitori soli almeno 5 %."],["Reddito","Periodo dal 1° agosto 2026 al 31 luglio 2027: reddito familiare determinante inferiore a CHF 170’000."],["Inizio","Il buono vale solo dal mese successivo alla ricezione della domanda completa, senza effetto retroattivo."]],"steps":["Stimare l’importo del buono con il calcolatore della città di Berna.","Scegliere un asilo nido ammesso al sistema cantonale dei buoni.","Presentare la domanda online tramite kiBon (o su carta), con giustificativi del grado d’occupazione come contratto di lavoro o conteggio delle ore.","Presentare la domanda presto e completa, perché il buono vale solo dal mese successivo."],"who":[0,1,1],"note":"Il Cantone di Berna disciplina il sistema dei buoni e gestisce kiBon; la città di Berna esamina le domande, emette i buoni e versa un proprio supplemento.","src":["Città di Berna: buoni di custodia","Città di Berna: FAQ sui buoni di custodia","Città di Berna: calcolatore dei buoni","Cantone di Berna (DSSI): buoni di custodia"]},"soz":{"intro":"Nella città di Berna si annuncia di persona al servizio sociale, Schwarztorstrasse 71, con un documento d’identità ufficiale. Lì riceve una lista personale dei documenti necessari. Il calcolatore dell’aiuto sociale della città di Berna dà una prima stima del diritto.","facts":[["Annuncio","Di persona al servizio sociale della città di Berna, Schwarztorstrasse 71, con un documento d’identità ufficiale. Chi è appena arrivato e non è ancora annunciato al controllo abitanti porta una copia del contratto d’affitto."],["Documenti","Il modulo di domanda indica i documenti abituali; allo sportello riceve una lista personale e una procura."],["Importo","Secondo le norme COSAS, graduato secondo la grandezza dell’economia domestica. Il calcolatore dell’aiuto sociale della città di Berna dà una prima stima."],["Rimborso","L’aiuto sociale può essere chiesto indietro più tardi se le condizioni per il rimborso sono soddisfatte."]],"steps":["Verificare con il calcolatore dell’aiuto sociale della città di Berna se un diritto è possibile.","Annunciarsi di persona al servizio sociale, Schwarztorstrasse 71, con un documento d’identità (chi è appena arrivato: copia del contratto d’affitto).","Compilare il modulo di domanda e consegnare i documenti secondo la lista.","Firmare la procura e consegnarla con la domanda."],"who":[0,1,1],"note":"Il Cantone di Berna disciplina l’aiuto sociale e si basa sulle norme COSAS; la sua domanda spetta al servizio sociale del Comune di domicilio, a Berna al servizio sociale della città.","src":["Città di Berna: annunciarsi per l’aiuto sociale","Città di Berna: chi può chiedere l’aiuto sociale?","Città di Berna: calcolatore dell’aiuto sociale","Città di Berna: aiuto sociale e servizio sociale"]},"el":{"intro":"Sì, se la rendita e gli altri redditi non coprono il suo fabbisogno vitale e la sua sostanza netta è inferiore a CHF 100’000 (coppie CHF 200’000). Nel Cantone di Berna consegna il modulo di iscrizione all’agenzia AVS del suo Comune di domicilio; decide la cassa di compensazione del Cantone di Berna.","facts":[["Sostanza","Sostanza netta inferiore a CHF 100’000 per persone sole, a CHF 200’000 per coppie sposate."],["Fabbisogno vitale","Dal 2027 (persone che vivono a casa): CHF 21’000 all’anno per persone sole, CHF 31’500 per coppie."],["Iscrizione","Consegnare il modulo ufficiale di iscrizione all’agenzia AVS del Comune di domicilio."],["Competenza","La cassa di compensazione del Cantone di Berna esamina la domanda e decide."]],"steps":["Scaricare e compilare il modulo di iscrizione alle prestazioni complementari della cassa di compensazione del Cantone di Berna.","Allegare i giustificativi richiesti nel modulo.","Consegnare il modulo all’agenzia AVS del suo Comune di domicilio (qui Thun).","La cassa di compensazione esamina reddito e sostanza e le comunica la decisione."],"who":[1,1,1],"note":"La Confederazione disciplina le prestazioni complementari e fissa gli importi; decide la cassa di compensazione del Cantone di Berna, l’agenzia AVS del Comune riceve l’iscrizione.","src":["Cassa di compensazione del Cantone di Berna: prestazioni complementari","ahv-iv.ch: opuscolo 5.01 prestazioni complementari","Cassa di compensazione del Cantone di Berna: modulo di iscrizione PC","Consiglio federale: adeguamenti al 1.1.2027 (2.10.2026)"]},"iv":{"intro":"Si annunci all’ufficio AI del Cantone di Berna, e presto: una rendita AI arriva al più presto 6 mesi dopo l’iscrizione. Prima l’AI verifica se delle misure possono aiutarla a restare nel mondo del lavoro (integrazione prima della rendita).","facts":[["Rilevamento tempestivo","Dopo 30 giorni di incapacità al lavoro o in caso di brevi assenze frequenti è possibile una comunicazione all’ufficio AI, ad esempio dal datore di lavoro. Lì si chiarisce se serve un’iscrizione."],["Rendita","Al più presto 6 mesi dopo l’iscrizione. Condizione: un anno di incapacità al lavoro media di almeno il 40 %, poi un’incapacità al guadagno di almeno il 40 %."],["Priorità","Integrazione prima della rendita: l’AI verifica prima misure che mantengono o migliorano la sua capacità di guadagno."],["Procedura","Dopo l’iscrizione l’ufficio AI la invita a un primo colloquio e raccoglie informazioni sulla sua salute."]],"steps":["Compilare il modulo di iscrizione all’AI.","Consegnare l’iscrizione all’ufficio AI del Cantone di Berna, non troppo tardi, perché la rendita inizia al più presto 6 mesi dopo.","Andare al primo colloquio. L’AI raccoglie le informazioni necessarie sulla sua salute.","Collaborare alle misure d’integrazione. L’AI decide su una rendita solo se queste non bastano."],"who":[1,1,0],"note":"L’assicurazione invalidità è un’assicurazione federale (UFAS); è applicata dagli uffici AI cantonali, a Berna dall’ufficio AI del Cantone di Berna.","src":["Ufficio AI del Cantone di Berna: iscrizione e procedura","Ufficio AI del Cantone di Berna: rilevamento tempestivo e integrazione","ahv-iv.ch: opuscolo 4.04 rendite d’invalidità","ch.ch: assicurazione invalidità"]},"mse":{"intro":"Se prima del parto esercitava un’attività lucrativa, riceve per 14 settimane l’indennità di maternità: l’80 % del suo reddito medio, al massimo CHF 220 al giorno. La richiede alla cassa di compensazione AVS.","facts":[["Diritto","Assicurata all’AVS nei 9 mesi prima del parto e in questo periodo attiva professionalmente per almeno 5 mesi. Alla nascita salariata, indipendente o disoccupata."],["Importo","L’80 % del reddito medio prima del parto, al massimo CHF 220 al giorno. Le salariate raggiungono il massimo con un salario mensile da CHF 8 250."],["Durata","98 giorni (14 settimane) dalla nascita. Se riprende prima l’attività lucrativa, il diritto si estingue. Se il neonato resta in ospedale almeno 2 settimane subito dopo la nascita, la durata si prolunga di al massimo 56 giorni."],["Termine","Il diritto può essere fatto valere fino a 5 anni dopo la fine del congedo di maternità."]],"steps":["Compilare il modulo «Richiesta d’indennità di maternità» (318.750).","Se è salariata: il datore di lavoro conferma la durata dell’impiego e il salario.","Inoltrare la richiesta alla cassa di compensazione AVS competente, quella a cui sono stati versati gli ultimi contributi."],"who":[1,0,0],"note":"L’indennità di maternità fa parte dell’ordinamento federale delle indennità di perdita di guadagno (IPG, UFAS). La versano le casse di compensazione AVS.","src":["UFAS: IPG in caso di maternità","ahv-iv.ch: opuscolo 6.02 indennità di maternità","UFAS: quando ho diritto?","ch.ch: congedo di maternità"]},"pat":{"intro":"Come padre (o moglie della madre) ha diritto a 2 settimane di congedo pagato, da prendere entro 6 mesi dalla nascita. L’indennità è dell’80 % del reddito, al massimo CHF 220 al giorno. Non viene versata automaticamente: va richiesta.","facts":[["Diritto","Padre giuridico del figlio o moglie della madre. Assicurato all’AVS nei 9 mesi prima della nascita e in questo periodo attivo professionalmente per almeno 5 mesi."],["Durata","2 settimane (10 giorni lavorativi), in blocco o a giornate. Da prendere entro 6 mesi dalla nascita; poi i giorni non presi decadono."],["Importo","L’80 % del reddito medio prima della nascita, al massimo CHF 220 al giorno. Per 2 settimane si ricevono 14 indennità giornaliere, quindi al massimo CHF 3 080."],["Richiesta","Modulo «Richiesta dell’indennità per l’altro genitore» (318.747) alla cassa di compensazione AVS competente. Per i salariati di regola la inoltra il datore di lavoro."]],"steps":["Pianificare il congedo con il datore di lavoro e prenderlo entro 6 mesi dalla nascita.","Compilare il modulo 318.747.","Salariato: consegnare il modulo al datore di lavoro, che lo inoltra alla sua cassa di compensazione. Indipendente: direttamente alla sua cassa di compensazione."],"who":[1,0,0],"note":"L’indennità per l’altro genitore fa parte dell’ordinamento federale delle indennità di perdita di guadagno (IPG, UFAS). La versano le casse di compensazione AVS.","src":["UFAS: IPG in caso di paternità","ahv-iv.ch: opuscolo 6.04 indennità per l’altro genitore","UFAS: quando ho diritto?","ch.ch: congedo di paternità"]},"lfa":{"intro":"La licenza per allievo conducente per l’auto (categoria B) si ottiene dai 17 anni. Nel Cantone di Berna presenta la domanda di persona con esame della vista, attestato di primo soccorso e foto. Dopo aver superato l’esame di teoria di base riceve la licenza per allievo.","facts":[["Età","Categoria B dai 17 anni. L’esame di teoria di base è possibile al più presto un mese prima dell’età minima."],["Requisiti","Corso di primo soccorso (attestato valido 6 anni), esame della vista da un ottico o oculista riconosciuto (valido 2 anni), foto formato passaporto."],["Costi","Cantone di Berna: domanda CHF 30, rilascio della licenza per allievo CHF 20, esame di teoria di base CHF 30."],["Fase di apprendimento","La licenza per allievo B vale 24 mesi. Chi la ottiene prima dei 20 anni deve possederla almeno 12 mesi prima dell’esame pratico."]],"steps":["Seguire il corso di primo soccorso e fare l’esame della vista.","Compilare il modulo di domanda e consegnarlo di persona con foto, documento d’identità originale e attestato di primo soccorso: presso una sede dell’ufficio della circolazione (SVSA), un posto di polizia o l’amministrazione comunale.","Prenotare una data per l’esame di teoria di base con il numero di riferimento della lettera di ammissione.","Dopo l’esame superato riceve la licenza per allievo (possibile anche in versione elettronica sul telefono)."],"who":[1,1,0],"note":"Le regole (età minima, fase di apprendimento) le stabilisce la Confederazione (USTRA). Domanda, esame e licenza passano dall’ufficio cantonale della circolazione, a Berna lo SVSA.","src":["SVSA Berna: richiedere la licenza per allievo","SVSA Berna: emolumenti","SVSA Berna: informazioni per allievi conducenti","USTRA: domande e risposte sulla formazione"]},"wsb":{"intro":"Nella città di Berna ordina il certificato di domicilio online o lo ritira allo sportello del controllo abitanti. Costa CHF 20.","facts":[["Costo","CHF 20, uguale per svizzeri, cittadini UE/AELS e di Stati terzi. Online paga alla fine dell’ordinazione (Mastercard, Visa, PostFinance)."],["A cosa serve","Ad esempio per borse di studio, assicurazioni o la naturalizzazione."],["Sportello","Einwohnerdienste, Migration und Fremdenpolizei, Predigergasse 5, 3011 Berna. Da lunedì a venerdì dalle 10 alle 16, il giovedì fino alle 18."]],"steps":["Compilare il modulo online «Bestellung Wohnsitzbescheinigung» della città di Berna.","Pagare online alla fine.","Oppure senza ordinazione online: ritirarlo allo sportello del controllo abitanti, Predigergasse 5."],"who":[0,0,1],"note":"I certificati di domicilio li rilascia il comune di domicilio, nella città di Berna gli Einwohnerdienste, Migration und Fremdenpolizei.","src":["Città di Berna: certificato di domicilio","Città di Berna: ordinazione online","Città di Berna: contatto controllo abitanti"]},"tod":{"intro":"Un decesso va notificato all’ufficio dello stato civile entro 2 giorni. Se la persona muore a casa, chiami prima un medico per il certificato di morte. Nella città di Berna notifica il decesso anche all’ufficio delle sepolture, di persona o tramite un’impresa di pompe funebri.","facts":[["Termine","Entro 2 giorni, all’ufficio dello stato civile del luogo del decesso."],["Ospedale o casa di cura","Se la persona muore in ospedale o in una casa di cura, è l’istituto a notificare il decesso all’ufficio dello stato civile."],["Documenti","Passaporto o carta d’identità di chi notifica, certificato medico di morte, se disponibile libretto di famiglia o certificato di famiglia."],["Sepoltura gratuita","Città di Berna: per gli abitanti senza un’eredità sufficiente (di regola meno di CHF 8 000) la città assume una sepoltura semplice. I familiari presentano la domanda insieme alla notifica del decesso."]],"steps":["Decesso a casa: chiamare un medico e chiedere il certificato medico di morte.","Notificare il decesso entro 2 giorni all’ufficio dello stato civile del luogo del decesso (in ospedale o casa di cura lo fa l’istituto).","Notificare il decesso all’ufficio delle sepolture della città di Berna, di persona o tramite un’impresa di pompe funebri. L’ufficio organizza cremazione o inumazione.","Sbrigare le altre pratiche (datore di lavoro, assicurazioni, banche, successione) con la lista di controllo di ch.ch."],"who":[0,1,1],"note":"La registrazione del decesso spetta all’ufficio cantonale dello stato civile. Sepoltura e cimitero spettano al comune, nella città di Berna all’ufficio delle sepolture (Predigergasse 5).","src":["Cantone di Berna: decesso (stato civile)","Città di Berna: notifica di un decesso","Città di Berna: sepoltura gratuita","ch.ch: lista di controllo in caso di decesso"]},"pk":{"intro":"Nella città di Berna la carta di parcheggio per residenti si richiede online. Vale nella sua zona e secondo la città costa CHF 264 all’anno (CHF 22 al mese).","facts":[["Requisiti","È annunciato nella zona come abitante o dimorante settimanale e figura al primo posto, con nome e indirizzo, nella licenza di circolazione. Le carte sono rilasciate per autoveicoli leggeri, di regola automobili."],["Costi","CHF 264 all’anno, CHF 22 al mese."],["Validità","Un anno dal mese di emissione, almeno 3 mesi. Se restituisce la carta prima, le viene rimborsata la tassa per i mesi interi non utilizzati (non per la durata minima di 3 mesi)."],["Zona","La carta vale solo nella zona autorizzata."]],"steps":["Verificare se il suo indirizzo si trova in una zona con carte di parcheggio.","Compilare il modulo online «Anwohnerparkkarte» della città di Berna.","Pagare la tassa elettronicamente. La carta arriva per posta."],"who":[0,0,1],"note":"Le carte di parcheggio spettano al comune, nella città di Berna alla polizia locale e del commercio (ispettorato di polizia).","src":["Città di Berna: carte di parcheggio nei quartieri","Città di Berna: modulo online","Città di Berna: carte di parcheggio online"]},"spg":{"intro":"Nella città di Berna ci sono tre vie: esporre i piccoli ingombranti con un contrassegno il giorno di raccolta dei rifiuti, portare quelli più grandi in un centro di raccolta o farli ritirare dal servizio di ritiro (CHF 70.27 forfettari).","facts":[["Piccoli ingombranti","Oggetti combustibili fino a 100 × 50 × 50 cm e 25 kg (ad es. scope, piccoli mobili, tappeti): con un contrassegno, accanto ai sacchi tassati il giorno di raccolta. 10 contrassegni costano CHF 44.10."],["Centri di raccolta","Fellerstrasse 13a e Schermen (Wölflistrasse 17). Da lunedì a venerdì 8–12 e 13–18.30, sabato 8–15."],["Servizio di ritiro","CHF 70.27 forfettari, inclusi 5 minuti di carico; ogni 5 minuti in più CHF 54.05. Non deve essere presente."],["Iscrizione","Entro le 11.30 del giorno feriale precedente il ritiro; per il lunedì entro venerdì alle 11.30. Ritiro lunedì, martedì, giovedì e venerdì."]],"steps":["Verificare le dimensioni: fino a 100 × 50 × 50 cm e 25 kg è un piccolo ingombrante.","Piccolo ingombrante: comprare un contrassegno ed esporlo accanto ai sacchi tassati il giorno di raccolta.","Ingombrante più grande: portarlo al centro di raccolta Fellerstrasse o Schermen, oppure ordinare il servizio di ritiro entro le 11.30 del giorno feriale precedente."],"who":[0,0,1],"note":"Lo smaltimento dei rifiuti spetta al comune, nella città di Berna a Entsorgung + Recycling Stadt Bern (ERB).","src":["Città di Berna: rifiuti ingombranti","Città di Berna: servizio di ritiro","Città di Berna: piccoli ingombranti","Città di Berna: centri di raccolta"]},"fund":{"intro":"Se ha perso qualcosa nella città di Berna, notifichi la perdita online all’ufficio oggetti smarriti; la contatta appena l’oggetto arriva. Ha trovato qualcosa? Lo porti all’ufficio, Theatergässchen 2.","facts":[["Notificare una perdita","Online per le perdite sul territorio cittadino. Ombrelli, vestiti (tranne giacche) e libri non si possono notificare online; contatti direttamente l’ufficio (031 321 50 50)."],["Ritiro","L’ufficio consegna l’oggetto se descrizione e circostanze della perdita corrispondono alle indicazioni di chi l’ha trovato. Gli oggetti sono conservati un anno."],["Ricompensa","Di regola il 10 % del valore, ridotta in modo adeguato per oggetti di grande valore. Nessuna ricompensa per oggetti trovati in casa, refurtiva e oggetti trovati nei negozi."],["Ufficio","Theatergässchen 2, 3011 Berna. Da lunedì a venerdì dalle 10 alle 16, il giovedì fino alle 18."]],"steps":["Perdita: compilare la notifica di perdita online presso l’ufficio oggetti smarriti della città di Berna.","Quando l’ufficio la contatta, ritirare l’oggetto al Theatergässchen 2.","Oggetto trovato: portarlo all’ufficio. Se entro un anno nessuno si fa avanti, può riceverlo contro una tassa di custodia di circa il 5 % del valore stimato."],"who":[0,0,1],"note":"Gli oggetti smarriti spettano al comune, nella città di Berna all’ufficio oggetti smarriti (ispettorato di polizia). Le regole su ritrovamento e ricompensa sono nel Codice civile.","src":["Città di Berna: ufficio oggetti smarriti","Città di Berna: contatto","Città di Berna: ordinanza sugli oggetti smarriti","ch.ch: oggetti smarriti"]},"bet":{"intro":"Se qualcuno non paga una fattura, presenta una domanda d’esecuzione all’ufficio d’esecuzione del domicilio del debitore. Anticipa lei le spese; se l’esecuzione è giustificata, sono poi a carico dell’altra parte. Nel Cantone di Berna sono gli uffici d’esecuzione e dei fallimenti.","facts":[["Dove","Ufficio d’esecuzione del domicilio del debitore. La domanda si può compilare online tramite lo sportello delle esecuzioni."],["Costi","Come creditore anticipa le spese di ogni fase. Le tasse sono uguali in tutta la Svizzera e dipendono dall’importo del credito."],["Precetto esecutivo","L’ufficio notifica un precetto esecutivo all’altra parte. Ha 20 giorni per pagare e 10 giorni per fare opposizione."],["Opposizione","Se l’altra parte fa opposizione, su sua istanza un tribunale decide se l’esecuzione può proseguire."]],"steps":["Compilare la domanda d’esecuzione (online allo sportello delle esecuzioni o con il modulo ufficiale della Confederazione).","Presentarla all’ufficio d’esecuzione del domicilio dell’altra parte e pagare l’anticipo delle spese.","Senza pagamento né opposizione: presentare la domanda di proseguimento. In caso di opposizione: chiedere al tribunale il rigetto."],"who":[1,1,0],"note":"Il diritto esecutivo (LEF) e le tasse li stabilisce la Confederazione. Le esecuzioni le svolgono gli uffici d’esecuzione, nel Cantone di Berna gli uffici d’esecuzione e dei fallimenti.","src":["ch.ch: esecuzione","Cantone di Berna: uffici d’esecuzione e dei fallimenti","Ufficio federale di giustizia: moduli LEF"]},"abm":{"intro":"Nel Cantone di Berna la disdetta è gratuita: invia la licenza di circolazione originale con la nota «annullare» all’ufficio della circolazione (SVSA). Se entro 14 giorni non immatricola un altro veicolo, restituisca anche le targhe.","facts":[["Costi","La disdetta è gratuita. Far depositare le targhe per un anno costa CHF 30; in compenso decade la tassa per la rimessa in circolazione."],["Targhe","Dal 1° marzo 2025 alla restituzione deve indicare se lo SVSA deve depositare o smaltire le targhe. Senza indicazione vengono smaltite."],["Imposta e assicurazione","Mentre le targhe sono depositate non paga né l’assicurazione di responsabilità civile né l’imposta sui veicoli. L’imposta pagata in eccesso viene compensata e un saldo rimborsato; conta il giorno in cui le targhe arrivano allo SVSA."],["Indirizzo","SVSA Verkehrszulassung, Schermenweg 5, casella postale, 3001 Berna."]],"steps":["Scrivere «annullare» sulla licenza di circolazione originale.","Inviare la licenza per posta allo SVSA. Se entro 14 giorni non immatricola un nuovo veicolo: allegare le targhe o metterle in una cassetta di restituzione in una sede dello SVSA.","Indicare se le targhe vanno depositate (CHF 30, un anno) o smaltite."],"who":[1,1,0],"note":"Le regole sull’ammissione le stabilisce la Confederazione. Disdetta, targhe e imposta passano dall’ufficio cantonale della circolazione, a Berna lo SVSA.","src":["SVSA Berna: disdire un veicolo","SVSA Berna: depositare le targhe","SVSA Berna: deposito delle targhe","ch.ch: immatricolare e disdire un veicolo"]},"wa":{"intro":"Se durante la settimana abita nella città di Berna e trascorre regolarmente i giorni liberi in un altro comune, si annunci entro 14 giorni come dimorante settimanale, nel modo più semplice online.","facts":[["Chi","Chi pernotta nel luogo di lavoro, formazione o studio e trascorre regolarmente i giorni liberi (di solito il fine settimana) in un altro comune."],["Termine","Entro 14 giorni dall’arrivo, presso il controllo abitanti della città di Berna."],["Certificato","All’annuncio va allegato un certificato di soggiorno esterno del suo comune di domicilio. A causa di una modifica di legge in futuro non verranno più rilasciati; se il suo comune non lo rilascia più, può tralasciarlo."],["Imposte","Per le persone nubili o celibi si presume che il centro della vita sia nel luogo di soggiorno settimanale. Può confutarlo se rientra regolarmente nei giorni liberi e vi intrattiene relazioni familiari e sociali particolarmente strette."]],"steps":["Chiedere un certificato al comune di domicilio (se lo rilascia ancora).","Compilare il modulo online «Zuzug Wochenaufenthalt» della città di Berna e pagare online eventuali tasse.","Se il soggiorno si prolunga, prolungarlo con il modulo «Verlängerung Wochenaufenthalt»."],"who":[0,0,1],"note":"Annuncio e registro spettano al comune, nella città di Berna agli Einwohnerdienste, Migration und Fremdenpolizei. Le questioni fiscali le valuta l’amministrazione delle imposte.","src":["Città di Berna: soggiorno settimanale","Città di Berna: modulo online d’arrivo","Città di Berna: proroga","Città di Berna: arrivo, trasloco e partenza"]},"kir":{"intro":"Nel Cantone di Berna si esce da una Chiesa nazionale con una lettera firmata personalmente alla propria parrocchia. Con l’uscita termina l’obbligo dell’imposta ecclesiastica; per l’anno in corso paga pro rata.","facts":[["Forma","Per iscritto, con lettera firmata a mano. Un’e-mail non basta. Contenuto: chiara dichiarazione d’uscita, nome, indirizzo e data di nascita."],["Indirizzo","Al consiglio parrocchiale della sua parrocchia o al servizio da esso designato (ad es. per i cattolici della città di Berna: Röm.-kath. Gesamtkirchgemeinde Bern, Frohbergweg 4, 3012 Berna)."],["Effetto","Dal giorno in cui consegna la dichiarazione al servizio competente, alla Posta svizzera o a una rappresentanza svizzera all’estero."],["Imposta ecclesiastica","L’obbligo termina con la dichiarazione d’uscita valida. Se esce durante l’anno, l’imposta ecclesiastica è riscossa pro rata."]],"steps":["Scrivere la lettera d’uscita: intenzione di uscire, nome, indirizzo, data di nascita, firma a mano.","Inviarla per posta al consiglio parrocchiale.","Nella prossima dichiarazione d’imposta l’imposta ecclesiastica non è più riscossa dall’uscita."],"who":[0,1,0],"note":"Le regole sull’uscita e sull’imposta ecclesiastica le stabilisce il Cantone di Berna. L’uscita la riceve la parrocchia.","src":["Cantone di Berna: ordinanza sull’appartenenza a una Chiesa nazionale","Cantone di Berna TaxInfo: imposta ecclesiastica","Chiesa cattolica regione di Berna: entrata e uscita"]},"dieb":{"intro":"Nel Cantone di Berna una bici rubata si notifica online 24 ore su 24 tramite Suisse ePolice. Tenga pronti marca, modello, colore e numero di telaio. Può anche sporgere denuncia in un posto di polizia.","facts":[["Online","Tramite Suisse ePolice, 24 ore su 24. Possibile per biciclette, ciclomotori, sci, snowboard, apparecchi elettronici e targhe rubati."],["Indicazioni","Marca, modello, colore e numero di telaio. La polizia cantonale consiglia di annotare queste caratteristiche in anticipo e conservarle."],["Ricerche","Le bici rubate notificate vengono trasmesse ai sistemi di ricerca nazionali e internazionali."],["Posto di polizia","In alternativa denuncia in un posto di polizia. Portare: documento d’identità ufficiale con foto e i documenti pertinenti."]],"steps":["Cercare numero di telaio, marca, modello e colore (ad es. sulla ricevuta d’acquisto).","Notificare il furto online tramite Suisse ePolice.","Oppure sporgere denuncia in un posto della polizia cantonale bernese, con un documento d’identità ufficiale."],"who":[0,1,0],"note":"Le denunce le riceve la polizia cantonale. Suisse ePolice è il posto di polizia online comune di diversi cantoni.","src":["Polizia cantonale bernese: denunce online","Polizia cantonale bernese: furto e rapina","Suisse ePolice","ch.ch: sporgere denuncia"]},"vor":{"intro":"Un mandato precauzionale si scrive a mano o si fa autenticare da un notaio. Nel Cantone di Berna può far iscrivere all’ufficio dello stato civile dove è depositato; costa CHF 75. Così l’APMA lo trova in caso di bisogno.","facts":[["Forma","Interamente scritto a mano, datato e firmato (come un testamento) oppure costituito per atto pubblico da un notaio."],["Luogo di deposito","L’ufficio dello stato civile iscrive dove è conservato il mandato. L’autorità di protezione dei minori e degli adulti (APMA) può consultare questa informazione in caso di bisogno."],["Costi","Iscrizione CHF 75. Conferma dell’iscrizione su richiesta CHF 30."],["Dove","In un ufficio dello stato civile a scelta nel Cantone di Berna."]],"steps":["Scrivere il mandato a mano, datarlo e firmarlo, oppure farlo autenticare da un notaio.","Scegliere il luogo di conservazione.","Fissare un appuntamento in un ufficio dello stato civile o compilare la domanda scritta e inviarla a un ufficio. Il luogo di deposito viene iscritto."],"who":[1,1,0],"note":"Il mandato precauzionale è disciplinato dal Codice civile. L’ufficio cantonale dello stato civile iscrive il luogo di deposito; l’APMA lo esamina e lo attua in caso di bisogno.","src":["Cantone di Berna: mandato precauzionale (stato civile)","Cantone di Berna: iscrivere il luogo di deposito","APMA Cantone di Berna: mandato e direttive anticipate"]},"aus":{"intro":"Da uno a due mesi prima della scadenza riceve un avviso di scadenza. Lo rispedisca compilato, con i documenti richiesti, per e-mail o per posta agli Einwohnerdienste, Migration und Fremdenpolizei della città di Berna.","facts":[["Avviso di scadenza","Arriva da uno a due mesi prima della scadenza del permesso. Se non l’ha ricevuto, contatti lei il servizio (031 321 53 00)."],["Invio","Compilato, con i documenti indicati nell’avviso, per e-mail o per posta. L’elaborazione può richiedere tempo; la città la contatta appena il permesso è prorogato."],["Biometria","Se necessario, riceve un invito scritto per rilasciare i dati biometrici in un centro documenti d’identità."],["Validità B","Cantone di Berna: di regola 5 anni per i cittadini UE/AELS, 1 anno per i cittadini di Stati terzi."]],"steps":["Attendere l’avviso di scadenza (da uno a due mesi prima) e compilarlo.","Inviarlo con i documenti richiesti per e-mail o per posta al servizio della città di Berna.","Se invitato: rilasciare i dati biometrici al centro. Poi arriva il nuovo permesso."],"who":[1,1,1],"note":"Le regole le stabilisce la Confederazione (SEM). Nella città di Berna gli Einwohnerdienste, Migration und Fremdenpolizei ricevono la proroga; il cantone disciplina il permesso.","src":["Città di Berna: proroga dei permessi","Cantone di Berna: permesso di dimora (permesso B)","Città di Berna: Einwohnerdienste, Migration und Fremdenpolizei"]},"nam":{"intro":"Dopo il divorzio mantiene il cognome del matrimonio. Può però dichiarare in ogni momento all’ufficio dello stato civile di voler riprendere il cognome da nubile o celibe. Nel Cantone di Berna costa CHF 75.","facts":[["Termine","Nessuno. La dichiarazione è possibile in ogni momento, non appena il matrimonio non esiste più."],["Dove","Su appuntamento in uno dei sette uffici dello stato civile del Cantone di Berna o in qualsiasi altro ufficio dello stato civile in Svizzera."],["Costi","Dichiarazione concernente il cognome CHF 75. Conferma su richiesta CHF 30. Pagamento sul posto."],["Da distinguere","Se vuole un cognome diverso da quello da nubile o celibe, serve una domanda di cambiamento del nome al Cantone."]],"steps":["Fissare un appuntamento in un ufficio dello stato civile.","Rendere sul posto la dichiarazione e pagare la tassa."],"who":[1,1,0],"note":"Il diritto al nome è nel Codice civile. La dichiarazione la riceve l’ufficio cantonale dello stato civile.","src":["Cantone di Berna: dichiarazione concernente il cognome","ch.ch: cognome dopo il divorzio","Cantone di Berna: cambiamento del nome"]}}},"en":{"ask_label":"What would you like to know?","send":"Send question","nav":["Citizen view","Authority view","Project","Home","Menu","Pages"],"f_links":["Contact","Authority view","Citizen view","Project"],"f_sender":"Private concept by Bilal Simsek, Bern. Not an offer by any authority. Feedback welcome: {c}","f_legal":"Privacy, terms of use and accessibility are not worked out in the concept. The prototype collects no personal data, sets no cookies and uses no analytics tools; the browser only remembers locally that you have read the notice.","f_note":"Concept prototype. All answers are examples and do not replace information from an authority.","banner_s":"Concept prototype, not an official site","skip":"Skip to content","chips":[{"l":"Report a move","q":"I'm moving from Bern to Winterthur: how and by when do I deregister and register?"},{"l":"Passport & ID","q":"I live in Bern and need a new passport and an ID card. How and where do I order them?"},{"l":"Tax return deadline","q":"I live in Bern and can't finish my tax return by mid-March. How do I extend the deadline and what does it cost?"},{"l":"AHV/AVS pension","q":"I was born in 1962 and live in Thun: when and where do I claim my AHV/AVS pension?"},{"l":"Register as unemployed","q":"I live in Thun and lose my job at the end of the month. Where and when do I have to register, and how do I get unemployment benefit?"},{"l":"Switch health insurer","q":"By when can I switch my health insurer and how does it work?"},{"l":"Sole proprietorship","q":"I live in Bern and am going self-employed with a sole proprietorship. What do I need to register, and where?"},{"l":"Exchange driving licence","q":"I have lived in Bern for a few months and have a German driving licence. Do I need to exchange it, and how?"},{"l":"Getting married","q":"We are both Swiss, live in Zurich and want to get married. How does it work and what does it cost?"},{"l":"Register a dog","q":"I live in the City of Bern and have taken over a dog. Where do I register it and what does it cost?"},{"l":"Child allowance","q":"I am employed in Bern and just had a baby. How do I get child allowance and how much is it?"},{"l":"Debt record extract","q":"I live in Bern and need a debt enforcement register extract for a new flat. Where do I order it and what does it cost?"},{"l":"Criminal record extract","q":"I need a criminal record extract for a new job. How do I order it and how long does it take?"},{"l":"Register a car","q":"I live in Bern and bought a used car. How do I register it and what does it cost?"},{"l":"Naturalisation","q":"I have lived in Switzerland for 12 years, 3 of them in the City of Bern, and have a C permit. Can I become Swiss and what does it cost?"},{"l":"Premium reduction","q":"I live in the canton of Bern and earn little. Am I entitled to a health insurance premium reduction and do I need to apply?"},{"l":"Military exemption tax","q":"I am 22, live in Bern and was declared unfit for military service. Do I have to pay the exemption tax, and how much?"},{"l":"Garden shed permit","q":"I live in the City of Bern and want to put up a small garden shed. Do I need a building permit?"},{"l":"Lost ID","q":"I live in Bern and have lost my ID card. What do I need to do and what does it cost?"},{"l":"Daycare vouchers","q":"We live in the City of Bern and want to send our child to daycare. Can we get childcare vouchers and how do we apply?"},{"l":"Social assistance","q":"I live in the City of Bern and can no longer make ends meet. How do I apply for social assistance?"},{"l":"Supplementary benefits","q":"I am retired, live in Thun and my AHV pension is not enough. Can I apply for supplementary benefits?"},{"l":"Disability insurance","q":"I live in Bern and have been ill and unable to work for months. How do I register with disability insurance (IV)?"},{"l":"Maternity benefit","q":"I am employed and expecting a baby in spring. How much maternity benefit will I get and how do I apply?"},{"l":"Paternity leave","q":"I am employed and becoming a father in spring. How long is paternity leave and how do I get the allowance?"},{"l":"Learner’s permit","q":"I am 17, live in Bern and want to learn to drive. How do I get a learner’s permit?"},{"l":"Certificate of residence","q":"I live in the city of Bern and need a certificate of residence. Where do I get it and how much does it cost?"},{"l":"Report a death","q":"My mother died at home in the city of Bern. What do I need to do now and where do I report the death?"},{"l":"Parking permit","q":"I live in the city of Bern and have a car. How do I get a resident parking permit and how much does it cost?"},{"l":"Bulky waste","q":"I live in the city of Bern and want to get rid of an old sofa. How do I dispose of bulky waste and what does it cost?"},{"l":"Lost property","q":"I lost my wallet in the city of Bern. How do I report it to the lost property office?"},{"l":"Start debt collection","q":"A client in Bern is not paying my CHF 2,000 invoice. How do I start debt collection proceedings?"},{"l":"Deregister a car","q":"I live in the canton of Bern and am selling my car. How do I deregister it and what happens to the number plates?"},{"l":"Weekly residence","q":"I now work in the city of Bern and go home to Valais at weekends. How do I register as a weekly resident?"},{"l":"Leave the church","q":"I live in Bern and want to leave the church. How do I do it and from when do I stop paying church tax?"},{"l":"Stolen bike","q":"My bike was stolen in Bern. How do I report the theft to the police?"},{"l":"Advance care mandate","q":"I live in Bern and want to make an advance care mandate (Vorsorgeauftrag). What form must it take and where do I deposit it?"},{"l":"Renew residence permit","q":"I live in the city of Bern and my B permit expires soon. How do I renew it?"},{"l":"Name after divorce","q":"I am divorced, live in Bern and want to go back to my maiden name. How do I do that?"}],"think":"Tell is checking official sources","who":"Responsible","bund":"Federal","kanton":"Canton","gemeinde":"Municipality","src":"Sources","glance":"At a glance","stand":"As of October 2026 · Sample answer from public sources, without guarantee. The responsible offices are authoritative.","newtab":"opens in a new tab","newq":"New question","fb":{"intro":"The prototype has no answer to this yet. The real version would search official sources from federal, cantonal and municipal governments here. It already answers 23 examples: moving, passport and ID, tax return, AHV/AVS pension, unemployment, switching health insurer, starting a sole proprietorship exchanging a foreign driving licence, getting married, registering a dog, family allowances, the debt enforcement extract, the criminal record extract, registering a car, naturalisation, premium reduction, the military service exemption tax, garden sheds, lost ID documents, childcare vouchers, social assistance, supplementary benefits and disability insurance. Try one of them."},"ans":{"move":{"intro":"You register at your new place of residence within 14 days. From Bern to Winterthur this works online via eUmzugCH: both municipalities are connected, so you do not need to go to a counter.","facts":[["Deadline","14 days from the change of address (Art. 11 Register Harmonisation Act)"],["Cost","Winterthur: CHF 40 per adult; eUmzugCH costs no more than the counter"],["Counter","Not needed, everything is done online"],["Responsible","Bern residents' services (deregistration), Winterthur residents' registry (registration)"]],"steps":["On eumzug.swiss, enter your old address (Bern) and your new address (Winterthur) and start the check.","Have ready: passport or ID card, AHV/AVS number (13 digits), rental contract or move-in confirmation, card or Twint for CHF 40.","Have your health insurance card or policy ready: Winterthur requires this proof at registration.","Complete deregistration
