<style>
:root{
  --paper:#EEE9E0;
  --snow:#FBF9F5;
  --ink:#1A2531;
  --granit:#59636D;
  --red:#D8001A;
  --red-d:#B00015;
  --rule:rgba(26,37,49,.13);
  --inset:clamp(8px,1.1vw,16px);
  --pad:clamp(20px,4vw,64px);
  --r-xl:clamp(26px,3vw,44px);
  --r-lg:24px;
  --sh:0 1px 2px rgba(26,37,49,.05),0 28px 64px -28px rgba(26,37,49,.34);
  --sec:clamp(88px,12vw,200px);
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-io:cubic-bezier(.76,0,.24,1);
  --serif:"Gambetta","Iowan Old Style","Palatino Linotype",Georgia,serif;
  font-family:"Switzer","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
[hidden]{display:none!important}
html{background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%}
body{font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:clip;background:var(--paper)}
button,input{font:inherit;color:inherit}
a{color:inherit}
svg{display:block}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.skip{position:absolute;left:var(--pad);top:-80px;z-index:100;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;transition:top .2s}
.skip:focus{top:12px}

/* glass */
.glass{background:rgba(251,249,245,.66);-webkit-backdrop-filter:blur(20px) saturate(1.25);backdrop-filter:blur(20px) saturate(1.25);border:1px solid rgba(255,255,255,.6);box-shadow:0 10px 32px -14px rgba(26,37,49,.3)}

/* header */
.site-header{position:fixed;z-index:60;top:calc(var(--inset) + 10px);left:calc(var(--inset) + 12px);right:calc(var(--inset) + 12px);display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.site-header>*{pointer-events:auto}
.brand{display:inline-flex;align-items:center;gap:10px;padding:7px 18px 7px 8px;border-radius:999px;text-decoration:none;font-family:var(--serif);font-weight:500;font-size:1.5rem;line-height:1;letter-spacing:-.02em}
.brand svg{width:30px;height:30px}
.notice{padding:9px 16px;border-radius:999px;font-size:.8125rem;line-height:1.2;color:var(--granit);text-align:center;transition:opacity .4s var(--ease),transform .4s var(--ease)}
.site-header.past .notice{opacity:0;pointer-events:none}
.head-r{display:flex;align-items:center;gap:8px;padding:5px;border-radius:999px}
.lang{display:flex;gap:2px}
.lang button{border:0;background:transparent;border-radius:999px;padding:8px 12px;font-size:.8125rem;font-weight:500;color:var(--granit);cursor:pointer;transition:background .3s,color .3s}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn.head-ask{visibility:hidden;padding:.65em 0;font-size:.875rem;opacity:0;transform:scale(.9);pointer-events:none;width:0;padding-inline:0;margin:0 -4px 0 0;overflow:hidden;transition:opacity .4s var(--ease),transform .4s var(--ease),width .45s var(--ease),padding .45s var(--ease)}
.btn.head-ask.show{visibility:visible;opacity:1;transform:none;pointer-events:auto;width:auto;padding-inline:1.1em}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.6em;padding:.95em 1.5em;background:var(--ink);color:var(--paper);border:0;border-radius:999px;font-weight:500;font-size:.9375rem;line-height:1.1;cursor:pointer;overflow:hidden;isolation:isolate;text-decoration:none;white-space:nowrap;transition:transform .3s var(--ease),color .3s}
.btn::before{content:"";position:absolute;inset:0;background:var(--red);border-radius:inherit;transform:scale(0);transform-origin:var(--ox,50%) var(--oy,50%);transition:transform .6s var(--ease);z-index:-1}
.btn:hover::before,.btn:focus-visible::before{transform:scale(1.6)}
.btn:active{transform:scale(.96)}
.btn[disabled]{cursor:default;opacity:.7}
.btn[disabled]::before{transform:scale(0)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(26,37,49,.2)}
.btn.ghost:hover,.btn.ghost:focus-visible{color:#fff;box-shadow:none}


.ask{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;background:#fff;border:1px solid rgba(26,37,49,.1);border-radius:999px;padding:6px;box-shadow:0 2px 0 rgba(26,37,49,.02),0 14px 30px -18px rgba(26,37,49,.3);transition:box-shadow .4s,border-color .3s}
.ask:focus-within{border-color:rgba(26,37,49,.45);box-shadow:0 0 0 5px rgba(216,0,26,.14),0 14px 30px -18px rgba(26,37,49,.3)}
.ask.nudge{animation:nudge .45s var(--ease)}
@keyframes nudge{20%{transform:translateX(-6px)}50%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
.ask-field{position:relative;min-width:0}
.ask input{width:100%;height:58px;border:0;background:transparent;padding:0 clamp(16px,1.8vw,26px);font-size:clamp(1rem,1.35vw,1.2rem);letter-spacing:-.01em;outline:none}
.ph{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ph span{position:absolute;left:clamp(16px,1.8vw,26px);right:8px;top:50%;margin-top:-.7em;font-size:clamp(1rem,1.35vw,1.2rem);letter-spacing:-.01em;color:var(--granit);white-space:nowrap;text-overflow:ellipsis;overflow:hidden;transform:translateY(60%);opacity:0;transition:transform .7s var(--ease),opacity .5s}
.ph span.on{transform:none;opacity:1}
.ph span.off{transform:translateY(-160%);opacity:0}
.ask.has-value .ph{opacity:0}
.send{width:58px;height:58px;border-radius:50%;background:var(--red);color:#fff;border:0;cursor:pointer;display:grid;place-items:center;overflow:hidden;transition:background .3s,transform .3s var(--ease)}
.send svg{width:24px;height:24px;transition:transform .45s var(--ease)}
.send:hover,.send:focus-visible{background:var(--red-d)}
.send:hover svg{transform:translateX(4px)}
.send:active{transform:scale(.92)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:rgba(255,255,255,.7);border:1px solid rgba(26,37,49,.1);border-radius:999px;padding:.62em 1.05em;font-size:.9rem;cursor:pointer;transition:background .3s,color .3s,border-color .3s,transform .3s var(--ease)}
.chip:hover,.chip:focus-visible{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:active{transform:scale(.96)}

/* answer */
.answer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .9s var(--ease)}
.answer.open{grid-template-rows:1fr}
.answer-in{overflow:hidden;min-height:0}
.a-body{padding:34px clamp(6px,.8vw,12px) 6px}
.a-q{font-size:.9375rem;color:var(--granit);margin-bottom:16px}
.think{display:flex;align-items:center;gap:14px;color:var(--granit);font-size:.9375rem}
.think svg{width:28px;height:28px}
.think rect{fill:var(--red);transform-box:fill-box;transform-origin:center}
.think .v{animation:growv 1.1s var(--ease-io) infinite alternate}
.think .h{animation:growh 1.1s var(--ease-io) .25s infinite alternate}
@keyframes growv{from{transform:scaleY(.1)}to{transform:scaleY(1)}}
@keyframes growh{from{transform:scaleX(.1)}to{transform:scaleX(1)}}
.a-text{font-family:var(--serif);font-size:clamp(1.15rem,1.6vw,1.45rem);line-height:1.32;letter-spacing:-.012em;max-width:34em}
.sw{opacity:0;transition:opacity .35s}
.sw.in{opacity:1}
.a-glance{margin-top:24px}
.a-glance .who-lbl{margin-bottom:6px}
.a-facts{margin:0;padding:0}
.a-facts>div{display:grid;grid-template-columns:minmax(5.6rem,7.6rem) 1fr;column-gap:clamp(12px,2vw,20px);padding:11px 0;border-top:1px solid var(--rule);opacity:0;transform:translateY(8px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.a-facts>div:last-child{border-bottom:1px solid var(--rule)}
.a-facts>div.in{opacity:1;transform:none}
.a-facts dt{font-size:.8125rem;font-weight:500;letter-spacing:.01em;color:var(--granit);padding-top:.16em}
.a-facts dd{margin:0;font-size:.9375rem;line-height:1.4;min-width:0;overflow-wrap:anywhere}
@media (max-width:560px){.a-facts>div{grid-template-columns:1fr;row-gap:2px;padding:10px 0}.a-facts dt{padding-top:0}}
.a-steps{list-style:none;padding:0;margin-top:26px;counter-reset:s}
.a-glance+.a-steps{margin-top:22px}
.a-steps li{display:grid;grid-template-columns:44px 1fr;padding:15px 0;border-top:1px solid var(--rule);opacity:0;transform:translateY(8px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.a-steps li:last-child{border-bottom:1px solid var(--rule)}
.a-steps li::before{counter-increment:s;content:counter(s);color:var(--red);font-weight:500;font-feature-settings:"tnum"}
.a-steps li.in{opacity:1;transform:none}
.a-who{margin-top:28px}
.who-lbl{font-size:.9375rem;color:var(--granit);margin-bottom:10px}
.who-row{list-style:none;display:flex;flex-wrap:wrap;gap:8px;padding:0}
.who-row li{display:inline-flex;align-items:center;gap:10px;padding:.65em 1.1em;border-radius:999px;font-weight:500;font-size:.9375rem;box-shadow:inset 0 0 0 1px rgba(26,37,49,.14);color:var(--granit);transition:background .6s var(--ease),color .6s var(--ease),box-shadow .6s}
.who-row li::before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(26,37,49,.2);transition:background .6s}
.who-row li.on{background:var(--ink);color:var(--paper);box-shadow:none}
.who-row li.on::before{background:var(--red)}
.who-note{margin-top:12px;font-size:.9375rem;color:var(--granit)}
.a-src{margin-top:26px}
.a-src ul{list-style:none;padding:0}
.a-src li a{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--rule);text-decoration:none;font-size:.9375rem;transition:padding .35s var(--ease),color .25s}
.a-src li:last-child a{border-bottom:1px solid var(--rule)}
.a-src li a:hover{padding-left:8px;color:var(--red)}
.a-src li a svg{width:16px;height:16px;flex:none;margin-top:3px;color:var(--granit);transition:color .25s}
.a-src li a:hover svg{color:var(--red)}
.a-src li a span{min-width:0;overflow-wrap:anywhere}
.a-stand{margin-top:12px;font-size:.8125rem;line-height:1.45;color:var(--granit)}
.a-src,.a-who,#newQ{opacity:0;transition:opacity .7s var(--ease)}
.a-src.in,.a-who.in,#newQ.in{opacity:1}
#newQ{margin-top:26px}



/* ============ Frag Tell ============ */
body{background:var(--paper)}
main{outline:none}
:root{--hh:84px}
.fq-home{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:calc(var(--inset) + clamp(96px,17svh,170px)) var(--pad) 0;overflow:clip}
.fq-greet{font-family:var(--serif);font-weight:400;font-size:clamp(2.5rem,6.6vw,5.8rem);line-height:1;letter-spacing:-.035em;text-align:center;text-wrap:balance;animation:fqUp .9s var(--ease) both}
.fq-sub{margin-top:clamp(12px,1.4vw,20px);color:var(--granit);font-size:clamp(1.05rem,1.6vw,1.35rem);line-height:1.35;text-align:center;max-width:32em;text-wrap:balance;animation:fqUp .9s .12s var(--ease) both}
.fq-card{margin-top:clamp(26px,4vw,48px);width:min(100%,720px);padding:clamp(16px,2vw,26px);border-radius:var(--r-xl);background:rgba(251,249,245,.82);-webkit-backdrop-filter:blur(26px) saturate(1.2);backdrop-filter:blur(26px) saturate(1.2);border:1px solid rgba(255,255,255,.7);box-shadow:var(--sh);animation:fqUp .9s .24s var(--ease) both;position:relative;z-index:2}
.fq-home.answering .fq-card{background:rgba(251,249,245,.96)}
.fq-card .chips{justify-content:center}
.chip.more{border-style:dashed;background:transparent}
.fq-note{margin-top:16px;max-width:36em;text-align:center;font-size:.8125rem;line-height:1.45;color:var(--granit);position:relative;z-index:2}
.fq-sky{margin-top:auto;padding-top:clamp(28px,5vw,64px);width:100%;display:flex;justify-content:center;pointer-events:none;transition:opacity .6s var(--ease)}
.fq-sky img{display:block;width:auto;max-width:min(980px,100%);height:auto;max-height:min(44svh,500px);object-fit:contain;filter:drop-shadow(0 14px 22px rgba(26,37,49,.2));margin-bottom:-2px}
.fq-home.answering .fq-sky{opacity:.18}
@keyframes fqUp{from{opacity:0;transform:translateY(14px)}}

.fq-view{margin:calc(var(--inset) + var(--hh)) var(--inset) var(--inset)}
.fq-sheet{border-radius:var(--r-xl);background:var(--snow);padding:clamp(40px,6vw,96px) var(--pad) clamp(48px,7vw,110px);min-height:60svh}
.fq-in{max-width:68rem;margin-inline:auto}
.fq-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.8125rem;font-weight:500;color:var(--granit);margin-bottom:18px}
.fq-eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}
.fq-h{font-family:var(--serif);font-weight:400;font-size:clamp(2.3rem,5.2vw,4.6rem);line-height:1.04;letter-spacing:-.03em;text-wrap:balance;outline:none}
.fq-lead{margin-top:20px;max-width:40em;font-size:clamp(1.0625rem,1.5vw,1.25rem);line-height:1.5;color:var(--granit)}
.fq-b{margin-top:clamp(36px,5vw,68px)}
.fq-b>h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.55rem,2.5vw,2.2rem);line-height:1.1;letter-spacing:-.02em}
.fq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;margin-top:22px}
.fq-tile{display:flex;flex-direction:column;gap:10px;padding:clamp(18px,2vw,26px);border-radius:var(--r-lg);background:var(--paper)}
.fq-tile h3{font-family:var(--serif);font-weight:500;font-size:1.35rem;line-height:1.12;letter-spacing:-.015em}
.fq-tile p{color:var(--granit);font-size:.9375rem;line-height:1.45}
.fq-tile .fq-meta{font-size:.8125rem;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.fq-tile .fq-meta::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);flex:none}
.fq-tile .btn{margin-top:auto;align-self:flex-start;font-size:.875rem;padding:.8em 1.25em}
.fq-tile .fq-gap{flex:1}
.fq-list{list-style:none;padding:0;margin-top:18px}
.fq-list li{padding:14px 0 14px 26px;border-top:1px solid var(--rule);position:relative;line-height:1.5;max-width:52em}
.fq-list li:last-child{border-bottom:1px solid var(--rule)}
.fq-list li::before{content:"";position:absolute;left:4px;top:1.15em;width:8px;height:8px;border-radius:50%;background:rgba(26,37,49,.22)}
.fq-note2{margin-top:12px;font-size:.875rem;color:var(--granit)}
.fq-day{display:grid;grid-template-columns:minmax(8.5rem,14rem) 1fr;gap:12px clamp(16px,3vw,40px);padding:clamp(22px,3vw,34px) 0;border-top:1px solid var(--rule)}
.fq-day:last-child{border-bottom:1px solid var(--rule)}
.fq-day time{font-family:var(--serif);font-size:clamp(1.25rem,1.9vw,1.7rem);letter-spacing:-.015em;line-height:1.15}
.fq-day h3{font-size:.8125rem;font-weight:500;color:var(--granit);letter-spacing:.01em;margin:0 0 6px}
.fq-day h3:not(:first-child){margin-top:18px}
.fq-day ul{list-style:none;padding:0}
.fq-day li{padding:3px 0;max-width:46em;line-height:1.5}
.fq-ph{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin-top:22px;counter-reset:ph}
.fq-ph article{padding:clamp(18px,2vw,26px);border-radius:var(--r-lg);background:var(--paper);display:flex;flex-direction:column;gap:8px}
.fq-ph .n{font-family:var(--serif);font-size:2.2rem;line-height:1;color:var(--red);letter-spacing:-.03em}
.fq-ph h3{font-family:var(--serif);font-weight:500;font-size:1.35rem;line-height:1.12;letter-spacing:-.015em}
.fq-ph .e{font-size:.8125rem;font-weight:500;color:var(--granit)}
.fq-ph p{font-size:.9375rem;line-height:1.45;color:var(--ink)}
.fq-links{list-style:none;padding:0;margin-top:18px}
.fq-links li a{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--rule);text-decoration:none;transition:padding .35s var(--ease),color .25s}
.fq-links li:last-child a{border-bottom:1px solid var(--rule)}
.fq-links li a:hover,.fq-links li a:focus-visible{padding-left:8px;color:var(--red)}
.fq-links li a svg{width:18px;height:18px;flex:none;margin-top:3px}
.hnav a[aria-current="page"]{background:rgba(26,37,49,.08);color:var(--ink)}
.tfoot#tfoot{padding-bottom:clamp(28px,4vw,48px)}
.tfoot-links+.tfoot-links{margin-top:2px}
.tfoot-h{margin-top:14px;font-size:.8125rem;color:rgba(238,233,224,.6)}
.tfoot a[aria-current="page"]{text-decoration:underline;text-underline-offset:4px}
.tfoot-credit{margin-top:10px;max-width:64em;font-size:.8125rem;color:rgba(238,233,224,.5);overflow-wrap:anywhere}

/* responsive (aus index.html übernommen) */
@media (max-width:900px){
  .notice{order:3;flex:1 0 100%;max-width:none;padding:7px 12px;font-size:.75rem}
  .site-header{flex-wrap:wrap;row-gap:8px}
  :root{--hh:112px}
  .fq-home{padding-top:calc(var(--inset) + 128px)}
}
@media (max-width:700px){
  .brand{font-size:1.3rem}
  .head-r{padding:4px}
  .lang button{padding:7px 9px}
  .ask input{height:52px}

der Stadt Bern und habe einen Hund übernommen. Wo melde ich ihn an und was kostet das?"},{"l":"Kinderzulagen","q":"Ich bin in Bern angestellt und habe ein Baby bekommen. Wie bekomme ich Kinderzulagen und wie viel gibt es?"},{"l":"Betreibungsauszug","q":"Ich wohne in Bern und brauche für eine neue Wohnung einen Betreibungsregisterauszug. Wo bestelle ich ihn und was kostet er?"},{"l":"Strafregisterauszug","q":"Ich brauche für eine neue Stelle einen Strafregisterauszug. Wie bestelle ich ihn und wie lange dauert es?"},{"l":"Auto einlösen","q":"Ich wohne in Bern und habe ein Occasionsauto gekauft. Wie löse ich es ein und was kostet das?"},{"l":"Einbürgerung","q":"Ich lebe seit 12 Jahren in der Schweiz, davon 3 in der Stadt Bern, und habe den C-Ausweis. Kann ich mich einbürgern lassen und was kostet das?"},{"l":"Prämienverbilligung","q":"Ich wohne im Kanton Bern und verdiene wenig. Bekomme ich Prämienverbilligung und muss ich sie beantragen?"},{"l":"Wehrpflichtersatz","q":"Ich bin 22, wohne in Bern und wurde für den Militärdienst untauglich erklärt. Muss ich Wehrpflichtersatz zahlen und wie viel?"}],"think":"Tell prüft offizielle Quellen","who":"Zuständig","bund":"Bund","kanton":"Kanton","gemeinde":"Gemeinde","src":"Quellen","glance":"Auf einen Blick","stand":"Stand: Oktober 2026 · Beispielhafte Antwort aus öffentlichen Quellen, ohne Gewähr. Massgebend sind die Stellen.","newtab":"öffnet in neuem Tab","newq":"Neue Frage","fb":{"intro":"Dazu hat der Prototyp noch keine Antwort. Die echte Version würde hier offizielle Quellen von Bund, Kantonen und Gemeinden durchsuchen. Siebzehn Beispiele beantwortet er schon: Umzug, Pass und ID, Steuererklärung, AHV-Rente, Arbeitslosigkeit, Krankenkasse wechseln, Einzelfirma gründen ausländischen Führerausweis umtauschen, Heiraten, Hund anmelden, Familienzulagen, Betreibungs- und Strafregisterauszug, Auto einlösen, Einbürgerung, Prämienverbilligung und Wehrpflichtersatz. Probieren Sie eines davon."},"ans":{"move":{"intro":"Sie melden sich innert 14 Tagen am neuen Wohnort an. Von Bern nach Winterthur geht das online über eUmzugCH: Beide Gemeinden sind angeschlossen, ein Gang an den Schalter ist nicht nötig.","facts":[["Frist","14 Tage ab Adressänderung (Art. 11 RHG)"],["Kosten","Winterthur: CHF 40 pro erwachsene Person; eUmzugCH kostet nicht mehr als der Schalter"],["Schalter","Nicht nötig, alles läuft online"],["Zuständig","Einwohnerdienste Bern (Abmeldung), Einwohnerkontrolle Winterthur (Anmeldung)"]],"steps":["Auf eumzug.swiss alte Adresse (Bern) und neue Adresse (Winterthur) eingeben und «Prüfen» klicken.","Bereithalten: Pass oder ID, AHV-Nummer (13-stellig), Mietvertrag oder Einzugsbestätigung, Karte oder Twint für CHF 40.","Krankenkassenkarte oder Police bereithalten: Winterthur verlangt diesen Nachweis bei der Anmeldung.","Abmeldung in Bern und Anmeldung in Winterthur online abschliessen; ein Schalterbesuch in Bern ist nicht nötig.","Steueramt: Winterthur erhält die neue Adresse automatisch; steuerpflichtig sind Sie dort ab 1. Januar des Zuzugsjahres."],"who":[1,1,1],"note":"Die Gemeinden (Bern, Winterthur) nehmen Ab- und Anmeldung entgegen, eUmzugCH ist der gemeinsame Dienst von Bund, Kantonen und Gemeinden, die Steuern erhebt der Kanton Zürich mit der Stadt Winterthur.","src":["eUmzugCH – Umzug online melden (Bund, Kantone, Gemeinden)","Stadt Winterthur – Umzug & Neu in Winterthur","Stadt Bern – Zuzug, Umzug und Wegzug","Stadt Winterthur – Steuern bei Umzug, Zuzug und Wegzug"]},"passport":{"intro":"Als Erwachsene mit Wohnsitz in Bern beantragen Sie Pass und/oder ID online auf schweizerpass.ch und gehen dann zum gebuchten Termin, z. B. ins Ausweiszentrum Bern (Laupenstrasse 18A). Die Kombi Pass + ID kostet CHF 158 und ist 10 Jahre gültig.","facts":[["Kosten","Erwachsene: ID CHF 70, Pass CHF 145, Kombi CHF 158. Kinder bis 18: ID 35, Pass 65, Kombi 78 (inkl. Porto)."],["Gültigkeit","Erwachsene 10 Jahre, Kinder und Jugendliche bis 18 Jahre: 5 Jahre. Verlängern ist nicht möglich, Sie bestellen neu."],["Dauer","Lieferung max. 10 Arbeitstage nach dem Termin, per Einschreiben."],["Termin","Pflicht und persönliches Erscheinen nötig (Foto, bei Pass Fingerabdrücke)."],["Neu ab November","Ab 2. November 2026 gibt es zusätzlich die biometrische ID mit Chip (Gesichtsbild und zwei Fingerabdrücke). Bezug freiwillig, Gebühr gleich wie heute. Der provisorische Pass heisst dann «Notpass»."]],"steps":["Online-Antrag auf schweizerpass.ch ausfüllen (persönliche E-Mail nötig). Nach der Prüfung erhalten Sie eine E-Mail zur Terminwahl.","Termin in einem der 7 Berner Ausweiszentren buchen (Pflicht): online oder per Tel. 031 635 40 00, Mo-Fr.","Alten Ausweis mitbringen, aber kein Passfoto: Das Foto wird vor Ort aufgenommen.","Gebühr vor Ort zahlen (Karte, Twint oder bar). Kinder kommen mit sorgeberechtigter Person und deren Ausweis.","Ausweis kommt innert 10 Arbeitstagen per Einschreiben an die angegebene Adresse."],"who":[1,1,0],"note":"Der Bund (fedpol) publiziert Preise, Gültigkeit und Lieferfristen; im Kanton Bern erfassen die sieben kantonalen Ausweiszentren Ihre Daten.","src":["fedpol: Preise, Gültigkeit und Lieferfristen","Kanton Bern: Ausweise, Preise und Gültigkeit","Kanton Bern: Ausweiszentren und Termin","Kanton Bern: Termin wahrnehmen, Unterlagen","Bundesrat: biometrische ID ab 2.11.2026 (Medienmitteilung 26.8.2026)"]},"tax":{"intro":"Im Kanton Bern ist die Steuererklärung grundsätzlich bis 15. März fällig; online verlängern Sie bis 15. Juli gratis, höchstens bis 15. November. Für die Steuerperiode 2025 gilt wegen eines IT-Unterbruchs ausnahmsweise der 30. November 2026 als letzte Frist.","facts":[["Frist","Bern: 15. März (Selbstständige: 15. Mai). Zürich und Genf: 31. März."],["Kosten","Bern online: bis 15. Juli gratis, bis 15. Sept. CHF 20, bis 15. Nov. CHF 40. Schriftlich/Telefon: CHF 20/40/60. Genf: CHF 20/40/60."],["Dauer","Bern: höchstens bis 15. Nov.; 2025er-Erklärung ausnahmsweise bis 30. Nov. 2026 (IT-Unterbruch)."],["Zuständig","Bern: kantonale Steuerverwaltung. Zürich: Gemeindesteueramt. Genf: Administration fiscale cantonale."]],"steps":["Brief zur Steuererklärung, Lohnausweis (vom Arbeitgeber) und Belege bereitlegen.","Vor Fristablauf in BE-Login (mit AGOV) «Fristverlängerung erfassen», neue Frist wählen und bestätigen.","Bestätigung selbst speichern: Es kommt keine per Post oder E-Mail.","Steuererklärung in TaxMe-Online ausfüllen und mit Belegen einreichen (oder ausgedruckt bei der Wohnsitzgemeinde abgeben).","Zu spät? Es droht eine Mahngebühr von CHF 60; nach abgelaufener Mahnfrist ist keine Verlängerung mehr möglich."],"who":[1,1,1],"note":"Die kantonale Steuerverwaltung nimmt Ihre Erklärung entgegen und veranlagt auch die direkte Bundessteuer im Auftrag des Bundes (ESTV beaufsichtigt), die Gemeinde legt ihren Steuerfuss fest.","src":["Kanton Bern: Frist als Privatperson verlängern","Kanton Bern: Wegleitung, Einreichefrist","Kanton Zürich: Steuererklärung Privatpersonen","Canton de Genève: Demander un délai"]},"ahv":{"intro":"Ein Mann, Jahrgang 1962, in Thun erreicht 2027 mit 65 das Referenzalter und meldet seine Rente 3–4 Monate vorher bei der Ausgleichskasse an. Bei Geburtstag am 15. März 2027 beginnt die Rente am 1. April 2027; die Anmeldung erfolgt ab ca. Dezember 2026.","facts":[["Referenzalter","Männer 65. Frauen: Jg. 1961 = 64 J. 3 Mt., Jg. 1962 = 64 J. 6 Mt., Jg. 1963 = 64 J. 9 Mt., ab Jg. 1964 = 65. Rente ab Folgemonat."],["Frist","Anmeldung 3–4 Monate vor Rentenbeginn. Vorbezug ab 63 (–6.8 % bei 1 Jahr), Aufschub 1–5 Jahre (+5.2 % bis +31.5 %)."],["Rente","Ab 2027 bei voller Beitragsdauer CHF 1’280 bis 2’560 pro Monat; Ehepaar höchstens CHF 3’840. Dazu 13. Rente ab Dezember 2026."],["Zuständig","Ausgleichskasse, bei der Ihr Arbeitgeber angeschlossen ist (im Kanton Bern z. B. die AK Bern)."]],"steps":["Zuständige Ausgleichskasse klären: Angestellte fragen den Arbeitgeber, Selbstständige die zuletzt abrechnende Kasse.","Formular 318.370 «Anmeldung für eine Altersrente» 3–4 Monate vor Rentenbeginn online ausfüllen und einreichen.","Vorbezug: spätestens bis Ende des Vormonats beantragen. Aufschub: spätestens 1 Jahr nach Referenzalter im Formular ankreuzen.","Beilagen mit dem Formular hochladen oder per Post senden; die Ausgleichskasse beschafft nötige Unterlagen und berechnet die Rente.","Auszahlung monatlich (AK Bern: 4. Arbeitstag, z. B. 4. Dezember 2026); die 13. Rente im Dezember kommt ohne Antrag."],"who":[1,1,0],"note":"Der Bund (BSV) gibt Regeln und Merkblätter vor; die Ausgleichskasse (im Kanton Bern die AK Bern) nimmt Ihre Anmeldung entgegen, berechnet und zahlt die Rente aus.","src":["Ausgleichskasse Kanton Bern: Altersrente der AHV","ahv-iv.ch: Merkblatt 3.01 Altersrenten (Stand 1.1.2026)","ch.ch: Pensionierung – ab wann?","BSV: Stabilisierung der AHV (AHV 21)","Bundesrat: AHV/IV-Renten steigen per 1.1.2027 (2.10.2026)"]},"alv":{"intro":"Melden Sie sich spätestens am ersten Tag, für den Sie Arbeitslosenentschädigung wollen, beim RAV Ihrer Region an, am schnellsten online im Job-Room. Beispiel Thun: 30-jährig, 6’500 Franken Monatslohn, keine Kinder, 14 Monate Beitragszeit ergibt 70 %, höchstens 260 Taggelder und 10 Wartetage.","facts":[["Frist","Anmeldung beim RAV spätestens am 1. Tag der Arbeitslosigkeit, besser schon während der Kündigungsfrist."],["Höhe","70 % des versicherten Verdienstes. 80 % bei Kindern unter 25, Verdienst bis 3’797 Franken oder IV-Rente ab 40 %."],["Dauer","Mind. 12 Monate Beitragszeit in 2 Jahren. 260 Taggelder, bei längerer Beitragszeit mehr. Rahmenfrist: 2 Jahre."],["Zuständig","RAV (Anmeldung, Beratung) und die von Ihnen gewählte Arbeitslosenkasse (Auszahlung)."]],"steps":["Online anmelden: eService «Anmeldung zur Arbeitsvermittlung (RAV)» im Job-Room, oder persönlich beim RAV Ihrer Region.","Schon in der Kündigungsfrist Stellen suchen und jede Bewerbung belegen. Wie viele, legt Ihr RAV fest.","Arbeitslosenkasse wählen, «Antrag auf Arbeitslosenentschädigung» und Arbeitgeberbescheinigungen (2 Jahre) einreichen.","Erstgespräch beim RAV (Einladung innert 15 Tagen): AHV- oder Krankenkassenkarte, ID und Nachweis der Bemühungen mitbringen.","Jeden Monat «Angaben der versicherten Person» einreichen. Die Taggelder folgen in der Regel im Folgemonat."],"who":[1,1,0],"note":"Das SECO beaufsichtigt die Arbeitslosenversicherung, RAV, Arbeitslosenkassen und kantonale Amtsstellen vollziehen sie; angemeldet wird direkt beim RAV.","src":["arbeit.swiss: Anmeldung und Registrierung","arbeit.swiss (SECO): FAQ zur Arbeitslosenentschädigung","ch.ch: Arbeitslosigkeit in der Schweiz","Fedlex: AVIG (SR 837.0), Art. 9, 17, 18, 22, 27"]},"kk":{"intro":"Sie können die Grundversicherung auf Ende Jahr wechseln, wenn Ihre Kündigung bis Montag, 30. November 2026 bei der Krankenkasse eingeht. Die neue Kasse muss Sie ohne Gesundheitsfragen aufnehmen. Die Prämien 2027 stehen schon im Prämienrechner von priminfo.admin.ch.","facts":[["Frist","Kündigung bis spätestens am letzten Arbeitstag im November (2026: Montag, 30. November) bei der Kasse. Es zählt der Eingang, nicht der Poststempel. Empfohlen: eingeschrieben bis Mitte November."],["Franchise","Erwachsene: CHF 300 oder wählbar 500, 1’000, 1’500, 2’000, 2’500, dazu 10 % Selbstbehalt, höchstens CHF 700 im Jahr. Kinder: keine Franchise, Selbstbehalt höchstens CHF 350."],["Franchise ändern","Tiefere Franchise: schriftlich bis zum letzten Arbeitstag im November. Höhere Franchise: nur auf Jahresbeginn; das Gesetz nennt keine Frist, Priminfo empfiehlt, sie bis Mitte Dezember mitzuteilen."],["Mitte Jahr","Wechsel per 1. Juli nur mit ordentlicher Franchise (CHF 300) und freier Arztwahl, Kündigung bis 31. März. Mit eingeschränkter Arztwahl (z. B. Hausarzt- oder Telmed-Modell) geht es nur auf Jahresende."],["Achtung","Offene Prämien oder Kostenbeteiligungen, die bis 30. November gemahnt werden: Die Kündigung wirkt nur, wenn Sie sie samt Verzugszinsen und Betreibungskosten bis 31. Dezember bezahlen (Art. 64a KVG)."],["Zuständig","Ihre bisherige und die neue Krankenkasse. Der Bund (BAG) genehmigt die Prämien."]],"steps":["Prämien 2027 auf priminfo.admin.ch vergleichen: Wohnort, Alter, Franchise und Modell (z. B. Hausarzt oder Telmed) eingeben.","Neue Kasse wählen und dort die Grundversicherung beantragen. Jede Kasse muss Sie aufnehmen, ohne Gesundheitsfragen, Vorbehalte oder Wartefrist.","Bisherige Grundversicherung schriftlich kündigen, am besten eingeschrieben bis Mitte November.","Die Zusatzversicherung nicht vorschnell kündigen: Dort darf die Kasse Gesundheitsfragen stellen und ablehnen. Die Kündigungsfrist steht in den Versicherungsbedingungen, oft drei Monate auf Ende Jahr. Die Kasse darf sie nicht kündigen, weil Sie die Grundversicherung wechseln.","Bestätigung der neuen Kasse abwarten: Die alte Versicherung endet erst, wenn die neue Kasse die lückenlose Deckung gemeldet hat. Kommt die Meldung zu spät, muss die neue Kasse die Prämiendifferenz übernehmen."],"who":[1,0,0],"note":"Das Gesetz (KVG) und die Genehmigung der Prämien liegen beim Bund (BAG). Kündigung und Beitritt laufen direkt über die Krankenkassen, keine Behörde nimmt sie entgegen.","src":["Priminfo (BAG): FAQ, Wechsel der Krankenkasse","Priminfo (BAG): Prämienrechner 2027","Priminfo (BAG): Prämien 2027 nach Kanton","Fedlex: KVG (SR 832.10), Art. 7 und 64a"]},"biz":{"intro":"Wer sich in Bern mit einer Einzelfirma selbstständig macht, meldet sich zuerst bei der Ausgleichskasse als selbstständigerwerbend an. Ins Handelsregister und zur Mehrwertsteuer müssen Sie erst ab CHF 100’000 Umsatz im Jahr. Die Anmeldungen gehen online über EasyGov.swiss, das Portal des Bundes.","facts":[["AHV","Anmeldung bei der Ausgleichskasse am Geschäftssitz (Bern: AK Bern). Beitrag 10 % des Einkommens, unter CHF 60’500 weniger; 2026 mindestens CHF 530 im Jahr."],["Handelsregister","Pflicht ab CHF 100’000 Umsatz im letzten Geschäftsjahr, sonst freiwillig. Gebühr CHF 120. Der Firmenname muss Ihren Familiennamen enthalten."],["MWST","Pflicht ab CHF 100’000 Umsatz im Jahr, oder sobald das beim Start absehbar ist. Anmeldung bei der ESTV innert 30 Tagen."],["Bewilligung","Nur für bestimmte, reglementierte Tätigkeiten nötig. Vor dem Start prüfen."]],"steps":["Auf EasyGov.swiss ein Konto eröffnen, «Einzelunternehmen» wählen und den Firmennamen mit Ihrem Familiennamen festlegen.","Bei der AK Bern als Selbstständigerwerbende anmelden, möglichst im ersten Quartal: online oder mit Formular 318.146, dazu Belege wie Rechnungen, Erfolgsrechnung oder Werbung.","Ab CHF 100’000 Jahresumsatz: Eintrag beim Handelsregisteramt Bern (CHF 120) und Anmeldung bei der ESTV für die Mehrwertsteuer innert 30 Tagen.","Vor dem Start prüfen, ob Ihre Tätigkeit eine Bewilligung braucht."],"who":[1,1,0],"note":"Ausgleichskasse und Handelsregister sind kantonal (in Bern: AK Bern und Handelsregisteramt des Kantons Bern), die Mehrwertsteuer erhebt der Bund (ESTV). EasyGov.swiss ist der Online-Schalter des Bundes für alle drei.","src":["KMU-Portal (SECO): Rechtsform Einzelunternehmen","Handelsregisteramt Bern: Merkblatt Neueintragung Einzelunternehmen","Ausgleichskasse Kanton Bern: Selbständigerwerbende","ahv-iv.ch: Merkblatt 2.02 Beiträge Selbstständigerwerbende","ESTV: Steuerpflicht MWST","EasyGov.swiss: Einzelfirma gründen"]},"drv":{"intro":"Wer in der Schweiz wohnt, fährt mit einem ausländischen Führerausweis nur 12 Monate. Im Kanton Bern tauschen Sie ihn beim Strassenverkehrsamt (SVSA) um. Ein deutscher Ausweis braucht als EU-Ausweis keine Kontrollfahrt; der Umtausch kostet CHF 120.","facts":[["Frist","12 Monate ab Einreise laut Aufenthaltsbewilligung (Art. 42 VZV). Gesuch vorher einreichen, damit Sie ohne Unterbruch fahren dürfen. Später geht noch, aber mit möglicher Busse."],["Kontrollfahrt","Keine für Ausweise aus EU/EFTA sowie Andorra, Australien, Israel, Japan, Kanada, Südkorea, Marokko, Monaco, Neuseeland, San Marino, Singapur, Taiwan, Tunesien und USA. Alle anderen fahren eine Kontrollfahrt."],["Kosten","Bern: Umtausch CHF 120, Kontrollfahrt Kategorie B CHF 132."],["Zuständig","Strassenverkehrs- und Schifffahrtsamt Kanton Bern (SVSA), Schermenweg 5, Bern."]],"steps":["Sehtest bei einem anerkannten Optiker oder Augenarzt machen.","Gesuchsformular des SVSA ausfüllen, unterschreiben und ein aktuelles farbiges Passfoto (35 × 45 mm) aufkleben.","Gesuch persönlich abgeben: bei einem SVSA-Standort, der Einwohnerkontrolle Ihrer Gemeinde oder einem Polizeiposten im Kanton Bern. Mitbringen: ausländischen Führerausweis im Original und Pass oder ID.","Falls nötig Kontrollfahrt machen. Den Schweizer Führerausweis erhalten Sie per Post."],"who":[1,1,0],"note":"Der Bund (ASTRA) regelt den Umtausch in der Verkehrszulassungsverordnung, das kantonale Strassenverkehrsamt (in Bern das SVSA) prüft das Gesuch und stellt den Ausweis aus.","src":["Kanton Bern (SVSA): Umtausch ausländischer Führerausweis","Kanton Bern (SVSA): Gebühren","ch.ch: Führerausweis umtauschen","ASTRA: Umtausch ausländischer Führerausweise"]},"wed":{"intro":"Wenn Sie beide Schweizer sind und in Zürich wohnen, reservieren Sie zuerst online Ort und Datum beim Zivilstandsamt der Stadt Zürich, frühestens 12 Monate im Voraus. Die Ehevorbereitung machen Sie zu zweit am Schalter im Stadthaus, spätestens 1 Monat vor der Hochzeit.","facts":[["Voraussetzungen","Beide mindestens 18 und urteilsfähig. Verwandte in gerader Linie sowie Geschwister und Halbgeschwister dürfen einander nicht heiraten."],["Frist","Einladung zur Ehevorbereitung frühestens 3 Monate vor der Hochzeit. Abschliessen spätestens 1 Monat davor, sonst wird die Reservation storniert."],["Kosten","Zürich: günstigste Hochzeit im Stadthaus ab CHF 255, inklusive Ehevorbereitung ohne Übersetzung (nur mit Wohnort Stadt Zürich)."],["Trauzeugen","Zwei volljährige und urteilsfähige Trauzeuginnen oder Trauzeugen müssen dabei sein."]],"steps":["Auf der Website des Zivilstandsamts Zürich Hochzeitslocation und Datum reservieren, frühestens 12 Monate im Voraus.","Frühestens 3 Monate vor der Hochzeit kommt eine E-Mail-Einladung. Damit wählen Sie online einen Termin für die Ehevorbereitung.","Zu zweit am Schalter im Stadthaus erscheinen, mit Pass oder ID. Sie füllen das Formular aus, unterschreiben und legen fest, welche Namen Sie und allenfalls Ihre Kinder tragen.","Gebühren vor Ort mit Karte oder Twint zahlen. Zur Trauung zwei Trauzeugen mitbringen."],"who":[1,0,1],"note":"Die Regeln zur Ehe (ZGB) und die Gebühren legt der Bund fest; Ehevorbereitung und Trauung führt in Zürich das Zivilstandsamt der Stadt durch.","src":["Stadt Zürich: Heiraten mit Wohnort Zürich","Stadt Zürich: Ehevorbereitung","Stadt Zürich: Fragen und Antworten zur Heirat","ch.ch: Heiraten in der Schweiz"]},"dog":{"intro":"In der Stadt Bern melden Sie Ihren Hund bei den Einwohnerdiensten an, mit dem Formular «An- und Abmeldung Hund». Haben Sie den Hund übernommen, melden Sie den Halterwechsel innert 10 Tagen der Datenbank AMICUS. Die Hundetaxe beträgt CHF 150 pro Jahr.","facts":[["Anmeldung","Bei den Einwohnerdiensten der Stadt Bern, Predigergasse 5, 3011 Bern. Die Gemeinde erfasst Sie als Halterin oder Halter in AMICUS."],["Frist","Halterwechsel (Kauf, Übernahme, Abgabe für mehr als 3 Monate) innert 10 Tagen an AMICUS melden. Importierte Hunde: Chip innert 10 Tagen vom Tierarzt prüfen und melden lassen."],["Kosten","Stadt Bern: CHF 150 pro Hund und Jahr, für Hunde ab 6 Monaten. Die Rechnung kommt automatisch im August."],["Mikrochip","Pflicht für jeden Hund; Welpen innert 3 Monaten. Nur Tierärztinnen und Tierärzte setzen den Chip und melden den Hund an AMICUS."]],"steps":["Formular «An- und Abmeldung Hund» der Stadt Bern ausfüllen und per Post an die Einwohnerdienste senden.","Hat der Hund schon einen Chip: Halterwechsel innert 10 Tagen in AMICUS melden. Hat er noch keinen: beim Tierarzt chippen lassen.","Hundetaxe zahlen, wenn die Rechnung im August kommt.","Bei Umzug, Abgabe oder Tod des Hundes: Gemeinde und AMICUS informieren."],"who":[1,0,1],"note":"Der Bund schreibt Chip und Registrierung in AMICUS vor (Tierseuchenverordnung); die Gemeinde nimmt die Anmeldung entgegen und erhebt die Hundetaxe.","src":["Stadt Bern: Hunde","Stadt Bern: Formular An- und Abmeldung Hund","AMICUS: Gut zu wissen (Merkblatt)","ch.ch: Hundesteuer"]},"fam":{"intro":"Als Angestellte oder Angestellter im Kanton Bern beantragen Sie die Familienzulagen bei Ihrem Arbeitgeber. Er leitet den Antrag an seine Familienausgleichskasse weiter. Die Kinderzulage beträgt CHF 250 pro Monat und Kind (Stand 2026).","facts":[["Höhe","Kanton Bern, Stand 2026: Kinderzulage CHF 250 pro Monat bis zum Monat des 16. Geburtstags. Ausbildungszulage CHF 310 für Kinder in Ausbildung, frühestens ab 15, längstens bis 25."],["Antrag","Angestellte beim Arbeitgeber. Nichterwerbstätige bei der kantonalen Ausgleichskasse (AK Bern)."],["Frist","Keine feste Frist; vergessene Zulagen lassen sich bis 5 Jahre rückwirkend verlangen."],["Pro Kind","Nur eine Zulage pro Kind, auch wenn beide Eltern arbeiten."]],"steps":["Beim Arbeitgeber das Antragsformular für Familienzulagen verlangen.","Formular mit den Angaben zum Kind und zum anderen Elternteil ausfüllen und unterschreiben.","Der Arbeitgeber leitet den Antrag an seine Familienausgleichskasse weiter und zahlt die Zulage aus.","Arbeiten beide Eltern: vorher klären, wer den Antrag stellt, denn es gibt nur eine Zulage pro Kind."],"who":[1,1,0],"note":"Der Bund legt die Mindestbeträge fest (Familienzulagengesetz), der Kanton Bern zahlt 115 % davon; ausgezahlt wird über die rund 50 Familienausgleichskassen im Kanton.","src":["Familienportal Kanton Bern: Kinder- und Ausbildungszulagen","ch.ch: Familienzulagen","ahv-iv.ch: Merkblatt 6.08 Familienzulagen","Ausgleichskasse Kanton Bern: Familienzulagen"]},"debt":{"intro":"Im Kanton Bern bestellen Sie den Betreibungsregisterauszug online beim kantonalen Betreibungs- und Konkursamt (be.ch/baka). Er kostet CHF 18 inklusive Zustellung und kommt elektronisch zum Herunterladen.","facts":[["Kosten","Kanton Bern online: CHF 18 inklusive Zustellung (Gebühr CHF 17 pro Auszug)."],["Inhalt","Die Betreibungen der letzten 5 Jahre im jeweiligen Betreibungskreis."],["Umzug","Wer in den letzten 5 Jahren anderswo wohnte, bestellt auch dort einen Auszug, sonst fehlen diese Betreibungen."],["Zustellung","Online-Bestellung rein elektronisch: Download auf einer gesicherten Plattform, mehrmals möglich."]],"steps":["Auf be.ch/baka den Betreibungsregisterauszug für sich selbst online bestellen.","Gültigen Ausweis bereithalten: ID, Pass oder Ausländerausweis.","Gebühr gleich bei der Bestellung zahlen: Karte, PostFinance Pay oder Twint.","Auszug auf der gesicherten Plattform herunterladen und zum Beispiel dem Vermieter weitergeben."],"who":[1,1,0],"note":"Das Betreibungsrecht (SchKG) und die Gebühren regelt der Bund; im Kanton Bern führt das kantonale Betreibungs- und Konkursamt (BAKA) die Register.","src":["Kanton Bern (BAKA): Betreibungsauszug bestellen","ch.ch: Betreibungsregisterauszug bestellen","Kanton Bern: Bestellung des Betreibungsauszugs online (Medienmitteilung)"]},"crim":{"intro":"Den Strafregisterauszug (Privatauszug) bestellen Sie beim Bund, online auf strafregister.admin.ch oder am Postschalter. Er kostet CHF 17 und kommt etwa 10 Arbeitstage nach Eingang des unterschriebenen Formulars per Post.","facts":[["Kosten","CHF 17 für den Privatauszug. Beglaubigung oder Apostille: CHF 20 zusätzlich."],["Dauer","Etwa 10 Arbeitstage nach Eingang des unterschriebenen Formulars."],["Bestellen","Online auf strafregister.admin.ch oder persönlich am Postschalter mit gültigem Ausweis."],["Sonderprivatauszug","Für Tätigkeiten mit Minderjährigen gibt es einen eigenen Auszug, den Sonderprivatauszug."]],"steps":["Auf strafregister.admin.ch den Privatauszug wählen und Personalien, Adresse und Zahlungsangaben eingeben.","Gebühr online zahlen: Debit- oder Kreditkarte, PostFinance Card oder Twint.","Formular ausdrucken, unterschreiben und mit einer Kopie Ihres Ausweises per Post schicken.","Alternativ: am Postschalter mit Pass, ID oder Ausländerausweis bestellen und gleich bezahlen."],"who":[1,0,0],"note":"Das Strafregister führt der Bund (Bundesamt für Justiz). Bestellt wird direkt beim Bund oder über einen Postschalter.","src":["Bundesamt für Justiz: Privatauszug bestellen","Bundesamt für Justiz: FAQ Privatauszug","ch.ch: Strafregisterauszug"]},"car":{"intro":"Im Kanton Bern lösen Sie das Auto beim Strassenverkehrsamt (SVSA) ein, per Post oder am Schalter. Zuerst schickt Ihre Versicherung den Versicherungsnachweis elektronisch ans Amt. Der Fahrzeugausweis kostet CHF 45 per Post oder CHF 55 am Schalter.","facts":[["Unterlagen","Versicherungsnachweis (kommt von der Versicherung elektronisch ans Amt), Fahrzeugausweis des Vorbesitzers, Prüfbericht falls das Auto nachgeprüft wurde, Ausweis."],["Kosten","Fahrzeugausweis: CHF 45 per Post, CHF 55 am Schalter. Neue Nummernschilder: CHF 45 pro Paar, CHF 30 einzeln."],["Frist","Der Versicherungsnachweis gilt 30 Tage. Die Motorfahrzeugsteuer ist innert 30 Tagen nach Rechnung zu zahlen."],["Steuer","Jährliche Motorfahrzeugsteuer, Rechnung im Januar oder bei der Anmeldung. Die Höhe zeigt der Rechner des SVSA."]],"steps":["Haftpflichtversicherung abschliessen. Die Versicherung schickt den Versicherungsnachweis elektronisch ans SVSA.","Formular «Anmeldung zur Immatrikulation eines Fahrzeugs» ausfüllen.","Formular mit Fahrzeugausweis des Vorbesitzers, allfälligem Prüfbericht und Ausweis per Post ans SVSA, Schermenweg 5, 3001 Bern, schicken oder am Schalter abgeben.","Per Post dauert es einige Arbeitstage, bis der neue Fahrzeugausweis kommt. Danach die Rechnung für die Motorfahrzeugsteuer innert 30 Tagen zahlen."],"who":[1,1,0],"note":"Der Bund regelt die Zulassung von Fahrzeugen; das kantonale Strassenverkehrsamt (in Bern das SVSA) stellt Fahrzeugausweis und Nummernschilder aus und erhebt die Motorfahrzeugsteuer.","src":["Kanton Bern (SVSA): Fahrzeug einlösen","Kanton Bern (SVSA): So melden Sie Ihr Fahrzeug an","Kanton Bern (SVSA): Unterlagen für die Anmeldung","Kanton Bern (SVSA): Fahrzeugsteuer berechnen","ch.ch: Fahrzeug einlösen"]},"nat":{"intro":"Die Wohnsitzbedingungen erfüllen Sie: 10 Jahre in der Schweiz, C-Ausweis und mindestens 2 Jahre in Kanton und Gemeinde. Dazu kommen Sprachnachweis, Einbürgerungstest und Integration. Das Gesuch stellen Sie bei der Stadt Bern; für eine Einzelperson kosten Gemeinde, Kanton und Bund zusammen CHF 1’650.","facts":[["Voraussetzungen","C-Ausweis, insgesamt 10 Jahre in der Schweiz, je mindestens 2 Jahre ununterbrochen im Kanton Bern und in der Gemeinde, erfolgreich integriert."],["Sprache","Kanton Bern: mündlich B1, schriftlich A2. Kein Sprachnachweis nötig, wenn die Amtssprache Ihre Muttersprache ist oder Sie mindestens 5 Jahre die obligatorische Schule in dieser Sprache besucht haben."],["Test","Schriftlich, 90 Minuten: Geografie, Geschichte, Demokratie, Gesundheit und Arbeit, Rechte und Pflichten. Befreit ist unter anderem, wer mindestens 5 Jahre die obligatorische Schule in der Schweiz besucht hat."],["Kosten","Einzelperson in der Stadt Bern: Gemeinde CHF 400, Kanton CHF 1’150, Bund CHF 100. Ehepaar: 600, 1’725 und 150."]],"steps":["Bei der Wohngemeinde (Stadt Bern) melden. Sie gibt Ihnen die Formulare und sagt, welche Unterlagen nötig sind.","Sprachnachweis beschaffen (B1 mündlich, A2 schriftlich), falls Sie nicht befreit sind.","Gesuch mit allen Unterlagen bei der Gemeinde einreichen und den Einbürgerungstest machen, falls Sie nicht befreit sind.","Die Gemeinde stellt Ihnen die Gebühren von Gemeinde und Kanton in Rechnung; der Bund (SEM) entscheidet über die Einbürgerungsbewilligung."],"who":[1,1,1],"note":"Einbürgern heisst drei Bürgerrechte erwerben: Gemeinde, Kanton und Bund prüfen je ihren Teil. Das Gesuch läuft über die Wohngemeinde, das Staatssekretariat für Migration (SEM) erteilt die Bewilligung des Bundes.","src":["Kanton Bern: Aufenthalt in der Schweiz (Einbürgerung)","Kanton Bern: Sprachkenntnisse und Nachweis","Kanton Bern: Einbürgerungstest","Kanton Bern: Gebühren der Einbürgerung","SEM: Ordentliche Einbürgerung"]},"pv":{"intro":"Im Kanton Bern prüft der Kanton Ihren Anspruch auf Prämienverbilligung in der Regel automatisch, anhand der definitiven Steuerdaten der zwei Vorjahre. 2026 liegt die Grenze bei CHF 35’000 massgebendem Einkommen, für Familien mit Kindern bei CHF 45’000. Einen Antrag stellen Sie nur in besonderen Fällen.","facts":[["Grenze 2026","Massgebendes Einkommen höchstens CHF 35’000; Familien mit Kindern höchstens CHF 45’000."],["Prüfung","Automatisch anhand der definitiven Steuerdaten der zwei Vorjahre (Reineinkommen und Vermögen)."],["Antrag","Nur in besonderen Fällen, zum Beispiel wenn keine automatische Prüfung möglich ist oder sich Einkommen oder Familie dauerhaft und stark ändern. Auch online möglich."],["Rechner","Unverbindliche Schätzung mit dem Online-Rechner auf be.ch/pvo-onlinerechner."]],"steps":["Mit dem Online-Rechner auf be.ch/pvo-onlinerechner prüfen, ob ein Anspruch möglich ist.","Steuererklärung einreichen: Die automatische Prüfung braucht definitive Steuerdaten.","Haben sich Einkommen oder Familie dauerhaft und stark verändert: Antrag stellen, auch online.","Besteht ein Anspruch, zahlt der Kanton die Verbilligung direkt an Ihre Krankenkasse und Ihre Prämienrechnung sinkt."],"who":[1,1,0],"note":"Der Bund schreibt die Prämienverbilligung im Krankenversicherungsgesetz vor und zahlt mit; im Kanton Bern prüft und verfügt das Amt für Sozialversicherungen (ASV).","src":["Kanton Bern (ASV): Anrecht auf Prämienverbilligung","Kanton Bern (ASV): Wann Sie einen Antrag stellen müssen","Kanton Bern (ASV): Informationsblatt Prämienverbilligung 2026","Kanton Bern (ASV): Anrecht berechnen"]},"wpe":{"intro":"Ja. Wer keinen oder nicht den ganzen Militär- oder Zivildienst leistet, zahlt den Wehrpflichtersatz: 3 % des steuerbaren Einkommens der direkten Bundessteuer, mindestens CHF 400 pro Jahr. Im Kanton Bern ist das Amt für Bevölkerungsschutz, Sport und Militär (BSM) zuständig.","facts":[["Höhe","3 % des steuerbaren Einkommens der direkten Bundessteuer, mindestens CHF 400 pro Jahr."],["Dauer","Vom 19. bis zum 37. Altersjahr, höchstens 11 Ersatzjahre."],["Zivilschutz","Wer Schutzdienst leistet, zahlt trotzdem, aber 4 % weniger pro geleistetem Schutzdiensttag im Jahr."],["Rückerstattung","Wer Militär- oder Zivildienst nachholt und die Dienstpflicht erfüllt, erhält die Abgabe zurück. Der Anspruch verjährt 5 Jahre nach Ende der Wehrpflicht."]],"steps":["Steuererklärung wie gewohnt einreichen: Die Abgabe berechnet sich aus dem steuerbaren Einkommen der direkten Bundessteuer.","Die Rechnung kommt von der kantonalen Stelle, im Kanton Bern vom BSM.","Bei erheblicher Behinderung und tiefem Einkommen: Befreiung prüfen lassen.","Dienst nachgeholt: nach erfüllter Dienstpflicht die Rückerstattung beim BSM beantragen."],"who":[1,1,0],"note":"Der Wehrpflichtersatz ist eine Abgabe des Bundes (ESTV); die Kantone, in Bern das Amt für Bevölkerungsschutz, Sport und Militär, veranlagen und beziehen sie.","src":["ESTV: Wehrpflichtersatzabgabe erklärt","Kanton Bern (BSM): Wehrpflichtersatz","Kanton Bern (BSM): Rückerstattung","ch.ch: Wehrpflichtersatzabgabe"]}}},"fr":{"ask_label":"Que souhaitez-vous savoir ?","send":"Envoyer la question","nav":["Vue citoyenne","Vue des autorités","Projet","Accueil","Menu","Pages"],"f_links":["Contact","Vue des autorités","Vue citoyenne","Projet"],"f_sender":"Concept privé de Bilal Simsek, Berne. Pas une offre d'une autorité. Vos retours sont les bienvenus : {c}","f_legal":"Protection des données, conditions d'utilisation et accessibilité ne sont pas développées dans le concept. Le prototype ne collecte aucune donnée personnelle, ne dépose aucun cookie et n'utilise aucun outil d'analyse ; seul le fait que vous avez lu l'avertissement est mémorisé localement dans le navigateur.","f_note":"Prototype conceptuel. Toutes les réponses sont des exemples et ne remplacent pas un renseignement officiel.","banner_s":"Prototype conceptuel, pas un site officiel","skip":"Aller au contenu","chips":[{"l":"Déménagement","q":"Je déménage de Berne à Winterthour : comment et jusqu’à quand dois-je annoncer mon départ et mon arrivée ?"},{"l":"Passeport & ID","q":"J’habite à Berne et j’ai besoin d’un nouveau passeport et d’une carte d’identité. Comment et où les commander ?"},{"l":"Délai fiscal","q":"J’habite à Berne et je n’arrive pas à remplir ma déclaration d’impôt d’ici la mi-mars. Comment prolonger le délai et combien cela coûte-t-il ?"},{"l":"Rente AVS","q":"Je suis né(e) en 1962 et j’habite à Thoune : quand et où dois-je demander ma rente AVS ?"},{"l":"Chômage","q":"J’habite à Thoune et je perds mon emploi à la fin du mois. Où et quand dois-je m’annoncer, et comment obtenir des indemnités de chômage ?"},{"l":"Changer de caisse","q":"Jusqu’à quand puis-je changer de caisse-maladie et comment faire ?"},{"l":"Entreprise individuelle","q":"J’habite à Berne et je me mets à mon compte avec une entreprise individuelle. Que dois-je annoncer, et où ?"},{"l":"Permis étranger","q":"J’habite à Berne depuis quelques mois et j’ai un permis de conduire allemand. Dois-je l’échanger, et comment ?"},{"l":"Se marier","q":"Nous sommes tous deux Suisses, habitons à Zurich et voulons nous marier. Comment cela se passe-t-il et combien cela coûte-t-il ?"},{"l":"Annoncer un chien","q":"J’habite en ville de Berne et j’ai repris un chien. Où dois-je l’annoncer et combien cela coûte-t-il ?"},{"l":"Allocations familiales","q":"Je suis salarié(e) à Berne et j’ai eu un bébé. Comment obtenir les allocations pour enfant et combien reçoit-on ?"},{"l":"Extrait des poursuites","q":"J’habite à Berne et j’ai besoin d’un extrait du registre des poursuites pour un nouvel appartement. Où le commander et combien coûte-t-il ?"},{"l":"Casier judiciaire","q":"J’ai besoin d’un extrait du casier judiciaire pour un nouvel emploi. Comment le commander et combien de temps cela prend-il ?"},{"l":"Immatriculer une voiture","q":"J’habite à Berne et j’ai acheté une voiture d’occasion. Comment l’immatriculer et combien cela coûte-t-il ?"},{"l":"Naturalisation","q":"Je vis en Suisse depuis 12 ans, dont 3 en ville de Berne, et j’ai le permis C. Puis-je me faire naturaliser et combien cela coûte-t-il ?"},{"l":"Réduction des primes","q":"J’habite dans le canton de Berne et je gagne peu. Ai-je droit à une réduction des primes et dois-je la demander ?"},{"l":"Taxe d’exemption","q":"J’ai 22 ans, j’habite à Berne et j’ai été déclaré inapte au service militaire. Dois-je payer la taxe d’exemption et combien ?"}],"think":"Tell consulte les sources officielles","who":"Compétence","bund":"Confédération","kanton":"Canton","gemeinde":"Commune","src":"Sources","glance":"En un coup d’œil","stand":"État : octobre 2026 · Réponse donnée à titre d’exemple, issue de sources publiques, sans garantie. Seuls les services compétents font foi.","newtab":"s’ouvre dans un nouvel onglet","newq":"Nouvelle question","fb":{"intro":"Le prototype n’a pas encore de réponse à cette question. La version finale consulterait ici les sources officielles de la Confédération, des cantons et des communes. Il répond déjà à dix-sept exemples : déménagement, passeport et carte d’identité, déclaration d’impôt, rente AVS, chômage, changement de caisse-maladie, création d’une entreprise individuelle échange d’un permis de conduire étranger, mariage, annonce d’un chien, allocations familiales, extrait des poursuites, extrait du casier judiciaire, immatriculation d’une voiture, naturalisation, réduction des primes et taxe d’exemption de l’obligation de servir. Essayez l’un d’eux."},"ans":{"move":{"intro":"Vous vous annoncez dans les 14 jours auprès de votre nouvelle commune. De Berne à Winterthour, cela se fait en ligne via eUmzugCH : les deux communes sont raccordées, il n’est pas nécessaire de se rendre au guichet.","facts":[["Délai","14 jours dès le changement d’adresse (art. 11 LHR)"],["Coûts","Winterthour : CHF 40 par adulte ; eUmzugCH ne coûte pas plus cher que le guichet"],["Guichet","Pas nécessaire, tout se fait en ligne"],["Compétence","Services aux habitants de Berne (départ), contrôle des habitants de Winterthour (arrivée)"]],"steps":["Sur eumzug.swiss, saisir l’ancienne adresse (Berne) et la nouvelle adresse (Winterthour), puis lancer la vérification.","À préparer : passeport ou carte d’identité, numéro AVS (13 chiffres), contrat de bail ou attestation d’emménagement, carte ou Twint pour CHF 40.","Préparer la carte d’assuré ou la police d’assurance-maladie : Winterthour exige ce justificatif lors de l’annonce d’arrivée.","Terminer en ligne l’annonce de départ à Berne et l’annonce d’arrivée à Winterthour ; un passage au guichet à Berne n’est pas nécessaire.","Service des impôts : Winterthour reçoit automatiquement la nouvelle adresse ; vous y êtes assujetti à l’impôt dès le 1er janvier de l’année d’arrivée."],"who":[1,1,1],"note":"Les communes (Berne, Winterthour) reçoivent les annonces de départ et d’arrivée, eUmzugCH est le service commun de la Confédération, des cantons et des communes ; les impôts sont prélevés par le canton de Zurich avec la ville de Winterthour.","src":["eUmzugCH – annoncer son déménagement en ligne (Confédération, cantons, communes)","Ville de Winterthour – déménagement et arrivée à Winterthour","Ville de Berne – arrivée, déménagement et départ","Ville de Winterthour – impôts en cas de déménagement, d’arrivée et de départ"]},"passport":{"intro":"Si vous êtes adulte et habitez à Berne, vous demandez votre passeport et/ou votre carte d’identité en ligne sur schweizerpass.ch, puis vous vous rendez au rendez-vous réservé, p. ex. au centre de documents d’identité de Berne (Laupenstrasse 18A). La combinaison passeport + carte d’identité coûte CHF 158 et est valable 10 ans.","facts":[["Coûts","Adultes : carte d’identité CHF 70, passeport CHF 145, combinaison CHF 158. Enfants jusqu’à 18 ans : carte d’identité 35, passeport 65, combinaison 78 (port inclus)."],["Validité","Adultes 10 ans, enfants et jeunes jusqu’à 18 ans : 5 ans. Une prolongation n’est pas possible, vous commandez un nouveau document."],["Durée","Livraison au plus tard 10 jours ouvrables après le rendez-vous, par envoi recommandé."],["Rendez-vous","Obligatoire, présence personnelle nécessaire (photo, pour le passeport empreintes digitales)."],["Nouveau dès novembre","Dès le 2 novembre 2026, il existe en plus la carte d’identité biométrique avec puce (image faciale et deux empreintes digitales). Facultative, même émolument qu’aujourd’hui. Le passeport provisoire s’appellera alors « passeport d’urgence »."]],"steps":["Remplir la demande en ligne sur schweizerpass.ch (adresse e-mail personnelle requise). Après vérification, vous recevez un e-mail pour choisir un rendez-vous.","Réserver un rendez-vous dans l’un des 7 centres de documents d’identité bernois (obligatoire) : en ligne ou par téléphone au 031 635 40 00, lu–ve.","Apporter l’ancien document, mais pas de photo : elle est prise sur place.","Payer les frais sur place (carte, Twint ou espèces). Les enfants viennent avec une personne détentrice de l’autorité parentale et son document d’identité.","Le document arrive dans les 10 jours ouvrables, par envoi recommandé, à l’adresse indiquée."],"who":[1,1,0],"note":"La Confédération (fedpol) publie les prix, la durée de validité et les délais de livraison ; dans le canton de Berne, les sept centres cantonaux de documents d’identité saisissent vos données.","src":["fedpol : prix, durée de validité et délais de livraison","Canton de Berne : documents d’identité, prix et durée de validité","Canton de Berne : centres de documents d’identité et rendez-vous","Canton de Berne : se rendre au rendez-vous, documents à apporter","Conseil fédéral : carte d’identité biométrique dès le 2.11.2026 (communiqué du 26.8.2026)"]},"tax":{"intro":"Dans le canton de Berne, la déclaration d’impôt est en principe due au 15 mars ; en ligne, vous prolongez gratuitement jusqu’au 15 juillet, au plus tard jusqu’au 15 novembre. Pour la période fiscale 2025, en raison d’une panne informatique, le 30 novembre 2026 est exceptionnellement le dernier délai.","facts":[["Délai","Berne : 15 mars (indépendants : 15 mai). Zurich et Genève : 31 mars."],["Coûts","Berne en ligne : gratuit jusqu’au 15 juillet, CHF 20 jusqu’au 15 sept., CHF 40 jusqu’au 15 nov. Par écrit/téléphone : CHF 20/40/60. Genève : CHF 20/40/60."],["Durée","Berne : au plus tard jusqu’au 15 nov. ; déclaration 2025 exceptionnellement jusqu’au 30 nov. 2026 (panne informatique)."],["Compétence","Berne : administration fiscale cantonale. Zurich : office communal des impôts. Genève : Administration fiscale cantonale."]],"steps":["Préparer la lettre relative à la déclaration d’impôt, le certificat de salaire (de l’employeur) et les justificatifs.","Avant l’échéance, dans BE-Login (avec AGOV) : « Fristverlängerung erfassen » (saisir la prolongation de délai), choisir le nouveau délai et confirmer.","Enregistrer soi-même la confirmation : aucune n’est envoyée par la poste ni par e-mail.","Remplir la déclaration dans TaxMe-Online et la déposer avec les justificatifs (ou la remettre imprimée à votre commune de domicile).","En retard ? Des frais de rappel de CHF 60 sont à craindre ; une fois le délai de rappel écoulé, aucune prolongation n’est plus possible."],"who":[1,1,1],"note":"L’administration fiscale cantonale reçoit votre déclaration et taxe aussi l’impôt fédéral direct pour le compte de la Confédération (sous la surveillance de l’AFC) ; la commune fixe sa quotité d’impôt.","src":["Canton de Berne : prolonger le délai en tant que particulier","Canton de Berne : instructions, délai de dépôt","Canton de Zurich : déclaration d’impôt des particuliers","Canton de Genève : demander un délai"]},"ahv":{"intro":"Un homme né en 1962 et habitant à Thoune atteint l’âge de référence de 65 ans en 2027 et demande sa rente à la caisse de compensation 3 à 4 mois avant. Avec un anniversaire le 15 mars 2027, la rente commence le 1er avril 2027 ; la demande se fait dès décembre 2026 environ.","facts":[["Âge de référence","Hommes 65 ans. Femmes : née en 1961 = 64 ans 3 mois, 1962 = 64 ans 6 mois, 1963 = 64 ans 9 mois, dès 1964 = 65 ans. Rente dès le mois suivant."],["Délai","Demande 3 à 4 mois avant le début de la rente. Anticipation dès 63 ans (–6.8 % pour 1 an), ajournement 1 à 5 ans (+5.2 % à +31.5 %)."],["Rente","Dès 2027, avec une durée de cotisation complète CHF 1 280 à 2 560 par mois ; couple au maximum CHF 3 840. S’y ajoute la 13e rente dès décembre 2026."],["Compétence","Caisse de compensation à laquelle votre employeur est affilié (dans le canton de Berne p. ex. la caisse de compensation du canton de Berne, AK Bern)."]],"steps":["Clarifier la caisse de compensation compétente : les salariés demandent à leur employeur, les indépendants à la dernière caisse avec laquelle ils décomptent.","Remplir et envoyer en ligne le formulaire 318.370 « Demande de rente de vieillesse » 3 à 4 mois avant le début de la rente.","Anticipation : à demander au plus tard à la fin du mois précédent. Ajournement : à cocher dans le formulaire au plus tard 1 an après l’âge de référence.","Télécharger les annexes avec le formulaire ou les envoyer par la poste ; la caisse de compensation se procure les documents nécessaires et calcule la rente.","Versement mensuel (AK Bern : 4e jour ouvrable, p. ex. le 4 décembre 2026) ; la 13e rente de décembre est versée sans demande."],"who":[1,1,0],"note":"La Confédération (OFAS) fixe les règles et publie les mémentos ; la caisse de compensation (dans le canton de Berne, l’AK Bern) reçoit votre demande, calcule et verse la rente.","src":["Caisse de compensation du canton de Berne : rente de vieillesse de l’AVS","ahv-iv.ch : mémento 3.01 Rentes de vieillesse (état au 1.1.2026)","ch.ch : retraite – à partir de quand ?","OFAS : stabilisation de l’AVS (AVS 21)","Conseil fédéral : hausse des rentes AVS/AI au 1.1.2027 (2.10.2026)"]},"alv":{"intro":"Inscrivez-vous auprès de l’ORP de votre région au plus tard le premier jour pour lequel vous voulez toucher l’indemnité de chômage, le plus rapidement en ligne dans Job-Room. Exemple à Thoune : 30 ans, salaire mensuel de 6 500 francs, sans enfant, 14 mois de cotisation donnent 70 %, au maximum 260 indemnités journalières et 10 jours d’attente.","facts":[["Délai","Inscription à l’ORP au plus tard le 1er jour de chômage, mieux encore pendant le délai de congé."],["Montant","70 % du gain assuré. 80 % en cas d’enfants de moins de 25 ans, de gain jusqu’à 3 797 francs ou de rente AI dès 40 %."],["Durée","Au moins 12 mois de cotisation en 2 ans. 260 indemnités journalières, davantage en cas de période de cotisation plus longue. Délai-cadre : 2 ans."],["Compétence","ORP (inscription, conseil) et la caisse de chômage que vous choisissez (versement)."]],"steps":["S’inscrire en ligne via l’e-service d’inscription au placement (ORP) dans Job-Room, ou en personne auprès de l’ORP de votre région.","Chercher un emploi déjà pendant le délai de congé et justifier chaque candidature. Votre ORP fixe le nombre exigé.","Choisir une caisse de chômage, déposer la « demande d’indemnité de chômage » et les attestations de l’employeur (2 ans).","Premier entretien à l’ORP (convocation dans les 15 jours) : apporter la carte AVS ou d’assuré, une pièce d’identité et la preuve de vos recherches d’emploi.","Chaque mois, remettre les « indications de la personne assurée ». Les indemnités journalières suivent en règle générale le mois suivant."],"who":[1,1,0],"note":"Le SECO surveille l’assurance-chômage ; les ORP, les caisses de chômage et les services cantonaux l’appliquent ; l’inscription se fait directement auprès de l’ORP.","src":["arbeit.swiss : inscription et enregistrement","arbeit.swiss (SECO) : FAQ sur l’indemnité de chômage","ch.ch : chômage en Suisse","Fedlex : LACI (RS 837.0), art. 9, 17, 18, 22, 27"]},"kk":{"intro":"Vous pouvez changer d’assurance de base pour la fin de l’année si votre résiliation parvient à la caisse au plus tard le lundi 30 novembre 2026. La nouvelle caisse doit vous accepter sans questions de santé. Les primes 2027 figurent déjà dans le comparateur de primes de priminfo.admin.ch.","facts":[["Délai","La résiliation doit parvenir à la caisse au plus tard le dernier jour ouvrable de novembre (2026 : lundi 30 novembre). Seule la réception compte, pas le cachet postal. Recommandé : l’envoyer en recommandé d’ici la mi-novembre."],["Franchise","Adultes : CHF 300 ou, au choix, 500, 1 000, 1 500, 2 000, 2 500, plus 10 % de quote-part, au maximum CHF 700 par an. Enfants : pas de franchise, quote-part de CHF 350 au maximum."],["Changer de franchise","Franchise plus basse : à communiquer par écrit au plus tard le dernier jour ouvrable de novembre. Franchise plus haute : seulement au début de l’année ; la loi ne fixe pas de délai, Priminfo recommande de l’annoncer d’ici la mi-décembre."],["En cours d’année","Changement au 1er juillet seulement avec la franchise ordinaire (CHF 300) et le libre choix du fournisseur de soins, résiliation d’ici le 31 mars. Avec un modèle à choix restreint (p. ex. médecin de famille ou télémédecine), changement possible seulement pour la fin de l’année."],["Attention","Primes ou participations aux coûts impayées et rappelées d’ici le 30 novembre : la résiliation ne prend effet que si vous les payez, intérêts moratoires et frais de poursuite compris, d’ici le 31 décembre (art. 64a LAMal)."],["Compétence","Votre caisse actuelle et la nouvelle caisse. La Confédération (OFSP) approuve les primes."]],"steps":["Comparer les primes 2027 sur priminfo.admin.ch : saisir lieu de domicile, âge, franchise et modèle (p. ex. médecin de famille ou télémédecine).","Choisir la nouvelle caisse et lui demander l’assurance de base. Toute caisse doit vous accepter, sans questions de santé, sans réserve ni délai d’attente.","Résilier l’assurance de base actuelle par écrit, de préférence en recommandé d’ici la mi-novembre.","Ne pas résilier trop vite l’assurance complémentaire : pour elle, la caisse peut poser des questions de santé et refuser. Le délai de résiliation figure dans les conditions d’assurance, souvent trois mois pour la fin de l’année. La caisse n’a pas le droit de la résilier parce que vous changez d’assurance de base.","Attendre la confirmation de la nouvelle caisse : l’ancienne assurance ne prend fin que lorsque la nouvelle a annoncé la couverture sans interruption. Si l’annonce arrive trop tard, la nouvelle caisse doit prendre en charge la différence de prime."],"who":[1,0,0],"note":"La loi (LAMal) et l’approbation des primes relèvent de la Confédération (OFSP). La résiliation et l’adhésion se font directement auprès des caisses-maladie, aucune autorité ne les reçoit.","src":["Priminfo (OFSP) : FAQ, changer de caisse-maladie","Priminfo (OFSP) : comparateur de primes 2027","Priminfo (OFSP) : primes 2027 par canton","Fedlex : LAMal (RS 832.10), art. 7 et 64a"]},"biz":{"intro":"Si vous vous mettez à votre compte à Berne avec une entreprise individuelle, vous vous annoncez d’abord comme indépendant(e) auprès de la caisse de compensation. L’inscription au registre du commerce et à la TVA n’est obligatoire qu’à partir de CHF 100 000 de chiffre d’affaires par an. Les démarches se font en ligne sur EasyGov.swiss, le portail de la Confédération.","facts":[["AVS","Annonce à la caisse de compensation du siège de l’entreprise (Berne : AK Bern). Cotisation de 10 % du revenu, moins en dessous de CHF 60 500 ; en 2026, au minimum CHF 530 par an."],["Registre du commerce","Obligatoire dès CHF 100 000 de chiffre d’affaires lors du dernier exercice, sinon facultatif. Émolument CHF 120. La raison de commerce doit contenir votre nom de famille."],["TVA","Obligatoire dès CHF 100 000 de chiffre d’affaires par an, ou dès que c’est prévisible au démarrage. Inscription auprès de l’AFC dans les 30 jours."],["Autorisation","Nécessaire seulement pour certaines activités réglementées. À vérifier avant de démarrer."]],"steps":["Ouvrir un compte sur EasyGov.swiss, choisir «entreprise individuelle» et fixer la raison de commerce avec votre nom de famille.","Vous annoncer comme indépendant(e) à l’AK Bern, si possible au premier trimestre : en ligne ou avec le formulaire 318.146, avec des justificatifs comme factures, compte de résultat ou publicité.","Dès CHF 100 000 de chiffre d’affaires annuel : inscription au registre du commerce de Berne (CHF 120) et annonce à l’AFC pour la TVA dans les 30 jours.","Avant de démarrer, vérifier si votre activité exige une autorisation."],"who":[1,1,0],"note":"La caisse de compensation et le registre du commerce relèvent du canton (à Berne : AK Bern et registre du commerce du canton de Berne), la TVA est perçue par la Confédération (AFC). EasyGov.swiss est le guichet en ligne de la Confédération pour les trois.","src":["Portail PME (SECO) : entreprise individuelle","Registre du commerce de Berne : notice sur l’inscription d’une entreprise individuelle","Caisse de compensation du canton de Berne : indépendants","ahv-iv.ch : mémento 2.02, cotisations des indépendants","AFC : assujettissement à la TVA","EasyGov.swiss : fonder une entreprise individuelle"]},"drv":{"intro":"Si vous habitez en Suisse, vous pouvez conduire avec un permis étranger pendant 12 mois seulement. Dans le canton de Berne, vous l’échangez auprès de l’Office de la circulation routière (OCRN). Un permis allemand, délivré dans l’UE, ne demande pas de course de contrôle ; l’échange coûte CHF 120.","facts":[["Délai","12 mois dès l’entrée selon l’autorisation de séjour (art. 42 OAC). Déposer la demande avant, pour pouvoir conduire sans interruption. L’échange reste possible plus tard, mais une amende peut tomber."],["Course de contrôle","Aucune pour les permis de l’UE/AELE ainsi que d’Andorre, d’Australie, d’Israël, du Japon, du Canada, de Corée du Sud, du Maroc, de Monaco, de Nouvelle-Zélande, de Saint-Marin, de Singapour, de Taïwan, de Tunisie et des États-Unis. Tous les autres passent une course de contrôle."],["Coûts","Berne : échange CHF 120, course de contrôle catégorie B CHF 132."],["Compétence","Office de la circulation routière et de la navigation du canton de Berne (OCRN), Schermenweg 5, Berne."]],"steps":["Faire un test de la vue chez un opticien ou un ophtalmologue reconnu.","Remplir et signer le formulaire de demande de l’OCRN, y coller une photo passeport récente en couleur (35 × 45 mm).","Remettre la demande en personne : à un site de l’OCRN, au contrôle des habitants de votre commune ou à un poste de police du canton de Berne. Apporter : permis étranger original et passeport ou carte d’identité.","Si nécessaire, passer la course de contrôle. Vous recevez le permis suisse par la poste."],"who":[1,1,0],"note":"La Confédération (OFROU) règle l’échange dans l’ordonnance réglant l’admission à la circulation routière ; l’office cantonal de la circulation (à Berne l’OCRN) examine la demande et délivre le permis.","src":["Canton de Berne (OCRN) : échange d’un permis étranger","Canton de Berne (OCRN) : émoluments","ch.ch : échanger son permis de conduire","OFROU : échange des permis étrangers"]},"wed":{"intro":"Si vous êtes tous deux Suisses et habitez à Zurich, vous réservez d’abord en ligne le lieu et la date auprès de l’office de l’état civil de la ville de Zurich, au plus tôt 12 mois à l’avance. La préparation du mariage se fait à deux au guichet du Stadthaus, au plus tard 1 mois avant le mariage.","facts":[["Conditions","Avoir tous deux au moins 18 ans et être capables de discernement. Les parents en ligne directe ainsi que les frères et sœurs, germains ou demi-frères et sœurs, ne peuvent pas se marier entre eux."],["Délai","Invitation à la préparation au plus tôt 3 mois avant le mariage. La terminer au plus tard 1 mois avant, sinon la réservation est annulée."],["Coûts","Zurich : mariage le moins cher au Stadthaus dès CHF 255, préparation sans traduction comprise (uniquement avec domicile en ville de Zurich)."],["Témoins","Deux témoins majeurs et capables de discernement doivent être présents."]],"steps":["Réserver le lieu et la date sur le site de l’office de l’état civil de Zurich, au plus tôt 12 mois à l’avance.","Au plus tôt 3 mois avant le mariage, vous recevez une invitation par e-mail. Vous choisissez alors en ligne un rendez-vous pour la préparation.","Vous présenter à deux au guichet du Stadthaus, avec passeport ou carte d’identité. Vous remplissez et signez le formulaire et fixez les noms que vous et, le cas échéant, vos enfants porterez.","Payer les émoluments sur place par carte ou Twint. Venir au mariage avec deux témoins."],"who":[1,0,1],"note":"La Confédération fixe les règles du mariage (CC) et les émoluments ; à Zurich, l’office de l’état civil de la ville mène la préparation et célèbre le mariage.","src":["Ville de Zurich : se marier avec domicile à Zurich","Ville de Zurich : préparation du mariage","Ville de Zurich : questions et réponses sur le mariage","ch.ch : se marier en Suisse"]},"dog":{"intro":"En ville de Berne, vous annoncez votre chien aux services aux habitants avec le formulaire d’annonce d’un chien. Si vous avez repris le chien, vous annoncez le changement de détenteur à la banque de données AMICUS dans les 10 jours. La taxe sur les chiens est de CHF 150 par an.","facts":[["Annonce","Aux services aux habitants de la ville de Berne (Einwohnerdienste), Predigergasse 5, 3011 Berne. La commune vous enregistre comme détenteur dans AMICUS."],["Délai","Changement de détenteur (achat, reprise, remise pour plus de 3 mois) à annoncer à AMICUS dans les 10 jours. Chiens importés : faire contrôler et annoncer la puce par un vétérinaire dans les 10 jours."],["Coûts","Ville de Berne : CHF 150 par chien et par an, pour les chiens dès 6 mois. La facture arrive automatiquement en août."],["Puce","Obligatoire pour chaque chien ; chiots dans les 3 mois. Seuls les vétérinaires posent la puce et annoncent le chien à AMICUS."]],"steps":["Remplir le formulaire de la ville de Berne pour l’annonce d’un chien et l’envoyer par la poste aux services aux habitants.","Si le chien a déjà une puce : annoncer le changement de détenteur à AMICUS dans les 10 jours. Sinon : le faire pucer chez un vétérinaire.","Payer la taxe sur les chiens à réception de la facture en août.","En cas de déménagement, de remise ou de décès du chien : informer la commune et AMICUS."],"who":[1,0,1],"note":"La Confédération impose la puce et l’enregistrement dans AMICUS (ordonnance sur les épizooties) ; la commune reçoit l’annonce et perçoit la taxe sur les chiens.","src":["Ville de Berne : chiens","Ville de Berne : formulaire d’annonce d’un chien","AMICUS : bon à savoir (notice)","ch.ch : impôt sur les chiens"]},"fam":{"intro":"Si vous êtes salarié(e) dans le canton de Berne, vous demandez les allocations familiales à votre employeur. Il transmet la demande à sa caisse d’allocations familiales. L’allocation pour enfant est de CHF 250 par mois et par enfant (état 2026).","facts":[["Montant","Canton de Berne, état 2026 : allocation pour enfant CHF 250 par mois jusqu’au mois des 16 ans. Allocation de formation CHF 310 pour les enfants en formation, au plus tôt dès 15 ans, au plus tard jusqu’à 25 ans."],["Demande","Salariés : auprès de l’employeur. Personnes sans activité lucrative : auprès de la caisse de compensation cantonale (AK Bern)."],["Délai","Pas de délai fixe ; des allocations oubliées peuvent être réclamées jusqu’à 5 ans en arrière."],["Par enfant","Une seule allocation par enfant, même si les deux parents travaillent."]],"steps":["Demander à l’employeur le formulaire de demande d’allocations familiales.","Remplir et signer le formulaire avec les données de l’enfant et de l’autre parent.","L’employeur transmet la demande à sa caisse d’allocations familiales et verse l’allocation.","Si les deux parents travaillent : convenir d’abord qui dépose la demande, car il n’y a qu’une allocation par enfant."],"who":[1,1,0],"note":"La Confédération fixe les montants minimaux (loi sur les allocations familiales), le canton de Berne verse 115 % de ces montants ; le versement passe par la cinquantaine de caisses d’allocations familiales du canton.","src":["Portail des familles du canton de Berne : allocations pour enfant et de formation","ch.ch : allocations familiales","ahv-iv.ch : mémento 6.08 allocations familiales","Caisse de compensation du canton de Berne : allocations familiales"]},"debt":{"intro":"Dans le canton de Berne, vous commandez l’extrait du registre des poursuites en ligne auprès de l’office cantonal des poursuites et des faillites (be.ch/baka). Il coûte CHF 18 envoi compris et arrive sous forme électronique à télécharger.","facts":[["Coûts","Canton de Berne en ligne : CHF 18 envoi compris (émolument CHF 17 par extrait)."],["Contenu","Les poursuites des 5 dernières années dans l’arrondissement concerné."],["Déménagement","Si vous avez habité ailleurs ces 5 dernières années, commandez aussi un extrait là-bas, sinon ces poursuites manquent."],["Envoi","Commande en ligne entièrement électronique : téléchargement sur une plateforme sécurisée, possible plusieurs fois."]],"steps":["Commander en ligne sur be.ch/baka l’extrait du registre des poursuites vous concernant.","Préparer une pièce d’identité valable : carte d’identité, passeport ou livret pour étrangers.","Payer l’émolument lors de la commande : carte, PostFinance Pay ou Twint.","Télécharger l’extrait sur la plateforme sécurisée et le transmettre, par exemple au bailleur."],"who":[1,1,0],"note":"La Confédération règle le droit des poursuites (LP) et les émoluments ; dans le canton de Berne, l’office cantonal des poursuites et des faillites (BAKA) tient les registres.","src":["Canton de Berne (BAKA) : commander un extrait des poursuites","ch.ch : commander un extrait du registre des poursuites","Canton de Berne : commande en ligne de l’extrait des poursuites (communiqué)"]},"crim":{"intro":"L’extrait du casier judiciaire (extrait destiné à des particuliers) se commande auprès de la Confédération, en ligne sur strafregister.admin.ch ou au guichet de la Poste. Il coûte CHF 17 et arrive par la poste environ 10 jours ouvrables après réception du formulaire signé.","facts":[["Coûts","CHF 17 pour l’extrait. Légalisation ou apostille : CHF 20 en plus."],["Durée","Environ 10 jours ouvrables après réception du formulaire signé."],["Commande","En ligne sur strafregister.admin.ch ou en personne à un guichet de la Poste avec une pièce d’identité valable."],["Extrait spécial","Pour les activités avec des mineurs, il existe un extrait distinct, l’extrait spécial destiné à des particuliers."]],"steps":["Sur strafregister.admin.ch, choisir l’extrait destiné à des particuliers et saisir données personnelles, adresse et paiement.","Payer l’émolument en ligne : carte de débit ou de crédit, PostFinance Card ou Twint.","Imprimer le formulaire, le signer et l’envoyer par la poste avec une copie de votre pièce d’identité.","Autre possibilité : commander au guichet de la Poste avec passeport, carte d’identité ou livret pour étrangers et payer sur place."],"who":[1,0,0],"note":"Le casier judiciaire est tenu par la Confédération (Office fédéral de la justice). La commande se fait directement auprès de la Confédération ou à un guichet de la Poste.","src":["Office fédéral de la justice : commander l’extrait","Office fédéral de la justice : FAQ extrait pour particuliers","ch.ch : extrait du casier judiciaire"]},"car":{"intro":"Dans le canton de Berne, vous immatriculez la voiture auprès de l’Office de la circulation routière (OCRN), par la poste ou au guichet. Votre assurance envoie d’abord l’attestation d’assurance par voie électronique à l’office. Le permis de circulation coûte CHF 45 par la poste ou CHF 55 au guichet.","facts":[["Documents","Attestation d’assurance (envoyée par l’assurance à l’office par voie électronique), permis de circulation du détenteur précédent, rapport d’expertise si la voiture a été contrôlée, pièce d’identité."],["Coûts","Permis de circulation : CHF 45 par la poste, CHF 55 au guichet. Nouvelles plaques : CHF 45 la paire, CHF 30 l’unité."],["Délai","L’attestation d’assuranc
