<style>
:root{
  --paper:#EEE9E0;
  --snow:#FBF9F5;
  --ink:#1A2531;
  --granit:#59636D;
  --red:#D8001A;
  --red-d:#B00015;
  --rule:rgba(26,37,49,.13);
  --inset:clamp(8px,1.1vw,16px);
  --pad:clamp(20px,4vw,64px);
  --r-xl:clamp(26px,3vw,44px);
  --r-lg:24px;
  --sh:0 1px 2px rgba(26,37,49,.05),0 28px 64px -28px rgba(26,37,49,.34);
  --sec:clamp(88px,12vw,200px);
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-io:cubic-bezier(.76,0,.24,1);
  --serif:"Gambetta","Iowan Old Style","Palatino Linotype",Georgia,serif;
  font-family:"Switzer","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
[hidden]{display:none!important}
html{background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%}
body{font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:clip;background:var(--paper)}
button,input{font:inherit;color:inherit}
a{color:inherit}
svg{display:block}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.skip{position:absolute;left:var(--pad);top:-80px;z-index:100;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;transition:top .2s}
.skip:focus{top:12px}

/* glass */
.glass{background:rgba(251,249,245,.66);-webkit-backdrop-filter:blur(20px) saturate(1.25);backdrop-filter:blur(20px) saturate(1.25);border:1px solid rgba(255,255,255,.6);box-shadow:0 10px 32px -14px rgba(26,37,49,.3)}

/* header */
.site-header{position:fixed;z-index:60;top:calc(var(--inset) + 10px);left:calc(var(--inset) + 12px);right:calc(var(--inset) + 12px);display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.site-header>*{pointer-events:auto}
.brand{display:inline-flex;align-items:center;gap:10px;padding:7px 18px 7px 8px;border-radius:999px;text-decoration:none;font-family:var(--serif);font-weight:500;font-size:1.5rem;line-height:1;letter-spacing:-.02em}
.brand svg{width:30px;height:30px}
.notice{padding:9px 16px;border-radius:999px;font-size:.8125rem;line-height:1.2;color:var(--granit);text-align:center;transition:opacity .4s var(--ease),transform .4s var(--ease)}
.site-header.past .notice{opacity:0;pointer-events:none}
.head-r{display:flex;align-items:center;gap:8px;padding:5px;border-radius:999px}
.lang{display:flex;gap:2px}
.lang button{border:0;background:transparent;border-radius:999px;padding:8px 12px;font-size:.8125rem;font-weight:500;color:var(--granit);cursor:pointer;transition:background .3s,color .3s}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn.head-ask{visibility:hidden;padding:.65em 0;font-size:.875rem;opacity:0;transform:scale(.9);pointer-events:none;width:0;padding-inline:0;margin:0 -4px 0 0;overflow:hidden;transition:opacity .4s var(--ease),transform .4s var(--ease),width .45s var(--ease),padding .45s var(--ease)}
.btn.head-ask.show{visibility:visible;opacity:1;transform:none;pointer-events:auto;width:auto;padding-inline:1.1em}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.6em;padding:.95em 1.5em;background:var(--ink);color:var(--paper);border:0;border-radius:999px;font-weight:500;font-size:.9375rem;line-height:1.1;cursor:pointer;overflow:hidden;isolation:isolate;text-decoration:none;white-space:nowrap;transition:transform .3s var(--ease),color .3s}
.btn::before{content:"";position:absolute;inset:0;background:var(--red);border-radius:inherit;transform:scale(0);transform-origin:var(--ox,50%) var(--oy,50%);transition:transform .6s var(--ease);z-index:-1}
.btn:hover::before,.btn:focus-visible::before{transform:scale(1.6)}
.btn:active{transform:scale(.96)}
.btn[disabled]{cursor:default;opacity:.7}
.btn[disabled]::before{transform:scale(0)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(26,37,49,.2)}
.btn.ghost:hover,.btn.ghost:focus-visible{color:#fff;box-shadow:none}


.ask{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;background:#fff;border:1px solid rgba(26,37,49,.1);border-radius:999px;padding:6px;box-shadow:0 2px 0 rgba(26,37,49,.02),0 14px 30px -18px rgba(26,37,49,.3);transition:box-shadow .4s,border-color .3s}
.ask:focus-within{border-color:rgba(26,37,49,.45);box-shadow:0 0 0 5px rgba(216,0,26,.14),0 14px 30px -18px rgba(26,37,49,.3)}
.ask.nudge{animation:nudge .45s var(--ease)}
@keyframes nudge{20%{transform:translateX(-6px)}50%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
.ask-field{position:relative;min-width:0}
.ask input{width:100%;height:58px;border:0;background:transparent;padding:0 clamp(16px,1.8vw,26px);font-size:clamp(1rem,1.35vw,1.2rem);letter-spacing:-.01em;outline:none}
.ph{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ph span{position:absolute;left:clamp(16px,1.8vw,26px);right:8px;top:50%;margin-top:-.7em;font-size:clamp(1rem,1.35vw,1.2rem);letter-spacing:-.01em;color:var(--granit);white-space:nowrap;text-overflow:ellipsis;overflow:hidden;transform:translateY(60%);opacity:0;transition:transform .7s var(--ease),opacity .5s}
.ph span.on{transform:none;opacity:1}
.ph span.off{transform:translateY(-160%);opacity:0}
.ask.has-value .ph{opacity:0}
.send{width:58px;height:58px;border-radius:50%;background:var(--red);color:#fff;border:0;cursor:pointer;display:grid;place-items:center;overflow:hidden;transition:background .3s,transform .3s var(--ease)}
.send svg{width:24px;height:24px;transition:transform .45s var(--ease)}
.send:hover,.send:focus-visible{background:var(--red-d)}
.send:hover svg{transform:translateX(4px)}
.send:active{transform:scale(.92)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:rgba(255,255,255,.7);border:1px solid rgba(26,37,49,.1);border-radius:999px;padding:.62em 1.05em;font-size:.9rem;cursor:pointer;transition:background .3s,color .3s,border-color .3s,transform .3s var(--ease)}
.chip:hover,.chip:focus-visible{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:active{transform:scale(.96)}

/* answer */
.answer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .9s var(--ease)}
.answer.open{grid-template-rows:1fr}
.answer-in{overflow:hidden;min-height:0}
.a-body{padding:34px clamp(6px,.8vw,12px) 6px}
.a-q{font-size:.9375rem;color:var(--granit);margin-bottom:16px}
.think{display:flex;align-items:center;gap:14px;color:var(--granit);font-size:.9375rem}
.think svg{width:28px;height:28px}
.think rect{fill:var(--red);transform-box:fill-box;transform-origin:center}
.think .v{animation:growv 1.1s var(--ease-io) infinite alternate}
.think .h{animation:growh 1.1s var(--ease-io) .25s infinite alternate}
@keyframes growv{from{transform:scaleY(.1)}to{transform:scaleY(1)}}
@keyframes growh{from{transform:scaleX(.1)}to{transform:scaleX(1)}}
.a-text{font-family:var(--serif);font-size:clamp(1.15rem,1.6vw,1.45rem);line-height:1.32;letter-spacing:-.012em;max-width:34em}
.sw{opacity:0;transition:opacity .35s}
.sw.in{opacity:1}
.a-glance{margin-top:24px}
.a-glance .who-lbl{margin-bottom:6px}
.a-facts{margin:0;padding:0}
.a-facts>div{display:grid;grid-template-columns:minmax(5.6rem,7.6rem) 1fr;column-gap:clamp(12px,2vw,20px);padding:11px 0;border-top:1px solid var(--rule);opacity:0;transform:translateY(8px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.a-facts>div:last-child{border-bottom:1px solid var(--rule)}
.a-facts>div.in{opacity:1;transform:none}
.a-facts dt{font-size:.8125rem;font-weight:500;letter-spacing:.01em;color:var(--granit);padding-top:.16em}
.a-facts dd{margin:0;font-size:.9375rem;line-height:1.4;min-width:0;overflow-wrap:anywhere}
@media (max-width:560px){.a-facts>div{grid-template-columns:1fr;row-gap:2px;padding:10px 0}.a-facts dt{padding-top:0}}
.a-steps{list-style:none;padding:0;margin-top:26px;counter-reset:s}
.a-glance+.a-steps{margin-top:22px}
.a-steps li{display:grid;grid-template-columns:44px 1fr;padding:15px 0;border-top:1px solid var(--rule);opacity:0;transform:translateY(8px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.a-steps li:last-child{border-bottom:1px solid var(--rule)}
.a-steps li::before{counter-increment:s;content:counter(s);color:var(--red);font-weight:500;font-feature-settings:"tnum"}
.a-steps li.in{opacity:1;transform:none}
.a-who{margin-top:28px}
.who-lbl{font-size:.9375rem;color:var(--granit);margin-bottom:10px}
.who-row{list-style:none;display:flex;flex-wrap:wrap;gap:8px;padding:0}
.who-row li{display:inline-flex;align-items:center;gap:10px;padding:.65em 1.1em;border-radius:999px;font-weight:500;font-size:.9375rem;box-shadow:inset 0 0 0 1px rgba(26,37,49,.14);color:var(--granit);transition:background .6s var(--ease),color .6s var(--ease),box-shadow .6s}
.who-row li::before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(26,37,49,.2);transition:background .6s}
.who-row li.on{background:var(--ink);color:var(--paper);box-shadow:none}
.who-row li.on::before{background:var(--red)}
.who-note{margin-top:12px;font-size:.9375rem;color:var(--granit)}
.a-src{margin-top:26px}
.a-src ul{list-style:none;padding:0}
.a-src li a{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--rule);text-decoration:none;font-size:.9375rem;transition:padding .35s var(--ease),color .25s}
.a-src li:last-child a{border-bottom:1px solid var(--rule)}
.a-src li a:hover{padding-left:8px;color:var(--red)}
.a-src li a svg{width:16px;height:16px;flex:none;margin-top:3px;color:var(--granit);transition:color .25s}
.a-src li a:hover svg{color:var(--red)}
.a-src li a span{min-width:0;overflow-wrap:anywhere}
.a-stand{margin-top:12px;font-size:.8125rem;line-height:1.45;color:var(--granit)}
.a-src,.a-who,#newQ{opacity:0;transition:opacity .7s var(--ease)}
.a-src.in,.a-who.in,#newQ.in{opacity:1}
#newQ{margin-top:26px}



/* ============ Frag Tell ============ */
body{background:var(--paper)}
main{outline:none}
:root{--hh:84px}
.fq-home{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:calc(var(--inset) + clamp(96px,17svh,170px)) var(--pad) 0;overflow:clip}
.fq-greet{font-family:var(--serif);font-weight:400;font-size:clamp(2.5rem,6.6vw,5.8rem);line-height:1;letter-spacing:-.035em;text-align:center;text-wrap:balance;animation:fqUp .9s var(--ease) both}
.fq-sub{margin-top:clamp(12px,1.4vw,20px);color:var(--granit);font-size:clamp(1.05rem,1.6vw,1.35rem);line-height:1.35;text-align:center;max-width:32em;text-wrap:balance;animation:fqUp .9s .12s var(--ease) both}
.fq-card{margin-top:clamp(26px,4vw,48px);width:min(100%,720px);padding:clamp(16px,2vw,26px);border-radius:var(--r-xl);background:rgba(251,249,245,.82);-webkit-backdrop-filter:blur(26px) saturate(1.2);backdrop-filter:blur(26px) saturate(1.2);border:1px solid rgba(255,255,255,.7);box-shadow:var(--sh);animation:fqUp .9s .24s var(--ease) both;position:relative;z-index:2}
.fq-home.answering .fq-card{background:rgba(251,249,245,.96)}
.fq-card .chips{justify-content:center}
.chip.more{border-style:dashed;background:transparent}
.fq-note{margin-top:16px;max-width:36em;text-align:center;font-size:.8125rem;line-height:1.45;color:var(--granit);position:relative;z-index:2}
.fq-sky{margin-top:auto;padding-top:clamp(28px,5vw,64px);width:100%;display:flex;justify-content:center;pointer-events:none;transition:opacity .6s var(--ease)}
.fq-sky img{display:block;width:auto;max-width:min(980px,100%);height:auto;max-height:min(44svh,500px);object-fit:contain;filter:drop-shadow(0 14px 22px rgba(26,37,49,.2));margin-bottom:-2px}
.fq-home.answering .fq-sky{opacity:.18}
@keyframes fqUp{from{opacity:0;transform:translateY(14px)}}

.fq-view{margin:calc(var(--inset) + var(--hh)) var(--inset) var(--inset)}
.fq-sheet{border-radius:var(--r-xl);background:var(--snow);padding:clamp(40px,6vw,96px) var(--pad) clamp(48px,7vw,110px);min-height:60svh}
.fq-in{max-width:68rem;margin-inline:auto}
.fq-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.8125rem;font-weight:500;color:var(--granit);margin-bottom:18px}
.fq-eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}
.fq-h{font-family:var(--serif);font-weight:400;font-size:clamp(2.3rem,5.2vw,4.6rem);line-height:1.04;letter-spacing:-.03em;text-wrap:balance;outline:none}
.fq-lead{margin-top:20px;max-width:40em;font-size:clamp(1.0625rem,1.5vw,1.25rem);line-height:1.5;color:var(--granit)}
.fq-b{margin-top:clamp(36px,5vw,68px)}
.fq-b>h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.55rem,2.5vw,2.2rem);line-height:1.1;letter-spacing:-.02em}
.fq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;margin-top:22px}
.fq-tile{display:flex;flex-direction:column;gap:10px;padding:clamp(18px,2vw,26px);border-radius:var(--r-lg);background:var(--paper)}
.fq-tile h3{font-family:var(--serif);font-weight:500;font-size:1.35rem;line-height:1.12;letter-spacing:-.015em}
.fq-tile p{color:var(--granit);font-size:.9375rem;line-height:1.45}
.fq-tile .fq-meta{font-size:.8125rem;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.fq-tile .fq-meta::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);flex:none}
.fq-tile .btn{margin-top:auto;align-self:flex-start;font-size:.875rem;padding:.8em 1.25em}
.fq-tile .fq-gap{flex:1}
.fq-list{list-style:none;padding:0;margin-top:18px}
.fq-list li{padding:14px 0 14px 26px;border-top:1px solid var(--rule);position:relative;line-height:1.5;max-width:52em}
.fq-list li:last-child{border-bottom:1px solid var(--rule)}
.fq-list li::before{content:"";position:absolute;left:4px;top:1.15em;width:8px;height:8px;border-radius:50%;background:rgba(26,37,49,.22)}
.fq-note2{margin-top:12px;font-size:.875rem;color:var(--granit)}
.fq-day{display:grid;grid-template-columns:minmax(8.5rem,14rem) 1fr;gap:12px clamp(16px,3vw,40px);padding:clamp(22px,3vw,34px) 0;border-top:1px solid var(--rule)}
.fq-day:last-child{border-bottom:1px solid var(--rule)}
.fq-day time{font-family:var(--serif);font-size:clamp(1.25rem,1.9vw,1.7rem);letter-spacing:-.015em;line-height:1.15}
.fq-day h3{font-size:.8125rem;font-weight:500;color:var(--granit);letter-spacing:.01em;margin:0 0 6px}
.fq-day h3:not(:first-child){margin-top:18px}
.fq-day ul{list-style:none;padding:0}
.fq-day li{padding:3px 0;max-width:46em;line-height:1.5}
.fq-ph{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin-top:22px;counter-reset:ph}
.fq-ph article{padding:clamp(18px,2vw,26px);border-radius:var(--r-lg);background:var(--paper);display:flex;flex-direction:column;gap:8px}
.fq-ph .n{font-family:var(--serif);font-size:2.2rem;line-height:1;color:var(--red);letter-spacing:-.03em}
.fq-ph h3{font-family:var(--serif);font-weight:500;font-size:1.35rem;line-height:1.12;letter-spacing:-.015em}
.fq-ph .e{font-size:.8125rem;font-weight:500;color:var(--granit)}
.fq-ph p{font-size:.9375rem;line-height:1.45;color:var(--ink)}
.fq-links{list-style:none;padding:0;margin-top:18px}
.fq-links li a{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--rule);text-decoration:none;transition:padding .35s var(--ease),color .25s}
.fq-links li:last-child a{border-bottom:1px solid var(--rule)}
.fq-links li a:hover,.fq-links li a:focus-visible{padding-left:8px;color:var(--red)}
.fq-links li a svg{width:18px;height:18px;flex:none;margin-top:3px}
.hnav a[aria-current="page"]{background:rgba(26,37,49,.08);color:var(--ink)}
.tfoot#tfoot{padding-bottom:clamp(28px,4vw,48px)}
.tfoot-links+.tfoot-links{margin-top:2px}
.tfoot-h{margin-top:14px;font-size:.8125rem;color:rgba(238,233,224,.6)}
.tfoot a[aria-current="page"]{text-decoration:underline;text-underline-offset:4px}
.tfoot-credit{margin-top:10px;max-width:64em;font-size:.8125rem;color:rgba(238,233,224,.5);overflow-wrap:anywhere}

/* responsive (aus index.html übernommen) */
@media (max-width:900px){
  .notice{order:3;flex:1 0 100%;max-width:none;padding:7px 12px;font-size:.75rem}
  .site-header{flex-wrap:wrap;row-gap:8px}
  :root{--hh:112px}
  .fq-home{padding-top:calc(var(--inset) + 128px)}
}
@media (max-width:700px){
  .brand{font-size:1.3rem}
  .head-r{padding:4px}
  .lang button{padding:7px 9px}
  .ask input{height:52px}
  .send{width:52px;height:52px}
  .fq-day{grid-template-columns:1fr}

llt und bekomme im Frühling ein Kind. Wie viel Mutterschaftsentschädigung erhalte ich und wie beantrage ich sie?"},{"l":"Vaterschaftsurlaub","q":"Ich bin angestellt und werde im Frühling Vater. Wie lange ist der Vaterschaftsurlaub und wie bekomme ich die Entschädigung?"},{"l":"Lernfahrausweis","q":"Ich bin 17, wohne in Bern und will Auto fahren lernen. Wie bekomme ich den Lernfahrausweis?"},{"l":"Wohnsitzbestätigung","q":"Ich wohne in der Stadt Bern und brauche eine Wohnsitzbestätigung. Wo bekomme ich sie und was kostet sie?"},{"l":"Todesfall melden","q":"Meine Mutter ist zu Hause in der Stadt Bern gestorben. Was muss ich jetzt tun und wo melde ich den Todesfall?"},{"l":"Anwohnerparkkarte","q":"Ich wohne in der Stadt Bern und habe ein Auto. Wie bekomme ich eine Anwohnerparkkarte und was kostet sie?"},{"l":"Sperrgut entsorgen","q":"Ich wohne in der Stadt Bern und will ein altes Sofa loswerden. Wie entsorge ich Sperrgut und was kostet das?"},{"l":"Fundbüro","q":"Ich habe in der Stadt Bern mein Portemonnaie verloren. Wie melde ich das beim Fundbüro?"},{"l":"Betreibung einleiten","q":"Ein Kunde in Bern zahlt meine Rechnung über CHF 2'000 nicht. Wie leite ich eine Betreibung ein?"},{"l":"Auto abmelden","q":"Ich wohne im Kanton Bern und verkaufe mein Auto. Wie melde ich es ab und was passiert mit den Nummernschildern?"},{"l":"Wochenaufenthalt","q":"Ich arbeite neu in der Stadt Bern und gehe am Wochenende nach Hause ins Wallis. Wie melde ich mich als Wochenaufenthalter an?"},{"l":"Kirchenaustritt","q":"Ich wohne in Bern und will aus der Kirche austreten. Wie geht das und ab wann zahle ich keine Kirchensteuer mehr?"},{"l":"Velo gestohlen","q":"Mir wurde in Bern das Velo gestohlen. Wie melde ich den Diebstahl bei der Polizei?"},{"l":"Vorsorgeauftrag","q":"Ich wohne in Bern und will einen Vorsorgeauftrag machen. Wie muss er aussehen und wo hinterlege ich ihn?"},{"l":"Ausweis verlängern","q":"Ich wohne in der Stadt Bern und mein B-Ausweis läuft bald ab. Wie verlängere ich ihn?"},{"l":"Name nach Scheidung","q":"Ich bin geschieden, wohne in Bern und will wieder meinen ledigen Namen tragen. Wie geht das?"}],"think":"Tell prüft offizielle Quellen","who":"Zuständig","bund":"Bund","kanton":"Kanton","gemeinde":"Gemeinde","src":"Quellen","glance":"Auf einen Blick","stand":"Stand: Oktober 2026 · Beispielhafte Antwort aus öffentlichen Quellen, ohne Gewähr. Massgebend sind die Stellen.","newtab":"öffnet in neuem Tab","newq":"Neue Frage","fb":{"intro":"Dazu hat der Prototyp noch keine Antwort. Die echte Version würde hier offizielle Quellen von Bund, Kantonen und Gemeinden durchsuchen. 23 Beispiele beantwortet er schon: Umzug, Pass und ID, Steuererklärung, AHV-Rente, Arbeitslosigkeit, Krankenkasse wechseln, Einzelfirma gründen ausländischen Führerausweis umtauschen, Heiraten, Hund anmelden, Familienzulagen, Betreibungs- und Strafregisterauszug, Auto einlösen, Einbürgerung, Prämienverbilligung, Wehrpflichtersatz, Gartenhaus bauen, Ausweis verloren, Kita-Gutscheine, Sozialhilfe, Ergänzungsleistungen und IV-Anmeldung. Probieren Sie eines davon."},"ans":{"move":{"intro":"Sie melden sich innert 14 Tagen am neuen Wohnort an. Von Bern nach Winterthur geht das online über eUmzugCH: Beide Gemeinden sind angeschlossen, ein Gang an den Schalter ist nicht nötig.","facts":[["Frist","14 Tage ab Adressänderung (Art. 11 RHG)"],["Kosten","Winterthur: CHF 40 pro erwachsene Person; eUmzugCH kostet nicht mehr als der Schalter"],["Schalter","Nicht nötig, alles läuft online"],["Zuständig","Einwohnerdienste Bern (Abmeldung), Einwohnerkontrolle Winterthur (Anmeldung)"]],"steps":["Auf eumzug.swiss alte Adresse (Bern) und neue Adresse (Winterthur) eingeben und «Prüfen» klicken.","Bereithalten: Pass oder ID, AHV-Nummer (13-stellig), Mietvertrag oder Einzugsbestätigung, Karte oder Twint für CHF 40.","Krankenkassenkarte oder Police bereithalten: Winterthur verlangt diesen Nachweis bei der Anmeldung.","Abmeldung in Bern und Anmeldung in Winterthur online abschliessen; ein Schalterbesuch in Bern ist nicht nötig.","Steueramt: Winterthur erhält die neue Adresse automatisch; steuerpflichtig sind Sie dort ab 1. Januar des Zuzugsjahres."],"who":[1,1,1],"note":"Die Gemeinden (Bern, Winterthur) nehmen Ab- und Anmeldung entgegen, eUmzugCH ist der gemeinsame Dienst von Bund, Kantonen und Gemeinden, die Steuern erhebt der Kanton Zürich mit der Stadt Winterthur.","src":["eUmzugCH – Umzug online melden (Bund, Kantone, Gemeinden)","Stadt Winterthur – Umzug & Neu in Winterthur","Stadt Bern – Zuzug, Umzug und Wegzug","Stadt Winterthur – Steuern bei Umzug, Zuzug und Wegzug"]},"passport":{"intro":"Als Erwachsene mit Wohnsitz in Bern beantragen Sie Pass und/oder ID online auf schweizerpass.ch und gehen dann zum gebuchten Termin, z. B. ins Ausweiszentrum Bern (Laupenstrasse 18A). Die Kombi Pass + ID kostet CHF 158 und ist 10 Jahre gültig.","facts":[["Kosten","Erwachsene: ID CHF 70, Pass CHF 145, Kombi CHF 158. Kinder bis 18: ID 35, Pass 65, Kombi 78 (inkl. Porto)."],["Gültigkeit","Erwachsene 10 Jahre, Kinder und Jugendliche bis 18 Jahre: 5 Jahre. Verlängern ist nicht möglich, Sie bestellen neu."],["Dauer","Lieferung max. 10 Arbeitstage nach dem Termin, per Einschreiben."],["Termin","Pflicht und persönliches Erscheinen nötig (Foto, bei Pass Fingerabdrücke)."],["Neu ab November","Ab 2. November 2026 gibt es zusätzlich die biometrische ID mit Chip (Gesichtsbild und zwei Fingerabdrücke). Bezug freiwillig, Gebühr gleich wie heute. Der provisorische Pass heisst dann «Notpass»."]],"steps":["Online-Antrag auf schweizerpass.ch ausfüllen (persönliche E-Mail nötig). Nach der Prüfung erhalten Sie eine E-Mail zur Terminwahl.","Termin in einem der 7 Berner Ausweiszentren buchen (Pflicht): online oder per Tel. 031 635 40 00, Mo-Fr.","Alten Ausweis mitbringen, aber kein Passfoto: Das Foto wird vor Ort aufgenommen.","Gebühr vor Ort zahlen (Karte, Twint oder bar). Kinder kommen mit sorgeberechtigter Person und deren Ausweis.","Ausweis kommt innert 10 Arbeitstagen per Einschreiben an die angegebene Adresse."],"who":[1,1,0],"note":"Der Bund (fedpol) publiziert Preise, Gültigkeit und Lieferfristen; im Kanton Bern erfassen die sieben kantonalen Ausweiszentren Ihre Daten.","src":["fedpol: Preise, Gültigkeit und Lieferfristen","Kanton Bern: Ausweise, Preise und Gültigkeit","Kanton Bern: Ausweiszentren und Termin","Kanton Bern: Termin wahrnehmen, Unterlagen","Bundesrat: biometrische ID ab 2.11.2026 (Medienmitteilung 26.8.2026)"]},"tax":{"intro":"Im Kanton Bern ist die Steuererklärung grundsätzlich bis 15. März fällig; online verlängern Sie bis 15. Juli gratis, höchstens bis 15. November. Für die Steuerperiode 2025 gilt wegen eines IT-Unterbruchs ausnahmsweise der 30. November 2026 als letzte Frist.","facts":[["Frist","Bern: 15. März (Selbstständige: 15. Mai). Zürich und Genf: 31. März."],["Kosten","Bern online: bis 15. Juli gratis, bis 15. Sept. CHF 20, bis 15. Nov. CHF 40. Schriftlich/Telefon: CHF 20/40/60. Genf: CHF 20/40/60."],["Dauer","Bern: höchstens bis 15. Nov.; 2025er-Erklärung ausnahmsweise bis 30. Nov. 2026 (IT-Unterbruch)."],["Zuständig","Bern: kantonale Steuerverwaltung. Zürich: Gemeindesteueramt. Genf: Administration fiscale cantonale."]],"steps":["Brief zur Steuererklärung, Lohnausweis (vom Arbeitgeber) und Belege bereitlegen.","Vor Fristablauf in BE-Login (mit AGOV) «Fristverlängerung erfassen», neue Frist wählen und bestätigen.","Bestätigung selbst speichern: Es kommt keine per Post oder E-Mail.","Steuererklärung in TaxMe-Online ausfüllen und mit Belegen einreichen (oder ausgedruckt bei der Wohnsitzgemeinde abgeben).","Zu spät? Es droht eine Mahngebühr von CHF 60; nach abgelaufener Mahnfrist ist keine Verlängerung mehr möglich."],"who":[1,1,1],"note":"Die kantonale Steuerverwaltung nimmt Ihre Erklärung entgegen und veranlagt auch die direkte Bundessteuer im Auftrag des Bundes (ESTV beaufsichtigt), die Gemeinde legt ihren Steuerfuss fest.","src":["Kanton Bern: Frist als Privatperson verlängern","Kanton Bern: Wegleitung, Einreichefrist","Kanton Zürich: Steuererklärung Privatpersonen","Canton de Genève: Demander un délai"]},"ahv":{"intro":"Ein Mann, Jahrgang 1962, in Thun erreicht 2027 mit 65 das Referenzalter und meldet seine Rente 3–4 Monate vorher bei der Ausgleichskasse an. Bei Geburtstag am 15. März 2027 beginnt die Rente am 1. April 2027; die Anmeldung erfolgt ab ca. Dezember 2026.","facts":[["Referenzalter","Männer 65. Frauen: Jg. 1961 = 64 J. 3 Mt., Jg. 1962 = 64 J. 6 Mt., Jg. 1963 = 64 J. 9 Mt., ab Jg. 1964 = 65. Rente ab Folgemonat."],["Frist","Anmeldung 3–4 Monate vor Rentenbeginn. Vorbezug ab 63 (–6.8 % bei 1 Jahr), Aufschub 1–5 Jahre (+5.2 % bis +31.5 %)."],["Rente","Ab 2027 bei voller Beitragsdauer CHF 1’280 bis 2’560 pro Monat; Ehepaar höchstens CHF 3’840. Dazu 13. Rente ab Dezember 2026."],["Zuständig","Ausgleichskasse, bei der Ihr Arbeitgeber angeschlossen ist (im Kanton Bern z. B. die AK Bern)."]],"steps":["Zuständige Ausgleichskasse klären: Angestellte fragen den Arbeitgeber, Selbstständige die zuletzt abrechnende Kasse.","Formular 318.370 «Anmeldung für eine Altersrente» 3–4 Monate vor Rentenbeginn online ausfüllen und einreichen.","Vorbezug: spätestens bis Ende des Vormonats beantragen. Aufschub: spätestens 1 Jahr nach Referenzalter im Formular ankreuzen.","Beilagen mit dem Formular hochladen oder per Post senden; die Ausgleichskasse beschafft nötige Unterlagen und berechnet die Rente.","Auszahlung monatlich (AK Bern: 4. Arbeitstag, z. B. 4. Dezember 2026); die 13. Rente im Dezember kommt ohne Antrag."],"who":[1,1,0],"note":"Der Bund (BSV) gibt Regeln und Merkblätter vor; die Ausgleichskasse (im Kanton Bern die AK Bern) nimmt Ihre Anmeldung entgegen, berechnet und zahlt die Rente aus.","src":["Ausgleichskasse Kanton Bern: Altersrente der AHV","ahv-iv.ch: Merkblatt 3.01 Altersrenten (Stand 1.1.2026)","ch.ch: Pensionierung – ab wann?","BSV: Stabilisierung der AHV (AHV 21)","Bundesrat: AHV/IV-Renten steigen per 1.1.2027 (2.10.2026)"]},"alv":{"intro":"Melden Sie sich spätestens am ersten Tag, für den Sie Arbeitslosenentschädigung wollen, beim RAV Ihrer Region an, am schnellsten online im Job-Room. Beispiel Thun: 30-jährig, 6’500 Franken Monatslohn, keine Kinder, 14 Monate Beitragszeit ergibt 70 %, höchstens 260 Taggelder und 10 Wartetage.","facts":[["Frist","Anmeldung beim RAV spätestens am 1. Tag der Arbeitslosigkeit, besser schon während der Kündigungsfrist."],["Höhe","70 % des versicherten Verdienstes. 80 % bei Kindern unter 25, Verdienst bis 3’797 Franken oder IV-Rente ab 40 %."],["Dauer","Mind. 12 Monate Beitragszeit in 2 Jahren. 260 Taggelder, bei längerer Beitragszeit mehr. Rahmenfrist: 2 Jahre."],["Zuständig","RAV (Anmeldung, Beratung) und die von Ihnen gewählte Arbeitslosenkasse (Auszahlung)."]],"steps":["Online anmelden: eService «Anmeldung zur Arbeitsvermittlung (RAV)» im Job-Room, oder persönlich beim RAV Ihrer Region.","Schon in der Kündigungsfrist Stellen suchen und jede Bewerbung belegen. Wie viele, legt Ihr RAV fest.","Arbeitslosenkasse wählen, «Antrag auf Arbeitslosenentschädigung» und Arbeitgeberbescheinigungen (2 Jahre) einreichen.","Erstgespräch beim RAV (Einladung innert 15 Tagen): AHV- oder Krankenkassenkarte, ID und Nachweis der Bemühungen mitbringen.","Jeden Monat «Angaben der versicherten Person» einreichen. Die Taggelder folgen in der Regel im Folgemonat."],"who":[1,1,0],"note":"Das SECO beaufsichtigt die Arbeitslosenversicherung, RAV, Arbeitslosenkassen und kantonale Amtsstellen vollziehen sie; angemeldet wird direkt beim RAV.","src":["arbeit.swiss: Anmeldung und Registrierung","arbeit.swiss (SECO): FAQ zur Arbeitslosenentschädigung","ch.ch: Arbeitslosigkeit in der Schweiz","Fedlex: AVIG (SR 837.0), Art. 9, 17, 18, 22, 27"]},"kk":{"intro":"Sie können die Grundversicherung auf Ende Jahr wechseln, wenn Ihre Kündigung bis Montag, 30. November 2026 bei der Krankenkasse eingeht. Die neue Kasse muss Sie ohne Gesundheitsfragen aufnehmen. Die Prämien 2027 stehen schon im Prämienrechner von priminfo.admin.ch.","facts":[["Frist","Kündigung bis spätestens am letzten Arbeitstag im November (2026: Montag, 30. November) bei der Kasse. Es zählt der Eingang, nicht der Poststempel. Empfohlen: eingeschrieben bis Mitte November."],["Franchise","Erwachsene: CHF 300 oder wählbar 500, 1’000, 1’500, 2’000, 2’500, dazu 10 % Selbstbehalt, höchstens CHF 700 im Jahr. Kinder: keine Franchise, Selbstbehalt höchstens CHF 350."],["Franchise ändern","Tiefere Franchise: schriftlich bis zum letzten Arbeitstag im November. Höhere Franchise: nur auf Jahresbeginn; das Gesetz nennt keine Frist, Priminfo empfiehlt, sie bis Mitte Dezember mitzuteilen."],["Mitte Jahr","Wechsel per 1. Juli nur mit ordentlicher Franchise (CHF 300) und freier Arztwahl, Kündigung bis 31. März. Mit eingeschränkter Arztwahl (z. B. Hausarzt- oder Telmed-Modell) geht es nur auf Jahresende."],["Achtung","Offene Prämien oder Kostenbeteiligungen, die bis 30. November gemahnt werden: Die Kündigung wirkt nur, wenn Sie sie samt Verzugszinsen und Betreibungskosten bis 31. Dezember bezahlen (Art. 64a KVG)."],["Zuständig","Ihre bisherige und die neue Krankenkasse. Der Bund (BAG) genehmigt die Prämien."]],"steps":["Prämien 2027 auf priminfo.admin.ch vergleichen: Wohnort, Alter, Franchise und Modell (z. B. Hausarzt oder Telmed) eingeben.","Neue Kasse wählen und dort die Grundversicherung beantragen. Jede Kasse muss Sie aufnehmen, ohne Gesundheitsfragen, Vorbehalte oder Wartefrist.","Bisherige Grundversicherung schriftlich kündigen, am besten eingeschrieben bis Mitte November.","Die Zusatzversicherung nicht vorschnell kündigen: Dort darf die Kasse Gesundheitsfragen stellen und ablehnen. Die Kündigungsfrist steht in den Versicherungsbedingungen, oft drei Monate auf Ende Jahr. Die Kasse darf sie nicht kündigen, weil Sie die Grundversicherung wechseln.","Bestätigung der neuen Kasse abwarten: Die alte Versicherung endet erst, wenn die neue Kasse die lückenlose Deckung gemeldet hat. Kommt die Meldung zu spät, muss die neue Kasse die Prämiendifferenz übernehmen."],"who":[1,0,0],"note":"Das Gesetz (KVG) und die Genehmigung der Prämien liegen beim Bund (BAG). Kündigung und Beitritt laufen direkt über die Krankenkassen, keine Behörde nimmt sie entgegen.","src":["Priminfo (BAG): FAQ, Wechsel der Krankenkasse","Priminfo (BAG): Prämienrechner 2027","Priminfo (BAG): Prämien 2027 nach Kanton","Fedlex: KVG (SR 832.10), Art. 7 und 64a"]},"biz":{"intro":"Wer sich in Bern mit einer Einzelfirma selbstständig macht, meldet sich zuerst bei der Ausgleichskasse als selbstständigerwerbend an. Ins Handelsregister und zur Mehrwertsteuer müssen Sie erst ab CHF 100’000 Umsatz im Jahr. Die Anmeldungen gehen online über EasyGov.swiss, das Portal des Bundes.","facts":[["AHV","Anmeldung bei der Ausgleichskasse am Geschäftssitz (Bern: AK Bern). Beitrag 10 % des Einkommens, unter CHF 60’500 weniger; 2026 mindestens CHF 530 im Jahr."],["Handelsregister","Pflicht ab CHF 100’000 Umsatz im letzten Geschäftsjahr, sonst freiwillig. Gebühr CHF 120. Der Firmenname muss Ihren Familiennamen enthalten."],["MWST","Pflicht ab CHF 100’000 Umsatz im Jahr, oder sobald das beim Start absehbar ist. Anmeldung bei der ESTV innert 30 Tagen."],["Bewilligung","Nur für bestimmte, reglementierte Tätigkeiten nötig. Vor dem Start prüfen."]],"steps":["Auf EasyGov.swiss ein Konto eröffnen, «Einzelunternehmen» wählen und den Firmennamen mit Ihrem Familiennamen festlegen.","Bei der AK Bern als Selbstständigerwerbende anmelden, möglichst im ersten Quartal: online oder mit Formular 318.146, dazu Belege wie Rechnungen, Erfolgsrechnung oder Werbung.","Ab CHF 100’000 Jahresumsatz: Eintrag beim Handelsregisteramt Bern (CHF 120) und Anmeldung bei der ESTV für die Mehrwertsteuer innert 30 Tagen.","Vor dem Start prüfen, ob Ihre Tätigkeit eine Bewilligung braucht."],"who":[1,1,0],"note":"Ausgleichskasse und Handelsregister sind kantonal (in Bern: AK Bern und Handelsregisteramt des Kantons Bern), die Mehrwertsteuer erhebt der Bund (ESTV). EasyGov.swiss ist der Online-Schalter des Bundes für alle drei.","src":["KMU-Portal (SECO): Rechtsform Einzelunternehmen","Handelsregisteramt Bern: Merkblatt Neueintragung Einzelunternehmen","Ausgleichskasse Kanton Bern: Selbständigerwerbende","ahv-iv.ch: Merkblatt 2.02 Beiträge Selbstständigerwerbende","ESTV: Steuerpflicht MWST","EasyGov.swiss: Einzelfirma gründen"]},"drv":{"intro":"Wer in der Schweiz wohnt, fährt mit einem ausländischen Führerausweis nur 12 Monate. Im Kanton Bern tauschen Sie ihn beim Strassenverkehrsamt (SVSA) um. Ein deutscher Ausweis braucht als EU-Ausweis keine Kontrollfahrt; der Umtausch kostet CHF 120.","facts":[["Frist","12 Monate ab Einreise laut Aufenthaltsbewilligung (Art. 42 VZV). Gesuch vorher einreichen, damit Sie ohne Unterbruch fahren dürfen. Später geht noch, aber mit möglicher Busse."],["Kontrollfahrt","Keine für Ausweise aus EU/EFTA sowie Andorra, Australien, Israel, Japan, Kanada, Südkorea, Marokko, Monaco, Neuseeland, San Marino, Singapur, Taiwan, Tunesien und USA. Alle anderen fahren eine Kontrollfahrt."],["Kosten","Bern: Umtausch CHF 120, Kontrollfahrt Kategorie B CHF 132."],["Zuständig","Strassenverkehrs- und Schifffahrtsamt Kanton Bern (SVSA), Schermenweg 5, Bern."]],"steps":["Sehtest bei einem anerkannten Optiker oder Augenarzt machen.","Gesuchsformular des SVSA ausfüllen, unterschreiben und ein aktuelles farbiges Passfoto (35 × 45 mm) aufkleben.","Gesuch persönlich abgeben: bei einem SVSA-Standort, der Einwohnerkontrolle Ihrer Gemeinde oder einem Polizeiposten im Kanton Bern. Mitbringen: ausländischen Führerausweis im Original und Pass oder ID.","Falls nötig Kontrollfahrt machen. Den Schweizer Führerausweis erhalten Sie per Post."],"who":[1,1,0],"note":"Der Bund (ASTRA) regelt den Umtausch in der Verkehrszulassungsverordnung, das kantonale Strassenverkehrsamt (in Bern das SVSA) prüft das Gesuch und stellt den Ausweis aus.","src":["Kanton Bern (SVSA): Umtausch ausländischer Führerausweis","Kanton Bern (SVSA): Gebühren","ch.ch: Führerausweis umtauschen","ASTRA: Umtausch ausländischer Führerausweise"]},"wed":{"intro":"Wenn Sie beide Schweizer sind und in Zürich wohnen, reservieren Sie zuerst online Ort und Datum beim Zivilstandsamt der Stadt Zürich, frühestens 12 Monate im Voraus. Die Ehevorbereitung machen Sie zu zweit am Schalter im Stadthaus, spätestens 1 Monat vor der Hochzeit.","facts":[["Voraussetzungen","Beide mindestens 18 und urteilsfähig. Verwandte in gerader Linie sowie Geschwister und Halbgeschwister dürfen einander nicht heiraten."],["Frist","Einladung zur Ehevorbereitung frühestens 3 Monate vor der Hochzeit. Abschliessen spätestens 1 Monat davor, sonst wird die Reservation storniert."],["Kosten","Zürich: günstigste Hochzeit im Stadthaus ab CHF 255, inklusive Ehevorbereitung ohne Übersetzung (nur mit Wohnort Stadt Zürich)."],["Trauzeugen","Zwei volljährige und urteilsfähige Trauzeuginnen oder Trauzeugen müssen dabei sein."]],"steps":["Auf der Website des Zivilstandsamts Zürich Hochzeitslocation und Datum reservieren, frühestens 12 Monate im Voraus.","Frühestens 3 Monate vor der Hochzeit kommt eine E-Mail-Einladung. Damit wählen Sie online einen Termin für die Ehevorbereitung.","Zu zweit am Schalter im Stadthaus erscheinen, mit Pass oder ID. Sie füllen das Formular aus, unterschreiben und legen fest, welche Namen Sie und allenfalls Ihre Kinder tragen.","Gebühren vor Ort mit Karte oder Twint zahlen. Zur Trauung zwei Trauzeugen mitbringen."],"who":[1,0,1],"note":"Die Regeln zur Ehe (ZGB) und die Gebühren legt der Bund fest; Ehevorbereitung und Trauung führt in Zürich das Zivilstandsamt der Stadt durch.","src":["Stadt Zürich: Heiraten mit Wohnort Zürich","Stadt Zürich: Ehevorbereitung","Stadt Zürich: Fragen und Antworten zur Heirat","ch.ch: Heiraten in der Schweiz"]},"dog":{"intro":"In der Stadt Bern melden Sie Ihren Hund bei den Einwohnerdiensten an, mit dem Formular «An- und Abmeldung Hund». Haben Sie den Hund übernommen, melden Sie den Halterwechsel innert 10 Tagen der Datenbank AMICUS. Die Hundetaxe beträgt CHF 150 pro Jahr.","facts":[["Anmeldung","Bei den Einwohnerdiensten der Stadt Bern, Predigergasse 5, 3011 Bern. Die Gemeinde erfasst Sie als Halterin oder Halter in AMICUS."],["Frist","Halterwechsel (Kauf, Übernahme, Abgabe für mehr als 3 Monate) innert 10 Tagen an AMICUS melden. Importierte Hunde: Chip innert 10 Tagen vom Tierarzt prüfen und melden lassen."],["Kosten","Stadt Bern: CHF 150 pro Hund und Jahr, für Hunde ab 6 Monaten. Die Rechnung kommt automatisch im August."],["Mikrochip","Pflicht für jeden Hund; Welpen innert 3 Monaten. Nur Tierärztinnen und Tierärzte setzen den Chip und melden den Hund an AMICUS."]],"steps":["Formular «An- und Abmeldung Hund» der Stadt Bern ausfüllen und per Post an die Einwohnerdienste senden.","Hat der Hund schon einen Chip: Halterwechsel innert 10 Tagen in AMICUS melden. Hat er noch keinen: beim Tierarzt chippen lassen.","Hundetaxe zahlen, wenn die Rechnung im August kommt.","Bei Umzug, Abgabe oder Tod des Hundes: Gemeinde und AMICUS informieren."],"who":[1,0,1],"note":"Der Bund schreibt Chip und Registrierung in AMICUS vor (Tierseuchenverordnung); die Gemeinde nimmt die Anmeldung entgegen und erhebt die Hundetaxe.","src":["Stadt Bern: Hunde","Stadt Bern: Formular An- und Abmeldung Hund","AMICUS: Gut zu wissen (Merkblatt)","ch.ch: Hundesteuer"]},"fam":{"intro":"Als Angestellte oder Angestellter im Kanton Bern beantragen Sie die Familienzulagen bei Ihrem Arbeitgeber. Er leitet den Antrag an seine Familienausgleichskasse weiter. Die Kinderzulage beträgt CHF 250 pro Monat und Kind (Stand 2026).","facts":[["Höhe","Kanton Bern, Stand 2026: Kinderzulage CHF 250 pro Monat bis zum Monat des 16. Geburtstags. Ausbildungszulage CHF 310 für Kinder in Ausbildung, frühestens ab 15, längstens bis 25."],["Antrag","Angestellte beim Arbeitgeber. Nichterwerbstätige bei der kantonalen Ausgleichskasse (AK Bern)."],["Frist","Keine feste Frist; vergessene Zulagen lassen sich bis 5 Jahre rückwirkend verlangen."],["Pro Kind","Nur eine Zulage pro Kind, auch wenn beide Eltern arbeiten."]],"steps":["Beim Arbeitgeber das Antragsformular für Familienzulagen verlangen.","Formular mit den Angaben zum Kind und zum anderen Elternteil ausfüllen und unterschreiben.","Der Arbeitgeber leitet den Antrag an seine Familienausgleichskasse weiter und zahlt die Zulage aus.","Arbeiten beide Eltern: vorher klären, wer den Antrag stellt, denn es gibt nur eine Zulage pro Kind."],"who":[1,1,0],"note":"Der Bund legt die Mindestbeträge fest (Familienzulagengesetz), der Kanton Bern zahlt 115 % davon; ausgezahlt wird über die rund 50 Familienausgleichskassen im Kanton.","src":["Familienportal Kanton Bern: Kinder- und Ausbildungszulagen","ch.ch: Familienzulagen","ahv-iv.ch: Merkblatt 6.08 Familienzulagen","Ausgleichskasse Kanton Bern: Familienzulagen"]},"debt":{"intro":"Im Kanton Bern bestellen Sie den Betreibungsregisterauszug online beim kantonalen Betreibungs- und Konkursamt (be.ch/baka). Er kostet CHF 18 inklusive Zustellung und kommt elektronisch zum Herunterladen.","facts":[["Kosten","Kanton Bern online: CHF 18 inklusive Zustellung (Gebühr CHF 17 pro Auszug)."],["Inhalt","Die Betreibungen der letzten 5 Jahre im jeweiligen Betreibungskreis."],["Umzug","Wer in den letzten 5 Jahren anderswo wohnte, bestellt auch dort einen Auszug, sonst fehlen diese Betreibungen."],["Zustellung","Online-Bestellung rein elektronisch: Download auf einer gesicherten Plattform, mehrmals möglich."]],"steps":["Auf be.ch/baka den Betreibungsregisterauszug für sich selbst online bestellen.","Gültigen Ausweis bereithalten: ID, Pass oder Ausländerausweis.","Gebühr gleich bei der Bestellung zahlen: Karte, PostFinance Pay oder Twint.","Auszug auf der gesicherten Plattform herunterladen und zum Beispiel dem Vermieter weitergeben."],"who":[1,1,0],"note":"Das Betreibungsrecht (SchKG) und die Gebühren regelt der Bund; im Kanton Bern führt das kantonale Betreibungs- und Konkursamt (BAKA) die Register.","src":["Kanton Bern (BAKA): Betreibungsauszug bestellen","ch.ch: Betreibungsregisterauszug bestellen","Kanton Bern: Bestellung des Betreibungsauszugs online (Medienmitteilung)"]},"crim":{"intro":"Den Strafregisterauszug (Privatauszug) bestellen Sie beim Bund, online auf strafregister.admin.ch oder am Postschalter. Er kostet CHF 17 und kommt etwa 10 Arbeitstage nach Eingang des unterschriebenen Formulars per Post.","facts":[["Kosten","CHF 17 für den Privatauszug. Beglaubigung oder Apostille: CHF 20 zusätzlich."],["Dauer","Etwa 10 Arbeitstage nach Eingang des unterschriebenen Formulars."],["Bestellen","Online auf strafregister.admin.ch oder persönlich am Postschalter mit gültigem Ausweis."],["Sonderprivatauszug","Für Tätigkeiten mit Minderjährigen gibt es einen eigenen Auszug, den Sonderprivatauszug."]],"steps":["Auf strafregister.admin.ch den Privatauszug wählen und Personalien, Adresse und Zahlungsangaben eingeben.","Gebühr online zahlen: Debit- oder Kreditkarte, PostFinance Card oder Twint.","Formular ausdrucken, unterschreiben und mit einer Kopie Ihres Ausweises per Post schicken.","Alternativ: am Postschalter mit Pass, ID oder Ausländerausweis bestellen und gleich bezahlen."],"who":[1,0,0],"note":"Das Strafregister führt der Bund (Bundesamt für Justiz). Bestellt wird direkt beim Bund oder über einen Postschalter.","src":["Bundesamt für Justiz: Privatauszug bestellen","Bundesamt für Justiz: FAQ Privatauszug","ch.ch: Strafregisterauszug"]},"car":{"intro":"Im Kanton Bern lösen Sie das Auto beim Strassenverkehrsamt (SVSA) ein, per Post oder am Schalter. Zuerst schickt Ihre Versicherung den Versicherungsnachweis elektronisch ans Amt. Der Fahrzeugausweis kostet CHF 45 per Post oder CHF 55 am Schalter.","facts":[["Unterlagen","Versicherungsnachweis (kommt von der Versicherung elektronisch ans Amt), Fahrzeugausweis des Vorbesitzers, Prüfbericht falls das Auto nachgeprüft wurde, Ausweis."],["Kosten","Fahrzeugausweis: CHF 45 per Post, CHF 55 am Schalter. Neue Nummernschilder: CHF 45 pro Paar, CHF 30 einzeln."],["Frist","Der Versicherungsnachweis gilt 30 Tage. Die Motorfahrzeugsteuer ist innert 30 Tagen nach Rechnung zu zahlen."],["Steuer","Jährliche Motorfahrzeugsteuer, Rechnung im Januar oder bei der Anmeldung. Die Höhe zeigt der Rechner des SVSA."]],"steps":["Haftpflichtversicherung abschliessen. Die Versicherung schickt den Versicherungsnachweis elektronisch ans SVSA.","Formular «Anmeldung zur Immatrikulation eines Fahrzeugs» ausfüllen.","Formular mit Fahrzeugausweis des Vorbesitzers, allfälligem Prüfbericht und Ausweis per Post ans SVSA, Schermenweg 5, 3001 Bern, schicken oder am Schalter abgeben.","Per Post dauert es einige Arbeitstage, bis der neue Fahrzeugausweis kommt. Danach die Rechnung für die Motorfahrzeugsteuer innert 30 Tagen zahlen."],"who":[1,1,0],"note":"Der Bund regelt die Zulassung von Fahrzeugen; das kantonale Strassenverkehrsamt (in Bern das SVSA) stellt Fahrzeugausweis und Nummernschilder aus und erhebt die Motorfahrzeugsteuer.","src":["Kanton Bern (SVSA): Fahrzeug einlösen","Kanton Bern (SVSA): So melden Sie Ihr Fahrzeug an","Kanton Bern (SVSA): Unterlagen für die Anmeldung","Kanton Bern (SVSA): Fahrzeugsteuer berechnen","ch.ch: Fahrzeug einlösen"]},"nat":{"intro":"Die Wohnsitzbedingungen erfüllen Sie: 10 Jahre in der Schweiz, C-Ausweis und mindestens 2 Jahre in Kanton und Gemeinde. Dazu kommen Sprachnachweis, Einbürgerungstest und Integration. Das Gesuch stellen Sie bei der Stadt Bern; für eine Einzelperson kosten Gemeinde, Kanton und Bund zusammen CHF 1’650.","facts":[["Voraussetzungen","C-Ausweis, insgesamt 10 Jahre in der Schweiz, je mindestens 2 Jahre ununterbrochen im Kanton Bern und in der Gemeinde, erfolgreich integriert."],["Sprache","Kanton Bern: mündlich B1, schriftlich A2. Kein Sprachnachweis nötig, wenn die Amtssprache Ihre Muttersprache ist oder Sie mindestens 5 Jahre die obligatorische Schule in dieser Sprache besucht haben."],["Test","Schriftlich, 90 Minuten: Geografie, Geschichte, Demokratie, Gesundheit und Arbeit, Rechte und Pflichten. Befreit ist unter anderem, wer mindestens 5 Jahre die obligatorische Schule in der Schweiz besucht hat."],["Kosten","Einzelperson in der Stadt Bern: Gemeinde CHF 400, Kanton CHF 1’150, Bund CHF 100. Ehepaar: 600, 1’725 und 150."]],"steps":["Bei der Wohngemeinde (Stadt Bern) melden. Sie gibt Ihnen die Formulare und sagt, welche Unterlagen nötig sind.","Sprachnachweis beschaffen (B1 mündlich, A2 schriftlich), falls Sie nicht befreit sind.","Gesuch mit allen Unterlagen bei der Gemeinde einreichen und den Einbürgerungstest machen, falls Sie nicht befreit sind.","Die Gemeinde stellt Ihnen die Gebühren von Gemeinde und Kanton in Rechnung; der Bund (SEM) entscheidet über die Einbürgerungsbewilligung."],"who":[1,1,1],"note":"Einbürgern heisst drei Bürgerrechte erwerben: Gemeinde, Kanton und Bund prüfen je ihren Teil. Das Gesuch läuft über die Wohngemeinde, das Staatssekretariat für Migration (SEM) erteilt die Bewilligung des Bundes.","src":["Kanton Bern: Aufenthalt in der Schweiz (Einbürgerung)","Kanton Bern: Sprachkenntnisse und Nachweis","Kanton Bern: Einbürgerungstest","Kanton Bern: Gebühren der Einbürgerung","SEM: Ordentliche Einbürgerung"]},"pv":{"intro":"Im Kanton Bern prüft der Kanton Ihren Anspruch auf Prämienverbilligung in der Regel automatisch, anhand der definitiven Steuerdaten der zwei Vorjahre. 2026 liegt die Grenze bei CHF 35’000 massgebendem Einkommen, für Familien mit Kindern bei CHF 45’000. Einen Antrag stellen Sie nur in besonderen Fällen.","facts":[["Grenze 2026","Massgebendes Einkommen höchstens CHF 35’000; Familien mit Kindern höchstens CHF 45’000."],["Prüfung","Automatisch anhand der definitiven Steuerdaten der zwei Vorjahre (Reineinkommen und Vermögen)."],["Antrag","Nur in besonderen Fällen, zum Beispiel wenn keine automatische Prüfung möglich ist oder sich Einkommen oder Familie dauerhaft und stark ändern. Auch online möglich."],["Rechner","Unverbindliche Schätzung mit dem Online-Rechner auf be.ch/pvo-onlinerechner."]],"steps":["Mit dem Online-Rechner auf be.ch/pvo-onlinerechner prüfen, ob ein Anspruch möglich ist.","Steuererklärung einreichen: Die automatische Prüfung braucht definitive Steuerdaten.","Haben sich Einkommen oder Familie dauerhaft und stark verändert: Antrag stellen, auch online.","Besteht ein Anspruch, zahlt der Kanton die Verbilligung direkt an Ihre Krankenkasse und Ihre Prämienrechnung sinkt."],"who":[1,1,0],"note":"Der Bund schreibt die Prämienverbilligung im Krankenversicherungsgesetz vor und zahlt mit; im Kanton Bern prüft und verfügt das Amt für Sozialversicherungen (ASV).","src":["Kanton Bern (ASV): Anrecht auf Prämienverbilligung","Kanton Bern (ASV): Wann Sie einen Antrag stellen müssen","Kanton Bern (ASV): Informationsblatt Prämienverbilligung 2026","Kanton Bern (ASV): Anrecht berechnen"]},"wpe":{"intro":"Ja. Wer keinen oder nicht den ganzen Militär- oder Zivildienst leistet, zahlt den Wehrpflichtersatz: 3 % des steuerbaren Einkommens der direkten Bundessteuer, mindestens CHF 400 pro Jahr. Im Kanton Bern ist das Amt für Bevölkerungsschutz, Sport und Militär (BSM) zuständig.","facts":[["Höhe","3 % des steuerbaren Einkommens der direkten Bundessteuer, mindestens CHF 400 pro Jahr."],["Dauer","Vom 19. bis zum 37. Altersjahr, höchstens 11 Ersatzjahre."],["Zivilschutz","Wer Schutzdienst leistet, zahlt trotzdem, aber 4 % weniger pro geleistetem Schutzdiensttag im Jahr."],["Rückerstattung","Wer Militär- oder Zivildienst nachholt und die Dienstpflicht erfüllt, erhält die Abgabe zurück. Der Anspruch verjährt 5 Jahre nach Ende der Wehrpflicht."]],"steps":["Steuererklärung wie gewohnt einreichen: Die Abgabe berechnet sich aus dem steuerbaren Einkommen der direkten Bundessteuer.","Die Rechnung kommt von der kantonalen Stelle, im Kanton Bern vom BSM.","Bei erheblicher Behinderung und tiefem Einkommen: Befreiung prüfen lassen.","Dienst nachgeholt: nach erfüllter Dienstpflicht die Rückerstattung beim BSM beantragen."],"who":[1,1,0],"note":"Der Wehrpflichtersatz ist eine Abgabe des Bundes (ESTV); die Kantone, in Bern das Amt für Bevölkerungsschutz, Sport und Militär, veranlagen und beziehen sie.","src":["ESTV: Wehrpflichtersatzabgabe erklärt","Kanton Bern (BSM): Wehrpflichtersatz","Kanton Bern (BSM): Rückerstattung","ch.ch: Wehrpflichtersatzabgabe"]},"bau":{"intro":"Nicht unbedingt. Im Kanton Bern braucht ein Gartenhaus keine Baubewilligung, wenn es höchstens 10 m² Grundfläche und 2,5 m Höhe hat, unbeheizt ist, weder bewohnt noch gewerblich genutzt wird und zu einem Hauptgebäude gehört. Ist es grösser, reichen Sie ein Baugesuch über eBau ein.","facts":[["Bewilligungsfrei","Unbeheizte Kleinbaute bis 10 m² Grundfläche und 2,5 m Höhe, nicht bewohnt, nicht gewerblich, mit Bezug zu einem Hauptgebäude (Art. 6 Baubewilligungsdekret)."],["Trotzdem einhalten","Auch ohne Bewilligung gelten Vorschriften, zum Beispiel Abstände, Brandschutz und Energievorschriften."],["Ausnahme","Ausserhalb der Bauzone braucht auch eine Kleinbaute eine Bewilligung, wenn sie die Umgebung wesentlich verändert, die Erschliessung belastet oder die Umwelt beeinträchtigt."],["Baugesuch","Seit März 2022 im ganzen Kanton Bern nur elektronisch über eBau."]],"steps":["Masse prüfen: Grundfläche höchstens 10 m², Höhe höchstens 2,5 m, unbeheizt, nur zum Abstellen.","Abstände zur Grenze sowie Brandschutz- und Energievorschriften einhalten.","Im Zweifel beim Bauinspektorat der Stadt Bern nachfragen; es beantwortet auch Voranfragen.","Ist das Gartenhaus grösser oder trifft eine Bedingung nicht zu: Baugesuch elektronisch über eBau einreichen."],"who":[0,1,1],"note":"Welche Bauten bewilligungsfrei sind, regelt der Kanton im Baubewilligungsdekret; in der Stadt Bern beantwortet das Bauinspektorat Fragen und prüft Baugesuche.","src":["Kanton Bern: Baubewilligungsdekret (BSG 725.1), Art. 6","Stadt Bern: Wann braucht es eine Baubewilligung?","Stadt Bern: Baubewilligungsverfahren"]},"lost":{"intro":"Melden Sie den Verlust persönlich: bei einer Polizeiwache oder direkt beim Termin im Ausweiszentrum, wenn Sie den neuen Ausweis bestellen. Die Verlustmeldung kostet im Kanton Bern CHF 40. Danach ist der alte Ausweis ungültig, auch wenn Sie ihn wiederfinden.","facts":[["Meldung","Persönlich bei einer Polizeiwache oder im Ausweiszentrum beim Termin für den neuen Ausweis."],["Kosten","Verlustmeldung im Kanton Bern: CHF 40. Dazu der neue Ausweis zum normalen Preis, zum Beispiel ID für Erwachsene CHF 70."],["Gültigkeit","Mit der Meldung wird der Ausweis ungültig. Finden Sie ihn wieder, dürfen Sie ihn nicht mehr verwenden und geben ihn bei der Passstelle ab."],["Neuer Ausweis","Wie jeder Ausweis: online auf schweizerpass.ch beantragen, dann Termin im Ausweiszentrum."]],"steps":["Verlust persönlich melden: bei einer Polizeiwache (Sie erhalten eine Verlustanzeige) oder direkt beim Termin im Ausweiszentrum.","Neuen Ausweis online auf schweizerpass.ch beantragen und Termin in einem Berner Ausweiszentrum buchen.","Zum Termin die Verlustanzeige der Polizei mitbringen, falls Sie den Verlust dort gemeldet haben.","Taucht der alte Ausweis wieder auf: nicht mehr verwenden und bei der Passstelle abgeben."],"who":[1,1,0],"note":"Der Bund (fedpol) ist für die Ausweise zuständig; den Verlust nehmen Polizei und kantonale Ausweiszentren entgegen, im Kanton Bern auch die sieben Ausweiszentren.","src":["Kanton Bern: Verlust von ID oder Pass","ch.ch: Pass oder Identitätskarte verloren oder gestohlen","fedpol: Verlust von Ausweisdokumenten"]},"kita":{"intro":"In der Stadt Bern bekommen Sie Betreuungsgutscheine für eine zugelassene Kita, wenn Sie beide zusammen mindestens 105 % arbeiten (Alleinerziehende 5 %) und das massgebende Familieneinkommen unter CHF 170’000 liegt. Den Antrag stellen Sie online über kiBon; der Gutschein gilt ab dem Monat nach dem vollständigen Gesuch.","facts":[["Voraussetzungen","Wohnsitz in der Stadt Bern, Kita oder Tagesfamilienorganisation im kantonalen Gutscheinsystem zugelassen, Kind ab 3 Monaten bis zum Ende des Kindergartens."],["Pensum","Beide Eltern zusammen mindestens 105 %, Alleinerziehende mindestens 5 %."],["Einkommen","Gutscheinperiode 1. August 2026 bis 31. Juli 2027: massgebendes Familieneinkommen unter CHF 170’000."],["Beginn","Der Gutschein gilt erst ab dem Monat nach dem Eingang des vollständigen Gesuchs, nicht rückwirkend."]],"steps":["Mit dem Gutscheinrechner der Stadt Bern abschätzen, wie hoch der Gutschein ausfällt.","Kita wählen, die im kantonalen Gutscheinsystem zugelassen ist.","Gesuch online über kiBon stellen (oder auf Papier), mit Nachweisen zum Pensum wie Arbeitsvertrag oder Stundennachweis.","Gesuch früh und vollständig einreichen, denn der Gutschein gilt erst ab dem Folgemonat."],"who":[0,1,1],"note":"Der Kanton Bern regelt das Gutscheinsystem und betreibt kiBon; die Stadt Bern prüft die Gesuche, stellt die Gutscheine aus und zahlt einen eigenen Zuschlag dazu.","src":["Stadt Bern: Betreuungsgutscheine","Stadt Bern: FAQ zu den Betreuungsgutscheinen","Stadt Bern: Gutscheinrechner","Kanton Bern (GSI): Betreuungsgutscheine"]},"soz":{"intro":"In der Stadt Bern melden Sie sich persönlich beim Sozialdienst an der Schwarztorstrasse 71 an, mit einem amtlichen Ausweis. Dort erhalten Sie eine persönliche Checkliste der nötigen Unterlagen. Ob ein Anspruch möglich ist, schätzt der Sozialhilferechner der Stadt Bern ab.","facts":[["Anmeldung","Persönlich beim Sozialdienst der Stadt Bern, Schwarztorstrasse 71, mit amtlichem Ausweis. Neu Zugezogene, die noch nicht bei der Einwohnerkontrolle angemeldet sind, bringen eine Kopie des Mietvertrags mit."],["Unterlagen","Das Gesuchsformular nennt die üblichen Unterlagen; am Schalter erhalten Sie eine persönliche Checkliste und eine Vollmacht."],["Höhe","Nach den Richtlinien der SKOS, abgestuft nach Haushaltsgrösse. Eine erste Einschätzung gibt der Sozialhilferechner der Stadt Bern."],["Rückerstattung","Sozialhilfe kann später zurückgefordert werden, wenn die Voraussetzungen dafür erfüllt sind."]],"steps":["Mit dem Sozialhilferechner der Stadt Bern prüfen, ob ein Anspruch möglich ist.","Persönlich beim Sozialdienst an der Schwarztorstrasse 71 anmelden, mit Ausweis (neu Zugezogene: Kopie des Mietvertrags).","Gesuchsformular ausfüllen und die Unterlagen gemäss Checkliste einreichen.","Die Vollmacht unterschreiben und mit dem Gesuch abgeben."],"who":[0,1,1],"note":"Der Kanton Bern regelt die Sozialhilfe und stützt sich auf die SKOS-Richtlinien; zuständig für Ihr Gesuch ist der Sozialdienst Ihrer Wohngemeinde, in Bern der Sozialdienst der Stadt.","src":["Stadt Bern: Anmeldung für die Sozialhilfe","Stadt Bern: Wer kann sich für die Sozialhilfe anmelden?","Stadt Bern: Sozialhilferechner","Stadt Bern: Sozialhilfe und Sozialdienst"]},"el":{"intro":"Ja, wenn Rente und übriges Einkommen Ihren Lebensbedarf nicht decken und Ihr Reinvermögen unter CHF 100’000 liegt (Ehepaare CHF 200’000). Im Kanton Bern reichen Sie das Anmeldeformular bei der AHV-Zweigstelle Ihrer Wohngemeinde ein; die Ausgleichskasse des Kantons Bern entscheidet.","facts":[["Vermögen","Reinvermögen unter CHF 100’000 für Alleinstehende, unter CHF 200’000 für Ehepaare."],["Lebensbedarf","Ab 2027 anerkannt (zu Hause lebend): CHF 21’000 pro Jahr für Alleinstehende, CHF 31’500 für Ehepaare."],["Anmeldung","Offizielles Anmeldeformular bei der AHV-Zweigstelle Ihrer Wohngemeinde einreichen."],["Zuständig","Die Ausgleichskasse des Kantons Bern prüft das Gesuch und entscheidet."]],"steps":["Anmeldeformular für Ergänzungsleistungen der Ausgleichskasse des Kantons Bern herunterladen und ausfüllen.","Die im Formular verlangten Belege beilegen.","Formular bei der AHV-Zweigstelle Ihrer Wohngemeinde (hier Thun) einreichen.","Die Ausgleichskasse prüft Einkommen und Vermögen und teilt Ihnen den Entscheid mit."],"who":[1,1,1],"note":"Der Bund regelt die Ergänzungsleistungen und legt die Beträge fest; die Ausgleichskasse des Kantons Bern entscheidet, die AHV-Zweigstelle der Gemeinde nimmt die Anmeldung entgegen.","src":["Ausgleichskasse Kanton Bern: Ergänzungsleistungen","ahv-iv.ch: Merkblatt 5.01 Ergänzungsleistungen","Ausgleichskasse Kanton Bern: Anmeldeformular EL","Bundesrat: Anpassungen per 1.1.2027 (2.10.2026)"]},"iv":{"intro":"Melden Sie sich bei der IV-Stelle Kanton Bern an, und zwar früh: Eine IV-Rente gibt es frühestens 6 Monate nach der Anmeldung. Zuerst prüft die IV aber, ob Massnahmen Ihnen helfen, im Arbeitsleben zu bleiben (Eingliederung vor Rente).","facts":[["Früherfassung","Ab 30 Tagen Arbeitsunfähigkeit oder bei häufigen kurzen Absenzen ist eine Meldung bei der IV-Stelle möglich, zum Beispiel durch den Arbeitgeber. Dort wird geklärt, ob eine Anmeldung nötig ist."],["Rente","Frühestens 6 Monate nach der Anmeldung. Voraussetzung: ein Jahr lang durchschnittlich mindestens 40 % arbeitsunfähig und danach mindestens 40 % erwerbsunfähig."],["Vorrang","Eingliederung vor Rente: Zuerst prüft die IV Massnahmen, die Ihre Erwerbsfähigkeit erhalten oder verbessern."],["Ablauf","Nach der Anmeldung lädt die IV-Stelle zu einem Erstgespräch ein und holt Auskünfte zu Ihrer Gesundheit ein."]],"steps":["Anmeldeformular der IV ausfüllen.","Anmeldung bei der IV-Stelle Kanton Bern einreichen, nicht zu spät, denn die Rente beginnt frühestens 6 Monate danach.","Zum Erstgespräch gehen. Die IV holt die nötigen Auskünfte zu Ihrer Gesundheit ein.","Bei Eingliederungsmassnahmen mitwirken. Über eine Rente entscheidet die IV erst, wenn diese nicht genügen."],"who":[1,1,0],"note":"Die Invalidenversicherung ist eine Versicherung des Bundes (BSV); durchgeführt wird sie von den kantonalen IV-Stellen, in Bern von der IV-Stelle Kanton Bern.","src":["IV-Stelle Kanton Bern: Anmeldung und Verfahren","IV-Stelle Kanton Bern: Früherfassung und Eingliederung","ahv-iv.ch: Merkblatt 4.04 Invalidenrenten","ch.ch: Invalidenversicherung"]},"mse":{"intro":"Wenn Sie vor der Geburt erwerbstätig waren, erhalten Sie 14 Wochen lang Mutterschaftsentschädigung: 80 % Ihres durchschnittlichen Erwerbseinkommens, höchstens CHF 220 pro Tag. Sie beantragen sie bei der AHV-Ausgleichskasse.","facts":[["Anspruch","In den 9 Monaten vor der Geburt AHV-versichert und in dieser Zeit mindestens 5 Monate erwerbstätig. Bei der Geburt angestellt, selbständig oder arbeitslos."],["Höhe","80 % des durchschnittlichen Erwerbseinkommens vor der Geburt, höchstens CHF 220 pro Tag. Das Maximum erreichen Angestellte ab einem Monatslohn von CHF 8 250."],["Dauer","98 Tage (14 Wochen) ab der Geburt. Nehmen Sie die Erwerbstätigkeit früher wieder auf, endet der Anspruch. Bleibt das Kind direkt nach der Geburt mindestens 2 Wochen im Spital, verlängert sich die Dauer um höchstens 56 Tage."],["Frist","Der Anspruch kann bis 5 Jahre nach Ende des Mutterschaftsurlaubs geltend gemacht werden."]],"steps":["Formular «Anmeldung für eine Mutterschaftsentschädigung» (318.750) ausfüllen.","Als Angestellte: Der Arbeitgeber bestätigt Dauer der Anstellung und Lohn.","Anmeldung bei der zuständigen AHV-Ausgleichskasse einreichen, also bei der Kasse, an die zuletzt Beiträge bezahlt wurden."],"who":[1,0,0],"note":"Die Mutterschaftsentschädigung ist Teil der Erwerbsersatzordnung (EO) des Bundes (BSV). Auszahlen tun sie die AHV-Ausgleichskassen.","src":["BSV: EO bei Mutterschaft","ahv-iv.ch: Merkblatt 6.02 Mutterschaftsentschädigung","BSV: Wann habe ich Anspruch?","ch.ch: Mutterschaftsurlaub"]},"pat":{"intro":"Als Vater (oder Ehefrau der Mutter) haben Sie Anspruch auf 2 Wochen bezahlten Urlaub, den Sie innerhalb von 6 Monaten nach der Geburt beziehen. Die Entschädigung beträgt 80 % des Erwerbseinkommens, höchstens CHF 220 pro Tag. Sie wird nicht automatisch ausbezahlt, sondern muss beantragt werden.","facts":[["Anspruch","Rechtlicher Vater des Kindes oder Ehefrau der Mutter. In den 9 Monaten vor der Geburt AHV-versichert und in dieser Zeit mindestens 5 Monate erwerbstätig."],["Dauer","2 Wochen (10 Arbeitstage), am Stück oder tageweise. Bezug innerhalb von 6 Monaten nach der Geburt; danach verfallen nicht bezogene Tage."],["Höhe","80 % des durchschnittlichen Erwerbseinkommens vor der Geburt, höchstens CHF 220 pro Tag. Für 2 Wochen gibt es 14 Taggelder, also höchstens CHF 3 080."],["Antrag","Formular «Anmeldung für die Entschädigung des andern Elternteils» (318.747) bei der zuständigen AHV-Ausgleichskasse. Bei Angestellten reicht es in der Regel der Arbeitgeber ein."]],"steps":["Urlaub mit dem Arbeitgeber planen und innerhalb von 6 Monaten nach der Geburt beziehen.","Formular 318.747 ausfüllen.","Als Angestellter: Formular dem Arbeitgeber geben, er reicht es bei seiner Ausgleichskasse ein. Als Selbständiger: direkt bei Ihrer Ausgleichskasse."],"who":[1,0,0],"note":"Die Entschädigung des andern Elternteils ist Teil der Erwerbsersatzordnung (EO) des Bundes (BSV). Auszahlen tun sie die AHV-Ausgleichskassen.","src":["BSV: EO bei Vaterschaft","ahv-iv.ch: Merkblatt 6.04 Entschädigung des andern Elternteils","BSV: Wann habe ich Anspruch?","ch.ch: Vaterschaftsurlaub"]},"lfa":{"intro":"Den Lernfahrausweis fürs Auto (Kategorie B) gibt es ab 17. Im Kanton Bern reichen Sie das Gesuch mit Sehtest, Nothelferausweis und Passfoto persönlich ein. Nach bestandener Basistheorieprüfung erhalten Sie den Lernfahrausweis.","facts":[["Alter","Kategorie B ab 17 Jahren. Die Basistheorieprüfung ist frühestens einen Monat vor dem Mindestalter möglich."],["Voraussetzungen","Nothelferkurs (Ausweis 6 Jahre gültig), Sehtest bei einem anerkannten Optiker oder Augenarzt (2 Jahre gültig), Passfoto."],["Kosten","Kanton Bern: Gesuch CHF 30, Ausstellung des Lernfahrausweises CHF 20, Basistheorieprüfung CHF 30."],["Lernphase","Der Lernfahrausweis B ist 24 Monate gültig. Wer ihn vor dem 20. Geburtstag erhält, muss ihn mindestens 12 Monate haben, bevor er zur praktischen Prüfung darf."]],"steps":["Nothelferkurs besuchen und Sehtest machen.","Gesuchsformular ausfüllen und mit Passfoto, Ausweis im Original und Nothelferausweis persönlich einreichen: bei einem Standort des Strassenverkehrsamts (SVSA), einer Polizeiwache oder der Gemeindeverwaltung.","Mit der Referenznummer aus dem Zulassungsschreiben einen Termin für die Basistheorieprüfung buchen.","Nach bestandener Prüfung erhalten Sie den Lernfahrausweis (auch als E-Lernfahrausweis auf dem Handy möglich)."],"who":[1,1,0],"note":"Die Regeln (Mindestalter, Lernphase) legt der Bund (ASTRA) fest. Gesuch, Prüfung und Ausweis laufen über das kantonale Strassenverkehrsamt, in Bern das SVSA.","src":["SVSA Bern: Lernfahrausweis beantragen","SVSA Bern: Gebühren","SVSA Bern: Wissenswertes für Lernfahrer","ASTRA: Fragen und Antworten zur Fahrausbildung"]},"wsb":{"intro":"In der Stadt Bern bestellen Sie die Wohnsitzbestätigung online oder holen sie am Schalter der Einwohnerdienste. Sie kostet CHF 20.","facts":[["Kosten","CHF 20, gleich für Schweizer, EU/EFTA- und Drittstaatsangehörige. Online bezahlen Sie am Schluss der Bestellung (Mastercard, Visa, PostFinance)."],["Wozu","Zum Beispiel für Stipendien, Versicherungen oder die Einbürgerung."],["Schalter","Einwohnerdienste, Migration und Fremdenpolizei, Predigergasse 5, 3011 Bern. Montag bis Freitag 10 bis 16 Uhr, Donnerstag bis 18 Uhr."]],"steps":["Online-Formular «Bestellung Wohnsitzbescheinigung» der Stadt Bern ausfüllen.","Am Schluss online bezahlen.","Oder ohne Online-Bestellung: am Schalter der Einwohnerdienste an der Predigergasse 5 beziehen."],"who":[0,0,1],"note":"Wohnsitzbestätigungen stellt die Wohngemeinde aus, in der Stadt Bern die Einwohnerdienste, Migration und Fremdenpolizei.","src":["Stadt Bern: Wohnsitzbestätigung","Stadt Bern: Online-Bestellung Wohnsitzbescheinigung","Stadt Bern: Kontakt Einwohnerdienste"]},"tod":{"intro":"Ein Todesfall muss innert 2 Tagen dem Zivilstandsamt gemeldet werden. Stirbt jemand zu Hause, rufen Sie zuerst eine Ärztin oder einen Arzt für die Todesbescheinigung. In der Stadt Bern melden Sie den Todesfall zudem beim Bestattungsamt, selbst oder über ein Bestattungsinstitut.","facts":[["Frist","Innert 2 Tagen beim Zivilstandsamt des Sterbeorts."],["Spital oder Heim","Stirbt eine Person im Spital oder Heim, meldet diese Institution den Todesfall dem Zivilstandsamt."],["Unterlagen","Pass oder ID der meldenden Person, ärztliche Todesbescheinigung, falls vorhanden Familienbüchlein oder Familienausweis."],["Unentgeltliche Bestattung","Stadt Bern: Für Einwohnerinnen und Einwohner ohne genügenden Nachlass (in der Regel unter CHF 8 000) übernimmt die Stadt eine einfache Bestattung. Das Gesuch stellen die Angehörigen zusammen mit der Meldung des Todesfalls."]],"steps":["Bei Tod zu Hause: Ärztin oder Arzt rufen und die ärztliche Todesbescheinigung verlangen.","Den Todesfall innert 2 Tagen dem Zivilstandsamt des Sterbeorts melden (im Spital oder Heim macht das die Institution).","Den Todesfall beim Bestattungsamt der Stadt Bern melden, selbst oder über ein Bestattungsinstitut. Das Bestattungsamt organisiert Kremation oder Erdbestattung.","Weitere Schritte (Arbeitgeber, Versicherungen, Banken, Erbschaft) mit der Checkliste von ch.ch erledigen."],"who":[0,1,1],"note":"Die Beurkundung des Todes macht das kantonale Zivilstandsamt. Bestattung und Friedhof sind Sache der Gemeinde, in der Stadt Bern des Bestattungsamts (Predigergasse 5).","src":["Kanton Bern: Todesfall (Zivilstand)","Stadt Bern: Anmeldung eines Todesfalls","Stadt Bern: Unentgeltliche Bestattung","ch.ch: Checkliste Todesfall"]},"pk":{"intro":"In der Stadt Bern beantragen Sie die Anwohnerparkkarte online. Sie gilt in Ihrer Parkkartenzone und kostet laut Stadt Bern CHF 264 pro Jahr (CHF 22 pro Monat).","facts":[["Voraussetzungen","Sie sind in der Parkkartenzone als Einwohnerin, Einwohner oder Wochenaufenthalter gemeldet und stehen mit Namen und Adresse an erster Stelle im Fahrzeugausweis. Parkkarten gibt es für leichte Motorwagen, in der Regel Personenwagen."],["Kosten","CHF 264 pro Jahr, CHF 22 pro Monat."],["Gültigkeit","Ein Jahr ab Ausstellungsmonat, mindestens 3 Monate. Geben Sie die Karte früher zurück, erhalten Sie die Gebühr für die ganzen nicht genutzten Monate zurück (nicht für die Mindestdauer von 3 Monaten)."],["Zone","Die Karte gilt nur in der bewilligten Parkkartenzone."]],"steps":["Prüfen, ob Ihre Adresse in einer Parkkartenzone liegt.","Webformular «Anwohnerparkkarte» der Stadt Bern ausfüllen.","Gebühr elektronisch bezahlen. Die Karte kommt per Post."],"who":[0,0,1],"note":"Parkkarten sind Sache der Gemeinde, in der Stadt Bern der Orts- und Gewerbepolizei (Polizeiinspektorat).","src":["Stadt Bern: Parkkarten Quartiere","Stadt Bern: Webformular Anwohnerparkkarte","Stadt Bern: Parkkarten online erstellen und bezahlen"]},"spg":{"intro":"In der Stadt Bern gibt es drei Wege: Kleinsperrgut mit einer Marke am Kehrichttag an die Strasse stellen, grösseres Sperrgut in einen Entsorgungshof bringen oder vom Abholdienst holen lassen (CHF 70.27 pauschal).","facts":[["Kleinsperrgut","Brennbare Gegenstände bis 100 × 50 × 50 cm und 25 kg (zum Beispiel Besen, Kleinmöbel, Teppiche): mit einer Kleinsperrgutmarke am Kehrichttag neben die Gebührensäcke stellen. 10 Marken kosten CHF 44.10."],["Entsorgungshöfe","Fellerstrasse 13a und Schermen (Wölflistrasse 17). Montag bis Freitag 8 bis 12 und 13 bis 18.30 Uhr, Samstag 8 bis 15 Uhr."],["Abholdienst","CHF 70.27 pauschal, inklusive 5 Minuten Laden; jede weiteren 5 Minuten CHF 54.05. Sie müssen nicht anwesend sein."],["Anmeldung Abholdienst","Bis 11.30 Uhr am Werktag vor dem Abholtag; für Montag bis Freitag 11.30 Uhr. Abgeholt wird montags, dienstags, donnerstags und freitags."]],"steps":["Grösse prüfen: Passt der Gegenstand in 100 × 50 × 50 cm und wiegt höchstens 25 kg, ist er Kleinsperrgut.","Kleinsperrgut: Marke kaufen und am Kehrichttag neben die Gebührensäcke stellen.","Grösseres Sperrgut: in den Entsorgungshof Fellerstrasse oder Schermen bringen, oder den Abholdienst bis 11.30 Uhr am Werktag davor bestellen."],"who":[0,0,1],"note":"Die Abfallentsorgung ist Sache der Gemeinde, in der Stadt Bern von Entsorgung + Recycling Stadt Bern (ERB).","src":["Stadt Bern: Sperrgut","Stadt Bern: Abholdienst Sperrgut","Stadt Bern: Kleinsperrgut","Stadt Bern: Entsorgungshöfe"]},"fund":{"intro":"Haben Sie in der Stadt Bern etwas verloren, melden Sie den Verlust online beim Fundbüro; es meldet sich, sobald der Gegenstand eintrifft. Etwas gefunden? Bringen Sie es ins Fundbüro am Theatergässchen 2.","facts":[["Verlust melden","Online für Verluste im Stadtgebiet. Schirme, Kleider (ausser Jacken) und Bücher können nicht online gemeldet werden; dafür direkt das Fundbüro kontaktieren (031 321 50 50)."],["Abholen","Das Fundbüro gibt den Gegenstand heraus, wenn Beschreibung und Verlustumstände zu den Angaben der Finderin oder des Finders passen. Fundsachen werden ein Jahr aufbewahrt."],["Finderlohn","In der Regel 10 % des Werts, bei hohen Werten angemessen tiefer. Kein Finderlohn für Hausfunde, Diebesgut und Funde in Geschäften."],["Fundbüro","Theatergässchen 2, 3011 Bern. Montag bis Freitag 10 bis 16 Uhr, Donnerstag bis 18 Uhr."]],"steps":["Verlust: Verlustmeldung online beim Fundbüro der Stadt Bern erfassen.","Meldet sich das Fundbüro, den Gegenstand am Theatergässchen 2 abholen.","Fund: Gegenstand ins Fundbüro bringen. Meldet sich innert eines Jahres niemand, können Sie ihn gegen eine Aufbewahrungsgebühr von rund 5 % des Schätzwerts erhalten."],"who":[0,0,1],"note":"Fundsachen sind Sache der Gemeinde, in der Stadt Bern des Fundbüros (Polizeiinspektorat). Die Regeln zu Fund und Finderlohn stehen im ZGB.","src":["Stadt Bern: Fundbüro","Stadt Bern: Kontakt Fundbüro","Stadt Bern: Fundsachenverordnung","ch.ch: Fundgegenstände"]},"bet":{"intro":"Zahlt jemand eine Rechnung nicht, stellen Sie beim Betreibungsamt am Wohnsitz der Schuldnerin oder des Schuldners ein Betreibungsbegehren. Sie zahlen die Kosten vor; ist die Betreibung berechtigt, trägt sie später die Gegenseite. Im Kanton Bern sind das die Betreibungsämter (BAKA).","facts":[["Wo","Betreibungsamt am Wohnsitz der Schuldnerin oder des Schuldners. Das Begehren können Sie online über den Betreibungsschalter ausfüllen."],["Kosten","Als Gläubiger zahlen Sie die Kosten jeder Verfahrensstufe vor. Die Gebühren sind schweizweit gleich und hängen von der Höhe der Forderung ab."],["Zahlungsbefehl","Das Betreibungsamt stellt der Gegenseite einen Zahlungsbefehl zu. Sie hat 20 Tage, um zu zahlen, und 10 Tage, um Rechtsvorschlag zu erheben."],["Rechtsvorschlag","Erhebt die Gegenseite Rechtsvorschlag, entscheidet auf Ihr Gesuch ein Gericht, ob die Betreibung weitergehen kann."]],"steps":["Betreibungsbegehren ausfüllen (online am Betreibungsschalter oder mit dem Musterformular des Bundes).","Beim Betreibungsamt am Wohnsitz der Gegenseite einreichen und den Kostenvorschuss zahlen.","Wird weder gezahlt noch Rechtsvorschlag erhoben: Fortsetzungsbegehren stellen. Bei Rechtsvorschlag: beim Gericht die Aufhebung verlangen."],"who":[1,1,0],"note":"Das Betreibungsrecht (SchKG) und die Gebühren legt der Bund fest. Durchgeführt wird die Betreibung von den Betreibungsämtern, im Kanton Bern von den Betreibungs- und Konkursämtern (BAKA).","src":["ch.ch: Betreibung","Kanton Bern: Betreibungs- und Konkursämter","Bundesamt für Justiz: Musterformulare SchKG"]},"abm":{"intro":"Im Kanton Bern ist das Abmelden kostenlos: Sie schicken den Fahrzeugausweis im Original mit dem Vermerk «annullieren» ans Strassenverkehrsamt (SVSA). Lösen Sie innert 14 Tagen kein anderes Fahrzeug ein, geben Sie auch die Nummernschilder zurück.","facts":[["Kosten","Abmelden ist kostenlos. Schilder für ein Jahr lagern lassen kostet CHF 30; dafür entfällt die Gebühr fürs Wiedereinlösen."],["Schilder","Seit 1. März 2025 müssen Sie bei der Rückgabe angeben, ob das SVSA die Schilder lagern oder entsorgen soll. Ohne Angabe werden sie entsorgt."],["Steuer und Versicherung","Während die Schilder hinterlegt sind, zahlen Sie keine Haftpflichtversicherung und keine Motorfahrzeugsteuer. Zu viel bezahlte Steuer wird verrechnet und ein Guthaben zurückerstattet; massgebend ist der Tag, an dem die Schilder beim SVSA eintreffen."],["Adresse","SVSA Verkehrszulassung, Schermenweg 5, Postfach, 3001 Bern."]],"steps":["Auf den Fahrzeugausweis (Original) «annullieren» notieren.","Ausweis per Post ans SVSA schicken. Lösen Sie innert 14 Tagen kein neues Fahrzeug ein: Schilder beilegen oder in eine Schilder-Rückgabebox an einem SVSA-Standort werfen.","Dabei angeben, ob die Schilder gelagert (CHF 30, ein Jahr) oder entsorgt werden sollen."],"who":[1,1,0],"note":"Die Regeln zur Zulassung legt der Bund fest. Abmeldung, Schilder und Fahrzeugsteuer laufen über das kantonale Strassenverkehrsamt, in Bern das SVSA.","src":["SVSA Bern: Fahrzeug abmelden","SVSA Bern: Nummernschilder deponieren","SVSA Bern: Lagerung der Kontrollschilder","ch.ch: Fahrzeug einlösen und abmelden"]},"wa":{"intro":"Wohnen Sie unter der Woche in der Stadt Bern und verbringen die freien Tage regelmässig in einer anderen Gemeinde, melden Sie sich innert 14 Tagen als Wochenaufenthalterin oder Wochenaufenthalter an, am einfachsten online.","facts":[["Wer","Wer am Arbeits-, Ausbildungs- oder Studienort übernachtet und die freien Tage (meist das Wochenende) regelmässig in einer anderen Gemeinde verbringt."],["Frist","Innert 14 Tagen nach dem Zuzug bei den Einwohnerdiensten der Stadt Bern."],["Heimatausweis","Zur Anmeldung gehört eine Bescheinigung über den auswärtigen Aufenthalt Ihrer Wohnsitzgemeinde. Wegen einer Gesetzesänderung werden diese künftig nicht mehr ausgestellt; stellt Ihre Gemeinde keine mehr aus, können Sie sie weglassen."],["Steuern","Bei Ledigen wird vermutet, dass der Lebensmittelpunkt am Wochenaufenthaltsort liegt. Sie können das widerlegen, wenn Sie regelmässig an den freien Tagen zurückkehren und dort besonders enge familiäre und soziale Beziehungen pflegen."]],"steps":["Bei der Wohnsitzgemeinde einen Heimatausweis verlangen (falls sie noch einen ausstellt).","Online-Formular «Zuzug Wochenaufenthalt» der Stadt Bern ausfüllen und allfällige Gebühren online bezahlen.","Läuft der Wochenaufenthalt länger, ihn mit dem Formular «Verlängerung Wochenaufenthalt» verlängern."],"who":[0,0,1],"note":"Anmeldung und Register führt die Gemeinde, in der Stadt Bern die Einwohnerdienste, Migration und Fremdenpolizei. Die Steuerfragen beurteilt die Steuerverwaltung.","src":["Stadt Bern: Wochenaufenthalt","Stadt Bern: Online-Formular Zuzug Wochenaufenthalt","Stadt Bern: Verlängerung Wochenaufenthalt","Stadt Bern: Zuzug, Umzug und Wegzug"]},"kir":{"intro":"Im Kanton Bern treten Sie mit einem persönlich unterschriebenen Brief an Ihre Kirchgemeinde aus einer Landeskirche aus. Mit dem Austritt endet die Kirchensteuerpflicht; für das laufende Jahr zahlen Sie anteilsmässig.","facts":[["Form","Schriftlich per Brief mit eigenhändiger Unterschrift. Eine E-Mail genügt nicht. Inhalt: klare Austrittserklärung, Name, Adresse und Geburtsdatum."],["Adresse","An den Kirchgemeinderat Ihrer Kirchgemeinde oder an die Stelle, die er dafür bestimmt hat (zum Beispiel für die Katholiken der Stadt Bern: Röm.-kath. Gesamtkirchgemeinde Bern, Frohbergweg 4, 3012 Bern)."],["Wirksam","Ab dem Tag, an dem Sie die Erklärung der zuständigen Stelle, der Schweizerischen Post oder einer Schweizer Vertretung im Ausland übergeben."],["Kirchensteuer","Die Kirchensteuerpflicht endet mit der rechtsgültigen Austrittserklärung. Treten Sie während des Jahres aus, wird die Kirchensteuer anteilsmässig (pro rata) erhoben."]],"steps":["Austrittsbrief schreiben: Austrittsabsicht, Name, Adresse, Geburtsdatum, eigenhändige Unterschrift.","Per Post an den Kirchgemeinderat Ihrer Kirchgemeinde schicken.","Bei der nächsten Steuererklärung wird die Kirchensteuer ab dem Austritt nicht mehr erhoben."],"who":[0,1,0],"note":"Die Regeln zum Austritt und zur Kirchensteuer legt der Kanton Bern fest. Entgegen nimmt den Austritt die Kirchgemeinde.","src":["Kanton Bern: Verordnung zur Zugehörigkeit zu einer Landeskirche","Kanton Bern TaxInfo: Kirchensteuer","Kath. Kirche Region Bern: Kircheneintritt und -austritt"]},"dieb":{"intro":"Ein gestohlenes Velo melden Sie im Kanton Bern rund um die Uhr online über Suisse ePolice. Halten Sie Marke, Modell, Farbe und Rahmennummer bereit. Sie können den Diebstahl auch auf einer Polizeiwache anzeigen.","facts":[["Online","Über Suisse ePolice, rund um die Uhr. Möglich für gestohlene Velos, Mofas, Skis, Snowboards, elektronische Geräte und Kontrollschilder."],["Angaben","Marke, Modell, Farbe und Rahmennummer. Die Kantonspolizei empfiehlt, diese Merkmale schon vorher zu notieren und aufzubewahren."],["Fahndung","Gemeldete gestohlene Velos werden an die nationalen und internationalen Fahndungssysteme übermittelt."],["Polizeiwache","Alternativ Anzeige auf einer Polizeiwache. Mitnehmen: amtlicher Ausweis mit Foto und die passenden Unterlagen."]],"steps":["Rahmennummer, Marke, Modell und Farbe heraussuchen (zum Beispiel aus dem Kaufbeleg).","Diebstahl online über Suisse ePolice melden.","Oder auf einer Polizeiwache der Kantonspolizei Bern anzeigen, mit amtlichem Ausweis."],"who":[0,1,0],"note":"Anzeigen nimmt die Kantonspolizei entgegen. Suisse ePolice ist die gemeinsame Online-Wache mehrerer Kantone.","src":["Kantonspolizei Bern: Online-Wache Anzeigen","Kantonspolizei Bern: Diebstahl und Raub","Suisse ePolice","ch.ch: Anzeige erstatten"]},"vor":{"intro":"Einen Vorsorgeauftrag schreiben Sie von Hand oder lassen ihn notariell beurkunden. Im Kanton Bern können Sie beim Zivilstandsamt eintragen lassen, wo er hinterlegt ist; das kostet CHF 75. So findet ihn die KESB im Bedarfsfall.","facts":[["Form","Von Anfang bis Ende von Hand geschrieben, datiert und unterschrieben (wie ein Testament) oder von einer Notarin oder einem Notar öffentlich beurkundet."],["Hinterlegungsort","Das Zivilstandsamt trägt ein, wo der Vorsorgeauftrag aufbewahrt wird. Die Kindes- und Erwachsenenschutzbehörde (KESB) kann diese Angabe im Bedarfsfall abrufen."],["Kosten","Eintrag CHF 75. Bestätigung des Eintrags auf Wunsch CHF 30."],["Wo","Bei einem Zivilstandsamt Ihrer Wahl im Kanton Bern."]],"steps":["Vorsorgeauftrag von Hand schreiben, datieren und unterschreiben oder notariell beurkunden lassen.","Aufbewahrungsort festlegen.","Termin bei einem Zivilstandsamt vereinbaren oder das schriftliche Ges
