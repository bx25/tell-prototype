 votre caisse-maladie et votre facture de primes baisse."],"who":[1,1,0],"note":"La Confédération impose la réduction des primes dans la loi sur l’assurance-maladie et y contribue ; dans le canton de Berne, l’Office des assurances sociales (OAS) examine et décide.","src":["Canton de Berne (OAS) : droit à la réduction des primes","Canton de Berne (OAS) : quand déposer une demande","Canton de Berne (OAS) : feuille d’information réduction des primes 2026","Canton de Berne (OAS) : calculer le droit"]},"wpe":{"intro":"Oui. Qui n’accomplit pas, ou pas entièrement, son service militaire ou civil paie la taxe d’exemption de l’obligation de servir : 3 % du revenu imposable de l’impôt fédéral direct, au moins CHF 400 par an. Dans le canton de Berne, l’Office de la sécurité civile, du sport et des affaires militaires (OSSM) est compétent.","facts":[["Montant","3 % du revenu imposable de l’impôt fédéral direct, au moins CHF 400 par an."],["Durée","De 19 à 37 ans, au maximum 11 années de taxe."],["Protection civile","Qui fait du service de protection civile paie quand même, mais 4 % de moins par jour de service accompli dans l’année."],["Remboursement","Qui rattrape son service militaire ou civil et accomplit son obligation de servir est remboursé. Le droit se prescrit 5 ans après la fin de l’obligation de servir."]],"steps":["Déposer la déclaration d’impôt comme d’habitude : la taxe se calcule sur le revenu imposable de l’impôt fédéral direct.","La facture vient du service cantonal, dans le canton de Berne de l’OSSM.","En cas de handicap important et de revenu bas : faire examiner une exonération.","Service rattrapé : une fois l’obligation de servir accomplie, demander le remboursement à l’OSSM."],"who":[1,1,0],"note":"La taxe d’exemption est une contribution fédérale (AFC) ; les cantons, à Berne l’Office de la sécurité civile, du sport et des affaires militaires, la taxent et la perçoivent.","src":["AFC : la taxe d’exemption expliquée","Canton de Berne (OSSM) : taxe d’exemption","Canton de Berne (OSSM) : remboursement","ch.ch : taxe d’exemption de l’obligation de servir"]},"bau":{"intro":"Pas forcément. Dans le canton de Berne, un abri de jardin n’a pas besoin de permis de construire s’il mesure au plus 10 m² de surface et 2,5 m de haut, n’est pas chauffé, n’est ni habité ni utilisé à des fins commerciales et dépend d’un bâtiment principal. S’il est plus grand, vous déposez une demande de permis via eBau.","facts":[["Sans permis","Petite construction non chauffée jusqu’à 10 m² de surface et 2,5 m de haut, ni habitée ni commerciale, liée à un bâtiment principal (art. 6 du décret sur la procédure d’octroi du permis de construire)."],["À respecter quand même","Même sans permis, des règles s’appliquent, par exemple distances, protection incendie et prescriptions énergétiques."],["Exception","Hors de la zone à bâtir, même une petite construction exige un permis si elle modifie sensiblement les lieux, charge l’équipement ou porte atteinte à l’environnement."],["Demande de permis","Depuis mars 2022, uniquement par voie électronique via eBau dans tout le canton de Berne."]],"steps":["Vérifier les dimensions : au plus 10 m² de surface, 2,5 m de haut, non chauffé, uniquement pour entreposer.","Respecter les distances à la limite ainsi que la protection incendie et les prescriptions énergétiques.","En cas de doute, se renseigner auprès de l’inspection des constructions de la ville de Berne, qui répond aussi aux demandes préalables.","Si l’abri est plus grand ou qu’une condition n’est pas remplie : déposer la demande de permis par voie électronique via eBau."],"who":[0,1,1],"note":"Le canton fixe dans le décret sur la procédure d’octroi du permis de construire quelles constructions sont libres de permis ; en ville de Berne, l’inspection des constructions renseigne et examine les demandes.","src":["Canton de Berne : décret sur la procédure d’octroi du permis de construire (RSB 725.1), art. 6","Ville de Berne : quand faut-il un permis de construire ?","Ville de Berne : procédure de permis de construire"]},"lost":{"intro":"Annoncez la perte en personne : à un poste de police ou directement lors du rendez-vous au centre de documents d’identité, quand vous commandez le nouveau document. L’annonce de perte coûte CHF 40 dans le canton de Berne. Ensuite, l’ancien document n’est plus valable, même si vous le retrouvez.","facts":[["Annonce","En personne à un poste de police ou au centre de documents d’identité lors du rendez-vous pour le nouveau document."],["Coûts","Annonce de perte dans le canton de Berne : CHF 40. S’y ajoute le nouveau document au prix normal, par exemple carte d’identité adulte CHF 70."],["Validité","Avec l’annonce, le document devient invalide. Si vous le retrouvez, vous ne pouvez plus l’utiliser et le remettez au bureau des passeports."],["Nouveau document","Comme tout document : demande en ligne sur schweizerpass.ch, puis rendez-vous au centre de documents d’identité."]],"steps":["Annoncer la perte en personne : à un poste de police (vous recevez une déclaration de perte) ou directement lors du rendez-vous au centre de documents d’identité.","Demander le nouveau document en ligne sur schweizerpass.ch et réserver un rendez-vous dans un centre bernois.","Apporter au rendez-vous la déclaration de perte de la police, si vous l’avez annoncée là-bas.","Si l’ancien document réapparaît : ne plus l’utiliser et le remettre au bureau des passeports."],"who":[1,1,0],"note":"La Confédération (fedpol) est compétente pour les documents d’identité ; la perte est annoncée à la police ou aux centres cantonaux, dans le canton de Berne aussi aux sept centres de documents d’identité.","src":["Canton de Berne : perte de la carte d’identité ou du passeport","ch.ch : passeport ou carte d’identité perdu ou volé","fedpol : perte de documents d’identité"]},"kita":{"intro":"En ville de Berne, vous recevez des bons de garde pour une crèche reconnue si vous travaillez ensemble au moins 105 % (familles monoparentales 5 %) et que le revenu familial déterminant est inférieur à CHF 170 000. La demande se fait en ligne via kiBon ; le bon vaut à partir du mois qui suit la demande complète.","facts":[["Conditions","Domicile en ville de Berne, crèche ou organisation de familles de jour admise au système cantonal des bons de garde, enfant de 3 mois jusqu’à la fin de l’école enfantine."],["Taux d’activité","Les deux parents ensemble au moins 105 %, familles monoparentales au moins 5 %."],["Revenu","Période du 1er août 2026 au 31 juillet 2027 : revenu familial déterminant inférieur à CHF 170 000."],["Début","Le bon ne vaut qu’à partir du mois qui suit la réception de la demande complète, sans effet rétroactif."]],"steps":["Estimer le montant du bon avec le calculateur de la ville de Berne.","Choisir une crèche admise au système cantonal des bons de garde.","Déposer la demande en ligne via kiBon (ou sur papier), avec des justificatifs du taux d’activité comme contrat de travail ou relevé d’heures.","Déposer la demande tôt et complète, car le bon ne vaut qu’à partir du mois suivant."],"who":[0,1,1],"note":"Le canton de Berne règle le système des bons de garde et exploite kiBon ; la ville de Berne examine les demandes, émet les bons et verse son propre supplément.","src":["Ville de Berne : bons de garde","Ville de Berne : FAQ sur les bons de garde","Ville de Berne : calculateur de bons","Canton de Berne (DSSI) : bons de garde"]},"soz":{"intro":"En ville de Berne, vous vous annoncez en personne au service social, Schwarztorstrasse 71, avec une pièce d’identité officielle. Vous y recevez une liste personnelle des documents nécessaires. Le calculateur d’aide sociale de la ville de Berne donne une première estimation du droit.","facts":[["Annonce","En personne au service social de la ville de Berne, Schwarztorstrasse 71, avec une pièce d’identité officielle. Les nouveaux arrivants pas encore inscrits au contrôle des habitants apportent une copie du bail."],["Documents","Le formulaire de demande indique les documents habituels ; au guichet, vous recevez une liste personnelle et une procuration."],["Montant","Selon les normes de la CSIAS, échelonné selon la taille du ménage. Le calculateur d’aide sociale de la ville de Berne donne une première estimation."],["Remboursement","L’aide sociale peut être réclamée plus tard si les conditions du remboursement sont remplies."]],"steps":["Vérifier avec le calculateur d’aide sociale de la ville de Berne si un droit est possible.","S’annoncer en personne au service social, Schwarztorstrasse 71, avec une pièce d’identité (nouveaux arrivants : copie du bail).","Remplir le formulaire de demande et remettre les documents selon la liste.","Signer la procuration et la remettre avec la demande."],"who":[0,1,1],"note":"Le canton de Berne règle l’aide sociale et s’appuie sur les normes CSIAS ; votre demande relève du service social de votre commune de domicile, à Berne du service social de la ville.","src":["Ville de Berne : s’annoncer à l’aide sociale","Ville de Berne : qui peut demander l’aide sociale ?","Ville de Berne : calculateur d’aide sociale","Ville de Berne : aide sociale et service social"]},"el":{"intro":"Oui, si la rente et vos autres revenus ne couvrent pas vos besoins vitaux et que votre fortune nette est inférieure à CHF 100 000 (couples CHF 200 000). Dans le canton de Berne, vous remettez le formulaire d’inscription à l’agence AVS de votre commune de domicile ; la caisse de compensation du canton de Berne décide.","facts":[["Fortune","Fortune nette inférieure à CHF 100 000 pour une personne seule, à CHF 200 000 pour un couple marié."],["Besoins vitaux","Dès 2027 (personnes vivant à domicile) : CHF 21 000 par an pour une personne seule, CHF 31 500 pour un couple."],["Inscription","Remettre le formulaire officiel d’inscription à l’agence AVS de votre commune de domicile."],["Compétence","La caisse de compensation du canton de Berne examine la demande et décide."]],"steps":["Télécharger et remplir le formulaire d’inscription aux prestations complémentaires de la caisse de compensation du canton de Berne.","Joindre les justificatifs demandés dans le formulaire.","Remettre le formulaire à l’agence AVS de votre commune de domicile (ici Thoune).","La caisse de compensation examine revenus et fortune et vous communique sa décision."],"who":[1,1,1],"note":"La Confédération règle les prestations complémentaires et fixe les montants ; la caisse de compensation du canton de Berne décide, l’agence AVS de la commune reçoit l’inscription.","src":["Caisse de compensation du canton de Berne : prestations complémentaires","ahv-iv.ch : mémento 5.01 prestations complémentaires","Caisse de compensation du canton de Berne : formulaire d’inscription PC","Conseil fédéral : adaptations au 1.1.2027 (2.10.2026)"]},"iv":{"intro":"Annoncez-vous à l’office AI du canton de Berne, et tôt : une rente AI est versée au plus tôt 6 mois après l’inscription. L’AI examine d’abord si des mesures peuvent vous aider à rester dans la vie active (la réadaptation prime la rente).","facts":[["Détection précoce","Dès 30 jours d’incapacité de travail ou en cas d’absences brèves fréquentes, une communication à l’office AI est possible, par exemple par l’employeur. On y clarifie si une inscription est nécessaire."],["Rente","Au plus tôt 6 mois après l’inscription. Condition : une année d’incapacité de travail d’au moins 40 % en moyenne, puis une incapacité de gain d’au moins 40 %."],["Priorité","La réadaptation prime la rente : l’AI examine d’abord des mesures qui maintiennent ou améliorent votre capacité de gain."],["Déroulement","Après l’inscription, l’office AI vous invite à un premier entretien et recueille des informations sur votre santé."]],"steps":["Remplir le formulaire d’inscription à l’AI.","Remettre l’inscription à l’office AI du canton de Berne, pas trop tard, car la rente commence au plus tôt 6 mois après.","Se rendre au premier entretien. L’AI recueille les informations nécessaires sur votre santé.","Participer aux mesures de réadaptation. L’AI ne décide d’une rente que si elles ne suffisent pas."],"who":[1,1,0],"note":"L’assurance-invalidité est une assurance fédérale (OFAS) ; elle est appliquée par les offices AI cantonaux, à Berne par l’office AI du canton de Berne.","src":["Office AI du canton de Berne : inscription et procédure","Office AI du canton de Berne : détection précoce et réadaptation","ahv-iv.ch : mémento 4.04 rentes d’invalidité","ch.ch : assurance-invalidité"]},"mse":{"intro":"Si vous exerciez une activité lucrative avant l’accouchement, vous recevez pendant 14 semaines l’allocation de maternité : 80 % de votre revenu moyen, au maximum CHF 220 par jour. Vous la demandez à la caisse de compensation AVS.","facts":[["Droit","Assurée à l’AVS durant les 9 mois précédant l’accouchement et avoir exercé une activité lucrative pendant au moins 5 mois durant cette période. Être salariée, indépendante ou au chômage à la naissance."],["Montant","80 % du revenu moyen avant l’accouchement, au maximum CHF 220 par jour. Les salariées atteignent le maximum dès un salaire mensuel de CHF 8 250."],["Durée","98 jours (14 semaines) dès la naissance. Si vous reprenez une activité lucrative plus tôt, le droit prend fin. Si l’enfant reste au moins 2 semaines à l’hôpital juste après la naissance, la durée est prolongée de 56 jours au plus."],["Délai","Le droit peut être exercé jusqu’à 5 ans après la fin du congé de maternité."]],"steps":["Remplir le formulaire « Demande d’allocation de maternité » (318.750).","Si vous êtes salariée : l’employeur atteste la durée de l’emploi et le salaire.","Remettre la demande à la caisse de compensation AVS compétente, celle à laquelle les dernières cotisations ont été versées."],"who":[1,0,0],"note":"L’allocation de maternité fait partie du régime fédéral des allocations pour perte de gain (APG, OFAS). Elle est versée par les caisses de compensation AVS.","src":["OFAS : APG en cas de maternité","ahv-iv.ch : mémento 6.02 allocation de maternité","OFAS : quand ai-je droit ?","ch.ch : congé de maternité"]},"pat":{"intro":"En tant que père (ou épouse de la mère), vous avez droit à 2 semaines de congé payé, à prendre dans les 6 mois suivant la naissance. L’allocation s’élève à 80 % du revenu, au maximum CHF 220 par jour. Elle n’est pas versée automatiquement : il faut la demander.","facts":[["Droit","Père juridique de l’enfant ou épouse de la mère. Assuré à l’AVS durant les 9 mois précédant la naissance et avoir exercé une activité lucrative pendant au moins 5 mois durant cette période."],["Durée","2 semaines (10 jours de travail), en bloc ou par journées. À prendre dans les 6 mois suivant la naissance ; ensuite, les jours non pris sont perdus."],["Montant","80 % du revenu moyen avant la naissance, au maximum CHF 220 par jour. Pour 2 semaines, 14 indemnités journalières sont versées, soit au maximum CHF 3 080."],["Demande","Formulaire « Demande d’allocation à l’autre parent » (318.747) auprès de la caisse de compensation AVS compétente. Pour les salariés, c’est en règle générale l’employeur qui la transmet."]],"steps":["Planifier le congé avec l’employeur et le prendre dans les 6 mois suivant la naissance.","Remplir le formulaire 318.747.","Salarié : remettre le formulaire à l’employeur, qui le transmet à sa caisse de compensation. Indépendant : directement à votre caisse de compensation."],"who":[1,0,0],"note":"L’allocation à l’autre parent fait partie du régime fédéral des allocations pour perte de gain (APG, OFAS). Elle est versée par les caisses de compensation AVS.","src":["OFAS : APG en cas de paternité","ahv-iv.ch : mémento 6.04 allocation à l’autre parent","OFAS : quand ai-je droit ?","ch.ch : congé de paternité"]},"lfa":{"intro":"Le permis d’élève conducteur pour la voiture (catégorie B) s’obtient dès 17 ans. Dans le canton de Berne, vous déposez la demande en personne avec le test de la vue, l’attestation de premiers secours et une photo d’identité. Après avoir réussi l’examen théorique de base, vous recevez le permis d’élève.","facts":[["Âge","Catégorie B dès 17 ans. L’examen théorique de base est possible au plus tôt un mois avant l’âge minimum."],["Conditions","Cours de premiers secours (attestation valable 6 ans), test de la vue chez un opticien ou un ophtalmologue reconnu (valable 2 ans), photo d’identité."],["Coûts","Canton de Berne : demande CHF 30, établissement du permis d’élève CHF 20, examen théorique de base CHF 30."],["Phase d’apprentissage","Le permis d’élève B est valable 24 mois. Qui l’obtient avant ses 20 ans doit le détenir au moins 12 mois avant l’examen pratique."]],"steps":["Suivre le cours de premiers secours et faire le test de la vue.","Remplir le formulaire de demande et le déposer en personne avec photo, pièce d’identité originale et attestation de premiers secours : dans un site de l’office de la circulation routière (OCRN), un poste de police ou à l’administration communale.","Réserver une date pour l’examen théorique de base avec le numéro de référence de la lettre d’admission.","Après l’examen réussi, vous recevez le permis d’élève (aussi possible en version électronique sur le téléphone)."],"who":[1,1,0],"note":"Les règles (âge minimum, phase d’apprentissage) sont fixées par la Confédération (OFROU). Demande, examen et permis passent par l’office cantonal de la circulation routière, à Berne l’OCRN.","src":["OCRN Berne : demander un permis d’élève","OCRN Berne : émoluments","OCRN Berne : informations pour les élèves conducteurs","OFROU : questions et réponses sur la formation"]},"wsb":{"intro":"En ville de Berne, vous commandez l’attestation de domicile en ligne ou la retirez au guichet du contrôle des habitants. Elle coûte CHF 20.","facts":[["Coût","CHF 20, identique pour les Suisses, les ressortissants UE/AELE et des États tiers. En ligne, vous payez à la fin de la commande (Mastercard, Visa, PostFinance)."],["Utilité","Par exemple pour des bourses, des assurances ou la naturalisation."],["Guichet","Einwohnerdienste, Migration und Fremdenpolizei, Predigergasse 5, 3011 Berne. Du lundi au vendredi de 10 h à 16 h, le jeudi jusqu’à 18 h."]],"steps":["Remplir le formulaire en ligne « Bestellung Wohnsitzbescheinigung » de la ville de Berne.","Payer en ligne à la fin.","Ou sans commande en ligne : la retirer au guichet du contrôle des habitants, Predigergasse 5."],"who":[0,0,1],"note":"Les attestations de domicile sont délivrées par la commune de domicile, en ville de Berne par les Einwohnerdienste, Migration und Fremdenpolizei.","src":["Ville de Berne : attestation de domicile","Ville de Berne : commande en ligne","Ville de Berne : contact contrôle des habitants"]},"tod":{"intro":"Un décès doit être annoncé à l’office de l’état civil dans les 2 jours. Si la personne meurt à domicile, appelez d’abord un médecin pour le certificat de décès. En ville de Berne, vous annoncez aussi le décès à l’office des inhumations, vous-même ou par une entreprise de pompes funèbres.","facts":[["Délai","Dans les 2 jours, à l’office de l’état civil du lieu du décès."],["Hôpital ou home","Si la personne meurt à l’hôpital ou dans un home, l’établissement annonce le décès à l’office de l’état civil."],["Documents","Passeport ou carte d’identité de la personne qui annonce, certificat médical de décès, si disponible livret de famille ou certificat de famille."],["Inhumation gratuite","Ville de Berne : pour les habitants sans succession suffisante (en règle générale moins de CHF 8 000), la ville prend en charge une inhumation simple. Les proches font la demande en même temps que l’annonce du décès."]],"steps":["Décès à domicile : appeler un médecin et demander le certificat médical de décès.","Annoncer le décès dans les 2 jours à l’office de l’état civil du lieu du décès (à l’hôpital ou au home, l’établissement s’en charge).","Annoncer le décès à l’office des inhumations de la ville de Berne, vous-même ou par une entreprise de pompes funèbres. L’office organise la crémation ou l’inhumation.","Régler les autres démarches (employeur, assurances, banques, succession) avec la liste de contrôle de ch.ch."],"who":[0,1,1],"note":"L’enregistrement du décès relève de l’office cantonal de l’état civil. L’inhumation et le cimetière relèvent de la commune, en ville de Berne de l’office des inhumations (Predigergasse 5).","src":["Canton de Berne : décès (état civil)","Ville de Berne : annonce d’un décès","Ville de Berne : inhumation gratuite","ch.ch : liste de contrôle en cas de décès"]},"pk":{"intro":"En ville de Berne, vous demandez la carte de stationnement pour résidents en ligne. Elle vaut dans votre zone et coûte selon la ville CHF 264 par an (CHF 22 par mois).","facts":[["Conditions","Vous êtes annoncé dans la zone comme habitant ou en séjour hebdomadaire et figurez en premier, avec nom et adresse, sur le permis de circulation. Les cartes sont délivrées pour des voitures automobiles légères, en règle générale des voitures de tourisme."],["Coûts","CHF 264 par an, CHF 22 par mois."],["Validité","Un an à partir du mois d’émission, au minimum 3 mois. Si vous rendez la carte plus tôt, l’émolument des mois entiers non utilisés est remboursé (pas pour la durée minimale de 3 mois)."],["Zone","La carte vaut uniquement dans la zone autorisée."]],"steps":["Vérifier si votre adresse se trouve dans une zone de cartes de stationnement.","Remplir le formulaire en ligne « Anwohnerparkkarte » de la ville de Berne.","Payer l’émolument électroniquement. La carte arrive par la poste."],"who":[0,0,1],"note":"Les cartes de stationnement relèvent de la commune, en ville de Berne de la police locale et du commerce (inspection de police).","src":["Ville de Berne : cartes de stationnement des quartiers","Ville de Berne : formulaire en ligne","Ville de Berne : cartes de stationnement en ligne"]},"spg":{"intro":"En ville de Berne, il y a trois possibilités : déposer les petits encombrants avec une vignette le jour de ramassage des ordures, apporter les plus grands dans une déchetterie ou les faire enlever par le service d’enlèvement (CHF 70.27 forfait).","facts":[["Petits encombrants","Objets combustibles jusqu’à 100 × 50 × 50 cm et 25 kg (par ex. balais, petits meubles, tapis) : avec une vignette, à côté des sacs taxés le jour de ramassage. 10 vignettes coûtent CHF 44.10."],["Déchetteries","Fellerstrasse 13a et Schermen (Wölflistrasse 17). Du lundi au vendredi de 8 h à 12 h et de 13 h à 18 h 30, le samedi de 8 h à 15 h."],["Service d’enlèvement","CHF 70.27 forfait, 5 minutes de chargement comprises ; chaque tranche supplémentaire de 5 minutes CHF 54.05. Votre présence n’est pas nécessaire."],["Inscription","Jusqu’à 11 h 30 le jour ouvrable précédant l’enlèvement ; pour le lundi, jusqu’au vendredi 11 h 30. Enlèvement le lundi, mardi, jeudi et vendredi."]],"steps":["Vérifier la taille : jusqu’à 100 × 50 × 50 cm et 25 kg, c’est un petit encombrant.","Petit encombrant : acheter une vignette et le déposer à côté des sacs taxés le jour de ramassage.","Encombrant plus grand : l’apporter à la déchetterie Fellerstrasse ou Schermen, ou commander le service d’enlèvement jusqu’à 11 h 30 le jour ouvrable précédent."],"who":[0,0,1],"note":"L’élimination des déchets relève de la commune, en ville de Berne d’Entsorgung + Recycling Stadt Bern (ERB).","src":["Ville de Berne : encombrants","Ville de Berne : service d’enlèvement","Ville de Berne : petits encombrants","Ville de Berne : déchetteries"]},"fund":{"intro":"Si vous avez perdu quelque chose en ville de Berne, annoncez la perte en ligne au bureau des objets trouvés ; il vous contacte dès que l’objet arrive. Vous avez trouvé quelque chose ? Apportez-le au bureau, Theatergässchen 2.","facts":[["Annoncer une perte","En ligne pour les pertes sur le territoire de la ville. Parapluies, vêtements (sauf vestes) et livres ne peuvent pas être annoncés en ligne ; contactez directement le bureau (031 321 50 50)."],["Retrait","Le bureau remet l’objet si la description et les circonstances de la perte correspondent aux indications de la personne qui l’a trouvé. Les objets sont conservés un an."],["Récompense","En règle générale 10 % de la valeur, réduite de manière appropriée pour les objets de grande valeur. Pas de récompense pour les objets trouvés dans une maison, les objets volés et ceux trouvés dans des commerces."],["Bureau","Theatergässchen 2, 3011 Berne. Du lundi au vendredi de 10 h à 16 h, le jeudi jusqu’à 18 h."]],"steps":["Perte : remplir l’annonce de perte en ligne auprès du bureau des objets trouvés de la ville de Berne.","Quand le bureau vous contacte, retirer l’objet au Theatergässchen 2.","Objet trouvé : l’apporter au bureau. Si personne ne se manifeste dans l’année, vous pouvez le recevoir contre un émolument de garde d’environ 5 % de la valeur estimée."],"who":[0,0,1],"note":"Les objets trouvés relèvent de la commune, en ville de Berne du bureau des objets trouvés (inspection de police). Les règles sur la trouvaille et la récompense figurent dans le Code civil.","src":["Ville de Berne : bureau des objets trouvés","Ville de Berne : contact","Ville de Berne : ordonnance sur les objets trouvés","ch.ch : objets trouvés"]},"bet":{"intro":"Si quelqu’un ne paie pas une facture, vous déposez une réquisition de poursuite à l’office des poursuites du domicile du débiteur. Vous avancez les frais ; si la poursuite est justifiée, ils sont ensuite à la charge de l’autre partie. Dans le canton de Berne, ce sont les offices des poursuites (OPF).","facts":[["Où","Office des poursuites du domicile du débiteur. Vous pouvez remplir la réquisition en ligne via le guichet des poursuites."],["Coûts","En tant que créancier, vous avancez les frais de chaque étape. Les émoluments sont les mêmes dans toute la Suisse et dépendent du montant de la créance."],["Commandement de payer","L’office notifie un commandement de payer à l’autre partie. Elle a 20 jours pour payer et 10 jours pour former opposition."],["Opposition","Si l’autre partie forme opposition, un tribunal décide, sur votre requête, si la poursuite peut continuer."]],"steps":["Remplir la réquisition de poursuite (en ligne au guichet des poursuites ou avec le formulaire officiel de la Confédération).","La déposer à l’office des poursuites du domicile de l’autre partie et payer l’avance de frais.","Sans paiement ni opposition : déposer la réquisition de continuer la poursuite. En cas d’opposition : demander au tribunal la mainlevée."],"who":[1,1,0],"note":"Le droit des poursuites (LP) et les émoluments sont fixés par la Confédération. Les poursuites sont menées par les offices des poursuites, dans le canton de Berne par les offices des poursuites et des faillites.","src":["ch.ch : poursuite","Canton de Berne : offices des poursuites et des faillites","Office fédéral de la justice : formulaires LP"]},"abm":{"intro":"Dans le canton de Berne, la mise hors circulation est gratuite : vous envoyez le permis de circulation original avec la mention « annuler » à l’office de la circulation routière (OCRN). Si vous n’immatriculez pas d’autre véhicule dans les 14 jours, rendez aussi les plaques.","facts":[["Coûts","La mise hors circulation est gratuite. Faire entreposer les plaques pendant un an coûte CHF 30 ; l’émolument de remise en circulation tombe alors."],["Plaques","Depuis le 1er mars 2025, vous devez indiquer au retour si l’OCRN doit entreposer ou éliminer les plaques. Sans indication, elles sont éliminées."],["Impôt et assurance","Pendant le dépôt des plaques, vous ne payez ni assurance responsabilité civile ni impôt sur les véhicules. L’impôt payé en trop est compensé et un solde est remboursé ; la date déterminante est l’arrivée des plaques à l’OCRN."],["Adresse","SVSA Verkehrszulassung, Schermenweg 5, case postale, 3001 Berne."]],"steps":["Noter « annuler » sur le permis de circulation original.","Envoyer le permis par la poste à l’OCRN. Si vous n’immatriculez pas de nouveau véhicule dans les 14 jours : joindre les plaques ou les déposer dans une boîte de retour sur un site de l’OCRN.","Indiquer si les plaques doivent être entreposées (CHF 30, un an) ou éliminées."],"who":[1,1,0],"note":"Les règles d’admission sont fixées par la Confédération. Mise hors circulation, plaques et impôt passent par l’office cantonal de la circulation routière, à Berne l’OCRN.","src":["OCRN Berne : mettre un véhicule hors circulation","OCRN Berne : déposer les plaques","OCRN Berne : entreposage des plaques","ch.ch : immatriculer et mettre hors circulation"]},"wa":{"intro":"Si vous logez en semaine en ville de Berne et passez régulièrement vos jours libres dans une autre commune, annoncez-vous dans les 14 jours comme personne en séjour hebdomadaire, le plus simplement en ligne.","facts":[["Qui","Toute personne qui loge sur son lieu de travail, de formation ou d’études et passe régulièrement ses jours libres (en général le week-end) dans une autre commune."],["Délai","Dans les 14 jours après l’arrivée, auprès du contrôle des habitants de la ville de Berne."],["Attestation de domicile","L’annonce s’accompagne d’une attestation de séjour externe de votre commune de domicile. En raison d’une modification légale, ces attestations ne seront plus délivrées ; si votre commune n’en délivre plus, vous pouvez y renoncer."],["Impôts","Pour les personnes célibataires, on présume que le centre de vie se trouve au lieu de séjour hebdomadaire. Vous pouvez le réfuter si vous rentrez régulièrement les jours libres et y entretenez des liens familiaux et sociaux particulièrement étroits."]],"steps":["Demander une attestation à votre commune de domicile (si elle en délivre encore).","Remplir le formulaire en ligne « Zuzug Wochenaufenthalt » de la ville de Berne et payer les éventuels émoluments en ligne.","Si le séjour se prolonge, le prolonger avec le formulaire « Verlängerung Wochenaufenthalt »."],"who":[0,0,1],"note":"L’annonce et le registre relèvent de la commune, en ville de Berne des Einwohnerdienste, Migration und Fremdenpolizei. Les questions fiscales sont tranchées par l’administration fiscale.","src":["Ville de Berne : séjour hebdomadaire","Ville de Berne : formulaire en ligne d’arrivée","Ville de Berne : prolongation","Ville de Berne : arrivée, déménagement et départ"]},"kir":{"intro":"Dans le canton de Berne, vous quittez une Église nationale par une lettre signée personnellement adressée à votre paroisse. L’obligation de payer l’impôt ecclésiastique prend fin avec la sortie ; pour l’année en cours, vous payez au prorata.","facts":[["Forme","Par écrit, par lettre avec signature manuscrite. Un e-mail ne suffit pas. Contenu : déclaration claire de sortie, nom, adresse et date de naissance."],["Adresse","Au conseil de paroisse de votre paroisse ou au service qu’il a désigné (par ex. pour les catholiques de la ville de Berne : Röm.-kath. Gesamtkirchgemeinde Bern, Frohbergweg 4, 3012 Berne)."],["Effet","Dès le jour où vous remettez la déclaration au service compétent, à la Poste suisse ou à une représentation suisse à l’étranger."],["Impôt ecclésiastique","L’assujettissement prend fin avec la déclaration de sortie valable. En cas de sortie en cours d’année, l’impôt ecclésiastique est perçu au prorata."]],"steps":["Écrire la lettre de sortie : intention de sortir, nom, adresse, date de naissance, signature manuscrite.","L’envoyer par la poste au conseil de paroisse.","Lors de la prochaine déclaration d’impôt, l’impôt ecclésiastique n’est plus perçu à partir de la sortie."],"who":[0,1,0],"note":"Les règles sur la sortie et l’impôt ecclésiastique sont fixées par le canton de Berne. La sortie est reçue par la paroisse.","src":["Canton de Berne : ordonnance sur l’appartenance à une Église nationale","Canton de Berne TaxInfo : impôt ecclésiastique","Église catholique région de Berne : entrée et sortie"]},"dieb":{"intro":"Dans le canton de Berne, vous annoncez un vélo volé en ligne 24 h sur 24 via Suisse ePolice. Préparez la marque, le modèle, la couleur et le numéro de cadre. Vous pouvez aussi déposer plainte dans un poste de police.","facts":[["En ligne","Via Suisse ePolice, 24 h sur 24. Possible pour les vélos, cyclomoteurs, skis, snowboards, appareils électroniques et plaques de contrôle volés."],["Indications","Marque, modèle, couleur et numéro de cadre. La police cantonale recommande de noter ces caractéristiques à l’avance et de les conserver."],["Recherches","Les vélos volés annoncés sont transmis aux systèmes de recherche nationaux et internationaux."],["Poste de police","Autre possibilité : plainte dans un poste de police. À apporter : pièce d’identité officielle avec photo et les documents correspondants."]],"steps":["Retrouver le numéro de cadre, la marque, le modèle et la couleur (par ex. sur la quittance d’achat).","Annoncer le vol en ligne via Suisse ePolice.","Ou déposer plainte dans un poste de la police cantonale bernoise, avec une pièce d’identité officielle."],"who":[0,1,0],"note":"Les plaintes sont reçues par la police cantonale. Suisse ePolice est le poste de police en ligne commun de plusieurs cantons.","src":["Police cantonale bernoise : plaintes en ligne","Police cantonale bernoise : vol et brigandage","Suisse ePolice","ch.ch : déposer plainte"]},"vor":{"intro":"Un mandat pour cause d’inaptitude s’écrit à la main ou se fait authentifier par un notaire. Dans le canton de Berne, vous pouvez faire inscrire à l’office de l’état civil le lieu où il est déposé ; cela coûte CHF 75. Ainsi, l’APEA le trouve en cas de besoin.","facts":[["Forme","Entièrement écrit à la main, daté et signé (comme un testament) ou constitué en la forme authentique par un notaire."],["Lieu de dépôt","L’office de l’état civil inscrit l’endroit où le mandat est conservé. L’autorité de protection de l’enfant et de l’adulte (APEA) peut consulter cette information en cas de besoin."],["Coûts","Inscription CHF 75. Confirmation de l’inscription sur demande CHF 30."],["Où","Dans l’office de l’état civil de votre choix dans le canton de Berne."]],"steps":["Écrire le mandat à la main, le dater et le signer, ou le faire authentifier par un notaire.","Choisir le lieu de conservation.","Prendre rendez-vous dans un office de l’état civil ou remplir la demande écrite et l’envoyer à un office. Le lieu de dépôt est inscrit."],"who":[1,1,0],"note":"Le mandat pour cause d’inaptitude est réglé dans le Code civil. L’office cantonal de l’état civil inscrit le lieu de dépôt ; l’APEA l’examine et le met en œuvre en cas de besoin.","src":["Canton de Berne : mandat pour cause d’inaptitude (état civil)","Canton de Berne : inscrire le lieu de dépôt","APEA canton de Berne : mandat et directives anticipées"]},"aus":{"intro":"Un à deux mois avant l’échéance, vous recevez un avis d’échéance. Renvoyez-le rempli, avec les documents demandés, par e-mail ou par la poste aux Einwohnerdienste, Migration und Fremdenpolizei de la ville de Berne.","facts":[["Avis d’échéance","Arrive un à deux mois avant l’échéance de l’autorisation. Si vous n’en avez pas reçu, contactez vous-même le service (031 321 53 00)."],["Envoi","Rempli, avec les documents indiqués dans l’avis, par e-mail ou par la poste. Le traitement peut prendre du temps ; la ville vous contacte dès que l’autorisation est prolongée."],["Biométrie","Si nécessaire, vous recevez une invitation écrite pour donner vos données biométriques dans un centre de documents d’identité."],["Validité B","Canton de Berne : en règle générale 5 ans pour les ressortissants UE/AELE, 1 an pour les ressortissants d’États tiers."]],"steps":["Attendre l’avis d’échéance (un à deux mois avant) et le remplir.","L’envoyer avec les documents demandés par e-mail ou par la poste au service de la ville de Berne.","Si vous êtes invité : donner vos données biométriques au centre. Le nouveau titre suit."],"who":[1,1,1],"note":"Les règles sont fixées par la Confédération (SEM). En ville de Berne, les Einwohnerdienste, Migration und Fremdenpolizei reçoivent la prolongation ; le canton règle le titre de séjour.","src":["Ville de Berne : prolongation des autorisations","Canton de Berne : autorisation de séjour (permis B)","Ville de Berne : Einwohnerdienste, Migration und Fremdenpolizei"]},"nam":{"intro":"Après le divorce, vous gardez le nom porté pendant le mariage. Vous pouvez toutefois déclarer en tout temps devant l’office de l’état civil vouloir reprendre votre nom de célibataire. Dans le canton de Berne, cela coûte CHF 75.","facts":[["Délai","Aucun. La déclaration est possible en tout temps dès que le mariage n’existe plus."],["Où","Sur rendez-vous dans l’un des sept offices de l’état civil du canton de Berne ou dans tout autre office de l’état civil de Suisse."],["Coûts","Déclaration de nom CHF 75. Confirmation sur demande CHF 30. Paiement sur place."],["À distinguer","Si vous voulez un autre nom que votre nom de célibataire, il faut une demande de changement de nom auprès du canton."]],"steps":["Prendre rendez-vous dans un office de l’état civil.","Faire la déclaration de nom sur place et payer l’émolument."],"who":[1,1,0],"note":"Le droit du nom figure dans le Code civil. La déclaration est reçue par l’office cantonal de l’état civil.","src":["Canton de Berne : déclaration concernant le nom","ch.ch : nom après le divorce","Canton de Berne : changement de nom"]},"rat":{"intro":"Dans le canton de Berne, les impôts se paient de toute façon en trois tranches. Si l’argent ne suffit pas, demandez à l’Intendance des impôts une facilité de paiement, c’est-à-dire plus de temps ou des paiements partiels. Il n’y a pas de droit à l’obtenir, et l’intérêt moratoire continue de courir.","facts":[["Tranches","Les impôts cantonaux et communaux de l’année en cours sont facturés en trois tranches, échues le 20 mai, le 20 août et le 20 novembre, payables dans les 30 jours. Vous pouvez répartir vous-même les montants et payer par e-banking avec le numéro de référence de la facture QR."],["Facilité de paiement","Prolongation du délai ou paiements partiels, en ligne via BE-Login ou par écrit et motivé. Pas de droit à l’obtenir."],["Intérêt moratoire","Dès le 31e jour après l’échéance, aussi pendant une facilité de paiement. Il est facturé séparément après le dernier paiement partiel."],["Remise d’impôt","Possible pour des impôts taxés définitivement, mais les conditions sont strictes. Si vous ne les remplissez pas, il reste la facilité de paiement."]],"steps":["Vérifier si des paiements partiels sur les factures de tranches suffisent (la répartition libre est permise).","Sinon, demander une facilité de paiement : en ligne via BE-Login ou par lettre motivée à l’Intendance des impôts.","Effectuer ponctuellement les paiements convenus. L’intérêt moratoire est facturé séparément à la fin."],"who":[0,1,0],"note":"Dans le canton de Berne, la perception des impôts cantonaux, communaux et paroissiaux ainsi que de l’impôt fédéral direct relève de l’Intendance cantonale des impôts.","src":["Intendance des impôts Berne : facilités de paiement","Intendance des impôts Berne : payer les impôts","Intendance des impôts Berne : remise d’impôt"]},"kg":{"intro":"Dans le canton de Berne, tout enfant qui a quatre ans révolus au 31 juillet entre à l’école enfantine en août. Pas besoin de chercher un formulaire : la commune de domicile vous l’envoie automatiquement.","facts":[["Date de référence","4 ans révolus au 31 juillet inclus : entrée à l’école enfantine ou au cycle élémentaire en août de la même année."],["Durée","L’école enfantine dure en règle générale deux ans."],["Entrée plus tardive","Selon le développement de l’enfant, les parents peuvent le faire entrer en première année d’école enfantine un an plus tard. Ils l’indiquent sur le formulaire d’inscription."],["Ville de Berne","Questions : Schulamt de la ville de Berne, 031 321 64 60, schulamt@bern.ch."]],"steps":["Attendre le formulaire d’inscription de la commune ; il arrive automatiquement par la poste.","Remplir le formulaire. Si votre enfant doit entrer un an plus tard, l’indiquer sur le formulaire.","Renvoyer le formulaire. Votre enfant commence en août."],"who":[0,1,1],"note":"Les règles de l’école obligatoire sont fixées par le canton de Berne (Direction de l’instruction publique et de la culture). L’inscription et l’attribution relèvent de la commune, en ville de Berne du Schulamt.","src":["Canton de Berne : entrée à l’école obligatoire","Canton de Berne : information aux parents sur l’école enfantine","Ville de Berne : école"]},"ank":{"intro":"Si vous n’êtes pas marié avec la mère, vous reconnaissez l’enfant en personne à l’office de l’état civil, idéalement avant la naissance. Dans le canton de Berne, la reconnaissance coûte CHF 75.","facts":[["Moment","Possible avant ou après la naissance. Avant la naissance est recommandé."],["Déroulement","L’office de l’état civil vous dit quels documents sont nécessaires. Après réception, il vous convoque ; vous y déclarez la reconnaissance en personne et présentez passeport ou carte d’identité."],["Autorité parentale conjointe","La déclaration d’autorité parentale conjointe peut être faite avec la mère lors de la reconnaissance ou plus tard auprès de l’APEA du domicile de l’enfant."],["Coûts","Reconnaissance CHF 75. Acte de reconnaissance CHF 30 (plus frais de port éventuels)."]],"steps":["Demander à l’office de l’état civil quels documents remettre.","Remettre les documents et convenir du rendez-vous auquel l’office vous convoque.","Au rendez-vous, déclarer la reconnaissance en personne (passeport ou carte d’identité) et, si souhaité, déclarer avec la mère l’autorité parentale conjointe."],"who":[1,1,0],"note":"Le droit de la filiation figure dans le Code civil. La reconnaissance est reçue par l’office cantonal de l’état civil, une déclaration ultérieure d’autorité parentale par l’APEA.","src":["Canton de Berne : reconnaissance d’enfant","ch.ch : reconnaître un enfant","APEA canton de Berne : paternité et reconnaissance"]},"geb":{"intro":"Toute naissance doit être annoncée à l’office de l’état civil dans les trois jours. Si votre enfant naît à l’hôpital ou dans une maison de naissance, l’établissement s’en charge. Vous remplissez le formulaire « Annonce de naissance » avec le prénom et le nom de famille.","facts":[["Délai","Dans les trois jours suivant la naissance, à l’office de l’état civil du lieu de naissance."],["Qui annonce","L’hôpital ou la maison de naissance. En cas de naissance à domicile : médecin, sage-femme, une autre personne présente ou la mère."],["Noms","Les parents inscrivent le ou les prénoms et le nom de famille de l’enfant sur le formulaire d’annonce de naissance."],["Acte de naissance","À commander à l’office de l’état civil du lieu de naissance ; CHF 30 plus frais de port."]],"steps":["À l’hôpital ou à la maison de naissance : remplir le formulaire avec les noms, l’établissement annonce la naissance.","En cas de naissance à domicile : annoncer dans les trois jours à l’office de l’état civil du lieu de naissance, avec passeport ou carte d’identité, l’attestation de naissance du médecin ou de la sage-femme et, si disponible, le livret de famille.","Au besoin, commander l’acte de naissance à l’office de l’état civil."],"who":[1,1,0],"note":"Le droit de l’état civil est réglé par la Confédération (Code civil, ordonnance sur l’état civil). La naissance est enregistrée par l’office cantonal de l’état civil.","src":["Canton de Berne : naissance","Canton de Berne : formulaire d’annonce de naissance","ch.ch : annoncer une naissance"]},"fis":{"intro":"Dans le canton de Berne, vous obtenez le permis de pêche en ligne, dans l’app « Fischen Bern » ou dans l’une des plus de 30 agences. Les permis journaliers et hebdomadaires ne demandent aucun cours ; le permis annuel exige une attestation de compétences (SaNa).","facts":[["Permis annuel","Adultes domiciliés dans le canton de Berne : CHF 250 plus CHF 50 de contribution à l’entretien (les membres de la Fédération bernoise de pêche en sont exemptés). Sans domicile dans le canton : CHF 500 plus contribution. Jeunes de moins de 16 ans : CHF 72."],["Permis courts","Permis hebdomadaire CHF 100, journalier CHF 32. Disponibles sans cours préalable."],["Attestation de compétences","Nécessaire pour les permis annuels et mensuels. Le cours est proposé par le Réseau formation des pêcheurs."],["Achat","En ligne avec une adresse e-mail et carte de crédit, PostFinance Card ou Twint, dans l’app « Fischen Bern » ou dans une agence."]],"steps":["Choisir le permis : jour ou semaine sans cours ; année ou mois avec attestation de compétences.","Pour un permis annuel, suivre d’abord le cours SaNa du Réseau formation des pêcheurs.","Acheter le permis en ligne, dans l’app ou dans une agence, et respecter les prescriptions sur la pêche à la ligne."],"who":[1,1,0],"note":"Les règles de base (par ex. l’attestation de compétences) relèvent du droit fédéral. Les permis et les prix sont fixés par le canton de Berne, compétence de l’Inspection de la pêche.","src":["Canton de Berne : permis de pêche et prix","Canton de Berne : obtenir un permis de pêche","Canton de Berne : FAQ pêche à la ligne","Canton de Berne : app «Fischen Bern»"]},"gba":{"intro":"Dans le canton de Berne, vous commandez un extrait du registre foncier via le formulaire de commande en ligne des bureaux du registre foncier. Les données publiques d’un immeuble sont consultables gratuitement à tout moment dans GRUDIS public.","facts":[["GRUDIS public","Gratuit pour tous : désignation et description de l’immeuble, nom des propriétaires (sans adresse), forme de propriété, date d’acquisition, servitudes, charges foncières et mentions. Depuis le 1er septembre 2025, les renseignements sur la propriété ne sont plus fournis que par ce biais."],["Extrait public","Contient uniquement les données publiques. CHF 20 par immeuble ; chaque extrait supplémentaire pour les mêmes propriétaires, commandé en même temps, CHF 10."],["Extrait complet","CHF 20 par immeuble. Y ont droit les propriétaires, les titulaires de servitudes et les créanciers gagistes. Les autres doivent justifier d’un intérêt (par ex. une procuration), à téléverser lors de la commande."],["Autres émoluments","Copie de pièce justificative : CHF 20 jusqu’à 10 pages, puis CHF 1 par page, au plus CHF 100. Extrait du registre des propriétaires : CHF 20."]],"steps":["Vérifier si les données publiques de GRUDIS public suffisent ; c’est gratuit.","Sinon, choisir le type : extrait public ou extrait complet.","Remplir le formulaire de commande en ligne et, si vous n’y avez pas droit d’office, téléverser une justification d’intérêt."],"who":[1,1,0],"note":"Le registre foncier est régi par le Code civil (droit fédéral). Dans le canton de Berne, il est tenu par les bureaux cantonaux du registre foncier, qui fixent aussi les émoluments.","src":["Canton de Berne : commandes au registre foncier","Canton de Berne : GRUDIS public","Canton de Berne : FAQ registre foncier","Canton de Berne : renseignement sur la propriété"]},"zst":{"intro":"Dans le canton de Berne, vous commandez les documents d’état civil en ligne sur le site de l’office de l’état civil compétent ou directement au guichet. Le canton compte sept offices de l’état civil.","facts":[["Compétence","Pour les Suisses, l’office de l’état civil du lieu d’origine ; pour les étrangers, celui du lieu de domicile."],["Certificat individuel d’état civil","Données personnelles actuelles, état civil, nom et (pour les Suisses) lieux d’origine. CHF 30 plus frais de port. Il peut être commandé par la personne concernée."],["Autres documents","Acte d’origine CHF 30. Acte de naissance CHF 30. Certificat de famille CHF 40 ; après un nouvel événement d’état civil, il est mis à jour gratuitement. Certificat relatif à l’état de famille enregistré CHF 40 plus CHF 10 par personne inscrite. Chaque fois plus frais de port."],["Envoi à un tiers","Avec une procuration, l’office envoie le document à une autre personne, sur demande avec la facture."]],"steps":["Clarifier quel document est demandé (par ex. certificat individuel ou certificat de famille).","Déterminer l’office compétent : lieu d’origine pour les Suisses, domicile pour les étrangers.","Commander le document en ligne ou au guichet ; pour un envoi à un tiers, joindre une procuration."],"who":[1,1,0],"note":"Le registre de l’état civil (Infostar) et les documents relèvent de la Confédération. Les offices du canton de Berne les délivrent.","src":["Canton de Berne : commander des documents en ligne","Canton de Berne : certificat individuel d’état civil","Canton de Berne : état de famille enregistré","Canton de Berne : certificat de famille","Canton de Berne : acte d’origine","ch.ch : documents d’état civil"]},"rv":{"intro":"Si vous avez reçu un commandement de payer et ne devez pas le montant, vous formez opposition : oralement ou par écrit lors de la notification ou dans les 10 jours auprès de l’office des poursuites. C’est gratuit.","facts":[["Délai","Lors de la notification du commandement de payer ou dans les 10 jours qui suivent, auprès de l’office des poursuites."],["Forme et coût","Oralement ou par écrit. L’opposition elle-même est gratuite."],["Effet","La poursuite s’arrête. Si le créancier veut continuer, il doit saisir le tribunal ; celui-ci décide si la poursuite peut continuer."],["Ne plus afficher l’inscription","Au plus tôt 3 mois après la notification du commandement de payer, vous pouvez demander à l’office des poursuites que la poursuite ne soit plus communiquée à des tiers. Si le créancier ne prouve pas dans les 20 jours qu’il a engagé une procédure, elle n’est plus communiquée. Émolument : CHF 40. Depuis le 1er janvier 2026, c’est possible pendant les 5 ans durant lesquels les tiers ont accès."]],"steps":["Vérifier le commandement de payer : devez-vous le montant ?","Sinon : former opposition dans les 10 jours auprès de l’office des poursuites, oralement ou par écrit.","Au plus tôt après 3 mois, déposer à l’office la demande de non-communication (CHF 40)."],"who":[1,0,0],"note":"La procédure est réglée par la loi fédérale sur la poursuite pour dettes et la faillite (LP). Est compétent l’office des poursuites qui a établi le commandement de payer ; dans le canton de Berne, ce sont les offices régionaux des poursuites.","src":["ch.ch : commandement de payer, opposition","Office fédéral de la justice : meilleure protection contre les poursuites injustifiées","Office fédéral de la justice : formulaire de non-communication","Canton de Berne : poursuite et faillite"]},"mof":{"intro":"Dans le canton de Berne, vous immatriculez un cyclomoteur ou un e-bike rapide (assistance jusqu’à 45 km/h) auprès de l’Office de la circulation routière. Il vous faut le permis de circulation original, une plaque et une vignette.","facts":[["Qui doit le faire","Les e-bikes avec assistance jusqu’à 25 km/h et 500 watts au plus n’ont pas besoin de plaque. Avec une assistance jusqu’à 45 km/h, l’e-bike est un cyclomoteur et doit porter une plaque jaune."],["Documents","Permis de circulation original et formulaire « Mofa / E-Bike » entièrement rempli."],["Coûts","Plaque CHF 10. Vignette avec assurance RC collective CHF 32 par an (vignette CHF 20, assurance CHF 12). Nouveau permis de circulation en cas de changement de détenteur CHF 30."],["Renouveler la vignette","Valable jusqu’au 31 mai. La facture arrive automatiquement en février ; après paiement, la nouvelle vignette est envoyée par la poste."]],"steps":["Vérifier si votre véhicule a besoin d’une plaque (cyclomoteur ou e-bike jusqu’à 45 km/h).","Remplir le formulaire « Mofa / E-Bike » et le remettre avec le permis de circulation original à l’Office de la circulation routière, par la poste ou au guichet.","Poser la plaque et la vignette ; chaque année en février, payer la facture de la nouvelle vignette."],"who":[1,1,0],"note":"La Confédération fixe quels véhicules doivent porter une plaque. L’immatriculation et les vignettes relèvent de l’Office de la circulation routière et de la navigation du canton de Berne.","src":["Canton de Berne : immatriculer un cyclomoteur / e-bike","Canton de Berne : renouveler la vignette","Canton de Berne : informations e-bikes et cyclomoteurs","Canton de Berne : renouvellement des vignettes 2026"]},"waf":{"intro":"Pour acheter la plupart des armes à feu, il faut un permis d’acquisition d’armes. Dans le canton de Berne, vous déposez la demande en ligne via Suisse ePolice ou avec un formulaire à la police cantonale. L’émolument est de CHF 50.","facts":[["Conditions","Avoir au moins 18 ans. Aucune inscription au casier judiciaire pour un acte dénotant un caractère violent ou dangereux, ni pour des crimes ou délits répétés. Ne pas être sous curatelle de portée générale ni représenté par un mandataire pour cause d’inaptitude."],["Demande","Au bureau des armes du canton de domicile. Dans le canton de Berne, en ligne via Suisse ePolice ou avec le formulaire à la Police cantonale bernoise, domaine WSG, case postale, 3001 Berne. Annexe notamment : copie du passeport ou de la carte d’identité valable."],["Coût","CHF 50."],["Portée","Un permis d’acquisition permet d’acquérir au plus 3 armes auprès du même aliénateur."]],"steps":["Vérifier si l’arme est soumise à autorisation et si vous remplissez les conditions.","Déposer la demande en ligne via Suisse ePolice ou avec le formulaire à la Police cantonale bernoise, avec les annexes demandées.","Acheter l’arme avec le permis d’acquisition."],"who":[1,1,0],"note":"Le droit sur les armes est du droit fédéral (fedpol). Les autorisations sont délivrées par le bureau cantonal des armes, dans le canton de Berne par la police cantonale.","src":["Police cantonale bernoise : armes","fedpol : questions fréquentes sur le droit des armes","ch.ch : acheter des armes","fedpol : rapport explicatif sur l’ordonnance sur les armes"]},"sti":{"intro":"Dans le canton de Berne, vous demandez une bourse en ligne via StipBE-Online auprès de la Section des subsides de formation. La demande doit être arrivée complète avec les justificatifs avant le délai ; aucun subside n’est accordé rétroactivement.","facts":[["Qui peut","Les personnes en première formation dont les parents habitent dans le canton de Berne. Les étrangers avec une autorisation d’établissement C bernoise ou avec 5 ans de domicile en Suisse et une autorisation de séjour B."],["Délai","30 juin pour les années de formation qui commencent entre le 1er janvier et le 30 juin ; 31 décembre pour celles qui commencent entre le 1er juillet et le 31 décembre."],["Dépôt","Saisir la demande dans StipBE-Online (avec BE-Login). Puis imprimer la demande, la liste des justificatifs et la quittance de validation signée, et les envoyer par la poste avec les justificatifs. C’est seulement alors que la demande est réputée déposée."],["Contact","Section des subsides de formation : 031 633 83 40, aab@be.ch."]],"steps":["S’inscrire à BE-Login et saisir la demande pour l’année de formation dans StipBE-Online.","Imprimer la demande, la liste des justificatifs et la quittance de validation, signer la quittance.","Envoyer le tout avec les justificatifs par la poste à la Section des subsides de formation avant le délai."],"who":[0,1,0],"note":"Les bourses et prêts relèvent des cantons. Dans le canton de Berne, la Section des subsides de formation de la Direction de l’instruction publique et de la culture est compétente.","src":["Canton de Berne : bourses","Canton de Berne : questions et réponses StipBE-Online","Canton de Berne : subsides de formation","Canton de Berne : prêts"]},"miet":{"intro":"Si le taux de référence hypothécaire descend sous celui sur lequel repose votre loyer, vous pouvez demander une baisse au bailleur. Il est actuellement de 1,25 % (depuis le 2 septembre 2025, confirmé le 2 septembre 2026).","facts":[["Quel taux s’applique","Il figure généralement dans le bail. Si le loyer a été adapté depuis au taux de référence sans contestation, c’est le taux de cette adaptation qui vaut."],["Combien","Une baisse de 0,25 point de pourcentage donne en règle générale droit à 2,91 % de loyer en moins, par ex. de 1,5 % à 1,25 %. Seul le loyer net est adapté ; d’autres facteurs de coûts peuvent être compensés."],["À partir de quand","Au plus tôt pour le prochain terme de résiliation possible."],["Délais","Le bailleur doit répondre dans les 30 jours. S’il refuse ou ne répond pas, vous pouvez saisir l’autorité de conciliation dans les 30 jours suivants, donc au plus tard 60 jours après votre demande."]],"steps":["Vérifier dans le bail sur quel taux de référence repose le loyer.","Demander la baisse par écrit au bailleur, de préférence par recommandé.","Sans réponse ou en cas de refus, saisir l’autorité de conciliation dans les 60 jours suivant la demande."],"who":[1,0,0],"note":"Le droit du bail est du droit fédéral (Code des obligations). L’Office fédéral du logement (OFL) publie le taux de référence chaque trimestre.","src":["ch.ch : loyer et taux de référence","OFL : taux de référence hypothécaire","OFL : le taux de référence reste à 1,25 %","OFL : le taux de référence baisse à 1,25 %"]},"qst":{"intro":"Les personnes imposées à la source et domiciliées en Suisse peuvent demander dans le canton de Berne une taxation ordinaire ultérieure (TOU), par exemple pour faire valoir des déductions. La demande doit être déposée au plus tard le 31 mars de l’année suivante.","facts":[["Qui paie l’impôt à la source","Les travailleurs étrangers domiciliés en Suisse sans autorisation d’établissement C. L’employeur retient l’impôt chaque mois sur le salaire et le verse à l’Intendance cantonale des impôts."],["TOU facultative","Avec le formulaire « Demande de taxation ordinaire ultérieure (TOU) pour résidents », au plus tard le 31 mars de l’année suivante. Une demande valable ne peut pas être retirée ; ensuite, la taxation ordinaire a lieu chaque année jusqu’à la fin de l’imposition à la source. L’impôt retenu est imputé sans intérêts."],["TOU obligatoire","Si vous (ou votre conjoint) avez dans l’année au moins CHF 120 000 de revenu brut imposé à la source, au moins CHF 150 000 de fortune imposable en fin d’année ou au moins CHF 3 000 d’autres revenus (par ex. d’une activité indépendante)."],["Demander la déclaration","En cas de TOU obligatoire, demandez la déclaration d’impôt à l’Intendance cantonale des impôts au plus tard le 31 mars de l’année suivante."]],"steps":["Vérifier si la TOU est obligatoire pour vous (revenu, fortune, autres revenus).","Sinon : décider si vous voulez une TOU facultative ; elle s’applique ensuite chaque année.","Envoyer le formulaire ou la demande de déclaration d’impôt à l’Intendance des impôts du canton de Berne au plus tard le 31 mars de l’année suivante."],"who":[1,1,0],"note":"Les règles de base de l’impôt à la source relèvent du droit fédéral. Il est perçu et taxé par l’Intendance des impôts du canton de Berne.","src":["Canton de Berne : TOU sur demande","Canton de Berne : TOU obligatoire","Canton de Berne : personnes imposées à la source","Canton de Berne : formulaire de demande TOU","ch.ch : impôt à la source"]},"erb":{"intro":"Pour verser l’argent ou solder les comptes d’une personne décédée, les banques exigent généralement un certificat d’héritier. Dans le canton de Berne, il est établi par les notaires, ou par la commune si elle a ouvert un testament.","facts":[["Remettre le testament","Les testaments et pactes successoraux du défunt doivent être remis immédiatement à sa commune de domicile. La commune ouvre le testament dans le mois qui suit sa réception."],["Certificat de la commune","Sur demande d’un héritier institué, si aucune opposition au testament ouvert n’a été formée dans les 30 jours."],["Certificat du notaire","Émolument selon le temps consacré, au moins CHF 200."],["Répudier la succession","Délai de 3 mois : dès le décès si vous héritez selon la loi ; dès la communication officielle si vous êtes institué par testament ou pacte successoral. La préfecture est compétente."]],"steps":["Remettre immédiatement le testament ou pacte successoral à la commune de domicile du défunt.","Demander le certificat d’héritier à la commune (après l’ouverture du testament) ou à un notaire.","Si vous ne voulez pas l’héritage : le répudier auprès de la préfecture dans les 3 mois."],"who":[1,1,1],"note":"Le droit successoral est du droit fédéral (Code civil). Dans le canton de Berne, les communes ouvrent les testaments, les notaires établissent les certificats d’héritier et les dix préfectures traitent les répudiations et inventaires.","src":["Canton de Berne : testament, pacte successoral, certificat d’héritier","Canton de Berne : liste de contrôle pour les héritiers","Canton de Berne : répudiation de la succession","Canton de Berne : ordonnance sur les émoluments des notaires","Canton de Berne : trouver la préfecture compétente"]},"upk":{"intro":"Pour un déménagement au centre-ville ou si vous voulez stationner dans une interdiction de parquer, il vous faut en ville de Berne une autorisation d’accès et de stationnement. Elle est gratuite et doit être demandée au moins 8 jours ouvrables avant.","facts":[["Conditions","Au moins une des deux adresses se trouve en ville de Berne. Si des particuliers déménagent, l’autorisation vaut au plus un jour, de 7 à 20 h, sauf dimanches et jours fériés."],["Demande","Formulaire en ligne ou demande PDF, au moins 8 jours ouvrables avant le déménagement. Gratuit."],["Signaler l’interdiction","Soit par une entreprise de déménagement qui pose et reprend les signaux, soit en les commandant soi-même à la signalisation de la Police cantonale (031 638 67 00, signalisationen-bern@police.be.ch), également au moins 8 jours ouvrables avant."],["Contact","Police locale et du commerce de la ville de Berne : 031 321 52 17."]],"steps":["Au moins 8 jours ouvrables avant, demander l’autorisation d’accès et de stationnement en ligne.","Commander les signaux d’interdiction auprès d’une entreprise de déménagement ou de la Police cantonale.","Le jour du déménagement, garder l’autorisation dans le véhicule."],"who":[0,1,1],"note":"L’autorisation est délivrée par la police locale et du commerce de la ville de Berne ; les signaux sont fournis par la Police cantonale bernoise.","src":["Ville de Berne : autorisation et interdiction de stationner pour déménagements","Ville de Berne : demande en ligne","Ville de Berne : conseils pour déménager"]},"ahl":{"intro":"Les années de cotisation AVS manquantes réduisent votre rente. Les lacunes des cinq dernières années peuvent être comblées ; les plus anciennes non. Un extrait gratuit de votre compte individuel (CI) montre si vous avez des lacunes.","facts":[["Effet","La rente complète requiert 44 années de cotisation. Chaque année manquante réduit en général la rente d’au moins 1/44, soit environ 2,3 %."],["Rattraper","Seulement pour les lacunes des cinq dernières années. Les lacunes plus anciennes ne peuvent plus être comblées."],["Années de jeunesse","Les périodes de cotisation entre 18 et 20 ans peuvent combler des lacunes survenues plus tard."],["Extrait de compte","À tout moment et sans justification auprès d’une caisse de compensation qui tient un compte pour vous ; en ligne via ahv-iv.ch. Par écrit et gratuit. Les personnes sans activité lucrative paient en 2026 au moins CHF 530 par an pour éviter une lacune."]],"steps":["Commander en ligne un extrait du compte individuel.","Vérifier s’il manque des années de cotisation dans les cinq dernières années.","Payer les cotisations manquantes auprès de la caisse de compensation compétente."],"who":[1,0,0],"note":"L’AVS est une assurance fédérale (OFAS). Les cotisations et comptes sont gérés par les caisses de compensation.","src":["AVS/AI : que faire en cas de lacunes ?","OFAS : lacunes d’assurance et de cotisation","ch.ch : lacunes de cotisation AVS","AVS/AI : commander un extrait de compte","AVS/AI : mémento 2.03 personnes sans activité lucrative"]},"mdv":{"intro":"Si vous ne pouvez pas accomplir un service militaire pour des raisons professionnelles, scolaires ou médicales, déposez une demande de déplacement de service. Elle doit être déposée au plus tard 14 semaines avant le début du service.","facts":[["Motifs","Travail, études ou formation, ainsi que raisons médicales. La demande n’est acceptée que pour des motifs impérieux et si le service le permet."],["Délai et forme","Au plus tard 14 semaines avant le début du service, motivée et avec des attestations (par ex. de l’employeur ou de l’école). En ligne via le gestionnaire de service ou avec le formulaire."],["Important","Tant que vous n’avez pas reçu l’autorisation, vous restez tenu d’entrer en service."],["École de recrues","L’ER peut aussi être déplacée pour le travail, les études ou des raisons médicales ; c’est en général possible."]],"steps":["Obtenir une attestation de l’employeur, de l’école ou du médecin.","Déposer la demande au plus tard 14 semaines avant le service, en ligne ou avec le formulaire.","Attendre la décision et, d’ici là, entrer en service comme convoqué."],"who":[1,1,0],"note":"L’obligation de servir est réglée par la Confédération (Armée). Les autorités militaires cantonales sont compétentes pour certaines questions.","src":["Armée : déplacement de service","Armée : déplacement de service et congé","ch.ch : service militaire","Armée : autorités militaires cantonales"]},"zivi":{"intro":"Si vous ne pouvez pas concilier le service militaire avec votre conscience, vous pouvez faire du service civil. La demande se dépose uniquement en ligne via ZiviConnect auprès de l’Office fédéral du service civil.","facts":[["Conditions","Vous avez passé le recrutement et êtes apte au service militaire, vous ne pouvez pas concilier le service militaire avec votre conscience et vous êtes prêt à accomplir 1,5 fois plus de jours de service qu’à l’armée."],["Demande","Uniquement en ligne via ZiviConnect, avec un login AGOV."],["Journée d’introduction","À suivre dans les 3 mois après la demande (ne compte pas comme jour de service). Ensuite, confirmer la demande dans les 2 semaines. Après la décision d’admission, vous ne pouvez plus la retirer."],["Service militaire entre-temps","Si vous déposez la demande au moins 3 mois avant votre prochain service militaire, vous n’avez pas à entrer en service tant qu’aucune décision n’est entrée en force. Pour une demande plus tardive ou pendant un service en cours, vous restez astreint au service militaire jusqu’à la décision d’admission."]],"steps":["Créer un login AGOV et déposer la demande d’admission dans ZiviConnect, si possible au moins 3 mois avant le prochain service militaire.","Suivre la journée d’introduction dans les 3 mois.","Confirmer la demande dans les 2 semaines suivantes et attendre la décision d’admission."],"who":[1,0,0],"note":"Le service civil relève de la Confédération ; l’Office fédéral du service civil (CIVI) est compétent.","src":["CIVI : admission","CIVI : FAQ","CIVI : ZiviConnect","ch.ch : service civil"]},"obu":{"intro":"Pour une amende d’ordre, vous disposez dans le canton de Berne d’un délai de réflexion de 30 jours. Si vous payez le montant entier dans ce délai, l’affaire est réglée. Si vous n’êtes pas d’accord, ne payez pas ; la procédure ordinaire s’ouvre alors.","facts":[["Qu’est-ce qu’une amende d’ordre","Une amende infligée en procédure simplifiée. La liste des amendes pour la circulation routière couvre les contraventions punies d’amendes de CHF 300 au plus."],["Payer","Le montant entier dans les 30 jours. Les amendes d’ordre ne peuvent pas être converties en travail."],["Pas payé","Vous recevez une dénonciation pour contravention avec bulletin de versement. Si ce délai expire aussi, la police transmet le dossier au ministère public (procédure ordinaire)."],["Procédure ordinaire","En cas de condamnation, des frais de procédure s’ajoutent à l’amende ; leur montant est fixé par la justice."]],"steps":["Examiner l’amende : êtes-vous d’accord ?","Si oui : payer le montant entier dans les 30 jours.","Si non : ne pas payer ; l’affaire passe en procédure ordinaire devant le ministère public, où vous pouvez faire valoir votre point de vue, avec un risque de frais."],"who":[1,1,0],"note":"La procédure des amendes d’ordre et la liste des amendes sont réglées par la Confédération. Dans le canton de Berne, la Police cantonale les inflige et les encaisse.","src":["Police cantonale bernoise : amendes d’ordre","ch.ch : règles de circulation et amendes d’ordre","Police cantonale bernoise : app des amendes"]},"kau":{"intro":"La garantie de loyer est déposée sur un compte à votre nom et bloquée pour les deux parties. Après votre départ, la banque la libère si les deux parties y consentent, ou au plus tard si le bailleur n’a fait valoir aucune prétention en justice pendant un an.","facts":[["Montant","Pour un logement, au plus trois mois de loyer. La banque la dépose sur un compte d’épargne ou de dépôt au nom du locataire."],["Libération","Avec l’accord du locataire et du bailleur, ou sur la base d’un commandement de payer non contesté ou d’un jugement exécutoire."],["Après un an","Si le bailleur n’a fait valoir aucune prétention en justice dans l’année qui suit la fin du bail, vous pouvez exiger le remboursement directement auprès de la banque."],["Base légale","Art. 257e du Code des obligations."]],"steps":["Après la remise du logement, demander au bailleur une libération écrite de la garantie.","Envoyer la libération à la banque ; elle verse l’avoir.","Sans libération : un an après la fin du bail, exiger le remboursement auprès de la banque si le bailleur n’a fait valoir aucune prétention en justice."],"who":[1,0,0],"note":"Le droit du bail est du droit fédéral (Code des obligations) ; l’Office fédéral du logement (OFL) informe à ce sujet.","src":["OFL : notice sur les garanties de loyer","OFL : portail droit du bail","ch.ch : conclure un bail"]},"zeug":{"intro":"Vous pouvez demander à tout moment un certificat de travail à votre employeur, même pendant l’emploi (art. 330a CO). Le droit ne se prescrit que 10 ans après la fin des rapports de travail.","facts":[["Certificat complet","Indications sur la nature et la durée de l’emploi ainsi que sur la qualité du travail et la conduite (art. 330a al. 1 CO)."],["Attestation de travail","Seulement la nature et la durée de l’emploi, sans appréciation (art. 330a al. 2 CO). Vous pouvez la demander à la place d’un certificat complet."],["Quand","À tout moment, donc aussi comme certificat intermédiaire pendant l’emploi. Prescription : 10 ans dès la fin des rapports de travail."],["Erreurs","Si le certificat contient des inexactitudes, erreurs ou contre-vérités, vous pouvez en exiger la modification."]],"steps":["Demander par écrit le certificat de travail (ou une simple attestation) à l’employeur.","Vérifier le certificat (erreurs, indications fausses).","Si nécessaire, demander une rectification par écrit."],"who":[1,0,0],"note":"Le droit du travail est du droit fédéral (Code des obligations). Le Secrétariat d’État à l’économie (SECO) renseigne à ce sujet.","src":["ch.ch : certificat de travail","SECO : FAQ certificat de travail"]},"krl":{"intro":"Si vous êtes malade et ne pouvez pas travailler, l’employeur doit continuer à verser le salaire pendant un temps limité si les rapports de travail ont duré plus de trois mois ou ont été conclus pour plus de trois mois (art. 324a CO) : au moins 3 semaines la première année de service, plus ensuite.","facts":[["Sans assurance d’indemnités journalières","100 % du salaire dès le premier jour de maladie. Au moins 3 semaines la première année de service, puis pour une période plus longue équitable. Les tribunaux fixent la durée selon l’échelle bernoise, zurichoise ou bâloise, si le contrat ou la CCT ne prévoit rien de plus favorable."],["Avec une assurance d’indemnités journalières","La plupart des assurances versent 80 % du salaire pendant 720 ou 730 jours sur 900 jours. Elle n’est équivalente que si l’employeur paie au moins la moitié de la prime."],["Certificat médical","L’employeur peut en principe l’exiger dès le premier jour ; beaucoup de contrats ne l’exigent qu’à partir du 3e ou 4e jour."],["Médecin-conseil","En cas d’incapacité prolongée, l’assurance ou l’employeur peuvent ordonner un examen par un médecin indépendant. Celui-ci ne renseigne que sur la capacité de travail, pas sur le diagnostic."]],"steps":["Informer immédiatement l’employeur que vous êtes malade.","Obtenir un certificat médical si le contrat ou l’employeur l’exige.","Vérifier dans le contrat ou la CCT s’il existe une assurance d’indemnités journalières et ce qu’elle verse."],"who":[1,0,0],"note":"Le maintien du salaire est réglé par le Code des obligations (droit fédéral). Le Secrétariat d’État à l’économie (SECO) renseigne.","src":["SECO : FAQ empêchement de travailler","ch.ch : incapacité de travail"]},"fer":{"intro":"Les travailleurs ont droit à au moins 4 semaines de vacances par année de service, 5 semaines jusqu’à 20 ans révolus (art. 329a CO). Le contrat ou la CCT peuvent prévoir davantage.","facts":[["Droit minimal","4 semaines par année de service ; 5 semaines jusqu’à 20 ans."],["D’affilée","Au moins 2 semaines par année de service doivent être consécutives. Si aucun motif concret de l’entreprise ne s’y oppose, l’employeur doit aussi accorder 3 semaines d’affilée."],["Paiement","Pendant les rapports de travail, les vacances ne peuvent pas être remplacées par de l’argent (art. 329d al. 2 CO). À la fin, un paiement est possible dans certains cas ; pendant le délai de congé, les vacances devraient si possible être prises."],["Maladie et prescription","Si vous tombez malade en vacances et ne pouvez pas récupérer, vous avez droit à les reprendre. En cas d’empêchement non fautif d’un mois au plus par année de service, l’employeur ne peut pas réduire les vacances. Le droit aux vacances se prescrit par 5 ans."]],"steps":["Vérifier dans le contrat ou la CCT le nombre de semaines de vacances.","Fixer les vacances à temps avec l’employeur ; au moins 2 semaines d’affilée sont garanties.","En cas de maladie pendant les vacances, obtenir tout de suite un certificat médical et informer l’employeur."],"who":[1,0,0],"note":"Le droit aux vacances figure dans le Code des obligations (droit fédéral). Le Secrétariat d’État à l’économie (SECO) renseigne.","src":["SECO : FAQ vacances","ch.ch : vacances, jours fériés et absences"]},"ueb":{"intro":"Les heures supplémentaires sont payées avec le salaire plus un supplément d’au moins 25 % ou, si les deux parties sont d’accord, compensées par un congé de même durée. Le contrat peut exclure par écrit l’indemnisation des heures supplémentaires, mais pas celle du travail supplémentaire.","facts":[["Heures supplémentaires","Travail au-delà de la durée contractuelle. Indemnisation : salaire plus au moins 25 % de supplément, sauf accord écrit contraire (supplément plus bas, nul ou exclusion)."],["Congé au lieu d’argent","Compensation par un congé d’au moins même durée si travailleur et employeur sont d’accord. La loi ne prévoit alors pas de supplément."],["Travail supplémentaire","Travail au-delà de la durée maximale légale : 45 heures par semaine pour l’industrie et le personnel de bureau, 50 heures pour les autres travailleurs. Son indemnisation ne peut pas être exclue par contrat."],["Vérifier le contrat","Le contrat de travail ou la CCT règle souvent l’indemnisation des heures supplémentaires."]],"steps":["Noter précisément les heures effectuées.","Vérifier ce que prévoit le contrat ou la CCT pour les heures supplémentaires.","Convenir avec l’employeur du paiement ou d’une compensation en congé."],"who":[1,0,0],"note":"Les heures supplémentaires relèvent du Code des obligations, le travail supplémentaire et la durée maximale de la loi sur le travail (droit fédéral). Le SECO renseigne.","src":["SECO : FAQ heures supplémentaires","SECO : durée du travail et du repos"]}}},"it":{"ask_label":"Cosa desidera sapere?","send":"Invii la domanda","nav":["Vista cittadini","Vista delle autorità","Progetto","Pagina iniziale","Menu","Pagine"],"f_links":["Contatto","Vista delle autorità","Vista cittadini","Progetto"],"f_sender":"Concetto privato di Bilal Simsek, Berna. Non è un'offerta di un'autorità. I Suoi riscontri sono benvenuti: {c}","f_legal":"Protezione dei dati, condizioni d'uso e accessibilità non sono elaborate nel concetto. Il prototipo non raccoglie dati personali, non imposta cookie e non utilizza strumenti di analisi; nel browser viene memorizzato solo, in locale, che Lei ha letto l'avviso.","f_note":"Prototipo concettuale. Tutte le risposte sono esempi e non sostituiscono l'informazione di un'autorità.","banner_s":"Prototipo concettuale, non un sito ufficiale","skip":"Vai al contenuto","chips":[{"l":"Trasloco","q":"Mi trasferisco da Berna a Winterthur: come e entro quando devo annunciare la partenza e l’arrivo?"},{"l":"Passaporto & ID","q":"Abito a Berna e ho bisogno di un nuovo passaporto e di una carta d’identità. Come e dove li ordino?"},{"l":"Termine fiscale","q":"Abito a Berna e non riesco a presentare la dichiarazione d’imposta entro metà marzo. Come prolungo il termine e quanto costa?"},{"l":"Rendita AVS","q":"Sono nato/a nel 1962 e abito a Thun: quando e dove richiedo la rendita AVS?"},{"l":"Disoccupazione","q":"Abito a Thun e alla fine del mese perdo il mio posto di lavoro. Dove e quando devo annunciarmi e come ottengo l’indennità di disoccupazione?"},{"l":"Cambiare cassa","q":"Entro quando posso cambiare cassa malati e come funziona?"},{"l":"Ditta individuale","q":"Abito a Berna e mi metto in proprio con una ditta individuale. Che cosa devo annunciare e dove?"},{"l":"Patente estera","q":"Abito a Berna da qualche mese e ho una patente di guida tedesca. Devo cambiarla, e come?"},{"l":"Sposarsi","q":"Siamo entrambi svizzeri, abitiamo a Zurigo e vogliamo sposarci. Come funziona e quanto costa?"},{"l":"Annunciare un cane","q":"Abito nella città di Berna e ho preso un cane. Dove devo annunciarlo e quanto costa?"},{"l":"Assegni per i figli","q":"Sono dipendente a Berna e ho avuto un bambino. Come ottengo gli assegni per i figli e quanto ricevo?"},{"l":"Estratto esecuzioni","q":"Abito a Berna e mi serve un estratto del registro delle esecuzioni per un nuovo appartamento. Dove lo ordino e quanto costa?"},{"l":"Casellario giudiziale","q":"Mi serve un estratto del casellario giudiziale per un nuovo lavoro. Come lo ordino e quanto tempo ci vuole?"},{"l":"Immatricolare l’auto","q":"Abito a Berna e ho comprato un’auto d’occasione. Come la immatricolo e quanto costa?"},{"l":"Naturalizzazione","q":"Vivo in Svizzera da 12 anni, di cui 3 nella città di Berna, e ho il permesso C. Posso naturalizzarmi e quanto costa?"},{"l":"Riduzione dei premi","q":"Abito nel Cantone di Berna e guadagno poco. Ho diritto alla riduzione dei premi e devo chiederla?"},{"l":"Tassa d’esenzione","q":"Ho 22 anni, abito a Berna e sono stato dichiarato inabile al servizio militare. Devo pagare la tassa d’esenzione e quanto?"},{"l":"Casetta da giardino","q":"Abito nella città di Berna e voglio mettere una piccola casetta da giardino. Mi serve una licenza edilizia?"},{"l":"Documento smarrito","q":"Abito a Berna e ho perso la carta d’identità. Che cosa devo fare e quanto costa?"},{"l":"Buoni per l’asilo nido","q":"Abitiamo nella città di Berna e vogliamo mandare nostro figlio all’asilo nido. Riceviamo buoni di custodia e come li chiediamo?"},{"l":"Aiuto sociale","q":"Abito nella città di Berna e non riesco più ad arrivare a fine mese. Come chiedo l’aiuto sociale?"},{"l":"Prestazioni complementari","q":"Sono in pensione, abito a Thun e la mia rendita AVS non basta. Posso chiedere le prestazioni complementari?"},{"l":"Iscrizione AI","q":"Abito a Berna e da mesi sono malato e incapace al lavoro. Come mi iscrivo all’assicurazione invalidità?"},{"l":"Indennità di maternità","q":"Sono salariata e aspetto un bambino in primavera. Quanta indennità di maternità ricevo e come la richiedo?"},{"l":"Congedo di paternità","q":"Sono salariato e divento padre in primavera. Quanto dura il congedo di paternità e come ottengo l’indennità?"},{"l":"Licenza per allievo","q":"Ho 17 anni, abito a Berna e voglio imparare a guidare. Come ottengo la licenza per allievo conducente?"},{"l":"Certificato di domicilio","q"
