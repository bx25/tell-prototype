uch ausfüllen und an ein Zivilstandsamt schicken. Der Hinterlegungsort wird eingetragen."],"who":[1,1,0],"note":"Der Vorsorgeauftrag ist im ZGB geregelt. Den Hinterlegungsort trägt das kantonale Zivilstandsamt ein; prüfen und in Kraft setzen tut ihn bei Bedarf die KESB.","src":["Kanton Bern: Vorsorgeauftrag (Zivilstand)","Kanton Bern: Hinterlegungsort eintragen","KESB Kanton Bern: Vorsorgeauftrag und Patientenverfügung"]},"aus":{"intro":"Ein bis zwei Monate vor Ablauf erhalten Sie eine Verfallsanzeige. Schicken Sie sie ausgefüllt mit den darin verlangten Unterlagen per E-Mail oder Post an die Einwohnerdienste, Migration und Fremdenpolizei der Stadt Bern.","facts":[["Verfallsanzeige","Kommt ein bis zwei Monate vor Ablauf der Bewilligung. Haben Sie keine erhalten, melden Sie sich selbst bei den Einwohnerdiensten (031 321 53 00)."],["Einreichen","Ausgefüllt mit den Unterlagen, die in der Verfallsanzeige stehen, per E-Mail oder Post. Die Bearbeitung kann dauern; die Stadt meldet sich, sobald die Bewilligung verlängert ist."],["Biometrie","Falls nötig, erhalten Sie eine schriftliche Einladung, im Ausweiszentrum Ihre biometrischen Daten abzugeben."],["Gültigkeit B","Kanton Bern: für EU/EFTA-Staatsangehörige in der Regel 5 Jahre, für Drittstaatsangehörige 1 Jahr."]],"steps":["Verfallsanzeige abwarten (ein bis zwei Monate vor Ablauf) und ausfüllen.","Mit den verlangten Unterlagen per E-Mail oder Post an die Einwohnerdienste, Migration und Fremdenpolizei der Stadt Bern schicken.","Falls eingeladen: im Ausweiszentrum biometrische Daten abgeben. Danach kommt der neue Ausweis."],"who":[1,1,1],"note":"Die Regeln setzt der Bund (SEM). In der Stadt Bern nehmen die Einwohnerdienste, Migration und Fremdenpolizei die Verlängerung entgegen; der Kanton regelt den Ausweis.","src":["Stadt Bern: Verlängerung von Bewilligungen","Kanton Bern: Aufenthaltsbewilligung (Ausweis B)","Stadt Bern: Einwohnerdienste, Migration und Fremdenpolizei"]},"nam":{"intro":"Nach der Scheidung behalten Sie den Namen aus der Ehe. Sie können aber jederzeit vor dem Zivilstandsamt erklären, dass Sie wieder Ihren Ledignamen tragen wollen. Im Kanton Bern kostet das CHF 75.","facts":[["Frist","Keine. Die Erklärung ist jederzeit möglich, sobald die Ehe nicht mehr besteht."],["Wo","Mit Termin bei einem der sieben Zivilstandsämter im Kanton Bern oder bei jedem anderen Zivilstandsamt der Schweiz."],["Kosten","Namenserklärung CHF 75. Bestätigung auf Wunsch CHF 30. Bezahlt wird vor Ort."],["Abgrenzung","Wollen Sie einen anderen Namen als den Ledignamen, braucht es ein Gesuch um Namensänderung beim Kanton."]],"steps":["Termin bei einem Zivilstandsamt vereinbaren.","Vor Ort die Namenserklärung abgeben und die Gebühr bezahlen."],"who":[1,1,0],"note":"Das Namensrecht steht im ZGB. Die Erklärung nimmt das kantonale Zivilstandsamt entgegen.","src":["Kanton Bern: Namenserklärung","ch.ch: Name nach der Scheidung","Kanton Bern: Namensänderung"]}}},"fr":{"ask_label":"Que souhaitez-vous savoir ?","send":"Envoyer la question","nav":["Vue citoyenne","Vue des autorités","Projet","Accueil","Menu","Pages"],"f_links":["Contact","Vue des autorités","Vue citoyenne","Projet"],"f_sender":"Concept privé de Bilal Simsek, Berne. Pas une offre d'une autorité. Vos retours sont les bienvenus : {c}","f_legal":"Protection des données, conditions d'utilisation et accessibilité ne sont pas développées dans le concept. Le prototype ne collecte aucune donnée personnelle, ne dépose aucun cookie et n'utilise aucun outil d'analyse ; seul le fait que vous avez lu l'avertissement est mémorisé localement dans le navigateur.","f_note":"Prototype conceptuel. Toutes les réponses sont des exemples et ne remplacent pas un renseignement officiel.","banner_s":"Prototype conceptuel, pas un site officiel","skip":"Aller au contenu","chips":[{"l":"Déménagement","q":"Je déménage de Berne à Winterthour : comment et jusqu’à quand dois-je annoncer mon départ et mon arrivée ?"},{"l":"Passeport & ID","q":"J’habite à Berne et j’ai besoin d’un nouveau passeport et d’une carte d’identité. Comment et où les commander ?"},{"l":"Délai fiscal","q":"J’habite à Berne et je n’arrive pas à remplir ma déclaration d’impôt d’ici la mi-mars. Comment prolonger le délai et combien cela coûte-t-il ?"},{"l":"Rente AVS","q":"Je suis né(e) en 1962 et j’habite à Thoune : quand et où dois-je demander ma rente AVS ?"},{"l":"Chômage","q":"J’habite à Thoune et je perds mon emploi à la fin du mois. Où et quand dois-je m’annoncer, et comment obtenir des indemnités de chômage ?"},{"l":"Changer de caisse","q":"Jusqu’à quand puis-je changer de caisse-maladie et comment faire ?"},{"l":"Entreprise individuelle","q":"J’habite à Berne et je me mets à mon compte avec une entreprise individuelle. Que dois-je annoncer, et où ?"},{"l":"Permis étranger","q":"J’habite à Berne depuis quelques mois et j’ai un permis de conduire allemand. Dois-je l’échanger, et comment ?"},{"l":"Se marier","q":"Nous sommes tous deux Suisses, habitons à Zurich et voulons nous marier. Comment cela se passe-t-il et combien cela coûte-t-il ?"},{"l":"Annoncer un chien","q":"J’habite en ville de Berne et j’ai repris un chien. Où dois-je l’annoncer et combien cela coûte-t-il ?"},{"l":"Allocations familiales","q":"Je suis salarié(e) à Berne et j’ai eu un bébé. Comment obtenir les allocations pour enfant et combien reçoit-on ?"},{"l":"Extrait des poursuites","q":"J’habite à Berne et j’ai besoin d’un extrait du registre des poursuites pour un nouvel appartement. Où le commander et combien coûte-t-il ?"},{"l":"Casier judiciaire","q":"J’ai besoin d’un extrait du casier judiciaire pour un nouvel emploi. Comment le commander et combien de temps cela prend-il ?"},{"l":"Immatriculer une voiture","q":"J’habite à Berne et j’ai acheté une voiture d’occasion. Comment l’immatriculer et combien cela coûte-t-il ?"},{"l":"Naturalisation","q":"Je vis en Suisse depuis 12 ans, dont 3 en ville de Berne, et j’ai le permis C. Puis-je me faire naturaliser et combien cela coûte-t-il ?"},{"l":"Réduction des primes","q":"J’habite dans le canton de Berne et je gagne peu. Ai-je droit à une réduction des primes et dois-je la demander ?"},{"l":"Taxe d’exemption","q":"J’ai 22 ans, j’habite à Berne et j’ai été déclaré inapte au service militaire. Dois-je payer la taxe d’exemption et combien ?"},{"l":"Abri de jardin","q":"J’habite en ville de Berne et je veux installer un petit abri de jardin. Ai-je besoin d’un permis de construire ?"},{"l":"Document perdu","q":"J’habite à Berne et j’ai perdu ma carte d’identité. Que dois-je faire et combien cela coûte-t-il ?"},{"l":"Bons de garde","q":"Nous habitons en ville de Berne et voulons mettre notre enfant en crèche. Avons-nous droit à des bons de garde et comment les demander ?"},{"l":"Aide sociale","q":"J’habite en ville de Berne et je n’arrive plus à joindre les deux bouts. Comment demander l’aide sociale ?"},{"l":"Prestations complémentaires","q":"Je suis retraité(e), j’habite à Thoune et ma rente AVS ne suffit pas. Puis-je demander des prestations complémentaires ?"},{"l":"Inscription AI","q":"J’habite à Berne et je suis malade et en incapacité de travail depuis des mois. Comment m’inscrire à l’assurance-invalidité ?"},{"l":"Allocation de maternité","q":"Je suis salariée et j’attends un enfant au printemps. Combien d’allocation de maternité vais-je recevoir et comment la demander ?"},{"l":"Congé de paternité","q":"Je suis salarié et je deviens père au printemps. Combien dure le congé de paternité et comment obtenir l’allocation ?"},{"l":"Permis d’élève","q":"J’ai 17 ans, j’habite à Berne et je veux apprendre à conduire. Comment obtenir le permis d’élève conducteur ?"},{"l":"Attestation de domicile","q":"J’habite en ville de Berne et j’ai besoin d’une attestation de domicile. Où l’obtenir et combien coûte-t-elle ?"},{"l":"Annoncer un décès","q":"Ma mère est décédée à la maison en ville de Berne. Que dois-je faire maintenant et où annoncer le décès ?"},{"l":"Carte de stationnement","q":"J’habite en ville de Berne et j’ai une voiture. Comment obtenir une carte de stationnement pour résidents et combien coûte-t-elle ?"},{"l":"Encombrants","q":"J’habite en ville de Berne et je veux me débarrasser d’un vieux canapé. Comment éliminer des encombrants et combien ça coûte ?"},{"l":"Objets trouvés","q":"J’ai perdu mon porte-monnaie en ville de Berne. Comment l’annoncer au bureau des objets trouvés ?"},{"l":"Engager une poursuite","q":"Un client à Berne ne paie pas ma facture de CHF 2'000. Comment engager une poursuite ?"},{"l":"Mettre une voiture hors circulation","q":"J’habite dans le canton de Berne et je vends ma voiture. Comment la mettre hors circulation et que faire des plaques ?"},{"l":"Séjour hebdomadaire","q":"Je travaille désormais en ville de Berne et je rentre le week-end en Valais. Comment m’annoncer en séjour hebdomadaire ?"},{"l":"Sortie de l’Église","q":"J’habite à Berne et je veux quitter l’Église. Comment faire et à partir de quand je ne paie plus d’impôt ecclésiastique ?"},{"l":"Vélo volé","q":"On m’a volé mon vélo à Berne. Comment annoncer le vol à la police ?"},{"l":"Mandat d’inaptitude","q":"J’habite à Berne et je veux faire un mandat pour cause d’inaptitude. Quelle forme doit-il avoir et où le déposer ?"},{"l":"Prolonger le permis","q":"J’habite en ville de Berne et mon permis B expire bientôt. Comment le prolonger ?"},{"l":"Nom après divorce","q":"Je suis divorcée, j’habite à Berne et je veux reprendre mon nom de célibataire. Comment faire ?"}],"think":"Tell consulte les sources officielles","who":"Compétence","bund":"Confédération","kanton":"Canton","gemeinde":"Commune","src":"Sources","glance":"En un coup d’œil","stand":"État : octobre 2026 · Réponse donnée à titre d’exemple, issue de sources publiques, sans garantie. Seuls les services compétents font foi.","newtab":"s’ouvre dans un nouvel onglet","newq":"Nouvelle question","fb":{"intro":"Le prototype n’a pas encore de réponse à cette question. La version finale consulterait ici les sources officielles de la Confédération, des cantons et des communes. Il répond déjà à 23 exemples : déménagement, passeport et carte d’identité, déclaration d’impôt, rente AVS, chômage, changement de caisse-maladie, création d’une entreprise individuelle échange d’un permis de conduire étranger, mariage, annonce d’un chien, allocations familiales, extrait des poursuites, extrait du casier judiciaire, immatriculation d’une voiture, naturalisation, réduction des primes, taxe d’exemption de l’obligation de servir, abri de jardin, document d’identité perdu, bons de garde, aide sociale, prestations complémentaires et inscription à l’AI. Essayez l’un d’eux."},"ans":{"move":{"intro":"Vous vous annoncez dans les 14 jours auprès de votre nouvelle commune. De Berne à Winterthour, cela se fait en ligne via eUmzugCH : les deux communes sont raccordées, il n’est pas nécessaire de se rendre au guichet.","facts":[["Délai","14 jours dès le changement d’adresse (art. 11 LHR)"],["Coûts","Winterthour : CHF 40 par adulte ; eUmzugCH ne coûte pas plus cher que le guichet"],["Guichet","Pas nécessaire, tout se fait en ligne"],["Compétence","Services aux habitants de Berne (départ), contrôle des habitants de Winterthour (arrivée)"]],"steps":["Sur eumzug.swiss, saisir l’ancienne adresse (Berne) et la nouvelle adresse (Winterthour), puis lancer la vérification.","À préparer : passeport ou carte d’identité, numéro AVS (13 chiffres), contrat de bail ou attestation d’emménagement, carte ou Twint pour CHF 40.","Préparer la carte d’assuré ou la police d’assurance-maladie : Winterthour exige ce justificatif lors de l’annonce d’arrivée.","Terminer en ligne l’annonce de départ à Berne et l’annonce d’arrivée à Winterthour ; un passage au guichet à Berne n’est pas nécessaire.","Service des impôts : Winterthour reçoit automatiquement la nouvelle adresse ; vous y êtes assujetti à l’impôt dès le 1er janvier de l’année d’arrivée."],"who":[1,1,1],"note":"Les communes (Berne, Winterthour) reçoivent les annonces de départ et d’arrivée, eUmzugCH est le service commun de la Confédération, des cantons et des communes ; les impôts sont prélevés par le canton de Zurich avec la ville de Winterthour.","src":["eUmzugCH – annoncer son déménagement en ligne (Confédération, cantons, communes)","Ville de Winterthour – déménagement et arrivée à Winterthour","Ville de Berne – arrivée, déménagement et départ","Ville de Winterthour – impôts en cas de déménagement, d’arrivée et de départ"]},"passport":{"intro":"Si vous êtes adulte et habitez à Berne, vous demandez votre passeport et/ou votre carte d’identité en ligne sur schweizerpass.ch, puis vous vous rendez au rendez-vous réservé, p. ex. au centre de documents d’identité de Berne (Laupenstrasse 18A). La combinaison passeport + carte d’identité coûte CHF 158 et est valable 10 ans.","facts":[["Coûts","Adultes : carte d’identité CHF 70, passeport CHF 145, combinaison CHF 158. Enfants jusqu’à 18 ans : carte d’identité 35, passeport 65, combinaison 78 (port inclus)."],["Validité","Adultes 10 ans, enfants et jeunes jusqu’à 18 ans : 5 ans. Une prolongation n’est pas possible, vous commandez un nouveau document."],["Durée","Livraison au plus tard 10 jours ouvrables après le rendez-vous, par envoi recommandé."],["Rendez-vous","Obligatoire, présence personnelle nécessaire (photo, pour le passeport empreintes digitales)."],["Nouveau dès novembre","Dès le 2 novembre 2026, il existe en plus la carte d’identité biométrique avec puce (image faciale et deux empreintes digitales). Facultative, même émolument qu’aujourd’hui. Le passeport provisoire s’appellera alors « passeport d’urgence »."]],"steps":["Remplir la demande en ligne sur schweizerpass.ch (adresse e-mail personnelle requise). Après vérification, vous recevez un e-mail pour choisir un rendez-vous.","Réserver un rendez-vous dans l’un des 7 centres de documents d’identité bernois (obligatoire) : en ligne ou par téléphone au 031 635 40 00, lu–ve.","Apporter l’ancien document, mais pas de photo : elle est prise sur place.","Payer les frais sur place (carte, Twint ou espèces). Les enfants viennent avec une personne détentrice de l’autorité parentale et son document d’identité.","Le document arrive dans les 10 jours ouvrables, par envoi recommandé, à l’adresse indiquée."],"who":[1,1,0],"note":"La Confédération (fedpol) publie les prix, la durée de validité et les délais de livraison ; dans le canton de Berne, les sept centres cantonaux de documents d’identité saisissent vos données.","src":["fedpol : prix, durée de validité et délais de livraison","Canton de Berne : documents d’identité, prix et durée de validité","Canton de Berne : centres de documents d’identité et rendez-vous","Canton de Berne : se rendre au rendez-vous, documents à apporter","Conseil fédéral : carte d’identité biométrique dès le 2.11.2026 (communiqué du 26.8.2026)"]},"tax":{"intro":"Dans le canton de Berne, la déclaration d’impôt est en principe due au 15 mars ; en ligne, vous prolongez gratuitement jusqu’au 15 juillet, au plus tard jusqu’au 15 novembre. Pour la période fiscale 2025, en raison d’une panne informatique, le 30 novembre 2026 est exceptionnellement le dernier délai.","facts":[["Délai","Berne : 15 mars (indépendants : 15 mai). Zurich et Genève : 31 mars."],["Coûts","Berne en ligne : gratuit jusqu’au 15 juillet, CHF 20 jusqu’au 15 sept., CHF 40 jusqu’au 15 nov. Par écrit/téléphone : CHF 20/40/60. Genève : CHF 20/40/60."],["Durée","Berne : au plus tard jusqu’au 15 nov. ; déclaration 2025 exceptionnellement jusqu’au 30 nov. 2026 (panne informatique)."],["Compétence","Berne : administration fiscale cantonale. Zurich : office communal des impôts. Genève : Administration fiscale cantonale."]],"steps":["Préparer la lettre relative à la déclaration d’impôt, le certificat de salaire (de l’employeur) et les justificatifs.","Avant l’échéance, dans BE-Login (avec AGOV) : « Fristverlängerung erfassen » (saisir la prolongation de délai), choisir le nouveau délai et confirmer.","Enregistrer soi-même la confirmation : aucune n’est envoyée par la poste ni par e-mail.","Remplir la déclaration dans TaxMe-Online et la déposer avec les justificatifs (ou la remettre imprimée à votre commune de domicile).","En retard ? Des frais de rappel de CHF 60 sont à craindre ; une fois le délai de rappel écoulé, aucune prolongation n’est plus possible."],"who":[1,1,1],"note":"L’administration fiscale cantonale reçoit votre déclaration et taxe aussi l’impôt fédéral direct pour le compte de la Confédération (sous la surveillance de l’AFC) ; la commune fixe sa quotité d’impôt.","src":["Canton de Berne : prolonger le délai en tant que particulier","Canton de Berne : instructions, délai de dépôt","Canton de Zurich : déclaration d’impôt des particuliers","Canton de Genève : demander un délai"]},"ahv":{"intro":"Un homme né en 1962 et habitant à Thoune atteint l’âge de référence de 65 ans en 2027 et demande sa rente à la caisse de compensation 3 à 4 mois avant. Avec un anniversaire le 15 mars 2027, la rente commence le 1er avril 2027 ; la demande se fait dès décembre 2026 environ.","facts":[["Âge de référence","Hommes 65 ans. Femmes : née en 1961 = 64 ans 3 mois, 1962 = 64 ans 6 mois, 1963 = 64 ans 9 mois, dès 1964 = 65 ans. Rente dès le mois suivant."],["Délai","Demande 3 à 4 mois avant le début de la rente. Anticipation dès 63 ans (–6.8 % pour 1 an), ajournement 1 à 5 ans (+5.2 % à +31.5 %)."],["Rente","Dès 2027, avec une durée de cotisation complète CHF 1 280 à 2 560 par mois ; couple au maximum CHF 3 840. S’y ajoute la 13e rente dès décembre 2026."],["Compétence","Caisse de compensation à laquelle votre employeur est affilié (dans le canton de Berne p. ex. la caisse de compensation du canton de Berne, AK Bern)."]],"steps":["Clarifier la caisse de compensation compétente : les salariés demandent à leur employeur, les indépendants à la dernière caisse avec laquelle ils décomptent.","Remplir et envoyer en ligne le formulaire 318.370 « Demande de rente de vieillesse » 3 à 4 mois avant le début de la rente.","Anticipation : à demander au plus tard à la fin du mois précédent. Ajournement : à cocher dans le formulaire au plus tard 1 an après l’âge de référence.","Télécharger les annexes avec le formulaire ou les envoyer par la poste ; la caisse de compensation se procure les documents nécessaires et calcule la rente.","Versement mensuel (AK Bern : 4e jour ouvrable, p. ex. le 4 décembre 2026) ; la 13e rente de décembre est versée sans demande."],"who":[1,1,0],"note":"La Confédération (OFAS) fixe les règles et publie les mémentos ; la caisse de compensation (dans le canton de Berne, l’AK Bern) reçoit votre demande, calcule et verse la rente.","src":["Caisse de compensation du canton de Berne : rente de vieillesse de l’AVS","ahv-iv.ch : mémento 3.01 Rentes de vieillesse (état au 1.1.2026)","ch.ch : retraite – à partir de quand ?","OFAS : stabilisation de l’AVS (AVS 21)","Conseil fédéral : hausse des rentes AVS/AI au 1.1.2027 (2.10.2026)"]},"alv":{"intro":"Inscrivez-vous auprès de l’ORP de votre région au plus tard le premier jour pour lequel vous voulez toucher l’indemnité de chômage, le plus rapidement en ligne dans Job-Room. Exemple à Thoune : 30 ans, salaire mensuel de 6 500 francs, sans enfant, 14 mois de cotisation donnent 70 %, au maximum 260 indemnités journalières et 10 jours d’attente.","facts":[["Délai","Inscription à l’ORP au plus tard le 1er jour de chômage, mieux encore pendant le délai de congé."],["Montant","70 % du gain assuré. 80 % en cas d’enfants de moins de 25 ans, de gain jusqu’à 3 797 francs ou de rente AI dès 40 %."],["Durée","Au moins 12 mois de cotisation en 2 ans. 260 indemnités journalières, davantage en cas de période de cotisation plus longue. Délai-cadre : 2 ans."],["Compétence","ORP (inscription, conseil) et la caisse de chômage que vous choisissez (versement)."]],"steps":["S’inscrire en ligne via l’e-service d’inscription au placement (ORP) dans Job-Room, ou en personne auprès de l’ORP de votre région.","Chercher un emploi déjà pendant le délai de congé et justifier chaque candidature. Votre ORP fixe le nombre exigé.","Choisir une caisse de chômage, déposer la « demande d’indemnité de chômage » et les attestations de l’employeur (2 ans).","Premier entretien à l’ORP (convocation dans les 15 jours) : apporter la carte AVS ou d’assuré, une pièce d’identité et la preuve de vos recherches d’emploi.","Chaque mois, remettre les « indications de la personne assurée ». Les indemnités journalières suivent en règle générale le mois suivant."],"who":[1,1,0],"note":"Le SECO surveille l’assurance-chômage ; les ORP, les caisses de chômage et les services cantonaux l’appliquent ; l’inscription se fait directement auprès de l’ORP.","src":["arbeit.swiss : inscription et enregistrement","arbeit.swiss (SECO) : FAQ sur l’indemnité de chômage","ch.ch : chômage en Suisse","Fedlex : LACI (RS 837.0), art. 9, 17, 18, 22, 27"]},"kk":{"intro":"Vous pouvez changer d’assurance de base pour la fin de l’année si votre résiliation parvient à la caisse au plus tard le lundi 30 novembre 2026. La nouvelle caisse doit vous accepter sans questions de santé. Les primes 2027 figurent déjà dans le comparateur de primes de priminfo.admin.ch.","facts":[["Délai","La résiliation doit parvenir à la caisse au plus tard le dernier jour ouvrable de novembre (2026 : lundi 30 novembre). Seule la réception compte, pas le cachet postal. Recommandé : l’envoyer en recommandé d’ici la mi-novembre."],["Franchise","Adultes : CHF 300 ou, au choix, 500, 1 000, 1 500, 2 000, 2 500, plus 10 % de quote-part, au maximum CHF 700 par an. Enfants : pas de franchise, quote-part de CHF 350 au maximum."],["Changer de franchise","Franchise plus basse : à communiquer par écrit au plus tard le dernier jour ouvrable de novembre. Franchise plus haute : seulement au début de l’année ; la loi ne fixe pas de délai, Priminfo recommande de l’annoncer d’ici la mi-décembre."],["En cours d’année","Changement au 1er juillet seulement avec la franchise ordinaire (CHF 300) et le libre choix du fournisseur de soins, résiliation d’ici le 31 mars. Avec un modèle à choix restreint (p. ex. médecin de famille ou télémédecine), changement possible seulement pour la fin de l’année."],["Attention","Primes ou participations aux coûts impayées et rappelées d’ici le 30 novembre : la résiliation ne prend effet que si vous les payez, intérêts moratoires et frais de poursuite compris, d’ici le 31 décembre (art. 64a LAMal)."],["Compétence","Votre caisse actuelle et la nouvelle caisse. La Confédération (OFSP) approuve les primes."]],"steps":["Comparer les primes 2027 sur priminfo.admin.ch : saisir lieu de domicile, âge, franchise et modèle (p. ex. médecin de famille ou télémédecine).","Choisir la nouvelle caisse et lui demander l’assurance de base. Toute caisse doit vous accepter, sans questions de santé, sans réserve ni délai d’attente.","Résilier l’assurance de base actuelle par écrit, de préférence en recommandé d’ici la mi-novembre.","Ne pas résilier trop vite l’assurance complémentaire : pour elle, la caisse peut poser des questions de santé et refuser. Le délai de résiliation figure dans les conditions d’assurance, souvent trois mois pour la fin de l’année. La caisse n’a pas le droit de la résilier parce que vous changez d’assurance de base.","Attendre la confirmation de la nouvelle caisse : l’ancienne assurance ne prend fin que lorsque la nouvelle a annoncé la couverture sans interruption. Si l’annonce arrive trop tard, la nouvelle caisse doit prendre en charge la différence de prime."],"who":[1,0,0],"note":"La loi (LAMal) et l’approbation des primes relèvent de la Confédération (OFSP). La résiliation et l’adhésion se font directement auprès des caisses-maladie, aucune autorité ne les reçoit.","src":["Priminfo (OFSP) : FAQ, changer de caisse-maladie","Priminfo (OFSP) : comparateur de primes 2027","Priminfo (OFSP) : primes 2027 par canton","Fedlex : LAMal (RS 832.10), art. 7 et 64a"]},"biz":{"intro":"Si vous vous mettez à votre compte à Berne avec une entreprise individuelle, vous vous annoncez d’abord comme indépendant(e) auprès de la caisse de compensation. L’inscription au registre du commerce et à la TVA n’est obligatoire qu’à partir de CHF 100 000 de chiffre d’affaires par an. Les démarches se font en ligne sur EasyGov.swiss, le portail de la Confédération.","facts":[["AVS","Annonce à la caisse de compensation du siège de l’entreprise (Berne : AK Bern). Cotisation de 10 % du revenu, moins en dessous de CHF 60 500 ; en 2026, au minimum CHF 530 par an."],["Registre du commerce","Obligatoire dès CHF 100 000 de chiffre d’affaires lors du dernier exercice, sinon facultatif. Émolument CHF 120. La raison de commerce doit contenir votre nom de famille."],["TVA","Obligatoire dès CHF 100 000 de chiffre d’affaires par an, ou dès que c’est prévisible au démarrage. Inscription auprès de l’AFC dans les 30 jours."],["Autorisation","Nécessaire seulement pour certaines activités réglementées. À vérifier avant de démarrer."]],"steps":["Ouvrir un compte sur EasyGov.swiss, choisir «entreprise individuelle» et fixer la raison de commerce avec votre nom de famille.","Vous annoncer comme indépendant(e) à l’AK Bern, si possible au premier trimestre : en ligne ou avec le formulaire 318.146, avec des justificatifs comme factures, compte de résultat ou publicité.","Dès CHF 100 000 de chiffre d’affaires annuel : inscription au registre du commerce de Berne (CHF 120) et annonce à l’AFC pour la TVA dans les 30 jours.","Avant de démarrer, vérifier si votre activité exige une autorisation."],"who":[1,1,0],"note":"La caisse de compensation et le registre du commerce relèvent du canton (à Berne : AK Bern et registre du commerce du canton de Berne), la TVA est perçue par la Confédération (AFC). EasyGov.swiss est le guichet en ligne de la Confédération pour les trois.","src":["Portail PME (SECO) : entreprise individuelle","Registre du commerce de Berne : notice sur l’inscription d’une entreprise individuelle","Caisse de compensation du canton de Berne : indépendants","ahv-iv.ch : mémento 2.02, cotisations des indépendants","AFC : assujettissement à la TVA","EasyGov.swiss : fonder une entreprise individuelle"]},"drv":{"intro":"Si vous habitez en Suisse, vous pouvez conduire avec un permis étranger pendant 12 mois seulement. Dans le canton de Berne, vous l’échangez auprès de l’Office de la circulation routière (OCRN). Un permis allemand, délivré dans l’UE, ne demande pas de course de contrôle ; l’échange coûte CHF 120.","facts":[["Délai","12 mois dès l’entrée selon l’autorisation de séjour (art. 42 OAC). Déposer la demande avant, pour pouvoir conduire sans interruption. L’échange reste possible plus tard, mais une amende peut tomber."],["Course de contrôle","Aucune pour les permis de l’UE/AELE ainsi que d’Andorre, d’Australie, d’Israël, du Japon, du Canada, de Corée du Sud, du Maroc, de Monaco, de Nouvelle-Zélande, de Saint-Marin, de Singapour, de Taïwan, de Tunisie et des États-Unis. Tous les autres passent une course de contrôle."],["Coûts","Berne : échange CHF 120, course de contrôle catégorie B CHF 132."],["Compétence","Office de la circulation routière et de la navigation du canton de Berne (OCRN), Schermenweg 5, Berne."]],"steps":["Faire un test de la vue chez un opticien ou un ophtalmologue reconnu.","Remplir et signer le formulaire de demande de l’OCRN, y coller une photo passeport récente en couleur (35 × 45 mm).","Remettre la demande en personne : à un site de l’OCRN, au contrôle des habitants de votre commune ou à un poste de police du canton de Berne. Apporter : permis étranger original et passeport ou carte d’identité.","Si nécessaire, passer la course de contrôle. Vous recevez le permis suisse par la poste."],"who":[1,1,0],"note":"La Confédération (OFROU) règle l’échange dans l’ordonnance réglant l’admission à la circulation routière ; l’office cantonal de la circulation (à Berne l’OCRN) examine la demande et délivre le permis.","src":["Canton de Berne (OCRN) : échange d’un permis étranger","Canton de Berne (OCRN) : émoluments","ch.ch : échanger son permis de conduire","OFROU : échange des permis étrangers"]},"wed":{"intro":"Si vous êtes tous deux Suisses et habitez à Zurich, vous réservez d’abord en ligne le lieu et la date auprès de l’office de l’état civil de la ville de Zurich, au plus tôt 12 mois à l’avance. La préparation du mariage se fait à deux au guichet du Stadthaus, au plus tard 1 mois avant le mariage.","facts":[["Conditions","Avoir tous deux au moins 18 ans et être capables de discernement. Les parents en ligne directe ainsi que les frères et sœurs, germains ou demi-frères et sœurs, ne peuvent pas se marier entre eux."],["Délai","Invitation à la préparation au plus tôt 3 mois avant le mariage. La terminer au plus tard 1 mois avant, sinon la réservation est annulée."],["Coûts","Zurich : mariage le moins cher au Stadthaus dès CHF 255, préparation sans traduction comprise (uniquement avec domicile en ville de Zurich)."],["Témoins","Deux témoins majeurs et capables de discernement doivent être présents."]],"steps":["Réserver le lieu et la date sur le site de l’office de l’état civil de Zurich, au plus tôt 12 mois à l’avance.","Au plus tôt 3 mois avant le mariage, vous recevez une invitation par e-mail. Vous choisissez alors en ligne un rendez-vous pour la préparation.","Vous présenter à deux au guichet du Stadthaus, avec passeport ou carte d’identité. Vous remplissez et signez le formulaire et fixez les noms que vous et, le cas échéant, vos enfants porterez.","Payer les émoluments sur place par carte ou Twint. Venir au mariage avec deux témoins."],"who":[1,0,1],"note":"La Confédération fixe les règles du mariage (CC) et les émoluments ; à Zurich, l’office de l’état civil de la ville mène la préparation et célèbre le mariage.","src":["Ville de Zurich : se marier avec domicile à Zurich","Ville de Zurich : préparation du mariage","Ville de Zurich : questions et réponses sur le mariage","ch.ch : se marier en Suisse"]},"dog":{"intro":"En ville de Berne, vous annoncez votre chien aux services aux habitants avec le formulaire d’annonce d’un chien. Si vous avez repris le chien, vous annoncez le changement de détenteur à la banque de données AMICUS dans les 10 jours. La taxe sur les chiens est de CHF 150 par an.","facts":[["Annonce","Aux services aux habitants de la ville de Berne (Einwohnerdienste), Predigergasse 5, 3011 Berne. La commune vous enregistre comme détenteur dans AMICUS."],["Délai","Changement de détenteur (achat, reprise, remise pour plus de 3 mois) à annoncer à AMICUS dans les 10 jours. Chiens importés : faire contrôler et annoncer la puce par un vétérinaire dans les 10 jours."],["Coûts","Ville de Berne : CHF 150 par chien et par an, pour les chiens dès 6 mois. La facture arrive automatiquement en août."],["Puce","Obligatoire pour chaque chien ; chiots dans les 3 mois. Seuls les vétérinaires posent la puce et annoncent le chien à AMICUS."]],"steps":["Remplir le formulaire de la ville de Berne pour l’annonce d’un chien et l’envoyer par la poste aux services aux habitants.","Si le chien a déjà une puce : annoncer le changement de détenteur à AMICUS dans les 10 jours. Sinon : le faire pucer chez un vétérinaire.","Payer la taxe sur les chiens à réception de la facture en août.","En cas de déménagement, de remise ou de décès du chien : informer la commune et AMICUS."],"who":[1,0,1],"note":"La Confédération impose la puce et l’enregistrement dans AMICUS (ordonnance sur les épizooties) ; la commune reçoit l’annonce et perçoit la taxe sur les chiens.","src":["Ville de Berne : chiens","Ville de Berne : formulaire d’annonce d’un chien","AMICUS : bon à savoir (notice)","ch.ch : impôt sur les chiens"]},"fam":{"intro":"Si vous êtes salarié(e) dans le canton de Berne, vous demandez les allocations familiales à votre employeur. Il transmet la demande à sa caisse d’allocations familiales. L’allocation pour enfant est de CHF 250 par mois et par enfant (état 2026).","facts":[["Montant","Canton de Berne, état 2026 : allocation pour enfant CHF 250 par mois jusqu’au mois des 16 ans. Allocation de formation CHF 310 pour les enfants en formation, au plus tôt dès 15 ans, au plus tard jusqu’à 25 ans."],["Demande","Salariés : auprès de l’employeur. Personnes sans activité lucrative : auprès de la caisse de compensation cantonale (AK Bern)."],["Délai","Pas de délai fixe ; des allocations oubliées peuvent être réclamées jusqu’à 5 ans en arrière."],["Par enfant","Une seule allocation par enfant, même si les deux parents travaillent."]],"steps":["Demander à l’employeur le formulaire de demande d’allocations familiales.","Remplir et signer le formulaire avec les données de l’enfant et de l’autre parent.","L’employeur transmet la demande à sa caisse d’allocations familiales et verse l’allocation.","Si les deux parents travaillent : convenir d’abord qui dépose la demande, car il n’y a qu’une allocation par enfant."],"who":[1,1,0],"note":"La Confédération fixe les montants minimaux (loi sur les allocations familiales), le canton de Berne verse 115 % de ces montants ; le versement passe par la cinquantaine de caisses d’allocations familiales du canton.","src":["Portail des familles du canton de Berne : allocations pour enfant et de formation","ch.ch : allocations familiales","ahv-iv.ch : mémento 6.08 allocations familiales","Caisse de compensation du canton de Berne : allocations familiales"]},"debt":{"intro":"Dans le canton de Berne, vous commandez l’extrait du registre des poursuites en ligne auprès de l’office cantonal des poursuites et des faillites (be.ch/baka). Il coûte CHF 18 envoi compris et arrive sous forme électronique à télécharger.","facts":[["Coûts","Canton de Berne en ligne : CHF 18 envoi compris (émolument CHF 17 par extrait)."],["Contenu","Les poursuites des 5 dernières années dans l’arrondissement concerné."],["Déménagement","Si vous avez habité ailleurs ces 5 dernières années, commandez aussi un extrait là-bas, sinon ces poursuites manquent."],["Envoi","Commande en ligne entièrement électronique : téléchargement sur une plateforme sécurisée, possible plusieurs fois."]],"steps":["Commander en ligne sur be.ch/baka l’extrait du registre des poursuites vous concernant.","Préparer une pièce d’identité valable : carte d’identité, passeport ou livret pour étrangers.","Payer l’émolument lors de la commande : carte, PostFinance Pay ou Twint.","Télécharger l’extrait sur la plateforme sécurisée et le transmettre, par exemple au bailleur."],"who":[1,1,0],"note":"La Confédération règle le droit des poursuites (LP) et les émoluments ; dans le canton de Berne, l’office cantonal des poursuites et des faillites (BAKA) tient les registres.","src":["Canton de Berne (BAKA) : commander un extrait des poursuites","ch.ch : commander un extrait du registre des poursuites","Canton de Berne : commande en ligne de l’extrait des poursuites (communiqué)"]},"crim":{"intro":"L’extrait du casier judiciaire (extrait destiné à des particuliers) se commande auprès de la Confédération, en ligne sur strafregister.admin.ch ou au guichet de la Poste. Il coûte CHF 17 et arrive par la poste environ 10 jours ouvrables après réception du formulaire signé.","facts":[["Coûts","CHF 17 pour l’extrait. Légalisation ou apostille : CHF 20 en plus."],["Durée","Environ 10 jours ouvrables après réception du formulaire signé."],["Commande","En ligne sur strafregister.admin.ch ou en personne à un guichet de la Poste avec une pièce d’identité valable."],["Extrait spécial","Pour les activités avec des mineurs, il existe un extrait distinct, l’extrait spécial destiné à des particuliers."]],"steps":["Sur strafregister.admin.ch, choisir l’extrait destiné à des particuliers et saisir données personnelles, adresse et paiement.","Payer l’émolument en ligne : carte de débit ou de crédit, PostFinance Card ou Twint.","Imprimer le formulaire, le signer et l’envoyer par la poste avec une copie de votre pièce d’identité.","Autre possibilité : commander au guichet de la Poste avec passeport, carte d’identité ou livret pour étrangers et payer sur place."],"who":[1,0,0],"note":"Le casier judiciaire est tenu par la Confédération (Office fédéral de la justice). La commande se fait directement auprès de la Confédération ou à un guichet de la Poste.","src":["Office fédéral de la justice : commander l’extrait","Office fédéral de la justice : FAQ extrait pour particuliers","ch.ch : extrait du casier judiciaire"]},"car":{"intro":"Dans le canton de Berne, vous immatriculez la voiture auprès de l’Office de la circulation routière (OCRN), par la poste ou au guichet. Votre assurance envoie d’abord l’attestation d’assurance par voie électronique à l’office. Le permis de circulation coûte CHF 45 par la poste ou CHF 55 au guichet.","facts":[["Documents","Attestation d’assurance (envoyée par l’assurance à l’office par voie électronique), permis de circulation du détenteur précédent, rapport d’expertise si la voiture a été contrôlée, pièce d’identité."],["Coûts","Permis de circulation : CHF 45 par la poste, CHF 55 au guichet. Nouvelles plaques : CHF 45 la paire, CHF 30 l’unité."],["Délai","L’attestation d’assurance est valable 30 jours. L’impôt sur les véhicules se paie dans les 30 jours suivant la facture."],["Impôt","Impôt annuel sur les véhicules, facturé en janvier ou lors de l’immatriculation. Le calculateur de l’OCRN indique le montant."]],"steps":["Conclure une assurance responsabilité civile. L’assurance envoie l’attestation d’assurance à l’OCRN par voie électronique.","Remplir le formulaire de demande d’immatriculation d’un véhicule.","Envoyer le formulaire avec le permis de circulation du détenteur précédent, l’éventuel rapport d’expertise et une pièce d’identité à l’OCRN, Schermenweg 5, 3001 Berne, ou le remettre au guichet.","Par la poste, le nouveau permis de circulation arrive après quelques jours ouvrables. Payer ensuite la facture de l’impôt sur les véhicules dans les 30 jours."],"who":[1,1,0],"note":"La Confédération règle l’admission des véhicules ; l’office cantonal de la circulation (à Berne l’OCRN) délivre permis de circulation et plaques et perçoit l’impôt sur les véhicules.","src":["Canton de Berne (OCRN) : immatriculer un véhicule","Canton de Berne (OCRN) : marche à suivre pour l’immatriculation","Canton de Berne (OCRN) : documents pour l’immatriculation","Canton de Berne (OCRN) : calculer l’impôt sur les véhicules","ch.ch : immatriculer un véhicule"]},"nat":{"intro":"Vous remplissez les conditions de résidence : 10 ans en Suisse, permis C et au moins 2 ans dans le canton et la commune. S’y ajoutent l’attestation de langue, le test de naturalisation et l’intégration. Vous déposez la demande auprès de la ville de Berne ; pour une personne seule, commune, canton et Confédération coûtent ensemble CHF 1 650.","facts":[["Conditions","Permis C, 10 ans en Suisse au total, au moins 2 ans sans interruption dans le canton de Berne et dans la commune, intégration réussie."],["Langue","Canton de Berne : B1 à l’oral, A2 à l’écrit. Pas d’attestation si la langue officielle est votre langue maternelle ou si vous avez suivi au moins 5 ans d’école obligatoire dans cette langue."],["Test","Écrit, 90 minutes : géographie, histoire, démocratie, santé et travail, droits et devoirs. Est notamment dispensé qui a suivi au moins 5 ans d’école obligatoire en Suisse."],["Coûts","Personne seule en ville de Berne : commune CHF 400, canton CHF 1 150, Confédération CHF 100. Couple marié : 600, 1 725 et 150."]],"steps":["S’adresser à la commune de domicile (ville de Berne). Elle remet les formulaires et indique les documents nécessaires.","Obtenir l’attestation de langue (B1 à l’oral, A2 à l’écrit), si vous n’en êtes pas dispensé(e).","Déposer la demande complète auprès de la commune et passer le test de naturalisation, si vous n’en êtes pas dispensé(e).","La commune vous facture les émoluments de la commune et du canton ; la Confédération (SEM) décide de l’autorisation fédérale de naturalisation."],"who":[1,1,1],"note":"Se faire naturaliser, c’est acquérir trois droits de cité : commune, canton et Confédération examinent chacun leur part. La demande passe par la commune de domicile, le Secrétariat d’État aux migrations (SEM) délivre l’autorisation fédérale.","src":["Canton de Berne : séjour en Suisse (naturalisation)","Canton de Berne : connaissances linguistiques et attestation","Canton de Berne : test de naturalisation","Canton de Berne : émoluments de naturalisation","SEM : naturalisation ordinaire"]},"pv":{"intro":"Dans le canton de Berne, le canton examine en général automatiquement votre droit à la réduction des primes, sur la base des données fiscales définitives des deux années précédentes. En 2026, la limite est de CHF 35 000 de revenu déterminant, et de CHF 45 000 pour les familles avec enfants. Vous ne déposez une demande que dans des cas particuliers.","facts":[["Limite 2026","Revenu déterminant de CHF 35 000 au plus ; familles avec enfants : CHF 45 000 au plus."],["Examen","Automatique, sur la base des données fiscales définitives des deux années précédentes (revenu net et fortune)."],["Demande","Seulement dans des cas particuliers, par exemple si l’examen automatique n’est pas possible ou si le revenu ou la famille changent durablement et fortement. Possible aussi en ligne."],["Calculateur","Estimation sans engagement avec le calculateur en ligne sur be.ch/pvo-onlinerechner."]],"steps":["Vérifier avec le calculateur en ligne sur be.ch/pvo-onlinerechner si un droit est possible.","Déposer la déclaration d’impôt : l’examen automatique a besoin de données fiscales définitives.","Si le revenu ou la famille ont changé durablement et fortement : déposer une demande, aussi en ligne.","En cas de droit, le canton verse la réduction directement à votre caisse-maladie et votre facture de primes baisse."],"who":[1,1,0],"note":"La Confédération impose la réduction des primes dans la loi sur l’assurance-maladie et y contribue ; dans le canton de Berne, l’Office des assurances sociales (OAS) examine et décide.","src":["Canton de Berne (OAS) : droit à la réduction des primes","Canton de Berne (OAS) : quand déposer une demande","Canton de Berne (OAS) : feuille d’information réduction des primes 2026","Canton de Berne (OAS) : calculer le droit"]},"wpe":{"intro":"Oui. Qui n’accomplit pas, ou pas entièrement, son service militaire ou civil paie la taxe d’exemption de l’obligation de servir : 3 % du revenu imposable de l’impôt fédéral direct, au moins CHF 400 par an. Dans le canton de Berne, l’Office de la sécurité civile, du sport et des affaires militaires (OSSM) est compétent.","facts":[["Montant","3 % du revenu imposable de l’impôt fédéral direct, au moins CHF 400 par an."],["Durée","De 19 à 37 ans, au maximum 11 années de taxe."],["Protection civile","Qui fait du service de protection civile paie quand même, mais 4 % de moins par jour de service accompli dans l’année."],["Remboursement","Qui rattrape son service militaire ou civil et accomplit son obligation de servir est remboursé. Le droit se prescrit 5 ans après la fin de l’obligation de servir."]],"steps":["Déposer la déclaration d’impôt comme d’habitude : la taxe se calcule sur le revenu imposable de l’impôt fédéral direct.","La facture vient du service cantonal, dans le canton de Berne de l’OSSM.","En cas de handicap important et de revenu bas : faire examiner une exonération.","Service rattrapé : une fois l’obligation de servir accomplie, demander le remboursement à l’OSSM."],"who":[1,1,0],"note":"La taxe d’exemption est une contribution fédérale (AFC) ; les cantons, à Berne l’Office de la sécurité civile, du sport et des affaires militaires, la taxent et la perçoivent.","src":["AFC : la taxe d’exemption expliquée","Canton de Berne (OSSM) : taxe d’exemption","Canton de Berne (OSSM) : remboursement","ch.ch : taxe d’exemption de l’obligation de servir"]},"bau":{"intro":"Pas forcément. Dans le canton de Berne, un abri de jardin n’a pas besoin de permis de construire s’il mesure au plus 10 m² de surface et 2,5 m de haut, n’est pas chauffé, n’est ni habité ni utilisé à des fins commerciales et dépend d’un bâtiment principal. S’il est plus grand, vous déposez une demande de permis via eBau.","facts":[["Sans permis","Petite construction non chauffée jusqu’à 10 m² de surface et 2,5 m de haut, ni habitée ni commerciale, liée à un bâtiment principal (art. 6 du décret sur la procédure d’octroi du permis de construire)."],["À respecter quand même","Même sans permis, des règles s’appliquent, par exemple distances, protection incendie et prescriptions énergétiques."],["Exception","Hors de la zone à bâtir, même une petite construction exige un permis si elle modifie sensiblement les lieux, charge l’équipement ou porte atteinte à l’environnement."],["Demande de permis","Depuis mars 2022, uniquement par voie électronique via eBau dans tout le canton de Berne."]],"steps":["Vérifier les dimensions : au plus 10 m² de surface, 2,5 m de haut, non chauffé, uniquement pour entreposer.","Respecter les distances à la limite ainsi que la protection incendie et les prescriptions énergétiques.","En cas de doute, se renseigner auprès de l’inspection des constructions de la ville de Berne, qui répond aussi aux demandes préalables.","Si l’abri est plus grand ou qu’une condition n’est pas remplie : déposer la demande de permis par voie électronique via eBau."],"who":[0,1,1],"note":"Le canton fixe dans le décret sur la procédure d’octroi du permis de construire quelles constructions sont libres de permis ; en ville de Berne, l’inspection des constructions renseigne et examine les demandes.","src":["Canton de Berne : décret sur la procédure d’octroi du permis de construire (RSB 725.1), art. 6","Ville de Berne : quand faut-il un permis de construire ?","Ville de Berne : procédure de permis de construire"]},"lost":{"intro":"Annoncez la perte en personne : à un poste de police ou directement lors du rendez-vous au centre de documents d’identité, quand vous commandez le nouveau document. L’annonce de perte coûte CHF 40 dans le canton de Berne. Ensuite, l’ancien document n’est plus valable, même si vous le retrouvez.","facts":[["Annonce","En personne à un poste de police ou au centre de documents d’identité lors du rendez-vous pour le nouveau document."],["Coûts","Annonce de perte dans le canton de Berne : CHF 40. S’y ajoute le nouveau document au prix normal, par exemple carte d’identité adulte CHF 70."],["Validité","Avec l’annonce, le document devient invalide. Si vous le retrouvez, vous ne pouvez plus l’utiliser et le remettez au bureau des passeports."],["Nouveau document","Comme tout document : demande en ligne sur schweizerpass.ch, puis rendez-vous au centre de documents d’identité."]],"steps":["Annoncer la perte en personne : à un poste de police (vous recevez une déclaration de perte) ou directement lors du rendez-vous au centre de documents d’identité.","Demander le nouveau document en ligne sur schweizerpass.ch et réserver un rendez-vous dans un centre bernois.","Apporter au rendez-vous la déclaration de perte de la police, si vous l’avez annoncée là-bas.","Si l’ancien document réapparaît : ne plus l’utiliser et le remettre au bureau des passeports."],"who":[1,1,0],"note":"La Confédération (fedpol) est compétente pour les documents d’identité ; la perte est annoncée à la police ou aux centres cantonaux, dans le canton de Berne aussi aux sept centres de documents d’identité.","src":["Canton de Berne : perte de la carte d’identité ou du passeport","ch.ch : passeport ou carte d’identité perdu ou volé","fedpol : perte de documents d’identité"]},"kita":{"intro":"En ville de Berne, vous recevez des bons de garde pour une crèche reconnue si vous travaillez ensemble au moins 105 % (familles monoparentales 5 %) et que le revenu familial déterminant est inférieur à CHF 170 000. La demande se fait en ligne via kiBon ; le bon vaut à partir du mois qui suit la demande complète.","facts":[["Conditions","Domicile en ville de Berne, crèche ou organisation de familles de jour admise au système cantonal des bons de garde, enfant de 3 mois jusqu’à la fin de l’école enfantine."],["Taux d’activité","Les deux parents ensemble au moins 105 %, familles monoparentales au moins 5 %."],["Revenu","Période du 1er août 2026 au 31 juillet 2027 : revenu familial déterminant inférieur à CHF 170 000."],["Début","Le bon ne vaut qu’à partir du mois qui suit la réception de la demande complète, sans effet rétroactif."]],"steps":["Estimer le montant du bon avec le calculateur de la ville de Berne.","Choisir une crèche admise au système cantonal des bons de garde.","Déposer la demande en ligne via kiBon (ou sur papier), avec des justificatifs du taux d’activité comme contrat de travail ou relevé d’heures.","Déposer la demande tôt et complète, car le bon ne vaut qu’à partir du mois suivant."],"who":[0,1,1],"note":"Le canton de Berne règle le système des bons de garde et exploite kiBon ; la ville de Berne examine les demandes, émet les bons et verse son propre supplément.","src":["Ville de Berne : bons de garde","Ville de Berne : FAQ sur les bons de garde","Ville de Berne : calculateur de bons","Canton de Berne (DSSI) : bons de garde"]},"soz":{"intro":"En ville de Berne, vous vous annoncez en personne au service social, Schwarztorstrasse 71, avec une pièce d’identité officielle. Vous y recevez une liste personnelle des documents nécessaires. Le calculateur d’aide sociale de la ville de Berne donne une première estimation du droit.","facts":[["Annonce","En personne au service social de la ville de Berne, Schwarztorstrasse 71, avec une pièce d’identité officielle. Les nouveaux arrivants pas encore inscrits au contrôle des habitants apportent une copie du bail."],["Documents","Le formulaire de demande indique les documents habituels ; au guichet, vous recevez une liste personnelle et une procuration."],["Montant","Selon les normes de la CSIAS, échelonné selon la taille du ménage. Le calculateur d’aide sociale de la ville de Berne donne une première estimation."],["Remboursement","L’aide sociale peut être réclamée plus tard si les conditions du remboursement sont remplies."]],"steps":["Vérifier avec le calculateur d’aide sociale de la ville de Berne si un droit est possible.","S’annoncer en personne au service social, Schwarztorstrasse 71, avec une pièce d’identité (nouveaux arrivants : copie du bail).","Remplir le formulaire de demande et remettre les documents selon la liste.","Signer la procuration et la remettre avec la demande."],"who":[0,1,1],"note":"Le canton de Berne règle l’aide sociale et s’appuie sur les normes CSIAS ; votre demande relève du service social de votre commune de domicile, à Berne du service social de la ville.","src":["Ville de Berne : s’annoncer à l’aide sociale","Ville de Berne : qui peut demander l’aide sociale ?","Ville de Berne : calculateur d’aide sociale","Ville de Berne : aide sociale et service social"]},"el":{"intro":"Oui, si la rente et vos autres revenus ne couvrent pas vos besoins vitaux et que votre fortune nette est inférieure à CHF 100 000 (couples CHF 200 000). Dans le canton de Berne, vous remettez le formulaire d’inscription à l’agence AVS de votre commune de domicile ; la caisse de compensation du canton de Berne décide.","facts":[["Fortune","Fortune nette inférieure à CHF 100 000 pour une personne seule, à CHF 200 000 pour un couple marié."],["Besoins vitaux","Dès 2027 (personnes vivant à domicile) : CHF 21 000 par an pour une personne seule, CHF 31 500 pour un couple."],["Inscription","Remettre le formulaire officiel d’inscription à l’agence AVS de votre commune de domicile."],["Compétence","La caisse de compensation du canton de Berne examine la demande et décide."]],"steps":["Télécharger et remplir le formulaire d’inscription aux prestations complémentaires de la caisse de compensation du canton de Berne.","Joindre les justificatifs demandés dans le formulaire.","Remettre le formulaire à l’agence AVS de votre commune de domicile (ici Thoune).","La caisse de compensation examine revenus et fortune et vous communique sa décision."],"who":[1,1,1],"note":"La Confédération règle les prestations complémentaires et fixe les montants ; la caisse de compensation du canton de Berne décide, l’agence AVS de la commune reçoit l’inscription.","src":["Caisse de compensation du canton de Berne : prestations complémentaires","ahv-iv.ch : mémento 5.01 prestations complémentaires","Caisse de compensation du canton de Berne : formulaire d’inscription PC","Conseil fédéral : adaptations au 1.1.2027 (2.10.2026)"]},"iv":{"intro":"Annoncez-vous à l’office AI du canton de Berne, et tôt : une rente AI est versée au plus tôt 6 mois après l’inscription. L’AI examine d’abord si des mesures peuvent vous aider à rester dans la vie active (la réadaptation prime la rente).","facts":[["Détection précoce","Dès 30 jours d’incapacité de travail ou en cas d’absences brèves fréquentes, une communication à l’office AI est possible, par exemple par l’employeur. On y clarifie si une inscription est nécessaire."],["Rente","Au plus tôt 6 mois après l’inscription. Condition : une année d’incapacité de travail d’au moins 40 % en moyenne, puis une incapacité de gain d’au moins 40 %."],["Priorité","La réadaptation prime la rente : l’AI examine d’abord des mesures qui maintiennent ou améliorent votre capacité de gain."],["Déroulement","Après l’inscription, l’office AI vous invite à un premier entretien et recueille des informations sur votre santé."]],"steps":["Remplir le formulaire d’inscription à l’AI.","Remettre l’inscription à l’office AI du canton de Berne, pas trop tard, car la rente commence au plus tôt 6 mois après.","Se rendre au premier entretien. L’AI recueille les informations nécessaires sur votre santé.","Participer aux mesures de réadaptation. L’AI ne décide d’une rente que si elles ne suffisent pas."],"who":[1,1,0],"note":"L’assurance-invalidité est une assurance fédérale (OFAS) ; elle est appliquée par les offices AI cantonaux, à Berne par l’office AI du canton de Berne.","src":["Office AI du canton de Berne : inscription et procédure","Office AI du canton de Berne : détection précoce et réadaptation","ahv-iv.ch : mémento 4.04 rentes d’invalidité","ch.ch : assurance-invalidité"]},"mse":{"intro":"Si vous exerciez une activité lucrative avant l’accouchement, vous recevez pendant 14 semaines l’allocation de maternité : 80 % de votre revenu moyen, au maximum CHF 220 par jour. Vous la demandez à la caisse de compensation AVS.","facts":[["Droit","Assurée à l’AVS durant les 9 mois précédant l’accouchement et avoir exercé une activité lucrative pendant au moins 5 mois durant cette période. Être salariée, indépendante ou au chômage à la naissance."],["Montant","80 % du revenu moyen avant l’accouchement, au maximum CHF 220 par jour. Les salariées atteignent le maximum dès un salaire mensuel de CHF 8 250."],["Durée","98 jours (14 semaines) dès la naissance. Si vous reprenez une activité lucrative plus tôt, le droit prend fin. Si l’enfant reste au moins 2 semaines à l’hôpital juste après la naissance, la durée est prolongée de 56 jours au plus."],["Délai","Le droit peut être exercé jusqu’à 5 ans après la fin du congé de maternité."]],"steps":["Remplir le formulaire « Demande d’allocation de maternité » (318.750).","Si vous êtes salariée : l’employeur atteste la durée de l’emploi et le salaire.","Remettre la demande à la caisse de compensation AVS compétente, celle à laquelle les dernières cotisations ont été versées."],"who":[1,0,0],"note":"L’allocation de maternité fait partie du régime fédéral des allocations pour perte de gain (APG, OFAS). Elle est versée par les caisses de compensation AVS.","src":["OFAS : APG en cas de maternité","ahv-iv.ch : mémento 6.02 allocation de maternité","OFAS : quand ai-je droit ?","ch.ch : congé de maternité"]},"pat":{"intro":"En tant que père (ou épouse de la mère), vous avez droit à 2 semaines de congé payé, à prendre dans les 6 mois suivant la naissance. L’allocation s’élève à 80 % du revenu, au maximum CHF 220 par jour. Elle n’est pas versée automatiquement : il faut la demander.","facts":[["Droit","Père juridique de l’enfant ou épouse de la mère. Assuré à l’AVS durant les 9 mois précédant la naissance et avoir exercé une activité lucrative pendant au moins 5 mois durant cette période."],["Durée","2 semaines (10 jours de travail), en bloc ou par journées. À prendre dans les 6 mois suivant la naissance ; ensuite, les jours non pris sont perdus."],["Montant","80 % du revenu moyen avant la naissance, au maximum CHF 220 par jour. Pour 2 semaines, 14 indemnités journalières sont versées, soit au maximum CHF 3 080."],["Demande","Formulaire « Demande d’allocation à l’autre parent » (318.747) auprès de la caisse de compensation AVS compétente. Pour les salariés, c’est en règle générale l’employeur qui la transmet."]],"steps":["Planifier le congé avec l’employeur et le prendre dans les 6 mois suivant la naissance.","Remplir le formulaire 318.747.","Salarié : remettre le formulaire à l’employeur, qui le transmet à sa caisse de compensation. Indépendant : directement à votre caisse de compensation."],"who":[1,0,0],"note":"L’allocation à l’autre parent fait partie du régime fédéral des allocations pour perte de gain (APG, OFAS). Elle est versée par les caisses de compensation AVS.","src":["OFAS : APG en cas de paternité","ahv-iv.ch : mémento 6.04 allocation à l’autre parent","OFAS : quand ai-je droit ?","ch.ch : congé de paternité"]},"lfa":{"intro":"Le permis d’élève conducteur pour la voiture (catégorie B) s’obtient dès 17 ans. Dans le canton de Berne, vous déposez la demande en personne avec le test de la vue, l’attestation de premiers secours et une photo d’identité. Après avoir réussi l’examen théorique de base, vous recevez le permis d’élève.","facts":[["Âge","Catégorie B dès 17 ans. L’examen théorique de base est possible au plus tôt un mois avant l’âge minimum."],["Conditions","Cours de premiers secours (attestation valable 6 ans), test de la vue chez un opticien ou un ophtalmologue reconnu (valable 2 ans), photo d’identité."],["Coûts","Canton de Berne : demande CHF 30, établissement du permis d’élève CHF 20, examen théorique de base CHF 30."],["Phase d’apprentissage","Le permis d’élève B est valable 24 mois. Qui l’obtient avant ses 20 ans doit le détenir au moins 12 mois avant l’examen pratique."]],"steps":["Suivre le cours de premiers secours et faire le test de la vue.","Remplir le formulaire de demande et le déposer en personne avec photo, pièce d’identité originale et attestation de premiers secours : dans un site de l’office de la circulation routière (OCRN), un poste de police ou à l’administration communale.","Réserver une date pour l’examen théorique de base avec le numéro de référence de la lettre d’admission.","Après l’examen réussi, vous recevez le permis d’élève (aussi possible en version électronique sur le téléphone)."],"who":[1,1,0],"note":"Les règles (âge minimum, phase d’apprentissage) sont fixées par la Confédération (OFROU). Demande, examen et permis passent par l’office cantonal de la circulation routière, à Berne l’OCRN.","src":["OCRN Berne : demander un permis d’élève","OCRN Berne : émoluments","OCRN Berne : informations pour les élèves conducteurs","OFROU : questions et réponses sur la formation"]},"wsb":{"intro":"En ville de Berne, vous commandez l’attestation de domicile en ligne ou la retirez au guichet du contrôle des habitants. Elle coûte CHF 20.","facts":[["Coût","CHF 20, identique pour les Suisses, les ressortissants UE/AELE et des États tiers. En ligne, vous payez à la fin de la commande (Mastercard, Visa, PostFinance)."],["Utilité","Par exemple pour des bourses, des assurances ou la naturalisation."],["Guichet","Einwohnerdienste, Migration und Fremdenpolizei, Predigergasse 5, 3011 Berne. Du lundi au vendredi de 10 h à 16 h, le jeudi jusqu’à 18 h."]],"steps":["Remplir le formulaire en ligne « Bestellung Wohnsitzbescheinigung » de la ville de Berne.","Payer en ligne à la fin.","Ou sans commande en ligne : la retirer au guichet du contrôle des habitants, Predigergasse 5."],"who":[0,0,1],"note":"Les attestations de domicile sont délivrées par la commune de domicile, en ville de Berne par les Einwohnerdienste, Migration und Fremdenpolizei.","src":["Ville de Berne : attestation de domicile","Ville de Berne : commande en ligne","Ville de Berne : contact contrôle des habitants"]},"tod":{"intro":"Un décès doit être annoncé à l’office de l’état civil dans les 2 jours. Si la personne meurt à domicile, appelez d’abord un médecin pour le certificat de décès. En ville de Berne, vous annoncez aussi le décès à l’office des inhumations, vous-même ou par une entreprise de pompes funèbres.","facts":[["Délai","Dans les 2 jours, à l’office de l’état civil du lieu du décès."],["Hôpital ou home","Si la personne meurt à l’hôpital ou dans un home, l’établissement annonce le décès à l’office de l’état civil."],["Documents","Passeport ou carte d’identité de la personne qui annonce, certificat médical de décès, si disponible livret de famille ou certificat de famille."],["Inhumation gratuite","Ville de Berne : pour les habitants sans succession suffisante (en règle générale moins de CHF 8 000), la ville prend en charge une inhumation simple. Les proches font la demande en même temps que l’annonce du décès."]],"steps":["Décès à domicile : appeler un médecin et demander le certificat médical de décès.","Annoncer le décès dans les 2 jours à l’office de l’état civil du lieu du décès (à l’hôpital ou au home, l’établissement s’en charge).","Annoncer le décès à l’office des inhumations de la ville de Berne, vous-même ou par une entreprise de pompes funèbres. L’office organise la crémation ou l’inhumation.","Régler les autres démarches (employeur, assurances, banques, succession) avec la liste de contrôle de ch.ch."],"who":[0,1,1],"note":"L’enregistrement du décès relève de l’office cantonal de l’état civil. L’inhumation et le cimetière relèvent de la commune, en ville de Berne de l’office des inhumations (Predigergasse 5).","src":["Canton de Berne : décès (état civil)","Ville de Berne : annonce d’un décès","Ville de Berne : inhumation gratuite","ch.ch : liste de contrôle en cas de décès"]},"pk":{"intro":"En ville de Berne, vous demandez la carte de stationnement pour résidents en ligne. Elle vaut dans votre zone et coûte selon la ville CHF 264 par an (CHF 22 par mois).","facts":[["Conditions","Vous êtes annoncé dans la zone comme habitant ou en séjour hebdomadaire et figurez en premier, avec nom et adresse, sur le permis de circulation. Les cartes sont délivrées pour des voitures automobiles légères, en règle générale des voitures de tourisme."],["Coûts","CHF 264 par an, CHF 22 par mois."],["Validité","Un an à partir du mois d’émission, au minimum 3 mois. Si vous rendez la carte plus tôt, l’émolument des mois entiers non utilisés est remboursé (pas pour la durée minimale de 3 mois)."],["Zone","La carte vaut uniquement dans la zone autorisée."]],"steps":["Vérifier si votre adresse se trouve dans une zone de cartes de stationnement.","Remplir le formulaire en ligne « Anwohnerparkkarte » de la ville de Berne.","Payer l’émolument électroniquement. La carte arrive par la poste."],"who":[0,0,1],"note":"Les cartes de stationnement relèvent de la commune, en ville de Berne de la police locale et du commerce (inspection de police).","src":["Ville de Berne : cartes de stationnement des quartiers","Ville de Berne : formulaire en ligne","Ville de Berne : cartes de stationnement en ligne"]},"spg":{"intro":"En ville de Berne, il y a trois possibilités : déposer les petits encombrants avec une vignette le jour de ramassage des ordures, apporter les plus grands dans une déchetterie ou les faire enlever par le service d’enlèvement (CHF 70.27 forfait).","facts":[["Petits encombrants","Objets combustibles jusqu’à 100 × 50 × 50 cm et 25 kg (par ex. balais, petits meubles, tapis) : avec une vignette, à côté des sacs taxés le jour de ramassage. 10 vignettes coûtent CHF 44.10."],["Déchetteries","Fellerstrasse 13a et Schermen (Wölflistrasse 17). Du lundi au vendredi de 8 h à 12 h et de 13 h à 18 h 30, le samedi de 8 h à 15 h."],["Service d’enlèvement","CHF 70.27 forfait, 5 minutes de chargement comprises ; chaque tranche supplémentaire de 5 minutes CHF 54.05. Votre présence n’est pas nécessaire."],["Inscription","Jusqu’à 11 h 30 le jour ouvrable précédant l’enlèvement ; pour le lundi, jusqu’au vendredi 11 h 30. Enlèvement le lundi, mardi, jeudi et vendredi."]],"steps":["Vérifier la taille : jusqu’à 100 × 50 × 50 cm et 25 kg, c’est un petit encombrant.","Petit encombrant : acheter une vignette et le déposer à côté des sacs taxés le jour de ramassage.","Encombrant plus grand : l’apporter à la déchetterie Fellerstrasse ou Schermen, ou commander le service d’enlèvement jusqu’à 11 h 30 le jour ouvrable précédent."],"who":[0,0,1],"note":"L’élimination des déchets relève de la commune, en ville de Berne d’Entsorgung + Recycling Stadt Bern (ERB).","src":["Ville de Berne : encombrants","Ville de Berne : service d’enlèvement","Ville de Berne : petits encombrants","Ville de Berne : déchetteries"]},"fund":{"intro":"Si vous avez perdu quelque chose en ville de Berne, annoncez la perte en ligne au bureau des objets trouvés ; il vous contacte dès que l’objet arrive. Vous avez trouvé quelque chose ? Apportez-le au bureau, Theatergässchen 2.","facts":[["Annoncer une perte","En ligne pour les pertes sur le territoire de la ville. Parapluies, vêtements (sauf vestes) et livres ne peuvent pas être annoncés en ligne ; contactez directement le bureau (031 321 50 50)."],["Retrait","Le bureau remet l’objet si la description et les circonstances de la perte correspondent aux indications de la personne qui l’a trouvé. Les objets sont conservés un an."],["Récompense","En règle générale 10 % de la valeur, réduite de manière appropriée pour les objets de grande valeur. Pas de récompense pour les objets trouvés dans une maison, les objets volés et ceux trouvés dans des commerces."],["Bureau","Theatergässchen 2, 3011 Berne. Du lundi au vendredi de 10 h à 16 h, le jeudi jusqu’à 18 h."]],"steps":["Perte : remplir l’annonce de perte en ligne auprès du bureau des objets trouvés de la ville de Berne.","Quand le bureau vous contacte, retirer l’objet au Theatergässchen 2.","Objet trouvé : l’apporter au bureau. Si personne ne se manifeste dans l’année, vous pouvez le recevoir contre un émolument de garde d’environ 5 % de la valeur estimée."],"who":[0,0,1],"note":"Les objets trouvés relèvent de la commune, en ville de Berne du bureau des objets trouvés (inspection de police). Les règles sur la trouvaille et la récompense figurent dans le Code civil.","src":["Ville de Berne : bureau des objets trouvés","Ville de Berne : contact","Ville de Berne : ordonnance sur les objets trouvés","ch.ch : objets trouvés"]},"bet":{"intro":"Si quelqu’un ne paie pas une facture, vous déposez une réquisition de poursuite à l’office des poursuites du domicile du débiteur. Vous avancez les frais ; si la poursuite est justifiée, ils sont ensuite à la charge de l’autre partie. Dans le canton de Berne, ce sont les offices des poursuites (OPF).","facts":[["Où","Office des poursuites du domicile du débiteur. Vous pouvez remplir la réquisition en ligne via le guichet des poursuites."],["Coûts","En tant que créancier, vous avancez les frais de chaque étape. Les émoluments sont les mêmes dans toute la Suisse et dépendent du montant de la créance."],["Commandement de payer","L’office notifie un commandement de payer à l’autre partie. Elle a 20 jours pour payer et 10 jours pour former opposition."],["Opposition","Si l’autre partie forme opposition, un tribunal décide, sur votre requête, si la poursuite peut continuer."]],"steps":["Remplir la réquisition de poursuite (en ligne au guichet des poursuites ou avec le formulaire officiel de la Confédération).","La déposer à l’office des poursuites du domicile de l’autre partie et payer l’avance de frais.","Sans paiement ni opposition : déposer la réquisition de continuer la poursuite. En cas d’opposition : demander au tribunal la mainlevée."],"who":[1,1,0],"note":"Le droit des poursuites (LP) et les émoluments sont fixés par la Confédération. Les poursuites sont menées par les offices des poursuites, dans le canton de Berne par les offices des poursuites et des faillites.","src":["ch.ch : poursuite","Canton de Berne : offices des poursuites et des faillites","Office fédéral de la justice : formulaires LP"]},"abm":{"intro":"Dans le canton de Berne, la mise hors circulation est gratuite : vous envoyez le permis de circulation original avec la mention « annuler » à l’office de la circulation routière (OCRN). Si vous n’immatriculez pas d’autre véhicule dans les 14 jours, rendez aussi les plaques.","facts":[["Coûts","La mise hors circulation est gratuite. Faire entreposer les plaques pendant un an coûte CHF 30 ; l’émolument de remise en circulation tombe alors."],["Plaques","Depuis le 1er mars 2025, vous devez indiquer au retour si l’OCRN doit entreposer ou éliminer les plaques. Sans indication, elles sont éliminées."],["Impôt et assurance","Pendant le dépôt des plaques, vous ne payez ni assurance responsabilité civile ni impôt sur les véhicules. L’impôt payé en trop est compensé et un solde est remboursé ; la date déterminante est l’arrivée des plaques à l’OCRN."],["Adresse","SVSA Verkehrszulassung, Schermenweg 5, case postale, 3001 Berne."]],"steps":["Noter « annuler » sur le permis de circulation original.","Envoyer le permis par la poste à l’OCRN. Si vous n’immatriculez pas de nouveau véhicule dans les 14 jours : joindre les plaques ou les déposer dans une boîte de retour sur un site de l’OCRN.","Indiquer si les plaques doivent être entreposées (CHF 30, un an) ou éliminées."],"who":[1,1,0],"note":"Les règles d’admission sont fixées par la Confédération. Mise hors circulation, plaques et impôt passent par l’office cantonal de la circulation routière, à Berne l’OCRN.","src":["OCRN Berne : mettre un véhicule hors circulation","OCRN Berne : déposer les plaques","OCRN Berne : entreposage des plaques","ch.ch : immatriculer et mettre hors circulation"]},"wa":{"intro":"Si vous logez en semaine en ville de Berne et passez régulièrement vos jours libres dans une autre commune, annoncez-vous dans les 14 jours comme personne en séjour hebdomadaire, le plus simplement en ligne.","facts":[["Qui","Toute personne qui loge sur son lieu de travail, de formation ou d’études et passe régulièrement ses jours libres (en général le week-end) dans une autre commune."],["Délai","Dans les 14 jours après l’arrivée, auprès du contrôle des habitants de la ville de Berne."],["Attestation de domicile","L’annonce s’accompagne d’une attestation de séjour externe de votre commune de domicile. En raison d’une modification légale, ces attestations ne seront plus délivrées ; si votre commune n’en délivre plus, vous pouvez y renoncer."],["Impôts","Pour les personnes célibataires, on présume que le centre de vie se trouve au lieu de séjour hebdomadaire. Vous pouvez le réfuter si vous rentrez régulièrement les jours libres et y entretenez des liens familiaux et sociaux particulièrement étroits."]],"steps":["Demander une attestation à votre commune de domicile (si elle en délivre encore).","Remplir le formulaire en ligne « Zuzug Wochenaufenthalt » de la ville de Berne et payer les éventuels émoluments en ligne.","Si le séjour se prolonge, le prolonger avec le formulaire « Verlängerung Wochenaufenthalt »."],"who":[0,0,1],"note":"L’annonce et le registre relèvent de la commune, en ville de Berne des Einwohnerdienste, Migration und Fremdenpolizei. Les questions fiscales sont tranchées par l’administration fiscale.","src":["Ville de Berne : séjour hebdomadaire","Ville de Berne : formulaire en ligne d’arrivée","Ville de Berne : prolongation","Ville de Berne : arrivée, déménagement et départ"]},"kir":{"intro":"Dans le canton de Berne, vous quittez une Église nationale par une lettre signée personnellement adressée à votre paroisse. L’obligation de payer l’impôt ecclésiastique prend fin avec la sortie ; pour l’année en cours, vous payez au prorata.","facts":[["Forme","Par écrit, par lettre avec signature manuscrite. Un e-mail ne suffit pas. Contenu : déclaration claire de sortie, nom, adresse et date de naissance."],["Adresse","Au conseil de paroisse de votre paroisse ou au service qu’il a désigné (par ex. pour les catholiques de la ville de Berne : Röm.-kath. Gesamtkirchgemeinde Bern, Frohbergweg 4, 3012 Berne)."],["Effet","Dès le jour où vous remettez la déclaration au service compétent, à la Poste suisse ou à une représentation suisse à l’étranger."],["Impôt ecclésiastique","L’assujettissement prend fin avec la déclaration de sortie valable. En cas de sortie en cours d’année, l’impôt ecclésiastique est perçu au prorata."]],"steps":["Écrire la lettre de sortie : intention de sortir, nom, adresse, date de naissance, signature manuscrite.","L’envoyer par la poste au conseil de paroisse.","Lors de la prochaine déclaration d’impôt, l’impôt ecclésiastique n’est plus perçu à partir de la sortie."],"who":[0,1,0],"note":"Les règles sur la sortie et l’impôt ecclésiastique sont fixées par le canton de Berne. La sortie est reçue par la paroisse.","src":["Canton de Berne : ordonnance sur l’appartenance à une Église nationale","Canton de Berne TaxInfo : impôt ecclésiastique","Église catholique région de Berne : entrée et sortie"]},"dieb":{"intro":"Dans le canton de Berne, vous annoncez un vélo volé en ligne 24 h sur 24 via Suisse ePolice. Préparez la marque, le modèle, la couleur et le numéro de cadre. Vous pouvez aussi déposer plainte dans un poste de police.","facts":[["En ligne","Via Suisse ePolice, 24 h sur 24. Possible pour les vélos, cyclomoteurs, skis, snowboards, appareils électroniques et plaques de contrôle volés."],["Indications","Marque, modèle, couleur et numéro de cadre. La police cantonale recommande de noter ces caractéristiques à l’avance et de les conserver."],["Recherches","Les vélos volés annoncés sont transmis aux systèmes de recherche nationaux et internationaux."],["Poste de police","Autre possibilité : plainte dans un poste de police. À apporter : pièce d’identité officielle avec photo et les documents correspondants."]],"steps":["Retrouver le numéro de cadre, la marque, le modèle et la couleur (par ex. sur la quittance d’achat).","Annoncer le vol en ligne via Suisse ePolice.","Ou déposer plainte dans un poste de la police cantonale bernoise, avec une pièce d’identité officielle."],"who":[0,1,0],"note":"Les plaintes sont reçues par la police cantonale. Suisse ePolice est le poste de police en ligne commun de plusieurs cantons.","src":["Police cantonale bernoise : plaintes en ligne","Police cantonale bernoise : vol et brigandage","Suisse ePolice","ch.ch : déposer plainte"]},"vor":{"intro":"Un mandat pour cause d’inaptitude s’écrit à la main ou se fait authentifier par un notaire. Dans le canton de Berne, vous pouvez faire inscrire à l’office de l’état civil le lieu où il est déposé ; cela coûte CHF 75. Ainsi, l’APEA le trouve en cas de besoin.","facts":[["Forme","Entièrement écrit à la main, daté et signé (comme un testament) ou constitué en la forme authentique par un notaire."],["Lieu de dépôt","L’office de l’état civil inscrit l’endroit où le mandat est conservé. L’autorité de protection de l’enfant et de l’adulte (APEA) peut consulter cette information en cas de besoin."],["Coûts","Inscription CHF 75. Confirmation de l’inscription sur demande CHF 30."],["Où","Dans l’office de l’état civil de votre choix dans le canton de Berne."]],"steps":["Écrire le mandat à la main, le dater et le signer, ou le faire authentifier par un notaire.","Choisir le lieu de conservation.","Prendre rendez-vous dans un office de l’état civil ou remplir la demande écrite et l’envoyer à un office. Le lieu de dépôt est inscrit."],"who":[1,1,0],"note":"Le mandat pour cause d’inaptitude est réglé dans le Code civil. L’office cantonal de l’état civil inscrit le lieu de dépôt ; l’APEA l’examine et le met en œuvre en cas de besoin.","src":["Canton de Berne : mandat pour cause d’inaptitude (état civil)","Canton de Berne : inscrire le lieu de dépôt","APEA canton de Berne : mandat et directives anticipées"]},"aus":{"intro":"Un à deux mois avant l’échéance, vous recevez un avis d’échéance. Renvoyez-le rempli, avec les documents demandés, par e-mail ou par la poste aux Einwohnerdienste, Migration und Fremdenpolizei de la ville de Berne.","facts":[["Avis d’échéance","Arrive un à deux mois avant l’échéance de l’autorisation. Si vous n’en avez pas reçu, contactez vous-même le service (031 321 53 00)."],["Envoi","Rempli, avec les documents indiqués dans l’avis, par e-mail ou par la poste. Le traitement peut prendre du temps ; la ville vous contacte dès que l’autorisation est prolongée."],["Biométrie","Si nécessaire, vous recevez une invitation écrite pour donner vos données biométriques dans un centre de documents d’identité."],["Validité B","Canton de Berne : en règle générale 5 ans pour les ressortissants UE/AELE, 1 an pour les ressortissants d’États tiers."]],"steps":["Attendre l’avis d’échéance (un à deux mois avant) et le remplir.","L’envoyer avec les documents demandés par e-mail ou par la poste au service de la ville de Berne.","Si vous êtes invité : donner vos données biométriques au centre. Le nouveau titre suit."],"who":[1,1,1],"note":"Les règles sont fixées par la Confédération (SEM). En ville de Berne, les Einwohnerdienste, Migration und Fremdenpolizei reçoivent la prolongation ; le canton règle le titre de séjour.","src":["Ville de Berne : prolongation des autorisations","Canton de Berne : autorisation de séjour (permis B)","Ville de Berne : Einwohnerdienste, Migration und Fremdenpolizei"]},"nam":{"intro":"Après le divorce, vous gardez le nom porté pendant le mariage. Vous pouvez toutefois déclarer en tout temps devant l’office de l’état civil vouloir reprendre votre nom de célibataire. Dans le canton de Berne, cela coûte CHF 75.","facts":[["Délai","Aucun. La déclaration est possible en tout temps dès que le mariage n’existe plus."],["Où","Sur rendez-vous dans l’un des sept offices de l’état civil du canton de Berne ou dans tout autre office de l’état civil de Suisse."],["Coûts","Déclaration de nom CHF 75. Confirmation sur demande CHF 30. Paiement sur place."],["À distinguer","Si vous voulez un autre nom que votre nom de célibataire, il faut une demande de changement de nom auprès du canton."]],"steps":["Prendre rendez-vous dans un office de l’état civil.","Faire la déclaration de nom sur place et payer l’émolument."],"who":[1,1,0],"note":"Le droit du nom figure dans le Code civil. La déclaration est reçue par l’office cantonal de l’état civil.","src":["Canton de Berne : déclaration concernant le nom","ch.ch : nom après le divorce","Canton de Berne : changement de nom"]}}},"it":{"ask_label":"Cosa desidera sapere?","send":"Invii la domanda","nav":["Vista cittadini","Vista delle autorità","Progetto","Pagina iniziale","Menu","Pagine"],"f_links":["Contatto","Vista delle autorità","Vista cittadini","Progetto"],"f_sender":"Concetto privato di Bilal Simsek, Berna. Non è un'offerta di un'autorità. I Suoi riscontri sono benvenuti: {c}","f_legal":"Protezione dei dati, condizioni d'uso e accessibilità non sono elaborate nel concetto. Il prototipo non raccoglie dati personali, non imposta cookie e non utilizza strumenti di analisi; nel browser viene memorizzato solo, in locale, che Lei ha letto l'avviso.","f_note":"Prototipo concettuale. Tutte le risposte sono esempi e non sostituiscono l'informazione di un'autorità.","banner_s":"Prototipo concettuale, non un sito ufficiale","skip":"Vai al contenuto","chips":[{"l":"Trasloco","q":"Mi trasferisco da Berna a Winterthur: come e entro quando devo annunciare la partenza e l’arrivo?"},{"l":"Passaporto & ID","q":"Abito a Berna e ho bisogno di un nuovo passaporto e di una carta d’identità. Come e dove li ordino?"},{"l":"Termine fisc
