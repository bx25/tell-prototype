id out by the AHV compensation offices.","src":["FSIO: income compensation for maternity","ahv-iv.ch: leaflet 6.02 maternity benefit","FSIO: when am I entitled?","ch.ch: maternity leave"]},"pat":{"intro":"As the father (or the mother’s wife) you are entitled to 2 weeks of paid leave, to be taken within 6 months of the birth. The allowance is 80 % of your earnings, at most CHF 220 a day. It is not paid automatically: you have to apply.","facts":[["Eligibility","The child’s legal father or the mother’s wife. Insured under AHV for the 9 months before the birth and in paid work for at least 5 of those months."],["Duration","2 weeks (10 working days), in one block or as single days. To be taken within 6 months of the birth; days not taken by then are lost."],["Amount","80 % of average earnings before the birth, at most CHF 220 a day. For 2 weeks you get 14 daily allowances, so at most CHF 3,080."],["Application","Form “Application for the other parent’s allowance” (318.747) to the responsible AHV compensation office. For employees, the employer usually submits it."]],"steps":["Plan the leave with your employer and take it within 6 months of the birth.","Fill in form 318.747.","Employed: give the form to your employer, who submits it to their compensation office. Self-employed: submit it directly to your compensation office."],"who":[1,0,0],"note":"The other parent’s allowance is part of the federal income compensation scheme (EO, FSIO). It is paid out by the AHV compensation offices.","src":["FSIO: income compensation for paternity","ahv-iv.ch: leaflet 6.04 other parent’s allowance","FSIO: when am I entitled?","ch.ch: paternity leave"]},"lfa":{"intro":"You can get a learner’s permit for cars (category B) from age 17. In the canton of Bern you hand in the application in person with an eye test, first aid certificate and passport photo. Once you pass the basic theory test, you receive the learner’s permit.","facts":[["Age","Category B from 17. The basic theory test can be taken at the earliest one month before the minimum age."],["Requirements","First aid course (certificate valid 6 years), eye test at a recognised optician or ophthalmologist (valid 2 years), passport photo."],["Costs","Canton of Bern: application CHF 30, issuing the learner’s permit CHF 20, basic theory test CHF 30."],["Learning phase","The category B learner’s permit is valid for 24 months. If you get it before your 20th birthday, you must hold it for at least 12 months before the practical test."]],"steps":["Take the first aid course and the eye test.","Fill in the application form and hand it in in person with photo, original ID and first aid certificate: at a road traffic office (SVSA) site, a police station or the municipal administration.","Book a date for the basic theory test using the reference number in the admission letter.","After passing, you receive the learner’s permit (also available as an e-learner’s permit on your phone)."],"who":[1,1,0],"note":"The rules (minimum age, learning phase) are set by the Confederation (FEDRO). Application, test and permit go through the cantonal road traffic office, in Bern the SVSA.","src":["SVSA Bern: apply for a learner’s permit","SVSA Bern: fees","SVSA Bern: information for learner drivers","FEDRO: questions and answers on driver training"]},"wsb":{"intro":"In the city of Bern you order a certificate of residence online or collect it at the residents’ services counter. It costs CHF 20.","facts":[["Cost","CHF 20, the same for Swiss, EU/EFTA and third-country nationals. Online you pay at the end of the order (Mastercard, Visa, PostFinance)."],["What for","For example for grants, insurance or naturalisation."],["Counter","Einwohnerdienste, Migration und Fremdenpolizei, Predigergasse 5, 3011 Bern. Monday to Friday 10:00 to 16:00, Thursday until 18:00."]],"steps":["Fill in the city of Bern’s online form “Bestellung Wohnsitzbescheinigung”.","Pay online at the end.","Or without ordering online: collect it at the residents’ services counter, Predigergasse 5."],"who":[0,0,1],"note":"Certificates of residence are issued by the municipality you live in, in the city of Bern by the Einwohnerdienste, Migration und Fremdenpolizei.","src":["City of Bern: certificate of residence","City of Bern: online order","City of Bern: residents’ services contact"]},"tod":{"intro":"A death must be reported to the civil registry office within 2 days. If the person dies at home, first call a doctor for the medical death certificate. In the city of Bern you also report the death to the burial office, yourself or through a funeral home.","facts":[["Deadline","Within 2 days, to the civil registry office of the place of death."],["Hospital or care home","If the person dies in a hospital or care home, the institution reports the death to the civil registry office."],["Documents","Passport or ID of the person reporting, medical death certificate, and if available the family booklet or family certificate."],["Free burial","City of Bern: for residents who leave too little to cover it (as a rule under CHF 8,000), the city pays for a simple burial. Relatives apply at the same time as they report the death."]],"steps":["Death at home: call a doctor and ask for the medical death certificate.","Report the death within 2 days to the civil registry office of the place of death (in a hospital or care home, the institution does this).","Report the death to the city of Bern’s burial office, yourself or through a funeral home. The office arranges cremation or burial.","Handle the remaining steps (employer, insurance, banks, estate) with the ch.ch checklist."],"who":[0,1,1],"note":"Registering the death is done by the cantonal civil registry office. Burials and cemeteries are a municipal matter, in the city of Bern the burial office (Predigergasse 5).","src":["Canton of Bern: death (civil registry)","City of Bern: reporting a death","City of Bern: free burial","ch.ch: checklist after a death"]},"pk":{"intro":"In the city of Bern you apply for a resident parking permit online. It is valid in your zone and, according to the city, costs CHF 264 a year (CHF 22 a month).","facts":[["Requirements","You are registered in the zone as a resident or weekly resident and are listed first, with name and address, in the vehicle registration document. Permits are issued for light motor vehicles, as a rule passenger cars."],["Cost","CHF 264 a year, CHF 22 a month."],["Validity","One year from the month of issue, at least 3 months. If you return the permit early, the fee for full unused months is refunded (not for the 3-month minimum)."],["Zone","The permit is only valid in the approved zone."]],"steps":["Check whether your address is in a parking permit zone.","Fill in the city of Bern’s online form “Anwohnerparkkarte”.","Pay the fee electronically. The permit is sent by post."],"who":[0,0,1],"note":"Parking permits are a municipal matter, in the city of Bern handled by the local and trade police (police inspectorate).","src":["City of Bern: neighbourhood parking permits","City of Bern: online form","City of Bern: parking permits online"]},"spg":{"intro":"In the city of Bern there are three ways: put small bulky items out with a sticker on rubbish collection day, take larger items to a recycling centre, or have them picked up by the collection service (CHF 70.27 flat rate).","facts":[["Small bulky items","Combustible items up to 100 × 50 × 50 cm and 25 kg (e.g. brooms, small furniture, rugs): with a sticker, next to the fee bags on collection day. 10 stickers cost CHF 44.10."],["Recycling centres","Fellerstrasse 13a and Schermen (Wölflistrasse 17). Monday to Friday 8:00–12:00 and 13:00–18:30, Saturday 8:00–15:00."],["Collection service","CHF 70.27 flat rate, including 5 minutes of loading; each additional 5 minutes CHF 54.05. You do not need to be there."],["Booking","By 11:30 on the working day before collection; for Monday, by Friday 11:30. Collection on Monday, Tuesday, Thursday and Friday."]],"steps":["Check the size: up to 100 × 50 × 50 cm and 25 kg counts as a small bulky item.","Small bulky item: buy a sticker and put it next to the fee bags on collection day.","Larger item: take it to the Fellerstrasse or Schermen recycling centre, or book the collection service by 11:30 on the working day before."],"who":[0,0,1],"note":"Waste disposal is a municipal matter, in the city of Bern handled by Entsorgung + Recycling Stadt Bern (ERB).","src":["City of Bern: bulky waste","City of Bern: bulky waste collection","City of Bern: small bulky items","City of Bern: recycling centres"]},"fund":{"intro":"If you lost something in the city of Bern, report it online to the lost property office; it contacts you as soon as the item comes in. Found something? Take it to the office at Theatergässchen 2.","facts":[["Reporting a loss","Online for losses within the city. Umbrellas, clothing (except jackets) and books cannot be reported online; contact the office directly (031 321 50 50)."],["Collecting","The office hands over the item if your description and the circumstances of the loss match what the finder reported. Items are kept for one year."],["Finder’s reward","As a rule 10 % of the value, reduced appropriately for high-value items. No reward for items found in a home, stolen goods or items found in shops."],["Office","Theatergässchen 2, 3011 Bern. Monday to Friday 10:00 to 16:00, Thursday until 18:00."]],"steps":["Loss: file an online loss report with the city of Bern’s lost property office.","When the office contacts you, collect the item at Theatergässchen 2.","Found item: take it to the office. If nobody claims it within a year, you can have it for a storage fee of about 5 % of its estimated value."],"who":[0,0,1],"note":"Lost property is a municipal matter, in the city of Bern handled by the lost property office (police inspectorate). The rules on finds and rewards are in the Civil Code.","src":["City of Bern: lost property office","City of Bern: contact","City of Bern: lost property ordinance","ch.ch: lost property"]},"bet":{"intro":"If someone does not pay an invoice, you file a debt collection request with the debt enforcement office where the debtor lives. You advance the costs; if the debt collection is justified, the other party bears them later. In the canton of Bern these are the debt enforcement offices (BAKA).","facts":[["Where","The debt enforcement office at the debtor’s place of residence. You can fill in the request online via the debt enforcement counter."],["Costs","As creditor you advance the costs of each stage. The fees are the same throughout Switzerland and depend on the amount claimed."],["Payment order","The office serves a payment order on the other party. They have 20 days to pay and 10 days to file an objection."],["Objection","If the other party objects, a court decides, at your request, whether the debt collection can continue."]],"steps":["Fill in the debt collection request (online at the debt enforcement counter or with the federal model form).","Submit it to the debt enforcement office where the other party lives and pay the advance on costs.","No payment and no objection: file a request to continue. If there is an objection: ask the court to set it aside."],"who":[1,1,0],"note":"Debt enforcement law (DEBA) and the fees are set by the Confederation. Debt collection is carried out by the debt enforcement offices, in the canton of Bern by the debt enforcement and bankruptcy offices (BAKA).","src":["ch.ch: debt enforcement","Canton of Bern: debt enforcement and bankruptcy offices","Federal Office of Justice: DEBA model forms"]},"abm":{"intro":"In the canton of Bern, deregistering is free: you send the original vehicle registration document marked “annullieren” (cancel) to the road traffic office (SVSA). If you don’t register another vehicle within 14 days, also return the number plates.","facts":[["Cost","Deregistering is free. Having the plates stored for a year costs CHF 30; in return there is no fee for re-registering."],["Plates","Since 1 March 2025 you must say when returning them whether the SVSA should store or dispose of the plates. Without instructions they are disposed of."],["Tax and insurance","While the plates are deposited, you pay no liability insurance and no vehicle tax. Overpaid tax is offset and any credit refunded; what counts is the day the plates reach the SVSA."],["Address","SVSA Verkehrszulassung, Schermenweg 5, Postfach, 3001 Bern."]],"steps":["Write “annullieren” on the original vehicle registration document.","Post it to the SVSA. If you don’t register a new vehicle within 14 days: enclose the plates or drop them in a plate return box at an SVSA site.","State whether the plates should be stored (CHF 30, one year) or disposed of."],"who":[1,1,0],"note":"The rules on vehicle registration are set by the Confederation. Deregistration, plates and vehicle tax go through the cantonal road traffic office, in Bern the SVSA.","src":["SVSA Bern: deregister a vehicle","SVSA Bern: deposit number plates","SVSA Bern: storing number plates","ch.ch: registering and deregistering a vehicle"]},"wa":{"intro":"If you live in the city of Bern during the week and regularly spend your days off in another municipality, register as a weekly resident within 14 days, most easily online.","facts":[["Who","Anyone who stays overnight at their place of work, training or study and regularly spends their days off (usually the weekend) in another municipality."],["Deadline","Within 14 days of arriving, with the city of Bern’s residents’ services."],["Certificate","Registration comes with a certificate of residence elsewhere from your home municipality. Because of a change in the law these will no longer be issued; if your municipality no longer issues one, you can leave it out."],["Tax","For single people it is presumed that their centre of life is at the weekly residence. You can rebut this if you regularly go back on your days off and have particularly close family and social ties there."]],"steps":["Ask your home municipality for a certificate (if it still issues one).","Fill in the city of Bern’s online form “Zuzug Wochenaufenthalt” and pay any fees online.","If your weekly residence continues, extend it with the form “Verlängerung Wochenaufenthalt”."],"who":[0,0,1],"note":"Registration and the register are a municipal matter, in the city of Bern the Einwohnerdienste, Migration und Fremdenpolizei. Tax questions are decided by the tax administration.","src":["City of Bern: weekly residence","City of Bern: online arrival form","City of Bern: extension","City of Bern: arriving, moving and leaving"]},"kir":{"intro":"In the canton of Bern you leave a national church with a personally signed letter to your parish. Church tax liability ends when you leave; for the current year you pay pro rata.","facts":[["Form","In writing, by letter with your handwritten signature. An e-mail is not enough. Content: a clear statement that you are leaving, name, address and date of birth."],["Address","To the parish council of your parish or the office it has designated (e.g. for Catholics in the city of Bern: Röm.-kath. Gesamtkirchgemeinde Bern, Frohbergweg 4, 3012 Bern)."],["Effective","From the day you hand the declaration to the responsible office, Swiss Post or a Swiss representation abroad."],["Church tax","Church tax liability ends with the legally valid declaration. If you leave during the year, church tax is charged pro rata."]],"steps":["Write the letter: that you are leaving, name, address, date of birth, handwritten signature.","Post it to your parish council.","In your next tax return, church tax is no longer charged from the date you left."],"who":[0,1,0],"note":"The rules on leaving and on church tax are set by the canton of Bern. The parish receives the declaration.","src":["Canton of Bern: ordinance on membership of a national church","Canton of Bern TaxInfo: church tax","Catholic Church Bern region: joining and leaving"]},"dieb":{"intro":"In the canton of Bern you report a stolen bike online around the clock via Suisse ePolice. Have the make, model, colour and frame number ready. You can also report the theft at a police station.","facts":[["Online","Via Suisse ePolice, around the clock. Possible for stolen bicycles, mopeds, skis, snowboards, electronic devices and number plates."],["Details","Make, model, colour and frame number. The cantonal police recommend noting these down in advance and keeping them safe."],["Search","Reported stolen bikes are passed on to national and international search systems."],["Police station","Alternatively, report it at a police station. Bring: official photo ID and the relevant documents."]],"steps":["Find the frame number, make, model and colour (e.g. on the purchase receipt).","Report the theft online via Suisse ePolice.","Or report it at a Bern cantonal police station, with official ID."],"who":[0,1,0],"note":"Reports are taken by the cantonal police. Suisse ePolice is the joint online police station of several cantons.","src":["Bern cantonal police: online reports","Bern cantonal police: theft and robbery","Suisse ePolice","ch.ch: reporting a crime"]},"vor":{"intro":"An advance care mandate (Vorsorgeauftrag) is written by hand or notarised. In the canton of Bern you can have the civil registry office record where it is kept; this costs CHF 75. That way the child and adult protection authority (KESB) can find it when needed.","facts":[["Form","Written entirely by hand, dated and signed (like a will) or executed as a public deed by a notary."],["Where it is kept","The civil registry office records where the mandate is kept. The child and adult protection authority (KESB) can look this up when needed."],["Cost","Recording CHF 75. Confirmation of the entry on request CHF 30."],["Where","At any civil registry office of your choice in the canton of Bern."]],"steps":["Write the mandate by hand, date and sign it, or have it notarised.","Decide where to keep it.","Make an appointment at a civil registry office or fill in the written application and send it to an office. The location is recorded."],"who":[1,1,0],"note":"The advance care mandate is governed by the Civil Code. The cantonal civil registry office records where it is kept; the KESB checks and activates it when needed.","src":["Canton of Bern: advance care mandate (civil registry)","Canton of Bern: recording where it is kept","KESB canton of Bern: advance care mandate and living will"]},"aus":{"intro":"One to two months before it expires you receive an expiry notice. Send it back completed, with the documents it asks for, by e-mail or post to the city of Bern’s Einwohnerdienste, Migration und Fremdenpolizei.","facts":[["Expiry notice","Arrives one to two months before the permit expires. If you haven’t received one, contact the office yourself (031 321 53 00)."],["Submitting","Completed, with the documents listed in the notice, by e-mail or post. Processing can take a while; the city contacts you once the permit is renewed."],["Biometrics","If needed, you receive a written invitation to give your biometric data at an ID centre."],["B permit validity","Canton of Bern: as a rule 5 years for EU/EFTA nationals, 1 year for third-country nationals."]],"steps":["Wait for the expiry notice (one to two months before) and fill it in.","Send it with the requested documents by e-mail or post to the city of Bern office.","If invited: give your biometric data at the centre. The new permit follows."],"who":[1,1,1],"note":"The rules are set by the Confederation (SEM). In the city of Bern the Einwohnerdienste, Migration und Fremdenpolizei handle renewals; the canton regulates the permit card.","src":["City of Bern: renewing permits","Canton of Bern: residence permit (B permit)","City of Bern: Einwohnerdienste, Migration und Fremdenpolizei"]},"nam":{"intro":"After a divorce you keep the name you had during the marriage. You can, however, declare at any time at the civil registry office that you want to go back to your maiden or birth name. In the canton of Bern this costs CHF 75.","facts":[["Deadline","None. The declaration is possible at any time once the marriage has ended."],["Where","By appointment at one of the seven civil registry offices in the canton of Bern or at any other civil registry office in Switzerland."],["Cost","Name declaration CHF 75. Confirmation on request CHF 30. Paid on site."],["Not the same","If you want a name other than your birth name, you need an application for a change of name to the canton."]],"steps":["Make an appointment at a civil registry office.","Make the name declaration there and pay the fee."],"who":[1,1,0],"note":"Name law is in the Civil Code. The declaration is taken by the cantonal civil registry office.","src":["Canton of Bern: name declaration","ch.ch: name after divorce","Canton of Bern: change of name"]},"rat":{"intro":"In the canton of Bern you pay taxes in three instalments anyway. If you can’t afford them, apply to the tax administration for a payment arrangement, i.e. more time or part payments. There is no right to one, and default interest keeps running.","facts":[["Instalments","Cantonal and municipal taxes for the current year come in three instalment invoices, due on 20 May, 20 August and 20 November, payable within 30 days. You may split the amounts yourself and pay by e-banking using the QR invoice’s reference number."],["Payment arrangement","An extension or part payments, online via BE-Login or in writing with reasons. There is no right to one."],["Default interest","From the 31st day after the due date, also during a payment arrangement. It is invoiced separately after the last part payment."],["Tax remission","Possible for finally assessed taxes, but the requirements are high. If you don’t meet them, a payment arrangement remains."]],"steps":["Check whether part payments on the instalment invoices are enough (splitting them yourself is allowed).","Otherwise apply for a payment arrangement: online via BE-Login or by a letter with reasons to the tax administration.","Make the agreed part payments on time. Default interest is invoiced separately at the end."],"who":[0,1,0],"note":"In the canton of Bern, cantonal, municipal and church taxes and the direct federal tax are collected by the cantonal tax administration.","src":["Bern tax administration: payment arrangements","Bern tax administration: paying taxes","Bern tax administration: tax remission"]},"kg":{"intro":"In the canton of Bern every child who turns four by 31 July starts kindergarten in August. You don’t need to look for a form: your municipality sends it to you automatically.","facts":[["Cut-off date","Fourth birthday on or before 31 July: start in kindergarten or Basisstufe in August of the same year."],["Duration","Kindergarten usually lasts two years."],["Starting later","Depending on the child’s development, parents may have their child start the first kindergarten year one year later. They note this on the registration form."],["City of Bern","Questions: city of Bern school office, 031 321 64 60, schulamt@bern.ch."]],"steps":["Wait for the registration form from your municipality; it arrives automatically by post.","Fill in the form. If your child should start a year later, note it on the form.","Send the form back. Your child starts in August."],"who":[0,1,1],"note":"Compulsory school rules are set by the canton of Bern (Education and Culture Directorate). Registration and placement are handled by the municipality, in the city of Bern the school office.","src":["Canton of Bern: starting compulsory school","Canton of Bern: parent information on kindergarten","City of Bern: school"]},"ank":{"intro":"If you are not married to the mother, you acknowledge the child in person at the civil registry office, ideally before the birth. In the canton of Bern acknowledgement costs CHF 75.","facts":[["Timing","Possible before or after the birth. Before the birth is recommended."],["Process","The civil registry office tells you which documents are needed. Once it has them, it invites you to an appointment where you make the acknowledgement in person and show your passport or ID."],["Joint custody","You and the mother can declare joint parental custody at the acknowledgement or later at the KESB where the child lives."],["Cost","Acknowledgement CHF 75. Certificate of acknowledgement CHF 30 (plus any postage)."]],"steps":["Ask the civil registry office which documents you need to submit.","Submit them and arrange the appointment the office invites you to.","At the appointment, make the acknowledgement in person (bring passport or ID) and, if you wish, declare joint custody with the mother."],"who":[1,1,0],"note":"Parentage law is in the Civil Code. The acknowledgement is taken by the cantonal civil registry office, a later custody declaration by the KESB.","src":["Canton of Bern: acknowledging a child","ch.ch: acknowledging a child","KESB canton of Bern: paternity and acknowledgement"]},"geb":{"intro":"Every birth must be reported to the civil registry office within three days. If your child is born in a hospital or birth centre, the institution does this. You fill in the birth report form with the first and family names.","facts":[["Deadline","Within three days of the birth, to the civil registry office of the place of birth."],["Who reports","The hospital or birth centre. For a home birth: the doctor, midwife, another person present or the mother."],["Names","The parents enter the child’s first name(s) and family name on the birth report form."],["Birth certificate","Order it from the civil registry office of the place of birth; CHF 30 plus postage."]],"steps":["In hospital or a birth centre: fill in the form with the names; the institution reports the birth.","For a home birth: report it within three days to the civil registry office of the place of birth, with passport or ID, the birth confirmation from the doctor or midwife and, if you have one, the family booklet.","If needed, order the birth certificate from the civil registry office."],"who":[1,1,0],"note":"Civil status law is set by the Confederation (Civil Code, Civil Status Ordinance). The birth is registered by the cantonal civil registry office.","src":["Canton of Bern: birth","Canton of Bern: birth report form","ch.ch: registering a birth"]},"fis":{"intro":"In the canton of Bern you get a fishing permit online, in the “Fischen Bern” app or at one of over 30 agencies. Day and week permits need no course; the annual permit requires a certificate of competence (SaNa).","facts":[["Annual permit","Adults resident in the canton of Bern: CHF 250 plus a CHF 50 conservation fee (members of the Bern cantonal fishing association are exempt). Non-residents: CHF 500 plus the fee. Under 16s: CHF 72."],["Short permits","Week permit CHF 100, day permit CHF 32. Available without a course."],["Certificate of competence","Required for annual and monthly permits. The course is offered by the Netzwerk Anglerausbildung (angler training network)."],["Buying","Online with an e-mail address and credit card, PostFinance Card or Twint, in the “Fischen Bern” app or at an agency."]],"steps":["Choose the permit: day or week without a course; year or month with a certificate of competence.","For an annual permit, first take the SaNa course with the angler training network.","Buy the permit online, in the app or at an agency, and follow the angling regulations."],"who":[1,1,0],"note":"The basic rules (e.g. the certificate of competence) come from federal law. Permits and prices are set by the canton of Bern, through its fisheries inspectorate.","src":["Canton of Bern: fishing permits and prices","Canton of Bern: getting a fishing permit","Canton of Bern: angling FAQ","Canton of Bern: “Fischen Bern” app"]},"gba":{"intro":"In the canton of Bern you order a land register extract using the land registry offices’ online order form. Public data on a property can be viewed free of charge at any time in GRUDIS public.","facts":[["GRUDIS public","Free for everyone: property designation and description, owners’ names (without address), form of ownership, acquisition date, easements, land charges and notes. Since 1 September 2025, ownership information is only available here."],["Public extract","Contains only the public data. CHF 20 per property; each additional extract for the same owners, ordered at the same time, CHF 10."],["Full extract","CHF 20 per property. Owners, easement holders and mortgage creditors are entitled to it. Anyone else needs proof of interest (e.g. a power of attorney), uploaded when ordering."],["Other fees","Copy of supporting documents: CHF 20 up to 10 pages, then CHF 1 per page, max. CHF 100. Owner register extract: CHF 20."]],"steps":["Check whether the public data in GRUDIS public is enough; it’s free.","Otherwise choose the type: public extract or full extract.","Fill in the online order form and, if you aren’t entitled yourself, upload proof of interest."],"who":[1,1,0],"note":"The land register is governed by the Civil Code (federal law). In the canton of Bern it is kept by the cantonal land registry offices, which also set the fees.","src":["Canton of Bern: land registry orders","Canton of Bern: GRUDIS public","Canton of Bern: land register FAQ","Canton of Bern: ownership information"]},"zst":{"intro":"In the canton of Bern you order civil status documents online on the website of the responsible civil registry office or in person at the counter. The canton has seven civil registry offices.","facts":[["Responsible office","For Swiss citizens, the civil registry office of the place of origin; for foreign nationals, the office of the place of residence."],["Certificate of personal status","Current personal data, marital status, name and (for Swiss citizens) places of origin. CHF 30 plus postage. It can be ordered by the person concerned."],["Other documents","Certificate of origin CHF 30. Birth certificate CHF 30. Family certificate CHF 40; after a new civil status event it is updated free of charge. Certificate of registered family status CHF 40 plus CHF 10 per registered person. Postage extra in each case."],["Sending to a third party","With a power of attorney, the office sends the document to another person, on request together with the invoice."]],"steps":["Check which document is required (e.g. certificate of personal status or family certificate).","Find the responsible office: place of origin for Swiss citizens, place of residence for foreign nationals.","Order the document online or at the counter; for delivery to a third party, add a power of attorney."],"who":[1,1,0],"note":"The civil status register (Infostar) and the documents are governed by federal law. The offices in the canton of Bern issue them.","src":["Canton of Bern: ordering documents online","Canton of Bern: certificate of personal status","Canton of Bern: registered family status","Canton of Bern: family certificate","Canton of Bern: certificate of origin","ch.ch: civil status documents"]},"rv":{"intro":"If you have received a payment order and don’t owe the amount, you file an objection (Rechtsvorschlag): orally or in writing when it is served or within 10 days at the debt enforcement office. It costs nothing.","facts":[["Deadline","When the payment order is served or within 10 days, at the debt enforcement office."],["Form and cost","Orally or in writing. The objection itself is free."],["Effect","Enforcement stops. If the creditor wants to continue, they must go to court; the court decides whether enforcement can proceed."],["Hiding the entry","At the earliest 3 months after the payment order was served, you can ask the debt enforcement office not to disclose the proceedings to third parties. If the creditor doesn’t prove within 20 days that they have started proceedings, they are no longer disclosed. Fee: CHF 40. Since 1 January 2026 this is possible throughout the 5 years in which third parties have access."]],"steps":["Check the payment order: do you owe the amount?","If not: file an objection within 10 days at the debt enforcement office, orally or in writing.","After at least 3 months, submit the request for non-disclosure at the office (CHF 40)."],"who":[1,0,0],"note":"The procedure is governed by the federal Debt Enforcement and Bankruptcy Act (SchKG). The responsible office is the one that issued the payment order; in the canton of Bern these are the regional debt enforcement offices.","src":["ch.ch: payment order, objection","Federal Office of Justice: more protection against unjustified debt enforcement","Federal Office of Justice: non-disclosure form","Canton of Bern: debt enforcement and bankruptcy"]},"mof":{"intro":"In the canton of Bern you register a moped or a fast e-bike (pedal assistance up to 45 km/h) with the road traffic office. You need the original vehicle registration document, a number plate and a vignette.","facts":[["Who must","E-bikes with assistance up to 25 km/h and at most 500 watts need no plate. With assistance up to 45 km/h the e-bike counts as a moped and needs a yellow plate."],["Documents","Original vehicle registration document and the fully completed “Mofa / E-Bike” form."],["Costs","Number plate CHF 10. Vignette with collective liability insurance CHF 32 a year (vignette CHF 20, insurance CHF 12). New registration document on change of owner CHF 30."],["Renewing the vignette","Valid until 31 May. The invoice arrives automatically in February; after payment the new vignette is sent by post."]],"steps":["Check whether your vehicle needs a plate (moped or e-bike up to 45 km/h).","Fill in the “Mofa / E-Bike” form and submit it with the original registration document to the road traffic office, by post or at the counter.","Fit the plate and vignette; every February, pay the invoice for the new vignette."],"who":[1,1,0],"note":"Federal law sets which vehicles need a plate. Registration and vignettes are handled by the canton of Bern’s road traffic and navigation office.","src":["Canton of Bern: registering a moped / e-bike","Canton of Bern: renewing the vignette","Canton of Bern: information on e-bikes and mopeds","Canton of Bern: vignette renewal 2026"]},"waf":{"intro":"To buy most firearms you need a weapons acquisition permit. In the canton of Bern you apply online via Suisse ePolice or with a form sent to the cantonal police. The fee is CHF 50.","facts":[["Requirements","At least 18 years old. No criminal record entry for an act showing a violent or dangerous disposition, or for repeated felonies or misdemeanours. Not under general deputyship and not represented by a person with a lasting power of attorney."],["Application","To the weapons office of your canton of residence. In the canton of Bern online via Suisse ePolice or with the form to Kantonspolizei Bern, Fachbereich WSG, Postfach, 3001 Bern. Attachments include a copy of a valid passport or ID card."],["Cost","CHF 50."],["Scope","One permit lets you acquire at most 3 weapons from the same seller."]],"steps":["Check whether the weapon requires a permit and whether you meet the requirements.","Apply online via Suisse ePolice or with the form to the Bern cantonal police, with the required attachments.","Buy the weapon with the acquisition permit."],"who":[1,1,0],"note":"Weapons law is federal law (fedpol). Permits are issued by the cantonal weapons office, in the canton of Bern by the cantonal police.","src":["Bern cantonal police: weapons","fedpol: FAQ on weapons law","ch.ch: buying weapons","fedpol: explanatory report on the Weapons Ordinance"]},"sti":{"intro":"In the canton of Bern you apply for a scholarship online via StipBE-Online with the training grants department. The application must arrive complete with documents by the deadline; grants are not paid retroactively.","facts":[["Who can apply","People in their first training whose parents live in the canton of Bern. Foreign nationals with a Bern C settlement permit, or with 5 years’ residence in Switzerland and a B residence permit."],["Deadline","30 June for training years starting between 1 January and 30 June; 31 December for training years starting between 1 July and 31 December."],["Submitting","Enter the application in StipBE-Online (with BE-Login). Then print the application, the document list and the signed release receipt and post them with the supporting documents. Only then is the application considered submitted."],["Contact","Training grants department: 031 633 83 40, aab@be.ch."]],"steps":["Register with BE-Login and enter the application for the training year in StipBE-Online.","Print the application, document list and release receipt, and sign the receipt.","Post everything with the supporting documents to the training grants department before the deadline."],"who":[0,1,0],"note":"Scholarships and loans are a cantonal matter. In the canton of Bern, the training grants department of the Education and Culture Directorate is responsible.","src":["Canton of Bern: scholarships","Canton of Bern: StipBE-Online FAQ","Canton of Bern: training grants","Canton of Bern: loans"]},"miet":{"intro":"If the mortgage reference rate falls below the rate your rent is based on, you can ask your landlord for a reduction. It is currently 1.25 % (since 2 September 2025, confirmed on 2 September 2026).","facts":[["Which rate applies","It is usually stated in the lease. If the rent has since been adjusted to the reference rate without being challenged, the rate of that adjustment applies."],["How much","Each 0.25 percentage point drop generally entitles you to 2.91 % less rent, e.g. from 1.5 % to 1.25 %. Only the net rent is adjusted; other cost factors may be offset."],["From when","At the earliest from the next possible termination date."],["Deadlines","The landlord must reply within 30 days. If they refuse or don’t reply, you can go to the conciliation authority within a further 30 days, i.e. no later than 60 days after your request."]],"steps":["Check in your lease which reference rate the rent is based on.","Request the reduction from your landlord in writing, ideally by registered mail.","If there is no reply or a refusal, go to the conciliation authority within 60 days of your request."],"who":[1,0,0],"note":"Tenancy law is federal law (Code of Obligations). The Federal Office for Housing (FOH) publishes the reference rate every quarter.","src":["ch.ch: rent and the reference rate","FOH: mortgage reference rate","FOH: reference rate stays at 1.25%","FOH: reference rate falls to 1.25%"]},"qst":{"intro":"If you pay tax at source and live in Switzerland, in the canton of Bern you can apply for a subsequent ordinary assessment (NOV), for example to claim deductions. The application must be submitted by 31 March of the following year.","facts":[["Who pays source tax","Foreign employees resident in Switzerland without a C settlement permit. The employer deducts the tax from wages every month and pays it to the cantonal tax administration."],["Voluntary NOV","With the form “Antrag nachträgliche ordentliche Veranlagung (NOV) für Ansässige”, by 31 March of the following year. A valid application cannot be withdrawn; from then on you are assessed ordinarily every year until source taxation ends. The tax withheld is credited without interest."],["Mandatory NOV","If you (or your spouse) earn at least CHF 120,000 gross income taxed at source in a year, hold at least CHF 150,000 taxable assets at year-end, or have at least CHF 3,000 other income (e.g. from self-employment)."],["Requesting the tax return","With a mandatory NOV, request the tax return from the cantonal tax administration by 31 March of the following year."]],"steps":["Check whether NOV is mandatory for you (income, assets, other income).","If not: decide whether you want a voluntary NOV; it then applies every year.","Send the application form or tax return request to the canton of Bern tax administration by 31 March of the following year."],"who":[1,1,0],"note":"The basic rules of source tax are set by federal law. It is levied and assessed by the canton of Bern tax administration.","src":["Canton of Bern: NOV on request","Canton of Bern: mandatory NOV","Canton of Bern: people subject to source tax","Canton of Bern: NOV application form","ch.ch: source tax"]},"erb":{"intro":"To pay out money or close the accounts of a deceased person, banks usually require a certificate of inheritance. In the canton of Bern it is issued by notaries, or by the municipality if it has opened a will.","facts":[["Handing in the will","Wills and inheritance contracts of the deceased must be handed in immediately to their municipality of residence. The municipality opens the will within one month of receiving it."],["Certificate from the municipality","On request of an appointed heir, if no objection to the opened will has been received within 30 days."],["Certificate from a notary","Fee based on time spent, at least CHF 200."],["Renouncing the inheritance","3-month deadline: from the death if you inherit by law; from the official notification if you are named in a will or inheritance contract. The regional government office (Regierungsstatthalteramt) is responsible."]],"steps":["Hand in the will or inheritance contract immediately to the deceased’s municipality of residence.","Request the certificate of inheritance from the municipality (after the will is opened) or from a notary.","If you don’t want the inheritance: renounce it at the regional government office within 3 months."],"who":[1,1,1],"note":"Inheritance law is federal law (Civil Code). In the canton of Bern, municipalities open wills, notaries issue certificates of inheritance and the ten regional government offices handle renunciations and inventories.","src":["Canton of Bern: will, inheritance contract, certificate","Canton of Bern: checklist for heirs","Canton of Bern: renouncing an inheritance","Canton of Bern: notary fees ordinance","Canton of Bern: find your regional government office"]},"upk":{"intro":"For a move in the city centre, or if you want to stop where parking is prohibited, the city of Bern requires an access and parking permit. It is free and must be requested at least 8 working days in advance.","facts":[["Requirements","At least one of the two addresses is in the city of Bern. For private moves the permit is valid for one day at most, 7 am to 8 pm, not on Sundays or public holidays."],["Applying","Online form or PDF application, at least 8 working days before the move. Free of charge."],["No-parking signs","Either through a removal company that puts up and collects the signs, or order them yourself from the cantonal police signage unit (031 638 67 00, signalisationen-bern@police.be.ch), also at least 8 working days ahead."],["Contact","City of Bern local and trade police: 031 321 52 17."]],"steps":["At least 8 working days ahead, apply online for the access and parking permit.","Order no-parking signs from a removal company or the cantonal police.","On moving day, keep the permit in the vehicle."],"who":[0,1,1],"note":"The permit is issued by the city of Bern’s local and trade police; the signs are provided by the Bern cantonal police.","src":["City of Bern: parking permit and no-parking for moves","City of Bern: online application","City of Bern: moving tips"]},"ahl":{"intro":"Missing AHV contribution years reduce your pension. Gaps from the last five years can be paid back; older ones cannot. A free statement of your individual account (IK) shows whether you have gaps.","facts":[["Effect","A full pension requires 44 contribution years. Each missing year generally cuts the pension by at least 1/44, about 2.3 %."],["Paying back","Only for gaps in the last five years. Older gaps can no longer be closed."],["Youth years","Contribution periods between ages 18 and 20 can fill gaps that arise later."],["Account statement","Any time and without giving a reason, from any compensation office holding an account for you; online via ahv-iv.ch. In writing and free. People without paid work pay at least CHF 530 a year in 2026 to avoid a gap."]],"steps":["Order a statement of your individual account online.","Check whether any contribution years are missing in the last five years.","Pay the missing contributions to the responsible compensation office."],"who":[1,0,0],"note":"AHV is a federal insurance (FSIO). Contributions and accounts are managed by the compensation offices.","src":["AHV/IV: what to do about contribution gaps","FSIO: insurance and contribution gaps","ch.ch: AHV contribution gaps","AHV/IV: order an account statement","AHV/IV: leaflet 2.03 non-employed persons"]},"mdv":{"intro":"If you can’t do a period of military service for work, study or medical reasons, submit a request to postpone it. It must be submitted no later than 14 weeks before the service starts.","facts":[["Reasons","Work, studies or training, and medical reasons. It is only granted for compelling reasons and if the service allows it."],["Deadline and form","No later than 14 weeks before the service starts, with reasons and confirmations (e.g. from your employer or school). Online via the service manager (Dienstmanager) or with the form."],["Important","Until you have the approval, you must still report for duty."],["Recruit school","Recruit school can also be postponed for work, study or medical reasons; this is usually possible."]],"steps":["Get a confirmation from your employer, school or doctor.","Submit the request no later than 14 weeks before the service, online or with the form.","Wait for the decision and report for duty as called up until then."],"who":[1,1,0],"note":"Military service is governed by the federal government (Swiss Armed Forces). Cantonal military authorities handle some matters.","src":["Swiss Armed Forces: postponing service","Swiss Armed Forces: postponement and leave","ch.ch: military service","Swiss Armed Forces: cantonal military authorities"]},"zivi":{"intro":"If you cannot reconcile military service with your conscience, you can do civilian service. You apply online only, via ZiviConnect, to the Federal Office for Civilian Service.","facts":[["Requirements","You have attended recruitment and are fit for military service, you cannot reconcile military service with your conscience, and you are willing to serve 1.5 times as many days as in the army."],["Application","Online only via ZiviConnect, with an AGOV login."],["Introduction day","Attend it within 3 months of applying (it doesn’t count as a service day). Then confirm the application within 2 weeks. Once admission is decided, you can no longer withdraw it."],["Military service in the meantime","If you apply at least 3 months before your next military service, you don’t have to report as long as there is no final decision. If you apply later or during ongoing service, you remain liable for military service until the admission decision."]],"steps":["Create an AGOV login and submit the admission application in ZiviConnect, ideally at least 3 months before your next military service.","Attend the introduction day within 3 months.","Confirm the application within 2 weeks afterwards and wait for the admission decision."],"who":[1,0,0],"note":"Civilian service is a federal matter, run by the Federal Office for Civilian Service (ZIVI).","src":["ZIVI: admission","ZIVI: FAQ","ZIVI: ZiviConnect","ch.ch: civilian service"]},"obu":{"intro":"For a fixed penalty fine in the canton of Bern you have 30 days to consider it. Pay the full amount within that time and the matter is closed. If you disagree, don’t pay; the ordinary procedure then begins.","facts":[["What a fixed penalty is","A fine imposed in a simplified procedure. The road traffic fine list covers offences punished with fines of at most CHF 300."],["Paying","The full amount within 30 days. Fixed penalties cannot be worked off."],["Not paid","You receive an offence notice with a payment slip. If that deadline also passes, the police send the file to the public prosecutor (ordinary procedure)."],["Ordinary procedure","If you are convicted, procedural costs are added to the fine; their amount is set by the courts."]],"steps":["Check the fine: do you agree?","If yes: pay the full amount within 30 days.","If not: don’t pay; the case goes to the prosecutor’s ordinary procedure, where you can give your side, at the risk of costs."],"who":[1,1,0],"note":"The fixed penalty procedure and fine list are set by federal law. In the canton of Bern the cantonal police issue and collect the fines.","src":["Bern cantonal police: fixed penalty fines","ch.ch: traffic rules and fixed penalties","Bern cantonal police: fines app"]},"kau":{"intro":"The rent deposit sits in an account in your name and is blocked for both sides. After you move out, the bank releases it if both parties agree, or at the latest once the landlord has made no legal claim for a year.","facts":[["Amount","For a home, at most three months’ rent. The bank holds it in a savings or deposit account in the tenant’s name."],["Release","With the consent of tenant and landlord, or on the basis of a final payment order or a final court judgment."],["After one year","If the landlord has not made any legal claim within one year of the end of the lease, you can demand repayment directly from the bank."],["Legal basis","Art. 257e of the Code of Obligations."]],"steps":["After handing over the flat, ask the landlord for a written release of the deposit.","Send the release to the bank; it pays out the balance.","Without a release: one year after the lease ends, demand repayment from the bank if the landlord has made no legal claim."],"who":[1,0,0],"note":"Tenancy law is federal law (Code of Obligations); the Federal Office for Housing (FOH) provides information.","src":["FOH: rent deposit leaflet","FOH: tenancy law portal","ch.ch: signing a lease"]},"zeug":{"intro":"You can ask your employer for an employment reference at any time, even while still employed (Art. 330a CO). The right only lapses 10 years after the employment ends.","facts":[["Full reference","Information on the type and duration of the employment and on your performance and conduct (Art. 330a para. 1 CO)."],["Confirmation of employment","Only the type and duration of the employment, without assessment (Art. 330a para. 2 CO). You can ask for it instead of a full reference."],["When","Any time, so also as an interim reference while employed. Limitation period: 10 years from the end of the employment."],["Errors","If the reference contains inaccuracies, mistakes or untruths, you can demand changes."]],"steps":["Ask your employer in writing for a reference (or just a confirmation of employment).","Check it for errors and untrue statements.","If necessary, request a correction in writing."],"who":[1,0,0],"note":"Employment law is federal law (Code of Obligations). The State Secretariat for Economic Affairs (SECO) provides information.","src":["ch.ch: employment reference","SECO: FAQ on employment references"]},"krl":{"intro":"If you are ill and can’t work, your employer must keep paying your wage for a limited time if the employment has lasted more than three months or was agreed for longer (Art. 324a CO): at least 3 weeks in the first year of service, longer after that.","facts":[["Without daily sickness insurance","100 % of wages from the first day of illness. At least 3 weeks in the first year of service, then for an appropriately longer period. Courts set the duration using the Bern, Zurich or Basel scale, unless the contract or collective agreement offers more."],["With daily sickness insurance","Most policies pay 80 % of wages for 720 or 730 days within 900 days. It only counts as equivalent if the employer pays at least half the premium."],["Doctor’s certificate","Your employer may in principle require one from the first day; many contracts only require it from day 3 or 4."],["Independent doctor","For longer absences, the insurer or employer can order an examination by an independent doctor, who reports only on your capacity to work, not the diagnosis."]],"steps":["Tell your employer immediately that you are ill.","Get a doctor’s certificate if your contract or employer requires it.","Check your contract or collective agreement for daily sickness insurance and what it pays."],"who":[1,0,0],"note":"Sick pay is governed by the Code of Obligations (federal law). The State Secretariat for Economic Affairs (SECO) provides information.","src":["SECO: FAQ on inability to work","ch.ch: inability to work"]},"fer":{"intro":"Employees are entitled to at least 4 weeks’ holiday per year of service, and 5 weeks up to age 20 (Art. 329a CO). Contracts or collective agreements can give more.","facts":[["Minimum","4 weeks per year of service; 5 weeks up to age 20."],["In one block","At least 2 weeks per year of service must be consecutive. If no concrete business reasons stand in the way, the employer must also grant 3 weeks in a row."],["Paying out","During employment, holidays may not be replaced by money (Art. 329d para. 2 CO). At the end of employment, payout is possible in certain cases; during the notice period, holidays should be taken if possible."],["Illness and expiry","If you fall ill on holiday and can’t recover, you’re entitled to take the days later. If you are prevented from working through no fault of your own for up to one month per service year, the employer may not cut your holiday. Holiday claims expire after 5 years."]],"steps":["Check your contract or collective agreement for your holiday entitlement.","Agree holidays with your employer in good time; at least 2 consecutive weeks are guaranteed.","If you fall ill on holiday, get a doctor’s certificate right away and inform your employer."],"who":[1,0,0],"note":"Holiday entitlement is set in the Code of Obligations (federal law). The State Secretariat for Economic Affairs (SECO) provides information.","src":["SECO: FAQ on holidays","ch.ch: holidays, public holidays and absences"]},"ueb":{"intro":"Overtime is paid at your wage plus a supplement of at least 25 %, or, if both sides agree, compensated with the same amount of time off. A contract can exclude pay for overtime in writing, but not for hours beyond the legal maximum.","facts":[["Overtime","Work beyond the hours agreed in your contract. Pay: wage plus at least 25 % supplement, unless agreed otherwise in writing (lower, none or excluded)."],["Time off instead of money","Compensation with time off of at least equal length if employee and employer agree. The law then provides no supplement."],["Beyond the legal maximum","Work beyond the statutory maximum: 45 hours a week for industrial and office staff, 50 hours for other employees. Pay for these hours cannot be excluded by contract."],["Check your contract","Your employment contract or collective agreement often says how overtime is compensated."]],"steps":["Record your hours precisely.","Check what your contract or collective agreement says about overtime.","Agree payment or time off in lieu with your employer."],"who":[1,0,0],"note":"Overtime is governed by the Code of Obligations, hours beyond the legal maximum by the Labour Act (both federal law). SECO provides information.","src":["SECO: FAQ on overtime","SECO: working and rest hours"]}}}};
