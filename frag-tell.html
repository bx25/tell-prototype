<style>
:root{
  --paper:#EEE9E0;
  --snow:#FBF9F5;
  --ink:#1A2531;
  --granit:#59636D;
  --red:#D8001A;
  --red-d:#B00015;
  --rule:rgba(26,37,49,.13);
  --inset:clamp(8px,1.1vw,16px);
  --pad:clamp(20px,4vw,64px);
  --r-xl:clamp(26px,3vw,44px);
  --r-lg:24px;
  --sh:0 1px 2px rgba(26,37,49,.05),0 28px 64px -28px rgba(26,37,49,.34);
  --sec:clamp(88px,12vw,200px);
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-io:cubic-bezier(.76,0,.24,1);
  --serif:"Gambetta","Iowan Old Style","Palatino Linotype",Georgia,serif;
  font-family:"Switzer","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
[hidden]{display:none!important}
html{background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%}
body{font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:clip;background:var(--paper)}
button,input{font:inherit;color:inherit}
a{color:inherit}
svg{display:block}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.skip{position:absolute;left:var(--pad);top:-80px;z-index:100;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;transition:top .2s}
.skip:focus{top:12px}

/* glass */
.glass{background:rgba(251,249,245,.66);-webkit-backdrop-filter:blur(20px) saturate(1.25);backdrop-filter:blur(20px) saturate(1.25);border:1px solid rgba(255,255,255,.6);box-shadow:0 10px 32px -14px rgba(26,37,49,.3)}

/* header */
.site-header{position:fixed;z-index:60;top:calc(var(--inset) + 10px);left:calc(var(--inset) + 12px);right:calc(var(--inset) + 12px);display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.site-header>*{pointer-events:auto}
.brand{display:inline-flex;align-items:center;gap:10px;padding:7px 18px 7px 8px;border-radius:999px;text-decoration:none;font-family:var(--serif);font-weight:500;font-size:1.5rem;line-height:1;letter-spacing:-.02em}
.brand svg{width:30px;height:30px}
.notice{padding:9px 16px;border-radius:999px;font-size:.8125rem;line-height:1.2;color:var(--granit);text-align:center;transition:opacity .4s var(--ease),transform .4s var(--ease)}
.site-header.past .notice{opacity:0;pointer-events:none}
.head-r{display:flex;align-items:center;gap:8px;padding:5px;border-radius:999px}
.lang{display:flex;gap:2px}
.lang button{border:0;background:transparent;border-radius:999px;padding:8px 12px;font-size:.8125rem;font-weight:500;color:var(--granit);cursor:pointer;transition:background .3s,color .3s}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn.head-ask{visibility:hidden;padding:.65em 0;font-size:.875rem;opacity:0;transform:scale(.9);pointer-events:none;width:0;padding-inline:0;margin:0 -4px 0 0;overflow:hidden;transition:opacity .4s var(--ease),transform .4s var(--ease),width .45s var(--ease),padding .45s var(--ease)}
.btn.head-ask.show{visibility:visible;opacity:1;transform:none;pointer-events:auto;width:auto;padding-inline:1.1em}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.6em;padding:.95em 1.5em;background:var(--ink);color:var(--paper);border:0;border-radius:999px;font-weight:500;font-size:.9375rem;line-height:1.1;cursor:pointer;overflow:hidden;isolation:isolate;text-decoration:none;white-space:nowrap;transition:transform .3s var(--ease),color .3s}
.btn::before{content:"";position:absolute;inset:0;background:var(--red);border-radius:inherit;transform:scale(0);transform-origin:var(--ox,50%) var(--oy,50%);transition:transform .6s var(--ease);z-index:-1}
.btn:hover::before,.btn:focus-visible::before{transform:scale(1.6)}
.btn:active{transform:scale(.96)}
.btn[disabled]{cursor:default;opacity:.7}
.btn[disabled]::before{transform:scale(0)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(26,37,49,.2)}
.btn.ghost:hover,.btn.ghost:focus-visible{color:#fff;box-shadow:none}


.ask{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;background:#fff;border:1px solid rgba(26,37,49,.1);border-radius:999px;padding:6px;box-shadow:0 2px 0 rgba(26,37,49,.02),0 14px 30px -18px rgba(26,37,49,.3);transition:box-shadow .4s,border-color .3s}
.ask:focus-within{border-color:rgba(26,37,49,.45);box-shadow:0 0 0 5px rgba(216,0,26,.14),0 14px 30px -18px rgba(26,37,49,.3)}
.ask.nudge{animation:nudge .45s var(--ease)}
@keyframes nudge{20%{transform:translateX(-6px)}50%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
.ask-field{position:relative;min-width:0}
.ask input{width:100%;height:58px;border:0;background:transparent;padding:0 clamp(16px,1.8vw,26px);font-size:clamp(1rem,1.35vw,1.2rem);letter-spacing:-.01em;outline:none}
.ph{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ph span{position:absolute;left:clamp(16px,1.8vw,26px);right:8px;top:50%;margin-top:-.7em;font-size:clamp(1rem,1.35vw,1.2rem);letter-spacing:-.01em;color:var(--granit);white-space:nowrap;text-overflow:ellipsis;overflow:hidden;transform:translateY(60%);opacity:0;transition:transform .7s var(--ease),opacity .5s}
.ph span.on{transform:none;opacity:1}
.ph span.off{transform:translateY(-160%);opacity:0}
.ask.has-value .ph{opacity:0}
.send{width:58px;height:58px;border-radius:50%;background:var(--red);color:#fff;border:0;cursor:pointer;display:grid;place-items:center;overflow:hidden;transition:background .3s,transform .3s var(--ease)}
.send svg{width:24px;height:24px;transition:transform .45s var(--ease)}
.send:hover,.send:focus-visible{background:var(--red-d)}
.send:hover svg{transform:translateX(4px)}
.send:active{transform:scale(.92)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:rgba(255,255,255,.7);border:1px solid rgba(26,37,49,.1);border-radius:999px;padding:.62em 1.05em;font-size:.9rem;cursor:pointer;transition:background .3s,color .3s,border-color .3s,transform .3s var(--ease)}
.chip:hover,.chip:focus-visible{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:active{transform:scale(.96)}

/* answer */
.answer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .9s var(--ease)}
.answer.open{grid-template-rows:1fr}
.answer-in{overflow:hidden;min-height:0}
.a-body{padding:34px clamp(6px,.8vw,12px) 6px}
.a-q{font-size:.9375rem;color:var(--granit);margin-bottom:16px}
.think{display:flex;align-items:center;gap:14px;color:var(--granit);font-size:.9375rem}
.think svg{width:28px;height:28px}
.think rect{fill:var(--red);transform-box:fill-box;transform-origin:center}
.think .v{animation:growv 1.1s var(--ease-io) infinite alternate}
.think .h{animation:growh 1.1s var(--ease-io) .25s infinite alternate}
@keyframes growv{from{transform:scaleY(.1)}to{transform:scaleY(1)}}
@keyframes growh{from{transform:scaleX(.1)}to{transform:scaleX(1)}}
.a-text{font-family:var(--serif);font-size:clamp(1.15rem,1.6vw,1.45rem);line-height:1.32;letter-spacing:-.012em;max-width:34em}
.sw{opacity:0;transition:opacity .35s}
.sw.in{opacity:1}
.a-glance{margin-top:24px}
.a-glance .who-lbl{margin-bottom:6px}
.a-facts{margin:0;padding:0}
.a-facts>div{display:grid;grid-template-columns:minmax(5.6rem,7.6rem) 1fr;column-gap:clamp(12px,2vw,20px);padding:11px 0;border-top:1px solid var(--rule);opacity:0;transform:translateY(8px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.a-facts>div:last-child{border-bottom:1px solid var(--rule)}
.a-facts>div.in{opacity:1;transform:none}
.a-facts dt{font-size:.8125rem;font-weight:500;letter-spacing:.01em;color:var(--granit);padding-top:.16em}
.a-facts dd{margin:0;font-size:.9375rem;line-height:1.4;min-width:0;overflow-wrap:anywhere}
@media (max-width:560px){.a-facts>div{grid-template-columns:1fr;row-gap:2px;padding:10px 0}.a-facts dt{padding-top:0}}
.a-steps{list-style:none;padding:0;margin-top:26px;counter-reset:s}
.a-glance+.a-steps{margin-top:22px}
.a-steps li{display:grid;grid-template-columns:44px 1fr;padding:15px 0;border-top:1px solid var(--rule);opacity:0;transform:translateY(8px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.a-steps li:last-child{border-bottom:1px solid var(--rule)}
.a-steps li::before{counter-increment:s;content:counter(s);color:var(--red);font-weight:500;font-feature-settings:"tnum"}
.a-steps li.in{opacity:1;transform:none}
.a-who{margin-top:28px}
.who-lbl{font-size:.9375rem;color:var(--granit);margin-bottom:10px}
.who-row{list-style:none;display:flex;flex-wrap:wrap;gap:8px;padding:0}
.who-row li{display:inline-flex;align-items:center;gap:10px;padding:.65em 1.1em;border-radius:999px;font-weight:500;font-size:.9375rem;box-shadow:inset 0 0 0 1px rgba(26,37,49,.14);color:var(--granit);transition:background .6s var(--ease),color .6s var(--ease),box-shadow .6s}
.who-row li::before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(26,37,49,.2);transition:background .6s}
.who-row li.on{background:var(--ink);color:var(--paper);box-shadow:none}
.who-row li.on::before{background:var(--red)}
.who-note{margin-top:12px;font-size:.9375rem;color:var(--granit)}
.a-src{margin-top:26px}
.a-src ul{list-style:none;padding:0}
.a-src li a{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--rule);text-decoration:none;font-size:.9375rem;transition:padding .35s var(--ease),color .25s}
.a-src li:last-child a{border-bottom:1px solid var(--rule)}
.a-src li a:hover{padding-left:8px;color:var(--red)}
.a-src li a svg{width:16px;height:16px;flex:none;margin-top:3px;color:var(--granit);transition:color .25s}
.a-src li a:hover svg{color:var(--red)}
.a-src li a span{min-width:0;overflow-wrap:anywhere}
.a-stand{margin-top:12px;font-size:.8125rem;line-height:1.45;color:var(--granit)}
.a-src,.a-who,#newQ{opacity:0;transition:opacity .7s var(--ease)}
.a-src.in,.a-who.in,#newQ.in{opacity:1}
#newQ{margin-top:26px}



/* ============ Frag Tell ============ */
body{background:var(--paper)}
main{outline:none}
:root{--hh:84px}
.fq-home{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:calc(var(--inset) + clamp(96px,17svh,170px)) var(--pad) 0;overflow:clip}
.fq-greet{font-family:var(--serif);font-weight:400;font-size:clamp(2.5rem,6.6vw,5.8rem);line-height:1;letter-spacing:-.035em;text-align:center;text-wrap:balance;animation:fqUp .9s var(--ease) both}
.fq-sub{margin-top:clamp(12px,1.4vw,20px);color:var(--granit);font-size:clamp(1.05rem,1.6vw,1.35rem);line-height:1.35;text-align:center;max-width:32em;text-wrap:balance;animation:fqUp .9s .12s var(--ease) both}
.fq-card{margin-top:clamp(26px,4vw,48px);width:min(100%,720px);padding:clamp(16px,2vw,26px);border-radius:var(--r-xl);background:rgba(251,249,245,.82);-webkit-backdrop-filter:blur(26px) saturate(1.2);backdrop-filter:blur(26px) saturate(1.2);border:1px solid rgba(255,255,255,.7);box-shadow:var(--sh);animation:fqUp .9s .24s var(--ease) both;position:relative;z-index:2}
.fq-home.answering .fq-card{background:rgba(251,249,245,.96)}
.fq-card .chips{justify-content:center}
.chip.more{border-style:dashed;background:transparent}
.fq-note{margin-top:16px;max-width:36em;text-align:center;font-size:.8125rem;line-height:1.45;color:var(--granit);position:relative;z-index:2}
.fq-sky{margin-top:auto;padding-top:clamp(28px,5vw,64px);width:100%;display:flex;justify-content:center;pointer-events:none;transition:opacity .6s var(--ease)}
.fq-sky img{display:block;width:auto;max-width:min(980px,100%);height:auto;max-height:min(44svh,500px);object-fit:contain;filter:drop-shadow(0 14px 22px rgba(26,37,49,.2));margin-bottom:-2px}
.fq-home.answering .fq-sky{opacity:.18}
@keyframes fqUp{from{opacity:0;transform:translateY(14px)}}

.fq-view{margin:calc(var(--inset) + var(--hh)) var(--inset) var(--inset)}
.fq-sheet{border-radius:var(--r-xl);background:var(--snow);padding:clamp(40px,6vw,96px) var(--pad) clamp(48px,7vw,110px);min-height:60svh}
.fq-in{max-width:68rem;margin-inline:auto}
.fq-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.8125rem;font-weight:500;color:var(--granit);margin-bottom:18px}
.fq-eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}
.fq-h{font-family:var(--serif);font-weight:400;font-size:clamp(2.3rem,5.2vw,4.6rem);line-height:1.04;letter-spacing:-.03em;text-wrap:balance;outline:none}
.fq-lead{margin-top:20px;max-width:40em;font-size:clamp(1.0625rem,1.5vw,1.25rem);line-height:1.5;color:var(--granit)}
.fq-b{margin-top:clamp(36px,5vw,68px)}
.fq-b>h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.55rem,2.5vw,2.2rem);line-height:1.1;letter-spacing:-.02em}
.fq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;margin-top:22px}
.fq-tile{display:flex;flex-direction:column;gap:10px;padding:clamp(18px,2vw,26px);border-radius:var(--r-lg);background:var(--paper)}
.fq-tile h3{font-family:var(--serif);font-weight:500;font-size:1.35rem;line-height:1.12;letter-spacing:-.015em}
.fq-tile p{color:var(--granit);font-size:.9375rem;line-height:1.45}
.fq-tile .fq-meta{font-size:.8125rem;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.fq-tile .fq-meta::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);flex:none}
.fq-tile .btn{margin-top:auto;align-self:flex-start;font-size:.875rem;padding:.8em 1.25em}
.fq-tile .fq-gap{flex:1}
.fq-list{list-style:none;padding:0;margin-top:18px}
.fq-list li{padding:14px 0 14px 26px;border-top:1px solid var(--rule);position:relative;line-height:1.5;max-width:52em}
.fq-list li:last-child{border-bottom:1px solid var(--rule)}
.fq-list li::before{content:"";position:absolute;left:4px;top:1.15em;width:8px;height:8px;border-radius:50%;background:rgba(26,37,49,.22)}
.fq-note2{margin-top:12px;font-size:.875rem;color:var(--granit)}
.fq-day{display:grid;grid-template-columns:minmax(8.5rem,14rem) 1fr;gap:12px clamp(16px,3vw,40px);padding:clamp(22px,3vw,34px) 0;border-top:1px solid var(--rule)}
.fq-day:last-child{border-bottom:1px solid var(--rule)}
.fq-day time{font-family:var(--serif);font-size:clamp(1.25rem,1.9vw,1.7rem);letter-spacing:-.015em;line-height:1.15}
.fq-day h3{font-size:.8125rem;font-weight:500;color:var(--granit);letter-spacing:.01em;margin:0 0 6px}
.fq-day h3:not(:first-child){margin-top:18px}
.fq-day ul{list-style:none;padding:0}
.fq-day li{padding:3px 0;max-width:46em;line-height:1.5}
.fq-ph{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin-top:22px;counter-reset:ph}
.fq-ph article{padding:clamp(18px,2vw,26px);border-radius:var(--r-lg);background:var(--paper);display:flex;flex-direction:column;gap:8px}
.fq-ph .n{font-family:var(--serif);font-size:2.2rem;line-height:1;color:var(--red);letter-spacing:-.03em}
.fq-ph h3{font-family:var(--serif);font-weight:500;font-size:1.35rem;line-height:1.12;letter-spacing:-.015em}
.fq-ph .e{font-size:.8125rem;font-weight:500;color:var(--granit)}
.fq-ph p{font-size:.9375rem;line-height:1.45;color:var(--ink)}
.fq-links{list-style:none;padding:0;margin-top:18px}
.fq-links li a{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--rule);text-decoration:none;transition:padding .35s var(--ease),color .25s}
.fq-links li:last-child a{border-bottom:1px solid var(--rule)}
.fq-links li a:hover,.fq-links li a:focus-visible{padding-left:8px;color:var(--red)}
.fq-links li a svg{width:18px;height:18px;flex:none;margin-top:3px}
.hnav a[aria-current="page"]{background:rgba(26,37,49,.08);color:var(--ink)}
.tfoot#tfoot{padding-bottom:clamp(28px,4vw,48px)}
.tfoot-links+.tfoot-links{margin-top:2px}
.tfoot-h{margin-top:14px;font-size:.8125rem;color:rgba(238,233,224,.6)}
.tfoot a[aria-current="page"]{text-decoration:underline;text-underline-offset:4px}
.tfoot-credit{margin-top:10px;max-width:64em;font-size:.8125rem;color:rgba(238,233,224,.5);overflow-wrap:anywhere}

/* responsive (aus index.html übernommen) */
@media (max-width:900px){
  .notice{order:3;flex:1 0 100%;max-width:none;padding:7px 12px;font-size:.75rem}
  .site-header{flex-wrap:wrap;row-gap:8px}
  :root{--hh:112px}
  .fq-home{padding-top:calc(var(--inset) + 128px)}
}
@media (max-width:700px){
  .brand{font-size:1.3rem}
  .head-r{padding:4px}
  .lang button{padding:7px 9px}
  .ask input{height:52px}
  .send{width:52px;height:52px}
  .fq-day{grid-template-columns:1fr}

const SRC_URL={"move":["https://www.eumzug.swiss/eumzugngx/global","https://stadt.winterthur.ch/themen/lebensereignisse/umzug-neu-winterthur","https://www.bern.ch/themen/zuzug-umzug-wegzug/","https://stadt.winterthur.ch/themen/arbeit-steuern-wirtschaft/steuern-privatpersonen/steuern-bei-veraenderter-lebenssituation/umzug-zuzug-wegzug"],"passport":["https://www.fedpol.admin.ch/de/preise-gueltigkeit-und-lieferfristen","https://www.pass-id.sid.be.ch/de/start/themen/ausweise.html","https://www.pass-id.sid.be.ch/de/start/themen/ausweiszentren.html","https://www.pass-id.sid.be.ch/de/start/dienstleistungen/termin-ausweiszentrum.html"],"tax":["https://www.sv.fin.be.ch/de/start/themen/frist-verlaengern/fristverlaengerung-privatpersonen.html","https://www.wegleitung.sv.fin.be.ch/de/start/np2025/allgemeine-informationen/fristen.html","https://www.zh.ch/de/steuern-finanzen/steuern/steuern-natuerliche-personen/steuererklaerung-natuerliche-personen.html","https://www.ge.ch/remplir-ma-declaration-impot-tant-que-particulier/demander-delai-ma-declaration-impot"],"ahv":["https://www.akbern.ch/de/Versicherungen/AHV-Leistungen/Altersrente-der-AHV/Altersrente-der-AHV.html","https://www.ahv-iv.ch/p/3.01.d","https://www.ch.ch/de/pensionierung/pensionierung-ab-wann/","https://www.bsv.admin.ch/de/ahv-21"],"alv":["https://www.arbeit.swiss/de/stellensuchende/anmeldung-und-registrierung","https://www.arbeit.swiss/de/stellensuchende/faq-zur-arbeitslosenentschaedigung","https://www.ch.ch/de/versicherungen/arbeitslosenversicherung/","https://www.fedlex.admin.ch/eli/cc/1982/2184_2184_2184/de"],"kk":["https://www.priminfo.admin.ch/de/faq","https://www.priminfo.admin.ch/de/praemien","https://www.priminfo.admin.ch/de/downloads/aktuell","https://www.fedlex.admin.ch/eli/cc/1995/1328_1328_1328/de"]};
const CHAT={"de":{"ask_label":"Was möchten Sie wissen?","send":"Frage senden","nav":["Bürgersicht","Behördensicht","Projekt","Startseite","Menü","Seiten"],"f_links":["Kontakt","Behördensicht","Bürgersicht","Projekt"],"f_sender":"Privates Konzept von Bilal Simsek, Bern. Kein Angebot einer Behörde. Rückmeldungen willkommen: {c}","f_legal":"Datenschutz, Nutzungsbedingungen und Barrierefreiheit sind im Konzept nicht ausgearbeitet. Der Prototyp sammelt keine Personendaten, setzt keine Cookies und verwendet keine Analyse-Tools; lokal im Browser wird nur gemerkt, dass Sie den Hinweis gelesen haben.","f_note":"Konzeptprototyp. Alle Antworten sind Beispiele und ersetzen keine Auskunft einer Behörde.","banner_s":"Konzeptprototyp, keine offizielle Seite","skip":"Zum Inhalt springen","chips":[{"l":"Umzug melden","q":"Ich ziehe von Bern nach Winterthur: Wie und bis wann melde ich mich ab und an?"},{"l":"Pass & ID","q":"Ich wohne in Bern und brauche einen neuen Pass und eine Identitätskarte. Wie und wo bestelle ich die?"},{"l":"Steuererklärung Frist","q":"Ich wohne in Bern und schaffe meine Steuererklärung nicht bis Mitte März. Wie verlängere ich die Frist und was kostet das?"},{"l":"AHV-Rente anmelden","q":"Ich bin Jahrgang 1962 und wohne in Thun: Wann und wo melde ich meine AHV-Rente an?"},{"l":"Arbeitslos melden","q":"Ich wohne in Thun und verliere Ende Monat meine Stelle. Wo und wann muss ich mich melden, und wie bekomme ich Arbeitslosengeld?"},{"l":"Krankenkasse wechseln","q":"Bis wann kann ich meine Krankenkasse wechseln und wie geht das?"}],"think":"Tell prüft offizielle Quellen","who":"Zuständig","bund":"Bund","kanton":"Kanton","gemeinde":"Gemeinde","src":"Quellen","glance":"Auf einen Blick","stand":"Stand: Oktober 2026 · Beispielhafte Antwort aus öffentlichen Quellen, ohne Gewähr. Massgebend sind die Stellen.","newtab":"öffnet in neuem Tab","newq":"Neue Frage","fb":{"intro":"Dazu hat der Prototyp noch keine Antwort. Die echte Version würde hier offizielle Quellen von Bund, Kantonen und Gemeinden durchsuchen. Sechs Beispiele beantwortet er schon: Umzug, Pass und ID, Steuererklärung, AHV-Rente, Arbeitslosigkeit und Krankenkasse wechseln. Probieren Sie eines davon."},"ans":{"move":{"intro":"Sie melden sich innert 14 Tagen am neuen Wohnort an. Von Bern nach Winterthur geht das online über eUmzugCH: Beide Gemeinden sind angeschlossen, Ab- und Anmeldung dauern zusammen etwa 10 Minuten.","facts":[["Frist","14 Tage ab Adressänderung (Art. 11 RHG)"],["Kosten","Winterthur: CHF 40 pro erwachsene Person; eUmzugCH kostet nicht mehr als der Schalter"],["Dauer","Online ca. 10 Minuten"],["Zuständig","Einwohnerdienste Bern (Abmeldung), Einwohnerkontrolle Winterthur (Anmeldung)"]],"steps":["Auf eumzug.swiss alte Adresse (Bern) und neue Adresse (Winterthur) eingeben und «Prüfen» klicken.","Bereithalten: Pass oder ID, AHV-Nummer (13-stellig), Mietvertrag oder Einzugsbestätigung, Karte oder Twint für CHF 40.","Krankenkassenkarte oder Police bereithalten: Winterthur verlangt diesen Nachweis bei der Anmeldung.","Abmeldung in Bern und Anmeldung in Winterthur online abschliessen; ein Schalterbesuch in Bern ist nicht nötig.","Steueramt: Winterthur erhält die neue Adresse automatisch; steuerpflichtig sind Sie dort ab 1. Januar des Zuzugsjahres."],"who":[1,1,1],"note":"Die Gemeinden (Bern, Winterthur) nehmen Ab- und Anmeldung entgegen, eUmzugCH ist der gemeinsame Dienst von Bund, Kantonen und Gemeinden, die Steuern erhebt der Kanton Zürich mit der Stadt Winterthur.","src":["eUmzugCH – Umzug online melden (Bund, Kantone, Gemeinden)","Stadt Winterthur – Umzug & Neu in Winterthur","Stadt Bern – Zuzug, Umzug und Wegzug","Stadt Winterthur – Steuern bei Umzug, Zuzug und Wegzug"]},"passport":{"intro":"Als Erwachsene mit Wohnsitz in Bern beantragen Sie Pass und/oder ID online auf schweizerpass.ch und gehen dann zum gebuchten Termin, z. B. ins Ausweiszentrum Bern (Laupenstrasse 18A). Die Kombi Pass + ID kostet CHF 158 und ist 10 Jahre gültig.","facts":[["Kosten","Erwachsene: ID CHF 70, Pass CHF 145, Kombi CHF 158. Kinder bis 18: ID 35, Pass 65, Kombi 78 (inkl. Porto)."],["Gültigkeit","Erwachsene 10 Jahre, Kinder und Jugendliche bis 18 Jahre: 5 Jahre. Verlängern ist nicht möglich, Sie bestellen neu."],["Dauer","Lieferung max. 10 Arbeitstage nach dem Termin, per Einschreiben. Mitnehmen am Schalter geht nicht."],["Termin","Pflicht und persönliches Erscheinen nötig (Foto, bei Pass Fingerabdrücke)."]],"steps":["Online-Antrag auf schweizerpass.ch ausfüllen (persönliche E-Mail nötig). Nach der Prüfung erhalten Sie eine E-Mail zur Terminwahl.","Termin in einem der 7 Berner Ausweiszentren buchen (Pflicht): online oder per Tel. 031 635 40 00, Mo-Fr.","Alten Ausweis mitbringen, aber kein Passfoto: Das Foto wird vor Ort aufgenommen.","Gebühr vor Ort zahlen (Karte, Twint oder bar). Kinder kommen mit sorgeberechtigter Person und deren Ausweis.","Ausweis kommt innert 10 Arbeitstagen per Einschreiben an die angegebene Adresse."],"who":[1,1,0],"note":"Der Bund (fedpol) publiziert Preise, Gültigkeit und Lieferfristen; im Kanton Bern erfasst der Pass- und Identitätskartendienst (Amt für Bevölkerungsdienste) Ihre Daten in den Ausweiszentren.","src":["fedpol: Preise, Gültigkeit und Lieferfristen","Kanton Bern: Ausweise, Preise und Gültigkeit","Kanton Bern: Ausweiszentren und Termin","Kanton Bern: Termin wahrnehmen, Unterlagen"]},"tax":{"intro":"Im Kanton Bern ist die Steuererklärung grundsätzlich bis 15. März fällig; online verlängern Sie bis 15. Juli gratis, höchstens bis 15. November. Für die Steuerperiode 2025 gilt wegen eines IT-Unterbruchs ausnahmsweise der 30. November 2026 als letzte Frist.","facts":[["Frist","Bern: 15. März (Selbstständige: 15. Mai). Zürich und Genf: 31. März."],["Kosten","Bern online: bis 15. Juli gratis, bis 15. Sept. CHF 20, bis 15. Nov. CHF 40. Schriftlich/Telefon: CHF 20/40/60. Genf: CHF 20/40/60."],["Dauer","Bern: höchstens bis 15. Nov.; 2025er-Erklärung ausnahmsweise bis 30. Nov. 2026 (IT-Unterbruch)."],["Zuständig","Bern: kantonale Steuerverwaltung. Zürich: Gemeindesteueramt. Genf: Administration fiscale cantonale."]],"steps":["Brief zur Steuererklärung, Lohnausweis (vom Arbeitgeber) und Belege bereitlegen.","Vor Fristablauf in BE-Login (mit AGOV) «Fristverlängerung erfassen», neue Frist wählen und bestätigen.","Bestätigung selbst speichern: Es kommt keine per Post oder E-Mail.","Steuererklärung in TaxMe-Online ausfüllen und mit Belegen einreichen (oder ausgedruckt bei der Wohnsitzgemeinde abgeben).","Zu spät? Es droht eine Mahngebühr von CHF 60; nach abgelaufener Mahnfrist ist keine Verlängerung mehr möglich."],"who":[1,1,1],"note":"Die kantonale Steuerverwaltung nimmt Ihre Erklärung entgegen und veranlagt auch die direkte Bundessteuer im Auftrag des Bundes (ESTV beaufsichtigt), die Gemeinde legt ihren Steuerfuss fest.","src":["Kanton Bern: Frist als Privatperson verlängern","Kanton Bern: Wegleitung, Einreichefrist","Kanton Zürich: Steuererklärung Privatpersonen","Canton de Genève: Demander un délai"]},"ahv":{"intro":"Ein Mann, Jahrgang 1962, in Thun erreicht 2027 mit 65 das Referenzalter und meldet seine Rente 3–4 Monate vorher bei der Ausgleichskasse an. Bei Geburtstag am 15. März 2027 beginnt die Rente am 1. April 2027; die Anmeldung erfolgt ab ca. Dezember 2026.","facts":[["Referenzalter","Männer 65. Frauen: Jg. 1961 = 64 J. 3 Mt., Jg. 1962 = 64 J. 6 Mt., Jg. 1963 = 64 J. 9 Mt., ab Jg. 1964 = 65. Rente ab Folgemonat."],["Frist","Anmeldung 3–4 Monate vor Rentenbeginn. Vorbezug ab 63 (–6.8 % bei 1 Jahr), Aufschub 1–5 Jahre (+5.2 % bis +31.5 %)."],["Rente","Bei voller Beitragsdauer CHF 1’260 bis 2’520 pro Monat; Ehepaar höchstens CHF 3’780. Dazu 13. Rente ab Dezember 2026."],["Zuständig","Ausgleichskasse, bei der Ihr Arbeitgeber angeschlossen ist (im Kanton Bern z. B. die AK Bern)."]],"steps":["Zuständige Ausgleichskasse klären: Angestellte fragen den Arbeitgeber, Selbstständige die zuletzt abrechnende Kasse.","Formular 318.370 «Anmeldung für eine Altersrente» 3–4 Monate vor Rentenbeginn online ausfüllen und einreichen.","Vorbezug: spätestens bis Ende des Vormonats beantragen. Aufschub: spätestens 1 Jahr nach Referenzalter im Formular ankreuzen.","Beilagen mit dem Formular hochladen oder per Post senden; die Ausgleichskasse beschafft nötige Unterlagen und berechnet die Rente.","Auszahlung monatlich (AK Bern: 4. Arbeitstag, z. B. 4. Dezember 2026); die 13. Rente im Dezember kommt ohne Antrag."],"who":[1,1,0],"note":"Der Bund (BSV) gibt Regeln und Merkblätter vor; die Ausgleichskasse (im Kanton Bern die AK Bern) nimmt Ihre Anmeldung entgegen, berechnet und zahlt die Rente aus.","src":["Ausgleichskasse Kanton Bern: Altersrente der AHV","ahv-iv.ch: Merkblatt 3.01 Altersrenten (Stand 1.1.2026)","ch.ch: Pensionierung – ab wann?","BSV: Stabilisierung der AHV (AHV 21)"]},"alv":{"intro":"Melden Sie sich spätestens am ersten Tag, für den Sie Arbeitslosenentschädigung wollen, beim RAV Ihrer Region an, am schnellsten online im Job-Room. Beispiel Thun: 30-jährig, 6’500 Franken Monatslohn, keine Kinder, 14 Monate Beitragszeit ergibt 70 %, höchstens 260 Taggelder und 10 Wartetage.","facts":[["Frist","Anmeldung beim RAV spätestens am 1. Tag der Arbeitslosigkeit, besser schon während der Kündigungsfrist."],["Höhe","70 % des versicherten Verdienstes. 80 % bei Kindern unter 25, Verdienst bis 3’797 Franken oder IV-Rente ab 40 %."],["Dauer","Mind. 12 Monate Beitragszeit in 2 Jahren. 260 Taggelder, bei längerer Beitragszeit mehr. Rahmenfrist: 2 Jahre."],["Zuständig","RAV (Anmeldung, Beratung) und die von Ihnen gewählte Arbeitslosenkasse (Auszahlung)."]],"steps":["Online anmelden: eService «Anmeldung zur Arbeitsvermittlung (RAV)» im Job-Room, oder persönlich beim RAV Ihrer Region.","Schon in der Kündigungsfrist Stellen suchen und jede Bewerbung belegen. Wie viele, legt Ihr RAV fest.","Arbeitslosenkasse wählen, «Antrag auf Arbeitslosenentschädigung» und Arbeitgeberbescheinigungen (2 Jahre) einreichen.","Erstgespräch beim RAV (Einladung innert 15 Tagen): AHV- oder Krankenkassenkarte, ID und Nachweis der Bemühungen mitbringen.","Jeden Monat «Angaben der versicherten Person» einreichen. Die Taggelder folgen in der Regel im Folgemonat."],"who":[1,1,0],"note":"Das SECO beaufsichtigt die Arbeitslosenversicherung, RAV, Arbeitslosenkassen und kantonale Amtsstellen vollziehen sie; angemeldet wird direkt beim RAV.","src":["arbeit.swiss: Anmeldung und Registrierung","arbeit.swiss (SECO): FAQ zur Arbeitslosenentschädigung","ch.ch: Arbeitslosigkeit in der Schweiz","Fedlex: AVIG (SR 837.0), Art. 9, 17, 18, 22, 27"]},"kk":{"intro":"Sie können die Grundversicherung auf Ende Jahr wechseln, wenn Ihre Kündigung bis Montag, 30. November 2026 bei der Krankenkasse eingeht. Die neue Kasse muss Sie ohne Gesundheitsfragen aufnehmen. Die Prämien 2027 stehen schon im Prämienrechner von priminfo.admin.ch.","facts":[["Frist","Kündigung bis spätestens am letzten Arbeitstag im November (2026: Montag, 30. November) bei der Kasse. Es zählt der Eingang, nicht der Poststempel. Empfohlen: eingeschrieben bis Mitte November."],["Franchise","Erwachsene: CHF 300 oder wählbar 500, 1’000, 1’500, 2’000, 2’500, dazu 10 % Selbstbehalt, höchstens CHF 700 im Jahr. Kinder: keine Franchise, Selbstbehalt höchstens CHF 350."],["Franchise ändern","Tiefere Franchise: schriftlich bis zum letzten Arbeitstag im November. Höhere Franchise: nur auf Jahresbeginn, spätestens Mitte Dezember mitteilen (Empfehlung)."],["Mitte Jahr","Wechsel per 1. Juli nur mit ordentlicher Franchise (CHF 300) und freier Arztwahl, Kündigung bis 31. März. Mit eingeschränkter Arztwahl (z. B. Hausarzt- oder Telmed-Modell) geht es nur auf Jahresende."],["Achtung","Wer gemahnte Prämien oder Kostenbeteiligungen offen hat, kann die Grundversicherung nicht wechseln."],["Zuständig","Ihre bisherige und die neue Krankenkasse. Der Bund (BAG) genehmigt die Prämien."]],"steps":["Prämien 2027 auf priminfo.admin.ch vergleichen: Wohnort, Alter, Franchise und Modell (z. B. Hausarzt oder Telmed) eingeben.","Neue Kasse wählen und dort die Grundversicherung beantragen. Jede Kasse muss Sie aufnehmen, ohne Gesundheitsfragen, Vorbehalte oder Wartefrist.","Bisherige Grundversicherung schriftlich kündigen, am besten eingeschrieben bis Mitte November.","Die Zusatzversicherung nicht vorschnell kündigen: Dort darf die Kasse Gesundheitsfragen stellen und ablehnen. Die Fristen stehen in den Versicherungsbedingungen und können bis zu sechs Monate betragen. Die Kasse darf sie nicht kündigen, weil Sie die Grundversicherung wechseln.","Bestätigung der neuen Kasse abwarten: Die alte Versicherung endet erst, wenn die neue Kasse die lückenlose Deckung gemeldet hat. Kommt die Meldung zu spät, muss die neue Kasse die Prämiendifferenz übernehmen."],"who":[1,0,0],"note":"Das Gesetz (KVG) und die Genehmigung der Prämien liegen beim Bund (BAG). Kündigung und Beitritt laufen direkt über die Krankenkassen, keine Behörde nimmt sie entgegen.","src":["Priminfo (BAG): FAQ, Wechsel der Krankenkasse","Priminfo (BAG): Prämienrechner 2027","Priminfo (BAG): Prämien 2027 nach Kanton","Fedlex: KVG (SR 832.10), Art. 7 und 64"]}}},"fr":{"ask_label":"Que souhaitez-vous savoir ?","send":"Envoyer la question","nav":["Vue citoyenne","Vue des autorités","Projet","Accueil","Menu","Pages"],"f_links":["Contact","Vue des autorités","Vue citoyenne","Projet"],"f_sender":"Concept privé de Bilal Simsek, Berne. Pas une offre d'une autorité. Vos retours sont les bienvenus : {c}","f_legal":"Protection des données, conditions d'utilisation et accessibilité ne sont pas développées dans le concept. Le prototype ne collecte aucune donnée personnelle, ne dépose aucun cookie et n'utilise aucun outil d'analyse ; seul le fait que vous avez lu l'avertissement est mémorisé localement dans le navigateur.","f_note":"Prototype conceptuel. Toutes les réponses sont des exemples et ne remplacent pas un renseignement officiel.","banner_s":"Prototype conceptuel, pas un site officiel","skip":"Aller au contenu","chips":[{"l":"Déménagement","q":"Je déménage de Berne à Winterthour : comment et jusqu’à quand dois-je annoncer mon départ et mon arrivée ?"},{"l":"Passeport & ID","q":"J’habite à Berne et j’ai besoin d’un nouveau passeport et d’une carte d’identité. Comment et où les commander ?"},{"l":"Délai fiscal","q":"J’habite à Berne et je n’arrive pas à remplir ma déclaration d’impôt d’ici la mi-mars. Comment prolonger le délai et combien cela coûte-t-il ?"},{"l":"Rente AVS","q":"Je suis né(e) en 1962 et j’habite à Thoune : quand et où dois-je demander ma rente AVS ?"},{"l":"Chômage","q":"J’habite à Thoune et je perds mon emploi à la fin du mois. Où et quand dois-je m’annoncer, et comment obtenir des indemnités de chômage ?"},{"l":"Changer de caisse","q":"Jusqu’à quand puis-je changer de caisse-maladie et comment faire ?"}],"think":"Tell consulte les sources officielles","who":"Compétence","bund":"Confédération","kanton":"Canton","gemeinde":"Commune","src":"Sources","glance":"En un coup d’œil","stand":"État : octobre 2026 · Réponse donnée à titre d’exemple, issue de sources publiques, sans garantie. Seuls les services compétents font foi.","newtab":"s’ouvre dans un nouvel onglet","newq":"Nouvelle question","fb":{"intro":"Le prototype n’a pas encore de réponse à cette question. La version finale consulterait ici les sources officielles de la Confédération, des cantons et des communes. Il répond déjà à six exemples : déménagement, passeport et carte d’identité, déclaration d’impôt, rente AVS, chômage et changement de caisse-maladie. Essayez l’un d’eux."},"ans":{"move":{"intro":"Vous vous annoncez dans les 14 jours auprès de votre nouvelle commune. De Berne à Winterthour, cela se fait en ligne via eUmzugCH : les deux communes sont raccordées, l’annonce de départ et l’annonce d’arrivée prennent ensemble environ 10 minutes.","facts":[["Délai","14 jours dès le changement d’adresse (art. 11 LHR)"],["Coûts","Winterthour : CHF 40 par adulte ; eUmzugCH ne coûte pas plus cher que le guichet"],["Durée","En ligne env. 10 minutes"],["Compétence","Services aux habitants de Berne (départ), contrôle des habitants de Winterthour (arrivée)"]],"steps":["Sur eumzug.swiss, saisir l’ancienne adresse (Berne) et la nouvelle adresse (Winterthour), puis lancer la vérification.","À préparer : passeport ou carte d’identité, numéro AVS (13 chiffres), contrat de bail ou attestation d’emménagement, carte ou Twint pour CHF 40.","Préparer la carte d’assuré ou la police d’assurance-maladie : Winterthour exige ce justificatif lors de l’annonce d’arrivée.","Terminer en ligne l’annonce de départ à Berne et l’annonce d’arrivée à Winterthour ; un passage au guichet à Berne n’est pas nécessaire.","Service des impôts : Winterthour reçoit automatiquement la nouvelle adresse ; vous y êtes assujetti à l’impôt dès le 1er janvier de l’année d’arrivée."],"who":[1,1,1],"note":"Les communes (Berne, Winterthour) reçoivent les annonces de départ et d’arrivée, eUmzugCH est le service commun de la Confédération, des cantons et des communes ; les impôts sont prélevés par le canton de Zurich avec la ville de Winterthour.","src":["eUmzugCH – annoncer son déménagement en ligne (Confédération, cantons, communes)","Ville de Winterthour – déménagement et arrivée à Winterthour","Ville de Berne – arrivée, déménagement et départ","Ville de Winterthour – impôts en cas de déménagement, d’arrivée et de départ"]},"passport":{"intro":"Si vous êtes adulte et habitez à Berne, vous demandez votre passeport et/ou votre carte d’identité en ligne sur schweizerpass.ch, puis vous vous rendez au rendez-vous réservé, p. ex. au centre de documents d’identité de Berne (Laupenstrasse 18A). La combinaison passeport + carte d’identité coûte CHF 158 et est valable 10 ans.","facts":[["Coûts","Adultes : carte d’identité CHF 70, passeport CHF 145, combinaison CHF 158. Enfants jusqu’à 18 ans : carte d’identité 35, passeport 65, combinaison 78 (port inclus)."],["Validité","Adultes 10 ans, enfants et jeunes jusqu’à 18 ans : 5 ans. Une prolongation n’est pas possible, vous commandez un nouveau document."],["Durée","Livraison au plus tard 10 jours ouvrables après le rendez-vous, par envoi recommandé. Emporter le document au guichet n’est pas possible."],["Rendez-vous","Obligatoire, présence personnelle nécessaire (photo, pour le passeport empreintes digitales)."]],"steps":["Remplir la demande en ligne sur schweizerpass.ch (adresse e-mail personnelle requise). Après vérification, vous recevez un e-mail pour choisir un rendez-vous.","Réserver un rendez-vous dans l’un des 7 centres de documents d’identité bernois (obligatoire) : en ligne ou par téléphone au 031 635 40 00, lu–ve.","Apporter l’ancien document, mais pas de photo : elle est prise sur place.","Payer les frais sur place (carte, Twint ou espèces). Les enfants viennent avec une personne détentrice de l’autorité parentale et son document d’identité.","Le document arrive dans les 10 jours ouvrables, par envoi recommandé, à l’adresse indiquée."],"who":[1,1,0],"note":"La Confédération (fedpol) publie les prix, la durée de validité et les délais de livraison ; dans le canton de Berne, le service des passeports et cartes d’identité (Office de la population) saisit vos données dans les centres de documents d’identité.","src":["fedpol : prix, durée de validité et délais de livraison","Canton de Berne : documents d’identité, prix et durée de validité","Canton de Berne : centres de documents d’identité et rendez-vous","Canton de Berne : se rendre au rendez-vous, documents à apporter"]},"tax":{"intro":"Dans le canton de Berne, la déclaration d’impôt est en principe due au 15 mars ; en ligne, vous prolongez gratuitement jusqu’au 15 juillet, au plus tard jusqu’au 15 novembre. Pour la période fiscale 2025, en raison d’une panne informatique, le 30 novembre 2026 est exceptionnellement le dernier délai.","facts":[["Délai","Berne : 15 mars (indépendants : 15 mai). Zurich et Genève : 31 mars."],["Coûts","Berne en ligne : gratuit jusqu’au 15 juillet, CHF 20 jusqu’au 15 sept., CHF 40 jusqu’au 15 nov. Par écrit/téléphone : CHF 20/40/60. Genève : CHF 20/40/60."],["Durée","Berne : au plus tard jusqu’au 15 nov. ; déclaration 2025 exceptionnellement jusqu’au 30 nov. 2026 (panne informatique)."],["Compétence","Berne : administration fiscale cantonale. Zurich : office communal des impôts. Genève : Administration fiscale cantonale."]],"steps":["Préparer la lettre relative à la déclaration d’impôt, le certificat de salaire (de l’employeur) et les justificatifs.","Avant l’échéance, dans BE-Login (avec AGOV) : « Fristverlängerung erfassen » (saisir la prolongation de délai), choisir le nouveau délai et confirmer.","Enregistrer soi-même la confirmation : aucune n’est envoyée par la poste ni par e-mail.","Remplir la déclaration dans TaxMe-Online et la déposer avec les justificatifs (ou la remettre imprimée à votre commune de domicile).","En retard ? Des frais de rappel de CHF 60 sont à craindre ; une fois le délai de rappel écoulé, aucune prolongation n’est plus possible."],"who":[1,1,1],"note":"L’administration fiscale cantonale reçoit votre déclaration et taxe aussi l’impôt fédéral direct pour le compte de la Confédération (sous la surveillance de l’AFC) ; la commune fixe sa quotité d’impôt.","src":["Canton de Berne : prolonger le délai en tant que particulier","Canton de Berne : instructions, délai de dépôt","Canton de Zurich : déclaration d’impôt des particuliers","Canton de Genève : demander un délai"]},"ahv":{"intro":"Un homme né en 1962 et habitant à Thoune atteint l’âge de référence de 65 ans en 2027 et demande sa rente à la caisse de compensation 3 à 4 mois avant. Avec un anniversaire le 15 mars 2027, la rente commence le 1er avril 2027 ; la demande se fait dès décembre 2026 environ.","facts":[["Âge de référence","Hommes 65 ans. Femmes : née en 1961 = 64 ans 3 mois, 1962 = 64 ans 6 mois, 1963 = 64 ans 9 mois, dès 1964 = 65 ans. Rente dès le mois suivant."],["Délai","Demande 3 à 4 mois avant le début de la rente. Anticipation dès 63 ans (–6.8 % pour 1 an), ajournement 1 à 5 ans (+5.2 % à +31.5 %)."],["Rente","Avec une durée de cotisation complète CHF 1 260 à 2 520 par mois ; couple au maximum CHF 3 780. S’y ajoute la 13e rente dès décembre 2026."],["Compétence","Caisse de compensation à laquelle votre employeur est affilié (dans le canton de Berne p. ex. la caisse de compensation du canton de Berne, AK Bern)."]],"steps":["Clarifier la caisse de compensation compétente : les salariés demandent à leur employeur, les indépendants à la dernière caisse avec laquelle ils décomptent.","Remplir et envoyer en ligne le formulaire 318.370 « Demande de rente de vieillesse » 3 à 4 mois avant le début de la rente.","Anticipation : à demander au plus tard à la fin du mois précédent. Ajournement : à cocher dans le formulaire au plus tard 1 an après l’âge de référence.","Télécharger les annexes avec le formulaire ou les envoyer par la poste ; la caisse de compensation se procure les documents nécessaires et calcule la rente.","Versement mensuel (AK Bern : 4e jour ouvrable, p. ex. le 4 décembre 2026) ; la 13e rente de décembre est versée sans demande."],"who":[1,1,0],"note":"La Confédération (OFAS) fixe les règles et publie les mémentos ; la caisse de compensation (dans le canton de Berne, l’AK Bern) reçoit votre demande, calcule et verse la rente.","src":["Caisse de compensation du canton de Berne : rente de vieillesse de l’AVS","ahv-iv.ch : mémento 3.01 Rentes de vieillesse (état au 1.1.2026)","ch.ch : retraite – à partir de quand ?","OFAS : stabilisation de l’AVS (AVS 21)"]},"alv":{"intro":"Inscrivez-vous auprès de l’ORP de votre région au plus tard le premier jour pour lequel vous voulez toucher l’indemnité de chômage, le plus rapidement en ligne dans Job-Room. Exemple à Thoune : 30 ans, salaire mensuel de 6 500 francs, sans enfant, 14 mois de cotisation donnent 70 %, au maximum 260 indemnités journalières et 10 jours d’attente.","facts":[["Délai","Inscription à l’ORP au plus tard le 1er jour de chômage, mieux encore pendant le délai de congé."],["Montant","70 % du gain assuré. 80 % en cas d’enfants de moins de 25 ans, de gain jusqu’à 3 797 francs ou de rente AI dès 40 %."],["Durée","Au moins 12 mois de cotisation en 2 ans. 260 indemnités journalières, davantage en cas de période de cotisation plus longue. Délai-cadre : 2 ans."],["Compétence","ORP (inscription, conseil) et la caisse de chômage que vous choisissez (versement)."]],"steps":["S’inscrire en ligne via l’e-service d’inscription au placement (ORP) dans Job-Room, ou en personne auprès de l’ORP de votre région.","Chercher un emploi déjà pendant le délai de congé et justifier chaque candidature. Votre ORP fixe le nombre exigé.","Choisir une caisse de chômage, déposer la « demande d’indemnité de chômage » et les attestations de l’employeur (2 ans).","Premier entretien à l’ORP (convocation dans les 15 jours) : apporter la carte AVS ou d’assuré, une pièce d’identité et la preuve de vos recherches d’emploi.","Chaque mois, remettre les « indications de la personne assurée ». Les indemnités journalières suivent en règle générale le mois suivant."],"who":[1,1,0],"note":"Le SECO surveille l’assurance-chômage ; les ORP, les caisses de chômage et les services cantonaux l’appliquent ; l’inscription se fait directement auprès de l’ORP.","src":["arbeit.swiss : inscription et enregistrement","arbeit.swiss (SECO) : FAQ sur l’indemnité de chômage","ch.ch : chômage en Suisse","Fedlex : LACI (RS 837.0), art. 9, 17, 18, 22, 27"]},"kk":{"intro":"Vous pouvez changer d’assurance de base pour la fin de l’année si votre résiliation parvient à la caisse au plus tard le lundi 30 novembre 2026. La nouvelle caisse doit vous accepter sans questions de santé. Les primes 2027 figurent déjà dans le comparateur de primes de priminfo.admin.ch.","facts":[["Délai","La résiliation doit parvenir à la caisse au plus tard le dernier jour ouvrable de novembre (2026 : lundi 30 novembre). Seule la réception compte, pas le cachet postal. Recommandé : l’envoyer en recommandé d’ici la mi-novembre."],["Franchise","Adultes : CHF 300 ou, au choix, 500, 1 000, 1 500, 2 000, 2 500, plus 10 % de quote-part, au maximum CHF 700 par an. Enfants : pas de franchise, quote-part de CHF 350 au maximum."],["Changer de franchise","Franchise plus basse : à communiquer par écrit au plus tard le dernier jour ouvrable de novembre. Franchise plus haute : seulement au début de l’année, à communiquer au plus tard à la mi-décembre (recommandation)."],["En cours d’année","Changement au 1er juillet seulement avec la franchise ordinaire (CHF 300) et le libre choix du fournisseur de soins, résiliation d’ici le 31 mars. Avec un modèle à choix restreint (p. ex. médecin de famille ou télémédecine), changement possible seulement pour la fin de l’année."],["Attention","Si des primes ou participations aux coûts rappelées sont encore impayées, vous ne pouvez pas changer d’assurance de base."],["Compétence","Votre caisse actuelle et la nouvelle caisse. La Confédération (OFSP) approuve les primes."]],"steps":["Comparer les primes 2027 sur priminfo.admin.ch : saisir lieu de domicile, âge, franchise et modèle (p. ex. médecin de famille ou télémédecine).","Choisir la nouvelle caisse et lui demander l’assurance de base. Toute caisse doit vous accepter, sans questions de santé, sans réserve ni délai d’attente.","Résilier l’assurance de base actuelle par écrit, de préférence en recommandé d’ici la mi-novembre.","Ne pas résilier trop vite l’assurance complémentaire : pour elle, la caisse peut poser des questions de santé et refuser. Les délais figurent dans les conditions d’assurance et peuvent aller jusqu’à six mois. La caisse n’a pas le droit de la résilier parce que vous changez d’assurance de base.","Attendre la confirmation de la nouvelle caisse : l’ancienne assurance ne prend fin que lorsque la nouvelle a annoncé la couverture sans interruption. Si l’annonce arrive trop tard, la nouvelle caisse doit prendre en charge la différence de prime."],"who":[1,0,0],"note":"La loi (LAMal) et l’approbation des primes relèvent de la Confédération (OFSP). La résiliation et l’adhésion se font directement auprès des caisses-maladie, aucune autorité ne les reçoit.","src":["Priminfo (OFSP) : FAQ, changer de caisse-maladie","Priminfo (OFSP) : comparateur de primes 2027","Priminfo (OFSP) : primes 2027 par canton","Fedlex : LAMal (RS 832.10), art. 7 et 64"]}}},"it":{"ask_label":"Cosa desidera sapere?","send":"Invii la domanda","nav":["Vista cittadini","Vista delle autorità","Progetto","Pagina iniziale","Menu","Pagine"],"f_links":["Contatto","Vista delle autorità","Vista cittadini","Progetto"],"f_sender":"Concetto privato di Bilal Simsek, Berna. Non è un'offerta di un'autorità. I Suoi riscontri sono benvenuti: {c}","f_legal":"Protezione dei dati, condizioni d'uso e accessibilità non sono elaborate nel concetto. Il prototipo non raccoglie dati personali, non imposta cookie e non utilizza strumenti di analisi; nel browser viene memorizzato solo, in locale, che Lei ha letto l'avviso.","f_note":"Prototipo concettuale. Tutte le risposte sono esempi e non sostituiscono l'informazione di un'autorità.","banner_s":"Prototipo concettuale, non un sito ufficiale","skip":"Vai al contenuto","chips":[{"l":"Trasloco","q":"Mi trasferisco da Berna a Winterthur: come e entro quando devo annunciare la partenza e l’arrivo?"},{"l":"Passaporto & ID","q":"Abito a Berna e ho bisogno di un nuovo passaporto e di una carta d’identità. Come e dove li ordino?"},{"l":"Termine fiscale","q":"Abito a Berna e non riesco a presentare la dichiarazione d’imposta entro metà marzo. Come prolungo il termine e quanto costa?"},{"l":"Rendita AVS","q":"Sono nato/a nel 1962 e abito a Thun: quando e dove richiedo la rendita AVS?"},{"l":"Disoccupazione","q":"Abito a Thun e alla fine del mese perdo il mio posto di lavoro. Dove e quando devo annunciarmi e come ottengo l’indennità di disoccupazione?"},{"l":"Cambiare cassa","q":"Entro quando posso cambiare cassa malati e come funziona?"}],"think":"Tell consulta le fonti ufficiali","who":"Competenza","bund":"Confederazione","kanton":"Cantone","gemeinde":"Comune","src":"Fonti","glance":"In breve","stand":"Stato: ottobre 2026 · Risposta a titolo di esempio, tratta da fonti pubbliche, senza garanzia. Fanno stato gli uffici competenti.","newtab":"si apre in una nuova scheda","newq":"Nuova domanda","fb":{"intro":"Il prototipo non ha ancora una risposta a questa domanda. La versione definitiva consulterebbe qui le fonti ufficiali di Confederazione, cantoni e comuni. Risponde già a sei esempi: trasloco, passaporto e carta d’identità, dichiarazione d’imposta, rendita AVS, disoccupazione e cambio della cassa malati. Provi uno di questi."},"ans":{"move":{"intro":"Lei si annuncia entro 14 giorni presso il nuovo comune. Da Berna a Winterthur ciò avviene online tramite eUmzugCH: entrambi i comuni sono collegati e l’annuncio di partenza e quello di arrivo richiedono insieme circa 10 minuti.","facts":[["Scadenza","14 giorni dal cambio di indirizzo (art. 11 LArRa)"],["Costi","Winterthur: CHF 40 per persona adulta; eUmzugCH non costa più dello sportello"],["Durata","Online circa 10 minuti"],["Competenza","Servizi agli abitanti di Berna (partenza), controllo abitanti di Winterthur (arrivo)"]],"steps":["Su eumzug.swiss inserire il vecchio indirizzo (Berna) e il nuovo indirizzo (Winterthur) e avviare la verifica.","Tenere pronti: passaporto o carta d’identità, numero AVS (13 cifre), contratto di locazione o conferma di entrata nell’alloggio, carta o Twint per CHF 40.","Tenere pronta la tessera della cassa malati o la polizza: Winterthur richiede questa prova al momento dell’annuncio di arrivo.","Concludere online l’annuncio di partenza a Berna e l’annuncio di arrivo a Winterthur; una visita allo sportello a Berna non è necessaria.","Ufficio delle imposte: Winterthur riceve automaticamente il nuovo indirizzo; vi è assoggettato all’imposta dal 1° gennaio dell’anno di arrivo."],"who":[1,1,1],"note":"I comuni (Berna, Winterthur) ricevono gli annunci di partenza e di arrivo, eUmzugCH è il servizio comune di Confederazione, cantoni e comuni; le imposte sono riscosse dal Cantone di Zurigo con la Città di Winterthur.","src":["eUmzugCH – annunciare il trasloco online (Confederazione, cantoni, comuni)","Città di Winterthur – trasloco e arrivo a Winterthur","Città di Berna – arrivo, trasloco e partenza","Città di Winterthur – imposte in caso di trasloco, arrivo e partenza"]},"passport":{"intro":"Come persona adulta domiciliata a Berna, Lei richiede passaporto e/o carta d’identità online su schweizerpass.ch e si reca poi all’appuntamento prenotato, p. es. al centro documenti d’identità di Berna (Laupenstrasse 18A). La combinazione passaporto + carta d’identità costa CHF 158 ed è valida 10 anni.","facts":[["Costi","Adulti: carta d’identità CHF 70, passaporto CHF 145, combinazione CHF 158. Bambini fino a 18 anni: carta d’identità 35, passaporto 65, combinazione 78 (porto incluso)."],["Validità","Adulti 10 anni, bambini e giovani fino a 18 anni: 5 anni. Una proroga non è possibile, si ordina un nuovo documento."],["Durata","Consegna al massimo 10 giorni lavorativi dopo l’appuntamento, per raccomandata. Il ritiro allo sportello non è possibile."],["Appuntamento","Obbligatorio, presenza personale necessaria (foto, per il passaporto impronte digitali)."]],"steps":["Compilare la richiesta online su schweizerpass.ch (indirizzo e-mail personale necessario). Dopo la verifica riceve un’e-mail per scegliere l’appuntamento.","Prenotare l’appuntamento in uno dei 7 centri documenti d’identità bernesi (obbligatorio): online o per telefono allo 031 635 40 00, lun–ven.","Portare il vecchio documento, ma nessuna fotografia: la foto viene scattata sul posto.","Pagare l’importo sul posto (carta, Twint o contanti). I bambini vengono con una persona titolare dell’autorità parentale e il suo documento d’identità.","Il documento arriva entro 10 giorni lavorativi, per raccomandata, all’indirizzo indicato."],"who":[1,1,0],"note":"La Confederazione (fedpol) pubblica prezzi, validità e termini di consegna; nel Cantone di Berna il servizio passaporti e carte d’identità (Ufficio della popolazione) registra i Suoi dati nei centri documenti d’identità.","src":["fedpol: prezzi, validità e termini di consegna","Cantone di Berna: documenti d’identità, prezzi e validità","Cantone di Berna: centri documenti d’identità e appuntamento","Cantone di Berna: presentarsi all’appuntamento, documenti da portare"]},"tax":{"intro":"Nel Cantone di Berna la dichiarazione d’imposta scade di regola il 15 marzo; online può prorogare gratuitamente fino al 15 luglio, al massimo fino al 15 novembre. Per il periodo fiscale 2025, a causa di un’interruzione informatica, il 30 novembre 2026 vale eccezionalmente come ultimo termine.","facts":[["Scadenza","Berna: 15 marzo (indipendenti: 15 maggio). Zurigo e Ginevra: 31 marzo."],["Costi","Berna online: gratis fino al 15 luglio, CHF 20 fino al 15 sett., CHF 40 fino al 15 nov. Per scritto/telefono: CHF 20/40/60. Ginevra: CHF 20/40/60."],["Durata","Berna: al massimo fino al 15 nov.; dichiarazione 2025 eccezionalmente fino al 30 nov. 2026 (interruzione informatica)."],["Competenza","Berna: amministrazione cantonale delle imposte. Zurigo: ufficio comunale delle imposte. Ginevra: Administration fiscale cantonale."]],"steps":["Tenere pronti la lettera sulla dichiarazione d’imposta, il certificato di salario (del datore di lavoro) e i giustificativi.","Prima della scadenza, in BE-Login (con AGOV): «Fristverlängerung erfassen» (registrare la proroga), scegliere il nuovo termine e confermare.","Salvare la conferma da sé: non ne arriva nessuna per posta o e-mail.","Compilare la dichiarazione in TaxMe-Online e inoltrarla con i giustificativi (oppure consegnarla stampata al comune di domicilio).","In ritardo? Si rischia una tassa di sollecito di CHF 60; scaduto il termine di sollecito, non è più possibile alcuna proroga."],"who":[1,1,1],"note":"L’amministrazione cantonale delle imposte riceve la Sua dichiarazione e tassa anche l’imposta federale diretta su mandato della Confederazione (vigilanza dell’AFC); il comune fissa il proprio moltiplicatore d’imposta.","src":["Cantone di Berna: prorogare il termine come persona privata","Cantone di Berna: istruzioni, termine di inoltro","Cantone di Zurigo: dichiarazione d’imposta delle persone fisiche","Cantone di Ginevra: richiedere una proroga"]},"ahv":{"intro":"Un uomo nato nel 1962 e residente a Thun raggiunge nel 2027, a 65 anni, l’età di riferimento e richiede la rendita alla cassa di compensazione 3–4 mesi prima. Con compleanno il 15 marzo 2027 la rendita inizia il 1° aprile 2027; la richiesta si presenta da circa dicembre 2026.","facts":[["Età di riferimento","Uomini 65. Donne: nate nel 1961 = 64 anni e 3 mesi, 1962 = 64 anni e 6 mesi, 1963 = 64 anni e 9 mesi, dal 1964 = 65. Rendita dal mese successivo."],["Scadenza","Richiesta 3–4 mesi prima dell’inizio della rendita. Anticipo dai 63 anni (–6.8 % per 1 anno), differimento 1–5 anni (+5.2 % fino a +31.5 %)."],["Rendita","Con durata di contribuzione completa CHF 1’260–2’520 al mese; coppia al massimo CHF 3’780. In più la 13a rendita da dicembre 2026."],["Competenza","Cassa di compensazione a cui è affiliato il Suo datore di lavoro (nel Cantone di Berna p. es. la cassa di compensazione del Cantone di Berna, AK Bern)."]],"steps":["Chiarire la cassa di compensazione competente: i dipendenti chiedono al datore di lavoro, gli indipendenti all’ultima cassa con cui hanno conteggiato.","Compilare e inoltrare online il modulo 318.370 «Richiesta di una rendita di vecchiaia» 3–4 mesi prima dell’inizio della rendita.","Anticipo: da chiedere al più tardi entro la fine del mese precedente. Differimento: da spuntare nel modulo al più tardi 1 anno dopo l’età di riferimento.","Caricare gli allegati con il modulo o inviarli per posta; la cassa di compensazione procura i documenti necessari e calcola la rendita.","Pagamento mensile (AK Bern: 4° giorno lavorativo, p. es. il 4 dicembre 2026); la 13a rendita di dicembre arriva senza richiesta."],"who":[1,1,0],"note":"La Confederazione (UFAS) stabilisce le regole e pubblica i fogli informativi; la cassa di compensazione (nel Cantone di Berna l’AK Bern) riceve la Sua richiesta, calcola e versa la rendita.","src":["Cassa di compensazione del Cantone di Berna: rendita di vecchiaia dell’AVS","ahv-iv.ch: opuscolo 3.01 Rendite di vecchiaia (stato 1.1.2026)","ch.ch: pensionamento – da quando?","UFAS: stabilizzazione dell’AVS (AVS 21)"]},"alv":{"intro":"Si annunci all’URC della Sua regione al più tardi il primo giorno per cui desidera l’indennità di disoccupazione, nel modo più rapido online nel Job-Room. Esempio a Thun: 30 anni, salario mensile di 6’500 franchi, nessun figlio, 14 mesi di contribuzione danno il 70 %, al massimo 260 indennità giornaliere e 10 giorni di attesa.","facts":[["Scadenza","Annuncio all’URC al più tardi il 1° giorno di disoccupazione, meglio già durante il periodo di disdetta."],["Importo","70 % del guadagno assicurato. 80 % con figli sotto i 25 anni, guadagno fino a 3’797 franchi o rendita AI dal 40 %."],["Durata","Almeno 12 mesi di contribuzione in 2 anni. 260 indennità giornaliere, di più con un periodo di contribuzione più lungo. Termine quadro: 2 anni."],["Competenza","URC (annuncio, consulenza) e la cassa di disoccupazione da Lei scelta (pagamento)."]],"steps":["Annunciarsi online tramite l’e-service per l’annuncio all’URC nel Job-Room, oppure di persona presso l’URC della Sua regione.","Cercare lavoro già durante il periodo di disdetta e documentare ogni candidatura. Quante, lo stabilisce il Suo URC.","Scegliere la cassa di disoccupazione, inoltrare la «richiesta di indennità di disoccupazione» e le attestazioni del datore di lavoro (2 anni).","Primo colloquio all’URC (invito entro 15 giorni): portare la tessera AVS o della cassa malati, un documento d’identità e la prova delle ricerche di lavoro.","Ogni mese inoltrare le «indicazioni della persona assicurata». Le indennità giornaliere seguono di regola il mese successivo."],"who":[1,1,0],"note":"La SECO vigila sull’assicurazione contro la disoccupazione; URC, casse di disoccupazione e uffici cantonali la eseguono; l’annuncio si fa direttamente all’URC.","src":["arbeit.swiss: annuncio e registrazione","arbeit.swiss (SECO): FAQ sull’indennità di disoccupazione","ch.ch: disoccupazione in Svizzera","Fedlex: LADI (RS 837.0), art. 9, 17, 18, 22, 27"]},"kk":{"intro":"Lei può cambiare l’assicurazione di base per la fine dell’anno se la disdetta giunge alla cassa entro lunedì 30 novembre 2026. La nuova cassa deve accettarLa senza domande sullo stato di salute. I premi 2027 sono già nel calcolatore dei premi di priminfo.admin.ch.","facts":[["Scadenza","La disdetta deve giungere alla cassa al più tardi l’ultimo giorno lavorativo di novembre (2026: lunedì 30 novembre). Conta la ricezione, non il timbro postale. Consigliato: raccomandata entro metà novembre."],["Franchigia","Adulti: CHF 300 oppure, a scelta, 500, 1’000, 1’500, 2’000, 2’500, più il 10 % di aliquota percentuale, al massimo CHF 700 all’anno. Bambini: nessuna franchigia, aliquota percentuale al massimo CHF 350."],["Cambiare franchigia","Franchigia più bassa: comunicarlo per scritto entro l’ultimo giorno lavorativo di novembre. Franchigia più alta: solo a inizio anno, da comunicare al più tardi a metà dicembre (raccomandazione)."],["A metà anno","Cambio al 1° luglio solo con la franchigia ordinaria (CHF 300) e libera scelta del fornitore di prestazioni, disdetta entro il 31 marzo. Con un modello a scelta limitata (p. es. medico di famiglia o telemedicina) il cambio è possibile solo a fine anno."],["Attenzione","Chi ha premi o partecipazioni ai costi sollecitati e non ancora pagati non può cambiare l’assicurazione di base."],["Competenza","La cassa attuale e la nuova cassa. La Confederazione (UFSP) approva i premi."]],"steps":["Confrontare i premi 2027 su priminfo.admin.ch: indicare domicilio, età, franchigia e modello (p. es. medico di famiglia o telemedicina).","Scegliere la nuova cassa e richiedere l’assicurazione di base. Ogni cassa deve accettarLa, senza domande sulla salute, riserve o periodi d’attesa.","Disdire per scritto l’assicurazione di base attuale, meglio con raccomandata entro metà novembre.","Non disdire troppo in fretta l’assicurazione complementare: per questa la cassa può porre domande sulla salute e rifiutare. I termini sono nelle condizioni d’assicurazione e possono arrivare a sei mesi. La cassa non può disdirla perché Lei cambia l’assicurazione di base.","Attendere la conferma della nuova cassa: la vecchia assicurazione termina solo quando la nuova ha comunicato la copertura senza interruzioni. Se la comunicazione arriva in ritardo, la nuova cassa deve coprire la differenza di premio."],"who":[1,0,0],"note":"La legge (LAMal) e l’approvazione dei premi spettano alla Confederazione (UFSP). Disdetta e adesione avvengono direttamente con le casse malati, nessuna autorità le riceve.","src":["Priminfo (UFSP): FAQ, cambio della cassa malati","Priminfo (UFSP): calcolatore dei premi 2027","Priminfo (UFSP): premi 2027 per cantone","Fedlex: LAMal (RS 832.10), art. 7 e 64"]}}},"en":{"ask_label":"What would you like to know?","send":"Send question","nav":["Citizen view","Authority view","Project","Home","Menu","Pages"],"f_links":["Contact","Authority view","Citizen view","Project"],"f_sender":"Private concept by Bilal Simsek, Bern. Not an offer by any authority. Feedback welcome: {c}","f_legal":"Privacy, terms of use and accessibility are not worked out in the concept. The prototype collects no personal data, sets no cookies and uses no analytics tools; the browser only remembers locally that you have read the notice.","f_note":"Concept prototype. All answers are examples and do not replace information from an authority.","banner_s":"Concept prototype, not an official site","skip":"Skip to content","chips":[{"l":"Report a move","q":"I'm moving from Bern to Winterthur: how and by when do I deregister and register?"},{"l":"Passport & ID","q":"I live in Bern and need a new passport and an ID card. How and where do I order them?"},{"l":"Tax return deadline","q":"I live in Bern and can't finish my tax return by mid-March. How do I extend the deadline and what does it cost?"},{"l":"AHV/AVS pension","q":"I was born in 1962 and live in Thun: when and where do I claim my AHV/AVS pension?"},{"l":"Register as unemployed","q":"I live in Thun and lose my job at the end of the month. Where and when do I have to register, and how do I get unemployment benefit?"},{"l":"Switch health insurer","q":"By when can I switch my health insurer and how does it work?"}],"think":"Tell is checking official sources","who":"Responsible","bund":"Federal","kanton":"Canton","gemeinde":"Municipality","src":"Sources","glance":"At a glance","stand":"As of October 2026 · Sample answer from public sources, without guarantee. The responsible offices are authoritative.","newtab":"opens in a new tab","newq":"New question","fb":{"intro":"The prototype has no answer to this yet. The real version would search official sources from federal, cantonal and municipal governments here. It already answers six examples: moving, passport and ID, tax return, AHV/AVS pension, unemployment and switching health insurer. Try one of them."},"ans":{"move":{"intro":"You register at your new place of residence within 14 days. From Bern to Winterthur this works online via eUmzugCH: both municipalities are connected, and deregistering and registering take about 10 minutes together.","facts":[["Deadline","14 days from the change of address (Art. 11 Register Harmonisation Act)"],["Cost","Winterthur: CHF 40 per adult; eUmzugCH costs no more than the counter"],["Duration","About 10 minutes online"],["Responsible","Bern residents' services (deregistration), Winterthur residents' registry (registration)"]],"steps":["On eumzug.swiss, enter your old address (Bern) and your new address (Winterthur) and start the check.","Have ready: passport or ID card, AHV/AVS number (13 digits), rental contract or move-in confirmation, card or Twint for CHF 40.","Have your health insurance card or policy ready: Winterthur requires this proof at registration.","Complete deregistration in Bern and registration in Winterthur online; a visit to the counter in Bern is not necessary.","Tax office: Winterthur receives the new address automatically; you are liable to tax there from 1 January of the year of arrival."],"who":[1,1,1],"note":"The municipalities (Bern, Winterthur) handle deregistration and registration, eUmzugCH is the joint service of the federal government, cantons and municipalities, and taxes are levied by the canton of Zurich together with the city of Winterthur.","src":["eUmzugCH – report your move online (federal government, cantons, municipalities)","City of Winterthur – moving and arriving in Winterthur","City of Bern – arrival, moving and departure","City of Winterthur – taxes when moving, arriving and leaving"]},"passport":{"intro":"As an adult living in Bern, you apply for a passport and/or ID card online at schweizerpass.ch and then go to your booked appointment, e.g. at the ID document centre in Bern (Laupenstrasse 18A). The combined passport + ID card costs CHF 158 and is valid for 10 years.","facts":[["Cost","Adults: ID card CHF 70, passport CHF 145, combination CHF 158. Children up to 18: ID 35, passport 65, combination 78 (postage included)."],["Validity","Adults 10 years, children and young people up to 18: 5 years. Extending is not possible, you order a new one."],["Duration","Delivery within 10 working days after the appointment at the latest, by registered mail. Taking it with you at the counter is not possible."],["Appointment","Mandatory, you must appear in person (photo, fingerprints for the passport)."]],"steps":["Fill in the online application at schweizerpass.ch (personal e-mail address required). After review, you receive an e-mail to choose an appointment.","Book an appointment at one of the 7 ID document centres in the canton of Bern (mandatory): online or by phone on 031 635 40 00, Mon–Fri.","Bring your old document, but no passport photo: the photo is taken on site.","Pay the fee on site (card, Twint or cash). Children come with a legal guardian and their ID.","The document arrives within 10 working days by registered mail at the address you gave."],"who":[1,1,0],"note":"The federal government (fedpol) publishes prices, validity and delivery times; in the canton of Bern, the passport and ID card service (Office for Resident Services) records your data at the ID document centres.","src":["fedpol: prices, validity and delivery times","Canton of Bern: ID documents, prices and validity","Canton of Bern: ID document centres and appointments","Canton of Bern: attending the appointment, documents to bring"]},"tax":{"intro":"In the canton of Bern, the tax return is generally due on 15 March; online you can extend it free of charge until 15 July, and until 15 November at the latest. For tax period 2025, because of an IT outage, 30 November 2026 applies exceptionally as the final deadline.","facts":[["Deadline","Bern: 15 March (self-employed: 15 May). Zurich and Geneva: 31 March."],["Cost","Bern online: free until 15 July, CHF 20 until 15 Sept., CHF 40 until 15 Nov. In writing/by phone: CHF 20/40/60. Geneva: CHF 20/40/60."],["Duration","Bern: until 15 Nov. at the latest; 2025 return exceptionally until 30 Nov. 2026 (IT outage)."],["Responsible","Bern: cantonal tax administration. Zurich: municipal tax office. Geneva: Administration fiscale cantonale."]],"steps":["Have the letter about the tax return, your salary certificate (from your employer) and supporting documents ready.","Before the deadline, in BE-Login (with AGOV): “Fristverlängerung erfassen” (record extension), choose the new deadline and confirm.","Save the confirmation yourself: none is sent by post or e-mail.","Fill in the return in TaxMe-Online and submit it with supporting documents (or hand it in printed at your municipality of residence).","Too late? A reminder fee of CHF 60 is possible; once the reminder period has expired, no extension is possible any more."],"who":[1,1,1],"note":"The cantonal tax administration receives your return and also assesses the direct federal tax on behalf of the federal government (supervised by the FTA); the municipality sets its own tax rate.","src":["Canton of Bern: extending the deadline as a private individual","Canton of Bern: guidance, filing deadline","Canton of Zurich: tax return for private individuals","Canton of Geneva: request an extension"]},"ahv":{"intro":"A man born in 1962 who lives in Thun reaches the reference age of 65 in 2027 and claims his pension from the compensation office 3–4 months earlier. With a birthday on 15 March 2027, the pension starts on 1 April 2027; the claim is filed from about December 2026.","facts":[["Reference age","Men 65. Women: born 1961 = 64 y 3 m, 1962 = 64 y 6 m, 1963 = 64 y 9 m, from 1964 = 65. Pension from the following month."],["Deadline","Claim 3–4 months before the pension starts. Early drawing from 63 (–6.8 % for 1 year), deferral 1–5 years (+5.2 % to +31.5 %)."],["Pension","With a full contribution period CHF 1,260 to 2,520 per month; couple at most CHF 3,780. Plus the 13th pension from December 2026."],["Responsible","The compensation office your employer is affiliated with (in the canton of Bern e.g. the Bern compensation office, AK Bern)."]],"steps":["Find out which compensation office is responsible: employees ask their employer, self-employed people the office they last settled with.","Fill in and submit form 318.370 “Claim for an old-age pension” online 3–4 months before the pension starts.","Early drawing: apply by the end of the previous month at the latest. Deferral: tick the box on the form no later than 1 year after the reference age.","Upload the enclosures with the form or send them by post; the compensation office obtains the documents needed and calculates the pension.","Paid monthly (AK Bern: 4th working day, e.g. 4 December 2026); the 13th pension in December comes without an application."],"who":[1,1,0],"note":"The federal government (FSIO) sets the rules and publishes the leaflets; the compensation office (in the canton of Bern, AK Bern) receives your claim, calculates and pays the pension.","src":["Bern compensation office: AHV/AVS old-age pension","ahv-iv.ch: Leaflet 3.01 Old-age pensions (as of 1.1.2026)","ch.ch: Retirement – from when?","FSIO: Stabilising the AHV (AHV 21)"]},"alv":{"intro":"Register at the RAV (regional employment centre) in your region no later than the first day for which you want unemployment benefit, fastest online in Job-Room. Example in Thun: aged 30, monthly salary of 6,500 francs, no children, 14 months of contributions gives 70 %, at most 260 daily allowances and 10 waiting days.","facts":[["Deadline","Register with the RAV no later than the 1st day of unemployment, better still during the notice period."],["Amount","70 % of insured earnings. 80 % with children under 25, earnings up to 3,797 francs or a disability pension of 40 % or more."],["Duration","At least 12 months of contributions within 2 years. 260 daily allowances, more with a longer contribution period. Framework period: 2 years."],["Responsible","RAV (registration, counselling) and the unemployment fund you choose (payment)."]],"steps":["Register online: use the e-service for registering with the RAV in Job-Room, or go in person to the RAV in your region.","Look for work already during the notice period and document every application. Your RAV sets how many.","Choose an unemployment fund, submit the “application for unemployment benefit” and employer certificates (2 years).","First interview at the RAV (invitation within 15 days): bring your AHV/AVS or health insurance card, ID and proof of your job search efforts.","Submit the “information from the insured person” form every month. Daily allowances usually follow in the next month."],"who":[1,1,0],"note":"SECO supervises unemployment insurance; RAV, unemployment funds and cantonal offices carry it out; you register directly with the RAV.","src":["arbeit.swiss: registration","arbeit.swiss (SECO): FAQ on unemployment benefit","ch.ch: Unemployment in Switzerland","Fedlex: Unemployment Insurance Act (AVIG, SR 837.0), Art. 9, 17, 18, 22, 27"]},"kk":{"intro":"You can switch your basic health insurance for the end of the year if your insurer receives your cancellation by Monday, 30 November 2026. The new insurer must accept you without health questions. The 2027 premiums are already in the premium calculator on priminfo.admin.ch.","facts":[["Deadline","Your insurer must receive the cancellation by the last working day of November (2026: Monday, 30 November). Receipt counts, not the postmark. Recommended: send it by registered mail by mid-November."],["Franchise","Adults: CHF 300 or, optionally, 500, 1,000, 1,500, 2,000, 2,500, plus 10 % co-payment, at most CHF 700 a year. Children: no franchise, co-payment at most CHF 350."],["Changing franchise","Lower franchise: tell the insurer in writing by the last working day of November. Higher franchise: only from the start of a year, tell the insurer by mid-December at the latest (recommendation)."],["Mid-year","Switching on 1 July is only possible with the standard CHF 300 franchise and free choice of provider, with notice by 31 March. With a restricted-choice model (e.g. family doctor or telemedicine) you can only switch at year-end."],["Caution","If you have reminded, unpaid premiums or cost shares, you cannot switch your basic insurance."],["Responsible","Your current and your new insurer. The federal government (FOPH) approves the premiums."]],"steps":["Compare the 2027 premiums on priminfo.admin.ch: enter your place of residence, age, franchise and model (e.g. family doctor or telemedicine).","Choose the new insurer and apply for basic insurance. Every insurer must accept you, with no health questions, reservations or waiting periods.","Cancel your current basic insurance in writing, ideally by registered mail by mid-November.","Do not cancel supplementary insurance too quickly: for it, insurers may ask health questions and decline you. The notice periods are in the policy terms and can be up to six months. Your insurer may not cancel it just because you switch your basic insurance.","Wait for the new insurer’s confirmation: your old cover only ends once the new insurer has reported uninterrupted cover. If that report is late, the new insurer must cover the premium difference."],"who":[1,0,0],"note":"The law (KVG/LAMal) and premium approval are federal matters (FOPH). Cancellation and joining go directly through the insurers, no authority receives them.","src":["Priminfo (FOPH): FAQ, switching health insurer","Priminfo (FOPH): premium calculator 2027","Priminfo (FOPH): 2027 premiums by canton","Fedlex: KVG (SR 832.10), Art. 7 and 64"]}}}};
const PAGE={"de":{"title":"Frag Tell – Tell (privates Konzept, Prototyp)","desc":"Frag Tell: Chat-Einstieg des privaten Konzeptprototyps Tell. Sechs Themen, Antworten nur aus offiziellen Quellen. Keine offizielle Seite.","page":"Frag Tell","greet":{"m":"Guten Morgen","d":"Guten Tag","e":"Guten Abend","tail":", Schweiz"},"sub":"Was möchten Sie bei Bund, Kanton oder Gemeinde erledigen?","more":"Weitere Themen","less":"Weniger","f_views":["Abdeckung","Neuigkeiten","Für Behörden","Mitmachen"],"f_pages_h":"Weitere Seiten von Tell","credit":"Bildnachweis: Foto Bundeshaus Bern («Bundeshaus Bern 20180827-2»): Suicasmo, CC BY-SA 4.0, via Wikimedia Commons (commons.wikimedia.org/wiki/File:Bundeshaus_Bern_20180827-2.jpg); freigestellt und bearbeitet.","mail":{"fb":"Tell: Rückmeldung","err":"Tell: Fehler oder Veraltetes melden","topic":"Tell: Themenvorschlag"},"views":{"abdeckung":{"t":"Abdeckung","h":"Was Tell abdeckt","lead":"Tell ist ein Konzeptprototyp und kein flächendeckender Auskunftsdienst. Heute beantwortet die Chatbox sechs Themen, jeweils für Beispielorte. Zu allem anderen sagt Tell offen, dass es noch keine Antwort hat.","blocks":[{"type":"topics","h":"Heute: sechs Themen","ask":"Frage stellen","items":[{"h":"Umzug melden","t":"Ab- und Anmeldung, Frist, Kosten und Ablauf über eUmzugCH.","m":"Beispiel: Bern nach Winterthur"},{"h":"Pass & ID","t":"Antrag, Termin, Kosten und Gültigkeit.","m":"Beispiel: Kanton Bern"},{"h":"Steuererklärung, Frist verlängern","t":"Fristen, Verlängerung und Kosten.","m":"Beispiel: Kanton Bern, teils Zürich und Genf"},{"h":"AHV-Rente anmelden","t":"Referenzalter, Anmeldung, Vorbezug und Aufschub.","m":"Beispiel: Jahrgang 1962, Thun"},{"h":"Arbeitslos melden","t":"Anmeldung beim RAV, Arbeitslosenentschädigung und Ablauf.","m":"Beispiel: Thun, Regeln des Bundes"},{"h":"Krankenkasse wechseln","t":"Kündigungsfrist, Franchise, Prämien 2027 und Ablauf.","m":"Ganze Schweiz (Bundesrecht, KVG)"}]},{"type":"list","h":"Gut zu wissen","items":["Die Antworten stammen aus öffentlichen, offiziellen Quellen von Bund, Kantonen und Gemeinden und nennen diese. Stand: Oktober 2026, ohne Gewähr.","Die Antworten sind Beispiele für einzelne Orte. Andere Gemeinden und Kantone können abweichen. Massgebend sind immer die zuständigen Stellen.","Die Chatbox erkennt Themen an Stichwörtern. Wenn nichts passt, sagt sie das.","Ihre Eingabe bleibt im Browser. Es gibt kein Konto und keinen Gesprächsverlauf."]},{"type":"list","h":"Noch nicht abgedeckt","items":["Gewerbe oder Einzelfirma anmelden: Idee für ein nächstes Thema, noch nicht umgesetzt.","Alle übrigen Behördengänge sowie die meisten Gemeinden und Kantone."],"note":"Kein Zeitplan und keine Zusage."}]},"neuigkeiten":{"t":"Neuigkeiten","h":"Neuigkeiten","lead":"Was sich bei Tell geändert hat, mit Datum. Aufgeführt ist nur, was tatsächlich umgesetzt wurde.","blocks":[{"type":"news","items":[{"d":"7. Oktober 2026","g":[{"h":"Neues Thema","li":["Krankenkasse wechseln: Kündigungsfrist, Franchise, Prämien 2027 und Ablauf, mit Quellen von Priminfo (BAG) und Fedlex (KVG)."]},{"h":"Neue Seite","li":["«Frag Tell» mit Chat-Einstieg sowie den Bereichen Abdeckung, Neuigkeiten, Für Behörden und Mitmachen.","«Lücken»: neue Seite, auf der Tell festhält, wo offizielle Angaben zu seinen Themen Lücken, Unklarheiten oder Abweichungen zeigen. Erst ein Anfang: 8 Beobachtungen mit Quellen, Stand 7. Oktober 2026."]}]},{"d":"5. Oktober 2026","g":[{"h":"Verbessert","li":["Kopfbild der Startseite: Bundeshaus frontal und grösser."]}]},{"d":"4. Oktober 2026","g":[{"h":"Online","li":["Tell geht als privater Konzeptprototyp online: Startseite, Bürgersicht, Behördensicht und Projekt."]}]}]}]},"behoerden":{"t":"Für Behörden","h":"Für Behörden","lead":"Tell ist ein privates Konzept. Heute arbeitet keine Behörde mit Tell zusammen, und es gibt keine Absprache mit einer Stelle. Diese Seite zeigt, wie eine Zusammenarbeit aussehen könnte, in drei Stufen: Mit jeder Stufe steigt der Nutzen für Bürgerinnen und Bürger,
