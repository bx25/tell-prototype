in Bern and registration in Winterthur online; a visit to the counter in Bern is not necessary.","Tax office: Winterthur receives the new address automatically; you are liable to tax there from 1 January of the year of arrival."],"who":[1,1,1],"note":"The municipalities (Bern, Winterthur) handle deregistration and registration, eUmzugCH is the joint service of the federal government, cantons and municipalities, and taxes are levied by the canton of Zurich together with the city of Winterthur.","src":["eUmzugCH – report your move online (federal government, cantons, municipalities)","City of Winterthur – moving and arriving in Winterthur","City of Bern – arrival, moving and departure","City of Winterthur – taxes when moving, arriving and leaving"]},"passport":{"intro":"As an adult living in Bern, you apply for a passport and/or ID card online at schweizerpass.ch and then go to your booked appointment, e.g. at the ID document centre in Bern (Laupenstrasse 18A). The combined passport + ID card costs CHF 158 and is valid for 10 years.","facts":[["Cost","Adults: ID card CHF 70, passport CHF 145, combination CHF 158. Children up to 18: ID 35, passport 65, combination 78 (postage included)."],["Validity","Adults 10 years, children and young people up to 18: 5 years. Extending is not possible, you order a new one."],["Duration","Delivery within 10 working days after the appointment at the latest, by registered mail."],["Appointment","Mandatory, you must appear in person (photo, fingerprints for the passport)."],["New from November","From 2 November 2026 a biometric ID card with a chip (facial image and two fingerprints) is also available. Optional, same fee as today. The provisional passport will then be called «emergency passport»."]],"steps":["Fill in the online application at schweizerpass.ch (personal e-mail address required). After review, you receive an e-mail to choose an appointment.","Book an appointment at one of the 7 ID document centres in the canton of Bern (mandatory): online or by phone on 031 635 40 00, Mon–Fri.","Bring your old document, but no passport photo: the photo is taken on site.","Pay the fee on site (card, Twint or cash). Children come with a legal guardian and their ID.","The document arrives within 10 working days by registered mail at the address you gave."],"who":[1,1,0],"note":"The federal government (fedpol) publishes prices, validity and delivery times; in the canton of Bern, the seven cantonal ID document centres record your data.","src":["fedpol: prices, validity and delivery times","Canton of Bern: ID documents, prices and validity","Canton of Bern: ID document centres and appointments","Canton of Bern: attending the appointment, documents to bring","Federal Council: biometric ID card from 2.11.2026 (press release 26.8.2026)"]},"tax":{"intro":"In the canton of Bern, the tax return is generally due on 15 March; online you can extend it free of charge until 15 July, and until 15 November at the latest. For tax period 2025, because of an IT outage, 30 November 2026 applies exceptionally as the final deadline.","facts":[["Deadline","Bern: 15 March (self-employed: 15 May). Zurich and Geneva: 31 March."],["Cost","Bern online: free until 15 July, CHF 20 until 15 Sept., CHF 40 until 15 Nov. In writing/by phone: CHF 20/40/60. Geneva: CHF 20/40/60."],["Duration","Bern: until 15 Nov. at the latest; 2025 return exceptionally until 30 Nov. 2026 (IT outage)."],["Responsible","Bern: cantonal tax administration. Zurich: municipal tax office. Geneva: Administration fiscale cantonale."]],"steps":["Have the letter about the tax return, your salary certificate (from your employer) and supporting documents ready.","Before the deadline, in BE-Login (with AGOV): “Fristverlängerung erfassen” (record extension), choose the new deadline and confirm.","Save the confirmation yourself: none is sent by post or e-mail.","Fill in the return in TaxMe-Online and submit it with supporting documents (or hand it in printed at your municipality of residence).","Too late? A reminder fee of CHF 60 is possible; once the reminder period has expired, no extension is possible any more."],"who":[1,1,1],"note":"The cantonal tax administration receives your return and also assesses the direct federal tax on behalf of the federal government (supervised by the FTA); the municipality sets its own tax rate.","src":["Canton of Bern: extending the deadline as a private individual","Canton of Bern: guidance, filing deadline","Canton of Zurich: tax return for private individuals","Canton of Geneva: request an extension"]},"ahv":{"intro":"A man born in 1962 who lives in Thun reaches the reference age of 65 in 2027 and claims his pension from the compensation office 3–4 months earlier. With a birthday on 15 March 2027, the pension starts on 1 April 2027; the claim is filed from about December 2026.","facts":[["Reference age","Men 65. Women: born 1961 = 64 y 3 m, 1962 = 64 y 6 m, 1963 = 64 y 9 m, from 1964 = 65. Pension from the following month."],["Deadline","Claim 3–4 months before the pension starts. Early drawing from 63 (–6.8 % for 1 year), deferral 1–5 years (+5.2 % to +31.5 %)."],["Pension","From 2027, with a full contribution period CHF 1,280 to 2,560 per month; couple at most CHF 3,840. Plus the 13th pension from December 2026."],["Responsible","The compensation office your employer is affiliated with (in the canton of Bern e.g. the Bern compensation office, AK Bern)."]],"steps":["Find out which compensation office is responsible: employees ask their employer, self-employed people the office they last settled with.","Fill in and submit form 318.370 “Claim for an old-age pension” online 3–4 months before the pension starts.","Early drawing: apply by the end of the previous month at the latest. Deferral: tick the box on the form no later than 1 year after the reference age.","Upload the enclosures with the form or send them by post; the compensation office obtains the documents needed and calculates the pension.","Paid monthly (AK Bern: 4th working day, e.g. 4 December 2026); the 13th pension in December comes without an application."],"who":[1,1,0],"note":"The federal government (FSIO) sets the rules and publishes the leaflets; the compensation office (in the canton of Bern, AK Bern) receives your claim, calculates and pays the pension.","src":["Bern compensation office: AHV/AVS old-age pension","ahv-iv.ch: Leaflet 3.01 Old-age pensions (as of 1.1.2026)","ch.ch: Retirement – from when?","FSIO: Stabilising the AHV (AHV 21)","Federal Council: AHV/IV pensions rise on 1.1.2027 (2.10.2026)"]},"alv":{"intro":"Register at the RAV (regional employment centre) in your region no later than the first day for which you want unemployment benefit, fastest online in Job-Room. Example in Thun: aged 30, monthly salary of 6,500 francs, no children, 14 months of contributions gives 70 %, at most 260 daily allowances and 10 waiting days.","facts":[["Deadline","Register with the RAV no later than the 1st day of unemployment, better still during the notice period."],["Amount","70 % of insured earnings. 80 % with children under 25, earnings up to 3,797 francs or a disability pension of 40 % or more."],["Duration","At least 12 months of contributions within 2 years. 260 daily allowances, more with a longer contribution period. Framework period: 2 years."],["Responsible","RAV (registration, counselling) and the unemployment fund you choose (payment)."]],"steps":["Register online: use the e-service for registering with the RAV in Job-Room, or go in person to the RAV in your region.","Look for work already during the notice period and document every application. Your RAV sets how many.","Choose an unemployment fund, submit the “application for unemployment benefit” and employer certificates (2 years).","First interview at the RAV (invitation within 15 days): bring your AHV/AVS or health insurance card, ID and proof of your job search efforts.","Submit the “information from the insured person” form every month. Daily allowances usually follow in the next month."],"who":[1,1,0],"note":"SECO supervises unemployment insurance; RAV, unemployment funds and cantonal offices carry it out; you register directly with the RAV.","src":["arbeit.swiss: registration","arbeit.swiss (SECO): FAQ on unemployment benefit","ch.ch: Unemployment in Switzerland","Fedlex: Unemployment Insurance Act (AVIG, SR 837.0), Art. 9, 17, 18, 22, 27"]},"kk":{"intro":"You can switch your basic health insurance for the end of the year if your insurer receives your cancellation by Monday, 30 November 2026. The new insurer must accept you without health questions. The 2027 premiums are already in the premium calculator on priminfo.admin.ch.","facts":[["Deadline","Your insurer must receive the cancellation by the last working day of November (2026: Monday, 30 November). Receipt counts, not the postmark. Recommended: send it by registered mail by mid-November."],["Franchise","Adults: CHF 300 or, optionally, 500, 1,000, 1,500, 2,000, 2,500, plus 10 % co-payment, at most CHF 700 a year. Children: no franchise, co-payment at most CHF 350."],["Changing franchise","Lower franchise: tell the insurer in writing by the last working day of November. Higher franchise: only from the start of a year; the law sets no deadline, Priminfo recommends telling the insurer by mid-December."],["Mid-year","Switching on 1 July is only possible with the standard CHF 300 franchise and free choice of provider, with notice by 31 March. With a restricted-choice model (e.g. family doctor or telemedicine) you can only switch at year-end."],["Caution","Unpaid premiums or cost shares reminded by 30 November: your notice only takes effect if you pay them, with default interest and debt-collection costs, by 31 December (Art. 64a KVG)."],["Responsible","Your current and your new insurer. The federal government (FOPH) approves the premiums."]],"steps":["Compare the 2027 premiums on priminfo.admin.ch: enter your place of residence, age, franchise and model (e.g. family doctor or telemedicine).","Choose the new insurer and apply for basic insurance. Every insurer must accept you, with no health questions, reservations or waiting periods.","Cancel your current basic insurance in writing, ideally by registered mail by mid-November.","Do not cancel supplementary insurance too quickly: for it, insurers may ask health questions and decline you. The notice period is in the policy terms, often three months to the end of the year. Your insurer may not cancel it just because you switch your basic insurance.","Wait for the new insurer’s confirmation: your old cover only ends once the new insurer has reported uninterrupted cover. If that report is late, the new insurer must cover the premium difference."],"who":[1,0,0],"note":"The law (KVG/LAMal) and premium approval are federal matters (FOPH). Cancellation and joining go directly through the insurers, no authority receives them.","src":["Priminfo (FOPH): FAQ, switching health insurer","Priminfo (FOPH): premium calculator 2027","Priminfo (FOPH): 2027 premiums by canton","Fedlex: KVG (SR 832.10), Art. 7 and 64a"]},"biz":{"intro":"If you go self-employed in Bern with a sole proprietorship, you first register as self-employed with the compensation office (AHV). The commercial register and VAT only become mandatory from CHF 100,000 turnover a year. You can do the registrations online on EasyGov.swiss, the federal portal.","facts":[["AHV","Register with the compensation office at your business location (Bern: AK Bern). Contribution 10 % of income, less below CHF 60,500; in 2026 at least CHF 530 a year."],["Commercial register","Mandatory from CHF 100,000 turnover in the last financial year, otherwise voluntary. Fee CHF 120. The business name must contain your surname."],["VAT","Mandatory from CHF 100,000 turnover a year, or as soon as that is foreseeable at the start. Register with the FTA within 30 days."],["Permit","Only needed for certain regulated activities. Check before you start."]],"steps":["Open an account on EasyGov.swiss, choose «sole proprietorship» and set the business name with your surname.","Register as self-employed with AK Bern, ideally in the first quarter: online or with form 318.146, with proof such as invoices, an income statement or advertising.","From CHF 100,000 annual turnover: entry in the Bern commercial register (CHF 120) and VAT registration with the FTA within 30 days.","Before you start, check whether your activity needs a permit."],"who":[1,1,0],"note":"The compensation office and the commercial register are cantonal (in Bern: AK Bern and the commercial register office of the canton of Bern), VAT is levied by the federal government (FTA). EasyGov.swiss is the federal online counter for all three.","src":["SME portal (SECO): sole proprietorship","Bern commercial register: leaflet on registering a sole proprietorship","Compensation office of the canton of Bern: self-employed","ahv-iv.ch: leaflet 2.02, contributions of the self-employed","FTA: VAT liability","EasyGov.swiss: found a sole proprietorship"]},"drv":{"intro":"If you live in Switzerland, you can drive on a foreign licence for 12 months only. In the canton of Bern you exchange it at the road traffic office (SVSA). A German licence, issued in the EU, needs no test drive; the exchange costs CHF 120.","facts":[["Deadline","12 months from entry as stated in your residence permit (Art. 42 VZV). Apply before then so you can keep driving without a break. Exchanging later is still possible, but you may be fined."],["Test drive","None for licences from the EU/EFTA and from Andorra, Australia, Israel, Japan, Canada, South Korea, Morocco, Monaco, New Zealand, San Marino, Singapore, Taiwan, Tunisia and the USA. Everyone else takes a test drive."],["Costs","Bern: exchange CHF 120, test drive category B CHF 132."],["Responsible","Road Traffic and Navigation Office of the canton of Bern (SVSA), Schermenweg 5, Bern."]],"steps":["Have an eyesight test done by a recognised optician or eye doctor.","Fill in and sign the SVSA application form and attach a recent colour passport photo (35 × 45 mm).","Hand in the application in person: at an SVSA office, your municipality’s residents’ office or a police station in the canton of Bern. Bring your original foreign licence and your passport or ID card.","Take the test drive if required. Your Swiss licence arrives by post."],"who":[1,1,0],"note":"The federal government (FEDRO) sets the rules for the exchange in the traffic licensing ordinance; the cantonal road traffic office (in Bern the SVSA) checks the application and issues the licence.","src":["Canton of Bern (SVSA): exchanging a foreign licence","Canton of Bern (SVSA): fees","ch.ch: exchanging your driving licence","FEDRO: exchanging foreign driving licences"]},"wed":{"intro":"If you are both Swiss and live in Zurich, you first book the venue and date online with the civil registry office of the City of Zurich, at the earliest 12 months ahead. You do the marriage preparation together at the counter in the Stadthaus, at the latest 1 month before the wedding.","facts":[["Requirements","Both at least 18 and capable of judgement. Relatives in direct line, siblings and half-siblings may not marry each other."],["Deadline","Invitation to the marriage preparation at the earliest 3 months before the wedding. Complete it at the latest 1 month before, or the booking is cancelled."],["Costs","Zurich: cheapest wedding at the Stadthaus from CHF 255, including marriage preparation without translation (only if you live in the City of Zurich)."],["Witnesses","Two adult witnesses capable of judgement must be present."]],"steps":["Book the venue and date on the website of the Zurich civil registry office, at the earliest 12 months ahead.","At the earliest 3 months before the wedding you get an email invitation. Use it to choose an appointment for the marriage preparation online.","Come together to the counter in the Stadthaus with your passport or ID card. You fill in and sign the form and decide which surnames you and any children will have.","Pay the fees on site by card or Twint. Bring two witnesses to the wedding."],"who":[1,0,1],"note":"The federal government sets the rules on marriage (Civil Code) and the fees; in Zurich the city’s civil registry office handles the preparation and the wedding.","src":["City of Zurich: marrying with residence in Zurich","City of Zurich: marriage preparation","City of Zurich: questions and answers on marriage","ch.ch: getting married in Switzerland"]},"dog":{"intro":"In the City of Bern you register your dog with the residents’ services, using the dog registration form. If you took the dog over from someone, you report the change of owner to the AMICUS database within 10 days. The dog tax is CHF 150 a year.","facts":[["Registration","With the residents’ services of the City of Bern (Einwohnerdienste), Predigergasse 5, 3011 Bern. The municipality registers you as the owner in AMICUS."],["Deadline","Report a change of owner (purchase, takeover, handing over for more than 3 months) to AMICUS within 10 days. Imported dogs: have a vet check and report the microchip within 10 days."],["Costs","City of Bern: CHF 150 per dog and year, for dogs from 6 months. The bill arrives automatically in August."],["Microchip","Mandatory for every dog; puppies within 3 months. Only vets implant the chip and register the dog with AMICUS."]],"steps":["Fill in the City of Bern dog registration form and post it to the residents’ services.","If the dog already has a chip: report the change of owner to AMICUS within 10 days. If not: have it chipped by a vet.","Pay the dog tax when the bill arrives in August.","If you move, give the dog away or it dies: inform the municipality and AMICUS."],"who":[1,0,1],"note":"The federal government requires the microchip and registration in AMICUS (Animal Diseases Ordinance); the municipality takes the registration and levies the dog tax.","src":["City of Bern: dogs","City of Bern: dog registration form","AMICUS: good to know (leaflet)","ch.ch: dog tax"]},"fam":{"intro":"If you are employed in the canton of Bern, you apply for family allowances through your employer. They pass the application to their family compensation fund. The child allowance is CHF 250 a month per child (as of 2026).","facts":[["Amount","Canton of Bern, as of 2026: child allowance CHF 250 a month up to the month of the 16th birthday. Training allowance CHF 310 for children in education, from 15 at the earliest, until 25 at the latest."],["Application","Employees: through the employer. People without gainful employment: with the cantonal compensation office (AK Bern)."],["Deadline","No fixed deadline; allowances you missed can be claimed up to 5 years back."],["Per child","Only one allowance per child, even if both parents work."]],"steps":["Ask your employer for the family allowance application form.","Fill in and sign the form with the details of the child and the other parent.","Your employer passes the application to their family compensation fund and pays out the allowance.","If both parents work: agree first who applies, as there is only one allowance per child."],"who":[1,1,0],"note":"The federal government sets the minimum amounts (Family Allowances Act), the canton of Bern pays 115 % of them; payment runs through the roughly 50 family compensation funds in the canton.","src":["Bern family portal: child and training allowances","ch.ch: family allowances","ahv-iv.ch: leaflet 6.08 family allowances","Compensation office of the canton of Bern: family allowances"]},"debt":{"intro":"In the canton of Bern you order the debt enforcement register extract online from the cantonal debt enforcement and bankruptcy office (be.ch/baka). It costs CHF 18 including delivery and comes electronically as a download.","facts":[["Costs","Canton of Bern online: CHF 18 including delivery (fee CHF 17 per extract)."],["Content","Debt enforcement proceedings of the last 5 years in that district."],["Moving","If you lived elsewhere in the last 5 years, order an extract there too, or those proceedings are missing."],["Delivery","Online orders are fully electronic: download from a secure platform, possible several times."]],"steps":["Order your own debt enforcement register extract online at be.ch/baka.","Have a valid ID ready: ID card, passport or foreign national ID card.","Pay the fee when ordering: card, PostFinance Pay or Twint.","Download the extract from the secure platform and pass it on, for example to your landlord."],"who":[1,1,0],"note":"The federal government sets the debt enforcement law (SchKG) and the fees; in the canton of Bern the cantonal debt enforcement and bankruptcy office (BAKA) keeps the registers.","src":["Canton of Bern (BAKA): ordering a debt enforcement extract","ch.ch: ordering a debt enforcement register extract","Canton of Bern: online ordering of the extract (press release)"]},"crim":{"intro":"You order the criminal record extract (private extract) from the federal government, online at strafregister.admin.ch or at a post office counter. It costs CHF 17 and arrives by post about 10 working days after your signed form is received.","facts":[["Costs","CHF 17 for the private extract. Certification or apostille: CHF 20 extra."],["Duration","About 10 working days after your signed form is received."],["Ordering","Online at strafregister.admin.ch or in person at a post office counter with valid ID."],["Special extract","For work with minors there is a separate extract, the special private extract."]],"steps":["On strafregister.admin.ch choose the private extract and enter your personal details, address and payment details.","Pay the fee online: debit or credit card, PostFinance Card or Twint.","Print the form, sign it and post it with a copy of your ID.","Alternatively: order at a post office counter with your passport, ID card or foreign national ID card and pay on the spot."],"who":[1,0,0],"note":"The criminal record is kept by the federal government (Federal Office of Justice). You order directly from the federal government or at a post office counter.","src":["Federal Office of Justice: ordering the private extract","Federal Office of Justice: FAQ private extract","ch.ch: criminal record extract"]},"car":{"intro":"In the canton of Bern you register the car with the road traffic office (SVSA), by post or at the counter. First your insurer sends the proof of insurance to the office electronically. The vehicle registration document costs CHF 45 by post or CHF 55 at the counter.","facts":[["Documents","Proof of insurance (sent electronically by your insurer to the office), the previous owner’s vehicle registration document, inspection report if the car was inspected, ID."],["Costs","Registration document: CHF 45 by post, CHF 55 at the counter. New number plates: CHF 45 a pair, CHF 30 for one."],["Deadline","The proof of insurance is valid for 30 days. The motor vehicle tax is due within 30 days of the bill."],["Tax","Annual motor vehicle tax, billed in January or on registration. The SVSA calculator shows the amount."]],"steps":["Take out third-party liability insurance. The insurer sends the proof of insurance to the SVSA electronically.","Fill in the vehicle registration application form.","Post the form with the previous owner’s registration document, any inspection report and your ID to SVSA, Schermenweg 5, 3001 Bern, or hand it in at the counter.","By post it takes a few working days for the new registration document to arrive. Then pay the motor vehicle tax bill within 30 days."],"who":[1,1,0],"note":"The federal government sets the rules for vehicle registration; the cantonal road traffic office (in Bern the SVSA) issues the registration document and number plates and levies the motor vehicle tax.","src":["Canton of Bern (SVSA): registering a vehicle","Canton of Bern (SVSA): how to register your vehicle","Canton of Bern (SVSA): documents for registration","Canton of Bern (SVSA): calculating vehicle tax","ch.ch: registering a vehicle"]},"nat":{"intro":"You meet the residence conditions: 10 years in Switzerland, a C permit and at least 2 years in the canton and the municipality. Language proof, the naturalisation test and integration come on top. You apply to the City of Bern; for a single person, municipality, canton and federal government cost CHF 1,650 together.","facts":[["Requirements","C permit, 10 years in Switzerland in total, at least 2 uninterrupted years each in the canton of Bern and the municipality, successful integration."],["Language","Canton of Bern: spoken B1, written A2. No proof needed if the official language is your mother tongue or you attended at least 5 years of compulsory school in that language."],["Test","Written, 90 minutes: geography, history, democracy, health and work, rights and duties. Exempt, among others: anyone who attended at least 5 years of compulsory school in Switzerland."],["Costs","Single person in the City of Bern: municipality CHF 400, canton CHF 1,150, federal government CHF 100. Married couple: 600, 1,725 and 150."]],"steps":["Contact your municipality (City of Bern). It gives you the forms and tells you which documents you need.","Get your language certificate (spoken B1, written A2) unless you are exempt.","Hand in the complete application to the municipality and take the naturalisation test unless you are exempt.","The municipality bills you for the municipal and cantonal fees; the federal government (SEM) decides on the federal naturalisation permit."],"who":[1,1,1],"note":"Naturalisation means acquiring three citizenships: municipality, canton and federal government each check their part. The application runs through your municipality, the State Secretariat for Migration (SEM) grants the federal permit.","src":["Canton of Bern: residence in Switzerland (naturalisation)","Canton of Bern: language skills and proof","Canton of Bern: naturalisation test","Canton of Bern: naturalisation fees","SEM: ordinary naturalisation"]},"pv":{"intro":"In the canton of Bern, the canton usually checks your entitlement to a premium reduction automatically, based on your final tax data from the two previous years. In 2026 the limit is CHF 35,000 of relevant income, or CHF 45,000 for families with children. You only apply in special cases.","facts":[["Limit 2026","Relevant income at most CHF 35,000; families with children at most CHF 45,000."],["Check","Automatic, based on final tax data from the two previous years (net income and assets)."],["Application","Only in special cases, for example if no automatic check is possible or your income or family changes significantly and permanently. Also possible online."],["Calculator","Non-binding estimate with the online calculator at be.ch/pvo-onlinerechner."]],"steps":["Use the online calculator at be.ch/pvo-onlinerechner to see whether you may be entitled.","File your tax return: the automatic check needs final tax data.","If your income or family has changed significantly and permanently: apply, also possible online.","If you are entitled, the canton pays the reduction directly to your health insurer and your premium bill goes down."],"who":[1,1,0],"note":"The federal government requires premium reductions in the Health Insurance Act and contributes to them; in the canton of Bern the Social Insurance Office (ASV) checks and decides.","src":["Canton of Bern (ASV): entitlement to premium reduction","Canton of Bern (ASV): when you need to apply","Canton of Bern (ASV): information sheet premium reduction 2026","Canton of Bern (ASV): calculating entitlement"]},"wpe":{"intro":"Yes. Anyone who does not do, or does not complete, military or civilian service pays the military service exemption tax: 3 % of taxable income for direct federal tax, at least CHF 400 a year. In the canton of Bern the Office for Civil Protection, Sport and Military Affairs (BSM) is responsible.","facts":[["Amount","3 % of taxable income for direct federal tax, at least CHF 400 a year."],["Duration","From age 19 to 37, at most 11 years of tax."],["Civil protection","Doing civil protection service does not exempt you, but you pay 4 % less for each day of service done that year."],["Refund","If you make up your military or civilian service and complete your service obligation, you get the tax back. The claim expires 5 years after your service obligation ends."]],"steps":["File your tax return as usual: the tax is based on your taxable income for direct federal tax.","The bill comes from the cantonal office, in the canton of Bern from the BSM.","With a significant disability and low income: have an exemption checked.","Service made up: once your service obligation is complete, apply to the BSM for a refund."],"who":[1,1,0],"note":"The exemption tax is a federal levy (FTA); the cantons, in Bern the Office for Civil Protection, Sport and Military Affairs, assess and collect it.","src":["FTA: the military service exemption tax explained","Canton of Bern (BSM): exemption tax","Canton of Bern (BSM): refund","ch.ch: military service exemption tax"]},"bau":{"intro":"Not necessarily. In the canton of Bern a garden shed needs no building permit if it has at most 10 m² of floor area and is at most 2.5 m high, is unheated, is neither lived in nor used commercially and belongs to a main building. If it is bigger, you submit a building application via eBau.","facts":[["Permit-free","Unheated small building up to 10 m² floor area and 2.5 m high, not lived in, not commercial, linked to a main building (Art. 6 of the building permit decree)."],["Still applies","Even without a permit, rules apply, for example distances, fire safety and energy rules."],["Exception","Outside the building zone even a small building needs a permit if it significantly changes the surroundings, burdens access or harms the environment."],["Application","Since March 2022 only electronically via eBau throughout the canton of Bern."]],"steps":["Check the size: at most 10 m² floor area, 2.5 m high, unheated, for storage only.","Keep the distances to the boundary and follow fire safety and energy rules.","If in doubt, ask the City of Bern building inspectorate; it also answers preliminary enquiries.","If the shed is bigger or a condition is not met: submit the building application electronically via eBau."],"who":[0,1,1],"note":"The canton sets which buildings are permit-free in its building permit decree; in the City of Bern the building inspectorate gives advice and reviews applications.","src":["Canton of Bern: building permit decree (BSG 725.1), Art. 6","City of Bern: when do you need a building permit?","City of Bern: building permit procedure"]},"lost":{"intro":"Report the loss in person: at a police station or directly at your appointment at the ID centre when you order the new document. Reporting the loss costs CHF 40 in the canton of Bern. After that the old document is invalid, even if you find it again.","facts":[["Report","In person at a police station or at the ID centre during the appointment for your new document."],["Costs","Loss report in the canton of Bern: CHF 40. Plus the new document at the normal price, for example adult ID card CHF 70."],["Validity","Reporting the loss makes the document invalid. If you find it, you may no longer use it and must hand it in at the passport office."],["New document","Like any document: apply online at schweizerpass.ch, then book an appointment at the ID centre."]],"steps":["Report the loss in person: at a police station (you get a loss report) or directly at your appointment at the ID centre.","Apply for the new document online at schweizerpass.ch and book an appointment at a Bern ID centre.","Bring the police loss report to the appointment if you reported the loss there.","If the old document turns up: do not use it and hand it in at the passport office."],"who":[1,1,0],"note":"The federal government (fedpol) is responsible for ID documents; losses are reported to the police or the cantonal ID centres, in the canton of Bern also to the seven ID centres.","src":["Canton of Bern: loss of ID card or passport","ch.ch: passport or ID card lost or stolen","fedpol: loss of identity documents"]},"kita":{"intro":"In the City of Bern you get childcare vouchers for an approved daycare centre if you work at least 105 % together (single parents 5 %) and your relevant family income is below CHF 170,000. You apply online via kiBon; the voucher applies from the month after your complete application.","facts":[["Requirements","Residence in the City of Bern, daycare centre or childminder organisation approved in the cantonal voucher system, child from 3 months until the end of kindergarten."],["Work rate","Both parents together at least 105 %, single parents at least 5 %."],["Income","Voucher period 1 August 2026 to 31 July 2027: relevant family income below CHF 170,000."],["Start","The voucher only applies from the month after your complete application is received, not retroactively."]],"steps":["Estimate the voucher amount with the City of Bern voucher calculator.","Choose a daycare centre approved in the cantonal voucher system.","Apply online via kiBon (or on paper), with proof of your work rate such as an employment contract or timesheet.","Apply early and completely, as the voucher only applies from the following month."],"who":[0,1,1],"note":"The canton of Bern sets the voucher system and runs kiBon; the City of Bern reviews applications, issues the vouchers and pays its own supplement.","src":["City of Bern: childcare vouchers","City of Bern: FAQ on childcare vouchers","City of Bern: voucher calculator","Canton of Bern (GSI): childcare vouchers"]},"soz":{"intro":"In the City of Bern you register in person at the social services office, Schwarztorstrasse 71, with an official ID. There you get a personal checklist of the documents you need. The City of Bern social assistance calculator gives a first estimate of whether you may be entitled.","facts":[["Registration","In person at the City of Bern social services, Schwarztorstrasse 71, with official ID. Newcomers not yet registered with the residents’ office bring a copy of their tenancy agreement."],["Documents","The application form lists the usual documents; at the counter you get a personal checklist and a power of attorney form."],["Amount","Based on the SKOS guidelines, graded by household size. The City of Bern social assistance calculator gives a first estimate."],["Repayment","Social assistance may have to be repaid later if the conditions for repayment are met."]],"steps":["Use the City of Bern social assistance calculator to see whether you may be entitled.","Register in person at social services, Schwarztorstrasse 71, with ID (newcomers: copy of the tenancy agreement).","Fill in the application form and hand in the documents on your checklist.","Sign the power of attorney and hand it in with the application."],"who":[0,1,1],"note":"The canton of Bern regulates social assistance and follows the SKOS guidelines; your application is handled by the social services of your municipality, in Bern the city’s social services.","src":["City of Bern: registering for social assistance","City of Bern: who can apply for social assistance?","City of Bern: social assistance calculator","City of Bern: social assistance and social services"]},"el":{"intro":"Yes, if your pension and other income do not cover your living costs and your net assets are below CHF 100,000 (married couples CHF 200,000). In the canton of Bern you hand in the registration form at the AHV branch office of your municipality; the compensation office of the canton of Bern decides.","facts":[["Assets","Net assets below CHF 100,000 for single people, below CHF 200,000 for married couples."],["Living costs","Recognised from 2027 (living at home): CHF 21,000 a year for single people, CHF 31,500 for married couples."],["Registration","Hand in the official registration form at the AHV branch office of your municipality."],["Responsible","The compensation office of the canton of Bern reviews the application and decides."]],"steps":["Download and fill in the supplementary benefits registration form from the compensation office of the canton of Bern.","Attach the documents the form asks for.","Hand in the form at the AHV branch office of your municipality (here Thun).","The compensation office checks income and assets and sends you its decision."],"who":[1,1,1],"note":"The federal government regulates supplementary benefits and sets the amounts; the compensation office of the canton of Bern decides, and the municipal AHV branch office takes the registration.","src":["Compensation office of the canton of Bern: supplementary benefits","ahv-iv.ch: leaflet 5.01 supplementary benefits","Compensation office of the canton of Bern: EL registration form","Federal Council: adjustments as of 1.1.2027 (2.10.2026)"]},"iv":{"intro":"Register with the IV office of the canton of Bern, and do it early: a disability pension starts at the earliest 6 months after you register. First, though, the IV checks whether measures can help you stay in work (integration before pension).","facts":[["Early detection","After 30 days of incapacity for work or frequent short absences, the IV office can be notified, for example by your employer. It then clarifies whether you need to register."],["Pension","At the earliest 6 months after registering. Condition: on average at least 40 % unable to work for one year, and at least 40 % unable to earn afterwards."],["Priority","Integration before pension: the IV first looks at measures that keep or improve your earning capacity."],["Process","After you register, the IV office invites you to a first interview and gathers information about your health."]],"steps":["Fill in the IV registration form.","Hand in the registration to the IV office of the canton of Bern, not too late, as the pension starts 6 months later at the earliest.","Attend the first interview. The IV gathers the information it needs about your health.","Take part in integration measures. The IV only decides on a pension if these are not enough."],"who":[1,1,0],"note":"Disability insurance is a federal insurance (FSIO); it is run by the cantonal IV offices, in Bern by the IV office of the canton of Bern.","src":["IV office canton of Bern: registration and procedure","IV office canton of Bern: early detection and integration","ahv-iv.ch: leaflet 4.04 disability pensions","ch.ch: disability insurance"]},"mse":{"intro":"If you were in paid work before the birth, you receive maternity benefit for 14 weeks: 80 % of your average earnings, at most CHF 220 a day. You apply to the AHV compensation office.","facts":[["Eligibility","Insured under AHV for the 9 months before the birth and in paid work for at least 5 of those months. At the birth, employed, self-employed or unemployed."],["Amount","80 % of average earnings before the birth, at most CHF 220 a day. Employees reach the maximum from a monthly salary of CHF 8,250."],["Duration","98 days (14 weeks) from the birth. If you go back to paid work earlier, the entitlement ends. If the baby stays in hospital for at least 2 weeks right after the birth, it is extended by up to 56 days."],["Deadline","You can claim up to 5 years after the end of maternity leave."]],"steps":["Fill in the form “Application for maternity benefit” (318.750).","If you are employed: your employer confirms how long you were employed and your salary.","Hand in the application to the responsible AHV compensation office, the one that last received your contributions."],"who":[1,0,0],"note":"Maternity benefit is part of the federal income compensation scheme (EO, FSIO). It is paid out by the AHV compensation offices.","src":["FSIO: income compensation for maternity","ahv-iv.ch: leaflet 6.02 maternity benefit","FSIO: when am I entitled?","ch.ch: maternity leave"]},"pat":{"intro":"As the father (or the mother’s wife) you are entitled to 2 weeks of paid leave, to be taken within 6 months of the birth. The allowance is 80 % of your earnings, at most CHF 220 a day. It is not paid automatically: you have to apply.","facts":[["Eligibility","The child’s legal father or the mother’s wife. Insured under AHV for the 9 months before the birth and in paid work for at least 5 of those months."],["Duration","2 weeks (10 working days), in one block or as single days. To be taken within 6 months of the birth; days not taken by then are lost."],["Amount","80 % of average earnings before the birth, at most CHF 220 a day. For 2 weeks you get 14 daily allowances, so at most CHF 3,080."],["Application","Form “Application for the other parent’s allowance” (318.747) to the responsible AHV compensation office. For employees, the employer usually submits it."]],"steps":["Plan the leave with your employer and take it within 6 months of the birth.","Fill in form 318.747.","Employed: give the form to your employer, who submits it to their compensation office. Self-employed: submit it directly to your compensation office."],"who":[1,0,0],"note":"The other parent’s allowance is part of the federal income compensation scheme (EO, FSIO). It is paid out by the AHV compensation offices.","src":["FSIO: income compensation for paternity","ahv-iv.ch: leaflet 6.04 other parent’s allowance","FSIO: when am I entitled?","ch.ch: paternity leave"]},"lfa":{"intro":"You can get a learner’s permit for cars (category B) from age 17. In the canton of Bern you hand in the application in person with an eye test, first aid certificate and passport photo. Once you pass the basic theory test, you receive the learner’s permit.","facts":[["Age","Category B from 17. The basic theory test can be taken at the earliest one month before the minimum age."],["Requirements","First aid course (certificate valid 6 years), eye test at a recognised optician or ophthalmologist (valid 2 years), passport photo."],["Costs","Canton of Bern: application CHF 30, issuing the learner’s permit CHF 20, basic theory test CHF 30."],["Learning phase","The category B learner’s permit is valid for 24 months. If you get it before your 20th birthday, you must hold it for at least 12 months before the practical test."]],"steps":["Take the first aid course and the eye test.","Fill in the application form and hand it in in person with photo, original ID and first aid certificate: at a road traffic office (SVSA) site, a police station or the municipal administration.","Book a date for the basic theory test using the reference number in the admission letter.","After passing, you receive the learner’s permit (also available as an e-learner’s permit on your phone)."],"who":[1,1,0],"note":"The rules (minimum age, learning phase) are set by the Confederation (FEDRO). Application, test and permit go through the cantonal road traffic office, in Bern the SVSA.","src":["SVSA Bern: apply for a learner’s permit","SVSA Bern: fees","SVSA Bern: information for learner drivers","FEDRO: questions and answers on driver training"]},"wsb":{"intro":"In the city of Bern you order a certificate of residence online or collect it at the residents’ services counter. It costs CHF 20.","facts":[["Cost","CHF 20, the same for Swiss, EU/EFTA and third-country nationals. Online you pay at the end of the order (Mastercard, Visa, PostFinance)."],["What for","For example for grants, insurance or naturalisation."],["Counter","Einwohnerdienste, Migration und Fremdenpolizei, Predigergasse 5, 3011 Bern. Monday to Friday 10:00 to 16:00, Thursday until 18:00."]],"steps":["Fill in the city of Bern’s online form “Bestellung Wohnsitzbescheinigung”.","Pay online at the end.","Or without ordering online: collect it at the residents’ services counter, Predigergasse 5."],"who":[0,0,1],"note":"Certificates of residence are issued by the municipality you live in, in the city of Bern by the Einwohnerdienste, Migration und Fremdenpolizei.","src":["City of Bern: certificate of residence","City of Bern: online order","City of Bern: residents’ services contact"]},"tod":{"intro":"A death must be reported to the civil registry office within 2 days. If the person dies at home, first call a doctor for the medical death certificate. In the city of Bern you also report the death to the burial office, yourself or through a funeral home.","facts":[["Deadline","Within 2 days, to the civil registry office of the place of death."],["Hospital or care home","If the person dies in a hospital or care home, the institution reports the death to the civil registry office."],["Documents","Passport or ID of the person reporting, medical death certificate, and if available the family booklet or family certificate."],["Free burial","City of Bern: for residents who leave too little to cover it (as a rule under CHF 8,000), the city pays for a simple burial. Relatives apply at the same time as they report the death."]],"steps":["Death at home: call a doctor and ask for the medical death certificate.","Report the death within 2 days to the civil registry office of the place of death (in a hospital or care home, the institution does this).","Report the death to the city of Bern’s burial office, yourself or through a funeral home. The office arranges cremation or burial.","Handle the remaining steps (employer, insurance, banks, estate) with the ch.ch checklist."],"who":[0,1,1],"note":"Registering the death is done by the cantonal civil registry office. Burials and cemeteries are a municipal matter, in the city of Bern the burial office (Predigergasse 5).","src":["Canton of Bern: death (civil registry)","City of Bern: reporting a death","City of Bern: free burial","ch.ch: checklist after a death"]},"pk":{"intro":"In the city of Bern you apply for a resident parking permit online. It is valid in your zone and, according to the city, costs CHF 264 a year (CHF 22 a month).","facts":[["Requirements","You are registered in the zone as a resident or weekly resident and are listed first, with name and address, in the vehicle registration document. Permits are issued for light motor vehicles, as a rule passenger cars."],["Cost","CHF 264 a year, CHF 22 a month."],["Validity","One year from the month of issue, at least 3 months. If you return the permit early, the fee for full unused months is refunded (not for the 3-month minimum)."],["Zone","The permit is only valid in the approved zone."]],"steps":["Check whether your address is in a parking permit zone.","Fill in the city of Bern’s online form “Anwohnerparkkarte”.","Pay the fee electronically. The permit is sent by post."],"who":[0,0,1],"note":"Parking permits are a municipal matter, in the city of Bern handled by the local and trade police (police inspectorate).","src":["City of Bern: neighbourhood parking permits","City of Bern: online form","City of Bern: parking permits online"]},"spg":{"intro":"In the city of Bern there are three ways: put small bulky items out with a sticker on rubbish collection day, take larger items to a recycling centre, or have them picked up by the collection service (CHF 70.27 flat rate).","facts":[["Small bulky items","Combustible items up to 100 × 50 × 50 cm and 25 kg (e.g. brooms, small furniture, rugs): with a sticker, next to the fee bags on collection day. 10 stickers cost CHF 44.10."],["Recycling centres","Fellerstrasse 13a and Schermen (Wölflistrasse 17). Monday to Friday 8:00–12:00 and 13:00–18:30, Saturday 8:00–15:00."],["Collection service","CHF 70.27 flat rate, including 5 minutes of loading; each additional 5 minutes CHF 54.05. You do not need to be there."],["Booking","By 11:30 on the working day before collection; for Monday, by Friday 11:30. Collection on Monday, Tuesday, Thursday and Friday."]],"steps":["Check the size: up to 100 × 50 × 50 cm and 25 kg counts as a small bulky item.","Small bulky item: buy a sticker and put it next to the fee bags on collection day.","Larger item: take it to the Fellerstrasse or Schermen recycling centre, or book the collection service by 11:30 on the working day before."],"who":[0,0,1],"note":"Waste disposal is a municipal matter, in the city of Bern handled by Entsorgung + Recycling Stadt Bern (ERB).","src":["City of Bern: bulky waste","City of Bern: bulky waste collection","City of Bern: small bulky items","City of Bern: recycling centres"]},"fund":{"intro":"If you lost something in the city of Bern, report it online to the lost property office; it contacts you as soon as the item comes in. Found something? Take it to the office at Theatergässchen 2.","facts":[["Reporting a loss","Online for losses within the city. Umbrellas, clothing (except jackets) and books cannot be reported online; contact the office directly (031 321 50 50)."],["Collecting","The office hands over the item if your description and the circumstances of the loss match what the finder reported. Items are kept for one year."],["Finder’s reward","As a rule 10 % of the value, reduced appropriately for high-value items. No reward for items found in a home, stolen goods or items found in shops."],["Office","Theatergässchen 2, 3011 Bern. Monday to Friday 10:00 to 16:00, Thursday until 18:00."]],"steps":["Loss: file an online loss report with the city of Bern’s lost property office.","When the office contacts you, collect the item at Theatergässchen 2.","Found item: take it to the office. If nobody claims it within a year, you can have it for a storage fee of about 5 % of its estimated value."],"who":[0,0,1],"note":"Lost property is a municipal matter, in the city of Bern handled by the lost property office (police inspectorate). The rules on finds and rewards are in the Civil Code.","src":["City of Bern: lost property office","City of Bern: contact","City of Bern: lost property ordinance","ch.ch: lost property"]},"bet":{"intro":"If someone does not pay an invoice, you file a debt collection request with the debt enforcement office where the debtor lives. You advance the costs; if the debt collection is justified, the other party bears them later. In the canton of Bern these are the debt enforcement offices (BAKA).","facts":[["Where","The debt enforcement office at the debtor’s place of residence. You can fill in the request online via the debt enforcement counter."],["Costs","As creditor you advance the costs of each stage. The fees are the same throughout Switzerland and depend on the amount claimed."],["Payment order","The office serves a payment order on the other party. They have 20 days to pay and 10 days to file an objection."],["Objection","If the other party objects, a court decides, at your request, whether the debt collection can continue."]],"steps":["Fill in the debt collection request (online at the debt enforcement counter or with the federal model form).","Submit it to the debt enforcement office where the other party lives and pay the advance on costs.","No payment and no objection: file a request to continue. If there is an objection: ask the court to set it aside."],"who":[1,1,0],"note":"Debt enforcement law (DEBA) and the fees are set by the Confederation. Debt collection is carried out by the debt enforcement offices, in the canton of Bern by the debt enforcement and bankruptcy offices (BAKA).","src":["ch.ch: debt enforcement","Canton of Bern: debt enforcement and bankruptcy offices","Federal Office of Justice: DEBA model forms"]},"abm":{"intro":"In the canton of Bern, deregistering is free: you send the original vehicle registration document marked “annullieren” (cancel) to the road traffic office (SVSA). If you don’t register another vehicle within 14 days, also return the number plates.","facts":[["Cost","Deregistering is free. Having the plates stored for a year costs CHF 30; in return there is no fee for re-registering."],["Plates","Since 1 March 2025 you must say when returning them whether the SVSA should store or dispose of the plates. Without instructions they are disposed of."],["Tax and insurance","While the plates are deposited, you pay no liability insurance and no vehicle tax. Overpaid tax is offset and any credit refunded; what counts is the day the plates reach the SVSA."],["Address","SVSA Verkehrszulassung, Schermenweg 5, Postfach, 3001 Bern."]],"steps":["Write “annullieren” on the original vehicle registration document.","Post it to the SVSA. If you don’t register a new vehicle within 14 days: enclose the plates or drop them in a plate return box at an SVSA site.","State whether the plates should be stored (CHF 30, one year) or disposed of."],"who":[1,1,0],"note":"The rules on vehicle registration are set by the Confederation. Deregistration, plates and vehicle tax go through the cantonal road traffic office, in Bern the SVSA.","src":["SVSA Bern: deregister a vehicle","SVSA Bern: deposit number plates","SVSA Bern: storing number plates","ch.ch: registering and deregistering a vehicle"]},"wa":{"intro":"If you live in the city of Bern during the week and regularly spend your days off in another municipality, register as a weekly resident within 14 days, most easily online.","facts":[["Who","Anyone who stays overnight at their place of work, training or study and regularly spends their days off (usually the weekend) in another municipality."],["Deadline","Within 14 days of arriving, with the city of Bern’s residents’ services."],["Certificate","Registration comes with a certificate of residence elsewhere from your home municipality. Because of a change in the law these will no longer be issued; if your municipality no longer issues one, you can leave it out."],["Tax","For single people it is presumed that their centre of life is at the weekly residence. You can rebut this if you regularly go back on your days off and have particularly close family and social ties there."]],"steps":["Ask your home municipality for a certificate (if it still issues one).","Fill in the city of Bern’s online form “Zuzug Wochenaufenthalt” and pay any fees online.","If your weekly residence continues, extend it with the form “Verlängerung Wochenaufenthalt”."],"who":[0,0,1],"note":"Registration and the register are a municipal matter, in the city of Bern the Einwohnerdienste, Migration und Fremdenpolizei. Tax questions are decided by the tax administration.","src":["City of Bern: weekly residence","City of Bern: online arrival form","City of Bern: extension","City of Bern: arriving, moving and leaving"]},"kir":{"intro":"In the canton of Bern you leave a national church with a personally signed letter to your parish. Church tax liability ends when you leave; for the current year you pay pro rata.","facts":[["Form","In writing, by letter with your handwritten signature. An e-mail is not enough. Content: a clear statement that you are leaving, name, address and date of birth."],["Address","To the parish council of your parish or the office it has designated (e.g. for Catholics in the city of Bern: Röm.-kath. Gesamtkirchgemeinde Bern, Frohbergweg 4, 3012 Bern)."],["Effective","From the day you hand the declaration to the responsible office, Swiss Post or a Swiss representation abroad."],["Church tax","Church tax liability ends with the legally valid declaration. If you leave during the year, church tax is charged pro rata."]],"steps":["Write the letter: that you are leaving, name, address, date of birth, handwritten signature.","Post it to your parish council.","In your next tax return, church tax is no longer charged from the date you left."],"who":[0,1,0],"note":"The rules on leaving and on church tax are set by the canton of Bern. The parish receives the declaration.","src":["Canton of Bern: ordinance on membership of a national church","Canton of Bern TaxInfo: church tax","Catholic Church Bern region: joining and leaving"]},"dieb":{"intro":"In the canton of Bern you report a stolen bike online around the clock via Suisse ePolice. Have the make, model, colour and frame number ready. You can also report the theft at a police station.","facts":[["Online","Via Suisse ePolice, around the clock. Possible for stolen bicycles, mopeds, skis, snowboards, electronic devices and number plates."],["Details","Make, model, colour and frame number. The cantonal police recommend noting these down in advance and keeping them safe."],["Search","Reported stolen bikes are passed on to national and international search systems."],["Police station","Alternatively, report it at a police station. Bring: official photo ID and the relevant documents."]],"steps":["Find the frame number, make, model and colour (e.g. on the purchase receipt).","Report the theft online via Suisse ePolice.","Or report it at a Bern cantonal police station, with official ID."],"who":[0,1,0],"note":"Reports are taken by the cantonal police. Suisse ePolice is the joint online police station of several cantons.","src":["Bern cantonal police: online reports","Bern cantonal police: theft and robbery","Suisse ePolice","ch.ch: reporting a crime"]},"vor":{"intro":"An advance care mandate (Vorsorgeauftrag) is written by hand or notarised. In the canton of Bern you can have the civil registry office record where it is kept; this costs CHF 75. That way the child and adult protection authority (KESB) can find it when needed.","facts":[["Form","Written entirely by hand, dated and signed (like a will) or executed as a public deed by a notary."],["Where it is kept","The civil registry office records where the mandate is kept. The child and adult protection authority (KESB) can look this up when needed."],["Cost","Recording CHF 75. Confirmation of the entry on request CHF 30."],["Where","At any civil registry office of your choice in the canton of Bern."]],"steps":["Write the mandate by hand, date and sign it, or have it notarised.","Decide where to keep it.","Make an appointment at a civil registry office or fill in the written application and send it to an office. The location is recorded."],"who":[1,1,0],"note":"The advance care mandate is governed by the Civil Code. The cantonal civil registry office records where it is kept; the KESB checks and activates it when needed.","src":["Canton of Bern: advance care mandate (civil registry)","Canton of Bern: recording where it is kept","KESB canton of Bern: advance care mandate and living will"]},"aus":{"intro":"One to two months before it expires you receive an expiry notice. Send it back completed, with the documents it asks for, by e-mail or post to the city of Bern’s Einwohnerdienste, Migration und Fremdenpolizei.","facts":[["Expiry notice","Arrives one to two months before the permit expires. If you haven’t received one, contact the office yourself (031 321 53 00)."],["Submitting","Completed, with the documents listed in the notice, by e-mail or post. Processing can take a while; the city contacts you once the permit is renewed."],["Biometrics","If needed, you receive a written invitation to give your biometric data at an ID centre."],["B permit validity","Canton of Bern: as a rule 5 years for EU/EFTA nationals, 1 year for third-country nationals."]],"steps":["Wait for the expiry notice (one to two months before) and fill it in.","Send it with the requested documents by e-mail or post to the city of Bern office.","If invited: give your biometric data at the centre. The new permit follows."],"who":[1,1,1],"note":"The rules are set by the Confederation (SEM). In the city of Bern the Einwohnerdienste, Migration und Fremdenpolizei handle renewals; the canton regulates the permit card.","src":["City of Bern: renewing permits","Canton of Bern: residence permit (B permit)","City of Bern: Einwohnerdienste, Migration und Fremdenpolizei"]},"nam":{"intro":"After a divorce you keep the name you had during the marriage. You can, however, declare at any time at the civil registry office that you want to go back to your maiden or birth name. In the canton of Bern this costs CHF 75.","facts":[["Deadline","None. The declaration is possible at any time once the marriage has ended."],["Where","By appointment at one of the seven civil registry offices in the canton of Bern or at any other civil registry office in Switzerland."],["Cost","Name declaration CHF 75. Confirmation on request CHF 30. Paid on site."],["Not the same","If you want a name other than your birth name, you need an application for a change of name to the canton."]],"steps":["Make an appointment at a civil registry office.","Make the name declaration there and pay the fee."],"who":[1,1,0],"note":"Name law is in the Civil Code. The declaration is taken by the cantonal civil registry office.","src":["Canton of Bern: name declaration","ch.ch: name after divorce","Canton of Bern: change of name"]}}}};
const PAGE={"de":{"title":"Frag Tell – Tell (privates Konzept, Prototyp)","desc":"Frag Tell: Chat-Einstieg des privaten Konzeptprototyps Tell. 39 Themen, Antworten nur aus offiziellen Quellen. Keine offizielle Seite.","page":"Frag Tell","greet":{"m":"Guten Morgen","d":"Guten Tag","e":"Guten Abend","tail":", Schweiz"},"sub":"Was möchten Sie bei Bund, Kanton oder Gemeinde erledigen?","more":"Weitere Themen","less":"Weniger","f_views":["Abdeckung","Neuigkeiten","Für Behörden","Mitmachen"],"f_pages_h":"Weitere Seiten von Tell","credit":"Bildnachweis: Foto Bundeshaus Bern («Bundeshaus Bern 20180827-2»): Suicasmo, CC BY-SA 4.0, via Wikimedia Commons (commons.wikimedia.org/wiki/File:Bundeshaus_Bern_20180827-2.jpg); freigestellt und bearbeitet.","mail":{"fb":"Tell: Rückmeldung","err":"Tell: Fehler oder Veraltetes melden","topic":"Tell: Themenvorschlag"},"views":{"abdeckung":{"t":"Abdeckung","h":"Was Tell abdeckt","lead":"Tell ist ein Konzeptprototyp und kein flächendeckender Auskunftsdienst. Heute beantwortet die Chatbox 39 Themen, jeweils für Beispielorte. Zu allem anderen sagt Tell offen, dass es noch keine Antwort hat.","blocks":[{"type":"topics","h":"Heute: 39 Themen","ask":"Frage stellen","items":[{"h":"Umzug melden","t":"Ab- und Anmeldung, Frist, Kosten und Ablauf über eUmzugCH.","m":"Beispiel: Bern nach Winterthur"},{"h":"Pass & ID","t":"Antrag, Termin, Kosten und Gültigkeit.","m":"Beispiel: Kanton Bern"},{"h":"Steuererklärung, Frist verlängern","t":"Fristen, Verlängerung und Kosten.","m":"Beispiel: Kanton Bern, teils Zürich und Genf"},{"h":"AHV-Rente anmelden","t":"Referenzalter, Anmeldung, Vorbezug und Aufschub.","m":"Beispiel: Jahrgang 1962, Thun"},{"h":"Arbeitslos melden","t":"Anmeldung beim RAV, Arbeitslosenentschädigung und Ablauf.","m":"Beispiel: Thun, Regeln des Bundes"},{"h":"Krankenkasse wechseln","t":"Kündigungsfrist, Franchise, Prämien 2027 und Ablauf.","m":"Ganze Schweiz (Bundesrecht, KVG)"},{"h":"Einzelfirma gründen","t":"AHV-Anmeldung, Handelsregister, Mehrwertsteuer und Kosten.","m":"Beispiel: Bern"},{"h":"Ausländischen Führerausweis umtauschen","t":"Frist, Kontrollfahrt, Kosten und Ablauf.","m":"Beispiel: Kanton Bern, deutscher Ausweis"},{"h":"Heiraten","t":"Voraussetzungen, Ehevorbereitung, Fristen und Kosten.","m":"Beispiel: Stadt Zürich, beide mit Schweizer Pass"},{"h":"Hund anmelden","t":"Anmeldung, AMICUS, Mikrochip und Hundetaxe.","m":"Beispiel: Stadt Bern"},{"h":"Familienzulagen beantragen","t":"Höhe, Antrag, rückwirkende Zahlung und Regeln.","m":"Beispiel: Kanton Bern, Angestellte"},{"h":"Betreibungsregisterauszug bestellen","t":"Bestellung, Kosten, Inhalt und Zustellung.","m":"Beispiel: Kanton Bern"},{"h":"Strafregisterauszug bestellen","t":"Bestellung online oder an der Post, Kosten und Dauer.","m":"Ganze Schweiz (Bund)"},{"h":"Auto einlösen","t":"Unterlagen, Versicherungsnachweis, Kosten und Steuer.","m":"Beispiel: Kanton Bern, Occasion"},{"h":"Einbürgerung","t":"Voraussetzungen, Sprache, Test, Ablauf und Kosten.","m":"Beispiel: Stadt Bern, ordentliche Einbürgerung"},{"h":"Prämienverbilligung","t":"Einkommensgrenze, automatische Prüfung, Antrag und Auszahlung.","m":"Beispiel: Kanton Bern, Stand 2026"},{"h":"Wehrpflichtersatz","t":"Höhe, Dauer, Zivilschutz, Befreiung und Rückerstattung.","m":"Beispiel: Kanton Bern, Regeln des Bundes"},{"h":"Gartenhaus: Baubewilligung nötig?","t":"Bewilligungsfreie Kleinbauten, Vorschriften, Baugesuch über eBau.","m":"Beispiel: Stadt Bern"},{"h":"Pass oder ID verloren","t":"Verlustmeldung, Kosten, Gültigkeit und neuer Ausweis.","m":"Beispiel: Kanton Bern"},{"h":"Betreuungsgutscheine für die Kita","t":"Voraussetzungen, Pensum, Einkommen und Antrag über kiBon.","m":"Beispiel: Stadt Bern, Periode 2026/27"},{"h":"Sozialhilfe beantragen","t":"Anmeldung, Unterlagen, Höhe und Rückerstattung.","m":"Beispiel: Stadt Bern"},{"h":"Ergänzungsleistungen beantragen","t":"Vermögensgrenze, Lebensbedarf 2027, Anmeldung und Entscheid.","m":"Beispiel: Thun, Kanton Bern"},{"h":"Bei der IV anmelden","t":"Früherfassung, Anmeldung, Eingliederung und Rente.","m":"Beispiel: Kanton Bern"},{"h":"Mutterschaftsentschädigung","t":"Anspruch, Höhe, Dauer und Antrag.","m":"Ganze Schweiz"},{"h":"Vaterschaftsurlaub","t":"Anspruch, Dauer, Höhe und Antrag.","m":"Ganze Schweiz"},{"h":"Lernfahrausweis beantragen","t":"Alter, Sehtest, Nothelfer, Theorieprüfung und Kosten.","m":"Beispiel: Kanton Bern"},{"h":"Wohnsitzbestätigung bestellen","t":"Bestellung, Kosten und Schalter.","m":"Beispiel: Stadt Bern"},{"h":"Todesfall melden","t":"Todesbescheinigung, Meldung, Bestattung.","m":"Beispiel: Stadt Bern"},{"h":"Anwohnerparkkarte","t":"Voraussetzungen, Kosten, Gültigkeit und Antrag.","m":"Beispiel: Stadt Bern"},{"h":"Sperrgut entsorgen","t":"Kleinsperrgut, Entsorgungshof, Abholdienst und Kosten.","m":"Beispiel: Stadt Bern"},{"h":"Fundbüro","t":"Verlust melden, abholen, Finderlohn.","m":"Beispiel: Stadt Bern"},{"h":"Betreibung einleiten","t":"Betreibungsbegehren, Kosten, Zahlungsbefehl, Rechtsvorschlag.","m":"Beispiel: Kanton Bern"},{"h":"Auto abmelden","t":"Fahrzeugausweis, Schilder, Steuer und Kosten.","m":"Beispiel: Kanton Bern"},{"h":"Wochenaufenthalt anmelden","t":"Wer, Frist, Heimatausweis und Steuern.","m":"Beispiel: Stadt Bern"},{"h":"Kirchenaustritt","t":"Form, Adresse, Wirksamkeit und Kirchensteuer.","m":"Beispiel: Kanton Bern"},{"h":"Velo gestohlen melden","t":"Online-Anzeige, Angaben, Polizeiwache.","m":"Beispiel: Kanton Bern"},{"h":"Vorsorgeauftrag hinterlegen","t":"Form, Hinterlegungsort, Kosten.","m":"Beispiel: Kanton Bern"},{"h":"Ausländerausweis verlängern","t":"Verfallsanzeige, Unterlagen, Biometrie, Gültigkeit.","m":"Beispiel: Stadt Bern"},{"h":"Namen nach Scheidung ändern","t":"Ledigname, Frist, Kosten.","m":"Beispiel: Kanton Bern"}]},{"type":"list","h":"Gut zu wissen","items":["Die Antworten stammen aus öffentlichen, offiziellen Quellen von Bund, Kantonen und Gemeinden und nennen diese. Stand: Oktober 2026, ohne Gewähr.","Die Antworten sind Beispiele für einzelne Orte. Andere Gemeinden und Kantone können abweichen. Massgebend sind immer die zuständigen Stellen.","Die Chatbox erkennt Themen an Stichwörtern. Wenn nichts passt, sagt sie das.","Ihre Eingabe bleibt im Browser. Es gibt kein Konto und keinen Gesprächsverlauf."]},{"type":"list","h":"Noch nicht abgedeckt","items":["Alle übrigen Behördengänge sowie die meisten Gemeinden und Kantone."],"note":"Kein Zeitplan und keine Zusage."}]},"neuigkeiten":{"t":"Neuigkeiten","h":"Neuigkeiten","lead":"Was sich bei Tell geändert hat, mit Datum. Aufgeführt ist nur, was tatsächlich umgesetzt wurde.","blocks":[{"type":"news","items":[{"d":"7. Oktober 2026","g":[{"h":"Neues Thema","li":["Krankenkasse wechseln: Kündigungsfrist, Franchise, Prämien 2027 und Ablauf, mit Quellen von Priminfo (BAG) und Fedlex (KVG)."]},{"h":"Neue Seite","li":["«Frag Tell» mit Chat-Einstieg sowie den Bereichen Abdeckung, Neuigkeiten, Für Behörden und Mitmachen.","«Lücken»: neue Seite, auf der Tell festhält, wo offizielle Angaben zu seinen Themen Lücken, Unklarheiten oder Abweichungen zeigen. Erst ein Anfang: 8 Beobachtungen mit Quellen, Stand 7. Oktober 2026."]}]},{"d":"5. Oktober 2026","g":[{"h":"Verbessert","li":["Kopfbild der Startseite: Bundeshaus frontal und grösser."]}]},{"d":"4. Oktober 2026","g":[{"h":"Online","li":["Tell geht als privater Konzeptprototyp online: Startseite, Bürgersicht, Behördensicht und Projekt."]}]}]}]},"behoerden":{"t":"Für Behörden","h":"Für Behörden","lead":"Tell ist ein privates Konzept. Heute arbeitet keine Behörde mit Tell zusammen, und es gibt keine Absprache mit einer Stelle. Diese Seite zeigt, wie eine Zusammenarbeit aussehen könnte, in drei Stufen: Mit jeder Stufe steigt der Nutzen für Bürgerinnen und Bürger, aber auch der Aufwand für ein Amt.","blocks":[{"type":"phases","h":"Mögliche Zusammenarbeit (Konzeptidee)","items":[{"n":"1","h":"Mitlesen und korrigieren","e":"Aufwand gering, ohne IT","t":"Ein Amt schaut die Antworten zu seinen Themen an und meldet Fehler oder Veraltetes per E-Mail. Tell passt die Antwort an und nennt die Seite des Amts als Quelle."},{"n":"2","h":"Anbinden","e":"Aufwand mittel, mit IT","t":"Tell verweist direkt auf den Online-Schalter, das Formular oder die Terminbuchung des Amts, statt nur zu erklären. Idee im Konzept, nicht umgesetzt."},{"n":"3","h":"Partner werden","e":"Aufwand hoch, Projekt und Recht","t":"Im Projektkonzept ist ein Pilot mit einem Kanton vorgesehen (12 Monate), danach 6 bis 8 Kantone (24 Monate). Das sind eigene Annahmen, keine Zusage und keine Offerte."}]},{"type":"list","h":"Lücken in offiziellen Angaben","items":["Tell hält auf der Seite «Lücken» fest, wo offizielle Angaben zu seinen 39 Themen Lücken, Unklarheiten oder Abweichungen zeigen, mit Quellen und Abrufdatum. Es sind Beobachtungen, keine Vorwürfe, und sie sollen Ämtern helfen, ihre Angaben zu verbessern. Erst ein Anfang: 8 Einträge, Stand 7. Oktober 2026, bitte prüfen."]},{"type":"list","h":"Was Tell ist, und was nicht","items":["Tell ist ein privates Konzept von Bilal Simsek, Bern, und keine Behörde.","Fakten wie Fristen, Gebühren und Adressen stammen nur aus offiziellen Quellen und werden mit Quelle angezeigt.","Tell entscheidet nichts und gibt keine Rechtsauskunft. Bei Unsicherheit verweist es an das zuständige Amt.","Tell reicht keine Anträge ein. Das geht heute nur auf den offiziellen Seiten."]},{"type":"links","h":"Mehr zum Konzept","items":[{"l":"Lücken in offiziellen Angaben (Beobachtungen)","href":"luecken.html"},{"l":"Behördensicht (Demo)","href":"behoerdensicht.html"},{"l":"Projekt: Fahrplan, Kosten, Risiken","href":"projekt.html"},{"l":"Rückmeldung an Tell senden","mail":"fb"}]}]},"mitmachen":{"t":"Mitmachen","h":"Mitmachen","lead":"Tell ist ein Einzelprojekt und lebt von Rückmeldungen. So können Sie helfen, alles per E-Mail und ohne Konto.","blocks":[{"type":"cards","items":[{"h":"Fehler oder Veraltetes melden","t":"Stimmt eine Frist, eine Gebühr oder eine Adresse nicht mehr? Schreiben Sie die Frage und die Quelle.","l":"Fehler melden","mail":"err"},{"h":"Ein Thema vorschlagen","t":"Welcher Behördengang fehlt Ihnen? Nennen Sie das Anliegen und Ihren Wohnort.","l":"Thema vorschlagen","mail":"topic"},{"h":"Rückmeldung aus einem Amt","t":"Sie arbeiten bei einer Behörde? Eine kurze Rückmeldung zu einer Antwort hilft am meisten.","l":"Rückmeldung senden","mail":"fb"},{"h":"Weitersagen","t":"Zeigen Sie Tell Menschen, die mit Ämtern zu tun haben, und sagen Sie dazu, dass es ein privates Konzept ist."}]}]}},"f_luecken":"Lücken"},"fr":{"title":"Demandez à Tell – Tell (concept privé, prototype)","desc":"Demandez à Tell : point d’entrée par chat du prototype conceptuel Tell. 39 thèmes, réponses uniquement issues de sources officielles. Pas un site officiel.","page":"Demandez à Tell","greet":{"m":"Bonjour","d":"Bonjour","e":"Bonsoir","tail":", la Suisse"},"sub":"Que souhaitez-vous régler auprès de la Confédération, du canton ou de la commune ?","more":"Autres thèmes","less":"Moins","f_views":["Couverture","Actualités","Pour les autorités","Participer"],"f_pages_h":"Autres pages de Tell","credit":"Crédits photo : photo du Palais fédéral de Berne (« Bundeshaus Bern 20180827-2 ») : Suicasmo, CC BY-SA 4.0, via Wikimedia Commons (commons.wikimedia.org/wiki/File:Bundeshaus_Bern_20180827-2.jpg) ; détourée et retouchée.","mail":{"fb":"Tell : retour d’information","err":"Tell : signaler une erreur ou une information périmée","topic":"Tell : proposition de thème"},"views":{"abdeckung":{"t":"Couverture","h":"Ce que couvre Tell","lead":"Tell est un prototype conceptuel et non un service d’information à couverture complète. Aujourd’hui, le chat répond à 39 thèmes, chacun pour des lieux donnés en exemple. Pour tout le reste, Tell dit ouvertement qu’il n’a pas encore de réponse.","blocks":[{"type":"topics","h":"Aujourd’hui : 39 thèmes","ask":"Poser la question","items":[{"h":"Annoncer un déménagement","t":"Départ et arrivée, délai, coûts et déroulement via eUmzugCH.","m":"Exemple : de Berne à Winterthour"},{"h":"Passeport et carte d’identité","t":"Demande, rendez-vous, coûts et validité.","m":"Exemple : canton de Berne"},{"h":"Déclaration d’impôts, prolonger le délai","t":"Délais, prolongation et coûts.","m":"Exemple : canton de Berne, en partie Zurich et Genève"},{"h":"Demander la rente AVS","t":"Âge de référence, demande, anticipation et ajournement.","m":"Exemple : année de naissance 1962, Thoune"},{"h":"S’annoncer au chômage","t":"Inscription à l’ORP, indemnité de chômage et déroulement.","m":"Exemple : Thoune, règles fédérales"},{"h":"Changer de caisse maladie","t":"Délai de résiliation, franchise, primes 2027 et déroulement.","m":"Toute la Suisse (droit fédéral, LAMal)"},{"h":"Fonder une entreprise individuelle","t":"Annonce AVS, registre du commerce, TVA et coûts.","m":"Exemple : Berne"},{"h":"Échanger un permis de conduire étranger","t":"Délai, course de contrôle, coûts et déroulement.","m":"Exemple : canton de Berne, permis allemand"},{"h":"Se marier","t":"Conditions, préparation du mariage, délais et coûts.","m":"Exemple : ville de Zurich, tous deux de nationalité suisse"},{"h":"Annoncer un chien","t":"Annonce, AMICUS, puce et taxe sur les chiens.","m":"Exemple : ville de Berne"},{"h":"Demander les allocations familiales","t":"Montant, demande, versement rétroactif et règles.","m":"Exemple : canton de Berne, salariés"},{"h":"Commander un extrait des poursuites","t":"Commande, coûts, contenu et envoi.","m":"Exemple : canton de Berne"},{"h":"Commander un extrait du casier judiciaire","t":"Commande en ligne ou à la Poste, coûts et délai.","m":"Toute la Suisse (Confédération)"},{"h":"Immatriculer une voiture","t":"Documents, attestation d’assurance, coûts et impôt.","m":"Exemple : canton de Berne, occasion"},{"h":"Naturalisation","t":"Conditions, langue, test, déroulement et coûts.","m":"Exemple : ville de Berne, naturalisation ordinaire"},{"h":"Réduction des primes","t":"Limite de revenu, examen automatique, demande et versement.","m":"Exemple : canton de Berne, état 2026"},{"h":"Taxe d’exemption de l’obligation de servir","t":"Montant, durée, protection civile, exonération et remboursement.","m":"Exemple : canton de Berne, règles fédérales"},{"h":"Abri de jardin : permis nécessaire ?","t":"Petites constructions libres de permis, règles, demande via eBau.","m":"Exemple : ville de Berne"},{"h":"Passeport ou ID perdu","t":"Annonce de perte, coûts, validité et nouveau document.","m":"Exemple : canton de Berne"},{"h":"Bons de garde pour la crèche","t":"Conditions, taux d’activité, revenu et demande via kiBon.","m":"Exemple : ville de Berne, période 2026/27"},{"h":"Demander l’aide sociale","t":"Annonce, documents, montant et remboursement.","m":"Exemple : ville de Berne"},{"h":"Demander des prestations complémentaires","t":"Limite de fortune, besoins vitaux 2027, inscription et décision.","m":"Exemple : Thoune, canton de Berne"},{"h":"S’inscrire à l’AI","t":"Détection précoce, inscription, réadaptation et rente.","m":"Exemple : canton de Berne"},{"h":"Allocation de maternité","t":"Droit, montant, durée et demande.","m":"Toute la Suisse"},{"h":"Congé de paternité","t":"Droit, durée, montant et demande.","m":"Toute la Suisse"},{"h":"Permis d’élève conducteur","t":"Âge, test de la vue, premiers secours, examen théorique et coûts.","m":"Exemple : canton de Berne"},{"h":"Commander une attestation de domicile","t":"Commande, coût et guichet.","m":"Exemple : ville de Berne"},{"h":"Annoncer un décès","t":"Certificat de décès, annonce, inhumation.","m":"Exemple : ville de Berne"},{"h":"Carte de stationnement pour résidents","t":"Conditions, coûts, validité et demande.","m":"Exemple : ville de Berne"},{"h":"Éliminer des encombrants","t":"Petits encombrants, déchetterie, enlèvement et coûts.","m":"Exemple : ville de Berne"},{"h":"Objets trouvés","t":"Annoncer une perte, retrait, récompense.","m":"Exemple : ville de Berne"},{"h":"Engager une poursuite","t":"Réquisition, coûts, commandement de payer, opposition.","m":"Exemple : canton de Berne"},{"h":"Mettre une voiture hors circulation","t":"Permis de circulation, plaques, impôt et coûts.","m":"Exemple : canton de Berne"},{"h":"Annoncer un séjour hebdomadaire","t":"Qui, délai, attestation et impôts.","m":"Exemple : ville de Berne"},{"h":"Sortie de l’Église","t":"Forme, adresse, effet et impôt ecclésiastique.","m":"Exemple : canton de Berne"},{"h":"Annoncer un vélo volé","t":"Plainte en ligne, indications, poste de police.","m":"Exemple : canton de Berne"},{"h":"Déposer un mandat pour cause d’inaptitude","t":"Forme, lieu de dépôt, coûts.","m":"Exemple : canton de Berne"},{"h":"Prolonger un titre de séjour","t":"Avis d’échéance, documents, biométrie, validité.","m":"Exemple : ville de Berne"},{"h":"Reprendre son nom après un divorce","t":"Nom de célibataire, délai, coûts.","m":"Exemple : canton de Berne"}]},{"type":"list","h":"Bon à savoir","items":["Les réponses proviennent de sources officielles publiques de la Confédération, des cantons et des communes, et les citent. État : octobre 2026, sans garantie.","Les réponses sont des exemples pour certains lieux. D’autres communes et cantons peuvent différer. Seuls les services compétents font foi.","Le chat reconnaît les thèmes grâce à des mots-clés. Si rien ne correspond, il le dit.","Votre saisie reste dans le navigateur. Il n’y a ni compte ni historique de conversation."]},{"type":"list","h":"Pas encore couvert","items":["Toutes les autres démarches ainsi que la plupart des communes et des cantons."],"note":"Pas de calendrier et aucune promesse."}]},"neuigkeiten":{"t":"Actualités","h":"Actualités","lead":"Ce qui a changé chez Tell, avec la date. Seules les modifications réellement réalisées sont indiquées.","blocks":[{"type":"news","items":[{"d":"7 octobre 2026","g":[{"h":"Nouveau thème","li":["Changer de caisse maladie : délai de résiliation, franchise, primes 2027 et déroulement, avec des sources de Priminfo (OFSP) et de Fedlex (LAMal)."]},{"h":"Nouvelle page","li":["« Demandez à Tell » av
