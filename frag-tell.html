e est valable 30 jours. L’impôt sur les véhicules se paie dans les 30 jours suivant la facture."],["Impôt","Impôt annuel sur les véhicules, facturé en janvier ou lors de l’immatriculation. Le calculateur de l’OCRN indique le montant."]],"steps":["Conclure une assurance responsabilité civile. L’assurance envoie l’attestation d’assurance à l’OCRN par voie électronique.","Remplir le formulaire de demande d’immatriculation d’un véhicule.","Envoyer le formulaire avec le permis de circulation du détenteur précédent, l’éventuel rapport d’expertise et une pièce d’identité à l’OCRN, Schermenweg 5, 3001 Berne, ou le remettre au guichet.","Par la poste, le nouveau permis de circulation arrive après quelques jours ouvrables. Payer ensuite la facture de l’impôt sur les véhicules dans les 30 jours."],"who":[1,1,0],"note":"La Confédération règle l’admission des véhicules ; l’office cantonal de la circulation (à Berne l’OCRN) délivre permis de circulation et plaques et perçoit l’impôt sur les véhicules.","src":["Canton de Berne (OCRN) : immatriculer un véhicule","Canton de Berne (OCRN) : marche à suivre pour l’immatriculation","Canton de Berne (OCRN) : documents pour l’immatriculation","Canton de Berne (OCRN) : calculer l’impôt sur les véhicules","ch.ch : immatriculer un véhicule"]},"nat":{"intro":"Vous remplissez les conditions de résidence : 10 ans en Suisse, permis C et au moins 2 ans dans le canton et la commune. S’y ajoutent l’attestation de langue, le test de naturalisation et l’intégration. Vous déposez la demande auprès de la ville de Berne ; pour une personne seule, commune, canton et Confédération coûtent ensemble CHF 1 650.","facts":[["Conditions","Permis C, 10 ans en Suisse au total, au moins 2 ans sans interruption dans le canton de Berne et dans la commune, intégration réussie."],["Langue","Canton de Berne : B1 à l’oral, A2 à l’écrit. Pas d’attestation si la langue officielle est votre langue maternelle ou si vous avez suivi au moins 5 ans d’école obligatoire dans cette langue."],["Test","Écrit, 90 minutes : géographie, histoire, démocratie, santé et travail, droits et devoirs. Est notamment dispensé qui a suivi au moins 5 ans d’école obligatoire en Suisse."],["Coûts","Personne seule en ville de Berne : commune CHF 400, canton CHF 1 150, Confédération CHF 100. Couple marié : 600, 1 725 et 150."]],"steps":["S’adresser à la commune de domicile (ville de Berne). Elle remet les formulaires et indique les documents nécessaires.","Obtenir l’attestation de langue (B1 à l’oral, A2 à l’écrit), si vous n’en êtes pas dispensé(e).","Déposer la demande complète auprès de la commune et passer le test de naturalisation, si vous n’en êtes pas dispensé(e).","La commune vous facture les émoluments de la commune et du canton ; la Confédération (SEM) décide de l’autorisation fédérale de naturalisation."],"who":[1,1,1],"note":"Se faire naturaliser, c’est acquérir trois droits de cité : commune, canton et Confédération examinent chacun leur part. La demande passe par la commune de domicile, le Secrétariat d’État aux migrations (SEM) délivre l’autorisation fédérale.","src":["Canton de Berne : séjour en Suisse (naturalisation)","Canton de Berne : connaissances linguistiques et attestation","Canton de Berne : test de naturalisation","Canton de Berne : émoluments de naturalisation","SEM : naturalisation ordinaire"]},"pv":{"intro":"Dans le canton de Berne, le canton examine en général automatiquement votre droit à la réduction des primes, sur la base des données fiscales définitives des deux années précédentes. En 2026, la limite est de CHF 35 000 de revenu déterminant, et de CHF 45 000 pour les familles avec enfants. Vous ne déposez une demande que dans des cas particuliers.","facts":[["Limite 2026","Revenu déterminant de CHF 35 000 au plus ; familles avec enfants : CHF 45 000 au plus."],["Examen","Automatique, sur la base des données fiscales définitives des deux années précédentes (revenu net et fortune)."],["Demande","Seulement dans des cas particuliers, par exemple si l’examen automatique n’est pas possible ou si le revenu ou la famille changent durablement et fortement. Possible aussi en ligne."],["Calculateur","Estimation sans engagement avec le calculateur en ligne sur be.ch/pvo-onlinerechner."]],"steps":["Vérifier avec le calculateur en ligne sur be.ch/pvo-onlinerechner si un droit est possible.","Déposer la déclaration d’impôt : l’examen automatique a besoin de données fiscales définitives.","Si le revenu ou la famille ont changé durablement et fortement : déposer une demande, aussi en ligne.","En cas de droit, le canton verse la réduction directement à votre caisse-maladie et votre facture de primes baisse."],"who":[1,1,0],"note":"La Confédération impose la réduction des primes dans la loi sur l’assurance-maladie et y contribue ; dans le canton de Berne, l’Office des assurances sociales (OAS) examine et décide.","src":["Canton de Berne (OAS) : droit à la réduction des primes","Canton de Berne (OAS) : quand déposer une demande","Canton de Berne (OAS) : feuille d’information réduction des primes 2026","Canton de Berne (OAS) : calculer le droit"]},"wpe":{"intro":"Oui. Qui n’accomplit pas, ou pas entièrement, son service militaire ou civil paie la taxe d’exemption de l’obligation de servir : 3 % du revenu imposable de l’impôt fédéral direct, au moins CHF 400 par an. Dans le canton de Berne, l’Office de la sécurité civile, du sport et des affaires militaires (OSSM) est compétent.","facts":[["Montant","3 % du revenu imposable de l’impôt fédéral direct, au moins CHF 400 par an."],["Durée","De 19 à 37 ans, au maximum 11 années de taxe."],["Protection civile","Qui fait du service de protection civile paie quand même, mais 4 % de moins par jour de service accompli dans l’année."],["Remboursement","Qui rattrape son service militaire ou civil et accomplit son obligation de servir est remboursé. Le droit se prescrit 5 ans après la fin de l’obligation de servir."]],"steps":["Déposer la déclaration d’impôt comme d’habitude : la taxe se calcule sur le revenu imposable de l’impôt fédéral direct.","La facture vient du service cantonal, dans le canton de Berne de l’OSSM.","En cas de handicap important et de revenu bas : faire examiner une exonération.","Service rattrapé : une fois l’obligation de servir accomplie, demander le remboursement à l’OSSM."],"who":[1,1,0],"note":"La taxe d’exemption est une contribution fédérale (AFC) ; les cantons, à Berne l’Office de la sécurité civile, du sport et des affaires militaires, la taxent et la perçoivent.","src":["AFC : la taxe d’exemption expliquée","Canton de Berne (OSSM) : taxe d’exemption","Canton de Berne (OSSM) : remboursement","ch.ch : taxe d’exemption de l’obligation de servir"]}}},"it":{"ask_label":"Cosa desidera sapere?","send":"Invii la domanda","nav":["Vista cittadini","Vista delle autorità","Progetto","Pagina iniziale","Menu","Pagine"],"f_links":["Contatto","Vista delle autorità","Vista cittadini","Progetto"],"f_sender":"Concetto privato di Bilal Simsek, Berna. Non è un'offerta di un'autorità. I Suoi riscontri sono benvenuti: {c}","f_legal":"Protezione dei dati, condizioni d'uso e accessibilità non sono elaborate nel concetto. Il prototipo non raccoglie dati personali, non imposta cookie e non utilizza strumenti di analisi; nel browser viene memorizzato solo, in locale, che Lei ha letto l'avviso.","f_note":"Prototipo concettuale. Tutte le risposte sono esempi e non sostituiscono l'informazione di un'autorità.","banner_s":"Prototipo concettuale, non un sito ufficiale","skip":"Vai al contenuto","chips":[{"l":"Trasloco","q":"Mi trasferisco da Berna a Winterthur: come e entro quando devo annunciare la partenza e l’arrivo?"},{"l":"Passaporto & ID","q":"Abito a Berna e ho bisogno di un nuovo passaporto e di una carta d’identità. Come e dove li ordino?"},{"l":"Termine fiscale","q":"Abito a Berna e non riesco a presentare la dichiarazione d’imposta entro metà marzo. Come prolungo il termine e quanto costa?"},{"l":"Rendita AVS","q":"Sono nato/a nel 1962 e abito a Thun: quando e dove richiedo la rendita AVS?"},{"l":"Disoccupazione","q":"Abito a Thun e alla fine del mese perdo il mio posto di lavoro. Dove e quando devo annunciarmi e come ottengo l’indennità di disoccupazione?"},{"l":"Cambiare cassa","q":"Entro quando posso cambiare cassa malati e come funziona?"},{"l":"Ditta individuale","q":"Abito a Berna e mi metto in proprio con una ditta individuale. Che cosa devo annunciare e dove?"},{"l":"Patente estera","q":"Abito a Berna da qualche mese e ho una patente di guida tedesca. Devo cambiarla, e come?"},{"l":"Sposarsi","q":"Siamo entrambi svizzeri, abitiamo a Zurigo e vogliamo sposarci. Come funziona e quanto costa?"},{"l":"Annunciare un cane","q":"Abito nella città di Berna e ho preso un cane. Dove devo annunciarlo e quanto costa?"},{"l":"Assegni per i figli","q":"Sono dipendente a Berna e ho avuto un bambino. Come ottengo gli assegni per i figli e quanto ricevo?"},{"l":"Estratto esecuzioni","q":"Abito a Berna e mi serve un estratto del registro delle esecuzioni per un nuovo appartamento. Dove lo ordino e quanto costa?"},{"l":"Casellario giudiziale","q":"Mi serve un estratto del casellario giudiziale per un nuovo lavoro. Come lo ordino e quanto tempo ci vuole?"},{"l":"Immatricolare l’auto","q":"Abito a Berna e ho comprato un’auto d’occasione. Come la immatricolo e quanto costa?"},{"l":"Naturalizzazione","q":"Vivo in Svizzera da 12 anni, di cui 3 nella città di Berna, e ho il permesso C. Posso naturalizzarmi e quanto costa?"},{"l":"Riduzione dei premi","q":"Abito nel Cantone di Berna e guadagno poco. Ho diritto alla riduzione dei premi e devo chiederla?"},{"l":"Tassa d’esenzione","q":"Ho 22 anni, abito a Berna e sono stato dichiarato inabile al servizio militare. Devo pagare la tassa d’esenzione e quanto?"}],"think":"Tell consulta le fonti ufficiali","who":"Competenza","bund":"Confederazione","kanton":"Cantone","gemeinde":"Comune","src":"Fonti","glance":"In breve","stand":"Stato: ottobre 2026 · Risposta a titolo di esempio, tratta da fonti pubbliche, senza garanzia. Fanno stato gli uffici competenti.","newtab":"si apre in una nuova scheda","newq":"Nuova domanda","fb":{"intro":"Il prototipo non ha ancora una risposta a questa domanda. La versione definitiva consulterebbe qui le fonti ufficiali di Confederazione, cantoni e comuni. Risponde già a diciassette esempi: trasloco, passaporto e carta d’identità, dichiarazione d’imposta, rendita AVS, disoccupazione, cambio della cassa malati, fondazione di una ditta individuale cambio di una patente estera, matrimonio, annuncio di un cane, assegni familiari, estratto delle esecuzioni, estratto del casellario giudiziale, immatricolazione dell’auto, naturalizzazione, riduzione dei premi e tassa d’esenzione dall’obbligo militare. Provi uno di questi."},"ans":{"move":{"intro":"Lei si annuncia entro 14 giorni presso il nuovo comune. Da Berna a Winterthur ciò avviene online tramite eUmzugCH: entrambi i comuni sono collegati e non è necessario recarsi allo sportello.","facts":[["Scadenza","14 giorni dal cambio di indirizzo (art. 11 LArRa)"],["Costi","Winterthur: CHF 40 per persona adulta; eUmzugCH non costa più dello sportello"],["Sportello","Non necessario, tutto avviene online"],["Competenza","Servizi agli abitanti di Berna (partenza), controllo abitanti di Winterthur (arrivo)"]],"steps":["Su eumzug.swiss inserire il vecchio indirizzo (Berna) e il nuovo indirizzo (Winterthur) e avviare la verifica.","Tenere pronti: passaporto o carta d’identità, numero AVS (13 cifre), contratto di locazione o conferma di entrata nell’alloggio, carta o Twint per CHF 40.","Tenere pronta la tessera della cassa malati o la polizza: Winterthur richiede questa prova al momento dell’annuncio di arrivo.","Concludere online l’annuncio di partenza a Berna e l’annuncio di arrivo a Winterthur; una visita allo sportello a Berna non è necessaria.","Ufficio delle imposte: Winterthur riceve automaticamente il nuovo indirizzo; vi è assoggettato all’imposta dal 1° gennaio dell’anno di arrivo."],"who":[1,1,1],"note":"I comuni (Berna, Winterthur) ricevono gli annunci di partenza e di arrivo, eUmzugCH è il servizio comune di Confederazione, cantoni e comuni; le imposte sono riscosse dal Cantone di Zurigo con la Città di Winterthur.","src":["eUmzugCH – annunciare il trasloco online (Confederazione, cantoni, comuni)","Città di Winterthur – trasloco e arrivo a Winterthur","Città di Berna – arrivo, trasloco e partenza","Città di Winterthur – imposte in caso di trasloco, arrivo e partenza"]},"passport":{"intro":"Come persona adulta domiciliata a Berna, Lei richiede passaporto e/o carta d’identità online su schweizerpass.ch e si reca poi all’appuntamento prenotato, p. es. al centro documenti d’identità di Berna (Laupenstrasse 18A). La combinazione passaporto + carta d’identità costa CHF 158 ed è valida 10 anni.","facts":[["Costi","Adulti: carta d’identità CHF 70, passaporto CHF 145, combinazione CHF 158. Bambini fino a 18 anni: carta d’identità 35, passaporto 65, combinazione 78 (porto incluso)."],["Validità","Adulti 10 anni, bambini e giovani fino a 18 anni: 5 anni. Una proroga non è possibile, si ordina un nuovo documento."],["Durata","Consegna al massimo 10 giorni lavorativi dopo l’appuntamento, per raccomandata."],["Appuntamento","Obbligatorio, presenza personale necessaria (foto, per il passaporto impronte digitali)."],["Novità da novembre","Dal 2 novembre 2026 esiste anche la carta d’identità biometrica con chip (immagine del viso e due impronte digitali). Facoltativa, stessa tassa di oggi. Il passaporto provvisorio si chiamerà allora «passaporto d’emergenza»."]],"steps":["Compilare la richiesta online su schweizerpass.ch (indirizzo e-mail personale necessario). Dopo la verifica riceve un’e-mail per scegliere l’appuntamento.","Prenotare l’appuntamento in uno dei 7 centri documenti d’identità bernesi (obbligatorio): online o per telefono allo 031 635 40 00, lun–ven.","Portare il vecchio documento, ma nessuna fotografia: la foto viene scattata sul posto.","Pagare l’importo sul posto (carta, Twint o contanti). I bambini vengono con una persona titolare dell’autorità parentale e il suo documento d’identità.","Il documento arriva entro 10 giorni lavorativi, per raccomandata, all’indirizzo indicato."],"who":[1,1,0],"note":"La Confederazione (fedpol) pubblica prezzi, validità e termini di consegna; nel Cantone di Berna i sette centri cantonali documenti d’identità registrano i Suoi dati.","src":["fedpol: prezzi, validità e termini di consegna","Cantone di Berna: documenti d’identità, prezzi e validità","Cantone di Berna: centri documenti d’identità e appuntamento","Cantone di Berna: presentarsi all’appuntamento, documenti da portare","Consiglio federale: carta d’identità biometrica dal 2.11.2026 (comunicato del 26.8.2026)"]},"tax":{"intro":"Nel Cantone di Berna la dichiarazione d’imposta scade di regola il 15 marzo; online può prorogare gratuitamente fino al 15 luglio, al massimo fino al 15 novembre. Per il periodo fiscale 2025, a causa di un’interruzione informatica, il 30 novembre 2026 vale eccezionalmente come ultimo termine.","facts":[["Scadenza","Berna: 15 marzo (indipendenti: 15 maggio). Zurigo e Ginevra: 31 marzo."],["Costi","Berna online: gratis fino al 15 luglio, CHF 20 fino al 15 sett., CHF 40 fino al 15 nov. Per scritto/telefono: CHF 20/40/60. Ginevra: CHF 20/40/60."],["Durata","Berna: al massimo fino al 15 nov.; dichiarazione 2025 eccezionalmente fino al 30 nov. 2026 (interruzione informatica)."],["Competenza","Berna: amministrazione cantonale delle imposte. Zurigo: ufficio comunale delle imposte. Ginevra: Administration fiscale cantonale."]],"steps":["Tenere pronti la lettera sulla dichiarazione d’imposta, il certificato di salario (del datore di lavoro) e i giustificativi.","Prima della scadenza, in BE-Login (con AGOV): «Fristverlängerung erfassen» (registrare la proroga), scegliere il nuovo termine e confermare.","Salvare la conferma da sé: non ne arriva nessuna per posta o e-mail.","Compilare la dichiarazione in TaxMe-Online e inoltrarla con i giustificativi (oppure consegnarla stampata al comune di domicilio).","In ritardo? Si rischia una tassa di sollecito di CHF 60; scaduto il termine di sollecito, non è più possibile alcuna proroga."],"who":[1,1,1],"note":"L’amministrazione cantonale delle imposte riceve la Sua dichiarazione e tassa anche l’imposta federale diretta su mandato della Confederazione (vigilanza dell’AFC); il comune fissa il proprio moltiplicatore d’imposta.","src":["Cantone di Berna: prorogare il termine come persona privata","Cantone di Berna: istruzioni, termine di inoltro","Cantone di Zurigo: dichiarazione d’imposta delle persone fisiche","Cantone di Ginevra: richiedere una proroga"]},"ahv":{"intro":"Un uomo nato nel 1962 e residente a Thun raggiunge nel 2027, a 65 anni, l’età di riferimento e richiede la rendita alla cassa di compensazione 3–4 mesi prima. Con compleanno il 15 marzo 2027 la rendita inizia il 1° aprile 2027; la richiesta si presenta da circa dicembre 2026.","facts":[["Età di riferimento","Uomini 65. Donne: nate nel 1961 = 64 anni e 3 mesi, 1962 = 64 anni e 6 mesi, 1963 = 64 anni e 9 mesi, dal 1964 = 65. Rendita dal mese successivo."],["Scadenza","Richiesta 3–4 mesi prima dell’inizio della rendita. Anticipo dai 63 anni (–6.8 % per 1 anno), differimento 1–5 anni (+5.2 % fino a +31.5 %)."],["Rendita","Dal 2027, con durata di contribuzione completa CHF 1’280–2’560 al mese; coppia al massimo CHF 3’840. In più la 13a rendita da dicembre 2026."],["Competenza","Cassa di compensazione a cui è affiliato il Suo datore di lavoro (nel Cantone di Berna p. es. la cassa di compensazione del Cantone di Berna, AK Bern)."]],"steps":["Chiarire la cassa di compensazione competente: i dipendenti chiedono al datore di lavoro, gli indipendenti all’ultima cassa con cui hanno conteggiato.","Compilare e inoltrare online il modulo 318.370 «Richiesta di una rendita di vecchiaia» 3–4 mesi prima dell’inizio della rendita.","Anticipo: da chiedere al più tardi entro la fine del mese precedente. Differimento: da spuntare nel modulo al più tardi 1 anno dopo l’età di riferimento.","Caricare gli allegati con il modulo o inviarli per posta; la cassa di compensazione procura i documenti necessari e calcola la rendita.","Pagamento mensile (AK Bern: 4° giorno lavorativo, p. es. il 4 dicembre 2026); la 13a rendita di dicembre arriva senza richiesta."],"who":[1,1,0],"note":"La Confederazione (UFAS) stabilisce le regole e pubblica i fogli informativi; la cassa di compensazione (nel Cantone di Berna l’AK Bern) riceve la Sua richiesta, calcola e versa la rendita.","src":["Cassa di compensazione del Cantone di Berna: rendita di vecchiaia dell’AVS","ahv-iv.ch: opuscolo 3.01 Rendite di vecchiaia (stato 1.1.2026)","ch.ch: pensionamento – da quando?","UFAS: stabilizzazione dell’AVS (AVS 21)","Consiglio federale: aumento delle rendite AVS/AI al 1.1.2027 (2.10.2026)"]},"alv":{"intro":"Si annunci all’URC della Sua regione al più tardi il primo giorno per cui desidera l’indennità di disoccupazione, nel modo più rapido online nel Job-Room. Esempio a Thun: 30 anni, salario mensile di 6’500 franchi, nessun figlio, 14 mesi di contribuzione danno il 70 %, al massimo 260 indennità giornaliere e 10 giorni di attesa.","facts":[["Scadenza","Annuncio all’URC al più tardi il 1° giorno di disoccupazione, meglio già durante il periodo di disdetta."],["Importo","70 % del guadagno assicurato. 80 % con figli sotto i 25 anni, guadagno fino a 3’797 franchi o rendita AI dal 40 %."],["Durata","Almeno 12 mesi di contribuzione in 2 anni. 260 indennità giornaliere, di più con un periodo di contribuzione più lungo. Termine quadro: 2 anni."],["Competenza","URC (annuncio, consulenza) e la cassa di disoccupazione da Lei scelta (pagamento)."]],"steps":["Annunciarsi online tramite l’e-service per l’annuncio all’URC nel Job-Room, oppure di persona presso l’URC della Sua regione.","Cercare lavoro già durante il periodo di disdetta e documentare ogni candidatura. Quante, lo stabilisce il Suo URC.","Scegliere la cassa di disoccupazione, inoltrare la «richiesta di indennità di disoccupazione» e le attestazioni del datore di lavoro (2 anni).","Primo colloquio all’URC (invito entro 15 giorni): portare la tessera AVS o della cassa malati, un documento d’identità e la prova delle ricerche di lavoro.","Ogni mese inoltrare le «indicazioni della persona assicurata». Le indennità giornaliere seguono di regola il mese successivo."],"who":[1,1,0],"note":"La SECO vigila sull’assicurazione contro la disoccupazione; URC, casse di disoccupazione e uffici cantonali la eseguono; l’annuncio si fa direttamente all’URC.","src":["arbeit.swiss: annuncio e registrazione","arbeit.swiss (SECO): FAQ sull’indennità di disoccupazione","ch.ch: disoccupazione in Svizzera","Fedlex: LADI (RS 837.0), art. 9, 17, 18, 22, 27"]},"kk":{"intro":"Lei può cambiare l’assicurazione di base per la fine dell’anno se la disdetta giunge alla cassa entro lunedì 30 novembre 2026. La nuova cassa deve accettarLa senza domande sullo stato di salute. I premi 2027 sono già nel calcolatore dei premi di priminfo.admin.ch.","facts":[["Scadenza","La disdetta deve giungere alla cassa al più tardi l’ultimo giorno lavorativo di novembre (2026: lunedì 30 novembre). Conta la ricezione, non il timbro postale. Consigliato: raccomandata entro metà novembre."],["Franchigia","Adulti: CHF 300 oppure, a scelta, 500, 1’000, 1’500, 2’000, 2’500, più il 10 % di aliquota percentuale, al massimo CHF 700 all’anno. Bambini: nessuna franchigia, aliquota percentuale al massimo CHF 350."],["Cambiare franchigia","Franchigia più bassa: comunicarlo per scritto entro l’ultimo giorno lavorativo di novembre. Franchigia più alta: solo a inizio anno; la legge non fissa un termine, Priminfo raccomanda di comunicarlo entro metà dicembre."],["A metà anno","Cambio al 1° luglio solo con la franchigia ordinaria (CHF 300) e libera scelta del fornitore di prestazioni, disdetta entro il 31 marzo. Con un modello a scelta limitata (p. es. medico di famiglia o telemedicina) il cambio è possibile solo a fine anno."],["Attenzione","Premi o partecipazioni ai costi non pagati e sollecitati entro il 30 novembre: la disdetta ha effetto solo se li paga, con interessi di mora e spese d’esecuzione, entro il 31 dicembre (art. 64a LAMal)."],["Competenza","La cassa attuale e la nuova cassa. La Confederazione (UFSP) approva i premi."]],"steps":["Confrontare i premi 2027 su priminfo.admin.ch: indicare domicilio, età, franchigia e modello (p. es. medico di famiglia o telemedicina).","Scegliere la nuova cassa e richiedere l’assicurazione di base. Ogni cassa deve accettarLa, senza domande sulla salute, riserve o periodi d’attesa.","Disdire per scritto l’assicurazione di base attuale, meglio con raccomandata entro metà novembre.","Non disdire troppo in fretta l’assicurazione complementare: per questa la cassa può porre domande sulla salute e rifiutare. Il termine di disdetta è nelle condizioni d’assicurazione, spesso tre mesi per fine anno. La cassa non può disdirla perché Lei cambia l’assicurazione di base.","Attendere la conferma della nuova cassa: la vecchia assicurazione termina solo quando la nuova ha comunicato la copertura senza interruzioni. Se la comunicazione arriva in ritardo, la nuova cassa deve coprire la differenza di premio."],"who":[1,0,0],"note":"La legge (LAMal) e l’approvazione dei premi spettano alla Confederazione (UFSP). Disdetta e adesione avvengono direttamente con le casse malati, nessuna autorità le riceve.","src":["Priminfo (UFSP): FAQ, cambio della cassa malati","Priminfo (UFSP): calcolatore dei premi 2027","Priminfo (UFSP): premi 2027 per cantone","Fedlex: LAMal (RS 832.10), art. 7 e 64a"]},"biz":{"intro":"Chi a Berna si mette in proprio con una ditta individuale si annuncia prima come indipendente alla cassa di compensazione. L’iscrizione nel registro di commercio e all’IVA è obbligatoria solo da CHF 100’000 di cifra d’affari all’anno. Le pratiche si svolgono online su EasyGov.swiss, il portale della Confederazione.","facts":[["AVS","Annuncio alla cassa di compensazione della sede dell’impresa (Berna: AK Bern). Contributo del 10 % del reddito, meno sotto CHF 60’500; nel 2026 almeno CHF 530 all’anno."],["Registro di commercio","Obbligatorio da CHF 100’000 di cifra d’affari nell’ultimo esercizio, altrimenti facoltativo. Emolumento CHF 120. La ditta deve contenere il suo cognome."],["IVA","Obbligatoria da CHF 100’000 di cifra d’affari all’anno, o appena ciò è prevedibile all’avvio. Iscrizione presso l’AFC entro 30 giorni."],["Autorizzazione","Necessaria solo per determinate attività regolamentate. Da verificare prima di iniziare."]],"steps":["Aprire un conto su EasyGov.swiss, scegliere «ditta individuale» e definire la ditta con il suo cognome.","Annunciarsi come indipendente all’AK Bern, se possibile nel primo trimestre: online o con il modulo 318.146, con giustificativi come fatture, conto economico o pubblicità.","Da CHF 100’000 di cifra d’affari annua: iscrizione nel registro di commercio di Berna (CHF 120) e annuncio all’AFC per l’IVA entro 30 giorni.","Prima di iniziare, verificare se la sua attività richiede un’autorizzazione."],"who":[1,1,0],"note":"La cassa di compensazione e il registro di commercio sono cantonali (a Berna: AK Bern e registro di commercio del Cantone di Berna), l’IVA è riscossa dalla Confederazione (AFC). EasyGov.swiss è lo sportello online della Confederazione per tutti e tre.","src":["Portale PMI (SECO): ditta individuale","Registro di commercio di Berna: promemoria sull’iscrizione di una ditta individuale","Cassa di compensazione del Cantone di Berna: indipendenti","ahv-iv.ch: opuscolo 2.02, contributi degli indipendenti","AFC: assoggettamento all’IVA","EasyGov.swiss: fondare una ditta individuale"]},"drv":{"intro":"Chi abita in Svizzera può guidare con una patente estera solo per 12 mesi. Nel Cantone di Berna la cambia presso l’Ufficio della circolazione stradale (SVSA). Una patente tedesca, rilasciata nell’UE, non richiede una corsa di controllo; il cambio costa CHF 120.","facts":[["Termine","12 mesi dall’entrata secondo il permesso di dimora (art. 42 OAC). Presentare la domanda prima, per poter guidare senza interruzione. Il cambio è possibile anche dopo, ma con una possibile multa."],["Corsa di controllo","Nessuna per patenti dell’UE/AELS e di Andorra, Australia, Israele, Giappone, Canada, Corea del Sud, Marocco, Monaco, Nuova Zelanda, San Marino, Singapore, Taiwan, Tunisia e Stati Uniti. Tutti gli altri svolgono una corsa di controllo."],["Costi","Berna: cambio CHF 120, corsa di controllo categoria B CHF 132."],["Competenza","Ufficio della circolazione stradale e della navigazione del Cantone di Berna (SVSA), Schermenweg 5, Berna."]],"steps":["Fare un test della vista presso un ottico o un oculista riconosciuto.","Compilare e firmare il modulo di domanda dello SVSA e incollare una fototessera recente a colori (35 × 45 mm).","Consegnare la domanda di persona: presso una sede dello SVSA, il controllo abitanti del suo Comune o un posto di polizia del Cantone di Berna. Portare: patente estera originale e passaporto o carta d’identità.","Se necessario, svolgere la corsa di controllo. La patente svizzera le arriva per posta."],"who":[1,1,0],"note":"La Confederazione (USTRA) disciplina il cambio nell’ordinanza sull’ammissione alla circolazione; l’ufficio cantonale della circolazione (a Berna lo SVSA) esamina la domanda e rilascia la patente.","src":["Cantone di Berna (SVSA): cambio della patente estera","Cantone di Berna (SVSA): emolumenti","ch.ch: cambiare la licenza di condurre","USTRA: cambio delle patenti estere"]},"wed":{"intro":"Se siete entrambi svizzeri e abitate a Zurigo, prenotate prima online luogo e data presso l’ufficio dello stato civile della città di Zurigo, al più presto 12 mesi prima. La preparazione del matrimonio si svolge in due allo sportello dello Stadthaus, al più tardi 1 mese prima del matrimonio.","facts":[["Requisiti","Entrambi almeno 18 anni e capaci di discernimento. Parenti in linea retta, fratelli e sorelle, germani o consanguinei e uterini, non possono sposarsi tra loro."],["Termine","Invito alla preparazione al più presto 3 mesi prima del matrimonio. Concluderla al più tardi 1 mese prima, altrimenti la prenotazione viene annullata."],["Costi","Zurigo: matrimonio più economico allo Stadthaus da CHF 255, preparazione senza traduzione inclusa (solo con domicilio nella città di Zurigo)."],["Testimoni","Devono essere presenti due testimoni maggiorenni e capaci di discernimento."]],"steps":["Prenotare luogo e data sul sito dell’ufficio dello stato civile di Zurigo, al più presto 12 mesi prima.","Al più presto 3 mesi prima del matrimonio arriva un invito per e-mail. Con questo scegliete online un appuntamento per la preparazione.","Presentarsi in due allo sportello dello Stadthaus, con passaporto o carta d’identità. Compilate e firmate il modulo e stabilite i cognomi che porterete voi ed eventualmente i vostri figli.","Pagare gli emolumenti sul posto con carta o Twint. Al matrimonio portare due testimoni."],"who":[1,0,1],"note":"La Confederazione stabilisce le regole del matrimonio (CC) e gli emolumenti; a Zurigo la preparazione e la celebrazione spettano all’ufficio dello stato civile della città.","src":["Città di Zurigo: sposarsi con domicilio a Zurigo","Città di Zurigo: preparazione del matrimonio","Città di Zurigo: domande e risposte sul matrimonio","ch.ch: sposarsi in Svizzera"]},"dog":{"intro":"Nella città di Berna annuncia il suo cane ai servizi agli abitanti con il modulo di annuncio del cane. Se ha preso il cane da qualcun altro, annuncia il cambio di detentore alla banca dati AMICUS entro 10 giorni. La tassa sui cani è di CHF 150 all’anno.","facts":[["Annuncio","Ai servizi agli abitanti della città di Berna (Einwohnerdienste), Predigergasse 5, 3011 Berna. Il Comune la registra come detentore in AMICUS."],["Termine","Cambio di detentore (acquisto, presa in consegna, cessione per oltre 3 mesi) da annunciare ad AMICUS entro 10 giorni. Cani importati: far controllare e annunciare il microchip da un veterinario entro 10 giorni."],["Costi","Città di Berna: CHF 150 per cane all’anno, per cani da 6 mesi. La fattura arriva automaticamente in agosto."],["Microchip","Obbligatorio per ogni cane; cuccioli entro 3 mesi. Solo i veterinari impiantano il chip e annunciano il cane ad AMICUS."]],"steps":["Compilare il modulo della città di Berna per l’annuncio del cane e inviarlo per posta ai servizi agli abitanti.","Se il cane ha già un chip: annunciare il cambio di detentore ad AMICUS entro 10 giorni. Altrimenti: farlo microchippare da un veterinario.","Pagare la tassa sui cani quando arriva la fattura in agosto.","In caso di trasloco, cessione o morte del cane: informare il Comune e AMICUS."],"who":[1,0,1],"note":"La Confederazione prescrive il microchip e la registrazione in AMICUS (ordinanza sulle epizoozie); il Comune riceve l’annuncio e riscuote la tassa sui cani.","src":["Città di Berna: cani","Città di Berna: modulo di annuncio del cane","AMICUS: buono a sapersi (promemoria)","ch.ch: imposta sui cani"]},"fam":{"intro":"Se è dipendente nel Cantone di Berna, chiede gli assegni familiari al suo datore di lavoro. Lui trasmette la domanda alla sua cassa di compensazione per assegni familiari. L’assegno per i figli è di CHF 250 al mese per figlio (stato 2026).","facts":[["Importo","Cantone di Berna, stato 2026: assegno per i figli CHF 250 al mese fino al mese del 16° compleanno. Assegno di formazione CHF 310 per figli in formazione, al più presto da 15 anni, al più tardi fino a 25."],["Domanda","Dipendenti: presso il datore di lavoro. Persone senza attività lucrativa: presso la cassa di compensazione cantonale (AK Bern)."],["Termine","Nessun termine fisso; gli assegni dimenticati si possono chiedere fino a 5 anni a ritroso."],["Per figlio","Un solo assegno per figlio, anche se lavorano entrambi i genitori."]],"steps":["Chiedere al datore di lavoro il modulo di domanda per gli assegni familiari.","Compilare e firmare il modulo con i dati del figlio e dell’altro genitore.","Il datore di lavoro trasmette la domanda alla sua cassa di compensazione per assegni familiari e versa l’assegno.","Se lavorano entrambi i genitori: chiarire prima chi presenta la domanda, perché c’è un solo assegno per figlio."],"who":[1,1,0],"note":"La Confederazione fissa gli importi minimi (legge sugli assegni familiari), il Cantone di Berna versa il 115 % di questi importi; il pagamento avviene tramite la cinquantina di casse di compensazione per assegni familiari del Cantone.","src":["Portale per le famiglie del Cantone di Berna: assegni per i figli e di formazione","ch.ch: assegni familiari","ahv-iv.ch: opuscolo 6.08 assegni familiari","Cassa di compensazione del Cantone di Berna: assegni familiari"]},"debt":{"intro":"Nel Cantone di Berna ordina l’estratto del registro delle esecuzioni online presso l’ufficio cantonale d’esecuzione e fallimenti (be.ch/baka). Costa CHF 18 compreso l’invio e arriva in forma elettronica da scaricare.","facts":[["Costi","Cantone di Berna online: CHF 18 compreso l’invio (emolumento CHF 17 per estratto)."],["Contenuto","Le esecuzioni degli ultimi 5 anni nel rispettivo circondario."],["Trasloco","Chi negli ultimi 5 anni ha abitato altrove ordina un estratto anche lì, altrimenti quelle esecuzioni mancano."],["Invio","Ordinazione online solo elettronica: download su una piattaforma protetta, possibile più volte."]],"steps":["Ordinare online su be.ch/baka l’estratto del registro delle esecuzioni a proprio nome.","Tenere pronto un documento d’identità valido: carta d’identità, passaporto o permesso per stranieri.","Pagare l’emolumento al momento dell’ordinazione: carta, PostFinance Pay o Twint.","Scaricare l’estratto dalla piattaforma protetta e trasmetterlo, ad esempio al locatore."],"who":[1,1,0],"note":"La Confederazione disciplina il diritto esecutivo (LEF) e gli emolumenti; nel Cantone di Berna l’ufficio cantonale d’esecuzione e fallimenti (BAKA) tiene i registri.","src":["Cantone di Berna (BAKA): ordinare l’estratto delle esecuzioni","ch.ch: ordinare un estratto del registro delle esecuzioni","Cantone di Berna: ordinazione online dell’estratto (comunicato)"]},"crim":{"intro":"L’estratto del casellario giudiziale (estratto per privati) si ordina presso la Confederazione, online su strafregister.admin.ch o allo sportello della Posta. Costa CHF 17 e arriva per posta circa 10 giorni lavorativi dopo la ricezione del modulo firmato.","facts":[["Costi","CHF 17 per l’estratto. Autenticazione o apostille: CHF 20 in più."],["Durata","Circa 10 giorni lavorativi dopo la ricezione del modulo firmato."],["Ordinazione","Online su strafregister.admin.ch o di persona allo sportello della Posta con un documento d’identità valido."],["Estratto specifico","Per attività con minorenni esiste un estratto distinto, l’estratto specifico per privati."]],"steps":["Su strafregister.admin.ch scegliere l’estratto per privati e inserire dati personali, indirizzo e pagamento.","Pagare l’emolumento online: carta di debito o di credito, PostFinance Card o Twint.","Stampare il modulo, firmarlo e inviarlo per posta con una copia del documento d’identità.","In alternativa: ordinarlo allo sportello della Posta con passaporto, carta d’identità o permesso per stranieri e pagare subito."],"who":[1,0,0],"note":"Il casellario giudiziale è tenuto dalla Confederazione (Ufficio federale di giustizia). Si ordina direttamente presso la Confederazione o a uno sportello della Posta.","src":["Ufficio federale di giustizia: ordinare l’estratto","Ufficio federale di giustizia: FAQ estratto per privati","ch.ch: estratto del casellario giudiziale"]},"car":{"intro":"Nel Cantone di Berna immatricola l’auto presso l’Ufficio della circolazione stradale (SVSA), per posta o allo sportello. Prima la sua assicurazione invia l’attestato d’assicurazione per via elettronica all’ufficio. La licenza di circolazione costa CHF 45 per posta o CHF 55 allo sportello.","facts":[["Documenti","Attestato d’assicurazione (inviato dall’assicurazione all’ufficio per via elettronica), licenza di circolazione del detentore precedente, rapporto di collaudo se l’auto è stata controllata, documento d’identità."],["Costi","Licenza di circolazione: CHF 45 per posta, CHF 55 allo sportello. Nuove targhe: CHF 45 la coppia, CHF 30 una sola."],["Termine","L’attestato d’assicurazione vale 30 giorni. L’imposta sui veicoli va pagata entro 30 giorni dalla fattura."],["Imposta","Imposta annuale sui veicoli, fatturata a gennaio o all’immatricolazione. L’importo lo mostra il calcolatore dello SVSA."]],"steps":["Stipulare un’assicurazione di responsabilità civile. L’assicurazione invia l’attestato d’assicurazione allo SVSA per via elettronica.","Compilare il modulo di domanda d’immatricolazione di un veicolo.","Inviare il modulo con la licenza di circolazione del detentore precedente, l’eventuale rapporto di collaudo e un documento d’identità allo SVSA, Schermenweg 5, 3001 Berna, o consegnarlo allo sportello.","Per posta la nuova licenza di circolazione arriva dopo alcuni giorni lavorativi. Poi pagare la fattura dell’imposta sui veicoli entro 30 giorni."],"who":[1,1,0],"note":"La Confederazione disciplina l’ammissione dei veicoli; l’ufficio cantonale della circolazione (a Berna lo SVSA) rilascia licenza di circolazione e targhe e riscuote l’imposta sui veicoli.","src":["Cantone di Berna (SVSA): immatricolare un veicolo","Cantone di Berna (SVSA): procedura d’immatricolazione","Cantone di Berna (SVSA): documenti per l’immatricolazione","Cantone di Berna (SVSA): calcolare l’imposta sui veicoli","ch.ch: immatricolare un veicolo"]},"nat":{"intro":"I requisiti di residenza li soddisfa: 10 anni in Svizzera, permesso C e almeno 2 anni nel Cantone e nel Comune. Si aggiungono certificato linguistico, test di naturalizzazione e integrazione. La domanda si presenta alla città di Berna; per una persona sola Comune, Cantone e Confederazione costano insieme CHF 1’650.","facts":[["Requisiti","Permesso C, in totale 10 anni in Svizzera, almeno 2 anni senza interruzione nel Cantone di Berna e nel Comune, integrazione riuscita."],["Lingua","Cantone di Berna: orale B1, scritto A2. Nessun certificato se la lingua ufficiale è la sua lingua madre o se ha frequentato almeno 5 anni di scuola dell’obbligo in quella lingua."],["Test","Scritto, 90 minuti: geografia, storia, democrazia, salute e lavoro, diritti e doveri. È esonerato, tra gli altri, chi ha frequentato almeno 5 anni di scuola dell’obbligo in Svizzera."],["Costi","Persona sola nella città di Berna: Comune CHF 400, Cantone CHF 1’150, Confederazione CHF 100. Coppia sposata: 600, 1’725 e 150."]],"steps":["Rivolgersi al Comune di domicilio (città di Berna). Le consegna i moduli e indica i documenti necessari.","Procurarsi il certificato linguistico (B1 orale, A2 scritto), se non ne è esonerato.","Presentare la domanda completa al Comune e sostenere il test di naturalizzazione, se non ne è esonerato.","Il Comune le fattura gli emolumenti di Comune e Cantone; la Confederazione (SEM) decide sull’autorizzazione federale di naturalizzazione."],"who":[1,1,1],"note":"Naturalizzarsi significa acquisire tre cittadinanze: Comune, Cantone e Confederazione esaminano ciascuno la propria parte. La domanda passa dal Comune di domicilio, la Segreteria di Stato della migrazione (SEM) rilascia l’autorizzazione federale.","src":["Cantone di Berna: soggiorno in Svizzera (naturalizzazione)","Cantone di Berna: conoscenze linguistiche e certificato","Cantone di Berna: test di naturalizzazione","Cantone di Berna: emolumenti di naturalizzazione","SEM: naturalizzazione ordinaria"]},"pv":{"intro":"Nel Cantone di Berna il Cantone verifica di regola automaticamente il suo diritto alla riduzione dei premi, sulla base dei dati fiscali definitivi dei due anni precedenti. Nel 2026 il limite è di CHF 35’000 di reddito determinante, per famiglie con figli di CHF 45’000. Una domanda la presenta solo in casi particolari.","facts":[["Limite 2026","Reddito determinante al massimo CHF 35’000; famiglie con figli al massimo CHF 45’000."],["Verifica","Automatica, sulla base dei dati fiscali definitivi dei due anni precedenti (reddito netto e sostanza)."],["Domanda","Solo in casi particolari, ad esempio se la verifica automatica non è possibile o se reddito o famiglia cambiano in modo duraturo e marcato. Possibile anche online."],["Calcolatore","Stima non vincolante con il calcolatore online su be.ch/pvo-onlinerechner."]],"steps":["Verificare con il calcolatore online su be.ch/pvo-onlinerechner se un diritto è possibile.","Presentare la dichiarazione d’imposta: la verifica automatica richiede dati fiscali definitivi.","Se reddito o famiglia sono cambiati in modo duraturo e marcato: presentare una domanda, anche online.","Se il diritto c’è, il Cantone versa la riduzione direttamente alla sua cassa malati e la fattura dei premi diminuisce."],"who":[1,1,0],"note":"La Confederazione prescrive la riduzione dei premi nella legge sull’assicurazione malattie e vi contribuisce; nel Cantone di Berna verifica e decide l’Ufficio delle assicurazioni sociali (ASV).","src":["Cantone di Berna (ASV): diritto alla riduzione dei premi","Cantone di Berna (ASV): quando presentare una domanda","Cantone di Berna (ASV): foglio informativo riduzione dei premi 2026","Cantone di Berna (ASV): calcolare il diritto"]},"wpe":{"intro":"Sì. Chi non presta, o non presta interamente, il servizio militare o civile paga la tassa d’esenzione dall’obbligo militare: il 3 % del reddito imponibile dell’imposta federale diretta, almeno CHF 400 all’anno. Nel Cantone di Berna è competente l’Ufficio della protezione della popolazione, dello sport e degli affari militari (BSM).","facts":[["Importo","3 % del reddito imponibile dell’imposta federale diretta, almeno CHF 400 all’anno."],["Durata","Dai 19 ai 37 anni, al massimo 11 anni di tassa."],["Protezione civile","Chi presta servizio di protezione civile paga comunque, ma il 4 % in meno per ogni giorno di servizio prestato nell’anno."],["Rimborso","Chi recupera il servizio militare o civile e adempie l’obbligo di servizio ottiene il rimborso. Il diritto si prescrive 5 anni dopo la fine dell’obbligo militare."]],"steps":["Presentare la dichiarazione d’imposta come di consueto: la tassa si calcola sul reddito imponibile dell’imposta federale diretta.","La fattura arriva dal servizio cantonale, nel Cantone di Berna dal BSM.","In caso di disabilità importante e reddito basso: far verificare un’esenzione.","Servizio recuperato: una volta adempiuto l’obbligo di servizio, chiedere il rimborso al BSM."],"who":[1,1,0],"note":"La tassa d’esenzione è un tributo federale (AFC); i Cantoni, a Berna l’Ufficio della protezione della popolazione, dello sport e degli affari militari, la tassano e la riscuotono.","src":["AFC: la tassa d’esenzione spiegata","Cantone di Berna (BSM): tassa d’esenzione","Cantone di Berna (BSM): rimborso","ch.ch: tassa d’esenzione dall’obbligo militare"]}}},"en":{"ask_label":"What would you like to know?","send":"Send question","nav":["Citizen view","Authority view","Project","Home","Menu","Pages"],"f_links":["Contact","Authority view","Citizen view","Project"],"f_sender":"Private concept by Bilal Simsek, Bern. Not an offer by any authority. Feedback welcome: {c}","f_legal":"Privacy, terms of use and accessibility are not worked out in the concept. The prototype collects no personal data, sets no cookies and uses no analytics tools; the browser only remembers locally that you have read the notice.","f_note":"Concept prototype. All answers are examples and do not replace information from an authority.","banner_s":"Concept prototype, not an official site","skip":"Skip to content","chips":[{"l":"Report a move","q":"I'm moving from Bern to Winterthur: how and by when do I deregister and register?"},{"l":"Passport & ID","q":"I live in Bern and need a new passport and an ID card. How and where do I order them?"},{"l":"Tax return deadline","q":"I live in Bern and can't finish my tax return by mid-March. How do I extend the deadline and what does it cost?"},{"l":"AHV/AVS pension","q":"I was born in 1962 and live in Thun: when and where do I claim my AHV/AVS pension?"},{"l":"Register as unemployed","q":"I live in Thun and lose my job at the end of the month. Where and when do I have to register, and how do I get unemployment benefit?"},{"l":"Switch health insurer","q":"By when can I switch my health insurer and how does it work?"},{"l":"Sole proprietorship","q":"I live in Bern and am going self-employed with a sole proprietorship. What do I need to register, and where?"},{"l":"Exchange driving licence","q":"I have lived in Bern for a few months and have a German driving licence. Do I need to exchange it, and how?"},{"l":"Getting married","q":"We are both Swiss, live in Zurich and want to get married. How does it work and what does it cost?"},{"l":"Register a dog","q":"I live in the City of Bern and have taken over a dog. Where do I register it and what does it cost?"},{"l":"Child allowance","q":"I am employed in Bern and just had a baby. How do I get child allowance and how much is it?"},{"l":"Debt record extract","q":"I live in Bern and need a debt enforcement register extract for a new flat. Where do I order it and what does it cost?"},{"l":"Criminal record extract","q":"I need a criminal record extract for a new job. How do I order it and how long does it take?"},{"l":"Register a car","q":"I live in Bern and bought a used car. How do I register it and what does it cost?"},{"l":"Naturalisation","q":"I have lived in Switzerland for 12 years, 3 of them in the City of Bern, and have a C permit. Can I become Swiss and what does it cost?"},{"l":"Premium reduction","q":"I live in the canton of Bern and earn little. Am I entitled to a health insurance premium reduction and do I need to apply?"},{"l":"Military exemption tax","q":"I am 22, live in Bern and was declared unfit for military service. Do I have to pay the exemption tax, and how much?"}],"think":"Tell is checking official sources","who":"Responsible","bund":"Federal","kanton":"Canton","gemeinde":"Municipality","src":"Sources","glance":"At a glance","stand":"As of October 2026 · Sample answer from public sources, without guarantee. The responsible offices are authoritative.","newtab":"opens in a new tab","newq":"New question","fb":{"intro":"The prototype has no answer to this yet. The real version would search official sources from federal, cantonal and municipal governments here. It already answers seventeen examples: moving, passport and ID, tax return, AHV/AVS pension, unemployment, switching health insurer, starting a sole proprietorship exchanging a foreign driving licence, getting married, registering a dog, family allowances, the debt enforcement extract, the criminal record extract, registering a car, naturalisation, premium reduction and the military service exemption tax. Try one of them."},"ans":{"move":{"intro":"You register at your new place of residence within 14 days. From Bern to Winterthur this works online via eUmzugCH: both municipalities are connected, so you do not need to go to a counter.","facts":[["Deadline","14 days from the change of address (Art. 11 Register Harmonisation Act)"],["Cost","Winterthur: CHF 40 per adult; eUmzugCH costs no more than the counter"],["Counter","Not needed, everything is done online"],["Responsible","Bern residents' services (deregistration), Winterthur residents' registry (registration)"]],"steps":["On eumzug.swiss, enter your old address (Bern) and your new address (Winterthur) and start the check.","Have ready: passport or ID card, AHV/AVS number (13 digits), rental contract or move-in confirmation, card or Twint for CHF 40.","Have your health insurance card or policy ready: Winterthur requires this proof at registration.","Complete deregistration in Bern and registration in Winterthur online; a visit to the counter in Bern is not necessary.","Tax office: Winterthur receives the new address automatically; you are liable to tax there from 1 January of the year of arrival."],"who":[1,1,1],"note":"The municipalities (Bern, Winterthur) handle deregistration and registration, eUmzugCH is the joint service of the federal government, cantons and municipalities, and taxes are levied by the canton of Zurich together with the city of Winterthur.","src":["eUmzugCH – report your move online (federal government, cantons, municipalities)","City of Winterthur – moving and arriving in Winterthur","City of Bern – arrival, moving and departure","City of Winterthur – taxes when moving, arriving and leaving"]},"passport":{"intro":"As an adult living in Bern, you apply for a passport and/or ID card online at schweizerpass.ch and then go to your booked appointment, e.g. at the ID document centre in Bern (Laupenstrasse 18A). The combined passport + ID card costs CHF 158 and is valid for 10 years.","facts":[["Cost","Adults: ID card CHF 70, passport CHF 145, combination CHF 158. Children up to 18: ID 35, passport 65, combination 78 (postage included)."],["Validity","Adults 10 years, children and young people up to 18: 5 years. Extending is not possible, you order a new one."],["Duration","Delivery within 10 working days after the appointment at the latest, by registered mail."],["Appointment","Mandatory, you must appear in person (photo, fingerprints for the passport)."],["New from November","From 2 November 2026 a biometric ID card with a chip (facial image and two fingerprints) is also available. Optional, same fee as today. The provisional passport will then be called «emergency passport»."]],"steps":["Fill in the online application at schweizerpass.ch (personal e-mail address required). After review, you receive an e-mail to choose an appointment.","Book an appointment at one of the 7 ID document centres in the canton of Bern (mandatory): online or by phone on 031 635 40 00, Mon–Fri.","Bring your old document, but no passport photo: the photo is taken on site.","Pay the fee on site (card, Twint or cash). Children come with a legal guardian and their ID.","The document arrives within 10 working days by registered mail at the address you gave."],"who":[1,1,0],"note":"The federal government (fedpol) publishes prices, validity and delivery times; in the canton of Bern, the seven cantonal ID document centres record your data.","src":["fedpol: prices, validity and delivery times","Canton of Bern: ID documents, prices and validity","Canton of Bern: ID document centres and appointments","Canton of Bern: attending the appointment, documents to bring","Federal Council: biometric ID card from 2.11.2026 (press release 26.8.2026)"]},"tax":{"intro":"In the canton of Bern, the tax return is generally due on 15 March; online you can extend it free of charge until 15 July, and until 15 November at the latest. For tax period 2025, because of an IT outage, 30 November 2026 applies exceptionally as the final deadline.","facts":[["Deadline","Bern: 15 March (self-employed: 15 May). Zurich and Geneva: 31 March."],["Cost","Bern online: free until 15 July, CHF 20 until 15 Sept., CHF 40 until 15 Nov. In writing/by phone: CHF 20/40/60. Geneva: CHF 20/40/60."],["Duration","Bern: until 15 Nov. at the latest; 2025 return exceptionally until 30 Nov. 2026 (IT outage)."],["Responsible","Bern: cantonal tax administration. Zurich: municipal tax office. Geneva: Administration fiscale cantonale."]],"steps":["Have the letter about the tax return, your salary certificate (from your employer) and supporting documents ready.","Before the deadline, in BE-Login (with AGOV): “Fristverlängerung erfassen” (record extension), choose the new deadline and confirm.","Save the confirmation yourself: none is sent by post or e-mail.","Fill in the return in TaxMe-Online and submit it with supporting documents (or hand it in printed at your municipality of residence).","Too late? A reminder fee of CHF 60 is possible; once the reminder period has expired, no extension is possible any more."],"who":[1,1,1],"note":"The cantonal tax administration receives your return and also assesses the direct federal tax on behalf of the federal government (supervised by the FTA); the municipality sets its own tax rate.","src":["Canton of Bern: extending the deadline as a private individual","Canton of Bern: guidance, filing deadline","Canton of Zurich: tax return for private individuals","Canton of Geneva: request an extension"]},"ahv":{"intro":"A man born in 1962 who lives in Thun reaches the reference age of 65 in 2027 and claims his pension from the compensation office 3–4 months earlier. With a birthday on 15 March 2027, the pension starts on 1 April 2027; the claim is filed from about December 2026.","facts":[["Reference age","Men 65. Women: born 1961 = 64 y 3 m, 1962 = 64 y 6 m, 1963 = 64 y 9 m, from 1964 = 65. Pension from the following month."],["Deadline","Claim 3–4 months before the pension starts. Early drawing from 63 (–6.8 % for 1 year), deferral 1–5 years (+5.2 % to +31.5 %)."],["Pension","From 2027, with a full contribution period CHF 1,280 to 2,560 per month; couple at most CHF 3,840. Plus the 13th pension from December 2026."],["Responsible","The compensation office your employer is affiliated with (in the canton of Bern e.g. the Bern compensation office, AK Bern)."]],"steps":["Find out which compensation office is responsible: employees ask their employer, self-employed people the office they last settled with.","Fill in and submit form 318.370 “Claim for an old-age pension” online 3–4 months before the pension starts.","Early drawing: apply by the end of the previous month at the latest. Deferral: tick the box on the form no later than 1 year after the reference age.","Upload the enclosures with the form or send them by post; the compensation office obtains the documents needed and calculates the pension.","Paid monthly (AK Bern: 4th working day, e.g. 4 December 2026); the 13th pension in December comes without an application."],"who":[1,1,0],"note":"The federal government (FSIO) sets the rules and publishes the leaflets; the compensation office (in the canton of Bern, AK Bern) receives your claim, calculates and pays the pension.","src":["Bern compensation office: AHV/AVS old-age pension","ahv-iv.ch: Leaflet 3.01 Old-age pensions (as of 1.1.2026)","ch.ch: Retirement – from when?","FSIO: Stabilising the AHV (AHV 21)","Federal Council: AHV/IV pensions rise on 1.1.2027 (2.10.2026)"]},"alv":{"intro":"Register at the RAV (regional employment centre) in your region no later than the first day for which you want unemployment benefit, fastest online in Job-Room. Example in Thun: aged 30, monthly salary of 6,500 francs, no children, 14 months of contributions gives 70 %, at most 260 daily allowances and 10 waiting days.","facts":[["Deadline","Register with the RAV no later than the 1st day of unemployment, better still during the notice period."],["Amount","70 % of insured earnings. 80 % with children under 25, earnings up to 3,797 francs or a disability pension of 40 % or more."],["Duration","At least 12 months of contributions within 2 years. 260 daily allowances, more with a longer contribution period. Framework period: 2 years."],["Responsible","RAV (registration, counselling) and the unemployment fund you choose (payment)."]],"steps":["Register online: use the e-service for registering with the RAV in Job-Room, or go in person to the RAV in your region.","Look for work already during the notice period and document every application. Your RAV sets how many.","Choose an unemployment fund, submit the “application for unemployment benefit” and employer certificates (2 years).","First interview at the RAV (invitation within 15 days): bring your AHV/AVS or health insurance card, ID and proof of your job search efforts.","Submit the “information from the insured person” form every month. Daily allowances usually follow in the next month."],"who":[1,1,0],"note":"SECO supervises unemployment insurance; RAV, unemployment funds and cantonal offices carry it out; you register directly with the RAV.","src":["arbeit.swiss: registration","arbeit.swiss (SECO): FAQ on unemployment benefit","ch.ch: Unemployment in Switzerland","Fedlex: Unemployment Insurance Act (AVIG, SR 837.0), Art. 9, 17, 18, 22, 27"]},"kk":{"intro":"You can switch your basic health insurance for the end of the year if your insurer receives your cancellation by Monday, 30 November 2026. The new insurer must accept you without health questions. The 2027 premiums are already in the premium calculator on priminfo.admin.ch.","facts":[["Deadline","Your insurer must receive the cancellation by the last working day of November (2026: Monday, 30 November). Receipt counts, not the postmark. Recommended: send it by registered mail by mid-November."],["Franchise","Adults: CHF 300 or, optionally, 500, 1,000, 1,500, 2,000, 2,500, plus 10 % co-payment, at most CHF 700 a year. Children: no franchise, co-payment at most CHF 350."],["Changing franchise","Lower franchise: tell the insurer in writing by the last working day of November. Higher franchise: only from the start of a year; the law sets no deadline, Priminfo recommends telling the insurer by mid-December."],["Mid-year","Switching on 1 July is only possible with the standard CHF 300 franchise and free choice of provider, with notice by 31 March. With a restricted-choice model (e.g. family doctor or telemedicine) you can only switch at year-end."],["Caution","Unpaid premiums or cost shares reminded by 30 November: your notice only takes effect if you pay them, with default interest and debt-collection costs, by 31 December (Art. 64a KVG)."],["Responsible","Your current and your new insurer. The federal government (FOPH) approves the premiums."]],"steps":["Compare the 2027 premiums on priminfo.admin.ch: enter your place of residence, age, franchise and model (e.g. family doctor or telemedicine).","Choose the new insurer and apply for basic insurance. Every insurer must accept you, with no health questions, reservations or waiting periods.","Cancel your current basic insurance in writing, ideally by registered mail by mid-November.","Do not cancel supplementary insurance too quickly: for it, insurers may ask health questions and decline you. The notice period is in the policy terms, often three months to the end of the year. Your insurer may not cancel it just because you switch your basic insurance.","Wait for the new insurer’s confirmation: your old cover only ends once the new insurer has reported uninterrupted cover. If that report is late, the new insurer must cover the premium difference."],"who":[1,0,0],"note":"The law (KVG/LAMal) and premium approval are federal matters (FOPH). Cancellation and joining go directly through the insurers, no authority receives them.","src":["Priminfo (FOPH): FAQ, switching health insurer","Priminfo (FOPH): premium calculator 2027","Priminfo (FOPH): 2027 premiums by canton","Fedlex: KVG (SR 832.10), Art. 7 and 64a"]},"biz":{"intro":"If you go self-employed in Bern with a sole proprietorship, you first register as self-employed with the compensation office (AHV). The commercial register and VAT only become mandatory from CHF 100,000 turnover a year. You can do the registrations online on EasyGov.swiss, the federal portal.","facts":[["AHV","Register with the compensation office at your business location (Bern: AK Bern). Contribution 10 % of income, less below CHF 60,500; in 2026 at least CHF 530 a year."],["Commercial register","Mandatory from CHF 100,000 turnover in the last financial year, otherwise voluntary. Fee CHF 120. The business name must contain your surname."],["VAT","Mandatory from CHF 100,000 turnover a year, or as soon as that is foreseeable at the start. Register with the FTA within 30 days."],["Permit","Only needed for certain regulated activities. Check before you start."]],"steps":["Open an account on EasyGov.swiss, choose «sole proprietorship» and set the business name with your surname.","Register as self-employed with AK Bern, ideally in the first quarter: online or with form 318.146, with proof such as invoices, an income statement or advertising.","From CHF 100,000 annual turnover: entry in the Bern commercial register (CHF 120) and VAT registration with the FTA within 30 days.","Before you start, check whether your activity needs a permit."],"who":[1,1,0],"note":"The compensation office and the commercial register are cantonal (in Bern: AK Bern and the commercial register office of the canton of Bern), VAT is levied by the federal government (FTA). EasyGov.swiss is the federal online counter for all three.","src":["SME portal (SECO): sole proprietorship","Bern commercial register: leaflet on registering a sole proprietorship","Compensation office of the canton of Bern: self-employed","ahv-iv.ch: leaflet 2.02, contributions of the self-employed","FTA: VAT liability","EasyGov.swiss: found a sole proprietorship"]},"drv":{"intro":"If you live in Switzerland, you can drive on a foreign licence for 12 months only. In the canton of Bern you exchange it at the road traffic office (SVSA). A German licence, issued in the EU, needs no test drive; the exchange costs CHF 120.","facts":[["Deadline","12 months from entry as stated in your residence permit (Art. 42 VZV). Apply before then so you can keep driving without a break. Exchanging later is still possible, but you may be fined."],["Test drive","None for licences from the EU/EFTA and from Andorra, Australia, Israel, Japan, Canada, South Korea, Morocco, Monaco, New Zealand, San Marino, Singapore, Taiwan, Tunisia and the USA. Everyone else takes a test drive."],["Costs","Bern: exchange CHF 120, test drive category B CHF 132."],["Responsible","Road Traffic and Navigation Office of the canton of Bern (SVSA), Schermenweg 5, Bern."]],"steps":["Have an eyesight test done by a recognised optician or eye doctor.","Fill in and sign the SVSA application form and attach a recent colour passport photo (35 × 45 mm).","Hand in the application in person: at an SVSA office, your municipality’s residents’ office or a police station in the canton of Bern. Bring your original foreign licence and your passport or ID card.","Take the test drive if required. Your Swiss licence arrives by post."],"who":[1,1,0],"note":"The federal government (FEDRO) sets the rules for the exchange in the traffic licensing ordinance; the cantonal road traffic office (in Bern the SVSA) checks the application and issues the licence.","src":["Canton of Bern (SVSA): exchanging a foreign licence","Canton of Bern (SVSA): fees","ch.ch: exchanging your driving licence","FEDRO: exchanging foreign driving licences"]},"wed":{"intro":"If you are both Swiss and live in Zurich, you first book the venue and date online with the civil registry office of the City of Zurich, at the earliest 12 months ahead. You do the marriage preparation together at the counter in the Stadthaus, at the latest 1 month before the wedding.","facts":[["Requirements","Both at least 18 and capable of judgement. Relatives in direct line, siblings and half-siblings may not marry each other."],["Deadline","Invitation to the marriage preparation at the earliest 3 months before the wedding. Complete it at the latest 1 month before, or the booking is cancelled."],["Costs","Zurich: cheapest wedding at the Stadthaus from CHF 255, including marriage preparation without translation (only if you live in the City of Zurich)."],["Witnesses","Two adult witnesses capable of judgement must be present."]],"steps":["Book the venue and date on the website of the Zurich civil registry office, at the earliest 12 months ahead.","At the earliest 3 months before the wedding you get an email invitation. Use it to choose an appointment for the marriage preparation online.","Come together to the counter in the Stadthaus with your passport or ID card. You fill in and sign the form and decide which surnames you and any children will have.","Pay the fees on site by card or Twint. Bring two witnesses to the wedding."],"who":[1,0,1],"note":"The federal government sets the rules on marriage (Civil Code) and the fees; in Zurich the city’s civil registry office handles the preparation and the wedding.","src":["City of Zurich: marrying with residence in Zurich","City of Zurich: marriage preparation","City of Zurich: questions and answers on marriage","ch.ch: getting married in Switzerland"]},"dog":{"intro":"In the City of Bern you register your dog with the residents’ services, using the dog registration form. If you took the dog over from someone, you report the change of owner to the AMICUS database within 10 days. The dog tax is CHF 150 a year.","facts":[["Registration","With the residents’ services of the City of Bern (Einwohnerdienste), Predigergasse 5, 3011 Bern. The municipality registers you as the owner in AMICUS."],["Deadline","Report a change of owner (purchase, takeover, handing over for more than 3 months) to AMICUS within 10 days. Imported dogs: have a vet check and report the microchip within 10 days."],["Costs","City of Bern: CHF 150 per dog and year, for dogs from 6 months. The bill arrives automatically in August."],["Microchip","Mandatory for every dog; puppies within 3 months. Only vets implant the chip and register the dog with AMICUS."]],"steps":["Fill in the City of Bern dog registration form and post it to the residents’ services.","If the dog already has a chip: report the change of owner to AMICUS within 10 days. If not: have it chipped by a vet.","Pay the dog tax when the bill arrives in August.","If you move, give the dog away or it dies: inform the municipality and AMICUS."],"who":[1,0,1],"note":"The federal government requires the microchip and registration in AMICUS (Animal Diseases Ordinance); the municipality takes the registration and levies the dog tax.","src":["City of Bern: dogs","City of Bern: dog registration form","AMICUS: good to know (leaflet)","ch.ch: dog tax"]},"fam":{"intro":"If you are employed in the canton of Bern, you apply for family allowances through your employer. They pass the application to their family compensation fund. The child allowance is CHF 250 a month per child (as of 2026).","facts":[["Amount","Canton of Bern, as of 2026: child allowance CHF 250 a month up to the month of the 16th birthday. Training allowance CHF 310 for children in education, from 15 at the earliest, until 25 at the latest."],["Application","Employees: through the employer. People without gainful employment: with the cantonal compensation office (AK Bern)."],["Deadline","No fixed deadline; allowances you missed can be claimed up to 5 years back."],["Per child","Only one allowance per child, even if both parents work."]],"steps":["Ask your employer for the family allowance application form.","Fill in and sign the form with the details of the child and the other parent.","Your employer passes the application to their family compensation fund and pays out the allowance.","If both parents work: agree first who applies, as there is only one allowance per child."],"who":[1,1,0],"note":"The federal government sets the minimum amounts (Family Allowances Act), the canton of Bern pays 115 % of them; payment runs through the roughly 50 family compensation funds in the canton.","src":["Bern family portal: child and training allowances","ch.ch: family allowances","ahv-iv.ch: leaflet 6.08 family allowances","Compensation office of the canton of Bern: family allowances"]},"debt":{"intro":"In the canton of Bern you order the debt enforcement register extract online from the cantonal debt enforcement and bankruptcy office (be.ch/baka). It costs CHF 18 including delivery and comes electronically as a download.","facts":[["Costs","Canton of Bern online: CHF 18 including delivery (fee CHF 17 per extract)."],["Content","Debt enforcement proceedings of the last 5 years in that district."],["Moving","If you lived elsewhere in the last 5 years, order an extract there too, or those proceedings are missing."],["Delivery","Online orders are fully electronic: download from a secure platform, possible several times."]],"steps":["Order your own debt enforcement register extract online at be.ch/baka.","Have a valid ID ready: ID card, passport or foreign national ID card.","Pay the fee when ordering: card, PostFinance Pay or Twint.","Download the extract from the secure platform and pass it on, for example to your landlord."],"who":[1,1,0],"note":"The federal government sets the debt enforcement law (SchKG) and the fees; in the canton of Bern the cantonal debt enforcement and bankruptcy office (BAKA) keeps the registers.","src":["Canton of Bern (BAKA): ordering a debt enforcement extract","ch.ch: ordering a debt enforcement register extract","Canton of Bern: online ordering of the extract (press release)"]},"crim":{"intro":"You order the criminal record extract (private extract) from the federal government, online at strafregister.admin.ch or at a post office counter. It costs CHF 17 and arrives by post about 10 working days after your signed form is received.","facts":[["Costs","CHF 17 for the private extract. Certification or apostille: CHF 20 extra."],["Duration","About 10 working days after your signed form is received."],["Ordering","Online at strafregister.admin.ch or in person at a post office counter with valid ID."],["Special extract","For work with minors there is a separate extract, the special private extract."]],"steps":["On strafregister.admin.ch choose the private extract and enter your personal details, address and payment details.","Pay the fee online: debit or credit card, PostFinance Card or Twint.","Print the form, sign it and post it with a copy of your ID.","Alternatively: order at a post office counter with your passport, ID card or foreign national ID card and pay on the spot."],"who":[1,0,0],"note":"The criminal record is kept by the federal government (Federal Office of Justice). You order directly from the federal government or at a post office counter.","src":["Federal Office of Justice: ordering the private extract","Federal Office of Justice: FAQ private extract","ch.ch: criminal record extract"]},"car":{"intro":"In the canton of Bern you register the car with the road traffic office (SVSA), by post or at the counter. First your insurer sends the proof of insurance to the office electronically. The vehicle registration document costs CHF 45 by post or CHF 55 at the counter.","facts":[["Documents","Proof of insurance (sent electronically by your insurer to the office), the previous owner’s vehicle registration document, inspection report if the car was inspected, ID."],["Costs","Registration document: CHF 45 by post, CHF 55 at the counter. New number plates: CHF 45 a pair, CHF 30 for one."],["Deadline","The proof of insurance is valid for 30 days. The motor vehicle tax is due within 30 days of the bill."],["Tax","Annual motor vehicle tax, billed in January or on registration. The SVSA calculator shows the amount."]],"steps":["Take out third-party liability insurance. The insurer sends the proof of insurance to the SVSA electronically.","Fill in the vehicle registration application form.","Post the form with the previous owner’s registration document, any inspection report and your ID to SVSA, Schermenweg 5, 3001 Bern, or hand it in at the counter.","By post it takes a few working days for the new registration document to arrive. Then pay the motor vehicle tax bill within 30 days."],"who":[1,1,0],"note":"The federal government sets the rules for vehicle registration; the cantonal road traffic office (in Bern the SVSA) issues the registration document and number plates and levies the motor vehicle tax.","src":["Canton of Bern (SVSA): registering a vehicle","Canton of Bern (SVSA): how to register your vehicle","Canton of Bern (SVSA): documents for registration","Canton of Bern (SVSA): calculating vehicle tax","ch.ch: registering a vehicle"]},"nat":{"intro":"You meet the residence conditions: 10 years in Switzerland, a C permit and at least 2 years in the canton and the municipality. Language proof, the naturalisation test and integration come on top. You apply to the City of Bern; for a single person, municipality, canton and federal government cost CHF 1,650 together.","facts":[["Requirements","C permit, 10 years in Switzerland in total, at least 2 uninterrupted years each in the canton of Bern and the municipality, successful integration."],["Language","Canton of Bern: spoken B1, written A2. No proof needed if the official language is your mother tongue or you attended at least 5 years of compulsory school in that language."],["Test","Written, 90 minutes: geography, history, democracy, health and work, rights and duties. Exempt, among others: anyone who attended at least 5 years of compulsory school in Switzerland."],["Costs","Single person in the City of Bern: municipality CHF 400, canton CHF 1,150, federal government CHF 100. Married couple: 600, 1,725 and 150."]],"steps":["Contact your municipality (City of Bern). It gives you the forms and tells you which documents you need.","Get your language certificate (spoken B1, written A2) unless you are exempt.","Hand in the complete application to the municipality and take the naturalisation test unless you are exempt.","The municipality bills you for the municipal and cantonal fees; the federal government (SEM) decides on the federal naturalisation permit."],"who":[1,1,1],"note":"Naturalisation means acquiring three citizenships: municipality, canton and federal government each check their part. The application runs through your municipality, the State Secretariat for Migration (SEM) grants the federal permit.","src":["Canton of Bern: residence in Switzerland (naturalisation)","Canton of Bern: language skills and proof","Canton of Bern: naturalisation test","Canton of Bern: naturalisation fees","SEM: ordinary naturalisation"]},"pv":{"intro":"In the canton of Bern, the canton usually checks your entitlement to a premium reduction automatically, based on your final tax data from the two previous years. In 2026 the limit is CHF 35,000 of relevant income, or CHF 45,000 for families with children. You only apply in special cases.","facts":[["Limit 2026","Relevant income at most CHF 35,000; families with children at most CHF 45,000."],["Check","Automatic, based on final tax data from the two previous years (net income and assets)."],["Application","Only in special cases, for example if no automatic check is possible or your income or family changes significantly and permanently. Also possible online."],["Calculator","Non-binding estimate with the online calculator at be.ch/pvo-onlinerechner."]],"steps":["Use the online calculator at be.ch/pvo-onlinerechner to see whether you may be entitled.","File your tax return: the automatic check needs final tax data.","If your income or family has changed significantly and permanently: apply, also possible online.","If you are entitled, the canton pays the reduction directly to your health insurer and your premium bill goes down."],"who":[1,1,0],"note":"The federal government requires premium reductions in the Health Insurance Act and contributes to them; in the canton of Bern the Social Insurance Office (ASV) checks and decides.","src":["Canton of Bern (ASV): entitlement to premium reduction","Canton of Bern (ASV): when you need to apply","Canton of Bern (ASV): information sheet premium reduction 2026","Canton of Bern (ASV): calculating entitlement"]},"wpe":{"intro":"Yes. Anyone who does not do, or does not complete, military or civilian service pays the military service exemption tax: 3 % of taxable income for direct federal tax, at least CHF 400 a year. In the canton of Bern the Office for Civil Protection, Sport and Military Affairs (BSM) is responsible.","facts":[["Amount","3 % of taxable income for direct federal tax, at least CHF 400 a year."],["Duration","From age 19 to 37, at most 11 years of tax."],["Civil protection","Doing civil protection service does not exempt you, but you pay 4 % less for each day of service done that year."],["Refund","If you make up your military or civilian service and complete your service obligation, you get the tax back. The claim expires 5 years after your service obligation ends."]],"steps":["File your tax return as usual: the tax is based on your taxable income for direct federal tax.","The bill comes from the cantonal office, in the canton of Bern from the BSM.","With a significant disability and low income: have an exemption checked.","Service made up: once your service obligation is complete, apply to the BSM for a refund."],"who":[1,1,0],"note":"The exemption tax is a federal levy (FTA); the cantons, in Bern the Office for Civil Protection, Sport and Military Affairs, assess and collect it.","src":["FTA: the military service exemption tax explained","Canton of Bern (BSM): exemption tax","Canton of Bern (BSM): refund","ch.ch: military service exemption tax"]}}}};
const PAGE={"de":{"title":"Frag Tell – Tell (privates Konzept, Prototyp)","desc":"Frag Tell: Chat-Einstieg des privaten Konzeptprototyps Tell. Siebzehn Themen, Antworten nur aus offiziellen Quellen. Keine offizielle Seite.","page":"Frag Tell","greet":{"m":"Guten Morgen","d":"Guten Tag","e":"Guten Abend","tail":", Schweiz"},"sub":"Was möchten Sie bei Bund, Kanton oder Gemeinde erledigen?","more":"Weitere Themen","less":"Weniger","f_views":["Abdeckung","Neuigkeiten","Für Behörden","Mitmachen"],"f_pages_h":"Weitere Seiten von Tell","credit":"Bildnachweis: Foto Bundeshaus Bern («Bundeshaus Bern 20180827-2»): Suicasmo, CC BY-SA 4.0, via Wikimedia Commons (commons.wikimedia.org/wiki/File:Bundeshaus_Bern_20180827-2.jpg); freigestellt und bearbeitet.","mail":{"fb":"Tell: Rückmeldung","err":"Tell: Fehler oder Veraltetes melden","topic":"Tell: Themenvorschlag"},"views":{"abdeckung":{"t":"Abdeckung","h":"Was Tell abdeckt","lead":"Tell ist ein Konzeptprototyp und kein flächendeckender Auskunftsdienst. Heute beantwortet die Chatbox siebzehn Themen, jeweils für Beispielorte. Zu allem anderen sagt Tell offen, dass es noch keine Antwort hat.","blocks":[{"type":"topics","h":"Heute: siebzehn Themen","ask":"Frage stellen","items":[{"h":"Umzug melden","t":"Ab- und Anmeldung, Frist, Kosten und Ablauf über eUmzugCH.","m":"Beispiel: Bern nach Winterthur"},{"h":"Pass & ID","t":"Antrag, Termin, Kosten und Gültigkeit.","m":"Beispiel: Kanton Bern"},{"h":"Steuererklärung, Frist verlängern","t":"Fristen, Verlängerung und Kosten.","m":"Beispiel: Kanton Bern, teils Zürich und Genf"},{"h":"AHV-Rente anmelden","t":"Referenzalter, Anmeldung, Vorbezug und Aufschub.","m":"Beispiel: Jahrgang 1962, Thun"},{"h":"Arbeitslos melden","t":"Anmeldung beim RAV, Arbeitslosenentschädigung und Ablauf.","m":"Beispiel: Thun, Regeln des Bundes"},{"h":"Krankenkasse wechseln","t":"Kündigungsfrist, Franchise, Prämien 2027 und Ablauf.","m":"Ganze Schweiz (Bundesrecht, KVG)"},{"h":"Einzelfirma gründen","t":"AHV-Anmeldung
