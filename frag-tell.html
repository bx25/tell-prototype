dern","t":"Höhe, Freigabe, Frist ein Jahr.","m":"Ganze Schweiz"},{"h":"Arbeitszeugnis verlangen","t":"Vollzeugnis, Arbeitsbestätigung, Frist, Berichtigung.","m":"Ganze Schweiz"},{"h":"Lohn bei Krankheit","t":"Dauer, Taggeldversicherung, Arztzeugnis.","m":"Ganze Schweiz"},{"h":"Ferienanspruch","t":"Mindestferien, am Stück, Auszahlung, Krankheit.","m":"Ganze Schweiz"},{"h":"Überstunden","t":"Zuschlag, Freizeit, Überzeit, Vertrag.","m":"Ganze Schweiz"}]},{"type":"list","h":"Gut zu wissen","items":["Die Antworten stammen aus öffentlichen, offiziellen Quellen von Bund, Kantonen und Gemeinden und nennen diese. Stand: Oktober 2026, ohne Gewähr.","Die Antworten sind Beispiele für einzelne Orte. Andere Gemeinden und Kantone können abweichen. Massgebend sind immer die zuständigen Stellen.","Die Chatbox erkennt Themen an Stichwörtern. Wenn nichts passt, sagt sie das.","Ihre Eingabe bleibt im Browser. Es gibt kein Konto und keinen Gesprächsverlauf."]},{"type":"list","h":"Noch nicht abgedeckt","items":["Alle übrigen Behördengänge sowie die meisten Gemeinden und Kantone."],"note":"Kein Zeitplan und keine Zusage."}]},"neuigkeiten":{"t":"Neuigkeiten","h":"Neuigkeiten","lead":"Was sich bei Tell geändert hat, mit Datum. Aufgeführt ist nur, was tatsächlich umgesetzt wurde.","blocks":[{"type":"news","items":[{"d":"7. Oktober 2026","g":[{"h":"Neues Thema","li":["Krankenkasse wechseln: Kündigungsfrist, Franchise, Prämien 2027 und Ablauf, mit Quellen von Priminfo (BAG) und Fedlex (KVG)."]},{"h":"Neue Seite","li":["«Frag Tell» mit Chat-Einstieg sowie den Bereichen Abdeckung, Neuigkeiten, Für Behörden und Mitmachen.","«Lücken»: neue Seite, auf der Tell festhält, wo offizielle Angaben zu seinen Themen Lücken, Unklarheiten oder Abweichungen zeigen. Erst ein Anfang: 8 Beobachtungen mit Quellen, Stand 7. Oktober 2026."]}]},{"d":"5. Oktober 2026","g":[{"h":"Verbessert","li":["Kopfbild der Startseite: Bundeshaus frontal und grösser."]}]},{"d":"4. Oktober 2026","g":[{"h":"Online","li":["Tell geht als privater Konzeptprototyp online: Startseite, Bürgersicht, Behördensicht und Projekt."]}]}]}]},"behoerden":{"t":"Für Behörden","h":"Für Behörden","lead":"Tell ist ein privates Konzept. Heute arbeitet keine Behörde mit Tell zusammen, und es gibt keine Absprache mit einer Stelle. Diese Seite zeigt, wie eine Zusammenarbeit aussehen könnte, in drei Stufen: Mit jeder Stufe steigt der Nutzen für Bürgerinnen und Bürger, aber auch der Aufwand für ein Amt.","blocks":[{"type":"phases","h":"Mögliche Zusammenarbeit (Konzeptidee)","items":[{"n":"1","h":"Mitlesen und korrigieren","e":"Aufwand gering, ohne IT","t":"Ein Amt schaut die Antworten zu seinen Themen an und meldet Fehler oder Veraltetes per E-Mail. Tell passt die Antwort an und nennt die Seite des Amts als Quelle."},{"n":"2","h":"Anbinden","e":"Aufwand mittel, mit IT","t":"Tell verweist direkt auf den Online-Schalter, das Formular oder die Terminbuchung des Amts, statt nur zu erklären. Idee im Konzept, nicht umgesetzt."},{"n":"3","h":"Partner werden","e":"Aufwand hoch, Projekt und Recht","t":"Im Projektkonzept ist ein Pilot mit einem Kanton vorgesehen (12 Monate), danach 6 bis 8 Kantone (24 Monate). Das sind eigene Annahmen, keine Zusage und keine Offerte."}]},{"type":"list","h":"Lücken in offiziellen Angaben","items":["Tell hält auf der Seite «Lücken» fest, wo offizielle Angaben zu seinen 63 Themen Lücken, Unklarheiten oder Abweichungen zeigen, mit Quellen und Abrufdatum. Es sind Beobachtungen, keine Vorwürfe, und sie sollen Ämtern helfen, ihre Angaben zu verbessern. Erst ein Anfang: 8 Einträge, Stand 7. Oktober 2026, bitte prüfen."]},{"type":"list","h":"Was Tell ist, und was nicht","items":["Tell ist ein privates Konzept von Bilal Simsek, Bern, und keine Behörde.","Fakten wie Fristen, Gebühren und Adressen stammen nur aus offiziellen Quellen und werden mit Quelle angezeigt.","Tell entscheidet nichts und gibt keine Rechtsauskunft. Bei Unsicherheit verweist es an das zuständige Amt.","Tell reicht keine Anträge ein. Das geht heute nur auf den offiziellen Seiten."]},{"type":"links","h":"Mehr zum Konzept","items":[{"l":"Lücken in offiziellen Angaben (Beobachtungen)","href":"luecken.html"},{"l":"Behördensicht (Demo)","href":"behoerdensicht.html"},{"l":"Projekt: Fahrplan, Kosten, Risiken","href":"projekt.html"},{"l":"Rückmeldung an Tell senden","mail":"fb"}]}]},"mitmachen":{"t":"Mitmachen","h":"Mitmachen","lead":"Tell ist ein Einzelprojekt und lebt von Rückmeldungen. So können Sie helfen, alles per E-Mail und ohne Konto.","blocks":[{"type":"cards","items":[{"h":"Fehler oder Veraltetes melden","t":"Stimmt eine Frist, eine Gebühr oder eine Adresse nicht mehr? Schreiben Sie die Frage und die Quelle.","l":"Fehler melden","mail":"err"},{"h":"Ein Thema vorschlagen","t":"Welcher Behördengang fehlt Ihnen? Nennen Sie das Anliegen und Ihren Wohnort.","l":"Thema vorschlagen","mail":"topic"},{"h":"Rückmeldung aus einem Amt","t":"Sie arbeiten bei einer Behörde? Eine kurze Rückmeldung zu einer Antwort hilft am meisten.","l":"Rückmeldung senden","mail":"fb"},{"h":"Weitersagen","t":"Zeigen Sie Tell Menschen, die mit Ämtern zu tun haben, und sagen Sie dazu, dass es ein privates Konzept ist."}]}]}},"f_luecken":"Lücken"},"fr":{"title":"Demandez à Tell – Tell (concept privé, prototype)","desc":"Demandez à Tell : point d’entrée par chat du prototype conceptuel Tell. 63 thèmes, réponses uniquement issues de sources officielles. Pas un site officiel.","page":"Demandez à Tell","greet":{"m":"Bonjour","d":"Bonjour","e":"Bonsoir","tail":", la Suisse"},"sub":"Que souhaitez-vous régler auprès de la Confédération, du canton ou de la commune ?","more":"Autres thèmes","less":"Moins","f_views":["Couverture","Actualités","Pour les autorités","Participer"],"f_pages_h":"Autres pages de Tell","credit":"Crédits photo : photo du Palais fédéral de Berne (« Bundeshaus Bern 20180827-2 ») : Suicasmo, CC BY-SA 4.0, via Wikimedia Commons (commons.wikimedia.org/wiki/File:Bundeshaus_Bern_20180827-2.jpg) ; détourée et retouchée.","mail":{"fb":"Tell : retour d’information","err":"Tell : signaler une erreur ou une information périmée","topic":"Tell : proposition de thème"},"views":{"abdeckung":{"t":"Couverture","h":"Ce que couvre Tell","lead":"Tell est un prototype conceptuel et non un service d’information à couverture complète. Aujourd’hui, le chat répond à 63 thèmes, chacun pour des lieux donnés en exemple. Pour tout le reste, Tell dit ouvertement qu’il n’a pas encore de réponse.","blocks":[{"type":"topics","h":"Aujourd’hui : 63 thèmes","ask":"Poser la question","items":[{"h":"Annoncer un déménagement","t":"Départ et arrivée, délai, coûts et déroulement via eUmzugCH.","m":"Exemple : de Berne à Winterthour"},{"h":"Passeport et carte d’identité","t":"Demande, rendez-vous, coûts et validité.","m":"Exemple : canton de Berne"},{"h":"Déclaration d’impôts, prolonger le délai","t":"Délais, prolongation et coûts.","m":"Exemple : canton de Berne, en partie Zurich et Genève"},{"h":"Demander la rente AVS","t":"Âge de référence, demande, anticipation et ajournement.","m":"Exemple : année de naissance 1962, Thoune"},{"h":"S’annoncer au chômage","t":"Inscription à l’ORP, indemnité de chômage et déroulement.","m":"Exemple : Thoune, règles fédérales"},{"h":"Changer de caisse maladie","t":"Délai de résiliation, franchise, primes 2027 et déroulement.","m":"Toute la Suisse (droit fédéral, LAMal)"},{"h":"Fonder une entreprise individuelle","t":"Annonce AVS, registre du commerce, TVA et coûts.","m":"Exemple : Berne"},{"h":"Échanger un permis de conduire étranger","t":"Délai, course de contrôle, coûts et déroulement.","m":"Exemple : canton de Berne, permis allemand"},{"h":"Se marier","t":"Conditions, préparation du mariage, délais et coûts.","m":"Exemple : ville de Zurich, tous deux de nationalité suisse"},{"h":"Annoncer un chien","t":"Annonce, AMICUS, puce et taxe sur les chiens.","m":"Exemple : ville de Berne"},{"h":"Demander les allocations familiales","t":"Montant, demande, versement rétroactif et règles.","m":"Exemple : canton de Berne, salariés"},{"h":"Commander un extrait des poursuites","t":"Commande, coûts, contenu et envoi.","m":"Exemple : canton de Berne"},{"h":"Commander un extrait du casier judiciaire","t":"Commande en ligne ou à la Poste, coûts et délai.","m":"Toute la Suisse (Confédération)"},{"h":"Immatriculer une voiture","t":"Documents, attestation d’assurance, coûts et impôt.","m":"Exemple : canton de Berne, occasion"},{"h":"Naturalisation","t":"Conditions, langue, test, déroulement et coûts.","m":"Exemple : ville de Berne, naturalisation ordinaire"},{"h":"Réduction des primes","t":"Limite de revenu, examen automatique, demande et versement.","m":"Exemple : canton de Berne, état 2026"},{"h":"Taxe d’exemption de l’obligation de servir","t":"Montant, durée, protection civile, exonération et remboursement.","m":"Exemple : canton de Berne, règles fédérales"},{"h":"Abri de jardin : permis nécessaire ?","t":"Petites constructions libres de permis, règles, demande via eBau.","m":"Exemple : ville de Berne"},{"h":"Passeport ou ID perdu","t":"Annonce de perte, coûts, validité et nouveau document.","m":"Exemple : canton de Berne"},{"h":"Bons de garde pour la crèche","t":"Conditions, taux d’activité, revenu et demande via kiBon.","m":"Exemple : ville de Berne, période 2026/27"},{"h":"Demander l’aide sociale","t":"Annonce, documents, montant et remboursement.","m":"Exemple : ville de Berne"},{"h":"Demander des prestations complémentaires","t":"Limite de fortune, besoins vitaux 2027, inscription et décision.","m":"Exemple : Thoune, canton de Berne"},{"h":"S’inscrire à l’AI","t":"Détection précoce, inscription, réadaptation et rente.","m":"Exemple : canton de Berne"},{"h":"Allocation de maternité","t":"Droit, montant, durée et demande.","m":"Toute la Suisse"},{"h":"Congé de paternité","t":"Droit, durée, montant et demande.","m":"Toute la Suisse"},{"h":"Permis d’élève conducteur","t":"Âge, test de la vue, premiers secours, examen théorique et coûts.","m":"Exemple : canton de Berne"},{"h":"Commander une attestation de domicile","t":"Commande, coût et guichet.","m":"Exemple : ville de Berne"},{"h":"Annoncer un décès","t":"Certificat de décès, annonce, inhumation.","m":"Exemple : ville de Berne"},{"h":"Carte de stationnement pour résidents","t":"Conditions, coûts, validité et demande.","m":"Exemple : ville de Berne"},{"h":"Éliminer des encombrants","t":"Petits encombrants, déchetterie, enlèvement et coûts.","m":"Exemple : ville de Berne"},{"h":"Objets trouvés","t":"Annoncer une perte, retrait, récompense.","m":"Exemple : ville de Berne"},{"h":"Engager une poursuite","t":"Réquisition, coûts, commandement de payer, opposition.","m":"Exemple : canton de Berne"},{"h":"Mettre une voiture hors circulation","t":"Permis de circulation, plaques, impôt et coûts.","m":"Exemple : canton de Berne"},{"h":"Annoncer un séjour hebdomadaire","t":"Qui, délai, attestation et impôts.","m":"Exemple : ville de Berne"},{"h":"Sortie de l’Église","t":"Forme, adresse, effet et impôt ecclésiastique.","m":"Exemple : canton de Berne"},{"h":"Annoncer un vélo volé","t":"Plainte en ligne, indications, poste de police.","m":"Exemple : canton de Berne"},{"h":"Déposer un mandat pour cause d’inaptitude","t":"Forme, lieu de dépôt, coûts.","m":"Exemple : canton de Berne"},{"h":"Prolonger un titre de séjour","t":"Avis d’échéance, documents, biométrie, validité.","m":"Exemple : ville de Berne"},{"h":"Reprendre son nom après un divorce","t":"Nom de célibataire, délai, coûts.","m":"Exemple : canton de Berne"},{"h":"Payer ses impôts par acomptes","t":"Tranches, facilité de paiement, intérêt moratoire, remise.","m":"Exemple : canton de Berne"},{"h":"Inscrire son enfant à l’école enfantine","t":"Date de référence, durée, entrée tardive, inscription.","m":"Exemple : ville de Berne"},{"h":"Reconnaître un enfant","t":"Moment, déroulement, autorité parentale conjointe, coûts.","m":"Exemple : canton de Berne"},{"h":"Annoncer une naissance","t":"Délai, qui annonce, noms, acte de naissance.","m":"Exemple : canton de Berne"},{"h":"Obtenir un permis de pêche","t":"Permis, prix, attestation de compétences, achat.","m":"Exemple : canton de Berne"},{"h":"Commander un extrait du registre foncier","t":"GRUDIS public, types d’extraits, émoluments, commande.","m":"Exemple : canton de Berne"},{"h":"Commander un document d’état civil","t":"Office compétent, documents, coûts, envoi.","m":"Exemple : canton de Berne"},{"h":"Faire opposition","t":"Délai, forme, effet, ne plus afficher l’inscription.","m":"Toute la Suisse"},{"h":"Immatriculer un cyclomoteur ou e-bike rapide","t":"Qui doit, documents, coûts, vignette.","m":"Exemple : canton de Berne"},{"h":"Demander un permis d’acquisition d’armes","t":"Conditions, demande, coût, portée.","m":"Exemple : canton de Berne"},{"h":"Demander une bourse d’études","t":"Qui peut, délai, StipBE-Online, contact.","m":"Exemple : canton de Berne"},{"h":"Demander une baisse de loyer","t":"Taux de référence, montant, terme, délais.","m":"Toute la Suisse"},{"h":"Impôt à la source : taxation ultérieure","t":"Qui, facultative ou obligatoire, délai au 31 mars.","m":"Exemple : canton de Berne"},{"h":"Demander un certificat d’héritier","t":"Remettre le testament, certificat, coûts, répudiation.","m":"Exemple : canton de Berne"},{"h":"Réserver une place pour déménager","t":"Autorisation, délai de 8 jours ouvrables, signaux, contact.","m":"Exemple : ville de Berne"},{"h":"Combler des lacunes AVS","t":"Effet, rattrapage sur 5 ans, années de jeunesse, extrait de compte.","m":"Toute la Suisse"},{"h":"Déplacer son service militaire","t":"Motifs, délai de 14 semaines, forme, obligation d’entrer en service.","m":"Toute la Suisse"},{"h":"Demander le service civil","t":"Conditions, demande, journée d’introduction, délais.","m":"Toute la Suisse"},{"h":"Payer ou contester une amende d’ordre","t":"30 jours, montant entier, procédure ordinaire, frais.","m":"Exemple : canton de Berne"},{"h":"Récupérer sa garantie de loyer","t":"Montant, libération, délai d’un an.","m":"Toute la Suisse"},{"h":"Demander un certificat de travail","t":"Certificat complet, attestation, délai, rectification.","m":"Toute la Suisse"},{"h":"Salaire en cas de maladie","t":"Durée, assurance d’indemnités journalières, certificat médical.","m":"Toute la Suisse"},{"h":"Droit aux vacances","t":"Minimum, d’affilée, paiement, maladie.","m":"Toute la Suisse"},{"h":"Heures supplémentaires","t":"Supplément, congé, travail supplémentaire, contrat.","m":"Toute la Suisse"}]},{"type":"list","h":"Bon à savoir","items":["Les réponses proviennent de sources officielles publiques de la Confédération, des cantons et des communes, et les citent. État : octobre 2026, sans garantie.","Les réponses sont des exemples pour certains lieux. D’autres communes et cantons peuvent différer. Seuls les services compétents font foi.","Le chat reconnaît les thèmes grâce à des mots-clés. Si rien ne correspond, il le dit.","Votre saisie reste dans le navigateur. Il n’y a ni compte ni historique de conversation."]},{"type":"list","h":"Pas encore couvert","items":["Toutes les autres démarches ainsi que la plupart des communes et des cantons."],"note":"Pas de calendrier et aucune promesse."}]},"neuigkeiten":{"t":"Actualités","h":"Actualités","lead":"Ce qui a changé chez Tell, avec la date. Seules les modifications réellement réalisées sont indiquées.","blocks":[{"type":"news","items":[{"d":"7 octobre 2026","g":[{"h":"Nouveau thème","li":["Changer de caisse maladie : délai de résiliation, franchise, primes 2027 et déroulement, avec des sources de Priminfo (OFSP) et de Fedlex (LAMal)."]},{"h":"Nouvelle page","li":["« Demandez à Tell » avec point d’entrée par chat et les rubriques Couverture, Actualités, Pour les autorités et Participer.","« Lacunes » : nouvelle page où Tell note où les informations officielles sur ses thèmes présentent des lacunes, des ambiguïtés ou des divergences. Seulement un début : 8 observations avec sources, état au 7 octobre 2026."]}]},{"d":"5 octobre 2026","g":[{"h":"Amélioré","li":["Image d’en-tête de la page d’accueil : Palais fédéral de face et plus grand."]}]},{"d":"4 octobre 2026","g":[{"h":"En ligne","li":["Tell est mis en ligne comme prototype conceptuel privé : page d’accueil, vue citoyenne, vue des autorités et projet."]}]}]}]},"behoerden":{"t":"Pour les autorités","h":"Pour les autorités","lead":"Tell est un concept privé. Aujourd’hui, aucune autorité ne collabore avec Tell et il n’existe aucun accord avec un service. Cette page montre à quoi une collaboration pourrait ressembler, en trois niveaux : plus le niveau est élevé, plus l’utilité pour les citoyens augmente, mais aussi l’effort pour un service.","blocks":[{"type":"phases","h":"Collaboration possible (idée de concept)","items":[{"n":"1","h":"Relire et corriger","e":"Effort faible, sans informatique","t":"Un service relit les réponses sur ses thèmes et signale par e-mail les erreurs ou les informations périmées. Tell adapte la réponse et cite la page du service comme source."},{"n":"2","h":"Raccorder","e":"Effort moyen, avec informatique","t":"Tell renvoie directement au guichet en ligne, au formulaire ou à la prise de rendez-vous du service, au lieu de se limiter à expliquer. Idée du concept, non réalisée."},{"n":"3","h":"Devenir partenaire","e":"Effort élevé, projet et juridique","t":"Le concept de projet prévoit un pilote avec un canton (12 mois), puis 6 à 8 cantons (24 mois). Ce sont des hypothèses propres, ni une promesse ni une offre."}]},{"type":"list","h":"Lacunes dans les informations officielles","items":["Sur la page « Lacunes », Tell note où les informations officielles sur ses 63 thèmes présentent des lacunes, des ambiguïtés ou des divergences, avec sources et date de consultation. Ce sont des observations, pas des reproches, destinées à aider les services à améliorer leurs informations. Seulement un début : 8 entrées, état au 7 octobre 2026, à vérifier."]},{"type":"list","h":"Ce que Tell est, et ce qu’il n’est pas","items":["Tell est un concept privé de Bilal Simsek, Berne, et non une autorité.","Les faits tels que délais, émoluments et adresses proviennent uniquement de sources officielles et sont affichés avec leur source.","Tell ne décide de rien et ne donne pas de renseignement juridique. En cas de doute, il renvoie au service compétent.","Tell ne dépose aucune demande. Aujourd’hui, cela se fait uniquement sur les sites officiels."]},{"type":"links","h":"En savoir plus sur le concept","items":[{"l":"Lacunes dans les informations officielles (observations)","href":"luecken.html"},{"l":"Vue des autorités (démo)","href":"behoerdensicht.html"},{"l":"Projet : calendrier, coûts, risques","href":"projekt.html"},{"l":"Envoyer un retour à Tell","mail":"fb"}]}]},"mitmachen":{"t":"Participer","h":"Participer","lead":"Tell est un projet individuel et vit de vos retours. Voici comment aider, le tout par e-mail et sans compte.","blocks":[{"type":"cards","items":[{"h":"Signaler une erreur ou une information périmée","t":"Un délai, un émolument ou une adresse n’est plus correct ? Écrivez la question et la source.","l":"Signaler une erreur","mail":"err"},{"h":"Proposer un thème","t":"Quelle démarche manque ? Indiquez la demande et votre lieu de domicile.","l":"Proposer un thème","mail":"topic"},{"h":"Retour d’un service","t":"Vous travaillez dans une autorité ? Un bref retour sur une réponse aide le plus.","l":"Envoyer un retour","mail":"fb"},{"h":"En parler","t":"Montrez Tell aux personnes qui ont affaire aux autorités et précisez qu’il s’agit d’un concept privé."}]}]}},"f_luecken":"Lacunes"},"it":{"title":"Chiedi a Tell – Tell (concetto privato, prototipo)","desc":"Chiedi a Tell: accesso via chat del prototipo concettuale Tell. 63 temi, risposte solo da fonti ufficiali. Non è un sito ufficiale.","page":"Chiedi a Tell","greet":{"m":"Buongiorno","d":"Buongiorno","e":"Buonasera","tail":", Svizzera"},"sub":"Che cosa desidera sbrigare presso Confederazione, Cantone o Comune?","more":"Altri temi","less":"Meno","f_views":["Copertura","Novità","Per le autorità","Partecipare"],"f_pages_h":"Altre pagine di Tell","credit":"Crediti fotografici: foto del Palazzo federale di Berna («Bundeshaus Bern 20180827-2»): Suicasmo, CC BY-SA 4.0, via Wikimedia Commons (commons.wikimedia.org/wiki/File:Bundeshaus_Bern_20180827-2.jpg); ritagliata e modificata.","mail":{"fb":"Tell: riscontro","err":"Tell: segnalare un errore o un’informazione superata","topic":"Tell: proposta di tema"},"views":{"abdeckung":{"t":"Copertura","h":"Che cosa copre Tell","lead":"Tell è un prototipo concettuale e non un servizio di informazione a copertura totale. Oggi la chat risponde a 63 temi, ciascuno per luoghi dati come esempio. Per tutto il resto Tell dice apertamente di non avere ancora una risposta.","blocks":[{"type":"topics","h":"Oggi: 63 temi","ask":"Fai la domanda","items":[{"h":"Annunciare il trasloco","t":"Partenza e arrivo, termine, costi e procedura tramite eUmzugCH.","m":"Esempio: da Berna a Winterthur"},{"h":"Passaporto e carta d’identità","t":"Richiesta, appuntamento, costi e validità.","m":"Esempio: Cantone di Berna"},{"h":"Dichiarazione d’imposta, prorogare il termine","t":"Termini, proroga e costi.","m":"Esempio: Cantone di Berna, in parte Zurigo e Ginevra"},{"h":"Richiedere la rendita AVS","t":"Età di riferimento, richiesta, anticipo e differimento.","m":"Esempio: anno di nascita 1962, Thun"},{"h":"Annunciarsi come disoccupato","t":"Iscrizione all’URC, indennità di disoccupazione e procedura.","m":"Esempio: Thun, regole federali"},{"h":"Cambiare cassa malati","t":"Termine di disdetta, franchigia, premi 2027 e procedura.","m":"Tutta la Svizzera (diritto federale, LAMal)"},{"h":"Fondare una ditta individuale","t":"Annuncio AVS, registro di commercio, IVA e costi.","m":"Esempio: Berna"},{"h":"Cambiare una patente estera","t":"Termine, corsa di controllo, costi e procedura.","m":"Esempio: Cantone di Berna, patente tedesca"},{"h":"Sposarsi","t":"Requisiti, preparazione del matrimonio, termini e costi.","m":"Esempio: città di Zurigo, entrambi con passaporto svizzero"},{"h":"Annunciare un cane","t":"Annuncio, AMICUS, microchip e tassa sui cani.","m":"Esempio: città di Berna"},{"h":"Chiedere gli assegni familiari","t":"Importo, domanda, pagamento retroattivo e regole.","m":"Esempio: Cantone di Berna, dipendenti"},{"h":"Ordinare l’estratto delle esecuzioni","t":"Ordinazione, costi, contenuto e invio.","m":"Esempio: Cantone di Berna"},{"h":"Ordinare l’estratto del casellario","t":"Ordinazione online o alla Posta, costi e durata.","m":"Tutta la Svizzera (Confederazione)"},{"h":"Immatricolare l’auto","t":"Documenti, attestato d’assicurazione, costi e imposta.","m":"Esempio: Cantone di Berna, occasione"},{"h":"Naturalizzazione","t":"Requisiti, lingua, test, procedura e costi.","m":"Esempio: città di Berna, naturalizzazione ordinaria"},{"h":"Riduzione dei premi","t":"Limite di reddito, verifica automatica, domanda e versamento.","m":"Esempio: Cantone di Berna, stato 2026"},{"h":"Tassa d’esenzione dall’obbligo militare","t":"Importo, durata, protezione civile, esenzione e rimborso.","m":"Esempio: Cantone di Berna, regole federali"},{"h":"Casetta da giardino: serve la licenza?","t":"Piccole costruzioni esenti, regole, domanda tramite eBau.","m":"Esempio: città di Berna"},{"h":"Passaporto o ID smarrito","t":"Annuncio di perdita, costi, validità e nuovo documento.","m":"Esempio: Cantone di Berna"},{"h":"Buoni di custodia per l’asilo nido","t":"Requisiti, grado d’occupazione, reddito e domanda tramite kiBon.","m":"Esempio: città di Berna, periodo 2026/27"},{"h":"Chiedere l’aiuto sociale","t":"Annuncio, documenti, importo e rimborso.","m":"Esempio: città di Berna"},{"h":"Chiedere le prestazioni complementari","t":"Limite di sostanza, fabbisogno vitale 2027, iscrizione e decisione.","m":"Esempio: Thun, Cantone di Berna"},{"h":"Iscriversi all’AI","t":"Rilevamento tempestivo, iscrizione, integrazione e rendita.","m":"Esempio: Cantone di Berna"},{"h":"Indennità di maternità","t":"Diritto, importo, durata e richiesta.","m":"Tutta la Svizzera"},{"h":"Congedo di paternità","t":"Diritto, durata, importo e richiesta.","m":"Tutta la Svizzera"},{"h":"Licenza per allievo conducente","t":"Età, esame della vista, primo soccorso, esame di teoria e costi.","m":"Esempio: Cantone di Berna"},{"h":"Ordinare un certificato di domicilio","t":"Ordinazione, costo e sportello.","m":"Esempio: città di Berna"},{"h":"Notificare un decesso","t":"Certificato di morte, notifica, sepoltura.","m":"Esempio: città di Berna"},{"h":"Carta di parcheggio per residenti","t":"Requisiti, costi, validità e richiesta.","m":"Esempio: città di Berna"},{"h":"Smaltire rifiuti ingombranti","t":"Piccoli ingombranti, centro di raccolta, ritiro e costi.","m":"Esempio: città di Berna"},{"h":"Oggetti smarriti","t":"Notificare una perdita, ritiro, ricompensa.","m":"Esempio: città di Berna"},{"h":"Avviare un’esecuzione","t":"Domanda, costi, precetto esecutivo, opposizione.","m":"Esempio: Cantone di Berna"},{"h":"Disdire l’auto","t":"Licenza di circolazione, targhe, imposta e costi.","m":"Esempio: Cantone di Berna"},{"h":"Annunciare un soggiorno settimanale","t":"Chi, termine, certificato e imposte.","m":"Esempio: città di Berna"},{"h":"Uscire dalla Chiesa","t":"Forma, indirizzo, effetto e imposta ecclesiastica.","m":"Esempio: Cantone di Berna"},{"h":"Notificare una bici rubata","t":"Denuncia online, indicazioni, posto di polizia.","m":"Esempio: Cantone di Berna"},{"h":"Depositare un mandato precauzionale","t":"Forma, luogo di deposito, costi.","m":"Esempio: Cantone di Berna"},{"h":"Prorogare il permesso di soggiorno","t":"Avviso di scadenza, documenti, biometria, validità.","m":"Esempio: città di Berna"},{"h":"Riprendere il cognome dopo il divorzio","t":"Cognome da nubile o celibe, termine, costi.","m":"Esempio: Cantone di Berna"},{"h":"Pagare le imposte a rate","t":"Rate, agevolazione, interesse di mora, condono.","m":"Esempio: Cantone di Berna"},{"h":"Iscrivere il bambino alla scuola dell’infanzia","t":"Data di riferimento, durata, ingresso posticipato, iscrizione.","m":"Esempio: città di Berna"},{"h":"Riconoscere un figlio","t":"Momento, procedura, autorità parentale congiunta, costi.","m":"Esempio: Cantone di Berna"},{"h":"Notificare una nascita","t":"Termine, chi notifica, nomi, atto di nascita.","m":"Esempio: Cantone di Berna"},{"h":"Ottenere la patente di pesca","t":"Patenti, prezzi, attestato di competenza, acquisto.","m":"Esempio: Cantone di Berna"},{"h":"Ordinare un estratto del registro fondiario","t":"GRUDIS public, tipi di estratto, emolumenti, ordine.","m":"Esempio: Cantone di Berna"},{"h":"Ordinare un documento di stato civile","t":"Ufficio competente, documenti, costi, invio.","m":"Esempio: Cantone di Berna"},{"h":"Fare opposizione","t":"Termine, forma, effetto, non mostrare più l’iscrizione.","m":"Tutta la Svizzera"},{"h":"Immatricolare un ciclomotore o e-bike veloce","t":"Chi deve, documenti, costi, vignetta.","m":"Esempio: Cantone di Berna"},{"h":"Chiedere un permesso d’acquisto di armi","t":"Requisiti, domanda, costo, portata.","m":"Esempio: Cantone di Berna"},{"h":"Chiedere una borsa di studio","t":"Chi può, termine, StipBE-Online, contatto.","m":"Esempio: Cantone di Berna"},{"h":"Chiedere una riduzione della pigione","t":"Tasso di riferimento, importo, scadenza, termini.","m":"Tutta la Svizzera"},{"h":"Imposta alla fonte: tassazione ulteriore","t":"Chi, facoltativa o obbligatoria, termine 31 marzo.","m":"Esempio: Cantone di Berna"},{"h":"Chiedere un certificato ereditario","t":"Consegnare il testamento, certificato, costi, rinuncia.","m":"Esempio: Cantone di Berna"},{"h":"Riservare un parcheggio per il trasloco","t":"Autorizzazione, termine di 8 giorni lavorativi, segnali, contatto.","m":"Esempio: città di Berna"},{"h":"Colmare lacune AVS","t":"Effetto, recupero su 5 anni, anni giovanili, estratto conto.","m":"Tutta la Svizzera"},{"h":"Spostare il servizio militare","t":"Motivi, termine di 14 settimane, forma, obbligo di entrare in servizio.","m":"Tutta la Svizzera"},{"h":"Chiedere il servizio civile","t":"Requisiti, domanda, giornata introduttiva, termini.","m":"Tutta la Svizzera"},{"h":"Pagare o contestare una multa disciplinare","t":"30 giorni, importo intero, procedura ordinaria, spese.","m":"Esempio: Cantone di Berna"},{"h":"Riavere la garanzia della pigione","t":"Importo, liberazione, termine di un anno.","m":"Tutta la Svizzera"},{"h":"Chiedere un certificato di lavoro","t":"Certificato completo, attestato, termine, rettifica.","m":"Tutta la Svizzera"},{"h":"Salario in caso di malattia","t":"Durata, assicurazione d’indennità giornaliera, certificato medico.","m":"Tutta la Svizzera"},{"h":"Diritto alle vacanze","t":"Minimo, consecutive, pagamento, malattia.","m":"Tutta la Svizzera"},{"h":"Ore supplementari","t":"Supplemento, tempo libero, lavoro straordinario, contratto.","m":"Tutta la Svizzera"}]},{"type":"list","h":"Da sapere","items":["Le risposte provengono da fonti ufficiali pubbliche di Confederazione, Cantoni e Comuni e le citano. Stato: ottobre 2026, senza garanzia.","Le risposte sono esempi per singoli luoghi. Altri Comuni e Cantoni possono differire. Fanno stato sempre i servizi competenti.","La chat riconosce i temi dalle parole chiave. Se nulla corrisponde, lo dice.","Quanto scrive resta nel browser. Non ci sono account né cronologia della conversazione."]},{"type":"list","h":"Non ancora coperto","items":["Tutte le altre pratiche e la maggior parte dei Comuni e dei Cantoni."],"note":"Nessun calendario e nessuna promessa."}]},"neuigkeiten":{"t":"Novità","h":"Novità","lead":"Che cosa è cambiato in Tell, con la data. Sono elencate solo le modifiche effettivamente realizzate.","blocks":[{"type":"news","items":[{"d":"7 ottobre 2026","g":[{"h":"Nuovo tema","li":["Cambiare cassa malati: termine di disdetta, franchigia, premi 2027 e procedura, con fonti di Priminfo (UFSP) e Fedlex (LAMal)."]},{"h":"Nuova pagina","li":["«Chiedi a Tell» con accesso via chat e le sezioni Copertura, Novità, Per le autorità e Partecipare.","«Lacune»: nuova pagina in cui Tell annota dove le informazioni ufficiali sui suoi temi presentano lacune, ambiguità o divergenze. Solo un inizio: 8 osservazioni con fonti, stato al 7 ottobre 2026."]}]},{"d":"5 ottobre 2026","g":[{"h":"Migliorato","li":["Immagine di testata della pagina iniziale: Palazzo federale frontale e più grande."]}]},{"d":"4 ottobre 2026","g":[{"h":"Online","li":["Tell va online come prototipo concettuale privato: pagina iniziale, vista cittadini, vista autorità e progetto."]}]}]}]},"behoerden":{"t":"Per le autorità","h":"Per le autorità","lead":"Tell è un concetto privato. Oggi nessuna autorità collabora con Tell e non esiste alcun accordo con un servizio. Questa pagina mostra come potrebbe essere una collaborazione, in tre livelli: a ogni livello cresce l’utilità per i cittadini, ma anche l’impegno per un servizio.","blocks":[{"type":"phases","h":"Possibile collaborazione (idea di concetto)","items":[{"n":"1","h":"Rileggere e correggere","e":"Impegno ridotto, senza informatica","t":"Un servizio esamina le risposte sui propri temi e segnala per e-mail errori o informazioni superate. Tell adegua la risposta e cita la pagina del servizio come fonte."},{"n":"2","h":"Collegare","e":"Impegno medio, con informatica","t":"Tell rimanda direttamente allo sportello online, al modulo o alla prenotazione dell’appuntamento del servizio, invece di limitarsi a spiegare. Idea del concetto, non realizzata."},{"n":"3","h":"Diventare partner","e":"Impegno elevato, progetto e diritto","t":"Il concetto di progetto prevede un progetto pilota con un Cantone (12 mesi), poi da 6 a 8 Cantoni (24 mesi). Sono ipotesi proprie, né una promessa né un’offerta."}]},{"type":"list","h":"Lacune nelle informazioni ufficiali","items":["Nella pagina «Lacune» Tell annota dove le informazioni ufficiali sui suoi 63 temi presentano lacune, ambiguità o divergenze, con fonti e data di consultazione. Sono osservazioni, non accuse, e servono ad aiutare gli uffici a migliorare le loro informazioni. Solo un inizio: 8 voci, stato al 7 ottobre 2026, da verificare."]},{"type":"list","h":"Che cos’è Tell, e che cosa no","items":["Tell è un concetto privato di Bilal Simsek, Berna, e non un’autorità.","Fatti come termini, tasse e indirizzi provengono solo da fonti ufficiali e sono mostrati con la fonte.","Tell non decide nulla e non fornisce consulenza giuridica. In caso di dubbio rimanda al servizio competente.","Tell non inoltra richieste. Oggi ciò avviene solo sui siti ufficiali."]},{"type":"links","h":"Altro sul concetto","items":[{"l":"Lacune nelle informazioni ufficiali (osservazioni)","href":"luecken.html"},{"l":"Vista autorità (demo)","href":"behoerdensicht.html"},{"l":"Progetto: calendario, costi, rischi","href":"projekt.html"},{"l":"Invia un riscontro a Tell","mail":"fb"}]}]},"mitmachen":{"t":"Partecipare","h":"Partecipare","lead":"Tell è un progetto individuale e vive dei vostri riscontri. Ecco come aiutare, tutto per e-mail e senza account.","blocks":[{"type":"cards","items":[{"h":"Segnalare un errore o un’informazione superata","t":"Un termine, una tassa o un indirizzo non è più corretto? Scriva la domanda e la fonte.","l":"Segnalare un errore","mail":"err"},{"h":"Proporre un tema","t":"Quale pratica manca? Indichi la richiesta e il suo luogo di domicilio.","l":"Proporre un tema","mail":"topic"},{"h":"Riscontro da un servizio","t":"Lavora presso un’autorità? Un breve riscontro su una risposta aiuta moltissimo.","l":"Inviare un riscontro","mail":"fb"},{"h":"Passaparola","t":"Mostri Tell a chi ha a che fare con le autorità e precisi che si tratta di un concetto privato."}]}]}},"f_luecken":"Lacune"},"en":{"title":"Ask Tell – Tell (private concept, prototype)","desc":"Ask Tell: chat entry point of the private concept prototype Tell. 63 topics, answers only from official sources. Not an official site.","page":"Ask Tell","greet":{"m":"Good morning","d":"Good afternoon","e":"Good evening","tail":", Switzerland"},"sub":"What would you like to sort out with the Confederation, your canton or your municipality?","more":"More topics","less":"Fewer","f_views":["Coverage","News","For authorities","Get involved"],"f_pages_h":"More pages of Tell","credit":"Image credit: photo of the Federal Palace in Bern («Bundeshaus Bern 20180827-2»): Suicasmo, CC BY-SA 4.0, via Wikimedia Commons (commons.wikimedia.org/wiki/File:Bundeshaus_Bern_20180827-2.jpg); cut out and edited.","mail":{"fb":"Tell: feedback","err":"Tell: report an error or outdated information","topic":"Tell: topic suggestion"},"views":{"abdeckung":{"t":"Coverage","h":"What Tell covers","lead":"Tell is a concept prototype, not a nationwide information service. Today the chat answers 63 topics, each for example places. For everything else, Tell says openly that it has no answer yet.","blocks":[{"type":"topics","h":"Today: 63 topics","ask":"Ask this","items":[{"h":"Report a move","t":"Deregistration and registration, deadline, costs and process via eUmzugCH.","m":"Example: Bern to Winterthur"},{"h":"Passport & ID","t":"Application, appointment, costs and validity.","m":"Example: canton of Bern"},{"h":"Tax return, extend the deadline","t":"Deadlines, extension and costs.","m":"Example: canton of Bern, partly Zurich and Geneva"},{"h":"Register for the AHV pension","t":"Reference age, registration, early and deferred withdrawal.","m":"Example: born 1962, Thun"},{"h":"Register as unemployed","t":"Registration with the RAV, unemployment benefit and process.","m":"Example: Thun, federal rules"},{"h":"Switch health insurer","t":"Notice deadline, deductible, 2027 premiums and process.","m":"All of Switzerland (federal law, KVG)"},{"h":"Start a sole proprietorship","t":"AHV registration, commercial register, VAT and costs.","m":"Example: Bern"},{"h":"Exchange a foreign driving licence","t":"Deadline, test drive, costs and process.","m":"Example: canton of Bern, German licence"},{"h":"Getting married","t":"Requirements, marriage preparation, deadlines and costs.","m":"Example: City of Zurich, both Swiss citizens"},{"h":"Register a dog","t":"Registration, AMICUS, microchip and dog tax.","m":"Example: City of Bern"},{"h":"Apply for family allowances","t":"Amount, application, back payments and rules.","m":"Example: canton of Bern, employees"},{"h":"Order a debt enforcement extract","t":"Ordering, costs, content and delivery.","m":"Example: canton of Bern"},{"h":"Order a criminal record extract","t":"Ordering online or at the post office, costs and duration.","m":"All of Switzerland (federal)"},{"h":"Register a car","t":"Documents, proof of insurance, costs and tax.","m":"Example: canton of Bern, used car"},{"h":"Naturalisation","t":"Requirements, language, test, process and costs.","m":"Example: City of Bern, ordinary naturalisation"},{"h":"Premium reduction","t":"Income limit, automatic check, application and payment.","m":"Example: canton of Bern, as of 2026"},{"h":"Military service exemption tax","t":"Amount, duration, civil protection, exemption and refund.","m":"Example: canton of Bern, federal rules"},{"h":"Garden shed: permit needed?","t":"Permit-free small buildings, rules, application via eBau.","m":"Example: City of Bern"},{"h":"Lost passport or ID","t":"Loss report, costs, validity and new document.","m":"Example: canton of Bern"},{"h":"Childcare vouchers for daycare","t":"Requirements, work rate, income and application via kiBon.","m":"Example: City of Bern, period 2026/27"},{"h":"Apply for social assistance","t":"Registration, documents, amount and repayment.","m":"Example: City of Bern"},{"h":"Apply for supplementary benefits","t":"Asset limit, living costs 2027, registration and decision.","m":"Example: Thun, canton of Bern"},{"h":"Register with disability insurance","t":"Early detection, registration, integration and pension.","m":"Example: canton of Bern"},{"h":"Maternity benefit","t":"Eligibility, amount, duration and application.","m":"All of Switzerland"},{"h":"Paternity leave","t":"Eligibility, duration, amount and application.","m":"All of Switzerland"},{"h":"Apply for a learner’s permit","t":"Age, eye test, first aid, theory test and costs.","m":"Example: canton of Bern"},{"h":"Order a certificate of residence","t":"Ordering, cost and counter.","m":"Example: city of Bern"},{"h":"Report a death","t":"Death certificate, reporting, burial.","m":"Example: city of Bern"},{"h":"Resident parking permit","t":"Requirements, cost, validity and application.","m":"Example: city of Bern"},{"h":"Dispose of bulky waste","t":"Small items, recycling centre, collection and costs.","m":"Example: city of Bern"},{"h":"Lost property","t":"Reporting a loss, collecting, finder’s reward.","m":"Example: city of Bern"},{"h":"Start debt collection","t":"Request, costs, payment order, objection.","m":"Example: canton of Bern"},{"h":"Deregister a car","t":"Registration document, plates, tax and costs.","m":"Example: canton of Bern"},{"h":"Register as a weekly resident","t":"Who, deadline, certificate and tax.","m":"Example: city of Bern"},{"h":"Leave the church","t":"Form, address, effective date and church tax.","m":"Example: canton of Bern"},{"h":"Report a stolen bike","t":"Online report, details, police station.","m":"Example: canton of Bern"},{"h":"Deposit an advance care mandate","t":"Form, where it is kept, cost.","m":"Example: canton of Bern"},{"h":"Renew a residence permit","t":"Expiry notice, documents, biometrics, validity.","m":"Example: city of Bern"},{"h":"Change your name after divorce","t":"Birth name, deadline, cost.","m":"Example: canton of Bern"},{"h":"Pay taxes in instalments","t":"Instalments, payment arrangement, default interest, remission.","m":"Example: canton of Bern"},{"h":"Register a child for kindergarten","t":"Cut-off date, duration, starting later, registration.","m":"Example: city of Bern"},{"h":"Acknowledge a child","t":"Timing, process, joint custody, cost.","m":"Example: canton of Bern"},{"h":"Register a birth","t":"Deadline, who report ation, deadline, corrections.","m":"All of Switzerland"},{"h":"Sick pay","t":"Duration, daily sickness insurance, doctor’s certificate.","m":"All of Switzerland"},{"h":"Holiday entitlement","t":"Minimum, consecutive weeks, payout, illness.","m":"All of Switzerland"},{"h":"Overtime","t":"Supplement, time off, legal maximum, contract.","m":"All of Switzerland"}]},{"type":"list","h":"Good to know","items":["Answers come from public, official sources of the Confederation, cantons and municipalities, and name them. As of October 2026, without guarantee.","The answers are examples for individual places. Other municipalities and cantons may differ. The competent authorities are always authoritative.","The chat recognises topics by keywords. If nothing fits, it says so.","What you type stays in your browser. There is no account and no conversation history."]},{"type":"list","h":"Not covered yet","items":["All other official errands, and most municipalities and cantons."],"note":"No timeline and no promise."}]},"neuigkeiten":{"t":"News","h":"News","lead":"What has changed at Tell, with dates. Only changes that were actually made are listed.","blocks":[{"type":"news","items":[{"d":"7 October 2026","g":[{"h":"New topic","li":["Switch health insurer: notice deadline, deductible, 2027 premiums and process, with sources from Priminfo (FOPH) and Fedlex (KVG)."]},{"h":"New page","li":["«Ask Tell» with a chat entry point and the sections Coverage, News, For authorities and Get involved.","“Gaps”: new page where Tell records where official information on its topics shows gaps, ambiguities or discrepancies. Only a start: 8 observations with sources, as of 7 October 2026."]}]},{"d":"5 October 2026","g":[{"h":"Improved","li":["Home page header image: Federal Palace seen from the front and larger."]}]},{"d":"4 October 2026","g":[{"h":"Online","li":["Tell goes online as a private concept prototype: home page, citizen view, authority view and project."]}]}]}]},"behoerden":{"t":"For authori function route(q){
  const s=q.toLowerCase();
  /* match at the START of a word, so that e.g. "Hundesteuer" is not taken for "Steuer";
     (?![\p{L}]) after short acronyms makes them whole-word matches */
  const at=r=>new RegExp('(?:^|[^\\p{L}\\p{N}])(?:'+r+')','u').test(s);
  /* priority: specific life events first; a bare "anmeld(en)" or "wohnsitz" only means "move" when nothing more specific matches */
  /* maternity benefit: before unemployment, which would otherwise take "Taggeld" */
  if(at('mutterschaft|mse(?![\\p{L}])|maternit|maternity'))return 'mse';
  /* paternity / other parent's leave */
  if(at('vaterschaftsurlaub|vaterschaftsentsch|papiurlaub|urlaub des and|entsch(?:ä|ae)digung des and|cong(?:é|e) (?:de )?paternit|allocation de paternit|cong(?:é|e) de l.autre parent|congedo (?:di )?paternit|indennit(?:à|a) di paternit|congedo dell.altro genitore|paternity (?:leave|benefit|allowance|pay)|other.parent.s leave'))return 'pat';

  if(at('wohnsitzbest|wohnsitzbesch|attestation de (?:domicile|r(?:é|e)sidence)|certificat de (?:domicile|r(?:é|e)sidence)|certificato di (?:domicilio|residenza)|attestazione di (?:domicilio|residenza)|(?:certificate|proof|confirmation) of (?:residence|address)|residence certificate'))return 'wsb';

  /* leaving a national church: before tax */
  if(at('kirchenaustritt|kirchensteuer|(?:aus der )?kirche aus(?:treten|tritt)|sortie de l.(?:é|e)glise|quitter l.(?:é|e)glise|imp(?:ô|o)t eccl(?:é|e)siastique|uscire dalla chiesa|uscita dalla chiesa|imposta ecclesiastica|leav(?:e|ing) the church|church tax'))return 'kir';

function renderView(name){
  const V=T().views[name], root=$('#viewIn'); root.textContent='';
  const eb=el('p','fq-eyebrow',T().page); const h=el('h1','fq-h',V.h); h.id='viewH'; h.tabIndex=-1; const lead=el('p','fq-lead',V.lead);
  root.append(eb,h,lead);
  V.blocks.forEach(b=>{
    const sec=el('section','fq-b'); if(b.h)sec.append(el('h2',null,b.h));
    if(b.type==='topics'){
      const g=el('div','fq-grid');
      b.items.forEach((it,i)=>{
        const t=el('article','fq-tile'); t.append(el('h3',null,it.h),el('p',null,it.t),el('p','fq-meta',it.m));
        const btn=el('button','btn ghost',b.ask); btn.type='button'; btn.addEventListener('click',()=>askTopic(Object.keys(MARKS)[i])); t.append(btn); g.append(t);
      });
      sec.append(g);
    } else if(b.type==='list'){
      const ul=el('ul','fq-list'); b.items.forEach(s=>ul.append(el('li',null,s))); sec.append(ul); if(b.note)sec.append(el('p','fq-note2',b.note));
    } else if(b.type==='news'){
      b.items.forEach(d=>{
        const row=el('div','fq-day'), tm=el('time',null,d.d); const body=el('div');
        d.g.forEach(gr=>{body.append(el('h3',null,gr.h)); const ul=el('ul'); gr.li.forEach(s=>ul.append(el('li',null,s))); body.append(ul);});
        row.append(tm,body); sec.append(row);
      });
    } else if(b.type==='phases'){
      const g=el('div','fq-ph');
      b.items.forEach(it=>{const a=el('article'); a.append(el('span','n',it.n),el('h3',null,it.h),el('p','e',it.e),el('p',null,it.t)); g.append(a);});
      sec.append(g);
    } else if(b.type==='links'){
      const ul=el('ul','fq-links');
      b.items.forEach(it=>{const li=document.createElement('li'), a=document.createElement('a'); const s=el('span',null,it.l); a.append(s); a.insertAdjacentHTML('beforeend',ARROW); a.href=it.mail?mailHref(it.mail):it.href+q_(); li.append(a); ul.append(li);});
      sec.append(ul);
    } else if(b.type==='cards'){
      const g=el('div','fq-grid');
      b.items.forEach(it=>{
        const t=el('article','fq-tile'); t.append(el('h3',null,it.h),el('p',null,it.t));
        if(it.mail){const a=el('a','btn ghost',it.l); a.href=mailHref(it.mail); t.append(a);}
        g.append(t);
      });
      sec.append(g);
    }
    root.append(sec);
  });
}
function applyView(name,focus){
  view=name;
  const isHome=name==='home';
  hero.hidden=!isHome; $('#viewWrap').hidden=isHome;
  if(!isHome)renderView(name);
  document.title=isHome?T().title:T().views[name].t+' · '+T().page+' – Tell';
  $$('#fViews a').forEach(a=>{ if(a.dataset.view===name)a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  if(focus){scrollTo({top:0,behavior:'auto'}); const t=isHome?$('#main'):$('#viewH'); if(t)t.focus({preventScroll:true});}
}
function go(name,focus){
  const h=HASH[name];
  if(('#'+h)!==location.hash && !(h===''&&location.hash===''))history.pushState(null,'',location.pathname+location.search+(h?'#'+h:''));
  applyView(name,focus);
}
function fromHash(){const k=location.hash.replace(/^#\/?/,''); return VIEWS[k]||'home';}
addEventListener('popstate',()=>applyView(fromHash(),true));
addEventListener('hashchange',()=>applyView(fromHash(),true));
document.addEventListener('click',e=>{
  const a=e.target.closest('#fViews a'); if(!a)return;
  e.preventDefault(); go(a.dataset.view,true);
});

/* ---------- Sprache ---------- */
function setLang(l){
  lang=l; run++;
  document.documentElement.lang=HTML_LANG[l];
  const md=document.querySelector('meta[name=description]'); if(md)md.content=T().desc;
  $$('[data-i]').forEach(el=>{const v=T()[el.dataset.i]; if(typeof v==='string')el.textContent=tx(v);});
  $$('[data-ia]').forEach(el=>{const [a,k]=el.dataset.ia.split(':'); el.setAttribute(a,T()[k]);});
  $$('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===l)));
  buildGreet(); buildChips(); buildPh(); buildNav(); buildFooter(); resetAnswer(); applyView(view,false);
  try{history.replaceState(null,'','?lang='+l+location.hash);}catch(e){}
}
$$('.lang button').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.l!==lang){input.value=''; form.classList.remove('has-value'); setLang(b.dataset.l);} }));

form.addEventListener('submit',e=>{
  e.preventDefault();
  const q=input.value.trim();
  if(!q){form.classList.remove('nudge'); void form.offsetWidth; form.classList.add('nudge'); input.focus(); return;}
  ask(q);
});
input.addEventListener('input',()=>form.classList.toggle('has-value',input.value.length>0));
newQ.addEventListener('click',()=>{ run++; resetAnswer(); input.value=''; form.classList.remove('has-value'); setTimeout(()=>input.focus(),60); });

view=fromHash();
setLang(lang);
})();
</script>

<script>
(function(){
  var b=document.getElementById('tmenuBtn'),m=document.getElementById('tmenu');
  if(!b||!m)return;
  function set(o){
    if(o){var h=document.querySelector('.site-header,.top');if(h){m.style.top=(h.getBoundingClientRect().bottom+8)+'px'}}
    m.hidden=!o;b.setAttribute('aria-expanded',o?'true':'false');
  }
  b.addEventListener('click',function(e){e.stopPropagation();set(m.hidden)});
  document.addEventListener('click',function(e){if(!m.hidden&&!m.contains(e.target)&&!b.contains(e.target))set(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!m.hidden){set(false);b.focus()}});
  addEventListener('resize',function(){if(!m.hidden)set(false)});
})();
</script>
