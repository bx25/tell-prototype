aber auch der Aufwand für ein Amt.","blocks":[{"type":"phases","h":"Mögliche Zusammenarbeit (Konzeptidee)","items":[{"n":"1","h":"Mitlesen und korrigieren","e":"Aufwand gering, ohne IT","t":"Ein Amt schaut die Antworten zu seinen Themen an und meldet Fehler oder Veraltetes per E-Mail. Tell passt die Antwort an und nennt die Seite des Amts als Quelle."},{"n":"2","h":"Anbinden","e":"Aufwand mittel, mit IT","t":"Tell verweist direkt auf den Online-Schalter, das Formular oder die Terminbuchung des Amts, statt nur zu erklären. Idee im Konzept, nicht umgesetzt."},{"n":"3","h":"Partner werden","e":"Aufwand hoch, Projekt und Recht","t":"Im Projektkonzept ist ein Pilot mit einem Kanton vorgesehen (12 Monate), danach 6 bis 8 Kantone (24 Monate). Das sind eigene Annahmen, keine Zusage und keine Offerte."}]},{"type":"list","h":"Lücken in offiziellen Angaben","items":["Tell hält auf der Seite «Lücken» fest, wo offizielle Angaben zu seinen sechs Themen Lücken, Unklarheiten oder Abweichungen zeigen, mit Quellen und Abrufdatum. Es sind Beobachtungen, keine Vorwürfe, und sie sollen Ämtern helfen, ihre Angaben zu verbessern. Erst ein Anfang: 8 Einträge, Stand 7. Oktober 2026, bitte prüfen."]},{"type":"list","h":"Was Tell ist, und was nicht","items":["Tell ist ein privates Konzept von Bilal Simsek, Bern, und keine Behörde.","Fakten wie Fristen, Gebühren und Adressen stammen nur aus offiziellen Quellen und werden mit Quelle angezeigt.","Tell entscheidet nichts und gibt keine Rechtsauskunft. Bei Unsicherheit verweist es an das zuständige Amt.","Tell reicht keine Anträge ein. Das geht heute nur auf den offiziellen Seiten."]},{"type":"links","h":"Mehr zum Konzept","items":[{"l":"Lücken in offiziellen Angaben (Beobachtungen)","href":"luecken.html"},{"l":"Behördensicht (Demo)","href":"behoerdensicht.html"},{"l":"Projekt: Fahrplan, Kosten, Risiken","href":"projekt.html"},{"l":"Rückmeldung an Tell senden","mail":"fb"}]}]},"mitmachen":{"t":"Mitmachen","h":"Mitmachen","lead":"Tell ist ein Einzelprojekt und lebt von Rückmeldungen. So können Sie helfen, alles per E-Mail und ohne Konto.","blocks":[{"type":"cards","items":[{"h":"Fehler oder Veraltetes melden","t":"Stimmt eine Frist, eine Gebühr oder eine Adresse nicht mehr? Schreiben Sie die Frage und die Quelle.","l":"Fehler melden","mail":"err"},{"h":"Ein Thema vorschlagen","t":"Welcher Behördengang fehlt Ihnen? Nennen Sie das Anliegen und Ihren Wohnort.","l":"Thema vorschlagen","mail":"topic"},{"h":"Rückmeldung aus einem Amt","t":"Sie arbeiten bei einer Behörde? Eine kurze Rückmeldung zu einer Antwort hilft am meisten.","l":"Rückmeldung senden","mail":"fb"},{"h":"Weitersagen","t":"Zeigen Sie Tell Menschen, die mit Ämtern zu tun haben, und sagen Sie dazu, dass es ein privates Konzept ist."}]}]}},"f_luecken":"Lücken"},"fr":{"title":"Demandez à Tell – Tell (concept privé, prototype)","desc":"Demandez à Tell : point d’entrée par chat du prototype conceptuel Tell. Six thèmes, réponses uniquement issues de sources officielles. Pas un site officiel.","page":"Demandez à Tell","greet":{"m":"Bonjour","d":"Bonjour","e":"Bonsoir","tail":", la Suisse"},"sub":"Que souhaitez-vous régler auprès de la Confédération, du canton ou de la commune ?","more":"Autres thèmes","less":"Moins","f_views":["Couverture","Actualités","Pour les autorités","Participer"],"f_pages_h":"Autres pages de Tell","credit":"Crédits photo : photo du Palais fédéral de Berne (« Bundeshaus Bern 20180827-2 ») : Suicasmo, CC BY-SA 4.0, via Wikimedia Commons (commons.wikimedia.org/wiki/File:Bundeshaus_Bern_20180827-2.jpg) ; détourée et retouchée.","mail":{"fb":"Tell : retour d’information","err":"Tell : signaler une erreur ou une information périmée","topic":"Tell : proposition de thème"},"views":{"abdeckung":{"t":"Couverture","h":"Ce que couvre Tell","lead":"Tell est un prototype conceptuel et non un service d’information à couverture complète. Aujourd’hui, le chat répond à six thèmes, chacun pour des lieux donnés en exemple. Pour tout le reste, Tell dit ouvertement qu’il n’a pas encore de réponse.","blocks":[{"type":"topics","h":"Aujourd’hui : six thèmes","ask":"Poser la question","items":[{"h":"Annoncer un déménagement","t":"Départ et arrivée, délai, coûts et déroulement via eUmzugCH.","m":"Exemple : de Berne à Winterthour"},{"h":"Passeport et carte d’identité","t":"Demande, rendez-vous, coûts et validité.","m":"Exemple : canton de Berne"},{"h":"Déclaration d’impôts, prolonger le délai","t":"Délais, prolongation et coûts.","m":"Exemple : canton de Berne, en partie Zurich et Genève"},{"h":"Demander la rente AVS","t":"Âge de référence, demande, anticipation et ajournement.","m":"Exemple : année de naissance 1962, Thoune"},{"h":"S’annoncer au chômage","t":"Inscription à l’ORP, indemnité de chômage et déroulement.","m":"Exemple : Thoune, règles fédérales"},{"h":"Changer de caisse maladie","t":"Délai de résiliation, franchise, primes 2027 et déroulement.","m":"Toute la Suisse (droit fédéral, LAMal)"}]},{"type":"list","h":"Bon à savoir","items":["Les réponses proviennent de sources officielles publiques de la Confédération, des cantons et des communes, et les citent. État : octobre 2026, sans garantie.","Les réponses sont des exemples pour certains lieux. D’autres communes et cantons peuvent différer. Seuls les services compétents font foi.","Le chat reconnaît les thèmes grâce à des mots-clés. Si rien ne correspond, il le dit.","Votre saisie reste dans le navigateur. Il n’y a ni compte ni historique de conversation."]},{"type":"list","h":"Pas encore couvert","items":["Annoncer une entreprise individuelle ou une activité indépendante : idée pour un prochain thème, pas encore réalisée.","Toutes les autres démarches ainsi que la plupart des communes et des cantons."],"note":"Pas de calendrier et aucune promesse."}]},"neuigkeiten":{"t":"Actualités","h":"Actualités","lead":"Ce qui a changé chez Tell, avec la date. Seules les modifications réellement réalisées sont indiquées.","blocks":[{"type":"news","items":[{"d":"7 octobre 2026","g":[{"h":"Nouveau thème","li":["Changer de caisse maladie : délai de résiliation, franchise, primes 2027 et déroulement, avec des sources de Priminfo (OFSP) et de Fedlex (LAMal)."]},{"h":"Nouvelle page","li":["« Demandez à Tell » avec point d’entrée par chat et les rubriques Couverture, Actualités, Pour les autorités et Participer.","« Lacunes » : nouvelle page où Tell note où les informations officielles sur ses thèmes présentent des lacunes, des ambiguïtés ou des divergences. Seulement un début : 8 observations avec sources, état au 7 octobre 2026."]}]},{"d":"5 octobre 2026","g":[{"h":"Amélioré","li":["Image d’en-tête de la page d’accueil : Palais fédéral de face et plus grand."]}]},{"d":"4 octobre 2026","g":[{"h":"En ligne","li":["Tell est mis en ligne comme prototype conceptuel privé : page d’accueil, vue citoyenne, vue des autorités et projet."]}]}]}]},"behoerden":{"t":"Pour les autorités","h":"Pour les autorités","lead":"Tell est un concept privé. Aujourd’hui, aucune autorité ne collabore avec Tell et il n’existe aucun accord avec un service. Cette page montre à quoi une collaboration pourrait ressembler, en trois niveaux : plus le niveau est élevé, plus l’utilité pour les citoyens augmente, mais aussi l’effort pour un service.","blocks":[{"type":"phases","h":"Collaboration possible (idée de concept)","items":[{"n":"1","h":"Relire et corriger","e":"Effort faible, sans informatique","t":"Un service relit les réponses sur ses thèmes et signale par e-mail les erreurs ou les informations périmées. Tell adapte la réponse et cite la page du service comme source."},{"n":"2","h":"Raccorder","e":"Effort moyen, avec informatique","t":"Tell renvoie directement au guichet en ligne, au formulaire ou à la prise de rendez-vous du service, au lieu de se limiter à expliquer. Idée du concept, non réalisée."},{"n":"3","h":"Devenir partenaire","e":"Effort élevé, projet et juridique","t":"Le concept de projet prévoit un pilote avec un canton (12 mois), puis 6 à 8 cantons (24 mois). Ce sont des hypothèses propres, ni une promesse ni une offre."}]},{"type":"list","h":"Lacunes dans les informations officielles","items":["Sur la page « Lacunes », Tell note où les informations officielles sur ses six thèmes présentent des lacunes, des ambiguïtés ou des divergences, avec sources et date de consultation. Ce sont des observations, pas des reproches, destinées à aider les services à améliorer leurs informations. Seulement un début : 8 entrées, état au 7 octobre 2026, à vérifier."]},{"type":"list","h":"Ce que Tell est, et ce qu’il n’est pas","items":["Tell est un concept privé de Bilal Simsek, Berne, et non une autorité.","Les faits tels que délais, émoluments et adresses proviennent uniquement de sources officielles et sont affichés avec leur source.","Tell ne décide de rien et ne donne pas de renseignement juridique. En cas de doute, il renvoie au service compétent.","Tell ne dépose aucune demande. Aujourd’hui, cela se fait uniquement sur les sites officiels."]},{"type":"links","h":"En savoir plus sur le concept","items":[{"l":"Lacunes dans les informations officielles (observations)","href":"luecken.html"},{"l":"Vue des autorités (démo)","href":"behoerdensicht.html"},{"l":"Projet : calendrier, coûts, risques","href":"projekt.html"},{"l":"Envoyer un retour à Tell","mail":"fb"}]}]},"mitmachen":{"t":"Participer","h":"Participer","lead":"Tell est un projet individuel et vit de vos retours. Voici comment aider, le tout par e-mail et sans compte.","blocks":[{"type":"cards","items":[{"h":"Signaler une erreur ou une information périmée","t":"Un délai, un émolument ou une adresse n’est plus correct ? Écrivez la question et la source.","l":"Signaler une erreur","mail":"err"},{"h":"Proposer un thème","t":"Quelle démarche manque ? Indiquez la demande et votre lieu de domicile.","l":"Proposer un thème","mail":"topic"},{"h":"Retour d’un service","t":"Vous travaillez dans une autorité ? Un bref retour sur une réponse aide le plus.","l":"Envoyer un retour","mail":"fb"},{"h":"En parler","t":"Montrez Tell aux personnes qui ont affaire aux autorités et précisez qu’il s’agit d’un concept privé."}]}]}},"f_luecken":"Lacunes"},"it":{"title":"Chiedi a Tell – Tell (concetto privato, prototipo)","desc":"Chiedi a Tell: accesso via chat del prototipo concettuale Tell. Sei temi, risposte solo da fonti ufficiali. Non è un sito ufficiale.","page":"Chiedi a Tell","greet":{"m":"Buongiorno","d":"Buongiorno","e":"Buonasera","tail":", Svizzera"},"sub":"Che cosa desidera sbrigare presso Confederazione, Cantone o Comune?","more":"Altri temi","less":"Meno","f_views":["Copertura","Novità","Per le autorità","Partecipare"],"f_pages_h":"Altre pagine di Tell","credit":"Crediti fotografici: foto del Palazzo federale di Berna («Bundeshaus Bern 20180827-2»): Suicasmo, CC BY-SA 4.0, via Wikimedia Commons (commons.wikimedia.org/wiki/File:Bundeshaus_Bern_20180827-2.jpg); ritagliata e modificata.","mail":{"fb":"Tell: riscontro","err":"Tell: segnalare un errore o un’informazione superata","topic":"Tell: proposta di tema"},"views":{"abdeckung":{"t":"Copertura","h":"Che cosa copre Tell","lead":"Tell è un prototipo concettuale e non un servizio di informazione a copertura totale. Oggi la chat risponde a sei temi, ciascuno per luoghi dati come esempio. Per tutto il resto Tell dice apertamente di non avere ancora una risposta.","blocks":[{"type":"topics","h":"Oggi: sei temi","ask":"Fai la domanda","items":[{"h":"Annunciare il trasloco","t":"Partenza e arrivo, termine, costi e procedura tramite eUmzugCH.","m":"Esempio: da Berna a Winterthur"},{"h":"Passaporto e carta d’identità","t":"Richiesta, appuntamento, costi e validità.","m":"Esempio: Cantone di Berna"},{"h":"Dichiarazione d’imposta, prorogare il termine","t":"Termini, proroga e costi.","m":"Esempio: Cantone di Berna, in parte Zurigo e Ginevra"},{"h":"Richiedere la rendita AVS","t":"Età di riferimento, richiesta, anticipo e differimento.","m":"Esempio: anno di nascita 1962, Thun"},{"h":"Annunciarsi come disoccupato","t":"Iscrizione all’URC, indennità di disoccupazione e procedura.","m":"Esempio: Thun, regole federali"},{"h":"Cambiare cassa malati","t":"Termine di disdetta, franchigia, premi 2027 e procedura.","m":"Tutta la Svizzera (diritto federale, LAMal)"}]},{"type":"list","h":"Da sapere","items":["Le risposte provengono da fonti ufficiali pubbliche di Confederazione, Cantoni e Comuni e le citano. Stato: ottobre 2026, senza garanzia.","Le risposte sono esempi per singoli luoghi. Altri Comuni e Cantoni possono differire. Fanno stato sempre i servizi competenti.","La chat riconosce i temi dalle parole chiave. Se nulla corrisponde, lo dice.","Quanto scrive resta nel browser. Non ci sono account né cronologia della conversazione."]},{"type":"list","h":"Non ancora coperto","items":["Annunciare un’impresa individuale o un’attività indipendente: idea per un prossimo tema, non ancora realizzata.","Tutte le altre pratiche e la maggior parte dei Comuni e dei Cantoni."],"note":"Nessun calendario e nessuna promessa."}]},"neuigkeiten":{"t":"Novità","h":"Novità","lead":"Che cosa è cambiato in Tell, con la data. Sono elencate solo le modifiche effettivamente realizzate.","blocks":[{"type":"news","items":[{"d":"7 ottobre 2026","g":[{"h":"Nuovo tema","li":["Cambiare cassa malati: termine di disdetta, franchigia, premi 2027 e procedura, con fonti di Priminfo (UFSP) e Fedlex (LAMal)."]},{"h":"Nuova pagina","li":["«Chiedi a Tell» con accesso via chat e le sezioni Copertura, Novità, Per le autorità e Partecipare.","«Lacune»: nuova pagina in cui Tell annota dove le informazioni ufficiali sui suoi temi presentano lacune, ambiguità o divergenze. Solo un inizio: 8 osservazioni con fonti, stato al 7 ottobre 2026."]}]},{"d":"5 ottobre 2026","g":[{"h":"Migliorato","li":["Immagine di testata della pagina iniziale: Palazzo federale frontale e più grande."]}]},{"d":"4 ottobre 2026","g":[{"h":"Online","li":["Tell va online come prototipo concettuale privato: pagina iniziale, vista cittadini, vista autorità e progetto."]}]}]}]},"behoerden":{"t":"Per le autorità","h":"Per le autorità","lead":"Tell è un concetto privato. Oggi nessuna autorità collabora con Tell e non esiste alcun accordo con un servizio. Questa pagina mostra come potrebbe essere una collaborazione, in tre livelli: a ogni livello cresce l’utilità per i cittadini, ma anche l’impegno per un servizio.","blocks":[{"type":"phases","h":"Possibile collaborazione (idea di concetto)","items":[{"n":"1","h":"Rileggere e correggere","e":"Impegno ridotto, senza informatica","t":"Un servizio esamina le risposte sui propri temi e segnala per e-mail errori o informazioni superate. Tell adegua la risposta e cita la pagina del servizio come fonte."},{"n":"2","h":"Collegare","e":"Impegno medio, con informatica","t":"Tell rimanda direttamente allo sportello online, al modulo o alla prenotazione dell’appuntamento del servizio, invece di limitarsi a spiegare. Idea del concetto, non realizzata."},{"n":"3","h":"Diventare partner","e":"Impegno elevato, progetto e diritto","t":"Il concetto di progetto prevede un progetto pilota con un Cantone (12 mesi), poi da 6 a 8 Cantoni (24 mesi). Sono ipotesi proprie, né una promessa né un’offerta."}]},{"type":"list","h":"Lacune nelle informazioni ufficiali","items":["Nella pagina «Lacune» Tell annota dove le informazioni ufficiali sui suoi sei temi presentano lacune, ambiguità o divergenze, con fonti e data di consultazione. Sono osservazioni, non accuse, e servono ad aiutare gli uffici a migliorare le loro informazioni. Solo un inizio: 8 voci, stato al 7 ottobre 2026, da verificare."]},{"type":"list","h":"Che cos’è Tell, e che cosa no","items":["Tell è un concetto privato di Bilal Simsek, Berna, e non un’autorità.","Fatti come termini, tasse e indirizzi provengono solo da fonti ufficiali e sono mostrati con la fonte.","Tell non decide nulla e non fornisce consulenza giuridica. In caso di dubbio rimanda al servizio competente.","Tell non inoltra richieste. Oggi ciò avviene solo sui siti ufficiali."]},{"type":"links","h":"Altro sul concetto","items":[{"l":"Lacune nelle informazioni ufficiali (osservazioni)","href":"luecken.html"},{"l":"Vista autorità (demo)","href":"behoerdensicht.html"},{"l":"Progetto: calendario, costi, rischi","href":"projekt.html"},{"l":"Invia un riscontro a Tell","mail":"fb"}]}]},"mitmachen":{"t":"Partecipare","h":"Partecipare","lead":"Tell è un progetto individuale e vive dei vostri riscontri. Ecco come aiutare, tutto per e-mail e senza account.","blocks":[{"type":"cards","items":[{"h":"Segnalare un errore o un’informazione superata","t":"Un termine, una tassa o un indirizzo non è più corretto? Scriva la domanda e la fonte.","l":"Segnalare un errore","mail":"err"},{"h":"Proporre un tema","t":"Quale pratica manca? Indichi la richiesta e il suo luogo di domicilio.","l":"Proporre un tema","mail":"topic"},{"h":"Riscontro da un servizio","t":"Lavora presso un’autorità? Un breve riscontro su una risposta aiuta moltissimo.","l":"Inviare un riscontro","mail":"fb"},{"h":"Passaparola","t":"Mostri Tell a chi ha a che fare con le autorità e precisi che si tratta di un concetto privato."}]}]}},"f_luecken":"Lacune"},"en":{"title":"Ask Tell – Tell (private concept, prototype)","desc":"Ask Tell: chat entry point of the private concept prototype Tell. Six topics, answers only from official sources. Not an official site.","page":"Ask Tell","greet":{"m":"Good morning","d":"Good afternoon","e":"Good evening","tail":", Switzerland"},"sub":"What would you like to sort out with the Confederation, your canton or your municipality?","more":"More topics","less":"Fewer","f_views":["Coverage","News","For authorities","Get involved"],"f_pages_h":"More pages of Tell","credit":"Image credit: photo of the Federal Palace in Bern («Bundeshaus Bern 20180827-2»): Suicasmo, CC BY-SA 4.0, via Wikimedia Commons (commons.wikimedia.org/wiki/File:Bundeshaus_Bern_20180827-2.jpg); cut out and edited.","mail":{"fb":"Tell: feedback","err":"Tell: report an error or outdated information","topic":"Tell: topic suggestion"},"views":{"abdeckung":{"t":"Coverage","h":"What Tell covers","lead":"Tell is a concept prototype, not a nationwide information service. Today the chat answers six topics, each for example places. For everything else, Tell says openly that it has no answer yet.","blocks":[{"type":"topics","h":"Today: six topics","ask":"Ask this","items":[{"h":"Report a move","t":"Deregistration and registration, deadline, costs and process via eUmzugCH.","m":"Example: Bern to Winterthur"},{"h":"Passport & ID","t":"Application, appointment, costs and validity.","m":"Example: canton of Bern"},{"h":"Tax return, extend the deadline","t":"Deadlines, extension and costs.","m":"Example: canton of Bern, partly Zurich and Geneva"},{"h":"Register for the AHV pension","t":"Reference age, registration, early and deferred withdrawal.","m":"Example: born 1962, Thun"},{"h":"Register as unemployed","t":"Registration with the RAV, unemployment benefit and process.","m":"Example: Thun, federal rules"},{"h":"Switch health insurer","t":"Notice deadline, deductible, 2027 premiums and process.","m":"All of Switzerland (federal law, KVG)"}]},{"type":"list","h":"Good to know","items":["Answers come from public, official sources of the Confederation, cantons and municipalities, and name them. As of October 2026, without guarantee.","The answers are examples for individual places. Other municipalities and cantons may differ. The competent authorities are always authoritative.","The chat recognises topics by keywords. If nothing fits, it says so.","What you type stays in your browser. There is no account and no conversation history."]},{"type":"list","h":"Not covered yet","items":["Registering a sole proprietorship: an idea for a next topic, not built yet.","All other official errands, and most municipalities and cantons."],"note":"No timeline and no promise."}]},"neuigkeiten":{"t":"News","h":"News","lead":"What has changed at Tell, with dates. Only changes that were actually made are listed.","blocks":[{"type":"news","items":[{"d":"7 October 2026","g":[{"h":"New topic","li":["Switch health insurer: notice deadline, deductible, 2027 premiums and process, with sources from Priminfo (FOPH) and Fedlex (KVG)."]},{"h":"New page","li":["«Ask Tell» with a chat entry point and the sections Coverage, News, For authorities and Get involved.","“Gaps”: new page where Tell records where official information on its topics shows gaps, ambiguities or discrepancies. Only a start: 8 observations with sources, as of 7 October 2026."]}]},{"d":"5 October 2026","g":[{"h":"Improved","li":["Home page header image: Federal Palace seen from the front and larger."]}]},{"d":"4 October 2026","g":[{"h":"Online","li":["Tell goes online as a private concept prototype: home page, citizen view, authority view and project."]}]}]}]},"behoerden":{"t":"For authorities","h":"For authorities","lead":"Tell is a private concept. Today no authority works with Tell, and there is no agreement with any office. This page shows what a collaboration could look like, in three stages: each stage adds benefit for citizens, but also effort for an office.","blocks":[{"type":"phases","h":"Possible collaboration (concept idea)","items":[{"n":"1","h":"Read and correct","e":"Low effort, no IT","t":"An office reviews the answers on its topics and reports errors or outdated details by e-mail. Tell adjusts the answer and names the office’s page as the source."},{"n":"2","h":"Connect","e":"Medium effort, with IT","t":"Tell links directly to the office’s online counter, form or appointment booking instead of only explaining. An idea in the concept, not built."},{"n":"3","h":"Become a partner","e":"High effort, project and legal","t":"The project concept envisages a pilot with one canton (12 months), then 6 to 8 cantons (24 months). These are own assumptions, not a commitment and not an offer."}]},{"type":"list","h":"Gaps in official information","items":["On the “Gaps” page Tell records where official information on its six topics shows gaps, ambiguities or discrepancies, with sources and access date. These are observations, not accusations, meant to help offices improve their information. Only a start: 8 entries, as of 7 October 2026, please verify."]},{"type":"list","h":"What Tell is, and what it is not","items":["Tell is a private concept by Bilal Simsek, Bern, and not an authority.","Facts such as deadlines, fees and addresses come only from official sources and are shown with their source.","Tell decides nothing and gives no legal advice. When unsure, it refers to the competent office.","Tell does not submit applications. Today that only works on the official sites."]},{"type":"links","h":"More on the concept","items":[{"l":"Gaps in official information (observations)","href":"luecken.html"},{"l":"Authority view (demo)","href":"behoerdensicht.html"},{"l":"Project: roadmap, costs, risks","href":"projekt.html"},{"l":"Send feedback to Tell","mail":"fb"}]}]},"mitmachen":{"t":"Get involved","h":"Get involved","lead":"Tell is a one-person project and lives on feedback. Here is how you can help, all by e-mail and without an account.","blocks":[{"type":"cards","items":[{"h":"Report an error or outdated information","t":"Is a deadline, fee or address no longer correct? Send the question and the source.","l":"Report an error","mail":"err"},{"h":"Suggest a topic","t":"Which official errand is missing? Name the matter and your place of residence.","l":"Suggest a topic","mail":"topic"},{"h":"Feedback from an office","t":"Do you work at an authority? A short note on an answer helps most.","l":"Send feedback","mail":"fb"},{"h":"Spread the word","t":"Show Tell to people who deal with authorities, and say that it is a private concept."}]}]}},"f_luecken":"Gaps"}};

(()=>{
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const HTML_LANG={de:'de-CH',fr:'fr-CH',it:'it-CH',en:'en'};
const qp=new URLSearchParams(location.search).get('lang');
let lang=['de','fr','it','en'].includes(qp)?qp:'de';
const T=()=>I18N[lang];
const tx=s=>lang==='fr'?s.replace(/ ([?!:;])/g,' $1'):s;
let run=0, phTimer=null, showAll=false, view='home';
const sleep=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));

const hero=$('#hero'), hdr=$('.site-header'), form=$('#askForm'), input=$('#q'), ph=$('#ph'), chipsEl=$('#chips'), card=$('#card');
const answerEl=$('#answer'), aQ=$('#aQ'), think=$('#think'), aText=$('#aText'), aSteps=$('#aSteps');
const aGlance=$('#aGlance'), aFacts=$('#aFacts'), aStand=$('#aStand');
const aWho=$('#aWho'), whoRow=$('#whoRow'), whoNote=$('#whoNote'), aSrc=$('#aSrc'), srcList=$('#srcList'), newQ=$('#newQ'), sr=$('#sr');
const ORDER=[0,1,2,5,3,4];   /* Chip-Reihenfolge: Umzug, Pass & ID, Steuer, Krankenkasse, dann AHV, Arbeitslos */
const MARKS={move:0,passport:1,tax:2,ahv:3,alv:4,kk:5};
const VIEWS={'':'home',abdeckung:'abdeckung',neuigkeiten:'neuigkeiten',behoerden:'behoerden',mitmachen:'mitmachen'};
const HASH={home:'',abdeckung:'abdeckung',neuigkeiten:'neuigkeiten',behoerden:'behoerden',mitmachen:'mitmachen'};
const q_=()=>lang==='de'?'':'?lang='+lang;

/* button ripple origin */
document.addEventListener('pointermove',e=>{
  const b=e.target.closest&&e.target.closest('.btn'); if(!b)return;
  const r=b.getBoundingClientRect();
  b.style.setProperty('--ox',((e.clientX-r.left)/r.width*100).toFixed(1)+'%');
  b.style.setProperty('--oy',((e.clientY-r.top)/r.height*100).toFixed(1)+'%');
},{passive:true});

/* ---------- Chat: Logik 1:1 aus index.html ---------- */
function resetAnswer(){
  hero.classList.remove('answering');
  answerEl.classList.remove('open');
  aQ.textContent=''; aText.textContent=''; aSteps.textContent=''; aFacts.textContent=''; aGlance.hidden=true; aStand.textContent=''; think.hidden=true;
  aWho.hidden=true; aWho.classList.remove('in'); aSrc.hidden=true; aSrc.classList.remove('in'); newQ.hidden=true; newQ.classList.remove('in'); sr.textContent='';
}


function route(q){
  const s=q.toLowerCase();
  /* match at the START of a word, so that e.g. "Hundesteuer" is not taken for "Steuer";
     (?![\p{L}]) after short acronyms makes them whole-word matches */
  const at=r=>new RegExp('(?:^|[^\\p{L}\\p{N}])(?:'+r+')','u').test(s);
  /* priority: specific life events first; a bare "anmeld(en)" or "wohnsitz" only means "move" when nothing more specific matches */
  if(at('arbeitslos|stellenverlust|jobverlust|stelle verlo|job verlo|arbeitsplatz verlo|entlassen|(?:ich|mir) wurde gek(?:ü|ue)ndigt|mir (?:ist )?gek(?:ü|ue)ndigt|(?:stelle|job|arbeitsstelle) gek(?:ü|ue)ndigt|taggeld|stempel|rav(?![\\p{L}])|alv(?![\\p{L}])|ch[ôo]mage|orp(?![\\p{L}])|urc(?![\\p{L}])|licenci|perdu (?:mon|ma|son|mes) (?:emploi|travail|poste|place|job)|sans emploi|sans travail|disoccup|senza lavoro|perso (?:il|un|il mio) (?:lavoro|posto|impiego)|licenziat|unemploy|jobless|lost (?:my|the|his|her) job|laid off|made redundant|got fired|fired(?![\\p{L}])|out of work|without a job'))return 'alv';
  if(at('ahv|avs(?![\\p{L}])|altersrente|rente|pension|fr(?:ü|ue)hpension|referenzalter|vorbezug|rentenaufschub|aufschub (?:der )?(?:ahv|rente)|ausgleichskasse|retraite|caisse de compensation|pensione|pensionamento|rendita|et[àa] pensionabile|cassa di compensazione|retire|old.age'))return 'ahv';
  if(at('pass(?![\\p{L}])|p(?:ä|ae)sse|reisepass|passfoto|passstelle|passb(?:ü|ue)ro|passeport|passaporto|passport|ausweis|identit|id(?![\\p{L}\\p{N}])|carte d.identit|carte nationale|identity|biometri'))return 'passport';
  if(!at('hund|chien|can[ei](?![\\p{L}])|dogs?(?![\\p{L}])')&&at('steuer|imp[ôo]t|impost|tax(?:es|ation)?(?![\\p{L}])|fiscal|taxme|etax|lohnausweis|fristverl|fristerstreck|frist verl|dichiarazione dei redditi'))return 'tax';
  /* health insurance: topic words + (a switching/cost word OR no move-word), so "Krankenkasse über neue Adresse informieren" still lands on "move" */
  if(at('krankenkasse|krankenversicher|krankenk(?:ä|ae)ssen|grundversicherung|franchise|pr(?:ä|ae)mie(?!nverbillig)|telmed|hausarztmodell|hmo(?![\\p{L}])|priminfo|assurance[- ]maladie|caisses?[- ]maladie|lamal|primes?(?![\\p{L}])|assurance de base|cass[ae] malati|assicurazione malattia|assicurazione di base|cassa[- ]malattia|franchigia|premi(?:o)?(?![\\p{L}])|health insur|health fund|deductible|premiums?(?![\\p{L}])|basic insurance')&&(at('wechsel|wechsl|k(?:ü|ue)ndig|billiger|g(?:ü|ue)nstig|vergleich|franchise|pr(?:ä|ae)mie|chang|r(?:é|e)sili|compar|switch|cancel|cambi|disdi|confront|sceglier|choisir|choose')||!at('umzug|umzieh|ziehe|umgezogen|ummeld|wegzug|zuzug|adress|d[ée]m[ée]nag|emm[ée]nag|trasloc|trasfer|moving|moved(?![\\p{L}])|move(?![\\p{L}])|relocat|address|indirizzo')))return 'kk';
  if(at('umzug|umzieh|ziehe|z(?:ü|ue)gel|umgezogen|ummeld|wegzug|zuzug|abmeld|adress(?:ä|ae)nd|adresse (?:ä|ae)nder|wohnsitz|einwohnerkontrolle|einwohnerdienst|eumzug|d[ée]m[ée]nag|emm[ée]nag|changement d.adresse|changer d.adresse|trasloc|trasfer|cambio (?:di )?indirizzo|cambiare indirizzo|moving|moved(?![\\p{L}])|move(?![\\p{L}])|relocat|change (?:of|my) address|new address'))return 'move';
  return null;
}

function scrollToCard(){
  const hb=hdr.getBoundingClientRect().bottom;
  const y=card.getBoundingClientRect().top+scrollY-(hb+14);
  scrollTo({top:Math.max(0,y),behavior:reduce?'auto':'smooth'});
}
function settleCard(){
  if(card.getBoundingClientRect().top<hdr.getBoundingClientRect().bottom+4) scrollToCard();
}
async function ask(q){
  const id=++run, key=route(q), A=key?T().ans[key]:T().fb;
  resetAnswer();
  hero.classList.add('answering');
  aQ.textContent=q; answerEl.classList.add('open');
  think.hidden=false; $('#thinkTxt').textContent=T().think;
  setTimeout(scrollToCard,120); setTimeout(settleCard,1250);
  await sleep(1300); if(id!==run)return;
  think.hidden=true;
  const spans=tx(A.intro).split(' ').map(w=>{const s=document.createElement('span'); s.className='sw'; s.textContent=w; aText.append(s,' '); return s;});
  for(const s of spans){ if(id!==run)return; s.classList.add('in'); await sleep(26); }
  sr.textContent=A.intro; settleCard();
  if(A.facts){
    $('#glLbl').textContent=T().glance;
    A.facts.forEach(([k,v])=>{const d=document.createElement('div'); const dt=document.createElement('dt'); const dd=document.createElement('dd'); dt.textContent=tx(k); dd.textContent=tx(v); d.append(dt,dd); aFacts.append(d);});
    aGlance.hidden=false; await sleep(120); if(id!==run)return;
    for(const d of $$('div',aFacts)){ if(id!==run)return; d.classList.add('in'); settleCard(); await sleep(110); }
    await sleep(60); if(id!==run)return;
  }
  if(A.steps){
    A.steps.forEach(t=>{const li=document.createElement('li'); li.textContent=tx(t); aSteps.append(li);});
    for(const li of $$('li',aSteps)){ if(id!==run)return; await sleep(130); li.classList.add('in'); settleCard(); }
  }
  if(A.who){
    whoRow.textContent=''; $('#whoLbl').textContent=T().who; whoNote.textContent=tx(A.note);
    [T().bund,T().kanton,T().gemeinde].forEach(n=>{const li=document.createElement('li'); li.textContent=n; whoRow.append(li);});
    aWho.hidden=false; await sleep(30); if(id!==run)return; aWho.classList.add('in');
    for(const [i,li] of $$('li',whoRow).entries()){ await sleep(160); if(id!==run)return; if(A.who[i])li.classList.add('on'); }
    await sleep(200); if(id!==run)return;
    srcList.textContent=''; $('#srcLbl').textContent=T().src;
    A.src.forEach((t,i)=>{
      const li=document.createElement('li'); const a=document.createElement('a');
      a.href=SRC_URL[key][i]; a.target='_blank'; a.rel='noopener noreferrer';
      a.innerHTML='<span></span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5L7.5 8.5M12 9.5v3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3"/></svg><span class="sr-only"></span>';
      const sp=$$('span',a); sp[0].textContent=tx(t); sp[1].textContent=' ('+T().newtab+')'; li.append(a); srcList.append(li);
    });
    aStand.textContent=tx(T().stand);
    aSrc.hidden=false; await sleep(30); if(id!==run)return; aSrc.classList.add('in'); settleCard();
  }
  await sleep(250); if(id!==run)return;
  newQ.textContent=T().newq; newQ.hidden=false; await sleep(30); newQ.classList.add('in');
}


/* ---------- Seite ---------- */
function el(tag,cls,text){const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=tx(text); return e;}
function mailHref(k){const C=window.TELL_CONTACT||''; return 'mailto:'+C+'?subject='+encodeURIComponent(T().mail[k]);}
const ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

function buildGreet(){
  const h=new Date().getHours(), g=T().greet, w=h<11?g.m:(h<17?g.d:g.e);
  $('#greet').textContent=tx(w+g.tail);
  $('#sub').textContent=tx(T().sub);
}
function buildChips(){
  chipsEl.textContent='';
  const C=T().chips, vis=showAll?6:4;
  ORDER.slice(0,vis).forEach(i=>{
    const c=C[i], b=el('button','chip',c.l); b.type='button';
    b.addEventListener('click',()=>{input.value=tx(c.q); form.classList.add('has-value'); form.requestSubmit();});
    chipsEl.append(b);
  });
  const m=el('button','chip more',showAll?T().less:'+ '+T().more); m.type='button'; m.setAttribute('aria-expanded',String(showAll));
  m.addEventListener('click',()=>{showAll=!showAll; buildChips(); const n=$$('.chip',chipsEl)[showAll?4:0]; if(n)n.focus({preventScroll:true});});
  chipsEl.append(m);
}
function buildPh(){
  clearInterval(phTimer); ph.textContent='';
  const spans=T().chips.map((c,i)=>{const s=document.createElement('span'); s.textContent=tx(c.q); if(i===0)s.className='on'; ph.append(s); return s;});
  let i=0; if(reduce)return;
  phTimer=setInterval(()=>{
    const cur=spans[i]; i=(i+1)%spans.length; const nxt=spans[i];
    cur.className='off'; nxt.className='on'; setTimeout(()=>{cur.className='';},700);
  },4300);
}
function buildNav(){
  const N=T().nav, q=q_();
  const hrefs=['buergersicht.html'+q,'behoerdensicht.html'+q,'projekt.html'+q];
  const hn=$('#hnav'); hn.textContent='';
  [['frag-tell.html'+q,T().page,true]].concat(hrefs.map((h,i)=>[h,N[i],false])).forEach(([h,t,cur])=>{const a=document.createElement('a'); a.href=h; a.textContent=t; if(cur)a.setAttribute('aria-current','page'); hn.append(a);});
  const m=$('#tmenu'); m.textContent='';
  [['index.html'+q,N[3],false],['frag-tell.html'+q,T().page,true]].concat(hrefs.map((h,i)=>[h,N[i],false])).forEach(([h,t,cur])=>{const a=document.createElement('a'); a.href=h; a.textContent=t; if(cur)a.setAttribute('aria-current','page'); m.append(a);});
  m.setAttribute('aria-label',N[5]); hn.setAttribute('aria-label',N[5]); $('#tmenuBtn').setAttribute('aria-label',N[4]);
  $('#brandLink').href='index.html'+q;
}
function buildFooter(){
  const q=q_(), C=window.TELL_CONTACT||'', N=T().nav;
  const fv=$('#fViews'); fv.textContent='';
  ['abdeckung','neuigkeiten','behoerden','mitmachen'].forEach((k,i)=>{
    const li=document.createElement('li'), a=document.createElement('a'); a.href='#'+k; a.textContent=T().f_views[i]; a.dataset.view=k; if(view===k)a.setAttribute('aria-current','page'); li.append(a); fv.append(li);
  });
  $('#fPagesH').textContent=T().f_pages_h;
  const fp=$('#fPages'); fp.textContent='';
  [['index.html'+q,N[3]],['buergersicht.html'+q,N[0]],['behoerdensicht.html'+q,N[1]],['projekt.html'+q,N[2]],['luecken.html'+q,T().f_luecken],['mailto:'+C,T().f_links[0]]].forEach(([h,t])=>{
    const li=document.createElement('li'), a=document.createElement('a'); a.href=h; a.textContent=t; li.append(a); fp.append(li);
  });
  const sd=$('#fSender'); const p=T().f_sender.split('{c}'); sd.textContent=''; sd.append(p[0]); const a=document.createElement('a'); a.href='mailto:'+C; a.textContent=C; sd.append(a); if(p[1])sd.append(p[1]);
}
function askTopic(key){
  const c=T().chips[MARKS[key]]; if(!c)return;
  go('home',true);
  input.value=tx(c.q); form.classList.add('has-value'); form.requestSubmit();
}
function renderView(name){
  const V=T().views[name], root=$('#viewIn'); root.textContent='';
  const eb=el('p','fq-eyebrow',T().page); const h=el('h1','fq-h',V.h); h.id='viewH'; h.tabIndex=-1; const lead=el('p','fq-lead',V.lead);
  root.append(eb,h,lead);
  V.blocks.forEach(b=>{
    const sec=el('section','fq-b'); if(b.h)sec.append(el('h2',null,b.h));
    if(b.type==='topics'){
      const g=el('div','fq-grid');
      b.items.forEach((it,i)=>{
        const t=el('article','fq-tile'); t.append(el('h3',null,it.h),el('p',null,it.t),el('p','fq-meta',it.m));
        const btn=el('button','btn ghost',b.ask); btn.type='button'; btn.addEventListener('click',()=>askTopic(Object.keys(MARKS)[i])); t.append(btn); g.append(t);
      });
      sec.append(g);
    } else if(b.type==='list'){
      const ul=el('ul','fq-list'); b.items.forEach(s=>ul.append(el('li',null,s))); sec.append(ul); if(b.note)sec.append(el('p','fq-note2',b.note));
    } else if(b.type==='news'){
      b.items.forEach(d=>{
        const row=el('div','fq-day'), tm=el('time',null,d.d); const body=el('div');
        d.g.forEach(gr=>{body.append(el('h3',null,gr.h)); const ul=el('ul'); gr.li.forEach(s=>ul.append(el('li',null,s))); body.append(ul);});
        row.append(tm,body); sec.append(row);
      });
    } else if(b.type==='phases'){
      const g=el('div','fq-ph');
      b.items.forEach(it=>{const a=el('article'); a.append(el('span','n',it.n),el('h3',null,it.h),el('p','e',it.e),el('p',null,it.t)); g.append(a);});
      sec.append(g);
    } else if(b.type==='links'){
      const ul=el('ul','fq-links');
      b.items.forEach(it=>{const li=document.createElement('li'), a=document.createElement('a'); const s=el('span',null,it.l); a.append(s); a.insertAdjacentHTML('beforeend',ARROW); a.href=it.mail?mailHref(it.mail):it.href+q_(); li.append(a); ul.append(li);});
      sec.append(ul);
    } else if(b.type==='cards'){
      const g=el('div','fq-grid');
      b.items.forEach(it=>{
        const t=el('article','fq-tile'); t.append(el('h3',null,it.h),el('p',null,it.t));
        if(it.mail){const a=el('a','btn ghost',it.l); a.href=mailHref(it.mail); t.append(a);}
        g.append(t);
      });
      sec.append(g);
    }
    root.append(sec);
  });
}
function applyView(name,focus){
  view=name;
  const isHome=name==='home';
  hero.hidden=!isHome; $('#viewWrap').hidden=isHome;
  if(!isHome)renderView(name);
  document.title=isHome?T().title:T().views[name].t+' · '+T().page+' – Tell';
  $$('#fViews a').forEach(a=>{ if(a.dataset.view===name)a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  if(focus){scrollTo({top:0,behavior:'auto'}); const t=isHome?$('#main'):$('#viewH'); if(t)t.focus({preventScroll:true});}
}
function go(name,focus){
  const h=HASH[name];
  if(('#'+h)!==location.hash && !(h===''&&location.hash===''))history.pushState(null,'',location.pathname+location.search+(h?'#'+h:''));
  applyView(name,focus);
}
function fromHash(){const k=location.hash.replace(/^#\/?/,''); return VIEWS[k]||'home';}
addEventListener('popstate',()=>applyView(fromHash(),true));
addEventListener('hashchange',()=>applyView(fromHash(),true));
document.addEventListener('click',e=>{
  const a=e.target.closest('#fViews a'); if(!a)return;
  e.preventDefault(); go(a.dataset.view,true);
});

/* ---------- Sprache ---------- */
function setLang(l){
  lang=l; run++;
  document.documentElement.lang=HTML_LANG[l];
  const md=document.querySelector('meta[name=description]'); if(md)md.content=T().desc;
  $$('[data-i]').forEach(el=>{const v=T()[el.dataset.i]; if(typeof v==='string')el.textContent=tx(v);});
  $$('[data-ia]').forEach(el=>{const [a,k]=el.dataset.ia.split(':'); el.setAttribute(a,T()[k]);});
  $$('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===l)));
  buildGreet(); buildChips(); buildPh(); buildNav(); buildFooter(); resetAnswer(); applyView(view,false);
  try{history.replaceState(null,'','?lang='+l+location.hash);}catch(e){}
}
$$('.lang button').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.l!==lang){input.value=''; form.classList.remove('has-value'); setLang(b.dataset.l);} }));

form.addEventListener('submit',e=>{
  e.preventDefault();
  const q=input.value.trim();
  if(!q){form.classList.remove('nudge'); void form.offsetWidth; form.classList.add('nudge'); input.focus(); return;}
  ask(q);
});
input.addEventListener('input',()=>form.classList.toggle('has-value',input.value.length>0));
newQ.addEventListener('click',()=>{ run++; resetAnswer(); input.value=''; form.classList.remove('has-value'); setTimeout(()=>input.focus(),60); });

view=fromHash();
setLang(lang);
})();
</script>
<!-- tell-shared:js:start -->
<script>
(function(){
  var b=document.getElementById('tmenuBtn'),m=document.getElementById('tmenu');
  if(!b||!m)return;
  function set(o){
    if(o){var h=document.querySelector('.site-header,.top');if(h){m.style.top=(h.getBoundingClientRect().bottom+8)+'px'}}
    m.hidden=!o;b.setAttribute('aria-expanded',o?'true':'false');
  }
  b.addEventListener('click',function(e){e.stopPropagation();set(m.hidden)});
  document.addEventListener('click',function(e){if(!m.hidden&&!m.contains(e.target)&&!b.contains(e.target))set(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!m.hidden){set(false);b.focus()}});
  addEventListener('resize',function(){if(!m.hidden)set(false)});
})();
</script>
<!-- tell-shared:js:end -->
</body>
